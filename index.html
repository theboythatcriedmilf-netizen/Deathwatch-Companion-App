stom","mods":{},"demeanour":"Custom","solo":"Custom","restrictions":[],"summary":"A homebrew or successor Chapter. Use the editor to define modifiers, restrictions, identity, and abilities without overwriting canonical records.","playstyle":"Use this when adapting Rites of Battle custom-Chapter rules or your own campaign material.","source":"Homebrew / user source","page":"","colors":["#424a50","#d7d0bf","#7b3136"],"glyph":"star"}],"specialities":[{"id":"apothecary","name":"Apothecary","role":"Battlefield medic and guardian of gene-seed","summary":"Keeps Battle-Brothers functioning, treats injury, studies biology, and safeguards the Chapter\u2019s genetic legacy.","startingSkills":["Medicae"],"abilities":[["Guardian of Purity","Protects the squad against corruption when the Apothecary has access to his specialist medical kit."],["Create Toxins","A preparation ability that uses study and biological samples to create a temporary mission-specific advantage against a studied foe."],["Enhance Healing","Improves the effectiveness of First Aid and recovery."]],"source":"Core Rulebook","page":"68"},{"id":"assault","name":"Assault Marine","role":"Highly mobile close-action specialist","summary":"Excels at rapid movement, closing distance, breaking static fights, and reaching objectives other characters may struggle to access.","startingSkills":["Pilot"],"abilities":[["Wings of Angels","Improves control and effectiveness while using jump-assisted movement."],["Wrathful Descent","A Squad Mode option built around turning rapid descent into a coordinated assault."]],"source":"Core Rulebook","page":"72"},{"id":"devastator","name":"Devastator Marine","role":"Heavy-support and fire-control specialist","summary":"Anchors the team, controls lanes and positions, and specialises in sustained battlefield support.","startingSkills":[],"abilities":[["Immovable Warrior","Rewards fighting from a prepared position and using cover effectively."],["Unrelenting Devastation","A Squad Mode option that improves the Devastator\u2019s effect against massed enemies."]],"source":"Core Rulebook","page":"76"},{"id":"librarian","name":"Librarian","role":"Battle-psyker, scholar, and psychic support","summary":"Combines Space Marine training with psychic disciplines. Tracks Psy Rating, Focus Power Tests, sustained effects, and psychic risk.","startingSkills":["Psyniscience"],"abilities":[["Battle-Psyker","Begins with Psy Rating 3 and selects three starting psychic techniques."]],"psyRating":3,"source":"Core Rulebook","page":"80"},{"id":"tactical","name":"Tactical Marine","role":"Versatile line leader and all-rounder","summary":"The broadest battlefield role. Tactical Marines are adaptable, objective-focused, and well suited to coordinating a Kill-team.","startingSkills":[],"abilities":[["Tactical Expertise","Represents broad tactical experience and strong contribution to Kill-team coordination."]],"source":"Core Rulebook","page":"84"},{"id":"techmarine","name":"Techmarine","role":"Engineer, artificer, and machine specialist","summary":"Handles technology, repairs, fortification, cybernetics, and complex machinery while serving as the Chapter\u2019s link to the Cult Mechanicus.","startingSkills":["Speak Language","Tech-Use"],"abilities":[["Improve Cover","Uses engineering expertise to strengthen a defensive position."],["Blessed by the Omnissiah","Begins with Mechanicus implants and the talents needed to use them."]],"source":"Core Rulebook","page":"88"}],"skills":[{"id":"skill-acrobatics","name":"Acrobatics","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Movement","summary":"Perform difficult feats of balance, tumbling, controlled falls, leaps, and agile movement that go beyond ordinary mobility.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-awareness","name":"Awareness","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Notice nearby movement, sounds, hazards, concealed figures, or other details that could be missed. It is the general immediate-perception Skill.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-carouse","name":"Carouse","category":"Skill","characteristic":"T","skillType":"Basic","descriptor":"","summary":"Endure intoxicants and similar ingested effects without becoming impaired. Tests usually resist the physical consequences rather than represent social drinking.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-charm","name":"Charm","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Improve another character\u2019s attitude through friendliness, persuasion, courtesy, or social appeal. The GM may oppose it when the target actively resists.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-chem-use","name":"Chem-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation","summary":"Safely identify, prepare, handle, or analyse chemicals, compounds, toxins, medicines, and related substances within the fictional setting; exact applications depend on available equipment and the GM.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-ciphers","name":"Ciphers","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand or use a particular coded language, shorthand, symbol system, or formal cipher group known to the character.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-climb","name":"Climb","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Ascend or descend difficult surfaces when success is uncertain. The GM sets difficulty from the surface, conditions, equipment, and pressure of the scene.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-command","name":"Command","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Direct, organise, rally, or impose discipline on subordinates and allied forces. It is commonly used when leadership itself determines whether others follow through.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-concealment","name":"Concealment","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"","summary":"Hide yourself or another subject from observation by using cover, terrain, darkness, camouflage, or careful positioning.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-contortionist","name":"Contortionist","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"Escape restraints, squeeze through confined spaces, or manipulate your body through unusually tight or awkward positions.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-deceive","name":"Deceive","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Mislead another character through lies, false impressions, disguise-supported claims, or deliberate misdirection.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-dodge","name":"Dodge","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"React to an incoming attack or sudden physical danger when the rules allow a Dodge reaction. Training improves reliability but does not create extra reactions by itself.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-evaluate","name":"Evaluate","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Estimate the value, quality, rarity, or likely worth of an object using knowledge and careful inspection.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-gamble","name":"Gamble","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Resolve games of chance or wagering inside the fictional setting when the outcome depends on a character\u2019s judgement, nerve, or reading of the game rather than a simple random result.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-inquiry","name":"Inquiry","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Investigation","summary":"Gather information from people over time by asking questions, following rumours, and finding useful contacts rather than interrogating a single target.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-interrogation","name":"Interrogation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Investigation","summary":"Extract information from a resistant subject through sustained questioning and psychological pressure. The game treats this as an extended social Skill rather than a quick conversation.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-intimidate","name":"Intimidate","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Interaction","summary":"Coerce or frighten another character into compliance through presence, threats, or a display of force. The relevant Characteristic can vary with the approach at the GM\u2019s discretion.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-invocation","name":"Invocation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Psychic","summary":"Prepare the mind and focus psychic discipline before attempting difficult psychic activity when the rules permit it.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-lip-reading","name":"Lip Reading","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"","summary":"Understand speech by observing a speaker\u2019s mouth when the words cannot be heard clearly.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-literacy","name":"Literacy","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Read and write languages the character knows, including difficult documents, formal records, and written communications.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-logic","name":"Logic","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Solve problems through deduction, mathematics, pattern recognition, codes, puzzles, and structured reasoning.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-lore-common","name":"Lore: Common","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall broadly available knowledge about a chosen Common Lore field. Each Lore is a separate area of expertise.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-lore-forbidden","name":"Lore: Forbidden","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall dangerous, proscribed, secret, or highly restricted knowledge in a chosen Forbidden Lore field. Possessing such knowledge can matter narratively even when a Test succeeds.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-lore-scholastic","name":"Lore: Scholastic","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall formal academic, historical, scientific, theological, or institutional knowledge in a chosen Scholastic Lore field.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-medicae","name":"Medicae","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Diagnose injury or illness and perform the game\u2019s medical actions, including First Aid and longer-term treatment when appropriate equipment and time are available.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-navigation","name":"Navigation","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Determine location and plot a route across a planetary surface or through a stellar environment. Longer routes can represent hours of planning rather than a single moment.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-performer","name":"Performer","category":"Skill","characteristic":"Fel","skillType":"Advanced","descriptor":"Group","summary":"Entertain or influence an audience through a chosen performance form such as music, singing, storytelling, or dance.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-pilot","name":"Pilot","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Operator, Group","summary":"Control jump packs, aircraft, small spacecraft, or other flying craft when unusual conditions, hazards, or contested manoeuvres require a Test.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-psyniscience","name":"Psyniscience","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"Psychic","summary":"Sense psychic activity, disturbances in the Warp, daemonic presence, or other unusual immaterial phenomena. It detects signs and disturbances rather than automatically explaining them.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-scrutiny","name":"Scrutiny","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Judge motives, behaviour, authenticity, or subtle inconsistencies in a person, object, or situation through close observation.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-search","name":"Search","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Conduct a deliberate examination of an area or object to locate hidden, concealed, or easily overlooked details. Unlike Awareness, this normally represents active searching.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-security","name":"Security","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Bypass, defeat, or analyse locks and security systems in the fictional setting when the character has suitable access and tools; the Companion keeps this at tabletop abstraction rather than real-world procedure.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-shadowing","name":"Shadowing","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Follow a person or group without being noticed, usually over time and through changing terrain or crowds.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-silent-move","name":"Silent Move","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Movement","summary":"Move quietly enough to avoid detection. Environmental noise, armour, surface material, speed, and observers can modify the Test.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-sleight-of-hand","name":"Sleight of Hand","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Perform subtle manual tricks such as palming, planting, concealing, or manipulating small objects without drawing attention.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-speak-language","name":"Speak Language","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand and communicate in a specific known language. Each language or language group is recorded separately.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-survival","name":"Survival","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate in hostile wilderness: find shelter, read natural conditions, locate basic necessities, and endure environmental exposure when the situation calls for a Test.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-swim","name":"Swim","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Move through difficult water or remain afloat when conditions make ordinary swimming uncertain or exhausting.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-tactics","name":"Tactics","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Apply formal battlefield knowledge in a chosen tactical field to interpret a situation, anticipate likely developments, or identify a useful strategic approach.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-tech-use","name":"Tech-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate, diagnose, repair, or understand advanced technology within the fictional setting when ordinary use is insufficient. Complex work may require time, tools, or multiple Tests.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-tracking","name":"Tracking","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Follow signs left by a creature, person, or vehicle and interpret a trail\u2019s direction, age, and condition when evidence is available.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-trade","name":"Trade","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Crafting, Group","summary":"Perform a chosen professional craft or technical vocation. Each Trade is its own trained field and may cover creating, repairing, or evaluating work in that profession.","source":"Core Rulebook","page":"92\u2013107"},{"id":"skill-wrangling","name":"Wrangling","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Handle, calm, direct, or manage animals and similar creatures in the fictional setting when they are difficult, frightened, or resistant.","source":"Core Rulebook","page":"92\u2013107"}],"talents":[{"id":"tal-0","name":"Ambidextrous","category":"Talent","summary":"The Battle-Brother is equally trained with either hand, removing the normal off-hand limitation in situations where the rules care about handedness.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-1","name":"Astartes Weapons Training","category":"Talent","summary":"A baseline Space Marine combat-training Talent. Detailed weapon-use guidance is not reproduced in this app.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-2","name":"Bulging Biceps","category":"Talent","summary":"Represents superhuman musculature and exceptional physical power; it interacts with some equipment and heavy-load rules.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-3","name":"Heightened Senses (Hearing)","category":"Talent","summary":"Grants the game\u2019s heightened-sense benefit when hearing is relevant.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-4","name":"Heightened Senses (Sight)","category":"Talent","summary":"Grants the game\u2019s heightened-sense benefit when vision is relevant.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-5","name":"Killing Strike","category":"Talent","summary":"A combat Talent tied to the exceptional lethality of Astartes training; consult the owned source for its attack-specific procedure.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-6","name":"Nerves of Steel","category":"Talent","summary":"Improves resistance to Pinning and allows recovery from suppression more reliably.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-7","name":"Quick Draw","category":"Talent","summary":"Lets the character ready carried equipment more quickly when the action economy matters.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-8","name":"Resistance (Psychic Powers)","category":"Talent","summary":"Provides a bonus on Tests made to resist hostile psychic effects.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-9","name":"True Grit","category":"Talent","summary":"Reduces the severity of Critical Damage by using the character\u2019s Toughness Bonus more effectively.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-10","name":"Unarmed Master","category":"Talent","summary":"Represents extensive Astartes training when fighting without carried equipment.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-11","name":"Deathwatch Training","category":"Talent","summary":"Represents specialist hypno-conditioning and preparation for fighting xenos threats.","source":"Core Rulebook","page":"108\u2013129"},{"id":"tal-fearless","name":"Fearless","category":"Talent","summary":"Immune to Fear and Pinning, but backing away from a fight can require a Willpower Test.","source":"Core Rulebook","page":"118"},{"id":"tal-sprint","name":"Sprint","category":"Talent","summary":"Improves maximum movement when the character commits to running.","source":"Core Rulebook","page":"126"},{"id":"tal-hard-target","name":"Hard Target","category":"Talent","summary":"Moving rapidly makes the character harder to hit with ranged attacks in the tabletop rules.","source":"Core Rulebook","page":"120"},{"id":"tal-hardy","name":"Hardy","category":"Talent","summary":"Improves natural recovery and resistance to lingering injury.","source":"Core Rulebook","page":"120"},{"id":"tal-lightning-reflexes","name":"Lightning Reflexes","category":"Talent","summary":"Improves Initiative by allowing the character to use a stronger Agility contribution.","source":"Core Rulebook","page":"122"},{"id":"tal-light-sleeper","name":"Light Sleeper","category":"Talent","summary":"The character remains unusually alert while resting and can react more readily to danger.","source":"Core Rulebook","page":"122"},{"id":"tal-master-chirurgeon","name":"Master Chirurgeon","category":"Talent","summary":"Represents exceptional medical expertise and improves difficult Medicae work.","source":"Core Rulebook","page":"123"},{"id":"tal-paranoia","name":"Paranoia","category":"Talent","summary":"The character is habitually alert for danger, improving readiness at the cost of a suspicious outlook.","source":"Core Rulebook","page":"124"},{"id":"tal-polyglot","name":"Polyglot","category":"Talent","summary":"Makes unfamiliar languages easier to interpret and communicate across.","source":"Core Rulebook","page":"124"},{"id":"tal-rapid-reaction","name":"Rapid Reaction","category":"Talent","summary":"Gives the character a chance to act even when surprised.","source":"Core Rulebook","page":"125"},{"id":"tal-talented","name":"Talented","category":"Talent","summary":"Grants a +10 bonus to one selected Skill, representing exceptional aptitude.","source":"Core Rulebook","page":"127"},{"id":"tal-total-recall","name":"Total Recall","category":"Talent","summary":"Allows extremely precise memory of details the character has previously encountered.","source":"Core Rulebook","page":"128"},{"id":"tal-unshakeable-faith","name":"Unshakeable Faith","category":"Talent","summary":"Improves recovery from failed Fear Tests by allowing a reroll.","source":"Core Rulebook","page":"128"},{"id":"tal-exemplar","name":"Exemplar of Honour","category":"Talent","summary":"May spend a Fate Point as a Free Action to restore Cohesion equal to Fellowship Bonus, once per Round.","source":"Core Rulebook","page":"118"},{"id":"tal-wisdom","name":"Wisdom of the Ancients","category":"Talent","summary":"Represents the ability to draw on long service and accumulated lore in ways that support the Kill-team.","source":"Core Rulebook","page":"129"}],"traits":[{"id":"trait-us","name":"Unnatural Strength (x2)","category":"Trait","summary":"Doubles the character\u2019s Strength Bonus. This is already part of the normal Astartes baseline and should not be added again by individual implants.","effects":{"bonusMultiplier":{"S":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-ut","name":"Unnatural Toughness (x2)","category":"Trait","summary":"Doubles the character\u2019s Toughness Bonus. This is already part of the normal Astartes baseline and should not be double-counted from implants.","effects":{"bonusMultiplier":{"T":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-dark","name":"Dark Sight","category":"Trait","summary":"Allows vision in darkness without the normal penalty, subject to the exact limits of the trait.","source":"Core Rulebook","page":"132"},{"id":"trait-autostab","name":"Auto-stabilised","category":"Trait","summary":"A creature or system with this Trait counts as braced and gains action-economy benefits for certain heavy-equipment rules.","source":"Core Rulebook","page":"130"},{"id":"trait-armourplating","name":"Armour Plating","category":"Trait","summary":"Adds +2 Armour Points to all locations for a creature with natural or integrated plating.","source":"Core Rulebook","page":"130"},{"id":"trait-brutal","name":"Brutal Charge","category":"Trait","summary":"Adds extra damage when the creature charges during the same round.","source":"Core Rulebook","page":"131"},{"id":"trait-fear","name":"Fear (X)","category":"Trait","summary":"For non-Astartes and appropriate NPCs, Fear rating sets the difficulty of Fear Tests. For Battle-Brothers it can instead threaten Cohesion.","source":"Core Rulebook","page":"132"},{"id":"trait-size","name":"Size","category":"Trait","summary":"Changes movement, concealment, and how easy the creature is to hit. Power-armoured Astartes are Hulking but Black Carapace removes the usual enemy hit bonus.","source":"Core Rulebook","page":"134"},{"id":"trait-touched","name":"Touched by the Fates (X)","category":"Trait","summary":"Gives important NPCs a limited pool of Fate-like resources.","source":"Core Rulebook","page":"135"},{"id":"trait-unnatural-senses","name":"Unnatural Senses","category":"Trait","summary":"Allows perception beyond normal senses out to a listed range.","source":"Core Rulebook","page":"136"},{"id":"trait-unnatural-speed","name":"Unnatural Speed","category":"Trait","summary":"Substantially increases movement for creatures whose speed exceeds normal limits.","source":"Core Rulebook","page":"136"}],"implants":[{"id":"implant-0","name":"Secondary Heart","category":"Implant","summary":"Contributes to the Astartes Unnatural Strength and Unnatural Toughness baseline; it does not add a second independent modifier.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-1","name":"Ossmodula","category":"Implant","summary":"One of the implants responsible for the Unnatural Toughness (x2) Trait already present on the character.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-2","name":"Biscopea","category":"Implant","summary":"One of the implants responsible for the Unnatural Strength (x2) Trait already present on the character.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-3","name":"Haemastamen","category":"Implant","summary":"Supports the superhuman Strength and Toughness baseline; its benefit is already represented by starting Traits.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-4","name":"Larraman's Organ","category":"Implant","summary":"The Battle-Brother normally ignores Blood Loss and has True Grit; unusual effects can bypass this protection.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-5","name":"Catalepsean Node","category":"Implant","summary":"Removes normal Perception-based penalties for remaining awake for extended periods.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-6","name":"Preomnor","category":"Implant","summary":"Improves resistance to ingested poisons and unusual food-borne hazards.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-7","name":"Omophagea","category":"Implant","summary":"Can provide fragmentary information or temporary familiarity after consuming a biological sample, subject to GM judgement.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-8","name":"Multi-lung","category":"Implant","summary":"Improves survival in hostile atmospheres and allows rerolls against drowning or asphyxiation-type hazards.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-9","name":"Occulobe","category":"Implant","summary":"Provides the Astartes heightened visual capability represented by Heightened Senses (Sight).","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-10","name":"Lyman's Ear","category":"Implant","summary":"Provides enhanced hearing and balance, represented in part by Heightened Senses (Hearing).","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-11","name":"Sus-an Membrane","category":"Implant","summary":"Allows voluntary suspended animation after appropriate preparation or trauma conditions.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-12","name":"Melanochrome","category":"Implant","summary":"Allows the body to adapt pigmentation in response to harmful radiation and solar exposure.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-13","name":"Oolitic Kidney","category":"Implant","summary":"Improves resistance to poisons and toxins and works with the implanted biological filtration systems.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-14","name":"Neuroglottis","category":"Implant","summary":"Provides extraordinary chemical and biological sensory analysis and can assist identification/tracking in the fiction.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-15","name":"Mucranoid","category":"Implant","summary":"Improves survival in extreme heat and cold after appropriate biological activation.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-16","name":"Betcher's Gland","category":"Implant","summary":"Provides a fictional implanted biological capability; detailed offensive use is not reproduced in this app.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-17","name":"Progenoids","category":"Implant","summary":"The Chapter\u2019s gene-seed legacy. An Apothecary can recover progenoid material under the game\u2019s Medicae rules.","source":"Core Rulebook","page":"36\u201337"},{"id":"implant-18","name":"Black Carapace","category":"Implant","summary":"Interfaces the Battle-Brother directly with power armour and removes the normal enemy hit bonus that would otherwise result from his Hulking size.","source":"Core Rulebook","page":"36\u201337"}],"armours":[{"id":"power-armour","name":"Mark VII \u201cAquila\u201d Power Armour","category":"Armour","ap":{"Head":8,"Body":10,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"summary":"Standard Astartes power armour: sealed protection, strength assistance, auto-senses, life support, vox, bio-monitoring, and many integrated systems.","effects":[["Characteristic","Strength +20 while worn"],["Movement","Treat Agility Bonus as +1 higher for movement"],["Auto-senses","Sensory assistance and protected sight/hearing"],["Bio-monitor","+10 to resist Toxic-style poison effects; tracks pain-suppressor doses"],["Size","Counts as Hulking, but Black Carapace removes the normal enemy hit bonus"],["Fine manipulation","Delicate manual tasks can suffer -10 unless equipment is Astartes-scaled"]],"source":"Core Rulebook","page":"160\u2013163"},{"id":"artificer-armour","name":"Astartes Artificer Armour","category":"Armour","ap":{},"summary":"Rare master-crafted power armour awarded to exceptional heroes. It incorporates the standard Astartes systems and a stronger machine spirit.","effects":[["Craftsmanship","Always Master-Crafted"],["History","Roll twice for Power Armour History"],["Interface","Advanced helmet includes an MIU"]],"source":"Core Rulebook","page":"163"},{"id":"scout-armour","name":"Astartes Scout Armour","category":"Armour","ap":{},"summary":"Lighter carapace-based protection designed for stealth, reconnaissance, and skirmishing.","effects":[["Concealment","+10 to Concealment Tests"],["Stealth","Does not impose the normal AP-based Concealment/Silent Move penalty"]],"source":"Core Rulebook","page":"163"},{"id":"terminator-armour","name":"Astartes Terminator Armour","category":"Armour","ap":{},"summary":"Extremely rare Tactical Dreadnought armour reserved for veteran deployment on the most dangerous missions.","effects":[["Characteristic","Strength +30 instead of normal power-armour +20"],["Trait","Grants Auto-stabilised"],["Protection","Built-in field-like protection rated 35 with no overload"],["Movement","Cannot Run; Agility -20; cannot Dodge"],["Support Range","Multiple suits can improve effective Rank for Support Range"]],"source":"Core Rulebook","page":"164"}],"cybernetics":[{"id":"cyb-limb","name":"Bionic Limb","category":"Cybernetic","summary":"Replaces a lost limb. Higher-quality versions can provide improved physical performance in appropriate tests.","source":"Core Rulebook","page":"177"},{"id":"cyb-locomotion","name":"Bionic Locomotion","category":"Cybernetic","summary":"Integrated locomotion systems restore movement; exceptional versions grant Sprint and +20 on jumping/leaping Tests.","source":"Core Rulebook","page":"178"},{"id":"cyb-resp","name":"Bionic Respiratory System","category":"Cybernetic","summary":"Common versions grant +20 to Toughness Tests against airborne toxins and gas; exceptional versions can function as full life support.","source":"Core Rulebook","page":"178"},{"id":"cyb-senses","name":"Cybernetic Senses","category":"Cybernetic","summary":"Replaces damaged senses. Exceptional versions grant the relevant Heightened Senses Talent and +20 to resist attacks against that sense.","source":"Core Rulebook","page":"178"},{"id":"cyb-miu","name":"Mind Impulse Unit (MIU)","category":"Cybernetic","summary":"Allows direct interface with compatible technology. Common systems grant +10 to relevant Tech-Use, Pilot, or Drive Tests while linked.","source":"Core Rulebook","page":"178"},{"id":"cyb-augur","name":"Augur Array","category":"Cybernetic","summary":"Integrated scanning equipment used for sensor and detection tasks within its game-defined capabilities.","source":"Core Rulebook","page":"177"},{"id":"cyb-mechadendrite","name":"Mechadendrite","category":"Cybernetic","summary":"A Techmarine-style mechanical appendage. Different patterns perform technical, utility, or medical functions.","source":"Core Rulebook","page":"177"}],"psychic":[{"id":"psy-0","name":"Compel","category":"Psychic Power","discipline":"Telepathy","summary":"Influence a target toward a simple course of action when the Focus Power Test succeeds.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-1","name":"Dominate","category":"Psychic Power","discipline":"Telepathy","summary":"A stronger telepathic control effect that can override a target for a limited period.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-2","name":"Inspire","category":"Psychic Power","discipline":"Telepathy","summary":"Bolsters nearby allies against fear and pinning through psychic encouragement.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-3","name":"Mind Scan","category":"Psychic Power","discipline":"Telepathy","summary":"Searches a target mind for information, with depth depending on success and resistance.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-4","name":"Short-Range Telepathy","category":"Psychic Power","discipline":"Telepathy","summary":"Allows direct mind-to-mind communication over a limited distance.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-5","name":"Reading","category":"Psychic Power","discipline":"Divination","summary":"Reads a creature\u2019s aura to gain insight into its nature and condition.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-6","name":"Possibility Shield","category":"Psychic Power","discipline":"Divination","summary":"Uses foresight to improve defensive anticipation for a limited period.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-7","name":"Psychometry","category":"Psychic Power","discipline":"Divination","summary":"Draws impressions from an object\u2019s history and significant prior associations.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-8","name":"Force Dome","category":"Psychic Power","discipline":"Codex","summary":"Creates a sustained protective psychic field around the Librarian and nearby allies.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-9","name":"The Gate of Infinity","category":"Psychic Power","discipline":"Codex","summary":"A powerful displacement effect that relocates the Librarian and nearby companions.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-10","name":"Iron Arm","category":"Psychic Power","discipline":"Codex","summary":"Temporarily reinforces the Librarian\u2019s physical resilience and strength.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-11","name":"Vortex of Doom","category":"Psychic Power","discipline":"Codex","summary":"A dangerous high-output psychic attack with serious manifestation risk; tracked here only as tabletop game information.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-12","name":"Smite","category":"Psychic Power","discipline":"Codex","summary":"A direct psychic attack resolved using the psychic-power rules.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-13","name":"Veil of Time","category":"Psychic Power","discipline":"Codex","summary":"Uses precognition to improve reaction and timing.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-14","name":"Might of Heroes","category":"Psychic Power","discipline":"Blood Angels","summary":"A Chapter-themed power that temporarily enhances a Battle-Brother\u2019s physical capability.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-15","name":"Shackle Soul","category":"Psychic Power","discipline":"Blood Angels","summary":"A Chapter-themed psychic restraint affecting a target\u2019s spirit and resolve.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-16","name":"Wings of Sanguinius","category":"Psychic Power","discipline":"Blood Angels","summary":"Provides psychic flight or extraordinary aerial movement for a limited period.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-17","name":"Mind Worm","category":"Psychic Power","discipline":"Dark Angels","summary":"A telepathic assault that undermines a target\u2019s mental resistance.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-18","name":"True Strike","category":"Psychic Power","discipline":"Dark Angels","summary":"Uses psychic foresight to improve the accuracy of an immediate action in game terms.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-19","name":"Mask of Shadows","category":"Psychic Power","discipline":"Dark Angels","summary":"Wraps the Librarian in a psychic concealment effect.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-20","name":"Weaken Resolve","category":"Psychic Power","discipline":"Dark Angels","summary":"Erodes the target\u2019s mental determination and resistance.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-21","name":"Tempest's Wrath","category":"Psychic Power","discipline":"Space Wolves","summary":"Calls on a storm-themed psychic effect that hinders enemies and the environment.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-22","name":"Thunderclap","category":"Psychic Power","discipline":"Space Wolves","summary":"Produces a disruptive psychic shockwave.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-23","name":"Hammer of the Emperor","category":"Psychic Power","discipline":"Storm Wardens","summary":"Channels psychic force into a short-lived enhancement themed around decisive impact.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-24","name":"Mark of Scorn","category":"Psychic Power","discipline":"Storm Wardens","summary":"Places a psychic mark on a chosen foe to aid the Kill-team against it.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-25","name":"Thunder's Shell","category":"Psychic Power","discipline":"Storm Wardens","summary":"Creates a protective psychic shell themed around storm and force.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-26","name":"Paragon","category":"Psychic Power","discipline":"Ultramarines","summary":"Enhances a Battle-Brother as an exemplar of disciplined Astartes capability.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-27","name":"War Cry","category":"Psychic Power","discipline":"Ultramarines","summary":"Psychically reinforces allied courage and battlefield resolve.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-28","name":"Glory of the Emperor","category":"Psychic Power","discipline":"Ultramarines","summary":"A group-support power that invokes discipline and loyalty.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-29","name":"Word of the Emperor","category":"Psychic Power","discipline":"Ultramarines","summary":"A commanding psychic effect that compels attention and tests enemy resolve.","source":"Core Rulebook","page":"189\u2013200"},{"id":"psy-30","name":"Corax's Ingenuity","category":"Psychic Power","discipline":"Raven Guard","summary":"A Raven Guard support power themed around timing, deception, and surprise.","source":"First Founding \u2014 user supplied reference","page":"17\u201319"},{"id":"psy-31","name":"Curse of the Raven","category":"Psychic Power","discipline":"Raven Guard","summary":"A sustained curse that exposes a chosen opponent\u2019s weaknesses to the Kill-team.","source":"First Founding \u2014 user supplied reference","page":"17\u201319"},{"id":"psy-32","name":"The Unkindness of Deliverance","category":"Psychic Power","discipline":"Raven Guard","summary":"A Raven Guard manifestation used to harry and distract enemies in the tabletop rules.","source":"First Founding \u2014 user supplied reference","page":"17\u201319"}],"solo":[{"id":"solo-righteous","name":"Righteous Zeal","category":"Solo Mode","chapter":"Black Templars","rank":1,"summary":"Once per combat, activate as a Free Action for a number of rounds equal to Rank. It is especially effective against daemonic or psychic threats and improves at Ranks 3, 5, and 7.","activation":"Free Action; once per combat","duration":"Rounds equal to Rank","source":"Core Rulebook","page":"217"},{"id":"solo-blood","name":"Blood Frenzy","category":"Solo Mode","chapter":"Blood Angels","rank":1,"summary":"Once per combat, enter a short-lived frenzy that improves close-combat damage reliability and the chance of Righteous Fury. Higher Ranks improve penetration and the trigger range.","activation":"Once per combat","duration":"ceil(Rank / 2) rounds","source":"Core Rulebook","page":"217"},{"id":"solo-stoic","name":"Stoic Defence","category":"Solo Mode","chapter":"Dark Angels","rank":1,"summary":"Once per combat, establish a defended position and gain temporary Wounds at the cost of mobility. Higher Ranks increase the temporary Wounds and later allow limited movement.","activation":"Once per combat","duration":"Until the position is abandoned or temporary Wounds are lost","source":"Core Rulebook","page":"217"},{"id":"solo-wolf","name":"Wolf Senses","category":"Solo Mode","chapter":"Space Wolves","rank":1,"summary":"While in Solo Mode and without a sealed helmet interfering, failed Perception-based Tests may be rerolled and the Battle-Brother counts as having Dark Sight. Improves with Rank.","activation":"Passive in Solo Mode","duration":"While conditions are met","source":"Core Rulebook","page":"218"},{"id":"solo-thunder","name":"Thunder's Call","category":"Solo Mode","chapter":"Storm Wardens","rank":1,"summary":"A Storm Warden Solo Mode ability focused on personal challenge, force of will, and decisive confrontation. Rank improvements strengthen its effect.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-favoured","name":"Favoured Son","category":"Solo Mode","chapter":"Ultramarines","rank":1,"summary":"An Ultramarines Solo Mode ability reflecting broad competence and exemplary leadership. Its benefits scale with Rank.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-raven","name":"Master of the Shadows","category":"Solo Mode","chapter":"Raven Guard","rank":1,"summary":"A stealth-focused Solo Mode ability that improves covert movement and surprise performance as Rank rises.","activation":"Passive in Solo Mode","duration":"While in Solo Mode","source":"First Founding \u2014 user supplied reference","page":"17"}],"squad":[{"id":"sq-fire-effect","name":"Fire for Effect","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":2,"sustained":true,"summary":"Lets the Kill-team use Reactions for immediate ranged Standard Attacks while the ability is sustained. Higher Rank broadens the available attack options.","source":"Core Rulebook","page":"221"},{"id":"sq-fire-support","name":"Fire Support","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Reduces the normal penalty associated with Suppressing Fire and Overwatch for the supported squad. At Rank 3 it becomes quicker to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-furious","name":"Furious Charge","category":"Squad Mode","subtype":"Attack Pattern","action":"Free Action","cost":3,"sustained":false,"summary":"Allows supported Battle-Brothers to immediately close and attack in a coordinated charge, with improved damage reliability. Rank 5 expands the attack option.","source":"Core Rulebook","page":"221"},{"id":"sq-advance","name":"Squad Advance","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Lets the Kill-team use Reactions to make Tactical Advances while the ability remains active. At Rank 3 it becomes a Free Action to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-spacing","name":"Tactical Spacing","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":1,"sustained":true,"summary":"Allows supported Battle-Brothers to share Reactions. At Rank 5 the group also gains an additional Reaction while sustained.","source":"Core Rulebook","page":"223"},{"id":"sq-regroup","name":"Regroup","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":2,"sustained":false,"summary":"A Codex defensive action used to restore order and team effectiveness when the squad is under pressure.","source":"Core Rulebook","page":"223"},{"id":"sq-digin","name":"Dig In","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Improves the effectiveness of prepared defensive positions while the squad remains in place.","source":"Core Rulebook","page":"223"},{"id":"sq-strongpoint","name":"Strongpoint","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Establishes a nominated centre and lets supported Battle-Brothers concentrate on called targets while the centre stays stationary.","source":"Core Rulebook","page":"223"},{"id":"sq-armour-faith","name":"Armour of Faith","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Black Templars","action":"Free Action","cost":2,"sustained":true,"summary":"Improves resistance to psychic effects and resilience against daemonic/psychic harm for supported Battle-Brothers; improves at Rank 5.","source":"Core Rulebook","page":"223"},{"id":"sq-feel-no-pain","name":"Feel No Pain","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Blood Angels","action":"Free Action","cost":3,"sustained":false,"summary":"For a brief period, halves post-protection Damage for the supported group but normally restricts defensive Reactions. Rank 5 removes that restriction.","source":"Core Rulebook","page":"223"},{"id":"sq-immovable","name":"Immovable Defence","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Dark Angels","action":"Full Action","cost":2,"sustained":true,"summary":"While stationary, supported Battle-Brothers gain bonuses to Ballistic Skill Tests, Dodge, and Armour Points. The test bonuses improve at Rank 4.","source":"Core Rulebook","page":"225"},{"id":"sq-pack","name":"Pack Tactics","category":"Squad Mode","subtype":"Chapter Attack Pattern","chapter":"Space Wolves","action":"Free Action","cost":2,"sustained":false,"summary":"One Space Marine can spend an unused Reaction to distract a target so another Battle-Brother\u2019s attacks are harder to avoid; Rank 3 improves melee attack rolls.","source":"Core Rulebook","page":"225"},{"id":"sq-shield-sword","name":"Shield and Sword","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Storm Wardens","action":"Free Action","cost":2,"sustained":true,"summary":"Lets supported Battle-Brothers protect nearby allies with Parry reactions and answer a successful melee strike with an immediate response. Rank 5 improves Parry.","source":"Core Rulebook","page":"225"},{"id":"sq-rally","name":"Rally Cry","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Ultramarines","action":"Free Action","cost":0,"sustained":false,"summary":"Restores Cohesion equal to Fellowship Bonus. It may be used once per game session and does not improve with Rank.","source":"Core Rulebook","page":"225"},{"id":"sq-raven-exploit","name":"Exploit Weakness","category":"Squad Mode","subtype":"Raven Guard Attack Pattern","chapter":"Raven Guard","action":"See supplement","cost":0,"sustained":false,"summary":"A Raven Guard coordinated pattern built around identifying and exploiting a single vulnerable target.","source":"First Founding \u2014 user supplied reference","page":"18"},{"id":"sq-raven-evasive","name":"Evasive Manoeuvres","category":"Squad Mode","subtype":"Raven Guard Defensive Stance","chapter":"Raven Guard","action":"See supplement","cost":0,"sustained":true,"summary":"A Raven Guard stance focused on mobility, avoiding suppression, and resisting pinning; its effects improve with Rank.","source":"First Founding \u2014 user supplied reference","page":"18"}],"oaths":[{"id":"oath-astartes","name":"Oath of the Astartes","category":"Oath","prereq":"Tactical, Assault, or Devastator Marine","summary":"Adds +2 Cohesion for the Mission and grants access to its associated Codex Squad Mode abilities.","source":"Core Rulebook","page":"228"},{"id":"oath-emperor","name":"Oath to the Emperor","category":"Oath","prereq":"Chaplain or appropriate GM-approved leader","summary":"A Mission oath centred on loyalty to the Emperor and resistance to spiritual threats. Use the leader prerequisite from the owned source.","source":"Core Rulebook","page":"229"},{"id":"oath-glory","name":"Oath of Glory","category":"Oath","prereq":"Tactical or Assault Marine","summary":"Rewards personal involvement in completed Primary and Secondary Objectives with additional Renown.","source":"Core Rulebook","page":"229"},{"id":"oath-knowledge","name":"Oath of Knowledge","category":"Oath","prereq":"Librarian or Apothecary","summary":"Prepares the Kill-team through study. Librarians can instead use it to gain extra protection against undesirable Psychic Phenomena results.","source":"Core Rulebook","page":"229"},{"id":"oath-loyalty","name":"Oath of Loyalty","category":"Oath","prereq":"Tactical Marine or Apothecary","summary":"Strengthens squad camaraderie and grants a bonus on Cohesion-related checks during the Mission.","source":"Core Rulebook","page":"229"}],"rules":[{"id":"rule-test","name":"Characteristic Test","category":"Core Rule","summary":"Roll d100. A result equal to or below the modified target succeeds. Difficulty modifies the target from +60 to -60.","source":"Core Rulebook","page":"203"},{"id":"rule-skilltest","name":"Skill Test","category":"Core Rule","summary":"Use the Skill\u2019s linked Characteristic, training level, and situational modifier. An untrained Basic Skill uses half the linked Characteristic before difficulty is applied; untrained Advanced Skills generally cannot be attempted.","source":"Core Rulebook","page":"202"},{"id":"rule-degrees","name":"Degrees of Success and Failure","category":"Core Rule","summary":"The margin between the roll and target determines how strongly a Test succeeds or fails. The app calculates this automatically in its roller.","source":"Core Rulebook","page":"203"},{"id":"rule-fate","name":"Fate Points","category":"Resource","summary":"Track total and current Fate separately. Fate can be spent for powerful short-term benefits and can sometimes be permanently burned to survive otherwise final consequences.","source":"Core Rulebook","page":"204"},{"id":"rule-wounds","name":"Wounds","category":"Resource","summary":"Wounds absorb ordinary Damage. Once Wounds are gone, further Damage becomes Critical Damage and is resolved by location/type.","source":"Core Rulebook","page":"250"},{"id":"rule-fatigue","name":"Fatigue","category":"Resource","summary":"Fatigue represents exhaustion and accumulated strain. It applies penalties once it reaches thresholds based on Toughness Bonus.","source":"Core Rulebook","page":"251"},{"id":"rule-insanity","name":"Insanity","category":"Resource","summary":"Long-term psychological trauma. Battle-Brothers begin at 0; accumulating Insanity can trigger Battle Traumas and the Primarch\u2019s Curse.","source":"Core Rulebook","page":"278"},{"id":"rule-corruption","name":"Corruption","category":"Resource","summary":"Tracks spiritual and warp taint. Battle-Brothers begin at 0; reaching the Purity Threshold removes a character from normal play.","source":"Core Rulebook","page":"282"},{"id":"rule-cohesion","name":"Cohesion","category":"Kill-team","summary":"A shared Mission resource representing squad unity. It is calculated from the current squad leader and can be spent or damaged during play.","source":"Core Rulebook","page":"211"},{"id":"rule-solo","name":"Solo Mode","category":"Kill-team","summary":"The default mode. A Battle-Brother can freely use Solo Mode abilities but cannot benefit from Squad Mode abilities used by brothers.","source":"Core Rulebook","page":"213"},{"id":"rule-squad","name":"Squad Mode","category":"Kill-team","summary":"A deliberate team state. To enter normally, the Battle-Brother needs at least one brother in Support Range and the Kill-team must have Cohesion remaining.","source":"Core Rulebook","page":"213\u2013214"},{"id":"rule-support","name":"Support Range","category":"Kill-team","summary":"Determines which Battle-Brothers are close enough to share Squad Mode benefits. The range grows with Rank and can depend on visual or vox contact.","source":"Core Rulebook","page":"213\u2013214"},{"id":"rule-renown","name":"Renown","category":"Campaign","summary":"Measures standing within the Deathwatch and influences what support or rare resources a Battle-Brother may be trusted with.","source":"Core Rulebook","page":"140"},{"id":"rule-requisition","name":"Requisition","category":"Mission","summary":"A Mission preparation resource set by the GM. The Kill-team uses it to determine what temporary support and gear can be assigned for the operation.","source":"Core Rulebook","page":"139\u2013140"},{"id":"rule-rank","name":"Rank","category":"Advancement","summary":"Rank is determined by total XP spent. Higher Rank opens additional Speciality advances and improves many Solo/Squad abilities.","source":"Core Rulebook","page":"57\u201358"},{"id":"rule-charadvance","name":"Characteristic Advance","category":"Advancement","summary":"Each purchased Characteristic Advance adds +5. The progression must be bought in order: Simple, Intermediate, Trained, Expert.","source":"Core Rulebook","page":"57"},{"id":"rule-elite","name":"Elite Advance","category":"Advancement","summary":"A GM-approved advance outside the normal scheme. The GM determines availability, prerequisites, and XP cost.","source":"Core Rulebook","page":"59"},{"id":"rule-fear","name":"Fear","category":"GM Rule","summary":"Fear rating sets the difficulty of Fear Tests for ordinary characters. Battle-Brothers are unusually resistant, but frightening enemies can still threaten squad Cohesion.","source":"Core Rulebook","page":"277"},{"id":"rule-disposition","name":"Disposition","category":"GM Rule","summary":"The GM sets an NPC\u2019s starting attitude. Interaction Tests can improve or worsen that attitude by steps according to Degrees of Success or Failure.","source":"Core Rulebook","page":"276"},{"id":"rule-hordes","name":"Hordes","category":"GM Rule","summary":"Represents large groups as a single abstract enemy with Magnitude. GM tools track Magnitude separately from ordinary Wounds.","source":"Core Rulebook","page":"359\u2013360"}],"difficulty":[["Trivial",60],["Elementary",50],["Simple",40],["Easy",30],["Routine",20],["Ordinary",10],["Challenging",0],["Difficult",-10],["Hard",-20],["Very Hard",-30],["Arduous",-40],["Punishing",-50],["Hellish",-60]]};

function deepCopy(x){return JSON.parse(JSON.stringify(x))}
function coreMigrate(){state.characters.forEach(ch=>{ch.baseXP=Number.isFinite(ch.baseXP)?ch.baseXP:12000;ch.xp=ch.xp||{available:1000,spent:0};if(ch.xp.available===undefined)ch.xp.available=1000;if(ch.xp.spent===undefined)ch.xp.spent=0;ch.charAdvances=ch.charAdvances||{};ch.skillsOwned=ch.skillsOwned||{};ch.talentsOwned=ch.talentsOwned||[];ch.specialAbility=ch.specialAbility||'';ch.armour=ch.armour||'power-armour';ch.gear=ch.gear||[];ch.past=ch.past||'';ch.armourHistory=ch.armourHistory||'';ch.creationComplete=ch.creationComplete??true;ch.critical=ch.critical||0;ch.conditions=ch.conditions||[];ch.renown=ch.renown||0;ch.mode=ch.mode||'solo';let sr=SPEC_RULES[ch.speciality];if(sr){for(let s of sr.startSkills)ch.skillsOwned[s]=Math.max(ch.skillsOwned[s]||0,0);for(let t of sr.startTalents)if(!ch.talentsOwned.includes(t))ch.talentsOwned.push(t);if(!ch.specialAbility&&sr.choices.length)ch.specialAbility=sr.choices[0].name;if(ch.speciality==='librarian'){ch.psyRating=ch.psyRating||3;if(!ch.powers?.length)ch.powers=['Inspire','Iron Arm','Smite'];}}});state.creator=state.creator||null;state.combat=state.combat||{round:1,turn:0,initiative:[]};save()}
function totalXP(ch=c()){return (ch.baseXP||12000)+(ch.xp?.spent||0)}
function rankFor(ch=c()){let t=totalXP(ch),r=1;for(let [n,min,max] of RANK_THRESHOLDS)if(t>=min)r=n;return r}
function movement(ch=c()){let ab=Math.floor(modChar('Ag')/10)+1;return{half:ab,full:ab*2,charge:ab*3,run:ab*6}}
function damageState(ch=c()){let tb=bonus('T'),d=ch.wounds.damage||0;if(ch.critical>0||d>ch.wounds.max)return['Critical',3];if(d>2*tb)return['Heavy',2];if(d>0)return['Light',1];return['Unhurt',0]}
function richChapter(){return CORE_DATA.chapters.find(x=>x.id===c().chapter)||CORE_DATA.chapters.find(x=>x.name===chapter().name)}
function richSpec(){return SPEC_RULES[c().speciality]||SPEC_RULES.tactical}
function modeAbilities(){let ch=c(),rc=richChapter(),sr=richSpec(),out=[];if(ch.mode==='solo'){let s=CORE_DATA.solo.find(x=>x.chapter===rc?.name);if(s)out.push({name:s.name,summary:s.summary,meta:(s.activation||'')+' '+(s.duration||''),source:s.source+' p.'+s.page});let a=sr.choices.find(x=>x.name===ch.specialAbility&&x.mode==='Solo');if(a)out.push({name:a.name,summary:a.summary,meta:'Speciality · Solo Mode',source:'Core Rulebook — Speciality'})}else{for(let s of CORE_DATA.squad.filter(x=>!x.chapter||x.chapter===rc?.name))out.push({name:s.name,summary:s.summary,meta:`${s.subtype||'Squad Mode'} · ${s.action||''} · Cohesion ${s.cost??'—'}${s.sustained?' · Sustained':''}`,source:s.source+' p.'+s.page});let a=sr.choices.find(x=>x.name===ch.specialAbility&&x.mode==='Squad');if(a)out.unshift({name:a.name,summary:a.summary,meta:'Speciality · Squad Mode',source:'Core Rulebook — Speciality'})}for(let a of sr.choices.filter(x=>x.name===ch.specialAbility&&x.mode==='Always'))out.unshift({name:a.name,summary:a.summary,meta:'Speciality · Always available',source:'Core Rulebook — Speciality'});return out}
function currentArmour(){return CORE_DATA.armours.find(a=>a.id===c().armour)||CORE_DATA.armours[0]}
function armourLine(){let a=currentArmour(),ap=a.ap||{};return Object.entries(ap).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}
function skillTargetRich(s){let ch=c(),lvl=ch.skillsOwned?.[s.name];let trained=lvl!==undefined||richSpec().startSkills.includes(s.name)||['Awareness','Climb','Dodge','Intimidate','Literacy','Common Lore (Adeptus Astartes)','Common Lore (Imperium)','Common Lore (War)','Concealment','Navigation (Surface)','Silent Move','Speak Language (High Gothic)','Speak Language (Low Gothic)','Tactics','Tracking','Forbidden Lore (Xenos)'].includes(s.name);let base=modChar(s.characteristic);if(!trained)return s.skillType==='Basic'?Math.floor(base/2):null;return base+(lvl||0)}
