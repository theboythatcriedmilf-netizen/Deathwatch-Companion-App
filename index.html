  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" id="brandHome" aria-label="Go to character overview">
        <div class="watch-mark" aria-hidden="true">I</div>
        <div>
          <div class="brand-title">DEATHWATCH</div>
          <div class="brand-subtitle">Watch Fortress Dataslate // v0.3</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="engine-status" id="engineStatus" aria-label="Interactive engine online"><i></i><span>ONLINE</span></div>
        <button class="icon-btn" id="rollBtn" aria-label="Quick d100 roll" title="Quick d100">d100</button>
        <button class="icon-btn" id="menuBtn" aria-label="Open menu" title="Menu">☰</button>
      </div>
    </header>

    <main id="main" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Character sections">
      <button data-view="overview" class="nav-item active"><span>⌂</span><small>Overview</small></button>
      <button data-view="combat" class="nav-item"><span>✚</span><small>Combat</small></button>
      <button data-view="skills" class="nav-item"><span>◎</span><small>Skills</small></button>
      <button data-view="abilities" class="nav-item"><span>✦</span><small>Abilities</small></button>
      <button data-view="gear" class="nav-item"><span>▣</span><small>Gear</small></button>
      <button data-view="advances" class="nav-item"><span>↑</span><small>XP</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Modal</h2>
        <button class="icon-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <input type="file" id="portraitFile" accept="image/*" hidden />

  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'deathwatchCompanion.v0.3';
  const VERSION = '0.3.0';
  const CHAR_KEYS = ['WS','BS','S','T','Ag','Int','Per','WP','Fel'];
  const CHAR_LABELS = {
    WS:'Weapon Skill', BS:'Ballistic Skill', S:'Strength', T:'Toughness', Ag:'Agility',
    Int:'Intelligence', Per:'Perception', WP:'Willpower', Fel:'Fellowship'
  };
  const LOCATIONS = ['Head','Body','Left Arm','Right Arm','Left Leg','Right Leg'];

  const STARTER_COMPENDIUM = [
    {id:uid(), category:'Skill', name:'Awareness', characteristic:'Per', source:'Starter', notes:'Quick-reference entry. Add your owned source/page notes as needed.'},
    {id:uid(), category:'Skill', name:'Athletics', characteristic:'S', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Command', characteristic:'Fel', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Dodge', characteristic:'Ag', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Medicae', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Stealth', characteristic:'Ag', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Survival', characteristic:'Per', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Tactics', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Tech-Use', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Ability', name:'Solo Mode Ability', source:'Starter', notes:'Replace with the character’s actual ability and source reference.'},
    {id:uid(), category:'Ability', name:'Squad Mode Ability', source:'Starter', notes:'Replace with the character’s actual ability and source reference.'},
    {id:uid(), category:'Gear', name:'Mission Wargear', source:'Starter', notes:'Generic placeholder for requisitioned mission equipment.'},
    {id:uid(), category:'Weapon', name:'Custom Ranged Weapon', source:'Starter', data:{class:'Ranged', range:'—', rof:'—', damage:'—', pen:'—', clipMax:0, reload:'—', qualities:''}, notes:'Enter statistics from a source you own.'},
    {id:uid(), category:'Weapon', name:'Custom Melee Weapon', source:'Starter', data:{class:'Melee', range:'—', rof:'—', damage:'—', pen:'—', clipMax:0, reload:'—', qualities:''}, notes:'Enter statistics from a source you own.'}
  ];

  const el = id => document.getElementById(id);
  const main = el('main');
  const nav = el('bottomNav');
  const backdrop = el('modalBackdrop');
  const modalTitle = el('modalTitle');
  const modalBody = el('modalBody');
  const closeModalBtn = el('closeModal');
  const importFile = el('importFile');
  const portraitFile = el('portraitFile');

  let state = loadState();
  let view = 'overview';
  let toastTimer = null;
  let pendingPortraitCharId = null;

  // A static HTML preview can render the shell while blocking JavaScript.
  // Hiding this warning is the first proof that the interactive engine is actually running.
  document.getElementById('runtimeWarning')?.classList.add('hidden');

  if (!state.characters.length) {
    const c = createDemoCharacter();
    state.characters.push(c);
    state.activeId = c.id;
    saveState();
  }

  function uid() {
    return (globalThis.crypto?.randomUUID?.() || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);
  }

  function createCharacter(name='New Battle-Brother') {
    const characteristics = {};
    CHAR_KEYS.forEach(k => characteristics[k] = 30);
    return {
      id: uid(), name, chapter:'', speciality:'', rank:'Battle-Brother', squadRole:'',
      demeanour:'', chapterDemeanour:'', past:'', portrait:'',
      characteristics,
      resources: {
        wounds:{current:20,max:20}, fate:{current:3,max:3}, fatigue:{current:0,max:10},
        cohesion:{current:0,max:0}, insanity:{current:0,max:100}, corruption:{current:0,max:100}
      },
      xp:{earned:0,spent:0}, renown:{value:0,label:''}, initiativeBonus:0,
      armour: LOCATIONS.map(loc => ({id:uid(), location:loc, ap:0, notes:''})),
      armourNotes:'', powerArmourHistory:'',
      weapons:[], gear:[], skills:[], abilities:[], advances:[], effects:[], activity:[], notes:'',
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
  }

  function createDemoCharacter() {
    const c = createCharacter('Brother Acastus // DEMO');
    c.chapter = 'Raptors';
    c.speciality = 'Tactical Marine';
    c.rank = 'Battle-Brother';
    c.squadRole = 'Marksman';
    c.demeanour = 'Measured';
    c.chapterDemeanour = 'Pragmatic';
    c.past = 'Demonstration personnel file. Replace this record with your own Battle-Brother.';
    c.characteristics = {WS:45,BS:52,S:44,T:46,Ag:48,Int:41,Per:50,WP:43,Fel:36};
    c.resources.wounds = {current:22,max:22};
    c.resources.fate = {current:3,max:3};
    c.resources.fatigue = {current:0,max:10};
    c.resources.cohesion = {current:3,max:5};
    c.xp = {earned:1000,spent:500};
    c.renown = {value:8,label:'Demo'};
    c.armour.forEach(a => { a.ap = a.location === 'Head' ? 7 : 8; a.notes = 'Demo value'; });
    c.powerArmourHistory = 'Demonstration armour history entry.';
    c.armourNotes = 'Demo numbers are included only to make the controls testable. Replace them from your own source material.';
    c.weapons = [
      {id:uid(),name:'Boltgun // DEMO',class:'Ranged',range:'100m',rof:'S/3/—',damage:'Demo',pen:'Demo',clipCurrent:28,clipMax:28,reload:'Full',qualities:'Demo profile',source:'Demo',notes:'Use Fire −1, +1, Reload, and Edit to verify the armoury is live.'},
      {id:uid(),name:'Combat Blade // DEMO',class:'Melee',range:'Melee',rof:'—',damage:'Demo',pen:'Demo',clipCurrent:0,clipMax:0,reload:'—',qualities:'Demo profile',source:'Demo',notes:''}
    ];
    c.skills = [
      {id:uid(),name:'Awareness',characteristic:'Per',training:10,source:'Demo',notes:'Tap the target number to roll.'},
      {id:uid(),name:'Stealth',characteristic:'Ag',training:0,source:'Demo',notes:''},
      {id:uid(),name:'Tactics',characteristic:'Int',training:0,source:'Demo',notes:''}
    ];
    c.abilities = [
      {id:uid(),name:'Solo Mode Ability // DEMO',type:'Solo Mode',source:'Demo',notes:'Replace with the actual ability from a source you own.'},
      {id:uid(),name:'Squad Mode Ability // DEMO',type:'Squad Mode',source:'Demo',notes:'Replace with the actual ability from a source you own.'}
    ];
    c.gear = [{id:uid(),name:'Mission Wargear // DEMO',qty:1,requisition:'—',missionIssued:true,source:'Demo',notes:'Editable demonstration entry.'}];
    c.advances = [{id:uid(),name:'Example Advance // DEMO',cost:500,source:'Demo',notes:'Delete when starting a real character.',date:new Date().toISOString(),counted:true}];
    c.notes = 'This starter record exists so every major screen has something interactive immediately.';
    c.activity = [{id:uid(),at:new Date().toISOString(),kind:'system',message:'Dataslate authenticated. Demo personnel record loaded.'}];
    return c;
  }

  function defaultState() {
    return {
      version: VERSION,
      activeId:null,
      characters:[],
      compendium: structuredClone(STARTER_COMPENDIUM),
      settings:{degreeMethod:'margin', lastView:'overview'}
    };
  }

  function normalizeCharacter(c) {
    const base = createCharacter(c?.name || 'Battle-Brother');
    const merged = {...base, ...c};
    merged.characteristics = {...base.characteristics, ...(c.characteristics || {})};
    merged.resources = {...base.resources, ...(c.resources || {})};
    Object.keys(base.resources).forEach(k => merged.resources[k] = {...base.resources[k], ...(c.resources?.[k] || {})});
    merged.xp = {...base.xp, ...(c.xp || {})};
    merged.renown = {...base.renown, ...(c.renown || {})};
    ['armour','weapons','gear','skills','abilities','advances','effects','activity'].forEach(k => {
      if (!Array.isArray(merged[k])) merged[k] = [];
    });
    if (!merged.armour.length) merged.armour = structuredClone(base.armour);
    return merged;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const out = {...defaultState(), ...parsed};
      out.settings = {...defaultState().settings, ...(parsed.settings || {})};
      out.characters = Array.isArray(parsed.characters) ? parsed.characters.map(normalizeCharacter) : [];
      out.compendium = Array.isArray(parsed.compendium) ? parsed.compendium : structuredClone(STARTER_COMPENDIUM);
      if (!out.activeId || !out.characters.some(c => c.id === out.activeId)) out.activeId = out.characters[0]?.id || null;
      return out;
    } catch (err) {
      console.warn('Could not load saved data:', err);
      return defaultState();
    }
  }

  function saveState() {
    state.version = VERSION;
    const c = activeChar();
    if (c) c.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    pulseSave();
  }

  function activeChar() {
    return state.characters.find(c => c.id === state.activeId) || state.characters[0];
  }

  function esc(value='') {
    return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  function n(value, fallback=0) {
    const num = Number(value);
    return Number.isFinite(num) ? num : fallback;
  }

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

  function showToast(message) {
    const t = el('toast');
    t.textContent = message;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), 1900);
  }

  function pulseSave(label='AUTOSAVED') {
    const status = el('engineStatus');
    if (!status) return;
    status.classList.add('saved');
    const span = status.querySelector('span');
    if (span) span.textContent = label;
    clearTimeout(pulseSave._t);
    pulseSave._t = setTimeout(() => {
      status.classList.remove('saved');
      if (span) span.textContent = 'ONLINE';
    }, 1050);
  }

  function recordActivity(message, kind='system') {
    const c = activeChar();
    if (!c) return;
    if (!Array.isArray(c.activity)) c.activity = [];
    c.activity.unshift({id:uid(), at:new Date().toISOString(), kind, message:String(message)});
    c.activity = c.activity.slice(0,40);
  }

  function activityTime(iso) {
    try { return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso)); }
    catch { return ''; }
  }

  function openModal(title, html, afterOpen) {
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    backdrop.classList.remove('hidden');
    backdrop.setAttribute('aria-hidden','false');
    setTimeout(() => modalBody.querySelector('input,select,textarea,button')?.focus(), 20);
    if (afterOpen) afterOpen();
  }

  function closeModal() {
    backdrop.classList.add('hidden');
    backdrop.setAttribute('aria-hidden','true');
    modalBody.innerHTML = '';
  }

  function field(label, name, value='', type='text', opts='') {
    return `<div class="field"><label for="${name}">${esc(label)}</label><input class="input" id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${opts}></div>`;
  }
  function area(label, name, value='', rows=4) {
    return `<div class="field"><label for="${name}">${esc(label)}</label><textarea class="textarea" id="${name}" name="${name}" rows="${rows}">${esc(value)}</textarea></div>`;
  }
  function selectField(label, name, options, selected='') {
    return `<div class="field"><label for="${name}">${esc(label)}</label><select class="select" id="${name}" name="${name}">${options.map(o => {
      const val = typeof o === 'string' ? o : o.value; const lab = typeof o === 'string' ? o : o.label;
      return `<option value="${esc(val)}" ${String(val)===String(selected)?'selected':''}>${esc(lab)}</option>`;
    }).join('')}</select></div>`;
  }

  function setView(next) {
    view = next;
    state.settings.lastView = next;
    saveState();
    [...nav.querySelectorAll('[data-view]')].forEach(b => b.classList.toggle('active', b.dataset.view === next));
    render();
    main.focus({preventScroll:true});
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function render() {
    const c = activeChar();
    if (!c) return renderNoCharacters();
    const renderers = {overview:renderOverview, combat:renderCombat, skills:renderSkills, abilities:renderAbilities, gear:renderGear, advances:renderAdvances};
    main.innerHTML = (renderers[view] || renderOverview)(c);
    bindViewEvents();
  }

  function renderNoCharacters() {
    main.innerHTML = `<div class="hero-card"><div class="eyebrow">Watch Fortress Archive</div><h1>No Battle-Brother selected</h1><p class="section-note">Create a character to begin.</p><button class="btn primary" data-action="new-character">Create Character</button></div>`;
    bindViewEvents();
  }

  function charStrip(c) {
    return `<div class="character-strip">${state.characters.map(x => `<button class="char-chip ${x.id===c.id?'active':''}" data-char-id="${x.id}">${esc(x.name)}</button>`).join('')}<button class="char-chip" data-action="new-character">＋ New</button></div>`;
  }

  function hero(c) {
    const sub = [c.chapter, c.speciality, c.rank].filter(Boolean).join(' • ') || 'Unassigned Battle-Brother';
    return `<section class="hero-card">
      <div class="hero-main">
        <button class="portrait" data-action="portrait" aria-label="Change portrait">${c.portrait ? `<img src="${c.portrait}" alt="${esc(c.name)} portrait">` : esc((c.name || 'B')[0].toUpperCase())}</button>
        <div class="hero-copy"><div class="eyebrow">Adeptus Astartes Personnel Record</div><h1>${esc(c.name)}</h1><div class="subline">${esc(sub)}</div>
          <div class="tag-row">${c.squadRole?`<span class="tag">${esc(c.squadRole)}</span>`:''}<span class="tag">Renown ${n(c.renown.value)}</span><span class="tag">XP ${Math.max(0,n(c.xp.earned)-n(c.xp.spent))} available</span></div>
        </div>
      </div>${charStrip(c)}
    </section>`;
  }

  function characteristics(c) {
    return `<section class="card"><div class="card-title-row"><h2>Characteristics</h2><button class="btn small" data-action="edit-characteristics">Edit</button></div>
      <div class="stat-grid">${CHAR_KEYS.map(k => `<button class="stat" data-roll-char="${k}"><span class="label">${k}</span><span class="value">${n(c.characteristics[k])}</span><span class="mini">tap to test</span></button>`).join('')}</div></section>`;
  }

  function resourceCard(name, data, action) {
    const cur = n(data.current), max = Math.max(0,n(data.max));
    const pct = max > 0 ? clamp((cur/max)*100,0,100) : 0;
    return `<button class="resource" data-action="${action}" style="text-align:left;color:inherit;cursor:pointer"><div class="resource-head"><span class="resource-name">${esc(name)}</span><span class="resource-value">${cur}${max?` / ${max}`:''}</span></div><div class="meter"><i style="width:${pct}%"></i></div></button>`;
  }

  function resourceControlCard(name,key,data) {
    const max=Math.max(0,n(data.max)); const cur=n(data.current); const pct=max?clamp((cur/max)*100,0,100):0;
    return `<div class="resource live-resource"><div class="resource-head"><span class="resource-name">${esc(name)}</span><span class="resource-value">${cur}${max?` / ${max}`:''}</span></div><div class="meter"><i style="width:${pct}%"></i></div><div class="resource-actions"><button class="micro-btn" data-resource-delta="${key}" data-delta="-1">−</button><button class="micro-btn resource-edit" data-resource-edit="${key}">EDIT</button><button class="micro-btn" data-resource-delta="${key}" data-delta="1">＋</button></div></div>`;
  }

  function adjustResource(key,delta) {
    const r=activeChar()?.resources?.[key]; if(!r)return; const before=n(r.current); const max=Math.max(0,n(r.max));
    r.current=max>0?clamp(before+n(delta),0,max):Math.max(0,before+n(delta));
    if(r.current!==before)recordActivity(`${key[0].toUpperCase()+key.slice(1)} ${delta>0?'+':''}${n(delta)} → ${r.current}`,'resource');
    saveState(); render();
  }

  function renderActivity(c) {
    const rows=(c.activity||[]).slice(0,8);
    if(!rows.length)return `<div class="empty">No Watch Log entries yet. Roll a test or change a resource to begin the record.</div>`;
    return `<div class="watch-log">${rows.map(x=>`<div class="log-row log-${esc(x.kind||'system')}"><span class="log-time">${esc(activityTime(x.at))}</span><span>${esc(x.message)}</span></div>`).join('')}</div>`;
  }

  function renderOverview(c) {
    const xpAvail = Math.max(0,n(c.xp.earned)-n(c.xp.spent));
    return `${hero(c)}${characteristics(c)}
      <section class="card"><div class="card-title-row"><h2>Readiness</h2><button class="btn small" data-action="edit-resources">Edit</button></div>
        <div class="resource-grid">
          ${resourceControlCard('Wounds','wounds',c.resources.wounds)}
          ${resourceControlCard('Fate','fate',c.resources.fate)}
          ${resourceControlCard('Fatigue','fatigue',c.resources.fatigue)}
          ${resourceControlCard('Cohesion','cohesion',c.resources.cohesion)}
        </div>
      </section>
      <div class="two-col">
        <section class="card"><div class="card-title-row"><h2>Service Record</h2><button class="btn small" data-action="edit-profile">Edit</button></div>
          <div class="list">
            <div class="list-item"><div class="item-title">${esc(c.chapter || 'Chapter not set')}</div><div class="item-sub">Chapter</div></div>
            <div class="list-item"><div class="item-title">${esc(c.speciality || 'Speciality not set')}</div><div class="item-sub">Speciality</div></div>
            <div class="list-item"><div class="item-title">${esc(c.demeanour || '—')}</div><div class="item-sub">Personal Demeanour</div></div>
            <div class="list-item"><div class="item-title">${esc(c.chapterDemeanour || '—')}</div><div class="item-sub">Chapter Demeanour</div></div>
          </div>
        </section>
        <section class="card"><div class="card-title-row"><h2>Progression</h2><button class="btn small" data-action="edit-progression">Edit</button></div>
          <div class="list">
            <div class="list-item"><div class="item-title">${xpAvail} XP</div><div class="item-sub">${n(c.xp.earned)} earned • ${n(c.xp.spent)} spent</div></div>
            <div class="list-item"><div class="item-title">${n(c.renown.value)} ${esc(c.renown.label || '')}</div><div class="item-sub">Renown</div></div>
            <div class="list-item"><div class="item-title">${c.advances.length}</div><div class="item-sub">Purchased advances recorded</div></div>
          </div>
        </section>
      </div>
      <section class="card"><div class="card-title-row"><h2>Past & Notes</h2><button class="btn small" data-action="edit-story">Edit</button></div>
        <p class="section-note"><strong>Past:</strong> ${esc(c.past || 'No past event recorded.')}</p>
        <div class="divider"></div><p class="section-note">${esc(c.notes || 'No campaign notes yet.')}</p>
      </section>
      <section class="card watch-log-card"><div class="card-title-row"><h2>Watch Log</h2><span class="live-rune"><i></i> LIVE</span></div>${renderActivity(c)}</section>`;
  }

  function renderCombat(c) {
    const armour = c.armour.map(a => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.location)}</div><div class="item-sub">${esc(a.notes || 'No notes')}</div></div><div class="skill-target" data-edit-armour="${a.id}">${n(a.ap)} AP</div></div></div>`).join('');
    const weapons = c.weapons.length ? c.weapons.map(w => weaponHtml(w)).join('') : `<div class="empty">No weapons recorded. Add one or pull a template from the Compendium.</div>`;
    const effects = c.effects.length ? c.effects.map(e => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(e.name)}</div><div class="item-sub">${esc(e.notes || '')}</div></div><button class="btn small danger" data-delete-effect="${e.id}">Clear</button></div></div>`).join('') : `<div class="empty">No temporary effects.</div>`;
    return `${hero(c)}
      <section class="card"><div class="card-title-row"><h2>Combat State</h2><button class="btn small" data-action="edit-resources">Edit</button></div>
        <div class="resource-grid">${resourceControlCard('Wounds','wounds',c.resources.wounds)}${resourceControlCard('Fate','fate',c.resources.fate)}${resourceControlCard('Fatigue','fatigue',c.resources.fatigue)}${resourceControlCard('Cohesion','cohesion',c.resources.cohesion)}</div>
        <div class="inline-fields" style="margin-top:8px"><button class="btn" data-action="initiative">Roll Initiative</button><button class="btn" data-action="add-effect">＋ Effect</button></div>
      </section>
      <section class="card"><div class="card-title-row"><h2>Weapons</h2><div><button class="btn small" data-action="compendium-weapons">Library</button> <button class="btn small primary" data-action="add-weapon">＋ Add</button></div></div><div class="list">${weapons}</div></section>
      <div class="two-col">
        <section class="card"><div class="card-title-row"><h2>Armour</h2><button class="btn small" data-action="armour-notes">Notes</button></div><div class="list">${armour}</div></section>
        <section class="card"><div class="card-title-row"><h2>Effects</h2><button class="btn small" data-action="add-effect">＋ Add</button></div><div class="list">${effects}</div></section>
      </div>`;
  }

  function weaponHtml(w) {
    const max = Math.max(0,n(w.clipMax));
    const cur = clamp(n(w.clipCurrent),0,max || 9999);
    return `<div class="list-item weapon">
      <div class="list-row"><div><div class="item-title">${esc(w.name)}</div><div class="item-sub">${esc(w.class || 'Weapon')} ${w.source?`• ${esc(w.source)}`:''}</div></div>
        <div class="item-actions"><button class="btn small" data-edit-weapon="${w.id}">Edit</button><button class="btn small danger" data-delete-weapon="${w.id}">×</button></div></div>
      <div class="weapon-stats">
        <div class="weapon-stat"><b>${esc(w.range || '—')}</b><small>Range</small></div>
        <div class="weapon-stat"><b>${esc(w.rof || '—')}</b><small>RoF</small></div>
        <div class="weapon-stat"><b>${esc(w.damage || '—')}</b><small>Damage</small></div>
        <div class="weapon-stat"><b>${esc(w.pen || '—')}</b><small>Pen</small></div>
      </div>
      ${w.qualities?`<div class="item-sub" style="margin-top:8px"><strong>Qualities:</strong> ${esc(w.qualities)}</div>`:''}
      ${max>0?`<div class="ammo-row"><span class="ammo-count">${cur} / ${max}</span><button class="btn small" data-ammo-minus="${w.id}">Fire −1</button><button class="btn small" data-ammo-plus="${w.id}">＋1</button><button class="btn small" data-reload="${w.id}">Reload</button><span class="source">${esc(w.reload || '')}</span></div>`:''}
      ${w.notes?`<div class="item-sub" style="margin-top:8px">${esc(w.notes)}</div>`:''}
    </div>`;
  }

  function renderSkills(c) {
    const list = c.skills.length ? c.skills.map(s => {
      const base = n(c.characteristics[s.characteristic]); const bonus = n(s.training); const target = base + bonus;
      return `<div class="list-item skill-row"><div><div class="item-title">${esc(s.name)}</div><div class="item-sub">${esc(CHAR_LABELS[s.characteristic] || s.characteristic)} ${bonus?`${bonus>0?'+':''}${bonus}`:''} ${s.source?`• ${esc(s.source)}`:''}</div></div><button class="skill-target" data-roll-skill="${s.id}">${target}</button><button class="btn small" data-edit-skill="${s.id}">Edit</button></div>`;
    }).join('') : `<div class="empty">No skills added. Use the Compendium to add starter skills or create your own.</div>`;
    return `${hero(c)}${characteristics(c)}
      <section class="card"><div class="card-title-row"><h2>Skills</h2><div><button class="btn small" data-action="compendium-skills">Compendium</button> <button class="btn small primary" data-action="add-skill">＋ Add</button></div></div><div class="list">${list}</div></section>`;
  }

  function renderAbilities(c) {
    const groups = ['Talent','Trait','Ability','Solo Mode','Squad Mode','Honour','Distinction','Other'];
    const html = groups.map(g => {
      const arr = c.abilities.filter(a => (a.type || 'Other') === g);
      if (!arr.length) return '';
      return `<section class="card"><div class="card-title-row"><h2>${esc(g)}</h2></div><div class="list">${arr.map(a => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.name)}</div><div class="item-sub">${esc(a.notes || '')}</div>${a.source?`<div class="source">${esc(a.source)}</div>`:''}</div><div class="item-actions"><button class="btn small" data-edit-ability="${a.id}">Edit</button><button class="btn small danger" data-delete-ability="${a.id}">×</button></div></div></div>`).join('')}</div></section>`;
    }).join('');
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Abilities & Talents</h2><div><button class="btn small" data-action="compendium-abilities">Compendium</button> <button class="btn small primary" data-action="add-ability">＋ Add</button></div></div><p class="section-note">Store names, your own notes, and source/page references without needing to reproduce a rulebook inside the app.</p></section>${html || `<section class="card"><div class="empty">No abilities recorded yet.</div></section>`}`;
  }

  function renderGear(c) {
    const gear = c.gear.length ? c.gear.map(g => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(g.name)} ${n(g.qty,1)>1?`×${n(g.qty,1)}`:''}</div><div class="item-sub">${g.missionIssued?'Mission issued • ':''}${g.requisition!==''&&g.requisition!=null?`Req ${esc(g.requisition)} • `:''}${esc(g.notes || '')}</div>${g.source?`<div class="source">${esc(g.source)}</div>`:''}</div><div class="item-actions"><button class="btn small" data-edit-gear="${g.id}">Edit</button><button class="btn small danger" data-delete-gear="${g.id}">×</button></div></div></div>`).join('') : `<div class="empty">No equipment recorded.</div>`;
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Wargear & Requisition</h2><div><button class="btn small" data-action="compendium-gear">Compendium</button> <button class="btn small primary" data-action="add-gear">＋ Add</button></div></div><div class="list">${gear}</div></section>
      <section class="card"><div class="card-title-row"><h2>Power Armour</h2><button class="btn small" data-action="armour-notes">Edit</button></div><p class="section-note"><strong>History:</strong> ${esc(c.powerArmourHistory || 'Not recorded.')}</p><div class="divider"></div><p class="section-note">${esc(c.armourNotes || 'No armour notes.')}</p></section>`;
  }

  function renderAdvances(c) {
    const avail = Math.max(0,n(c.xp.earned)-n(c.xp.spent));
    const list = c.advances.length ? [...c.advances].reverse().map(a => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.name)}</div><div class="item-sub">${n(a.cost)} XP ${a.source?`• ${esc(a.source)}`:''}</div>${a.notes?`<div class="source">${esc(a.notes)}</div>`:''}</div><button class="btn small danger" data-delete-advance="${a.id}">Undo</button></div></div>`).join('') : `<div class="empty">No purchased advances recorded.</div>`;
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Experience</h2><button class="btn small" data-action="edit-progression">Edit Totals</button></div>
      <div class="resource-grid"><div class="resource"><div class="resource-head"><span class="resource-name">Earned</span><span class="resource-value">${n(c.xp.earned)}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Spent</span><span class="resource-value">${n(c.xp.spent)}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Available</span><span class="resource-value">${avail}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Renown</span><span class="resource-value">${n(c.renown.value)}</span></div></div></div>
      <div style="margin-top:10px"><button class="btn primary" data-action="add-advance">＋ Record Advance</button></div>
    </section><section class="card"><div class="card-title-row"><h2>Advancement History</h2></div><div class="list">${list}</div></section>`;
  }

  function bindViewEvents() {
    main.querySelectorAll('[data-char-id]').forEach(b => b.onclick = () => { state.activeId=b.dataset.charId; saveState(); render(); });
    main.querySelectorAll('[data-roll-char]').forEach(b => b.onclick = () => rollTest(CHAR_LABELS[b.dataset.rollChar], n(activeChar().characteristics[b.dataset.rollChar])));
    main.querySelectorAll('[data-roll-skill]').forEach(b => b.onclick = () => { const s=activeChar().skills.find(x=>x.id===b.dataset.rollSkill); if(s) rollTest(s.name,n(activeChar().characteristics[s.characteristic])+n(s.training)); });
    main.querySelectorAll('[data-action]').forEach(b => b.onclick = () => handleAction(b.dataset.action));
    main.querySelectorAll('[data-edit-armour]').forEach(b => b.onclick = () => editArmour(b.dataset.editArmour));
    main.querySelectorAll('[data-edit-weapon]').forEach(b => b.onclick = () => editWeapon(b.dataset.editWeapon));
    main.querySelectorAll('[data-delete-weapon]').forEach(b => b.onclick = () => deleteItem('weapons',b.dataset.deleteWeapon,'weapon'));
    main.querySelectorAll('[data-ammo-minus]').forEach(b => b.onclick = () => ammo(b.dataset.ammoMinus,-1));
    main.querySelectorAll('[data-ammo-plus]').forEach(b => b.onclick = () => ammo(b.dataset.ammoPlus,1));
    main.querySelectorAll('[data-reload]').forEach(b => b.onclick = () => reloadWeapon(b.dataset.reload));
    main.querySelectorAll('[data-delete-effect]').forEach(b => b.onclick = () => deleteItem('effects',b.dataset.deleteEffect,'effect'));
    main.querySelectorAll('[data-edit-skill]').forEach(b => b.onclick = () => editSkill(b.dataset.editSkill));
    main.querySelectorAll('[data-edit-ability]').forEach(b => b.onclick = () => editAbility(b.dataset.editAbility));
    main.querySelectorAll('[data-delete-ability]').forEach(b => b.onclick = () => deleteItem('abilities',b.dataset.deleteAbility,'ability'));
    main.querySelectorAll('[data-edit-gear]').forEach(b => b.onclick = () => editGear(b.dataset.editGear));
    main.querySelectorAll('[data-delete-gear]').forEach(b => b.onclick = () => deleteItem('gear',b.dataset.deleteGear,'gear'));
    main.querySelectorAll('[data-delete-advance]').forEach(b => b.onclick = () => undoAdvance(b.dataset.deleteAdvance));
    main.querySelectorAll('[data-resource-delta]').forEach(b => b.onclick = () => adjustResource(b.dataset.resourceDelta,n(b.dataset.delta)));
    main.querySelectorAll('[data-resource-edit]').forEach(b => b.onclick = () => editSingleResource(b.dataset.resourceEdit,b.dataset.resourceEdit[0].toUpperCase()+b.dataset.resourceEdit.slice(1)));
  }

  function handleAction(action) {
    const map = {
      'new-character':newCharacter,
      'portrait':choosePortrait,
      'edit-characteristics':editCharacteristics,
      'edit-resources':editResources,
      'edit-profile':editProfile,
      'edit-progression':editProgression,
      'edit-story':editStory,
      'wounds':()=>editSingleResource('wounds','Wounds'),
      'fate':()=>editSingleResource('fate','Fate Points'),
      'fatigue':()=>editSingleResource('fatigue','Fatigue'),
      'cohesion':()=>editSingleResource('cohesion','Cohesion'),
      'initiative':rollInitiative,
      'add-effect':addEffect,
      'add-weapon':()=>editWeapon(),
      'compendium-weapons':()=>openCompendium('Weapon'),
      'armour-notes':editArmourNotes,
      'add-skill':()=>editSkill(),
      'compendium-skills':()=>openCompendium('Skill'),
      'add-ability':()=>editAbility(),
      'compendium-abilities':()=>openCompendium('Ability'),
      'add-gear':()=>editGear(),
      'compendium-gear':()=>openCompendium('Gear'),
      'add-advance':addAdvance
    };
    map[action]?.();
  }

  function newCharacter() {
    openModal('Create Battle-Brother', `<form id="newCharForm">${field('Name','newName','New Battle-Brother')}${field('Chapter','newChapter','')}${field('Speciality','newSpec','')}
      <div class="modal-actions"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary" type="submit">Create</button></div></form>`, () => {
      modalBody.querySelector('[data-cancel]').onclick=closeModal;
      el('newCharForm').onsubmit = e => { e.preventDefault(); const c=createCharacter(el('newName').value.trim()||'New Battle-Brother'); c.chapter=el('newChapter').value.trim(); c.speciality=el('newSpec').value.trim(); state.characters.push(c); state.activeId=c.id; recordActivity('Personnel file opened. Battle-Brother entered into the Watch Fortress archive.','system'); saveState(); closeModal(); setView('overview'); showToast('Battle-Brother created'); };
    });
  }

  function editProfile() {
    const c=activeChar();
    openModal('Service Record', `<form id="profileForm"><div class="field-grid two">${field('Name','pName',c.name)}${field('Chapter','pChapter',c.chapter)}${field('Speciality','pSpec',c.speciality)}${field('Rank','pRank',c.rank)}${field('Squad Role','pRole',c.squadRole)}${field('Personal Demeanour','pDem',c.demeanour)}${field('Chapter Demeanour','pCDem',c.chapterDemeanour)}</div><div class="modal-actions"><button type="button" class="btn danger" data-delete-char>Delete Character</button><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('profileForm').onsubmit=e=>{e.preventDefault();Object.assign(c,{name:el('pName').value.trim()||c.name,chapter:el('pChapter').value.trim(),speciality:el('pSpec').value.trim(),rank:el('pRank').value.trim(),squadRole:el('pRole').value.trim(),demeanour:el('pDem').value.trim(),chapterDemeanour:el('pCDem').value.trim()});saveState();closeModal();render();showToast('Service record updated');};
      modalBody.querySelector('[data-delete-char]').onclick=()=>confirmDeleteCharacter(c);
    });
  }

  function confirmDeleteCharacter(c) {
    openModal('Delete Character', `<p class="section-note">Delete <strong>${esc(c.name)}</strong>? This cannot be undone unless you have an exported backup.</p><div class="modal-actions"><button class="btn" data-cancel>Cancel</button><button class="btn danger" data-confirm>Delete</button></div>`,()=>{
      modalBody.querySelector('[data-cancel]').onclick=closeModal;
      modalBody.querySelector('[data-confirm]').onclick=()=>{state.characters=state.characters.filter(x=>x.id!==c.id);if(!state.characters.length){const nc=createCharacter();state.characters.push(nc);}state.activeId=state.characters[0].id;saveState();closeModal();setView('overview');showToast('Character deleted');};
    });
  }

  function editCharacteristics() {
    const c=activeChar();
    openModal('Characteristics', `<form id="charForm"><div class="field-grid three">${CHAR_KEYS.map(k=>field(`${k} — ${CHAR_LABELS[k]}`,`ch_${k}`,c.characteristics[k],'number','min="1" max="100" inputmode="numeric"')).join('')}</div><div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('charForm').onsubmit=e=>{e.preventDefault();CHAR_KEYS.forEach(k=>c.characteristics[k]=clamp(n(el(`ch_${k}`).value,30),1,100));saveState();closeModal();render();showToast('Characteristics saved');};
    });
  }

  function editResources() {
    const c=activeChar(); const keys=[['wounds','Wounds'],['fate','Fate'],['fatigue','Fatigue'],['cohesion','Cohesion'],['insanity','Insanity'],['corruption','Corruption']];
    openModal('Resources', `<form id="resForm"><div class="field-grid two">${keys.map(([k,label])=>`<div class="list-item"><div class="item-title">${label}</div><div class="inline-fields" style="margin-top:8px">${field('Current',`r_${k}_c`,c.resources[k].current,'number','inputmode="numeric"')}${field('Maximum',`r_${k}_m`,c.resources[k].max,'number','inputmode="numeric"')}</div></div>`).join('')}</div><div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('resForm').onsubmit=e=>{e.preventDefault();keys.forEach(([k])=>{c.resources[k].current=n(el(`r_${k}_c`).value);c.resources[k].max=Math.max(0,n(el(`r_${k}_m`).value));});saveState();closeModal();render();showToast('Resources updated');};
    });
  }

  function editSingleResource(key,label) {
    const r=activeChar().resources[key];
    openModal(label, `<form id="oneResForm"><div class="inline-fields">${field('Current','oneCur',r.current,'number','inputmode="numeric"')}${field('Maximum','oneMax',r.max,'number','inputmode="numeric"')}</div><div class="modal-actions"><button type="button" class="btn" data-minus>−1</button><button type="button" class="btn" data-plus>＋1</button><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      modalBody.querySelector('[data-minus]').onclick=()=>el('oneCur').value=n(el('oneCur').value)-1;
      modalBody.querySelector('[data-plus]').onclick=()=>el('oneCur').value=n(el('oneCur').value)+1;
      el('oneResForm').onsubmit=e=>{e.preventDefault();r.current=n(el('oneCur').value);r.max=Math.max(0,n(el('oneMax').value));saveState();closeModal();render();};
    });
  }

  function editProgression() {
    const c=activeChar();
    openModal('Progression', `<form id="progForm"><div class="field-grid two">${field('XP Earned','xpEarned',c.xp.earned,'number','min="0" inputmode="numeric"')}${field('XP Spent','xpSpent',c.xp.spent,'number','min="0" inputmode="numeric"')}${field('Renown Value','renownValue',c.renown.value,'number','min="0" inputmode="numeric"')}${field('Renown Label / Tier','renownLabel',c.renown.label)}</div><div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('progForm').onsubmit=e=>{e.preventDefault();c.xp.earned=Math.max(0,n(el('xpEarned').value));c.xp.spent=Math.max(0,n(el('xpSpent').value));c.renown.value=Math.max(0,n(el('renownValue').value));c.renown.label=el('renownLabel').value.trim();saveState();closeModal();render();};
    });
  }

  function editStory() {
    const c=activeChar();
    openModal('Past & Campaign Notes', `<form id="storyForm">${area('Past Event / Background','past',c.past,4)}${area('Campaign Notes','notes',c.notes,7)}<div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('storyForm').onsubmit=e=>{e.preventDefault();c.past=el('past').value;c.notes=el('notes').value;saveState();closeModal();render();};
    });
  }

  function choosePortrait() { pendingPortraitCharId=activeChar().id; portraitFile.click(); }

  portraitFile.addEventListener('change', async () => {
    const f=portraitFile.files?.[0]; if(!f||!pendingPortraitCharId) return;
    try { const data=await resizeImage(f,320); const c=state.characters.find(x=>x.id===pendingPortraitCharId); if(c){c.portrait=data;saveState();render();showToast('Portrait updated');} } catch(e){showToast('Could not read image');}
    portraitFile.value=''; pendingPortraitCharId=null;
  });

  function resizeImage(file,maxSize) {
    return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82));};img.src=reader.result;};reader.readAsDataURL(file);});
  }

  function rollTest(label, baseTarget) {
    openModal(`${label} Test`, `<form id="rollForm"><p class="section-note">Base target: <strong>${baseTarget}</strong>. Apply the situational modifier your GM calls for.</p><div class="inline-fields">${field('Modifier','rollMod',0,'number','step="10" inputmode="numeric"')}${field('Manual Roll (optional)','manualRoll','','number','min="1" max="100" inputmode="numeric"')}</div><div class="modal-actions"><button class="btn primary" type="submit">Roll d100</button></div></form>`,()=>{
      el('rollForm').onsubmit=e=>{e.preventDefault();const mod=n(el('rollMod').value);const manual=el('manualRoll').value.trim();const roll=manual?clamp(n(manual),1,100):Math.floor(Math.random()*100)+1;showRollResult(label,baseTarget,mod,roll);};
    });
  }

  function showRollResult(label,base,mod,roll) {
    const target=clamp(base+mod,1,100); const success=roll<=target; const margin=Math.abs(target-roll); const degrees=1+Math.floor(margin/10); recordActivity(`${label}: rolled ${roll} vs ${target} — ${success?'SUCCESS':'FAILURE'}`,'roll'); saveState();
    modalTitle.textContent=`${label} Result`;
    modalBody.innerHTML=`<div class="roll-result"><div class="eyebrow">Target ${target} (${mod>=0?'+':''}${mod})</div><div class="roll-number ${success?'success':'failure'}">${String(roll).padStart(2,'0')}</div><div class="roll-badge">${success?'SUCCESS':'FAILURE'}</div><div class="roll-detail">Margin ${success?'+':'−'}${margin} • ${degrees} degree${degrees===1?'':'s'} by 10-point margin</div></div><p class="section-note" style="text-align:center">The app shows a quick margin-based degree count. Use your table’s exact rule interpretation where a sourcebook rule or special ability changes the result.</p><div class="modal-actions"><button class="btn" data-reroll>Roll Again</button><button class="btn primary" data-done>Done</button></div>`;
    modalBody.querySelector('[data-reroll]').onclick=()=>showRollResult(label,base,mod,Math.floor(Math.random()*100)+1);
    modalBody.querySelector('[data-done]').onclick=closeModal;
  }

  function quickRoll() {
    const roll=Math.floor(Math.random()*100)+1; recordActivity(`Quick d100: ${roll}`,'roll'); saveState();
    openModal('Quick d100', `<div class="roll-result"><div class="eyebrow">Unmodified Roll</div><div class="roll-number">${String(roll).padStart(2,'0')}</div></div><div class="modal-actions"><button class="btn" data-again>Roll Again</button><button class="btn primary" data-done>Done</button></div>`,()=>{
      modalBody.querySelector('[data-again]').onclick=quickRoll; modalBody.querySelector('[data-done]').onclick=closeModal;
    });
  }

  function rollInitiative() {
    const c=activeChar(); const d10=Math.floor(Math.random()*10)+1; const agBonus=Math.floor(n(c.characteristics.Ag)/10); const total=d10+agBonus+n(c.initiativeBonus); recordActivity(`Initiative: ${total} (${d10}+${agBonus}+${n(c.initiativeBonus)})`,'roll'); saveState();
    openModal('Initiative', `<div class="roll-result"><div class="eyebrow">d10 + Ag Bonus + Modifier</div><div class="roll-number">${total}</div><div class="roll-detail">${d10} + ${agBonus} + ${n(c.initiativeBonus)}</div></div><div class="modal-actions"><button class="btn" data-mod>Set Modifier</button><button class="btn primary" data-done>Done</button></div>`,()=>{
      modalBody.querySelector('[data-done]').onclick=closeModal;
      modalBody.querySelector('[data-mod]').onclick=()=>{ const val=prompt('Initiative modifier',String(c.initiativeBonus)); if(val!==null){c.initiativeBonus=n(val);saveState();closeModal();rollInitiative();} };
    });
  }

  function editArmour(id) {
    const c=activeChar(); const a=c.armour.find(x=>x.id===id); if(!a)return;
    openModal(`${a.location} Armour`, `<form id="armourForm">${field('Armour Points','armourAP',a.ap,'number','min="0" inputmode="numeric"')}${area('Notes','armourLocNotes',a.notes,3)}<div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('armourForm').onsubmit=e=>{e.preventDefault();a.ap=Math.max(0,n(el('armourAP').value));a.notes=el('armourLocNotes').value;saveState();closeModal();render();};
    });
  }

  function editArmourNotes() {
    const c=activeChar();
    openModal('Power Armour Notes', `<form id="armourNotesForm">${area('Power Armour History / Special Result','paHistory',c.powerArmourHistory,4)}${area('General Armour Notes','paNotes',c.armourNotes,5)}<div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('armourNotesForm').onsubmit=e=>{e.preventDefault();c.powerArmourHistory=el('paHistory').value;c.armourNotes=el('paNotes').value;saveState();closeModal();render();};
    });
  }

  function editWeapon(id, template=null) {
    const c=activeChar(); const existing=id?c.weapons.find(x=>x.id===id):null;
    const w=existing || {id:uid(),name:template?.name||'',class:template?.data?.class||'Ranged',range:template?.data?.range||'',rof:template?.data?.rof||'',damage:template?.data?.damage||'',pen:template?.data?.pen||'',clipMax:n(template?.data?.clipMax),clipCurrent:n(template?.data?.clipMax),reload:template?.data?.reload||'',qualities:template?.data?.qualities||'',requisition:'',source:template?.source||'',notes:template?.notes||''};
    openModal(existing?'Edit Weapon':'Add Weapon', `<form id="weaponForm"><div class="field-grid two">${field('Name','wName',w.name)}${selectField('Class','wClass',['Ranged','Melee','Thrown','Heavy','Other'],w.class)}${field('Range','wRange',w.range)}${field('Rate of Fire','wRof',w.rof)}${field('Damage','wDamage',w.damage)}${field('Penetration','wPen',w.pen)}${field('Clip Size','wClipMax',w.clipMax,'number','min="0" inputmode="numeric"')}${field('Current Ammo','wClipCurrent',w.clipCurrent,'number','min="0" inputmode="numeric"')}${field('Reload','wReload',w.reload)}${field('Requisition','wReq',w.requisition)}${field('Qualities','wQual',w.qualities)}${field('Source / Page','wSource',w.source)}</div>${area('Notes','wNotes',w.notes,3)}<div class="modal-actions"><button class="btn primary" type="submit">${existing?'Save':'Add Weapon'}</button></div></form>`,()=>{
      el('weaponForm').onsubmit=e=>{e.preventDefault();Object.assign(w,{name:el('wName').value.trim()||'Unnamed Weapon',class:el('wClass').value,range:el('wRange').value.trim(),rof:el('wRof').value.trim(),damage:el('wDamage').value.trim(),pen:el('wPen').value.trim(),clipMax:Math.max(0,n(el('wClipMax').value)),clipCurrent:Math.max(0,n(el('wClipCurrent').value)),reload:el('wReload').value.trim(),requisition:el('wReq').value.trim(),qualities:el('wQual').value.trim(),source:el('wSource').value.trim(),notes:el('wNotes').value});if(!existing)c.weapons.push(w);saveState();closeModal();render();showToast(existing?'Weapon updated':'Weapon added');};
    });
  }

  function ammo(id,delta){const w=activeChar().weapons.find(x=>x.id===id);if(!w)return;const before=n(w.clipCurrent);w.clipCurrent=clamp(before+delta,0,Math.max(n(w.clipMax),before+Math.max(delta,0)));if(w.clipCurrent!==before)recordActivity(`${w.name}: ammo ${before} → ${w.clipCurrent}`,'armoury');saveState();render();}
  function reloadWeapon(id){const w=activeChar().weapons.find(x=>x.id===id);if(!w)return;w.clipCurrent=Math.max(0,n(w.clipMax));recordActivity(`${w.name}: reloaded to ${w.clipCurrent}`,'armoury');saveState();render();showToast(`${w.name} reloaded`);}

  function addEffect(){
    openModal('Add Temporary Effect', `<form id="effectForm">${field('Name','eName','')}${area('Notes / Duration','eNotes','',3)}<div class="modal-actions"><button class="btn primary" type="submit">Add</button></div></form>`,()=>{el('effectForm').onsubmit=e=>{e.preventDefault();activeChar().effects.push({id:uid(),name:el('eName').value.trim()||'Effect',notes:el('eNotes').value});saveState();closeModal();render();};});
  }

  function editSkill(id, template=null) {
    const c=activeChar(); const existing=id?c.skills.find(x=>x.id===id):null;
    const s=existing||{id:uid(),name:template?.name||'',characteristic:template?.characteristic||'Int',training:0,source:template?.source||'',notes:template?.notes||''};
    openModal(existing?'Edit Skill':'Add Skill', `<form id="skillForm"><div class="field-grid two">${field('Name','sName',s.name)}${selectField('Characteristic','sChar',CHAR_KEYS.map(k=>({value:k,label:`${k} — ${CHAR_LABELS[k]}`})),s.characteristic)}${selectField('Training Modifier','sTraining',[{value:-20,label:'−20'},{value:0,label:'±0'},{value:10,label:'+10'},{value:20,label:'+20'},{value:30,label:'+30'}],s.training)}${field('Source / Page','sSource',s.source)}</div>${area('Notes','sNotes',s.notes,3)}<div class="modal-actions">${existing?'<button type="button" class="btn danger" data-delete>Delete</button>':''}<button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      el('skillForm').onsubmit=e=>{e.preventDefault();Object.assign(s,{name:el('sName').value.trim()||'Unnamed Skill',characteristic:el('sChar').value,training:n(el('sTraining').value),source:el('sSource').value.trim(),notes:el('sNotes').value});if(!existing)c.skills.push(s);saveState();closeModal();render();}; if(existing)modalBody.querySelector('[data-delete]').onclick=()=>{deleteItem('skills',s.id,'skill');closeModal();};
    });
  }

  function editAbility(id, template=null) {
    const c=activeChar(); const existing=id?c.abilities.find(x=>x.id===id):null;
    const a=existing||{id:uid(),name:template?.name||'',type:template?.category==='Ability'?'Ability':'Talent',source:template?.source||'',notes:template?.notes||''};
    openModal(existing?'Edit Ability':'Add Ability / Talent', `<form id="abilityForm"><div class="field-grid two">${field('Name','aName',a.name)}${selectField('Type','aType',['Talent','Trait','Ability','Solo Mode','Squad Mode','Honour','Distinction','Other'],a.type)}${field('Source / Page','aSource',a.source)}</div>${area('Quick Notes','aNotes',a.notes,5)}<div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{el('abilityForm').onsubmit=e=>{e.preventDefault();Object.assign(a,{name:el('aName').value.trim()||'Unnamed Ability',type:el('aType').value,source:el('aSource').value.trim(),notes:el('aNotes').value});if(!existing)c.abilities.push(a);saveState();closeModal();render();};});
  }

  function editGear(id, template=null) {
    const c=activeChar(); const existing=id?c.gear.find(x=>x.id===id):null;
    const g=existing||{id:uid(),name:template?.name||'',qty:1,requisition:'',missionIssued:false,source:template?.source||'',notes:template?.notes||''};
    openModal(existing?'Edit Wargear':'Add Wargear', `<form id="gearForm"><div class="field-grid two">${field('Name','gName',g.name)}${field('Quantity','gQty',g.qty,'number','min="1" inputmode="numeric"')}${field('Requisition','gReq',g.requisition)}${field('Source / Page','gSource',g.source)}</div><label class="checkbox-row" style="margin:10px 0"><input type="checkbox" id="gMission" ${g.missionIssued?'checked':''}> Mission-issued equipment</label>${area('Notes','gNotes',g.notes,4)}<div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></form>`,()=>{el('gearForm').onsubmit=e=>{e.preventDefault();Object.assign(g,{name:el('gName').value.trim()||'Unnamed Gear',qty:Math.max(1,n(el('gQty').value,1)),requisition:el('gReq').value.trim(),missionIssued:el('gMission').checked,source:el('gSource').value.trim(),notes:el('gNotes').value});if(!existing)c.gear.push(g);saveState();closeModal();render();};});
  }

  function addAdvance() {
    const c=activeChar();
    openModal('Record Advance', `<form id="advanceForm"><div class="field-grid two">${field('Advance','adName','')}${field('XP Cost','adCost',0,'number','min="0" inputmode="numeric"')}${field('Source / Page','adSource','')}</div>${area('Notes','adNotes','',3)}<label class="checkbox-row" style="margin-top:10px"><input type="checkbox" id="adAddSpent" checked> Add cost to XP spent</label><div class="modal-actions"><button class="btn primary" type="submit">Record</button></div></form>`,()=>{el('advanceForm').onsubmit=e=>{e.preventDefault();const cost=Math.max(0,n(el('adCost').value));c.advances.push({id:uid(),name:el('adName').value.trim()||'Advance',cost,source:el('adSource').value.trim(),notes:el('adNotes').value,date:new Date().toISOString(),counted:el('adAddSpent').checked});if(el('adAddSpent').checked)c.xp.spent+=cost;saveState();closeModal();render();showToast('Advance recorded');};});
  }

  function undoAdvance(id){const c=activeChar();const a=c.advances.find(x=>x.id===id);if(!a)return;if(a.counted)c.xp.spent=Math.max(0,n(c.xp.spent)-n(a.cost));c.advances=c.advances.filter(x=>x.id!==id);saveState();render();showToast('Advance removed');}

  function deleteItem(arrayKey,id,label){const c=activeChar();c[arrayKey]=c[arrayKey].filter(x=>x.id!==id);saveState();render();showToast(`${label[0].toUpperCase()+label.slice(1)} removed`);}

  function openCompendium(category='') {
    const cats=['All','Skill','Ability','Talent','Trait','Weapon','Gear','Other'];
    const initial=category||'All';
    openModal('Compendium', `<div class="searchbar"><input class="input" id="compSearch" placeholder="Search names, sources, notes…"><button class="btn primary" id="addCompEntry">＋ Entry</button></div><div class="tabs" id="compTabs">${cats.map(x=>`<button class="btn small ${x===initial?'active':''}" data-cat="${x}">${x}</button>`).join('')}</div><div id="compList"></div><div class="divider"></div><p class="section-note">This build ships with only generic starter templates. Import your own source packs or add references from books you own.</p><div class="modal-actions"><button class="btn" id="importPackBtn">Import Pack</button><button class="btn" id="exportPackBtn">Export Compendium</button></div>`,()=>{
      let cat=initial;
      const rerender=()=>{const q=el('compSearch').value.trim().toLowerCase();const entries=state.compendium.filter(x=>(cat==='All'||x.category===cat)&&(!q||`${x.name} ${x.source} ${x.notes}`.toLowerCase().includes(q)));el('compList').innerHTML=entries.length?`<div class="list">${entries.map(x=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(x.name)}</div><div class="item-sub">${esc(x.category)} ${x.characteristic?`• ${esc(x.characteristic)}`:''}</div><div class="source">${esc(x.source||'Custom')}</div></div><div class="item-actions"><button class="btn small primary" data-add-comp="${x.id}">Add</button><button class="btn small" data-edit-comp="${x.id}">Edit</button></div></div>${x.notes?`<div class="item-sub" style="margin-top:8px">${esc(x.notes)}</div>`:''}</div>`).join('')}</div>`:`<div class="empty">No matching compendium entries.</div>`;
        el('compList').querySelectorAll('[data-add-comp]').forEach(b=>b.onclick=()=>addCompendiumToCharacter(b.dataset.addComp));
        el('compList').querySelectorAll('[data-edit-comp]').forEach(b=>b.onclick=()=>editCompendiumEntry(b.dataset.editComp,()=>openCompendium(cat)));
      };
      el('compSearch').oninput=rerender;
      el('compTabs').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;el('compTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.cat===cat));rerender();});
      el('addCompEntry').onclick=()=>editCompendiumEntry(null,()=>openCompendium(cat));
      el('importPackBtn').onclick=()=>{closeModal();importFile.dataset.mode='compendium';importFile.click();};
      el('exportPackBtn').onclick=exportCompendium;
      rerender();
    });
  }

  function addCompendiumToCharacter(id) {
    const entry=state.compendium.find(x=>x.id===id); if(!entry)return;
    if(entry.category==='Skill') { closeModal(); editSkill(null,entry); }
    else if(entry.category==='Weapon') { closeModal(); editWeapon(null,entry); }
    else if(entry.category==='Gear') { closeModal(); editGear(null,entry); }
    else { closeModal(); editAbility(null,entry); }
  }

  function editCompendiumEntry(id, onDone) {
    const existing=id?state.compendium.find(x=>x.id===id):null;
    const x=existing||{id:uid(),category:'Other',name:'',characteristic:'',source:'Custom',notes:'',data:{}};
    openModal(existing?'Edit Compendium Entry':'Add Compendium Entry', `<form id="compEntryForm"><div class="field-grid two">${field('Name','ceName',x.name)}${selectField('Category','ceCat',['Skill','Ability','Talent','Trait','Weapon','Gear','Other'],x.category)}${selectField('Characteristic (for skills)','ceChar',[{value:'',label:'—'}].concat(CHAR_KEYS.map(k=>({value:k,label:k}))),x.characteristic||'')}${field('Source / Page','ceSource',x.source)}</div>${area('Notes / Quick Reference','ceNotes',x.notes,5)}<div id="weaponTemplateFields"></div><div class="modal-actions">${existing?'<button type="button" class="btn danger" data-delete>Delete</button>':''}<button class="btn primary" type="submit">Save</button></div></form>`,()=>{
      const wf=()=>{const isW=el('ceCat').value==='Weapon';el('weaponTemplateFields').innerHTML=isW?`<div class="divider"></div><div class="field-grid two">${field('Class','ceWClass',x.data?.class||'Ranged')}${field('Range','ceWRange',x.data?.range||'')}${field('Rate of Fire','ceWRof',x.data?.rof||'')}${field('Damage','ceWDamage',x.data?.damage||'')}${field('Penetration','ceWPen',x.data?.pen||'')}${field('Clip Size','ceWClip',x.data?.clipMax||0,'number','min="0"')}${field('Reload','ceWReload',x.data?.reload||'')}${field('Qualities','ceWQual',x.data?.qualities||'')}</div>`:'';};el('ceCat').onchange=wf;wf();
      el('compEntryForm').onsubmit=e=>{e.preventDefault();x.name=el('ceName').value.trim()||'Unnamed Entry';x.category=el('ceCat').value;x.characteristic=el('ceChar').value;x.source=el('ceSource').value.trim();x.notes=el('ceNotes').value;if(x.category==='Weapon')x.data={class:el('ceWClass').value.trim(),range:el('ceWRange').value.trim(),rof:el('ceWRof').value.trim(),damage:el('ceWDamage').value.trim(),pen:el('ceWPen').value.trim(),clipMax:Math.max(0,n(el('ceWClip').value)),reload:el('ceWReload').value.trim(),qualities:el('ceWQual').value.trim()};if(!existing)state.compendium.push(x);saveState();closeModal();showToast('Compendium saved');onDone?.();};
      if(existing)modalBody.querySelector('[data-delete]').onclick=()=>{state.compendium=state.compendium.filter(y=>y.id!==x.id);saveState();closeModal();onDone?.();};
    });
  }

  function openMenu() {
    const c=activeChar();
    openModal('Watch Fortress Menu', `<div class="menu-grid"><button class="btn" data-menu="characters"><strong>Characters</strong><small>Switch, create, duplicate</small></button><button class="btn" data-menu="compendium"><strong>Compendium</strong><small>Custom source packs</small></button><button class="btn" data-menu="export"><strong>Export Backup</strong><small>All characters + library</small></button><button class="btn" data-menu="import"><strong>Import Backup</strong><small>Restore JSON data</small></button><button class="btn" data-menu="export-char"><strong>Export Character</strong><small>${esc(c?.name||'Active character')}</small></button><button class="btn" data-menu="about"><strong>About</strong><small>Version & local storage</small></button></div>`,()=>{
      modalBody.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const a=b.dataset.menu;if(a==='characters')characterManager();if(a==='compendium')openCompendium();if(a==='export')exportAll();if(a==='import'){closeModal();importFile.dataset.mode='all';importFile.click();}if(a==='export-char')exportCharacter();if(a==='about')about();});
    });
  }

  function characterManager() {
    openModal('Characters', `<div class="list">${state.characters.map(c=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(c.name)}</div><div class="item-sub">${esc([c.chapter,c.speciality,c.rank].filter(Boolean).join(' • '))}</div></div><div class="item-actions"><button class="btn small" data-open-char="${c.id}">Open</button><button class="btn small" data-dup-char="${c.id}">Duplicate</button></div></div></div>`).join('')}</div><div class="modal-actions"><button class="btn primary" data-new>＋ New Character</button></div>`,()=>{
      modalBody.querySelectorAll('[data-open-char]').forEach(b=>b.onclick=()=>{state.activeId=b.dataset.openChar;saveState();closeModal();render();});
      modalBody.querySelectorAll('[data-dup-char]').forEach(b=>b.onclick=()=>duplicateCharacter(b.dataset.dupChar));
      modalBody.querySelector('[data-new]').onclick=newCharacter;
    });
  }

  function duplicateCharacter(id){const original=state.characters.find(c=>c.id===id);if(!original)return;const copy=structuredClone(original);copy.id=uid();copy.name=`${original.name} Copy`;copy.portrait=original.portrait;['armour','weapons','gear','skills','abilities','advances','effects'].forEach(k=>copy[k]=(copy[k]||[]).map(x=>({...x,id:uid()})));state.characters.push(copy);state.activeId=copy.id;saveState();closeModal();render();showToast('Character duplicated');}

  function downloadJSON(filename,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
  function safeName(s){return String(s||'deathwatch').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'deathwatch';}
  function exportAll(){downloadJSON(`deathwatch-companion-backup-${new Date().toISOString().slice(0,10)}.json`,state);showToast('Backup exported');}
  function exportCharacter(){const c=activeChar();downloadJSON(`${safeName(c.name)}-character.json`,{type:'deathwatch-companion-character',version:VERSION,character:c});showToast('Character exported');}
  function exportCompendium(){downloadJSON(`deathwatch-compendium-${new Date().toISOString().slice(0,10)}.json`,{type:'deathwatch-companion-compendium',version:VERSION,entries:state.compendium});showToast('Compendium exported');}

  importFile.addEventListener('change', async()=>{
    const f=importFile.files?.[0];if(!f)return;
    try{const data=JSON.parse(await f.text());const mode=importFile.dataset.mode||'all';if(mode==='compendium'){const entries=Array.isArray(data)?data:data.entries;if(!Array.isArray(entries))throw new Error('No compendium entries');state.compendium=mergeCompendium(state.compendium,entries);saveState();showToast(`${entries.length} entries imported`);}
      else if(data.type==='deathwatch-companion-character'&&data.character){const c=normalizeCharacter(data.character);c.id=uid();state.characters.push(c);state.activeId=c.id;saveState();render();showToast('Character imported');}
      else if(Array.isArray(data.characters)){state={...defaultState(),...data};state.characters=data.characters.map(normalizeCharacter);state.compendium=Array.isArray(data.compendium)?data.compendium:structuredClone(STARTER_COMPENDIUM);state.activeId=state.characters.some(c=>c.id===data.activeId)?data.activeId:state.characters[0]?.id;if(!state.characters.length){const c=createCharacter();state.characters=[c];state.activeId=c.id;}saveState();render();showToast('Backup restored');}
      else throw new Error('Unsupported file');
    }catch(err){console.error(err);showToast('Import failed: unsupported JSON');}finally{importFile.value='';delete importFile.dataset.mode;}
  });

  function mergeCompendium(existing,incoming){const byKey=new Map(existing.map(x=>[`${x.category}|${x.name}|${x.source}`.toLowerCase(),x]));incoming.forEach(raw=>{if(!raw?.name)return;const x={...raw,id:raw.id||uid()};const key=`${x.category||'Other'}|${x.name}|${x.source||''}`.toLowerCase();if(!byKey.has(key)){existing.push(x);byKey.set(key,x);}});return existing;}

  function about(){openModal('About Deathwatch Companion', `<p class="section-note"><strong>Version ${VERSION}</strong></p><p class="section-note">A local-first character companion prototype. Character data is stored in this browser/device using localStorage and can be exported as JSON.</p><p class="section-note">This app intentionally does not ship with copied rulebook text or complete proprietary item databases. Use source/page references and custom/imported entries for material you own.</p><p class="section-note">Install it from your browser’s “Add to Home Screen” / “Install App” option when served over HTTPS or localhost.</p><div class="modal-actions"><button class="btn" data-reset-starter>Restore Starter Library Entries</button><button class="btn primary" data-done>Done</button></div>`,()=>{modalBody.querySelector('[data-done]').onclick=closeModal;modalBody.querySelector('[data-reset-starter]').onclick=()=>{state.compendium=mergeCompendium(state.compendium,structuredClone(STARTER_COMPENDIUM));saveState();showToast('Starter entries restored');};});}

  closeModalBtn.onclick=closeModal;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.classList.contains('hidden'))closeModal();});
  el('rollBtn').onclick=quickRoll;
  el('menuBtn').onclick=openMenu;
  el('brandHome').onclick=()=>setView('overview');
  el('brandHome').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')setView('overview');};
  nav.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed',err)));
  }

  view = state.settings.lastView || 'overview';
  [...nav.querySelectorAll('[data-view]')].forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  render();
})();

  
</script>
</body>
</html>
