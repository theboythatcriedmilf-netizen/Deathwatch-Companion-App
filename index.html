<!doctype html>
<html lang="en" data-theme="parchment">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8cdb4">
<title>Adeptus Astartes Field Codex — Campaign Companion</title>
<style>
:root{
 --bg:#b9ad92;--panel:#eee5d2;--panel2:#dfd2b9;--ink:#1d1a16;--muted:#6a6153;
 --line:#887b66;--line2:#4d473d;--accent:#6e2024;--gold:#9a7a40;--good:#486448;
 --bad:#8a3439;--shadow:rgba(32,24,16,.24);--safe:env(safe-area-inset-bottom,0px);
 --purple:#80528d;
}
html[data-theme="iron"]{
 color-scheme:dark;--bg:#050607;--panel:#0e1113;--panel2:#171c20;--ink:#e8ebec;--muted:#a6adb0;
 --line:#424c52;--line2:#7d888e;--accent:#8d272c;--gold:#9fa9ad;--good:#8aa184;
 --bad:#c35c62;--shadow:rgba(0,0,0,.56);--purple:#c189cf;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(rgba(70,55,35,.03) 1px,transparent 1px),
 linear-gradient(90deg,rgba(70,55,35,.02) 1px,transparent 1px),
 radial-gradient(circle at 50% -10%,rgba(255,248,220,.35),transparent 36%);background-size:30px 30px,30px 30px,auto}
html[data-theme="iron"] body:before{background:
 linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px),
 radial-gradient(circle at 50% -10%,rgba(115,130,138,.12),transparent 38%);background-size:32px 32px,32px 32px,auto}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:0 auto;min-height:100vh;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 0 40px var(--shadow);position:relative}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 9px;display:flex;align-items:center;gap:10px}
.brand{flex:1}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:.64rem;color:var(--muted);font-weight:800}.brand strong{font-family:Georgia,serif;font-size:1.15rem}
.iconbtn,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:9px 11px}
.btn.primary{background:var(--line2);color:var(--panel);border-color:var(--line2);font-weight:800}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.main{padding:14px 14px calc(88px + var(--safe))}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);z-index:25;background:linear-gradient(180deg,var(--panel2),var(--panel));border-top:1px solid var(--line);padding:7px 6px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.nav button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:8px 2px;border-radius:7px}.nav button.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:800}
.card{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),var(--panel2));border-radius:10px;padding:13px;margin:10px 0;box-shadow:0 7px 18px var(--shadow)}
.card h2,.card h3{font-family:Georgia,serif;margin:.1em 0 .4em}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.small{font-size:.8rem;color:var(--muted)}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:.68rem;color:var(--muted);margin:2px}
.hero{text-align:center;padding:11px 0 6px}
.portrait{width:148px;height:148px;margin:0 auto 8px;border-radius:50%;overflow:hidden;border:4px double var(--line2);background:
 radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--panel2) 80%,white),var(--panel2));display:grid;place-items:center;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover}.portrait .placeholder{font-family:Georgia,serif;font-size:2.4rem;color:var(--muted)}
.hero h1{font-family:Georgia,serif;font-size:2rem;margin:3px 0}.subtitle{color:var(--muted);font-size:1rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:12px -14px 5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs button{border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:12px 6px;text-transform:uppercase;letter-spacing:.04em;font-size:.74rem}.tabs button.active{color:var(--accent);font-weight:900;background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.resource{border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center;background:color-mix(in srgb,var(--panel) 80%,transparent)}.resource b{font-size:1.4rem}.resource .controls{display:flex;justify-content:center;gap:5px;margin-top:6px}.resource button{width:32px;height:28px;padding:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:5px}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.char{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--panel);position:relative}.char b{display:block;font-size:1.55rem}.char small{color:var(--muted)}.char.rollable{cursor:pointer}.char.rollable:after{content:"d100";position:absolute;right:5px;top:4px;font-size:.55rem;color:var(--accent);font-weight:900}
.list{border-top:1px solid var(--line)}.listrow{padding:11px 2px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}.listrow .grow{flex:1}.link{color:var(--purple);font-weight:800;cursor:pointer}.link:hover{text-decoration:underline}.rollchip{border:1px solid var(--line);background:var(--panel2);color:var(--accent);border-radius:6px;padding:5px 7px;font-weight:800;min-width:52px}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.skillrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}.skillrow .name{flex:1}.trained{color:var(--purple);font-weight:800}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.sectionhead h2{margin:0;font-family:Georgia,serif}
.notice{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--panel));padding:10px;border-radius:7px;margin:9px 0;font-size:.82rem;line-height:1.45}
.field{margin:10px 0}.field label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:4px}.input,.select,.textarea,input,select,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px}.textarea,textarea{min-height:86px;resize:vertical}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel);color:var(--ink);text-align:left;position:relative}.choice.selected{box-shadow:inset 0 0 0 2px var(--accent)}.choice.disabled{opacity:.55}.choice .why{color:var(--bad);font-size:.7rem;margin-top:5px}.inspect{position:absolute;right:6px;top:6px;font-size:.64rem;border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:var(--purple)}
.stepbar{display:flex;gap:5px;overflow:auto;padding:4px 0 9px}.stepbar span{min-width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:var(--muted)}.stepbar span.active{background:var(--accent);color:white;border-color:var(--accent)}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding-top:60px}.modal{width:min(820px,100%);max-height:88vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:16px 16px 0 0;padding:16px 16px calc(18px + var(--safe));box-shadow:0 -20px 50px rgba(0,0,0,.45)}.modal h2{font-family:Georgia,serif;margin:.15em 0 .4em}.modal .close{float:right}.modalstack{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:.72rem;margin-bottom:5px}
.rollresult{text-align:center;padding:12px}.rollresult .die{font-size:3.6rem;font-weight:900;font-family:Georgia,serif}.success{color:var(--good)}.failure{color:var(--bad)}
.libraryfilters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.search{grid-column:1/-1}
.coverage{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.coverage .box{border:1px solid var(--line);border-radius:7px;padding:9px;background:var(--panel)}.coverage b{font-size:1.25rem;display:block}
.armourmap{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.armourloc{border:1px solid var(--line);border-radius:7px;padding:8px;display:flex;justify-content:space-between}
.quick{position:fixed;right:max(14px,calc((100vw - 820px)/2 + 14px));bottom:calc(86px + var(--safe));z-index:24;width:58px;height:58px;border-radius:50%;border:1px solid var(--line2);background:var(--accent);color:white;font-size:1.1rem;box-shadow:0 8px 22px var(--shadow)}
@media(max-width:560px){.choicegrid{grid-template-columns:1fr}.skillgrid{grid-template-columns:1fr}.resources{grid-template-columns:repeat(3,1fr)}.chars{grid-template-columns:repeat(3,1fr)}.nav button{font-size:.62rem}.coverage{grid-template-columns:1fr 1fr}}

.modepill{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.modepill button{border:0;background:transparent;color:var(--muted);padding:7px 10px;font-size:.72rem;font-weight:800}
.modepill button.active{background:var(--accent);color:white}
.gmdash{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.gmtool{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel);min-height:94px}
.gmtool b{display:block;font-family:Georgia,serif;margin-bottom:4px}
.quickref{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quickref .box{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel)}
.weaponrow{display:grid;grid-template-columns:1.4fr .7fr .65fr .8fr .75fr .55fr .55fr .65fr 1fr;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:.72rem}
.weaponrow.header{font-weight:900;color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.04em}
.weaponrow .wname{font-weight:800}
@media(max-width:700px){.weaponrow{grid-template-columns:1.3fr .7fr .65fr .8fr .6fr}.weaponrow .hide-mobile{display:none}.gmdash,.quickref{grid-template-columns:1fr}}


/* ==========================================================================
   HERALDRY SKINS
   Surface (Parchment / Cold Iron) controls brightness/material.
   Skin controls Chapter/Deathwatch heraldic accents.
   ========================================================================== */
html[data-skin="deathwatch"]{
  --accent:#8e2429;--gold:#a9afb2;--purple:#9da6aa;--line2:#30373b;
}
html[data-skin="black-templars"]{
  --accent:#17191b;--gold:#b9aa7a;--purple:#5a5f62;--line2:#222426;
}
html[data-theme="iron"][data-skin="black-templars"]{
  --accent:#d8d8d4;--gold:#a6996b;--purple:#aeb1b1;--line2:#d0d0ca;
}
html[data-skin="blood-angels"]{
  --accent:#8f171c;--gold:#bb8b33;--purple:#8f171c;--line2:#5f1115;
}
html[data-skin="dark-angels"]{
  --accent:#203d2c;--gold:#9a8155;--purple:#6f342f;--line2:#183222;
}
html[data-theme="iron"][data-skin="dark-angels"]{
  --accent:#5d8b69;--gold:#aaa07f;--purple:#a1665e;--line2:#718a76;
}
html[data-skin="space-wolves"]{
  --accent:#577387;--gold:#b79236;--purple:#607f91;--line2:#405a69;
}
html[data-skin="storm-wardens"]{
  --accent:#385c83;--gold:#a89056;--purple:#556f98;--line2:#2d4967;
}
html[data-skin="ultramarines"]{
  --accent:#244f91;--gold:#b08a37;--purple:#3d66a3;--line2:#1c3d72;
}
html[data-skin="raven-guard"]{
  --accent:#2d3032;--gold:#9ea4a7;--purple:#5c6368;--line2:#181a1b;
}
html[data-theme="iron"][data-skin="raven-guard"]{
  --accent:#aeb4b7;--gold:#727a7e;--purple:#8f989c;--line2:#c5cacd;
}

/* Heraldic top rule gives each skin a distinct but restrained identity. */
.topbar{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--accent) 75%,transparent)}
html[data-skin="blood-angels"] .topbar,
html[data-skin="ultramarines"] .topbar,
html[data-skin="space-wolves"] .topbar,
html[data-skin="storm-wardens"] .topbar,
html[data-skin="dark-angels"] .topbar,
html[data-skin="raven-guard"] .topbar,
html[data-skin="black-templars"] .topbar,
html[data-skin="deathwatch"] .topbar{
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 28%),
    linear-gradient(180deg,var(--panel),var(--panel2));
}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.skin-choice{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink);text-align:left}
.skin-choice.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.skin-swatch{height:18px;border-radius:999px;margin-bottom:6px;background:linear-gradient(90deg,var(--accent),var(--gold))}
@media(max-width:560px){.skin-grid{grid-template-columns:1fr}}


/* ==========================================================================
   v3.4 PLAYER SHEET — dense, glanceable, expandable.
   ========================================================================== */
.sheet-section{margin:12px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.sheet-section>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(180deg,var(--panel),var(--panel2));cursor:pointer;border-bottom:1px solid transparent}
.sheet-section[open]>summary{border-bottom-color:var(--line)}
.sheet-section>summary::-webkit-details-marker{display:none}
.sheet-section .section-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-weight:900;color:var(--accent);flex:none}
.sheet-section .section-title{flex:1}.sheet-section .section-title b{font-family:Georgia,serif;font-size:1.15rem}.sheet-section .section-title small{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
.sheet-section .section-content{padding:10px 12px 12px}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat-cell{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;background:color-mix(in srgb,var(--panel2) 55%,var(--panel))}
.stat-cell b{display:block;font-size:1.2rem}.stat-cell small{color:var(--muted)}
.feature-card{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}.feature-card:last-child{border-bottom:0}.feature-card .feature-type{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.compact-summary{color:var(--muted);font-size:.8rem;line-height:1.4;margin-top:3px}
.weapon-card{border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0;background:color-mix(in srgb,var(--panel2) 45%,var(--panel))}
.weapon-top{display:flex;gap:8px;align-items:flex-start}.weapon-name{flex:1}.weapon-name b{font-size:1rem}.weapon-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.weapon-stat{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-top:5px}.weapon-stat small{display:block;color:var(--muted);font-size:.62rem;text-transform:uppercase}.weapon-stat b{font-size:.78rem}
.weapon-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.psi-card{border-left:3px solid var(--purple);padding:8px 10px;margin:6px 0;background:color-mix(in srgb,var(--purple) 5%,var(--panel));border-radius:0 8px 8px 0}
.psi-card .psi-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.item-line{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}.item-line:last-child{border-bottom:0}
.sheet-note{white-space:pre-wrap;line-height:1.45}
.quick.chapter-roll{width:62px;height:62px;padding:0;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--gold) 65%,var(--line));background:
 radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 85%,white),var(--accent) 52%,color-mix(in srgb,var(--accent) 75%,black));overflow:hidden}
.quick.chapter-roll svg{width:37px;height:37px;fill:none;stroke:white;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.quick.chapter-roll .glyphtext{color:white;font-family:Georgia,serif;font-size:1.7rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.quick.chapter-roll:after{content:"d100";position:absolute;bottom:-4px;right:-5px;font-size:.52rem;background:var(--panel);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 4px;font-weight:900}
.inline-add{border:0;background:transparent;color:var(--accent);font-weight:900;padding:4px 0}
.empty-state{padding:10px 0;color:var(--muted);font-style:italic}
.class-banner{border-left:4px solid var(--accent);padding:8px 10px;background:color-mix(in srgb,var(--accent) 6%,var(--panel));border-radius:6px;margin-bottom:8px}
@media(max-width:560px){.stat-strip{grid-template-columns:repeat(2,1fr)}.weapon-stats{grid-template-columns:repeat(3,1fr)}}

</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="kicker" id="modeKicker">Battle-Brother Tactical Archive</div><strong>Adeptus Astartes Field Codex</strong></div><button class="iconbtn" id="modeBtn" title="Player / Game Master">P</button><button class="iconbtn" id="themeBtn" title="Appearance">◐</button></header>
<main class="main" id="app"></main>
</div>
<nav class="nav" id="nav"></nav>
<button class="quick" id="quickRoll" title="Quick d100">d100</button>
<script>
const VERSION="3.4.0";

ach."},{"id":"raven-guard","name":"Raven Guard","source":"First Founding reference supplied by user","page":"16–19","summary":"Masters of stealth, reconnaissance, infiltration, patience, and sudden overwhelming action from unexpected directions.","mods":{"Ag":5,"Per":5},"demeanour":"Son of Night","solo":"Master of the Shadows","restrictions":[],"notes":"Supplemental Chapter package. User-provided reference also includes Chapter advances, Squad Mode abilities, psychic powers, pasts, and trappings.","extras":[{"name":"Master of the Shadows","type":"Solo Mode","summary":"In Solo Mode, Raven Guard may re-roll failed Concealment, Shadowing, and Silent Move Tests; later Ranks improve surprise attacks and covert tests."},{"name":"Exploit Weakness","type":"Attack Pattern","summary":"Half Action, Cohesion 4: single out one enemy so Battle-Brothers in Support Range can re-roll damage against it until the start of your next turn."},{"name":"Evasive Manoeuvres","type":"Defensive Stance","summary":"Full Action, Cohesion 3, Sustained: Battle-Brothers in Support Range avoid triggering Overwatch and gain +20 to resist Pinning; improves with Rank."},{"name":"Guerrilla Training","type":"Talent","summary":"Special Raven Guard training intended to let their covert-operational expertise function even in bulky power armour."},{"name":"Corax's Ingenuity","type":"Psychic Power","summary":"A short-lived group-support psychic effect themed around surprise, timing, and Corax's battlefield doctrine."},{"name":"Curse of the Raven","type":"Psychic Power","summary":"A sustained psychic curse that exposes a chosen opponent's vulnerabilities to the Kill-team."},{"name":"The Unkindness of Deliverance","type":"Psychic Power","summary":"A psychic manifestation of ravens used to harry, distract, or injure opponents."}]}],"specialities":[{"id":"apothecary","name":"Deathwatch Apothecary","role":"Battlefield medic and guardian of gene-seed","source":"Core Rulebook","page":"68","summary":"Supports the Kill  }else if(tab==="advance"){
   body.innerHTML=`<div class="card"><div class="resources"><div class="resource"><div class="kicker">Rank</div><b>${c.rank}</b></div><div class="resource"><div class="kicker">XP Available</div><b>${c.xpAvailable}</b></div><div class="resource"><div class="kicker">XP Spent</div><b>${c.xpSpent}</b></div></div></div>
   <div class="notice">Characteristic advances proceed through ordered +5 steps. Rank is based on total XP spent. Inspect an advance or prerequisite before recording it.</div>
   ${ch?.id==="raven-guard"?`<div class="sectionhead"><h2>Raven Guard Chapter Advances</h2></div><div class="list">${SEED.ravenAdvances.map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(x.type)}${x.prereq?` • Requires ${esc(x.prereq)}`:""}</div></div><b>${x.cost} XP</b></div>`).join("")}</div>`:""}
   <div class="sectionhead"><h2>Recorded Advances</h2><button class="btn" id="addAdvance">Add</button></div><div class="list">${(c.advances||[]).map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(x.notes||"")}</div></div><b>${x.cost||0} XP</b></div>`).join("")||`<div class="small">No advances recorded.</div>`}</div>`;
 }else{
   let quick=[...(ch?.extras||[]),...(sp?.abilityChoices||[]),...(c.psychic||[]).map(n=>findAny(n))];
   body.innerHTML=`<div class="sectionhead"><h2>Quick Access</h2></div><div class="notice">Tap any named rule to inspect it without losing your place. This page is intentionally short enough to use during a combat turn.</div><div class="list">${quick.map(x=>`<div class="listrow"><div class="grow"><span class="link" data-inspect="${esc(x.name)}">${esc(x.name)}</span><div class="small">${esc(x.summary||findAny(x.name)?.summary||"")}</div></div></div>`).join("")||`<div class="small">Chapter, Speciality and psychic abilities appear here after character creation.</div>`}</div>
   <div class="sectionhead"><h2>Resources</h2></div><div class="resources">${resource("Wounds",c.wounds,"wounds")}${resource("Fate",c.fate,"fate")}<div class="resource"><div class="kicker">Renown</div><b>${c.renown}</b></div></div>
   <div class="sectionhead"><h2>Weapons</h2></div>${(c.weapons||[]).map(n=>{let w=weaponRecord(n);return w?`<div class="weapon-card"><div class="row between"><span class="link" data-weapon="${esc(w.name)}"><b>${esc(w.name)}</b></span><button class="rollchip" data-weapon-roll="${esc(w.name)}">${w.kind==="Melee"?"WS":"BS"}</button></div><div class="small">${esc(w.damage||"")} • Pen ${esc(w.pen||"—")}${w.special?` • ${esc(w.special)}`:""}</div></div>`:""}).join("")}</div>`;

 body.querySelectorAll("[data-char]").forEach(el=>el.onclick=()=>openRoll(CHAR_NAMES[el.dataset.char],derivedCharacter(c,el.dataset.char)));
 body.querySelectorAll("[data-skill]").forEach(el=>el.onclick=()=>openRoll(el.dataset.skill,+el.dataset.target));
 body.querySelectorAll("[data-skill-info]").forEach(el=>el.onclick=()=>inspectRecord(skillInfo(el.dataset.skillInfo),"Character Sheet"));
 body.querySelectorAll("[data-inspect]").forEach(el=>el.onclick=()=>inspectRecord(findAny(el.dataset.inspect),"Character Sheet"));
 body.querySelectorAll("[data-armour]").forEach(el=>el.onclick=()=>inspectRecord(findAny(armour(el.dataset.armour)?.name)||armour(el.dataset.armour),"Character Sheet"));
 body.querySelectorAll("[data-spec-info]").forEach(el=>el.onclick=()=>inspectRecord(spec(el.dataset.specInfo),"Character Sheet"));
 body.querySelectorAll("[data-chapter-info]").forEach(el=>el.onclick=()=>inspectRecord(chapter(el.dataset.chapterInfo),"Character Sheet"));
 body.querySelectorAll("[data-weapon]").forEach(el=>el.onclick=()=>inspectWeapon(weaponRecord(el.dataset.weapon),"Character Sheet"));
 body.querySelectorAll("[data-weapon-roll]").forEach(el=>el.onclick=()=>{let w=weaponRecord(el.dataset.weaponRoll);openRoll(`${w.name} — ${w.kind==="Melee"?"Weapon Skill":"Ballistic Skill"}`,derivedCharacter(c,w.kind==="Melee"?"WS":"BS"))});
 body.querySelectorAll("[data-res]").forEach(el=>el.onclick=()=>{let o=c[el.dataset.res],d=+el.dataset.d;o.current=Math.max(0,Math.min(o.max,o.current+d));save();renderSheet()});
 body.querySelectorAll("[data-num]").forEach(el=>el.onclick=()=>{let k=el.dataset.num;c[k]=Math.max(0,(+c[k]||0)+(+el.dataset.d));save();renderSheet()});
 body.querySelectorAll("[data-delitem]").forEach(el=>el.onclick=()=>{c.inventory.splice(+el.dataset.delitem,1);save();renderSheet()});
 body.querySelectorAll("[data-delweapon]").forEach(el=>el.onclick=()=>{c.weapons.splice(+el.dataset.delweapon,1);save();renderSheet()});
 if(document.getElementById("charNotes"))document.getElementById("charNotes").onchange=e=>{c.notes=e.target.value;save()};

 if(document.getElementById("addItem"))document.getElementById("addItem").onclick=()=>modal("Add Equipment",`<div class="field"><label>Name</label><input id="inName"></div><div class="field"><label>Quantity</label><input id="inQty" type="number" value="1"></div><div class="field"><label>What it is / what it does</label><textarea id="inNotes"></textarea></div><button class="btn primary" id="inSave">Save</button>`,(b,m)=>m.querySelector("#inSave").onclick=()=>{c.inventory.push({name:m.querySelector("#inName").value||"Item",qty:+m.querySelector("#inQty").value||1,notes:m.querySelector("#inNotes").value});save();b.remove();renderSheet()});

 if(document.getElementById("addWeapon"))document.getElementById("addWeapon").onclick=()=>modal("Add Weapon",`<div class="field"><label>Reference Weapon</label><select id="wRef"><option value="">Custom entry</option>${[...RANGED_REFERENCE,...MELEE_REFERENCE].map(w=>`<option value="${esc(w.name)}">${esc(w.name)}</option>`).join("")}</select></div><div class="field"><label>Custom Name</label><input id="wCustom" placeholder="Used only when Custom entry is selected"></div><button class="btn primary" id="wSave">Add</button>`,(b,m)=>m.querySelector("#wSave").onclick=()=>{let n=m.querySelector("#wRef").value||m.querySelector("#wCustom").value||"Custom Weapon";c.weapons.push(n);save();b.remove();renderSheet()});

 if(document.getElementById("addPsychic"))document.getElementById("addPsychic").onclick=()=>modal("Add Psychic Power",`<div class="field"><label>Power</label><select id="pRef"><option value="">Choose…</option>${SEED.psychic.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} — ${esc(p.discipline||"Psychic")}</option>`).join("")}</select></div><button class="btn primary" id="pSave">Add</button>`,(b,m)=>m.querySelector("#pSave").onclick=()=>{let n=m.querySelector("#pRef").value;if(n&&!c.psychic.includes(n))c.psychic.push(n);save();b.remove();renderSheet()});

 if(document.getElementById("addAdvance"))document.getElementById("addAdvance").onclick=()=>modal("Record Advance",`<div class="field"><label>Name</label><input id="adName"></div><div class="field"><label>XP Cost</label><input id="adCost" type="number" value="0"></div><div class="field"><label>Notes</label><textarea id="adNotes"></textarea></div><button class="btn primary" id="adSave">Save</button>`,(b,m)=>m.querySelector("#adSave").onclick=()=>{c.advances=c.advances||[];let cost=+m.querySelector("#adCost").value||0;c.advances.push({name:m.querySelector("#adName").value||"Advance",cost,notes:m.querySelector("#adNotes").value});c.xpSpent+=cost;c.xpAvailable=Math.max(0,c.xpAvailable-cost);save();b.remove();renderSheet()});

function builder(){
 const c=active();let st=c.builder?.step||1;let ch=chapter(c.chapter),sp=spec(c.speciality);
 let content="";
 if(st===1){
   content=`<div class="card"><h2>Stage 1 — Characteristics</h2><p>Generate all nine Characteristics before Chapter modifiers. The standard method is 2d10 + 30 for each characteristic, with one optional reroll that must replace the original result.</p><div class="field"><label>Method</label><select id="buildMethod"><option value="roll" ${c.builder.method==="roll"?"selected":""}>2d10 + 30</option><option value="points" ${c.builder.method==="points"?"selected":""}>100-point allocation</option></select></div><div class="chars">${CHAR_KEYS.map(k=>`<div class="char"><small>${k}</small><b>${c.characteristics[k]}</b>${c.builder.method==="roll"?`<button class="btn" data-rollchar="${k}">Roll</button>`:`<input data-pointchar="${k}" type="number" min="30" max="50" value="${c.characteristics[k]}">`}</div>`).join("")}</div>${c.builder.method==="roll"?`<div class="notice">One reroll is available. Tap a rolled Characteristic and use the reroll control before continuing.</div>`:`<div class="notice">Begin at 30 in every Characteristic and distribute 100 additional points, with no more than 20 additional points in one Characteristic.</div>`}</div>`;
 }else if(st===2){
   content=`<div class="card"><h2>Stage 2 — Chapter</h2><p>Chapter affects characteristics, Demeanour, Solo Mode, restrictions, and later advancement choices. You can inspect every Chapter before selecting it.</p><div class="choicegrid">${SEED.chapters.map(x=>`<button class="choice ${c.chapter===x.id?"selected":""}" data-ch="${x.id}"><span class="inspect" data-chinfo="${x.id}">READ</span><b>${esc(x.name)}</b><div class="small">${esc(x.summary)}</div><div>${Object.entries(x.mods||{}).map(([k,v])=>`<span class="tag">${k} +${v}</span>`).join("")}</div></button>`).join("")}</div></div>`;
 }else if(st===3){
   content=`<div class="card"><h2>Stage 3 — Speciality</h2><p>Speciality defines the Battle-Brother's role and influences starting Skills, abilities, and later advancement. Unavailable choices stay readable.</p><div class="choicegrid">${SEED.specialities.map(x=>{let blocked=(ch?.restrictions||[]).includes(x.id);return `<button class="choice ${c.speciality===x.id?"selected":""} ${blocked?"disabled":""}" data-sp="${x.id}" data-blocked="${blocked?1:0}"><span class="inspect" data-spinfo="${x.id}">READ</span><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div>${blocked?`<div class="why">Unavailable to ${esc(ch?.name||"this Chapter")}</div>`:""}</button>`}).join("")}</div></div>`;
 }else if(st===4){
   content=`<div class="card"><h2>Stage 4 — Wounds, Fate, Movement & XP</h2><div class="notice">Starting Wounds are determined from a d5 roll plus the Space Marine baseline, with applicable Chapter adjustments. Starting characters have a pre-existing XP baseline plus 1,000 XP available for initial advances.</div><div class="resources"><div class="resource"><div class="kicker">Wounds</div><b>${c.wounds.max}</b><button class="btn" id="rollWounds">Roll</button></div><div class="resource"><div class="kicker">Fate</div><b>${c.fate.max}</b><button class="btn" id="rollFate">Roll d10</button></div><div class="resource"><div class="kicker">Starting XP</div><b>1,000</b><div class="small">available</div></div></div><div class="card"><b>Movement reminder</b><p class="small">Movement uses Agility Bonus, with Astartes power armour improving the value used for movement.</p></div></div>`;
 }else if(st===5){
   content=`<div class="card"><h2>Stage 5 — Armour & Inventory</h2><p>The Companion assigns Astartes power armour as the Core protective baseline. Mission equipment can be recorded in the editable Inventory after creation.</p><button class="choice selected" data-armourinfo="power-armour"><b>Astartes Power Armour</b><div class="small">Tap to inspect protection and integrated systems.</div></button><div class="notice">Inventory remains deliberately editable so the GM can apply campaign-specific, supplement, or homebrew items without altering canonical character data.</div></div>`;
 }else if(st===6){
   content=`<div class="card"><h2>Stage 6 — Give the Character Life</h2><div class="field"><label>Name</label><input id="bName" value="${esc(c.name)}"></div><div class="field"><label>Appearance</label><textarea id="bAppearance">${esc(c.appearance||"")}</textarea></div><div class="field"><label>Past Event</label><textarea id="bPast">${esc(c.past||"")}</textarea></div><div class="field"><label>Power Armour History</label><textarea id="bHistory">${esc(c.armourHistory||"")}</textarea></div><div class="field"><label>Personal Demeanour</label><input id="bDem" value="${esc(c.demeanour||"")}"></div></div>`;
 }else{
   content=`<div class="card"><h2>Stage 7 — Review</h2><div class="list"><div class="listrow"><b>Chapter</b><div class="grow"></div><span>${esc(ch?.name||"Not chosen")}</span></div><div class="listrow"><b>Speciality</b><div class="grow"></div><span>${esc(sp?.name||"Not chosen")}</span></div><div class="listrow"><b>Wounds</b><div class="grow"></div><span>${c.wounds.max}</span></div><div class="listrow"><b>Fate</b><div class="grow"></div><span>${c.fate.max}</span></div></div><button class="btn primary" id="finishBuild">Complete Character</button></div>`;
 }
 set(`<div class="stepbar">${[1,2,3,4,5,6,7].map(n=>`<span class="${n===st?"active":""}">${n}</span>`).join("")}</div>${content}<div class="row between"><button class="btn" id="prevStep" ${st<=1?"disabled":""}>Back</button><button class="btn primary" id="nextStep" ${st>=7?"disabled":""}>Continue</button></div>`);
 document.getElementById("prevStep").onclick=()=>{saveBuilderFields();c.builder.step=Math.max(1,st-1);save();builder()};
 document.getElementById("nextStep").onclick=()=>{saveBuilderFields();c.builder.step=Math.min(7,st+1);save();builder()};
 if(document.getElementById("buildMethod"))document.getElementById("buildMethod").onchange=e=>{c.builder.method=e.target.value;if(e.target.value==="points")CHAR_KEYS.forEach(k=>c.characteristics[k]=30);save();builder()};
 document.querySelectorAll("[data-rollchar]").forEach(b=>b.onclick=()=>{let k=b.dataset.rollchar;let r=Math.floor(Math.random()*10)+1+Math.floor(Math.random()*10)+1+30;c.characteristics[k]=r;c.builder.rolls[k]=r;save();builder()});
 document.querySelectorAll("[data-pointchar]").forEach(i=>i.onchange=()=>{let val=Math.max(30,Math.min(50,+i.value||30));c.characteristics[i.dataset.pointchar]=val;save();builder()});
 document.querySelectorAll("[data-chinfo]").forEach(b=>b.onclick=e=>{e.stopPropagation();inspectRecord(chapter(b.dataset.chinfo),"Character Creation")});
 document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=e=>{if(e.target.dataset.chinfo)return;c.chapter=b.dataset.ch;let x=chapter(c.chapter);applyTheme();if(x?.demeanour&&!c.demeanour)c.demeanour=x.demeanour;save();builder()});
 document.querySelectorAll("[data-spinfo]").forEach(b=>b.onclick=e=>{e.stopPropagation();inspectRecord(spec(b.dataset.spinfo),"Character Creation")});
 document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=e=>{if(e.target.dataset.spinfo)return;if(b.dataset.blocked==="1"){inspectRecord(spec(b.dataset.sp),"Unavailable option");return}c.speciality=b.dataset.sp;save();builder()});
 if(document.getElementById("rollWounds"))document.getElementById("rollWounds").onclick=()=>{let x=Math.floor(Math.random()*5)+1+18+(ch?.woundsBonus||0);c.wounds={max:x,current:x};save();builder()};
 if(document.getElementById("rollFate"))document.getElementById("rollFate").onclick=()=>{let r=Math.floor(Math.random()*10)+1,x=r<=7?3:r<=9?4:5;c.fate={max:x,current:x};save();builder()};
 document.querySelectorAll("[data-armourinfo]").forEach(b=>b.onclick=()=>inspectRecord(armour(b.dataset.armourinfo),"Character Creation"));
 if(document.getElementById("finishBuild"))document.getElementById("finishBuild").onclick=()=>{saveBuilderFields();c.builder.completed=true;c.rank=1;c.xpAvailable=1000;c.xpTotal=12000;let chx=chapter(c.chapter);if(chx){for(let [k,v] of Object.entries(chx.mods||{})){if(!c.builder.chapterModsApplied){c.characteristics[k]+=v}}c.builder.chapterModsApplied=true}c.armour="power-armour";ensureStartingWargear(c);let spx=spec(c.speciality);if(spx?.id==="librarian"&&!(c.psychic||[]).length)c.psychic=["Inspire"];c.abilities=[...(chx?.extras||[]).map(x=>x.name),...(spx?.abilityChoices||[]).slice(0,1).map(x=>x.name)];save();state.activeView="sheet";save();render()};
 function saveBuilderFields(){if(st===6){c.name=document.getElementById("bName")?.value||c.name;c.appearance=document.getElementById("bAppearance")?.value||"";c.past=document.getElementById("bPast")?.value||"";c.armourHistory=document.getElementById("bHistory")?.value||"";c.demeanour=document.getElementById("bDem")?.value||c.demeanour}}
}
function mission(){
 let m=state.mission;set(`<div class="card"><div class="kicker">Kill-team Mission</div><h2>${esc(m.name||"Unnamed Mission")}</h2><div class="field"><label>Mission Name</label><input id="mName" value="${esc(m.name)}"></div><div class="field"><label>Status</label><select id="mStatus">${["Planning","Active","Complete"].map(x=>`<option ${m.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Squad Leader</label><input id="mLeader" value="${esc(m.leader)}"></div><div class="field"><label>Oath</label><select id="mOath"><option value="">None selected</option>${SEED.oaths.map(x=>`<option value="${esc(x.name)}" ${m.oath===x.name?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div class="resources"><div class="resource"><div class="kicker">Cohesion</div><b>${m.cohesion.current}/${m.cohesion.max}</b><div class="controls"><button id="cohMinus">−</button><button id="cohPlus">+</button></div></div><div class="resource"><div class="kicker">Requisition</div><b>${m.requisition}</b></div><div class="resource"><div class="kicker">Status</div><b style="font-size:1rem">${esc(m.status)}</b></div></div></div>
 <div class="sectionhead"><h2>Oaths</h2></div><div class="list">${SEED.oaths.map(x=>`<div class="listrow"><div class="grow"><span class="link" data-oath="${esc(x.name)}">${esc(x.name)}</span><div class="small">${esc(x.prereq)}</div></div></div>`).join("")}</div>
 <div class="sectionhead"><h2>Objectives</h2><button class="btn" id="addObj">Add</button></div><div class="list">${m.objectives.map((x,i)=>`<div class="listrow"><input type="checkbox" data-obj="${i}" ${x.done?"checked":""}><div class="grow">${esc(x.text)}</div><button class="btn danger" data-delobj="${i}">×</button></div>`).join("")||`<div class="small">No objectives recorded.</div>`}</div>
 <div class="card"><div class="field"><label>Mission Notes</label><textarea id="mNotes">${esc(m.notes)}</textarea></div></div>`);
 ["mName","mLeader","mNotes"].forEach(id=>document.getElementById(id).onchange=e=>{m[{mName:"name",mLeader:"leader",mNotes:"notes"}[id]]=e.target.value;save()});
 document.getElementById("mStatus").onchange=e=>{m.status=e.target.value;save();mission()};document.getElementById("mOath").onchange=e=>{m.oath=e.target.value;save()};
 document.getElementById("cohMinus").onclick=()=>{m.cohesion.current=Math.max(0,m.cohesion.current-1);save();mission()};document.getElementById("cohPlus").onclick=()=>{m.cohesion.max=Math.max(m.cohesion.max,m.cohesion.current+1);m.cohesion.current++;save();mission()};
 document.querySelectorAll("[data-oath]").forEach(x=>x.onclick=()=>inspectRecord(SEED.oaths.find(o=>o.name===x.dataset.oath),"Mission"));
 document.getElementById("addObj").onclick=()=>modal("Add Objective",`<div class="field"><label>Objective</label><input id="objText"></div><button class="btn primary" id="objSave">Save</button>`,(b,mm)=>mm.querySelector("#objSave").onclick=()=>{m.objectives.push({text:mm.querySelector("#objText").value||"Objective",done:false});save();b.remove();mission()});
 document.querySelectorAll("[data-obj]").forEach(x=>x.onchange=()=>{m.objectives[+x.dataset.obj].done=x.checked;save()});document.querySelectorAll("[data-delobj]").forEach(x=>x.onclick=()=>{m.objectives.splice(+x.dataset.delobj,1);save();mission()})
}
function library(){
 let core=[...SEED.rules,...SEED.armours,...SEED.psychic,...SEED.implants,...SEED.baseline.talents,...SEED.baseline.traits,...SEED.oaths,...RANGED_REFERENCE.map(x=>({...x,category:"Ranged Weapon",summary:`${x.class} • ${x.range} • RoF ${x.rof} • ${x.damage} • Pen ${x.pen} • Clip ${x.clip} • Reload ${x.reload}${x.special?` • ${x.special}`:""}`})),...MELEE_REFERENCE.map(x=>({...x,category:"Melee Weapon"}))];
 SEED.chapters.forEach(c=>core.push({...c,category:"Chapter"},...(c.extras||[])));
 SEED.specialities.forEach(s=>core.push({...s,category:"Speciality"},...(s.abilityChoices||[])));
 SEED.skills.forEach(s=>core.push({name:s.name,category:"Skill",summary:`${s.skillType} Skill linked to ${CHAR_NAMES[s.characteristic]||s.characteristic}.${s.descriptor?` ${s.descriptor}.`:""}`}));
 core=core.map(x=>({...x,category:x.category||x.type||x.discipline||"Reference"}));
 let cats=["All",...new Set(core.map(x=>x.category))].sort();set(`<div class="card"><h2>Data Librarium</h2><p class="small">Readable rules reference. Tap an entry to inspect it without leaving your current context.</p><div class="libraryfilters"><input class="input search" id="libSearch" placeholder="Search rules, Chapters, Skills, armour, psychic powers…"><select id="libCat">${cats.map(x=>`<option>${esc(x)}</option>`).join("")}</select><select id="libSource"><option>All sources</option><option>Core Rulebook</option><option>First Founding reference supplied by user</option><option>Homebrew</option></select></div><div class="small" id="libCount"></div></div><div class="list" id="libList"></div>`);
 function go(){let q=document.getElementById("libSearch").value.toLowerCase(),cat=document.getElementById("libCat").value,src=document.getElementById("libSource").value;let hb=state.homebrew.map(x=>({...x,category:x.category||"Homebrew",source:"Homebrew"}));let rows=[...core,...hb].filter(x=>(cat==="All"||x.category===cat)&&(src==="All sources"||x.source===src)&&(!q||`${x.name} ${x.summary||""} ${x.category||""}`.toLowerCase().includes(q)));document.getElementById("libCount").textContent=`${rows.length} entries`;document.getElementById("libList").innerHTML=rows.map((x,i)=>`<div class="listrow"><div class="grow"><span class="link" data-lib="${i}">${esc(x.name)}</span><div class="small">${esc(x.category)}${x.source?` • ${esc(x.source)}`:""}</div><div class="small">${esc(x.summary||"")}</div></div></div>`).join("");document.querySelectorAll("[data-lib]").forEach(el=>el.onclick=()=>inspectRecord(rows[+el.dataset.lib],"Librarium"))}
 ["libSearch","libCat","libSource"].forEach(id=>document.getElementById(id).addEventListener(id==="libSearch"?"input":"change",go));go()
}

function gmhome(){
 const m=state.mission,e=state.encounter;
 set(`<div class="card"><div class="kicker">Game Master Command Console</div><h2>${esc(m.name||"Current Operation")}</h2><p class="small">A fast-control surface for running the table: mission state, encounter timing, player resources, NPC profiles, and rules lookup without leaving the GM view.</p><div class="modepill"><button class="${state.appMode==="player"?"active":""}" id="gmToPlayer">Player View</button><button class="${state.appMode==="gm"?"active":""}" id="gmToGM">Game Master</button></div></div>
 <div class="gmdash">
  <div class="gmtool"><b>Mission</b><div class="small">${esc(m.status)} • Cohesion ${m.cohesion.current}/${m.cohesion.max}</div><button class="btn" data-jump="mission">Open</button></div>
  <div class="gmtool"><b>Encounter</b><div class="small">Round ${e.round} • ${e.combatants.length} combatants</div><button class="btn" data-jump="encounter">Run</button></div>
  <div class="gmtool"><b>Roster</b><div class="small">${state.characters.length} player character${state.characters.length===1?"":"s"}</div><button class="btn" data-jump="sheet">Open active</button></div>
  <div class="gmtool"><b>NPC Profiles</b><div class="small">${state.gmProfiles.length} saved GM profile${state.gmProfiles.length===1?"":"s"}</div><button class="btn" data-jump="gm">Manage</button></div>
 </div>
 <div class="sectionhead"><h2>Player Resource Monitor</h2></div>
 <div class="list">${state.characters.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="small">${esc(chapter(c.chapter)?.name||"No Chapter")} • Rank ${c.rank}</div></div><span class="tag">W ${c.wounds.current}/${c.wounds.max}</span><span class="tag">F ${c.fate.current}/${c.fate.max}</span><span class="tag">Fat ${c.fatigue}</span></div>`).join("")}</div>
 <div class="sectionhead"><h2>Quick Reference</h2></div>
 <div class="quickref">
   <div class="box"><b>Test Difficulty</b>${QUICK_REFERENCE.difficulty.map(x=>`<div class="row between small"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div>
   <div class="box"><b>Hit Location</b>${QUICK_REFERENCE.hitLocations.map(x=>`<div class="row between small"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div>
 </div>`);
 document.getElementById("gmToPlayer").onclick=()=>switchMode("player");
 document.getElementById("gmToGM").onclick=()=>switchMode("gm");
 document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>setView(b.dataset.jump));
}
function encounter(){
 let e=state.encounter;
 set(`<div class="card"><div class="row between"><div><div class="kicker">Encounter Tracker</div><h2>Round ${e.round}</h2></div><div><button class="btn" id="prevRound">− Round</button> <button class="btn primary" id="nextRound">+ Round</button></div></div><p class="small">Track initiative, Wounds, conditions, notes, and turn order for both PCs and NPCs from one screen.</p><button class="btn primary" id="addCombatant">Add Combatant</button></div>
 <div class="list">${e.combatants.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="small">Initiative ${x.init||0} • ${esc(x.kind||"NPC")}${x.notes?` • ${esc(x.notes)}`:""}</div></div><span class="tag">W ${x.currentWounds}/${x.maxWounds}</span><button class="btn" data-dmg="${i}">−W</button><button class="btn" data-heal="${i}">+W</button><button class="btn danger" data-delc="${i}">×</button></div>`).join("")||`<div class="small">No combatants yet.</div>`}</div>`);
 document.getElementById("prevRound").onclick=()=>{e.round=Math.max(1,e.round-1);save();encounter()};
 document.getElementById("nextRound").onclick=()=>{e.round++;save();encounter()};
 document.getElementById("addCombatant").onclick=()=>modal("Add Combatant",`<div class="field"><label>Name</label><input id="ecName"></div><div class="field"><label>Kind</label><select id="ecKind"><option>NPC</option><option>Player Character</option><option>Horde</option><option>Elite</option><option>Master</option></select></div><div class="field"><label>Initiative</label><input id="ecInit" type="number" value="0"></div><div class="field"><label>Wounds</label><input id="ecW" type="number" value="10"></div><div class="field"><label>Notes / Conditions</label><textarea id="ecNotes"></textarea></div><button class="btn primary" id="ecSave">Add</button>`,(b,m)=>m.querySelector("#ecSave").onclick=()=>{let w=+m.querySelector("#ecW").value||0;e.combatants.push({name:m.querySelector("#ecName").value||"Combatant",kind:m.querySelector("#ecKind").value,init:+m.querySelector("#ecInit").value||0,maxWounds:w,currentWounds:w,notes:m.querySelector("#ecNotes").value});e.combatants.sort((a,b)=>b.init-a.init);save();b.remove();encounter()});
 document.querySelectorAll("[data-dmg]").forEach(b=>b.onclick=()=>{let x=e.combatants[+b.dataset.dmg];x.currentWounds=Math.max(0,x.currentWounds-1);save();encounter()});
 document.querySelectorAll("[data-heal]").forEach(b=>b.onclick=()=>{let x=e.combatants[+b.dataset.heal];x.currentWounds=Math.min(x.maxWounds,x.currentWounds+1);save();encounter()});
 document.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>{e.combatants.splice(+b.dataset.delc,1);save();encounter()});
}
function switchMode(mode){
 state.appMode=mode;
 state.activeView=mode==="gm"?"gmhome":"sheet";
 save();render();
}

function gm(){
 set(`<div class="card"><h2>GM Profiles</h2><p class="small">Create adversaries or NPCs with Characteristics, Wounds, armour, Skills, Talents, Traits, special rules, and notes. Equipment details remain free-form.</p><button class="btn primary" id="addGM">Create Profile</button></div><div class="list">${state.gmProfiles.map((x,i)=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(x.tier||"NPC")} • ${x.wounds||0} Wounds</div></div><button class="btn" data-gmedit="${i}">Edit</button><button class="btn danger" data-gmdel="${i}">×</button></div>`).join("")||`<div class="small">No GM profiles yet.</div>`}</div>`);
 function edit(idx=null){let x=idx===null?{name:"",tier:"Troop",wounds:10,armour:"",rules:"",notes:"",characteristics:{WS:30,BS:30,S:30,T:30,Ag:30,Int:30,Per:30,WP:30,Fel:30}}:deep(state.gmProfiles[idx]);modal(idx===null?"Create GM Profile":"Edit GM Profile",`<div class="field"><label>Name</label><input id="gName" value="${esc(x.name)}"></div><div class="field"><label>Tier</label><select id="gTier">${["Troop","Elite","Master","NPC","Homebrew"].map(t=>`<option ${x.tier===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field"><label>Wounds</label><input id="gWounds" type="number" value="${x.wounds}"></div><div class="chars">${CHAR_KEYS.map(k=>`<div class="char"><small>${k}</small><input data-gchar="${k}" type="number" value="${x.characteristics[k]}"></div>`).join("")}</div><div class="field"><label>Armour</label><textarea id="gArmour">${esc(x.armour)}</textarea></div><div class="field"><label>Skills / Talents / Traits / Special Rules</label><textarea id="gRules">${esc(x.rules)}</textarea></div><div class="field"><label>Notes / Equipment</label><textarea id="gNotes">${esc(x.notes)}</textarea></div><button class="btn primary" id="gSave">Save</button>`,(b,m)=>m.querySelector("#gSave").onclick=()=>{x.name=m.querySelector("#gName").value||"Unnamed NPC";x.tier=m.querySelector("#gTier").value;x.wounds=+m.querySelector("#gWounds").value||0;m.querySelectorAll("[data-gchar]").forEach(i=>x.characteristics[i.dataset.gchar]=+i.value||0);x.armour=m.querySelector("#gArmour").value;x.rules=m.querySelector("#gRules").value;x.notes=m.querySelector("#gNotes").value;if(idx===null)state.gmProfiles.push(x);else state.gmProfiles[idx]=x;save();b.remove();gm()})}
 document.getElementById("addGM").onclick=()=>edit();document.querySelectorAll("[data-gmedit]").forEach(b=>b.onclick=()=>edit(+b.dataset.gmedit));document.querySelectorAll("[data-gmdel]").forEach(b=>b.onclick=()=>{state.gmProfiles.splice(+b.dataset.gmdel,1);save();gm()})
}
function menu(){
 const counts={Chapters:SEED.chapters.length,Specialities:SEED.specialities.length,Skills:SEED.skills.length,Armour:SEED.armours.length,"Psychic refs":SEED.psychic.length,Implants:SEED.implants.length,"Core concepts":SEED.rules.length};
 set(`<div class="card"><h2>Settings & Data</h2><div class="kicker">Interface Role</div><div class="choicegrid"><button class="choice ${state.appMode==="player"?"selected":""}" id="modePlayer"><b>Player</b><div class="small">Character-focused sheet, rolls, advances, equipment and quick-access rules.</div></button><button class="choice ${state.appMode==="gm"?"selected":""}" id="modeGM"><b>Game Master</b><div class="small">Mission control, encounter tracker, player resource monitor, NPC profiles and quick reference.</div></button></div><br>
 <div class="kicker">Surface</div><div class="choicegrid"><button class="choice ${state.theme!=="iron"?"selected":""}" id="themeP"><b>Parchment</b><div class="small">Warm vellum, ink and sourcebook-inspired panels.</div></button><button class="choice ${state.theme==="iron"?"selected":""}" id="themeI"><b>Cold Iron</b><div class="small">Blackened steel, gunmetal and pale tactical text.</div></button></div><br>
 <div class="kicker">Heraldry</div><div class="small">Auto follows the active Battle-Brother's Chapter. Manual themes let a whole campaign use one visual identity, including a Deathwatch-specific skin.</div>
 <div class="skin-grid">${[
   ["auto","Auto — Active Chapter"],
   ["deathwatch","Deathwatch"],
   ["black-templars","Black Templars"],
   ["blood-angels","Blood Angels"],
   ["dark-angels","Dark Angels"],
   ["space-wolves","Space Wolves"],
   ["storm-wardens","Storm Wardens"],
   ["ultramarines","Ultramarines"],
   ["raven-guard","Raven Guard"]
 ].map(([id,name])=>`<button class="skin-choice ${state.skin===id?"selected":""}" data-skin-choice="${id}"><div class="skin-swatch"></div><b>${name}</b></button>`).join("")}</div></div>
 <div class="card"><h2>Content Coverage</h2><div class="coverage">${Object.entries(counts).map(([k,v])=>`<div class="box"><b>${v}</b><span class="small">${k}</span></div>`).join("")}</div><div class="notice">This build prioritises readable player-facing explanations, character creation, armour, abilities, missions, and rules interactions. Inventory is editable rather than functioning as a weapon manual.</div></div>
 <div class="card"><h2>Homebrew</h2><p class="small">Create custom Chapters, abilities, armour, rules, campaign features, or general equipment notes without changing the protected Core reference layer.</p><button class="btn" id="addHB">Add Homebrew Rule</button></div>
 <div class="card"><h2>Roster</h2><button class="btn" id="newChar">New Character</button> <button class="btn" id="cloneChar">Duplicate Active</button> <button class="btn danger" id="delChar">Delete Active</button><div class="list">${state.characters.map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(chapter(x.chapter)?.name||"No Chapter")} • ${esc(spec(x.speciality)?.name||"No Speciality")}</div></div><button class="btn" data-openchar="${x.id}">${x.id===state.activeCharacter?"Active":"Open"}</button></div>`).join("")}</div></div>
 <div class="card"><h2>Diagnostics</h2><button class="btn" id="runTests">Run App Self-Test</button><div id="testOut" class="small"></div></div>
 <div class="card"><h2>Backup</h2><button class="btn" id="exportBtn">Export Save JSON</button> <button class="btn" id="importBtn">Import Save JSON</button><input type="file" accept=".json,application/json" id="importFile" hidden></div>
 <div class="card"><div class="kicker">About</div><p><b>Adeptus Astartes Field Codex</b> v${VERSION}. Single-file, device-local campaign companion supporting Astartes campaigns, including Deathwatch-style Kill-teams and single-Chapter play. Core reference summaries are concise rather than reproductions of the books.</p></div>`);
 document.getElementById("modePlayer").onclick=()=>switchMode("player");document.getElementById("modeGM").onclick=()=>switchMode("gm");
 document.getElementById("themeP").onclick=()=>{state.theme="parchment";save();applyTheme();menu()};
 document.getElementById("themeI").onclick=()=>{state.theme="iron";save();applyTheme();menu()};
 document.querySelectorAll("[data-skin-choice]").forEach(b=>b.onclick=()=>{state.skin=b.dataset.skinChoice;save();applyTheme();menu()});
 document.getElementById("newChar").onclick=()=>{let c=deep(DEFAULT_CHAR);c.id="char-"+Date.now();state.characters.push(c);state.activeCharacter=c.id;state.activeView="create";save();applyTheme();render()};
 document.getElementById("cloneChar").onclick=()=>{let c=deep(active());c.id="char-"+Date.now();c.name+=" Copy";state.characters.push(c);state.activeCharacter=c.id;save();menu()};
 document.getElementById("delChar").onclick=()=>{if(state.characters.length<=1)return alert("Keep at least one character.");state.characters=state.characters.filter(x=>x.id!==state.activeCharacter);state.activeCharacter=state.characters[0].id;save();menu()};
 document.querySelectorAll("[data-openchar]").forEach(b=>b.onclick=()=>{state.activeCharacter=b.dataset.openchar;state.activeView="sheet";save();applyTheme();render()});
 document.getElementById("addHB").onclick=()=>modal("Add Homebrew Rule",`<div class="field"><label>Name</label><input id="hbName"></div><div class="field"><label>Category</label><input id="hbCat" value="Homebrew"></div><div class="field"><label>Summary / Effect</label><textarea id="hbSummary"></textarea></div><button class="btn primary" id="hbSave">Save</button>`,(b,m)=>m.querySelector("#hbSave").onclick=()=>{state.homebrew.push({name:m.querySelector("#hbName").value||"Homebrew Rule",category:m.querySelector("#hbCat").value||"Homebrew",summary:m.querySelector("#hbSummary").value,source:"Homebrew"});save();b.remove();menu()});
 document.getElementById("runTests").onclick=()=>{let tests=[];function t(name,fn){try{tests.push([name,!!fn()])}catch{tests.push([name,false])}}t("State saves",()=>{save();return !!localStorage.getItem(STORE)});t("Active character resolves",()=>!!active());t("Chapters loaded",()=>SEED.chapters.length>=7);t("Specialities loaded",()=>SEED.specialities.length===6);t("Skills loaded",()=>SEED.skills.length>=40);t("Power armour loaded",()=>!!armour("power-armour"));t("Surface theme valid",()=>["parchment","iron"].includes(state.theme));t("Heraldry skin valid",()=>["auto","deathwatch","black-templars","blood-angels","dark-angels","space-wolves","storm-wardens","ultramarines","raven-guard"].includes(state.skin));t("Modal system",()=>typeof modal==="function");t("Roll engine",()=>{let r=roll100();return r>=1&&r<=100});document.getElementById("testOut").innerHTML=tests.map(([n,ok])=>`<div class="${ok?"success":"failure"}">${ok?"✓":"✗"} ${n}</div>`).join("")};
 document.getElementById("exportBtn").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="astartes-field-codex-save.json";a.click();URL.revokeObjectURL(a.href)};
 document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.characters)throw 0;state=x;save();applyTheme();render()}catch{alert("That file is not a valid Companion save.")}};r.readAsText(f)}
}
function render(){nav();({sheet:renderSheet,create:builder,mission,library,gm,gmhome,encounter,menu}[state.activeView]||renderSheet)();refreshQuickIcon()}
document.getElementById("modeBtn").onclick=()=>switchMode(state.appMode==="gm"?"player":"gm");
document.getElementById("themeBtn").onclick=()=>{state.theme=state.theme==="iron"?"parchment":"iron";save();applyTheme();render()};
document.getElementById("quickRoll").onclick=()=>openRoll("Quick d100",50);
render();
</script>
