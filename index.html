const V80_RENOWN_MIN={Initiated:0,Respected:20,Distinguished:40,Famed:60,Hero:80};
function v80Ensure(ch){if(!ch)return;ch.weaponState=ch.weaponState&&typeof ch.weaponState==='object'?ch.weaponState:{};ch.relicAwards=Array.isArray(ch.relicAwards)?ch.relicAwards:[];ch.relicNotes=ch.relicNotes&&typeof ch.relicNotes==='object'?ch.relicNotes:{};ch.weaponNotes=ch.weaponNotes&&typeof ch.weaponNotes==='object'?ch.weaponNotes:{};for(const n of v80OwnedWeaponNames(ch)){let w=v80Weapon(n);if(!w)continue;let st=ch.weaponState[n]||(ch.weaponState[n]={});let cap=v80Clip(w);st.status=['stored','carried','equipped'].includes(st.status)?st.status:((ch.equippedGear||[]).includes(n)?'equipped':'carried');st.current=Number.isFinite(Number(st.current))?clamp(Math.trunc(Number(st.current)),0,cap):cap;st.reserveClips=Math.max(0,Math.trunc(Number(st.reserveClips)||0));st.jammed=!!st.jammed;st.cooldown=Math.max(0,Math.trunc(Number(st.cooldown)||0));}}
function v80Weapon(name){return V80_WEAPONS.find(w=>w.name===name)}
function v80Clip(w){let n=Number(w?.clip);return Number.isFinite(n)&&n>0?n:0}
function v80Rates(w){let a=String(w?.rof||'—').replace(/–/g,'—').split('/');let val=x=>/^\d+$/.test(String(x||''))?Number(x):0;return{single:String(a[0]||'').toUpperCase()==='S',semi:val(a[1]),full:val(a[2])}}
function v80OwnedWeaponNames(ch){let a=[...(ch.loadout||[]),...(ch.equippedGear||[]),(ch.currentRequisition||[]).map?null:null];for(const x of ch.currentRequisition||[])a.push(x.name);for(const id of ch.relicAwards||[]){let r=V80_RELICS.find(x=>x.id===id);if(r?.kind==='Relic Weapon')a.push(r.name)}return [...new Set(a.filter(n=>v80Weapon(n)||V80_RELICS.some(r=>r.name===n&&r.kind==='Relic Weapon')))]}
function v80RenownHorizon(ch,req){if(!req||req==='—'||req==='-'||req==='N/A')return'';if(renownMeets(ch.renown,req))return`<span class="statusGood">${esc(req)} met</span>`;let need=V80_RENOWN_MIN[req];return need===undefined?`Requires ${esc(req)}`:`<span class="horizon">Renown ${ch.renown}/${need} · ${Math.max(0,need-Number(ch.renown||0))} until ${esc(req)}</span>`}
function v80WeaponState(ch,w){v80Ensure(ch);return ch.weaponState[w.name]||(ch.weaponState[w.name]={status:'carried',current:v80Clip(w),reserveClips:0,jammed:false,cooldown:0})}
function v80WeaponSource(w){return w.source||'Deathwatch Core Rulebook · Chapter V: Armoury'}
function v80WeaponOwned(ch,w){return v80OwnedWeaponNames(ch).includes(w.name)}
function v80WeaponCard(ch,w){let owned=v80WeaponOwned(ch,w),st=owned?v80WeaponState(ch,w):null,cap=v80Clip(w),pct=cap?clamp(st.current/cap*100,0,100):100,req=Number(w.req),special=w.narrativeOnly||!Number.isFinite(req),locked=!renownMeets(ch.renown,w.renown),rate=v80Rates(w);return `<div class="weaponCard ${owned&&st.status==='equipped'?'equipped':''} ${locked?'locked':''}"><div class="sectionLead"><div><div class="eyebrow">${esc(w.group||w.class||'Weapon')}</div><b>${esc(w.name)}</b></div>${owned?`<span class="statusBadge ${st.status==='equipped'?'equipped':''}">${st.status.toUpperCase()}</span>`:''}</div><div class="weaponStats"><div>Damage<b>${esc(w.damage||w.dmg||'—')}</b></div><div>Pen<b>${esc(w.pen??'—')}</b></div><div>Range<b>${esc(w.range||'—')}</b></div><div>RoF<b>${esc(w.rof||'—')}</b></div><div>Clip<b>${esc(w.clip??'—')}</b></div><div>Reload<b>${esc(w.reload||'—')}</b></div></div><div class="small">${esc(w.qualities||w.special||'No special qualities')}</div><div class="small"><b>Req:</b> ${esc(String(w.req??'—'))} · <b>Renown:</b> ${esc(w.renown||'—')}</div>${!renownMeets(ch.renown,w.renown)?v80RenownHorizon(ch,w.renown):''}${owned&&cap?`<div><div class="small"><b>Magazine ${st.current}/${cap}</b> · reserve clips ${st.reserveClips}${st.jammed?' · JAMMED':''}${st.cooldown?' · COOLING':''}</div><div class="ammoBar"><i style="width:${pct}%"></i></div></div>`:''}<div class="actions">${owned?`<button class="btn primary" data-v80attack="${esc(w.name)}" ${st.status==='stored'||st.jammed||st.cooldown||cap&&st.current<=0?'disabled':''}>ATTACK</button><button class="btn" data-v80why="${esc(w.name)}">?</button>`:`<button class="btn primary" data-v80req="${esc(w.name)}" ${locked||special||reqAvailable(ch)<req?'disabled':''}>${special?'STORY ACCESS':`REQUISITION ${req}`}</button><button class="btn" data-v80why="${esc(w.name)}">?</button>`}</div>${owned?`<div class="weaponState"><button class="btn ${st.status==='stored'?'primary':''}" data-v80state="${esc(w.name)}|stored">STORED</button><button class="btn ${st.status==='carried'?'primary':''}" data-v80state="${esc(w.name)}|carried">CARRIED</button><button class="btn ${st.status==='equipped'?'primary':''}" data-v80state="${esc(w.name)}|equipped">EQUIPPED</button></div>${cap?`<div class="ammoControls"><label>Reserve clips<input type="number" min="0" data-v80reserve="${esc(w.name)}" value="${st.reserveClips}"></label><button class="btn" data-v80reload="${esc(w.name)}">RELOAD</button>${st.jammed?`<button class="btn danger" data-v80clearjam="${esc(w.name)}">CLEAR JAM</button>`:`<button class="btn" data-v80fullmag="${esc(w.name)}">SET FULL</button>`}</div>`:''}`:''}<div class="source">${esc(v80WeaponSource(w))}</div></div>`}
function v80ArmouryWeaponsHTML(ch){v80Ensure(ch);let q=String(state.v80WeaponQuery||'').toLowerCase(),cat=state.v80WeaponGroup||'All',groups=['All',...new Set(V80_WEAPONS.map(w=>w.group||w.class||'Other'))],rows=V80_WEAPONS.filter(w=>(cat==='All'||(w.group||w.class||'Other')===cat)&&(!q||`${w.name} ${w.group} ${w.class} ${w.qualities} ${w.source}`.toLowerCase().includes(q)));return `<div class="card" id="v80Weapons"><div class="sectionLead"><div><h2>Weapons Armoury</h2><div class="small">Published profiles · live readiness state · Requisition and Renown gates</div></div><span class="pill">${rows.length}/${V80_WEAPONS.length}</span></div><div class="filters"><input id="v80WeaponSearch" placeholder="Search bolter, plasma, sword, Accurate…" value="${esc(state.v80WeaponQuery||'')}"><select id="v80WeaponGroup">${groups.map(g=>`<option ${g===cat?'selected':''}>${esc(g)}</option>`).join('')}</select></div><p class="small">Ammo tracking is explicit: the app knows the weapon's magazine capacity, but never invents reserve ammunition. Enter the clips actually issued by the GM.</p><div class="weaponWorkbench">${rows.map(w=>v80WeaponCard(ch,w)).join('')||'<div class="empty">No matching weapons.</div>'}</div></div>`}
function v80RelicEligible(ch,r){return renownMeets(ch.renown,r.renown)||Number(ch.renown||0)>=Number(r.renownMin||999)}
function v80RelicCard(ch,r){let own=(ch.relicAwards||[]).includes(r.id),eligible=v80RelicEligible(ch,r);return `<div class="relicCard"><div class="sectionLead"><div><div class="eyebrow">${esc(r.kind)} · ${esc(chapterBy(r.chapter)?.name||r.chapter)}</div><b>${esc(r.name)}</b></div><span class="sourceBadge ${r.published?'official':'homebrew'}">${r.published?'PUBLISHED':'HOMEBREW'}</span></div><p>${esc(r.summary)}</p><div class="ruleEffect"><b>Relic rule</b><div class="small">${esc(r.effect)}</div></div><div class="small"><b>Access:</b> ${esc(r.renown)} Renown tier · ${r.req} Req ${r.published?'published profile':'suggested burden'}</div>${!eligible?v80RenownHorizon(ch,r.renown):''}<p class="small"><b>Deed / mission gate:</b> ${esc(r.gate)}</p><label>Award / mission note<input data-v80relicnote="${r.id}" value="${esc(ch.relicNotes?.[r.id]||'')}" placeholder="Deed, Watch Captain ruling, mission…"></label><div class="actions">${own?`<span class="pill statusGood">AWARDED</span><button class="btn danger" data-v80unaward="${r.id}">REMOVE RECORD</button>`:`<button class="btn primary" data-v80award="${r.id}" ${eligible?'':'disabled'}>RECORD GM AWARD</button>`}</div><div class="source">${esc(r.source)}</div></div>`}
function v80RelicVaultHTML(ch){let rows=V80_RELICS.filter(r=>r.chapter===ch.chapter);return `<div class="card" id="v80RelicVault"><div class="sectionLead"><div><h2>Chapter Relic Vault</h2><div class="small">Renown is eligibility, Requisition is mission allocation, the deed and GM award are separate gates.</div></div><span class="pill">${esc(chapterBy(ch.chapter)?.name||'Chapter')}</span></div><p class="small">Published relics preserve their Core identity. Lore-inspired additions are visibly marked HOMEbrew and never overwrite canonical records.</p><div class="relicVault">${rows.map(r=>v80RelicCard(ch,r)).join('')||'<div class="empty">No relic record for this Chapter.</div>'}</div></div>`}
const v80ArmoryBase=renderArmory;renderArmory=function(){v80ArmoryBase();let ch=current();if(!ch)return;v80Ensure(ch);let app=document.getElementById('app');app.insertAdjacentHTML('beforeend',v80ArmouryWeaponsHTML(ch)+v80RelicVaultHTML(ch)+`<div class="card"><h2>Armoury Audit Notes</h2><div class="auditGrid"><div><b>${V80_WEAPONS.length}</b><span class="small">weapon profiles</span></div><div><b>3</b><span class="small">weapon readiness states</span></div><div><b>${V80_RELICS.length}</b><span class="small">Chapter relic records</span></div></div><p class="small">The weapon state model mirrors armour's state philosophy: knowing an item, having it allocated, carrying it, equipping it, and having ammunition ready are distinct facts.</p></div>`);v80WireArmoury(ch)};
function v80WireArmoury(ch){let q=document.getElementById('v80WeaponSearch');if(q)q.oninput=e=>{state.v80WeaponQuery=e.target.value;save();let p=e.target.selectionStart;render();restoreTextFocus('v80WeaponSearch',p)};let g=document.getElementById('v80WeaponGroup');if(g)g.onchange=e=>{state.v80WeaponGroup=e.target.value;save();render()};document.querySelectorAll('[data-v80why]').forEach(b=>b.onclick=()=>v80WeaponWhy(ch,b.dataset.v80why));document.querySelectorAll('[data-v80attack]').forEach(b=>b.onclick=()=>v80AttackPrep(ch,b.dataset.v80attack));document.querySelectorAll('[data-v80req]').forEach(b=>b.onclick=()=>v80RequisitionWeapon(ch,b.dataset.v80req));document.querySelectorAll('[data-v80state]').forEach(b=>b.onclick=()=>{let [name,status]=b.dataset.v80state.split('|'),w=v80Weapon(name);if(!w)return;pushUndo(ch,`Set ${name} ${status}`);let st=v80WeaponState(ch,w);st.status=status;if(status==='equipped'){ch.equippedGear=[...(ch.equippedGear||[]).filter(n=>n!==name),name]}else ch.equippedGear=(ch.equippedGear||[]).filter(n=>n!==name);recordActivity(ch,`${name}: ${status}`,'equipment');save();render()});document.querySelectorAll('[data-v80reserve]').forEach(i=>i.onchange=()=>{let w=v80Weapon(i.dataset.v80reserve),st=v80WeaponState(ch,w);st.reserveClips=Math.max(0,Math.trunc(Number(i.value)||0));save();render()});document.querySelectorAll('[data-v80reload]').forEach(b=>b.onclick=()=>v80Reload(ch,b.dataset.v80reload));document.querySelectorAll('[data-v80fullmag]').forEach(b=>b.onclick=()=>{let w=v80Weapon(b.dataset.v80fullmag),st=v80WeaponState(ch,w);pushUndo(ch,`Set ${w.name} magazine full`);st.current=v80Clip(w);recordActivity(ch,`${w.name} magazine set full by table record`,'ammo');save();render()});document.querySelectorAll('[data-v80clearjam]').forEach(b=>b.onclick=()=>v80ClearJam(ch,b.dataset.v80clearjam));document.querySelectorAll('[data-v80relicnote]').forEach(i=>i.onchange=()=>{ch.relicNotes[i.dataset.v80relicnote]=i.value.trim();save()});document.querySelector function v82Ensure(ch){
  if(!ch)return ch;
  v80Ensure(ch);
  ch.specialAmmo=ch.specialAmmo||{};
  ch.weaponUpgrades=ch.weaponUpgrades||{};
  ch.relicActive=ch.relicActive||[];
  for(const a of V82_SPECIAL_AMMO)ch.specialAmmo[a.id]=Math.max(0,Number(ch.specialAmmo[a.id]||0));
  for(const n of v80OwnedWeaponNames(ch)){
    ch.weaponUpgrades[n]=Array.isArray(ch.weaponUpgrades[n])?ch.weaponUpgrades[n]:[];
    let w=v80Weapon(n);if(!w)continue;let st=v80WeaponState(ch,w);
    st.loadedAmmo=st.loadedAmmo||'standard';
    st.selectorSlots=Array.isArray(st.selectorSlots)?st.selectorSlots:[];
    st.magazines=st.magazines&&typeof st.magazines==='object'?st.magazines:{};
    if(st.magazines[st.loadedAmmo]===undefined)st.magazines[st.loadedAmmo]=Number(st.current||0);
  }
  return ch;
}
for(const ch of state.characters||[])v82Ensure(ch);

function v82Ammo(id){return V82_SPECIAL_AMMO.find(a=>a.id===id)}
function v82Upgrade(id){return V82_UPGRADES.find(a=>a.id===id)}
function v82UpgradeIds(ch,name){v82Ensure(ch);return ch.weaponUpgrades[name]||[]}
function v82HasUpgrade(ch,name,id){return v82UpgradeIds(ch,name).includes(id)}
function v82SightUpgrade(ch,name){return v82UpgradeIds(ch,name).map(v82Upgrade).find(u=>u?.sight)}
function v82ReqRecord(ch,predicate){return (ch.currentRequisition||[]).find(predicate)}
function v82AddReq(ch,name,req,kind,meta={}){let rec={id:uid('req'),name,req:Number(req)||0,kind,...meta};ch.currentRequisition.push(rec);ch.requisitionHistory.push({at:new Date().toISOString(),action:'requisition',name,req:Number(req)||0});return rec}
function v82RemoveReqById(ch,id){let i=(ch.currentRequisition||[]).findIndex(x=>x.id===id);if(i<0)return null;let [rec]=ch.currentRequisition.splice(i,1);ch.requisitionHistory.push({at:new Date().toISOString(),action:'return',name:rec.name,req:rec.req});return rec}
function v82AmmoCost(a,w){if(!a||!w)return Number(a?.req||0);let base=Number(a.req||0);if(w.class==='Pistol')return base/2;if(/Heavy Bolter/i.test(w.name))return base+5;return base}
function v82IsBolt(w){return w&&String(w.group||'').toLowerCase()==='bolt'}
function v82FormatReq(n){return Number.isInteger(n)?String(n):String(n)}
function v82DamageAdjust(dmg,delta){let s=String(dmg||'—');let m=s.match(/^(.*?)([+-]\d+)?\s+([A-Z])$/);if(!m)return s;let base=m[1],flat=Number(m[2]||0)+delta,type=m[3];return `${base}${flat>0?'+'+flat:flat<0?flat:''} ${type}`}
function v82RangeNumber(w){let m=String(w.range||'').match(/([0-9.]+)/);return m?Number(m[1]):null}
function v82EffectiveProfile(w,st,maximal=false){
  let ammo=v82Ammo(st?.loadedAmmo),damage=String(w.damage||w.dmg||'—'),pen=Number(w.pen),range=v82RangeNumber(w),qualities=String(w.qualities||w.special||'');
  if(ammo){
    if(['dragonfire','metal-storm','stalker'].includes(ammo.id))damage=v82DamageAdjust(damage,-2);
    if(ammo.id==='kraken'){pen=8;if(range!==null)range*=1.5}
    if(ammo.id==='metal-storm'&&Number.isFinite(pen))pen=Math.max(0,pen-2);
    if(ammo.id==='vengeance')pen=9;
    if(ammo.id==='hellfire'&&!/Tearing/i.test(qualities))qualities+=(qualities?', ':'')+'Tearing';
    if(ammo.id==='metal-storm')qualities+=(qualities?', ':'')+'Blast (2)';
    if(ammo.id==='vengeance')qualities+=(qualities?', ':'')+'Felling (1)';
  }
  if(maximal){damage=`${damage} + 1d10`;if(Number.isFinite(pen))pen+=2;if(range!==null)range+=10;qualities+=(qualities?', ':'')+'Recharge, Overheats';}
  let upgrades=v82UpgradeIds(current(),w.name);
  if(upgrades.includes('arm-mount')&&range!==null)range*=.7;
  return{ammo:ammo?.name||'Standard issue',damage,pen:Number.isFinite(pen)?pen:w.pen,range:range===null?w.range:`${Math.round(range*10)/10}m`,qualities};
}

function v82IssueAmmo(ch,id){
  let a=v82Ammo(id);if(!a)return;
  let weapons=v80OwnedWeaponNames(ch).map(v80Weapon).filter(v82IsBolt);
  if(!weapons.length)return toast('No owned Bolt weapon is recorded for this ammunition.','bad');
  modal(`<h2>Issue ${esc(a.name)}</h2><p>${esc(a.effect)}</p><label>Applicable weapon<select id="v82AmmoWeapon">${weapons.map(w=>`<option value="${esc(w.name)}">${esc(w.name)}</option>`).join('')}</select></label><div class="callout"><b>Core cost rule</b><div class="small">Listed cost is one clip. Pistols pay half the listed cost; Heavy Bolters add +5 Requisition.</div></div><div id="v82AmmoCost"></div><button class="btn primary" id="v82AmmoConfirm">ISSUE ONE CLIP</button><div class="source">${esc(a.source)}</div>`,{label:'Special Issue Ammunition'});
  let upd=()=>{let w=v80Weapon(document.getElementById('v82AmmoWeapon').value),cost=v82AmmoCost(a,w),ok=renownMeets(ch.renown,a.renown)&&reqAvailable(ch)>=cost;document.getElementById('v82AmmoCost').innerHTML=`<div class="attackPreview"><span>Cost for ${esc(w.name)}</span><b>${esc(v82FormatReq(cost))} Req</b><div class="small">${v80RenownHorizon(ch,a.renown)||'Renown requirement met'} · ${ok?'available':'not currently available'}</div></div>`;document.getElementById('v82AmmoConfirm').disabled=!ok;return{w,cost}};
  document.getElementById('v82AmmoWeapon').onchange=upd;upd();
  document.getElementById('v82AmmoConfirm').onclick=()=>{let {w,cost}=upd();pushUndo(ch,`Issue ${a.name}`);v82AddReq(ch,`${a.name} clip · ${w.name}`,cost,'Special Issue Ammunition',{ammoId:a.id,weapon:w.name});ch.specialAmmo[a.id]=(ch.specialAmmo[a.id]||0)+1;recordActivity(ch,`Special ammunition issued: ${a.name}`,'ammo',`${cost} Req · ${w.name}`);save();closeModal();render();toast(`${a.name} clip issued.`)};
}

function v82LoadAmmo(ch,id){
  let a=v82Ammo(id);if(!a||ch.specialAmmo[id]<=0)return toast('No full issued clip remains.','bad');
  let weapons=v80OwnedWeaponNames(ch).map(v80Weapon).filter(v82IsBolt);
  modal(`<h2>Load ${esc(a.name)}</h2><label>Weapon<select id="v82LoadWeapon">${weapons.map(w=>`<option value="${esc(w.name)}">${esc(w.name)}</option>`).join('')}</select></label><div class="callout"><b>Magazine state</b><div class="small">Loading consumes one full issued clip from the reserve record. If the weapon has a Fire Selector, the clip can occupy one of up to three selector positions; otherwise it replaces the current magazine state.</div></div><button class="btn primary" id="v82LoadConfirm">LOAD CLIP</button>`,{label:'Load special ammunition'});
  document.getElementById('v82LoadConfirm').onclick=()=>{let w=v80Weapon(document.getElementById('v82LoadWeapon').value);if(!w)return;let st=v80WeaponState(ch,w),cap=v80Clip(w),selector=v82HasUpgrade(ch,w.name,'fire-selector');pushUndo(ch,`Load ${a.name} into ${w.name}`);st.magazines[st.loadedAmmo]=st.current;if(selector){if(!st.selectorSlots.includes(id)&&st.selectorSlots.length>=3){toast('Fire Selector already contains three alternate clip types.','bad');return}if(!st.selectorSlots.includes(id))st.selectorSlots.push(id);st.magazines[id]=cap}else{st.selectorSlots=[];st.magazines[id]=cap}st.loadedAmmo=id;st.current=cap;ch.specialAmmo[id]-=1;recordActivity(ch,`${a.name} loaded into ${w.name}`,'ammo',selector?'Fire Selector':'Magazine replacement');save();closeModal();render();toast(`${a.name} loaded.`)};
}

function v82SwitchSelector(ch,name,id){let w=v80Weapon(name);if(!w)return;let st=v80WeaponState(ch,w);if(!v82HasUpgrade(ch,name,'fire-selector'))return;let allowed=['standard',...st.selectorSlots];if(!allowed.includes(id))return;pushUndo(ch,`Select ${id} in ${name}`);st.magazines[st.loadedAmmo]=st.current;st.loadedAmmo=id;st.current=Number(st.magazines[id]??v80Clip(w));recordActivity(ch,`${name} Fire Selector changed`,'ammo',id==='standard'?'Standard issue':v82Ammo(id)?.name||id);save();render()}

function v82InstallUpgrade(ch,name,id){
  let w=v80Weapon(name),u=v82Upgrade(id);if(!w||!u||!u.compat(w))return;
  if(v82HasUpgrade(ch,name,id))return;
  if(!renownMeets(ch.renown,u.renown))return toast(`Requires ${u.renown} Renown.`,'bad');
  if(reqAvailable(ch)<u.req)return toast('Not enough Requisition in the current fund.','bad');
  if(u.sight){let old=v82SightUpgrade(ch,name);if(old)return toast(`${name} already has ${old.name}; Core permits only one sight. Remove it first.`,'bad')}
  pushUndo(ch,`Install ${u.name} on ${name}`);ch.weaponUpgrades[name]=ch.weaponUpgrades[name]||[];ch.weaponUpgrades[name].push(id);let rec=v82AddReq(ch,`${u.name} · ${name}`,u.req,'Weapon Upgrade',{upgradeId:id,weapon:name});recordActivity(ch,`Installed ${u.name} on ${name}`,'equipment',`${u.req} Req`);save();render();toast(`${u.name} installed.`)
}
function v82RemoveUpgrade(ch,name,id){let u=v82Upgrade(id);if(!u)return;pushUndo(ch,`Remove ${u.name} from ${name}`);ch.weaponUpgrades[name]=(ch.weaponUpgrades[name]||[]).filter(x=>x!==id);let rec=v82ReqRecord(ch,x=>x.upgradeId===id&&x.weapon===name);if(rec)v82RemoveReqById(ch,rec.id);if(id==='fire-selector'){let w=v80Weapon(name),st=v80WeaponState(ch,w);st.selectorSlots=[]}recordActivity(ch,`Removed ${u.name} from ${name}`,'equipment');save();render()}

function v82UpgradeLibraryHTML(ch){v82Ensure(ch);let weapons=v80OwnedWeaponNames(ch).map(v80Weapon).filter(Boolean);return `<div class="card" id="v82Upgrades"><div class="sectionLead"><div><h2>Weapon Upgrades</h2><div class="small">Core compatibility, Requisition and active attack modifiers</div></div><span class="sourceBadge core">CORE</span></div><div class="upgradeLibrary">${V82_UPGRADES.map(u=>{let compat=weapons.filter(w=>u.compat(w));return `<div class="upgradeCard"><h3>${esc(u.name)}</h3><div class="small"><b>${u.req} Req</b> · ${esc(u.renown)} Renown</div><p class="small">${esc(u.effect)}</p>${compat.length?`<label>Owned compatible weapon<select data-v82upweapon="${u.id}">${compat.map(w=>`<option>${esc(w.name)}</option>`).join('')}</select></label><button class="btn primary" data-v82install="${u.id}" ${!renownMeets(ch.renown,u.renown)||reqAvailable(ch)<u.req?'disabled':''}>INSTALL</button>`:'<div class="emptyHelp">No owned compatible weapon.</div>'}<div class="source">${esc(u.source)}</div></div>`}).join('')}</div><details><summary>Installed upgrades</summary>${weapons.map(w=>{let ids=v82UpgradeIds(ch,w.name);return ids.length?`<div class="listrow"><div><b>${esc(w.name)}</b><div class="small">${ids.map(id=>esc(v82Upgrade(id)?.name||id)).join(' · ')}</div></div><div class="actions">${ids.map(id=>`<button class="btn danger" data-v82removeupgrade="${esc(w.name)}|${id}">REMOVE ${esc(v82Upgrade(id)?.name||id)}</button>`).join('')}</div></div>`:''}).join('')||'<div class="empty">No upgrades installed.</div>'}</details></div>`}

// D100 Chapter generator: equal-weight entries across supported Chapters, with ranges rendered dynamically.
window.hbChapterD100=function(){let ids=DATA.supportedChapters.slice(),r=rollDie(100),idx=Math.min(ids.length-1,Math.floor((r-1)*ids.length/100)),cp=chapterBy(ids[idx]);return {roll:r,chapter:cp}};
const baseCreate=renderCreate;renderCreate=function(){baseCreate();let app=document.getElementById('app'),hero=app.querySelector('.hero');if(!hero||document.getElementById('hbChapterRoll'))return;hero.insertAdjacentHTML('beforeend',`<div class="quickLinks"><button class="btn" id="hbChapterRoll">D100 CHAPTER INSPIRATION</button><button class="btn" id="hbChapterTable">CHAPTER TABLE</button></div>`);document.getElementById('hbChapterRoll').onclick=()=>{let x=hbChapterD100();toast(`d100 ${x.roll} · ${x.chapter.name}`);let b=document.querySelector(`[data-chapter="${x.chapter.id}"]`);if(b)b.click()};document.getElementById('hbChapterTable').onclick=()=>{let ids=DATA.supportedChapters,rows=ids.map((id,i)=>{let lo=Math.floor(i*100/ids.length)+1,hi=Math.floor((i+1)*100/ids.length);return `<div class="calcLine"><span>${lo}–${hi}</span><b>${esc(chapterBy(id).name)}</b></div>`}).join('');modal(`<h2>D100 Chapter Inspiration</h2><p class="small">Equal-weight inspiration table across every fully loaded Chapter profile. This is an app convenience, not an official FFG table.</p><div class="resolverTrace">${rows}</div>`,{label:'Chapter d100 table'})}}
// Advancement extension: curated Elite Advances plus source boundary.
const baseAdvance=renderAdvance;renderAdvance=function(){baseAdvance();let ch=current();if(!ch)return;let app=document.getElementById('app');if(document.getElementById('hbEliteCatalog'))return;app.insertAdjacentHTML('beforeend',`<div class="card" id="hbEliteCatalog"><div class="sectionLead"><h2>Lore-Scaled Elite Advances</h2><span class="pill">OPTIONAL HOMEBREW</span></div><p class="small">Built against Core Elite Advance philosophy: narrow, expensive, GM-approved, and never a shortcut around Renown or story gates.</p>${HB_ELITES.map(e=>{let ok=rankFor(ch)>=e.rank&&Number(ch.renown||0)>=e.renown&&!ch.advances.some(a=>a.name===e.name);return `<div class="listrow"><div><b>${esc(e.name)}</b><div class="small">${e.cost} XP · Rank ${e.rank}+ · Renown ${e.renown}+</div><p class="small">${esc(e.effect)}</p></div><button class="btn" data-hbelite="${e.id}" ${ok&&ch.xp.available>=e.cost?'':'disabled'}>${ch.advances.some(a=>a.name===e.name)?'OWNED':'PURCHASE'}</button></div>`}).join('')}</div>`);document.querySelectorAll('[data-hbelite]').forEach(b=>b.onclick=()=>{let e=HB_ELITES.find(x=>x.id===b.dataset.hbelite);if(!e||ch.xp.available<e.cost||rankFor(ch)<e.rank||ch.renown<e.renown)return;pushUndo(ch,'Purchase '+e.name);ch.xp.available-=e.cost;ch.xp.spent+=e.cost;ch.advances.push({name:e.name,cost:e.cost,type:'Elite Advance',source:e.source,note:e.effect});recordActivity(ch,'Elite Advance: '+e.name,'advancement',e.effect);save();render()})}
// Reference coverage declaration for expanded content.
const baseCoverage=renderCoverage;renderCoverage=function(){baseCoverage();let app=document.getElementById('app');app.insertAdjacentHTML('beforeend',`<div class="card"><h2>Codex Expansion Boundary</h2><div class="coverageRow"><div><b>${CHX.length} lore-derived Chapter profiles</b><div class="small">Each uses official Chapter identity/lore as its basis but Deathwatch mechanics are explicitly scaled homebrew unless an original FFG source is cited.</div></div><span class="pill">LORE-CITED HOMEBREW</span></div><div class="coverageRow"><div><b>${SPX.length} expanded Specialities + ${HB_ELITES.length} Elite Advances</b><div class="small">Mechanically bounded against Core costs and bonuses; not presented as missing FFG text.</div></div><span class="pill">OPTIONAL</span></div></div>`)};
// Expand abbreviation handling without modifying the original function body.
const ABB=Object.fromEntries(CHX.map(x=>[x[0],x[1].split(/\s+/).map(y=>y[0]).join('').slice(0,3).toUpperCase()]));const oldAbbr=chapterAbbr;chapterAbbr=function(id){return ABB[id]||oldAbbr(id)};
// Explicitly retire named-character-only gear from player reward pools.
if(window.V80_RELICS){for(const r of V80_RELICS){if(/Gauntlets of Ultramar Pattern/i.test(r.name)){r.name='Macraggean Gauntlet Relic-Pattern';r.summary='A Chapter-vault relic pattern inspired by paired power-fist/bolter traditions. It is explicitly not Marneus Calgar’s Gauntlets of Ultramar.';r.source='LORE-DERIVED HOMEBREW · avoids Calgar’s currently possessed Gauntlets of Ultramar';r.effect='Paired Master-Crafted power-fist/bolt integration; exact mission configuration remains GM-approved.'}}}
// Version identity
try{DISPLAY_VERSION='9.0';}catch(e){}
const hbDiagBase=diagnostics;diagnostics=function(){let d=hbDiagBase();d.unshift({name:'v9.0 expanded Chapter library',ok:DATA.supportedChapters.length>=31});d.unshift({name:'v9.0 expanded Specialities',ok:DATA.specialities.length>=14});d.unshift({name:'v9.0 homebrew source boundary',ok:CHX.every(x=>DATA.chapters.find(c=>c.id===x[0])?.rules==='lore-derived-homebrew')});d.unshift({name:'v9.0 named-character relic safety',ok:!V80_RELICS.some(r=>/^Gauntlets of Ultramar$/i.test(r.name)||/^Armour of Antilochus$/i.test(r.name))});return d};
})();
</script>
