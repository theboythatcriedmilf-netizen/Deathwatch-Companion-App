function renderSheet(){let ch=c(),rc=richChapter(),sp=richSpec(),mv=movement(ch),ds=damageState(ch),abilities=modeAbilities();let skills=CORE_DATA.skills.map(s=>{let t=skillTargetRich(s);return `<div class="listrow"><b class="click" data-corecat="skills" data-coreid="${s.id}">${esc(s.name)}</b><button class="btn" style="float:right" ${t===null?'disabled':''} data-rskill="${esc(s.id)}">${t===null?'Untrained':t}</button><div class="small">${s.characteristic} · ${s.skillType}${ch.skillsOwned?.[s.name]?' +'+ch.skillsOwned[s.name]:''}</div></div>`}).join('');let weapons=ch.loadout.map(n=>FULL_ARMOURY.find(w=>w.name===n)||FULL_ARMOURY.find(w=>n.includes('Bolter')&&w.name.includes('Bolter'))).filter(Boolean).map(w=>`<div class="arm"><div class="eyebrow">${w.group} · ${w.class}</div><h3 class="click" data-fweapon="${esc(w.name)}">${esc(w.name)}</h3><div><span class="pill">${w.damage}</span><span class="pill">Pen ${w.pen}</span><span class="pill">${w.rof}</span><span class="pill">${w.range}</span></div><button class="btn primary" style="width:100%;margin-top:8px" data-fattack="${esc(w.name)}">ROLL ATTACK</button></div>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">${esc(rc?.name||chapter().name)} · ${esc(sp.name)} · Rank ${rankFor(ch)}</div><h1>${esc(ch.name)}</h1><div class="small">${esc(rc?.demeanour||chapter().demeanour)} · Renown ${ch.renown} · Total XP ${totalXP(ch).toLocaleString()} · ${ch.xp.available} XP available</div></section><div class="card"><div class="mode"><button id="soloBtn" class="${ch.mode==='solo'?'active':''}">SOLO MODE</button><button id="squadBtn" class="${ch.mode==='squad'?'active':''}">SQUAD MODE</button></div><div class="small" style="margin-top:7px">Only abilities usable in the selected mode are shown below.</div></div><div class="card"><h2>Current Mode Abilities</h2>${abilities.map(a=>`<div class="listrow"><b>${esc(a.name)}</b><div class="small">${esc(a.meta)}</div><p>${esc(a.summary)}</p><div class="source">${esc(a.source)}</div></div>`).join('')||'<div class="empty">No mode ability indexed for this combination.</div>'}</div><div class="grid">${resource('Damage / Wounds',`${ch.wounds.damage} / ${ch.wounds.max}`,'damage')}${resource('Fate',`${ch.fate.current} / ${ch.fate.max}`,'fate')}${resource('Fatigue',ch.fatigue,'fatigue')}${resource('Cohesion',`${ch.cohesion.current} / ${ch.cohesion.max}`,'cohesion')}</div><div class="card"><h2>Injury State: ${ds[0]}</h2><div class="small">Toughness Bonus ${bonus('T')} · Critical Damage ${ch.critical}. Light damage heals faster than Heavy; Critical Damage requires medical attention.</div></div><div class="card"><h2>Characteristics</h2><div class="grid3">${Object.keys(ch.chars).map(k=>`<div class="stat" data-char="${k}"><span>${k}</span><b>${modChar(k)}</b><small>Bonus ${bonus(k)}</small></div>`).join('')}</div></div><div class="card"><h2>Movement</h2><div class="grid3"><div class="stat"><span>Half</span><b>${mv.half}m</b></div><div class="stat"><span>Full</span><b>${mv.full}m</b></div><div class="stat"><span>Charge</span><b>${mv.charge}m</b></div><div class="stat"><span>Run</span><b>${mv.run}m</b></div></div><div class="source">Power armour adds +1 to Agility Bonus for movement.</div></div><div class="card"><h2>Armour</h2><b>${esc(currentArmour().name)}</b><div>${armourLine()}</div><div class="small">${esc(currentArmour().summary)}</div></div><div class="card"><h2>Equipment & Standard Issue</h2>${(ch.gear||[]).map(g=>`<span class="pill">${esc(g)}</span>`).join('')||'<div class="empty">No additional gear recorded.</div>'}</div><div class="sectionTitle"><h2>Weapons</h2><button class="btn" onclick="setView('armoury')">Manage</button></div><div class="armGrid">${weapons||'<div class="empty">No weapons equipped.</div>'}</div>${ch.speciality==='librarian'?`<div class="card"><h2>Psychic Powers · PR ${ch.psyRating||3}</h2>${ch.powers.map(n=>{let p=FULL_PSYCHIC.find(x=>x.name===n);return p?`<div class="listrow"><b class="click" data-powerfull="${esc(p.name)}">${esc(p.name)}</b><button class="btn primary" style="float:right" data-manifestfull="${esc(p.name)}">ROLL</button><div class="small">${p.action} · ${p.range}${p.sustained?' · Sustained':''}</div></div>`:''}).join('')}</div>`:''}<div class="card"><details><summary><b>Skills (${CORE_DATA.skills.length} indexed)</b></summary>${skills}</details></div><div class="card"><h2>Talents & Traits</h2>${[...START_TALENTS,...ch.talentsOwned].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}${CORE_DATA.traits.map(x=>`<span class="pill click" data-corecat="traits" data-coreid="${x.id}">${esc(x.name)}</span>`).join('')}</div><div class="card"><h2>Astartes Implants</h2><div class="small">All ${CORE_DATA.implants.length} core implant entries are indexed. Their effects are treated as baseline rules rather than stacked twice.</div><details><summary>Show implants</summary>${CORE_DATA.implants.map(x=>`<div class="listrow click" data-corecat="implants" data-coreid="${x.id}"><b>${esc(x.name)}</b><div class="small">${esc(x.summary)}</div></div>`).join('')}</details></div><div class="card"><h2>History & Notes</h2><div><b>Past:</b> ${esc(ch.past||'Not recorded')}</div><div><b>Power Armour History:</b> ${esc(ch.armourHistory||'Not recorded')}</div><textarea id="sheetNotes">${esc(ch.notes||'')}</textarea><button class="btn" id="saveNotes">Save Notes</button></div>`;document.getElementById('soloBtn').onclick=()=>{ch.mode='solo';save();render()};document.getElementById('squadBtn').onclick=()=>{ch.mode='squad';save();render()};document.getElementById('saveNotes').onclick=()=>{ch.notes=document.getElementById('sheetNotes').value;save()};document.querySelectorAll('[data-char]').forEach(x=>x.onclick=()=>showRoll(d100(modChar(x.dataset.char),0,x.dataset.char+' Test')));wireCore();wireResources()}
function renderCreate(){if(!state.creator)state.creator={step:1,draft:deepCopy(defaultChar()),rerollUsed:false,rolled:false};let cr=state.creator,d=cr.draft;d.creationComplete=false;let step=cr.step;let rc=CORE_DATA.chapters.find(x=>x.id===d.chapter)||CORE_DATA.chapters[0],sr=SPEC_RULES[d.speciality]||SPEC_RULES.tactical;let body='';if(step===1)body=`<div class="card"><h2>1 · Generate Characteristics</h2><p class="small">Core method: roll 2d10 + 30 for each of nine Characteristics. One result may be re-rolled, and the new result must stand. Alternate point allocation is also available.</p><div class="grid3">${Object.keys(d.chars).map(k=>`<div class="stat"><span>${k}</span><b>${d.chars[k]}</b><button class="btn" data-rerollstat="${k}" ${!cr.rolled||cr.rerollUsed?'disabled':''}>Reroll</button></div>`).join('')}</div><button class="btn primary" id="rollAll" style="width:100%;margin-top:9px">ROLL 2d10+30</button><button class="btn" id="allocate">Use 100-point allocation</button></div>`;if(step===2)body=`<div class="card"><h2>2 · Select Chapter</h2><p class="small">Chapter applies Characteristics, Demeanour and Solo Mode mechanics before Speciality.</p>${CORE_DATA.chapters.filter(x=>x.rules==='core'||x.id==='raven-guard').map(x=>`<div class="choiceCard ${d.chapter===x.id?'selected':''}" data-pickchapter="${x.id}"><div class="eyebrow">${esc(x.source)} · p.${esc(x.page)}</div><h3>${esc(x.name)}</h3><p>${esc(x.summary)}</p><div>${Object.entries(x.mods||{}).map(([k,v])=>`<span class="pill">${k} +${v}</span>`).join('')}<span class="pill">${esc(x.solo)}</span><span class="pill">${esc(x.demeanour)}</span></div>${x.restrictions?.length?`<div class="small">Restricted: ${x.restrictions.join(', ')}</div>`:''}</div>`).join('')}</div>`;if(step===3)body=`<div class="card"><h2>3 · Select Speciality</h2>${SPECIALITIES.map(x=>{let restricted=(rc.restrictions||[]).includes(x.id);let rr=SPEC_RULES[x.id];return `<div class="choiceCard ${d.speciality===x.id?'selected':''} ${restricted?'small':''}" data-pickspec="${x.id}" data-disabled="${restricted}"><h3>${esc(x.name)}${restricted?' — unavailable to this Chapter':''}</h3><p>${esc(x.role)}</p><div class="small">Starting Skills: ${rr.startSkills.join(', ')||'none additional'}</div>${rr.choices.map(a=>`<div class="listrow"><b>${esc(a.name)}</b><span class="pill">${a.mode}</span><div>${esc(a.summary)}</div></div>`).join('')}</div>`}).join('')}</div>`;if(step===4)body=`<div class="card"><h2>4 · Wounds, Fate, Experience</h2><p>Starting Wounds are 1d5 + 18. Fate uses 1d10: 1–7 = 3, 8–9 = 4, 10 = 5. Every character has 12,000 XP already spent in prior training and receives 1,000 XP to spend at creation.</p><div class="grid"><div class="stat"><span>Wounds</span><b>${d.wounds.max}</b><button class="btn" id="rollWounds">Roll</button></div><div class="stat"><span>Fate</span><b>${d.fate.max}</b><button class="btn" id="rollFate">Roll</button></div></div><label>Starting XP available</label><input value="1000" disabled></div>`;if(step===5)body=`<div class="card"><h2>5 · Starting Equipment & Special Ability</h2><p class="small">Standard issue persists on the character sheet. Mission equipment can then be changed through Armoury/Requisition.</p><div>${CORE_START_GEAR.map(g=>`<span class="pill">${esc(g)}</span>`).join('')}</div><h3>${esc(sr.name)}</h3><div>${sr.gear.map(g=>`<span class="pill">${esc(g)}</span>`).join('')}</div><label>Special Ability</label><select id="abilityChoice">${sr.choices.map(a=>`<option ${d.specialAbility===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select><div id="abilityPreview" class="card">${esc((sr.choices.find(a=>a.name===d.specialAbility)||sr.choices[0]).summary)}</div>${d.speciality==='librarian'?`<h3>Starting Psychic Powers — choose three</h3>${['Inspire','Augury','Reading','Avenger','Iron Arm','Short-range Telepathy','Smite'].map(n=>`<label class="checkline"><input type="checkbox" data-startpower="${n}" ${d.powers.includes(n)?'checked':''}>${n}</label>`).join('')}`:''}</div>`;if(step===6)body=`<div class="card"><h2>6 · Give the Character Life</h2><label>Name</label><input id="draftName" value="${esc(d.name)}"><label>Past Event / service history</label><textarea id="draftPast">${esc(d.past||'')}</textarea><label>Power Armour History / quirk</label><textarea id="draftArmourHistory">${esc(d.armourHistory||'')}</textarea><p class="small">The Core encourages choosing a Chapter-specific past and determining a Power Armour history; these remain editable so the GM can use the exact campaign result.</p><button class="btn primary" id="finishCreate" style="width:100%">CREATE BATTLE-BROTHER</button></div>`;document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter I · Character Creation</div><h1>Forge a Battle-Brother</h1><div class="creationSteps">${[1,2,3,4,5,6].map(n=>`<i class="${n<=step?'done':''}"></i>`).join('')}</div></section>${body}<div class="stickyActions"><div class="mode"><button id="prevCreate" ${step===1?'disabled':''}>BACK</button><button id="nextCreate" ${step===6?'disabled':''}>NEXT</button></div></div>`;let prev=document.getElementById('prevCreate'),next=document.getElementById('nextCreate');prev.onclick=()=>{cr.step=Math.max(1,step-1);save();render()};next.onclick=()=>{if(step===1&&!cr.rolled)return modal('<h2>Generate Characteristics first</h2><p>Roll the nine Characteristics or use point allocation before continuing.</p>');if(step===3&&((rc.restrictions||[]).includes(d.speciality)))return modal('<h2>Restricted Speciality</h2><p>This Chapter cannot select that Speciality under the Core rules.</p>');cr.step=Math.min(6,step+1);save();render()};if(step===1){document.getElementById('rollAll').onclick=()=>{for(let k in d.chars)d.chars[k]=30+Math.floor(Math.random()*10)+1+Math.floor(Math.random()*10)+1;cr.rolled=true;cr.rerollUsed=false;save();render()};document.querySelectorAll('[data-rerollstat]').forEach(b=>b.onclick=()=>{let k=b.dataset.rerollstat;d.chars[k]=30+Math.floor(Math.random()*10)+1+Math.floor(Math.random()*10)+1;cr.rerollUsed=true;save();render()});document.getElementById('allocate').onclick=()=>modal('<h2>100-point allocation</h2><p>Set every Characteristic to 30, then allocate 100 points, with no more than +20 to any one Characteristic. For fast mobile use, this version keeps the dice method as the automated path; values remain editable after creation.</p>')}if(step===2)document.querySelectorAll('[data-pickchapter]').forEach(x=>x.onclick=()=>{d.chapter=x.dataset.pickchapter;save();render()});if(step===3)document.querySelectorAll('[data-pickspec]').forEach(x=>x.onclick=()=>{if(x.dataset.disabled==='true')return;d.speciality=x.dataset.pickspec;d.specialAbility='';d.powers=[];save();render()});if(step===4){document.getElementById('rollWounds').onclick=()=>{d.wounds.max=18+Math.floor(Math.random()*5)+1;d.wounds.damage=0;save();render()};document.getElementById('rollFate').onclick=()=>{let r=Math.floor(Math.random()*10)+1,f=r===10?5:r>=8?4:3;d.fate={current:f,max:f};save();render()}}if(step===5){let sel=document.getElementById('abilityChoice');if(!d.specialAbility)d.specialAbility=sel.value;sel.onchange=()=>{d.specialAbility=sel.value;save();render()};document.querySelectorAll('[data-startpower]').forEach(x=>x.onchange=()=>{let n=x.dataset.startpower;if(x.checked&&d.powers.length<3&&!d.powers.includes(n))d.powers.push(n);if(!x.checked)d.powers=d.powers.filter(y=>y!==n);save();render()})}if(step===6)document.getElementById('finishCreate').onclick=()=>{d.name=document.getElementById('draftName').value||'Unnamed Battle-Brother';d.past=document.getElementById('draftPast').value;d.armourHistory=document.getElementById('draftArmourHistory').value;d.baseXP=12000;d.xp={available:1000,spent:0};d.creationComplete=true;d.armour='power-armour';let sr=SPEC_RULES[d.speciality];d.loadout=[...new Set(sr.gear)];d.gear=CORE_START_GEAR.slice();d.skillsOwned={};sr.startSkills.forEach(s=>d.skillsOwned[s]=0);d.talentsOwned=sr.startTalents.slice();if(d.speciality==='techmarine')d.talentsOwned.push('Electro-Graft Use','Mechadendrite Use (Servo-Arm)');if(d.speciality==='librarian'){d.psyRating=3;if(d.powers.length!==3)d.powers=['Inspire','Iron Arm','Smite']}state.characters.push(d);state.active=state.characters.length-1;state.creator=null;state.view='advance';save();render()}}
function renderAdvance(){let ch=c(),rank=rankFor(ch),costs=CHAR_COSTS[ch.speciality]||CHAR_COSTS.tactical;let charRows=Object.keys(ch.chars).map(k=>{let lvl=ch.charAdvances[k]||0,cost=lvl<4?costs[k][lvl]:null;return `<tr><td><b>${k}</b> ${modChar(k)}</td><td>${['Simple','Intermediate','Trained','Expert','Max'][lvl]}</td><td>${cost===null?'—':cost+' XP'}</td><td><button class="btn" data-buychar="${k}" ${cost===null||ch.xp.available<cost?'disabled':''}>+5</button></td></tr>`}).join('');let purchases=[...GENERAL_R1.map(x=>[...x,'General Space Marine']),...SPEC_R1[ch.speciality].map(x=>[...x,ch.speciality]),...(rank>=1?DEATHWATCH_R1.map(x=>[...x,'Deathwatch']):[])];document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter II · Advancement</div><h1>Experience & Rank</h1><div class="grid3"><div class="stat"><span>Available XP</span><b>${ch.xp.available}</b></div><div class="stat"><span>Total XP</span><b>${totalXP(ch)}</b></div><div class="stat"><span>Rank</span><b>${rank}</b></div></div></section><div class="card"><h2>Characteristic Advances</h2><p class="small">Each purchase adds +5. Progression is cumulative: Simple → Intermediate → Trained → Expert, using the cost scheme for the current Speciality.</p><table class="tablelike"><tr><th>Characteristic</th><th>Next level</th><th>Cost</th><th></th></tr>${charRows}</table></div><div class="card"><h2>Rank 1 Advance Catalogue</h2><p class="small">Starting XP may be spent on General Space Marine, Chapter, and Speciality advances; newly joined characters do not use Deathwatch Advances during the initial 1,000 XP build. During campaign play, Deathwatch advances become available. Prerequisites are previewed before buying.</p><input class="search" id="advSearch" placeholder="Search advances…"><div id="advList">${purchases.map((x,i)=>`<div class="listrow advrow" data-q="${(x[0]+' '+x[2]+' '+x[4]).toLowerCase()}"><b>${esc(x[0])}</b><span class="pill">${x[1]} XP</span><span class="pill">${esc(x[2])}</span><div class="small">${esc(x[4])}${x[3]?' · Prerequisite: '+esc(x[3]):''}</div><button class="btn" data-buyadv="${i}" ${ch.xp.available<x[1]?'disabled':''}>Purchase</button></div>`).join('')}</div></div><div class="card"><h2>Elite / Homebrew Advance</h2><p class="small">The Core base cost for an Elite Advance is 750 XP, with GM discretion to alter cost and requirements. Use this for campaign-specific training or supplemental material not already indexed.</p><button class="btn" id="eliteAdv">Add Elite Advance</button></div><div class="card"><h2>Advance History</h2>${ch.advances.length?ch.advances.map(a=>`<div class="listrow">${esc(typeof a==='string'?a:a.name)} ${typeof a==='object'?`<span class="pill">${a.cost} XP</span>`:''}</div>`).join(''):'<div class="empty">No purchased advances yet.</div>'}</div>`;document.querySelectorAll('[data-buychar]').forEach(b=>b.onclick=()=>{let k=b.dataset.buychar,l=ch.charAdvances[k]||0,cost=costs[k][l];if(ch.xp.available<cost)return;ch.xp.available-=cost;ch.xp.spent+=cost;ch.charAdvances[k]=l+1;ch.chars[k]+=5;ch.advances.push({name:`${k} +5 (${['Simple','Intermediate','Trained','Expert'][l]})`,cost});save();render()});document.getElementById('advSearch').oninput=e=>document.querySelectorAll('.advrow').forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-buyadv]').forEach(b=>b.onclick=()=>{let x=purchases[+b.dataset.buyadv],cost=x[1];if(ch.xp.available<cost)return;modal(`<h2>Purchase ${esc(x[0])}?</h2><p>Cost: ${cost} XP</p>${x[3]?`<p><b>Prerequisite:</b> ${esc(x[3])}</p>`:''}<button class="btn primary" id="confirmAdv">CONFIRM</button>`);document.getElementById('confirmAdv').onclick=()=>{ch.xp.available-=cost;ch.xp.spent+=cost;ch.advances.push({name:x[0],cost});if(x[2]==='Skill')ch.skillsOwned[x[0]]=ch.skillsOwned[x[0]]===undefined?0:Math.min(20,ch.skillsOwned[x[0]]+10);else if(!ch.talentsOwned.includes(x[0]))ch.talentsOwned.push(x[0]);save();closeModal();render()}});document.getElementById('eliteAdv').onclick=()=>{modal(`<h2>Elite Advance</h2><label>Name</label><input id="eaName"><label>XP Cost</label><input id="eaCost" type="number" value="750"><label>Justification / prerequisites</label><textarea id="eaNote"></textarea><button class="btn primary" id="eaBuy">Purchase</button>`);document.getElementById('eaBuy').onclick=()=>{let cost=+document.getElementById('eaCost').value||750;if(ch.xp.available<cost)return alert('Not enough XP');let n=document.getElementById('eaName').value||'Elite Advance';ch.xp.available-=cost;ch.xp.spent+=cost;ch.advances.push({name:n,cost,note:document.getElementById('eaNote').value});save();closeModal();render()}}}
function fWeapon(name){return FULL_ARMOURY.find(w=>w.name===name)}
function weaponDetailCore(name){let w=fWeapon(name);if(!w)return;modal(`<h2>${esc(w.name)}</h2><div class="eyebrow">${esc(w.group)} · ${esc(w.class)}</div><div class="grid3"><div class="stat"><span>Damage</span><b style="font-size:1rem">${esc(w.damage)}</b></div><div class="stat"><span>Pen</span><b>${esc(w.pen)}</b></div><div class="stat"><span>Range</span><b style="font-size:1rem">${esc(w.range)}</b></div><div class="stat"><span>RoF</span><b style="font-size:1rem">${esc(w.rof)}</b></div><div class="stat"><span>Clip</span><b>${esc(w.clip)}</b></div><div class="stat"><span>Reload</span><b style="font-size:1rem">${esc(w.reload)}</b></div></div><p><b>Special:</b> ${esc(w.qualities||'—')}</p><p><b>Requisition:</b> ${w.req} · <b>Renown:</b> ${esc(w.renown)}</p><button class="btn primary" style="width:100%" id="detailAttack">ROLL ATTACK</button><div class="source">Core Rulebook · Chapter V: Armoury</div>`);document.getElementById('detailAttack').onclick=()=>{closeModal();attackWeaponCore(name)}}
function hitLocation(roll){let r=Number(String(roll).padStart(2,'0').split('').reverse().join(''));if(r===0)r=100;if(r<=10)return'Head';if(r<=20)return'Right Arm';if(r<=30)return'Left Arm';if(r<=70)return'Body';if(r<=85)return'Right Leg';return'Left Leg'}
function attackWeaponCore(name){let w=fWeapon(name),ch=c();if(!w)return;let melee=w.class==='Melee',base=modChar(melee?'WS':'BS');let isBolt=w.group==='Bolt',mastery=ch.specialAbility==='Bolter Mastery'&&ch.mode==='solo'&&isBolt;modal(`<h2>${esc(w.name)} Attack</h2><div class="small">Base ${melee?'WS':'BS'} ${base}${mastery?' · Bolter Mastery +10 and +2 Damage':''}</div><label>Attack Type</label><select id="atkType"><option value="standard">Standard Attack (+10)</option>${!melee&&String(w.rof).split('/')[1]&&String(w.rof).split('/')[1]!=='–'?'<option value="semi">Semi-Auto Burst (+10)</option>':''}${!melee&&String(w.rof).split('/')[2]&&String(w.rof).split('/')[2]!=='–'?'<option value="full">Full Auto Burst (+20)</option>':''}<option value="called">Called Shot (–20)</option></select><label>Aim</label><select id="atkAim"><option value="0">No Aim</option><option value="10">Half Action Aim +10</option><option value="20">Full Action Aim +20</option></select><label>Range / circumstance</label><select id="atkRange"><option value="0">Normal +0</option><option value="30">Point Blank +30</option><option value="10">Short +10</option><option value="-10">Long –10</option><option value="-30">Extreme –30</option></select><label>Other modifier</label><select id="atkOther">${DIFFICULTY.map(([n,m])=>`<option value="${m}" ${m===0?'selected':''}>${n} ${m>=0?'+':''}${m}</option>`).join('')}</select><button class="btn primary" id="goAttack" style="width:100%;margin-top:10px">ROLL ATTACK</button><div class="source">${esc(w.damage)} · Pen ${esc(w.pen)} · RoF ${esc(w.rof)} · ${esc(w.qualities)}</div>`);document.getElementById('goAttack').onclick=()=>{let typ=document.getElementById('atkType').value,tm={standard:10,semi:10,full:20,called:-20}[typ],m=tm+(+document.getElementById('atkAim').value)+(+document.getElementById('atkRange').value)+(+document.getElementById('atkOther').value)+(mastery?10:0),r=d100(base,m,w.name+' Attack'),hits=0;if(r.ok){hits=1;if(typ==='semi')hits=Math.min(Number(String(w.rof).split('/')[1])||1,1+Math.floor((r.deg-1)/2));if(typ==='full')hits=Math.min(Number(String(w.rof).split('/')[2])||1,1+Math.max(0,r.deg-1))}let loc=r.ok?hitLocation(r.roll):'—';showRoll(r,`<div><b>Hits:</b> ${hits} · <b>First location:</b> ${loc}</div><div class="small">Weapon: ${esc(w.damage)} · Pen ${esc(w.pen)}${mastery?' · Bolter Mastery adds +2 Damage':''}</div>`)}}
function renderArmoury(){let ch=c(),a=currentArmour();let armourCards=CORE_DATA.armours.map(x=>`<div class="arm"><div class="eyebrow">Armour</div><h3>${esc(x.name)}</h3><p class="small">${esc(x.summary)}</p><div>${Object.entries(x.ap||{}).map(([k,v])=>`<span class="pill">${k} ${v}</span>`).join('')}</div><button class="btn ${ch.armour===x.id?'danger':'primary'}" data-armour="${x.id}">${ch.armour===x.id?'EQUIPPED':'EQUIP'}</button></div>`).join('');let weaponCards=FULL_ARMOURY.map(w=>`<div class="arm itemFilter" data-q="${(w.name+' '+w.group+' '+w.class+' '+w.qualities).toLowerCase()}"><div class="eyebrow">${esc(w.group)} · ${esc(w.class)}</div><h3 class="click" data-fweapon="${esc(w.name)}">${esc(w.name)}</h3><div><span class="pill">${esc(w.damage)}</span><span class="pill">Pen ${esc(w.pen)}</span><span class="pill">${esc(w.range)}</span><span class="pill">${esc(w.rof)}</span></div><div class="small">Clip ${esc(w.clip)} · Reload ${esc(w.reload)} · Req ${w.req} · Renown ${esc(w.renown)} · ${esc(w.qualities)}</div><button class="btn ${ch.loadout.includes(w.name)?'danger':'primary'}" data-fequip="${esc(w.name)}">${ch.loadout.includes(w.name)?'RETURN':'EQUIP'}</button></div>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter V · Armoury</div><h1>Armoury</h1><p class="small">Weapons, armour and cybernetics are one persistent equipment system. Tap a weapon for its full tabletop profile or roll directly from the character sheet.</p></section><div class="card"><b>Mission Requisition:</b> ${state.mission.requisition} · <b>Renown:</b> ${ch.renown}</div><input class="search" id="armSearch2" placeholder="Search all ${FULL_ARMOURY.length} weapon profiles…"><div class="sectionTitle"><h2>Weapons</h2></div><div class="armGrid" id="weaponGrid">${weaponCards}</div><div class="sectionTitle"><h2>Armour</h2></div><div class="armGrid">${armourCards}</div><div class="card"><h2>Cybernetics</h2>${CORE_DATA.cybernetics.map(x=>`<div class="listrow click" data-corecat="cybernetics" data-coreid="${x.id}"><b>${esc(x.name)}</b><div class="small">${esc(x.summary)}</div></div>`).join('')}</div>`;document.getElementById('armSearch2').oninput=e=>document.querySelectorAll('.itemFilter').forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-fequip]').forEach(b=>b.onclick=()=>{let n=b.dataset.fequip,i=ch.loadout.indexOf(n);if(i>=0)ch.loadout.splice(i,1);else ch.loadout.push(n);save();render()});document.querySelectorAll('[data-armour]').forEach(b=>b.onclick=()=>{ch.armour=b.dataset.armour;save();render()});wireCore()}
function powerDetailCore(name){let p=FULL_PSYCHIC.find(x=>x.name===name);if(!p)return;modal(`<h2>${esc(p.name)}</h2><div class="eyebrow">${esc(p.discipline)}</div><div class="grid3"><div class="stat"><span>Action</span><b style="font-size:.9rem">${esc(p.action)}</b></div><div class="stat"><span>Range</span><b style="font-size:.9rem">${esc(p.range)}</b></div><div class="stat"><span>Opposed</span><b style="font-size:.9rem">${p.opposed?'Yes':'No'}</b></div></div><div class="card"><b>Effect</b><p>${esc(p.effect)}</p>${p.modifier?`<b>Special modifier</b><p>${esc(p.modifier)}</p>`:''}</div><button class="btn primary" style="width:100%" id="coreManifest">MANIFEST / ROLL</button><div class="source">${esc(p.source)}</div>`);document.getElementById('coreManifest').onclick=()=>{closeModal();manifestCore(name)}}
function manifestCore(name){let p=FULL_PSYCHIC.find(x=>x.name===name),ch=c(),base=modChar('WP'),basePR=ch.psyRating||3;if(!p)return;if(p.supplement)return showEntry({name:p.name,category:p.discipline,summary:p.effect,source:p.source});modal(`<h2>${esc(p.name)}</h2><p>${esc(p.effect)}</p><label>Power Level</label><select id="plvl"><option value="f">Fettered — half PR, no Phenomena from roll</option><option value="u" selected>Unfettered — full PR</option><option value="p">Push — +3 PR, automatic Phenomena</option></select><label>Situational Focus modifier</label><select id="pmod">${DIFFICULTY.map(([n,m])=>`<option value="${m}" ${m===0?'selected':''}>${n} ${m>=0?'+':''}${m}</option>`).join('')}</select><button class="btn primary" id="doManifest" style="width:100%;margin-top:10px">FOCUS POWER TEST</button><div class="source">Action ${esc(p.action)} · Range ${esc(p.range)} · ${p.opposed?'Opposed WP':'Not opposed'} · ${p.sustained?'Sustained':'Instant'}</div>`);document.getElementById('doManifest').onclick=()=>{let l=document.getElementById('plvl').value,pr=l==='f'?Math.ceil(basePR/2):l==='p'?basePR+3:basePR,target=base+5*pr+(+document.getElementById('pmod').value),r=d100(target,0,p.name+' Focus Power'),rr=String(r.roll).padStart(2,'0'),risk=l==='f'?'No Psychic Phenomena from this Focus Power roll.':l==='p'?'Push automatically requires a Psychic Phenomena roll.':rr[0]===rr[1]?'Double rolled: Psychic Phenomena check required.':'No double rolled.';showRoll(r,`<div>Effective PR ${pr} · Focus bonus +${5*pr}</div><div class="small">${risk}</div>`)}}
function renderPsykana(){let ch=c();let allowed=FULL_PSYCHIC.filter(p=>!['Blood Angels','Dark Angels','Space Wolves','Storm Wardens','Ultramarines','Raven Guard'].includes(p.discipline)||p.discipline===richChapter()?.name);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter VI · Psychic Powers</div><h1>Psykana</h1><p class="small">Every card exposes action economy, range, opposition, sustain state, actual mechanical effect and a Focus Power roll.</p></section>${ch.speciality==='librarian'?`<div class="card"><b>Psy Rating ${ch.psyRating||3}</b><div class="small">Focus Power uses Willpower and +5 × effective Psy Rating. A 91–00 always fails.</div></div>`:'<div class="card">This character is not a Librarian; browse-only mode.</div>'}<input id="psySearch2" class="search" placeholder="Search ${allowed.length} available discipline powers…"><div id="psyGrid2" class="powerGrid">${allowed.map(p=>`<div class="power pfilter" data-q="${(p.name+' '+p.discipline+' '+p.effect).toLowerCase()}"><div class="eyebrow">${esc(p.discipline)}</div><h3 class="click" data-powerfull="${esc(p.name)}">${esc(p.name)}</h3><div><span class="pill">${esc(p.action)}</span><span class="pill">${esc(p.range)}</span>${p.opposed?'<span class="pill">Opposed</span>':''}${p.sustained?'<span class="pill">Sustained</span>':''}</div><p class="small">${esc(p.effect)}</p>${ch.speciality==='librarian'?`<button class="btn primary" data-manifestfull="${esc(p.name)}">ROLL</button><button class="btn" data-togglepower="${esc(p.name)}">${ch.powers.includes(p.name)?'KNOWN':'LEARN / ADD'}</button>`:''}<div class="source">${esc(p.source)}</div></div>`).join('')}</div>`;document.getElementById('psySearch2').oninput=e=>document.querySelectorAll('.pfilter').forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-togglepower]').forEach(b=>b.onclick=()=>{let n=b.dataset.togglepower,i=ch.powers.indexOf(n);if(i>=0)ch.powers.splice(i,1);else ch.powers.push(n);save();render()});wireCore()}
function renderCombat(){let ch=c(),mv=movement(ch);let actions=[['Standard Attack','Half','One WS melee or BS ranged attack.'],['Aim','Half / Full','Gain an attack bonus against the chosen target.'],['Charge','Full',`Move up to ${mv.charge}m and make the charge attack.`],['Full Move','Full',`Move up to ${mv.full}m.`],['Run','Full',`Move up to ${mv.run}m; running affects incoming and outgoing attacks.`],['Guarded Attack','Full','A cautious melee attack that trades accuracy for improved defence.'],['All Out Attack','Full','An aggressive melee attack that sacrifices normal defensive reactions.'],['Semi-Auto Burst','Full','Ranged burst; extra hits are generated from Degrees of Success up to weapon RoF.'],['Full Auto Burst','Full','Ranged burst; extra hits are generated from Degrees of Success up to weapon RoF.'],['Overwatch','Full','Set a firing zone and react when the trigger conditions occur.'],['Suppressing Fire','Full','Lay down fire to force Pinning and control an area.']];document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter VIII · Combat</div><h1>Combat Console</h1><p class="small">Fast-play actions, initiative, attack math, injury state and condition tracking.</p></section><div class="grid"><div class="card"><h2>Initiative</h2><p>d10 + Agility Bonus</p><button class="btn primary" id="rollInit">ROLL INITIATIVE</button></div><div class="card"><h2>Round ${state.combat.round}</h2><button class="btn" id="nextRound">Next Round</button></div></div><div class="card"><h2>Actions</h2>${actions.map(a=>`<div class="combatAction"><div><b>${a[0]}</b><div class="small">${a[2]}</div></div><span class="pill">${a[1]}</span></div>`).join('')}</div><div class="card"><h2>Current Injury</h2><div class="grid3"><div class="stat"><span>Damage</span><b>${ch.wounds.damage}</b></div><div class="stat"><span>Wounds</span><b>${ch.wounds.max}</b></div><div class="stat"><span>Critical</span><b>${ch.critical}</b></div></div><button class="btn" id="critPlus">+ Critical</button><button class="btn" id="critMinus">– Critical</button><p class="small">Lightly Damaged: Damage ≤ 2 × TB. Heavily Damaged: Damage > 2 × TB. Critical Damage begins once Damage exceeds Wounds and requires medical attention to recover.</p></div><div class="card"><h2>Equipped Attacks</h2>${ch.loadout.map(n=>fWeapon(n)).filter(Boolean).map(w=>`<div class="listrow"><b>${esc(w.name)}</b><button class="btn primary" style="float:right" data-fattack="${esc(w.name)}">ROLL</button><div class="small">${esc(w.damage)} · Pen ${w.pen} · ${esc(w.rof)}</div></div>`).join('')}</div>`;document.getElementById('rollInit').onclick=()=>{let r=Math.floor(Math.random()*10)+1+bonus('Ag');modal(`<h2>Initiative</h2><div class="rollResult"><b>${r}</b> = d10 + Agility Bonus ${bonus('Ag')}</div>`)};document.getElementById('nextRound').onclick=()=>{state.combat.round++;save();render()};document.getElementById('critPlus').onclick=()=>{ch.critical++;save();render()};document.getElementById('critMinus').onclick=()=>{ch.critical=Math.max(0,ch.critical-1);save();render()};wireCore()}
function renderBestiaryCore(){let all=[...FULL_BESTIARY,...state.customEnemies];document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter XIII · Adversaries</div><h1>Bestiary</h1><p class="small">Troops, Elites, Masters, Horde bases and allied NPC profiles. Characteristics are rollable directly from each profile.</p></section><input id="enemySearchC" class="search" placeholder="Search faction, tier, trait or profile…"><div id="enemyListC" class="enemyGrid">${all.map(enemyCard).join('')}</div><button class="btn" style="width:100%;margin-top:12px" id="customEnemyC">+ Custom / Homebrew Enemy</button>`;document.getElementById('enemySearchC').oninput=e=>document.querySelectorAll('#enemyListC .enemy').forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?'':'none');document.getElementById('customEnemyC').onclick=()=>customEnemy();wireCore()}
function enemyDetail(name){let e=[...FULL_BESTIARY,...state.customEnemies].find(x=>x.name===name);if(!e)return;modal(`<h2>${esc(e.name)}</h2><div class="eyebrow">${esc(e.faction)} · ${esc(e.tier)}</div><div class="profileStats" style="margin-top:10px">${Object.entries(e.stats).map(([k,v])=>`<div class="click" data-eroll="${k}" data-et="${v}"><span>${k}</span><b>${v||'—'}</b></div>`).join('')}</div><div class="card"><b>Wounds</b> ${e.wounds} · <b>Movement</b> ${esc(e.move)} · <b>Armour</b> ${esc(e.armour)}</div><div class="card"><b>Traits / Talents</b><p>${esc(e.traits)}</p></div><div class="card"><b>Attacks</b><p>${esc(e.attacks)}</p></div><div class="card"><b>Special Rules & Modifiers</b><p>${esc(e.special)}</p></div><div class="source">${esc(e.source)}</div>`);document.querySelectorAll('[data-eroll]').forEach(x=>x.onclick=()=>showRoll(d100(+x.dataset.et,0,e.name+' '+x.dataset.eroll+' Test')))}
function renderMission(){let ch=c();let oathOpts=CORE_DATA.oaths.map(o=>`<option value="${o.id}" ${state.mission.oath===o.id?'selected':''}>${esc(o.name)}</option>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter VII · Missions</div><h1>${esc(state.mission.name)}</h1><p class="small">Mission priority, Oath, Requisition, Cohesion, complications and rewards are tied together here.</p></section><div class="card"><label>Mission name</label><input id="mName" value="${esc(state.mission.name)}"><label>Squad Leader</label><input id="mLeader" value="${esc(state.mission.leader||ch.name)}"><label>Oath</label><select id="mOath"><option value="">No oath selected</option>${oathOpts}</select><label>Requisition</label><input id="mReq" type="number" value="${state.mission.requisition}"><label>Countdown / time pressure (minutes; 0 = off)</label><input id="mCountdown" type="number" value="${state.mission.countdown||0}"><button id="saveMission" class="btn primary" style="margin-top:8px">Save Mission</button></div><div class="card"><h2>Objectives</h2>${state.mission.objectives.map((o,i)=>`<div class="listrow"><label class="checkline"><input type="checkbox" data-obj="${i}" ${o.done?'checked':''}><b>${esc(o.priority||'Objective')}</b> — ${esc(o.name)}</label></div>`).join('')||'<div class="empty">No objectives yet.</div>'}<button id="addObj" class="btn">+ Objective</button><button id="extractionTemplate" class="btn">Load Extraction-style Template</button></div><div class="card"><h2>Rewards</h2><label>XP award</label><input id="rewardXP" type="number" value="750"><button class="btn" id="giveXP">Award XP to Active Brother</button><label>Renown award</label><input id="rewardRenown" type="number" value="1"><button class="btn" id="giveRenown">Award Renown</button></div>`;document.getElementById('saveMission').onclick=()=>{state.mission.name=document.getElementById('mName').value;state.mission.leader=document.getElementById('mLeader').value;state.mission.oath=document.getElementById('mOath').value;state.mission.requisition=+document.getElementById('mReq').value||0;state.mission.countdown=+document.getElementById('mCountdown').value||0;save();render()};document.getElementById('addObj').onclick=()=>{modal(`<h2>Add Objective</h2><label>Priority</label><select id="op"><option>Primary</option><option>Secondary</option><option>Tertiary</option><option>Personal</option></select><label>Objective</label><input id="on"><button class="btn primary" id="oa">Add</button>`);document.getElementById('oa').onclick=()=>{state.mission.objectives.push({priority:document.getElementById('op').value,name:document.getElementById('on').value||'Objective',done:false});save();closeModal();render()}};document.querySelectorAll('[data-obj]').forEach(x=>x.onchange=()=>{state.mission.objectives[+x.dataset.obj].done=x.checked;save()});document.getElementById('extractionTemplate').onclick=()=>{state.mission.name='Extraction — Tantalus Template';state.mission.countdown=300;state.mission.objectives=[{priority:'Primary',name:'Recover the mission-critical datacore',done:false},{priority:'Secondary',name:'Recover the Magos if feasible',done:false},{priority:'Tertiary',name:'Complete Kill-team or personal honour objectives',done:false},{priority:'Primary',name:'Reach high ground and signal extraction before the countdown expires',done:false}];save();render()};document.getElementById('giveXP').onclick=()=>{ch.xp.available+=+document.getElementById('rewardXP').value||0;save();render()};document.getElementById('giveRenown').onclick=()=>{ch.renown+=+document.getElementById('rewardRenown').value||0;save();render()}}
function renderGM(){let ch=c();document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter IX · Game Master</div><h1>Watch Command</h1><p class="small">Campaign control: Kill-team resources, adversaries, missions, awards, Insanity and Corruption.</p></section><div class="grid"><div class="card click" onclick="setView('bestiary')"><h2>Bestiary</h2><p>${FULL_BESTIARY.length} built-in Core/NPC profiles plus homebrew.</p></div><div class="card click" onclick="setView('encounter')"><h2>Encounter</h2><p>${state.encounter.length} active profiles.</p></div><div class="card click" onclick="setView('mission')"><h2>Mission</h2><p>${state.mission.objectives.length} objectives · Req ${state.mission.requisition}</p></div><div class="card click" onclick="setView('advance')"><h2>XP</h2><p>${ch.xp.available} available · Rank ${rankFor(ch)}</p></div></div><div class="card"><h2>Insanity & Corruption</h2><div class="grid"><div><label>Insanity</label><input id="gmIns" type="number" value="${ch.insanity}"></div><div><label>Corruption</label><input id="gmCor" type="number" value="${ch.corruption}"></div></div><button class="btn" id="saveMental">Apply</button><button class="btn" id="buyInsanity">Spend 100 XP to remove 1 Insanity</button><p class="small">Space Marines have a Purity Threshold of 100 Corruption. Buying back Insanity requires GM permission and cannot reduce the character to a lower degree of madness.</p></div><div class="card"><h2>Horde Engine</h2><p>A Horde uses the base creature profile, replacing Wounds with Magnitude and location armour with one Horde Armour value. Use the Bestiary profile as the base and track Magnitude in Encounter.</p></div>`;document.getElementById('saveMental').onclick=()=>{ch.insanity=Math.max(0,+document.getElementById('gmIns').value||0);ch.corruption=Math.max(0,+document.getElementById('gmCor').value||0);save();render()};document.getElementById('buyInsanity').onclick=()=>{if(ch.insanity>0&&ch.xp.available>=100){ch.insanity--;ch.xp.available-=100;ch.xp.spent+=100;ch.advances.push({name:'Remove 1 Insanity Point',cost:100});save();render()}}}
function renderLibrary(){let cats=[['rules','Core Rules'],['skills','Skills'],['talents','Talents'],['traits','Traits'],['implants','Implants'],['solo','Solo Mode'],['squad','Squad Mode'],['oaths','Oaths'],['armours','Armour'],['cybernetics','Cybernetics'],['chapters','Chapters']];let setting=[{id:'set-jericho',name:'The Jericho Reach',category:'Setting',summary:'A long-lost Imperial region on the Eastern Fringe being reconquered through the Achilus Crusade. Its principal threats include Tau expansion, Chaos domains and Tyranid invasion, while the Deathwatch maintains its own long vigil.',source:'Core Rulebook',page:'322'},{id:'set-deathwatch',name:'The Deathwatch',category:'Setting',summary:'An elite Adeptus Astartes force whose Battle-Brothers are seconded from many Chapters and organized into Kill-teams for exceptional missions, especially against xenos threats.',source:'Core Rulebook',page:'304–321'},{id:'set-imperium',name:'The Imperium of Man',category:'Setting',summary:'The vast human realm whose institutions, armed forces and faith form the wider political and military context for Deathwatch service.',source:'Core Rulebook',page:'284–303'}];let all=[...cats.flatMap(([k])=>CORE_DATA[k]||[]),...setting,...FULL_PSYCHIC.map((p,i)=>({id:'fp'+i,name:p.name,category:'Psychic Power',summary:p.effect,source:p.source,page:''}))];document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Core Rulebook Reference</div><h1>Librarium</h1><p class="small">Searchable, concise rules index. It points play toward the relevant subsystem instead of reproducing whole rulebook pages.</p></section><input id="libSearch" class="search" placeholder="Search ${all.length} indexed entries…"><div class="coreTabs"><button class="btn" data-libcat="all">All</button>${[...new Set(all.map(x=>x.category))].map(x=>`<button class="btn" data-libcat="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="libList">${all.map((e,i)=>`<div class="card libitem click" data-cat="${esc(e.category)}" data-q="${(e.name+' '+e.category+' '+(e.summary||'')).toLowerCase()}" data-libindex="${i}"><div class="eyebrow">${esc(e.category)}</div><h3>${esc(e.name)}</h3><p class="small">${esc(e.summary||'')}</p><div class="source">${esc(e.source||'Core Rulebook')}${e.page?' · p. '+esc(e.page):''}</div></div>`).join('')}</div>`;let filter=()=>{let q=document.getElementById('libSearch').value.toLowerCase(),cat=state.libcat||'all';document.querySelectorAll('.libitem').forEach(x=>x.style.display=(x.dataset.q.includes(q)&&(cat==='all'||x.dataset.cat===cat))?'':'none')};document.getElementById('libSearch').oninput=filter;document.querySelectorAll('[data-libcat]').forEach(b=>b.onclick=()=>{state.libcat=b.dataset.libcat;filter()});document.querySelectorAll('[data-libindex]').forEach(x=>x.onclick=()=>showEntry(all[+x.dataset.libindex]))}
function renderMenu(){let ch=c();document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Configuration</div><h1>Menu</h1></section><div class="card"><label>Active Battle-Brother</label><select id="activeChar">${state.characters.map((x,i)=>`<option value="${i}" ${i===state.active?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>Name</label><input id="charName" value="${esc(ch.name)}"><label>Chapter</label><select id="chapterSel">${CHAPTERS.map(x=>`<option value="${x.id}" ${x.id===ch.chapter?'selected':''}>${x.name}</option>`).join('')}</select><label>Speciality</label><select id="specSel">${SPECIALITIES.map(x=>`<option value="${x.id}" ${x.id===ch.speciality?'selected':''}>${x.name}</option>`).join('')}</select><button id="saveChar" class="btn primary" style="width:100%;margin-top:10px">APPLY</button><button class="btn" onclick="state.creator=null;setView('create')">+ Guided Character Creation</button></div><div class="card"><h2>Appearance</h2><button class="btn" id="parch">Parchment</button><button class="btn" id="iron">Cold Iron</button><p class="small">Chapter primary colour controls UI accents; secondary colour controls the D100 pauldron trim.</p><div class="twoCol"><div><label>UI accent override</label><input id="accentColor" type="color" value="${state.accentOverride||chapter().primary}"></div><div><label>D100 trim override</label><input id="trimColor" type="color" value="${state.trimOverride||chapter().secondary}"></div></div><button class="btn" id="applyColors">Apply Colours</button><button class="btn" id="resetColors">Chapter Defaults</button></div><div class="card"><h2>Diagnostics</h2><button class="btn" id="runDiag">Run Core Integration Check</button><div id="diagOut"></div><div class="source">Version 6.2.0-core-integrated</div></div><div class="card"><h2>Data</h2><button class="btn danger" id="resetApp">Reset local app data</button></div>`;document.getElementById('activeChar').onchange=e=>{state.active=+e.target.value;save();render()};document.getElementById('saveChar').onclick=()=>{ch.name=document.getElementById('charName').value;ch.chapter=document.getElementById('chapterSel').value;ch.speciality=document.getElementById('specSel').value;save();render()};document.getElementById('parch').onclick=()=>{state.surface='parchment';save();render()};document.getElementById('iron').onclick=()=>{state.surface='iron';save();render()};document.getElementById('applyColors').onclick=()=>{state.accentOverride=document.getElementById('accentColor').value;state.trimOverride=document.getElementById('trimColor').value;save();render()};document.getElementById('resetColors').onclick=()=>{state.accentOverride='';state.trimOverride='';save();render()};document.getElementById('runDiag').onclick=()=>{let tests=[['Core weapon profiles',FULL_ARMOURY.length>=40],['Core skills indexed',CORE_DATA.skills.length>=40],['Implants indexed',CORE_DATA.implants.length===19],['Solo/Squad libraries',CORE_DATA.solo.length>5&&CORE_DATA.squad.length>10],['Psychic powers detailed',FULL_PSYCHIC.length>=40],['GM adversaries',FULL_BESTIARY.length>=15],['Rank engine',rankFor({baseXP:12000,xp:{spent:9000}})===3],['Characteristic schemes',Object.keys(CHAR_COSTS).length===6],['Persistent loadout',Array.isArray(ch.loadout)],['Mode isolation',modeAbilities().every(Boolean)]];document.getElementById('diagOut').innerHTML=tests.map(([n,ok])=>`<div class="${ok?'success':'failure'}">${ok?'✓':'✗'} ${n}</div>`).join('')};document.getElementById('resetApp').onclick=()=>{if(confirm('Reset all local app data?')){localStorage.removeItem(STORE);location.reload()}}}
function wireCore(){document.querySelectorAll('[data-corecat]').forEach(x=>x.onclick=()=>{let arr=CORE_DATA[x.dataset.corecat]||[],e=arr.find(y=>y.id===x.dataset.coreid);if(e)showEntry(e)});document.querySelectorAll('[data-rskill]').forEach(x=>x.onclick=()=>{let s=CORE_DATA.skills.find(y=>y.id===x.dataset.rskill),t=skillTargetRich(s);if(t!==null)showRoll(d100(t,0,s.name+' Test'))});document.querySelectorAll('[data-fweapon]').forEach(x=>x.onclick=()=>weaponDetailCore(x.dataset.fweapon));document.querySelectorAll('[data-fattack]').forEach(x=>x.onclick=()=>attackWeaponCore(x.dataset.fattack));document.querySelectorAll('[data-powerfull]').forEach(x=>x.onclick=()=>powerDetailCore(x.dataset.powerfull));document.querySelectorAll('[data-manifestfull]').forEach(x=>x.onclick=()=>manifestCore(x.dataset.manifestfull));document.querySelectorAll('[data-enemy]').forEach(x=>x.onclick=()=>enemyDetail(x.dataset.enemy));document.querySelectorAll('[data-addenemy]').forEach(x=>x.onclick=()=>{let e=[...FULL_BESTIARY,...state.customEnemies].find(y=>y.name===x.dataset.addenemy);if(e){state.encounter.push({name:e.name,tier:e.tier,current:e.wounds});save();modal(`<h2>Added</h2><p>${esc(e.name)} added to Encounter.</p>`)}})}

document.getElementById("roleBtn").onclick=()=>setRole(state.role==="gm"?"player":"gm");document.getElementById("surfaceBtn").onclick=()=>{state.surface=state.surface==="iron"?"parchment":"iron";save();render()};document.getElementById("d100").onclick=()=>showRoll(d100(50,0,"Open d100"));render();
</script></body></html>
