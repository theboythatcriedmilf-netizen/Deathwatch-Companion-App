ession must be bought in order: Simple, Intermediate, Trained, Expert.","source":"Core Rulebook","page":"57"},{"id":"rule-elite","name":"Elite Advance","category":"Advancement","summary":"A GM-approved advance outside the normal scheme. The GM determines availability, prerequisites, and XP cost.","source":"Core Rulebook","page":"59"},{"id":"rule-fear","name":"Fear","category":"GM Rule","summary":"Fear rating sets the difficulty of Fear Tests for ordinary characters. Battle-Brothers are unusually resistant, but frightening enemies can still threaten squad Cohesion.","source":"Core Rulebook","page":"277"},{"id":"rule-disposition","name":"Disposition","category":"GM Rule","summary":"The GM sets an NPC’s starting attitude. Interaction Tests can improve or worsen that attitude by steps according to Degrees of Success or Failure.","source":"Core Rulebook","page":"276"},{"id":"rule-hordes","name":"Hordes","category":"GM Rule","summary":"Represents large groups as a single abstract enemy with Magnitude. GM tools track Magnitude separately from ordinary Wounds.","source":"Core Rulebook","page":"359–360"},{"id":"rg-son-night","name":"Son of Night","category":"Demeanour","summary":"Raven Guard are patient, watchful and sparing with words, favouring observation and careful timing over direct confrontation. This is the Chapter Demeanour and can be triggered under the normal Demeanour rules.","source":"First Founding — supplied Raven Guard reference","page":"16"},{"id":"rg-curse","name":"Lure of the Shadows","category":"Primarch’s Curse","summary":"Level 1: when a small Raven Guard strike team is ordered into a direct attack, the Battle-Brother becomes resistant to the order, potentially approaching disobedience. Level 2: he becomes increasingly quiet and brooding; non-Raven Guard characters cannot benefit him with Command or Charm (Inspire). Level 3: he rejects the tactics of other Chapters and does not benefit from non-Raven Guard Squad Mode abilities.","source":"First Founding — supplied Raven Guard reference","page":"17"},{"id":"rg-guerrilla","name":"Guerrilla Training","category":"Talent","summary":"The Battle-Brother ignores the penalties to Silent Move and Concealment Tests normally imposed by wearing power armour.","source":"First Founding — supplied Raven Guard reference","page":"18"},{"id":"rg-ravenclaw","name":"Ravenclaw","category":"Chapter Trapping","summary":"A black Ravenclaw heraldic device commonly worn by veteran Raven Guard. Add +3 to Perception after all other modifiers.","source":"First Founding — supplied Raven Guard reference","page":"19"},{"id":"rg-calvaria","name":"Raven Calvaria","category":"Chapter Trapping","summary":"A bird-skull decoration worn from the neck or right shoulder pad. Add +2 to Agility after all other modifiers.","source":"First Founding — supplied Raven Guard reference","page":"19"},{"id":"rg-pictor","name":"Helmet Pictor","category":"Chapter Trapping","summary":"At the end of each mission, the wearer may make a Challenging (+0) Tactics Test using recorded combat data. Every Kill-team member gains +50 XP per Degree of Success.","source":"First Founding — supplied Raven Guard reference","page":"19"}],"difficulty":[["Trivial",60],["Elementary",50],["Simple",40],["Easy",30],["Routine",20],["Ordinary",10],["Challenging",0],["Difficult",-10],["Hard",-20],["Very Hard",-30],["Arduous",-40],["Punishing",-50],["Hellish",-60]],"oaths":[{"id":"astartes","name":"Oath of the Astartes","specialities":["tactical","assault","devastator"],"effect":"+2 Cohesion for the Mission.","abilities":["Squad Advance","Bolter Assault","Tactical Spacing"]},{"id":"emperor","name":"Oath to the Emperor","specialities":["tactical","librarian","apothecary"],"effect":"+10 to Willpower Tests for all Kill-team members during the Mission.","abilities":["Fire for Effect","Regroup","Strongpoint"]},{"id":"glory","name":"Oath of Glory","specialities":["tactical","assault"],"effect":"Each member gains +1 additional Renown for each Primary or Secondary Objective they personally help complete.","abilities":["Squad Advance","Bolter Assault","Furious Charge"]},{"id":"knowledge","name":"Oath of Knowledge","specialities":["librarian","apothecary"],"effect":"Choose one foe type: +10 WS and BS against that foe for the Mission. A Librarian may instead use the psychic-study option described by the Core rules.","abilities":["Go to Ground","Dig In","Strongpoint"]},{"id":"loyalty","name":"Oath of Loyalty","specialities":["tactical","apothecary"],"effect":"+1 on Cohesion Challenge rolls; the squad leader gains +10 to Tests made to resist Cohesion damage.","abilities":["Tactical Spacing","Regroup","Soak Fire"]},{"id":"weapon","name":"Oath of the Weapon","specialities":["techmarine","devastator"],"effect":"Personal weapons ignore Jams for the Mission; melee WS Tests used to confirm Righteous Fury may be re-rolled.","abilities":["Fire Support","Fire for Effect","Tank Buster"]}],"trappings":{"black-templars":[{"id":"bt-devotion-chain","name":"Devotion Chain","effect":"+3 to Willpower Tests made to resist Fear effects and Cohesion Damage.","source":"Core Rulebook p.169"},{"id":"bt-tabard-ornamental","name":"Tabard · Ornamental","effect":"+2 to Fellowship Tests.","source":"Core Rulebook p.169"},{"id":"bt-tabard-deathwatch","name":"Tabard · Deathwatch / Squad Heraldry","effect":"The Kill-team restores 1 bonus Cohesion for each Primary Objective achieved.","source":"Core Rulebook p.169"},{"id":"bt-tabard-chapter","name":"Tabard · Chapter Heraldry","effect":"+1 effective Rank for Black Templar Solo Mode effectiveness; −1 Squad Base Cohesion.","source":"Core Rulebook p.169"}],"blood-angels":[{"id":"ba-blood-drop","name":"Blood Drop Pendant","effect":"When spending a Fate Point for a Test bonus, use +13 instead of +10.","source":"Core Rulebook p.169"},{"id":"ba-icon-inspiration","name":"Golden Icon · Inspiration","effect":"+3 to Command Tests.","source":"Core Rulebook p.170"},{"id":"ba-icon-wrath","name":"Golden Icon · Wings of Wrath","effect":"+1 Damage when an attack hits during a Charge action.","source":"Core Rulebook p.170"},{"id":"ba-icon-purity","name":"Golden Icon · Purity Focus","effect":"When Corruption Points are gained, reduce the total gained by 1.","source":"Core Rulebook p.170"}],"dark-angels":[{"id":"da-robe-scholar","name":"Scholar’s Robe","effect":"+3 to Tests with one chosen Scholastic Lore.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Scholastic Lore"},{"id":"da-robe-secrets","name":"Robe of Secrets","effect":"+3 to Tests with one chosen Forbidden Lore.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Forbidden Lore"},{"id":"da-robe-seeker","name":"Seeker’s Robe","effect":"+3 to Scrutiny Tests.","source":"Core Rulebook p.170"}],"space-wolves":[{"id":"sw-wolf-pelt","name":"Wolf Pelt","effect":"+2 to Intimidate Tests.","source":"Core Rulebook p.170"},{"id":"sw-totem-hunter","name":"Runic Totem · Bloodied Hunter","effect":"+1 to Damage inflicted by Righteous Fury.","source":"Core Rulebook p.170"},{"id":"sw-totem-sea","name":"Runic Totem · Sea Wolf","effect":"+3 to Tests with one chosen Drive or Pilot Skill.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Drive or Pilot Skill"},{"id":"sw-totem-sun","name":"Runic Totem · Sun Wolf","effect":"+3 to Awareness Tests.","source":"Core Rulebook p.170"}],"storm-wardens":[{"id":"stw-amulet-might","name":"Tempest Amulet · Might","effect":"+2 Strength after all other modifiers.","source":"Core Rulebook p.170"},{"id":"stw-amulet-guardian","name":"Tempest Amulet · Guardian","effect":"Counts as a Charm.","source":"Core Rulebook p.170"}],"ultramarines":[{"id":"um-cingulum-adamantine","name":"Cingulum · Adamantine Inlays","effect":"+3 to Parry Tests.","source":"Core Rulebook p.170"},{"id":"um-cingulum-leadership","name":"Cingulum · Marks of Leadership","effect":"+3 to Tests made to regain Cohesion or prevent Cohesion Damage.","source":"Core Rulebook p.170"},{"id":"um-heraldry-scroll","name":"Heraldry Scroll","effect":"+10 Kill Markers to an Assault Mission when the scroll was displayed in at least one battle.","source":"Core Rulebook p.170"}],"raven-guard":[{"id":"rg-ravenclaw","name":"Ravenclaw","effect":"+3 Perception after all other modifiers.","source":"First Founding p.19"},{"id":"rg-calvaria","name":"Raven Calvaria","effect":"+2 Agility after all other modifiers.","source":"First Founding p.19"},{"id":"rg-picter","name":"Helmet Picter","effect":"After a mission, the supplied Tactics review can grant the Kill-team bonus XP per Degree of Success.","source":"First Founding p.19"}]},"personalDemeanours":["Calculating","Gregarious","Hot-Blooded","Studious","Taciturn","Pious","Stoic","Scornful","Ambitious","Proud"],"startingPackages":{"apothecary":{"gear":["Reductor","Narthecium"],"loadout":[]},"assault":{"gear":["Astartes Jump Pack"],"loadout":[]},"devastator":{"gear":[],"loadout":[]},"librarian":{"gear":[],"loadout":[]},"tactical":{"gear":[],"loadout":[]},"techmarine":{"gear":["Astartes Servo-Arm"],"loadout":[]}},"techCybernetics":["Augur Array","Bionic Arm","Bionic Heart","Bionic Locomotion","Bionic Respiratory System","Cybernetic Senses","Mind Impulse Unit (MIU)"],"armourMarks":[{"id":"mk1","name":"Mk I “Thunder”","availability":"Ancient / GM choice","ap":{"Head":6,"Body":8,"Left Arm":6,"Right Arm":6,"Left Leg":4,"Right Leg":4},"weight":"200–250 kg","strength":"Variable +15 to +25","autoSenses":"None","lifeSupport":"None","pain":0,"vox":"None","magBoots":"None","nutrient":"None","recoil":"None","manual":-15,"histories":0,"note":"Mk I is a broad early armour type rather than one standard pattern. Complete suits may include leg protection; the source notes that legs can be unarmoured on incomplete examples. It does not coordinate with the Black Carapace, so enemies receive the normal modifier for attacking a Hulking target."},{"id":"mk2","name":"Mk II “Crusade”","availability":"Ancient / GM choice","ap":{"Head":7,"Body":9,"Left Arm":7,"Right Arm":7,"Left Leg":7,"Right Leg":7},"weight":"280 kg","strength":"+25","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes*","nutrient":"1 week","recoil":"Yes","manual":-20,"histories":0,"note":"Most Mk II suits have permanently magnetised boot soles; later examples introduced the ability to switch them."},{"id":"mk3","name":"Mk III “Iron”","availability":"Ancient / GM choice","ap":{"Head":9,"Body":10,"Left Arm":9,"Right Arm":9,"Left Leg":9,"Right Leg":9},"weight":"300 kg","strength":"+25","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":8,"vox":"Yes","magBoots":"Yes","nutrient":"1 week","recoil":"Yes","manual":-20,"histories":0,"note":"Designed for frontal assaults. The rear of the suit uses AP 6 instead of its much stronger frontal protection."},{"id":"mk4","name":"Mk IV “Maximus”","availability":"Standard-issue result","ap":{"Head":7,"Body":9,"Left Arm":7,"Right Arm":7,"Left Leg":7,"Right Leg":7},"weight":"220 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":3,"note":"A standard-issue possibility with the greatest number of Power Armour History rolls among the commonly fielded Marks in the supplied table."},{"id":"mk5","name":"Mk V “Heresy”","availability":"Standard-issue result","ap":{"Head":8,"Body":9,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"200 kg","strength":"+20","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":2,"note":"A standard-issue possibility with two Power Armour History rolls."},{"id":"mk6","name":"Mk VI “Corvus”","availability":"Standard-issue result","ap":{"Head":8,"Body":9,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"170 kg","strength":"+20","autoSenses":"+15 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":2,"note":"The strongest auto-sense modifier in the supplied Mark table; this remains a general Astartes armour Mark available independently of Chapter."},{"id":"mk7","name":"Mk VII “Aquila”","availability":"Most common standard issue","ap":{"Head":8,"Body":10,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"180 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":1,"note":"The most common standard-issue result in the supplied d10 generation table."},{"id":"mk8","name":"Mk VIII “Errant”","availability":"Standard-issue result; often officers/veterans","ap":{"Head":8,"Body":11,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"190 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":1,"note":"The raised gorget protects the neck: when a hit lands on the head, roll 1d10; on 8–10 treat it as a body hit instead. The wearer also gains +5 to Command Tests."}],"fieldGear":[{"id":"grav-chute","name":"Astartes Grav Chute","req":5,"renown":"—","source":"Expanded Wargear p.144","summary":"A low-power suspensor descent system used when stealthy airborne insertion is preferable to drop pods or teleportation.","mechanics":"Allows a safe, guided fall from any height. It is a descent system rather than a jump pack and cannot provide powered upward movement."},{"id":"camo-tarp","name":"Cameleoline Tarpaulin","req":5,"renown":"—","source":"Expanded Wargear p.145","summary":"Five-metre colour-shifting sheets that can be joined to conceal vehicles, emplacements or camps.","mechanics":"Using the tarpaulin to hide a vehicle or emplacement grants +30 to Concealment Tests."},{"id":"diagnosticator","name":"Diagnosticator","req":25,"renown":"Distinguished","restriction":"Techmarine","source":"Expanded Wargear p.145","summary":"A portable machine-spirit diagnostic instrument used by Deathwatch Techmarines.","mechanics":"+20 to Tech-Use Tests when diagnosing or repairing malfunctioning equipment."},{"id":"infiltriol","name":"Infiltriol Enamel","req":10,"renown":"Distinguished","source":"Expanded Wargear p.145","summary":"A specialised coating formulated around the sensory biology of Hive Fleet Dagon.","mechanics":"When applied to power armour, most Tyranid organisms do not recognise the wearer as an enemy. More intelligent or perceptive synapse/vanguard organisms may expose the deception. The supplied rule is specifically formulated for Hive Fleet Dagon."},{"id":"fenris-wolf-helm","name":"Fenris-Pattern Wolf Helm","req":"N/A","renown":"Respected","restriction":"Space Wolves","source":"Expanded Wargear p.143 & table p.147","summary":"A Space Wolves power-armour helm whose sensors are tuned to the Chapter’s heightened senses.","mechanics":"Acts as a normal power-armour helmet. A Space Wolf may freely use Wolf Senses while also benefiting from the power armour auto-senses. Armour table profile: Head AP 8, 4 kg."}],"armourHistories":[{"roll":1,"name":"Cover Not Before the Enemy","effect":"The armour is ostentatious and authority-laden. Suffer an additional –20 to Silent Move and Concealment Tests beyond normal power-armour penalties, but gain +10 to Command Tests."},{"roll":2,"name":"None Shall Escape the Emperor’s Wrath","effect":"Targeting systems are exceptionally exacting. Gain +5 Ballistic Skill, but suffer –10 to Dodge Tests."},{"roll":3,"name":"Thine Arm Be the Scourge of the Impure","effect":"The suit favours close combat. Gain +5 Weapon Skill; while the helmet is worn, Ballistic Skill Tests suffer –5."},{"roll":4,"name":"Death Is Joy","effect":"The armour’s machine spirit exults in killing blows. Add +2 Damage to attacks that inflict Critical Damage and +1 Magnitude damage to any successful attack against a Horde."},{"roll":5,"name":"A Fury Like Lightning","effect":"Hyper-articulated systems sharpen movement. Gain +5 Agility and +1 to Initiative rolls."},{"roll":6,"name":"Thy Strength Be Legend","effect":"The suit provides exceptional physical assistance. Gain an additional +10 Strength from the armour, applied after modifiers for Unnatural Strength."},{"roll":7,"name":"Terror Be Thy Friend","effect":"The armour projects menace. Gain Fear (1) against foes engaged with you in melee, unless they already possess Fear."},{"roll":8,"name":"Lead from the Front","effect":"The suit has a long command lineage. Add +1 to the Kill-team’s Cohesion total; this can stack with another suit bearing the same history."},{"roll":9,"name":"Bring Death from Afar","effect":"The suit is adapted for mobile fire support. Ignore the normal moving-and-firing penalties with Pistol or Basic weapons on Semi- or Full-Auto; Heavy weapons count as Basic for the purpose of moving and firing on Semi- or Full-Auto."},{"roll":10,"name":"To Forget Is to Forgive. Forget Nothing.","effect":"The suit carries a sworn legacy of vengeance. Gain Hatred against one chosen enemy group."}],"pasts":{"black-templars":[["Received a Vision","Before a major battle you sought the Emperor’s guidance and experienced a private vision. Your actions afterward helped defeat a powerful enemy and reinforced your faith."],["Established a Keep","You helped establish a Black Templars Chapter keep on an isolated frontier world during an eternal crusade; the fortress remains a monument to that service."],["The Geonide Crusade","You recovered valuable Adeptus Mechanicus artefacts during a rebellion on Geonide and personally fought rogue psykers."],["Trained a Neophyte","You upheld Chapter tradition by mentoring a Neophyte through numerous battles; not every aspirant you trained necessarily survived to become an Initiate."],["Boarding Action","You took part in a violent void-borne boarding assault against an enemy vessel and helped turn the course of a larger crusade."]],"blood-angels":[["Scouring of Ultramar","You served in a long campaign supporting the Ultramarines against Hive Fleet Behemoth and returned with hard-won experience fighting Tyranids."],["Assault on Baal","You helped defend Baal and its fortress-monastery from an Ork invasion."],["A New Beginning","You witnessed a rare reconciliation with a Blood Angels successor Chapter and endured the tensions that surrounded it."],["Golgotha Strike Force","You served in Strike Force Bloodhawk during the fighting on Golgotha, whether in the armoured spearhead or supporting Stormraven assaults."],["Purged a Space Hulk","Alongside First Company Terminators, you helped cleanse a vast space hulk of xenos, renegades, or worse."]],"dark-angels":[["Encountered the Fallen","You have personally encountered—or caught a rare glimpse of—one of the Fallen. You are sworn to secrecy regarding what you learned."],["Served in the Ravenwing","You fought with the Ravenwing in high-speed attacks and may know secrets that remain hidden from most of the Chapter."],["Preserved the Secrets of the Chapter","You proved your loyalty during a mission involving dangerous records or truths concerning the Dark Angels, and the secret remains yours to keep."],["Thunderhawk Gunner","You served as gunner aboard a Thunderhawk and gained an unusual perspective on war in the air, on the ground, and in void operations."],["The Lion and the Wolf","You fought a ritual duel with a Space Wolf while serving alongside the Chapter and won distinction—and perhaps a lasting grudge."]],"space-wolves":[["Bitter Vengeance","You fought face-to-face with Thousand Sons Chaos Space Marines, one of the Space Wolves’ most hated enemies."],["Fenris Hunter","You hunted and slew one of Fenris’s deadly native beasts, such as a kraken, ice bear, or Fenrisian wolf."],["Service in the Fleet","You fought repeatedly among the stars and may have commanded a rapid strike vessel or served as an officer aboard a larger ship."],["Wolf-Tamer","You once fought beside a powerful Fenrisian wolf that you had tamed as a trusted battle companion."],["The Great Hunt","You took part in one of the Great Hunts seeking signs of Leman Russ and returned with stories of distant worlds and hard battles."]],"storm-wardens":[["Sole Survivor","You were the only survivor of your squad after facing a particularly dangerous enemy, learning first-hand that even Astartes can fall."],["Tank Gunner","You served as gunner in a Predator, Land Raider, or other Chapter vehicle and know the machine-spirits of armoured warfare well."],["Service in the Fleet","You fought repeatedly in void operations and may have commanded a rapid strike vessel or served as an officer aboard a larger ship."],["The Scouring of Vigil","You bear scars from the campaign against the Slaugth and the savage close-quarter fighting beneath Vigil."],["Honour Preserved","You helped a fellow Battle-Brother preserve his honour when chance, duty, or conflicting oaths threatened it."]],"ultramarines":[["Tyrannic War Veteran","You fought in the Battle for Macragge against Hive Fleet Behemoth and survived the costly defence."],["Cleansed Thrax","You helped defeat daemonic forces on the Chaos-corrupted Forge World of Thrax before the world was condemned."],["Endured the Waaagh!","You stood with the Ultramarines against Waaagh! Gutshredda and fought repeated greenskin assaults."],["Banner Bearer","You were entrusted with a squad or company standard, an honour relinquished only when you joined the Deathwatch."],["Scout Sergeant","You once led and mentored Scouts of the Tenth Company on their path toward full Battle-Brother status."]],"raven-guard":[["Targus VIII","You served in Shrike’s campaign on Targus VIII. After your extraction craft was destroyed, you spent an extended period conducting guerrilla operations behind Ork lines; that performance helped earn your Deathwatch secondment."],["Operation Chronos","You witnessed Battle-Brothers fall under Enslaver domination during Operation Chronos and retain a bitter grievance toward the White Scars for failing to intervene."],["Covert Strike","You led a small Raven Guard force deep behind enemy lines and broke an entrenched foe through stealth and assassination. Allied Imperial Fists helped recommend you for secondment."],["The Fall of Voldorius","You fought beside White Scars during the final hunt for the daemon prince Voldorius. Shared victory softened an older Chapter rivalry, at least in your eyes."],["Survivor","Your covert force was dropped into a heavily contested war zone and its landing site was destroyed. You alone survived and carry a memento of your fallen brothers."]]},"generalPasts":[{"name":"Distinguished Service","summary":"You were selected for the Deathwatch after accomplishing an unusually difficult task for your Chapter."},{"name":"Slayer of a Dangerous Foe","summary":"Your reputation was forged by defeating an enemy considered exceptionally dangerous even by Astartes standards."},{"name":"Last Brother Standing","summary":"You survived an assault or disaster that destroyed or crippled the rest of your force, and your conduct drew the attention of your superiors."},{"name":"Defender of the Imperium","summary":"You were wounded or distinguished yourself holding an important objective or protecting an Imperial commander or other vital asset."},{"name":"Exile or Atonement","summary":"Your secondment is partly a test: service in the Deathwatch is intended to teach humility, redeem a failure, or settle a matter of honour."}],"rgAdvances":[["Concealment",200,"Skill",""],["Concealment +10",300,"Skill","Concealment"],["Concealment +20",300,"Skill","Concealment +10"],["Silent Move",200,"Skill",""],["Silent Move +10",300,"Skill","Silent Move"],["Silent Move +20",300,"Skill","Silent Move +10"],["Tactics (Recon and Stealth)",200,"Skill",""],["Tactics (Recon and Stealth) +10",300,"Skill","Tactics (Recon and Stealth)"],["Tactics (Recon and Stealth) +20",300,"Skill","Tactics (Recon and Stealth) +10"],["Guerrilla Training",400,"Talent",""],["Hatred (Traitor Legions)",200,"Talent",""],["Hard Target",500,"Talent","Ag 40"],["Sure Strike",500,"Talent","WS 30"]],"advRules":{"Air of Authority":{"kind":"Talent","prereq":"Fel 30","mechanics":"After a successful Command Test, affect 1d10 + Fellowship Bonus valid NPC targets. Command Tests against NPCs outside your normal authority are made at –10. This does not affect hostile targets.","source":"Core Rulebook · Talents & Traits"},"Sound Constitution":{"kind":"Talent","mechanics":"Immediately increases the Battle-Brother’s maximum Wounds by +1. Career schemes can permit multiple purchases.","direct":"wound+1","source":"Core Rulebook · Talents & Traits"},"Resistance (Cold)":{"kind":"Talent","mechanics":"Gain +10 on Tests made to resist cold effects.","source":"Core Rulebook · Talents & Traits"},"Resistance (Heat)":{"kind":"Talent","mechanics":"Gain +10 on Tests made to resist heat effects.","source":"Core Rulebook · Talents & Traits"},"Resistance (Poisons)":{"kind":"Talent","mechanics":"Gain +10 on Tests made to resist poison effects.","source":"Core Rulebook · Talents & Traits"},"Autosanguine":{"kind":"Talent","mechanics":"For healing, always count as Lightly Damaged and naturally remove 2 Damage per day.","source":"Core Rulebook · Talents & Traits"},"Hardy":{"kind":"Talent","prereq":"T 40","mechanics":"When receiving medical treatment or recovering from injuries, treat the character as Lightly Damaged for healing purposes.","source":"Core Rulebook · Talents & Traits"},"Catfall":{"kind":"Talent","prereq":"Ag 30","mechanics":"When falling, make an Agility Test as a Free Action. Success and each additional Degree of Success reduce the effective falling distance by metres equal to Agility Bonus when determining falling Damage.","source":"Core Rulebook · Talents & Traits"},"Takedown":{"kind":"Talent","mechanics":"As a Half Action, declare a takedown before the WS Test. If the hit would inflict at least 1 D function effectiveArmourAP(ch){const z={Head:0,Body:0,'Left Arm':0,'Right Arm':0,'Left Leg':0,'Right Leg':0};if(!armourIsWorn(ch))return z;if(ch.armourSystem==='terminator')return {Head:14,Body:14,'Left Arm':14,'Right Arm':14,'Left Leg':14,'Right Leg':14};if(ch.armourSystem==='scout'){if(ch.scoutAP==='table')return {Head:0,Body:6,'Left Arm':6,'Right Arm':6,'Left Leg':6,'Right Leg':6};return {Head:0,Body:7,'Left Arm':7,'Right Arm':7,'Left Leg':5,'Right Leg':5}}let ap={...z,...(armourMark(ch)?.ap||{})};if(!effectiveHelmetOn(ch))ap.Head=0;return ap}
function damageResistance(ch){let tb=charBonus(ch,'T'),ap=effectiveArmourAP(ch),locations={Head:tb+ap.Head,Body:tb+ap.Body,Arms:tb+Math.min(ap['Left Arm'],ap['Right Arm']),Legs:tb+Math.min(ap['Left Leg'],ap['Right Leg'])};return{tb,ap,locations,worn:armourIsWorn(ch),armour:currentArmourName(ch)}}
function damageResistanceHTML(ch,compact=false){let r=damageResistance(ch);return `<div class="card resistanceCard"><div class="sectionLead"><div><h2>${compact?'Base Resistance':'Base Damage Resistance'}</h2><div class="small">Toughness Bonus + Armour Points at the location hit</div></div><button class="whyBtn" data-resistance-why aria-label="Explain damage resistance">?</button></div><div class="resistanceGrid"><div class="resistanceCell"><span>Head</span><b>${r.locations.Head}</b></div><div class="resistanceCell"><span>Body</span><b>${r.locations.Body}</b></div><div class="resistanceCell"><span>Arms</span><b>${r.locations.Arms}</b></div><div class="resistanceCell"><span>Legs</span><b>${r.locations.Legs}</b></div></div><div class="resistanceFormula"><span class="pill">TB ${r.tb}</span><span class="pill">${r.worn?'ARMOUR WORN':'ARMOUR REMOVED'}</span></div><p class="small">This is the ordinary pre-attack baseline. Some game effects reduce or ignore Armour and/or Toughness, so the final reduction can differ.</p></div>`}
function resistanceWhyModal(ch){let r=damageResistance(ch),rows=[['Head',r.ap.Head,r.locations.Head],['Body',r.ap.Body,r.locations.Body],['Left Arm',r.ap['Left Arm'],r.tb+r.ap['Left Arm']],['Right Arm',r.ap['Right Arm'],r.tb+r.ap['Right Arm']],['Left Leg',r.ap['Left Leg'],r.tb+r.ap['Left Leg']],['Right Leg',r.ap['Right Leg'],r.tb+r.ap['Right Leg']]];modal(`<h2>Base Damage Resistance</h2><p>Deathwatch normally reduces incoming Damage by Toughness Bonus and, when the hit location is protected, by the Armour Points on that location.</p><div class="resolverTrace"><div class="calcLine"><span>Toughness Bonus</span><b>${r.tb}</b></div>${rows.map(x=>`<div class="calcLine"><span>${x[0]} · AP ${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div><p class="small">Selected armour: ${esc(r.armour)} · ${r.worn?'worn':'removed'}. These totals are a convenience display, not a replacement for special rules that bypass either source of reduction.</p><div class="source">Deathwatch Core Rulebook · Combat pp.245, 250 · Armoury pp.160–165</div>`,{label:'Damage resistance calculation'})}
function armourTimingText(ch){if(ch.armourSystem==='power')return 'Core: 20 minutes to don or remove unaided; assistance can reduce the process, but never below 5 minutes because the proper rites must still be observed.';if(ch.armourSystem==='terminator')return 'Core: no exact don/remove duration is stated in the indexed Terminator rules. Its configuration and arming require proper facilities and qualified Techmarine support; use the GM’s ruling for elapsed time.';return 'Expanded Wargear: no exact whole-suit don/remove duration is stated in the indexed Scout Armour rules; use the GM’s ruling for elapsed time.'}
function armourWearControlHTML(ch){let worn=armourIsWorn(ch);return `<div class="armourStateCard ${worn?'':'removed'}"><div class="armourStateHead"><div><b>${esc(currentArmourName(ch))}</b><div class="small">${worn?'WORN · rules active':'REMOVED · armour rules inactive'}</div></div><button class="btn ${worn?'danger':'primary'}" id="armourWearToggle">${worn?'REMOVE ARMOUR':'DON ARMOUR'}</button></div><p class="armourTiming">${esc(armourTimingText(ch))}</p><p class="small">The button records the character’s current state after the table has resolved the required time. It does not make the don/remove process instantaneous.</p><div class="source">Power Armour timing: Deathwatch Core Rulebook p.161 · Scout Armour: Expanded Wargear · Terminator Armour: Core Rulebook p.164</div></div>`}
function toggleArmourWear(ch){pushUndo(ch,armourIsWorn(ch)?'Remove armour':'Don armour');ch.armourWorn=!armourIsWorn(ch);recordActivity(ch,`${currentArmourName(ch)} ${ch.armourWorn?'donned':'removed'}`,'equipment');save();render()}

function parseGroupSkillName(name){let m=String(name||'').match(/^(.+?)\s*\(([^)]+)\)(?:\s*\+(10|20))?$/);if(!m)return null;return {base:m[1].trim(),spec:m[2].trim(),bonus:Number(m[3]||0)}}
function isGroupSkill(s){return !!s&&String(s.descriptor||'').includes('Group')}
function grantGroupSkill(ch,base,spec,bonus=0){if(!base||!spec)return;ch.groupSkills=ch.groupSkills||{};ch.groupSkills[base]=ch.groupSkills[base]||{};ch.groupSkills[base][spec]=Math.max(Number(ch.groupSkills[base][spec]||0),Number(bonus||0))}
function grantSkillTraining(ch,name,bonus=0){let p=parseGroupSkillName(name),rec=p?skillRecord(p.base):skillRecord(name);if(p&&isGroupSkill(rec)){grantGroupSkill(ch,p.base,p.spec,p.bonus||bonus);return}if(rec&&isGroupSkill(rec)){return}ch.skillsOwned=ch.skillsOwned||{};ch.skillsOwned[name]=Math.max(Number(ch.skillsOwned[name]||0),Number(bonus||0))}
function migrateGroupSkills(ch,isDraft=false){ch.groupSkills=ch.groupSkills||{};let defaults=DATA.baseStartingGroupSkills||{};for(const [base,specs] of Object.entries(defaults)){if(Object.prototype.hasOwnProperty.call(ch.skillsOwned||{},base)){let b=Number(ch.skillsOwned[base]||0);for(const sp of specs)grantGroupSkill(ch,base,sp,b);delete ch.skillsOwned[base]}}
  for(const [name,val] of Object.entries({...ch.skillsOwned})){let p=parseGroupSkillName(name),rec=p?skillRecord(p.base):null;if(p&&isGroupSkill(rec)){grantGroupSkill(ch,p.base,p.spec,p.bonus||Number(val||0));delete ch.skillsOwned[name]}}
  if(Object.prototype.hasOwnProperty.call(ch.skillsOwned||{},'Tactics')){let b=Number(ch.skillsOwned.Tactics||0);grantGroupSkill(ch,'Tactics',ch.tacticsChoice||'Unspecified (migrated save)',b);delete ch.skillsOwned.Tactics}
  if(ch.tacticsChoice&&!ch.groupSkills?.Tactics?.[ch.tacticsChoice])grantGroupSkill(ch,'Tactics',ch.tacticsChoice,0)
}
function knownGroupSkills(ch,base){return Object.entries(ch.groupSkills?.[base]||{}).map(([spec,bonus])=>({spec,bonus:Number(bonus||0)}))}
function groupSkillLabel(ch,s){let a=knownGroupSkills(ch,s.name);return a.length?`Known: ${a.map(x=>`${x.spec}${x.bonus?` +${x.bonus}`:''}`).join(' · ')}`:'No trained group'}
function characteristic(ch,key){return rulesResolve(ch,'characteristic',key).value}
function charBonus(ch,key){let v=characteristic(ch,key);let b=Math.floor(v/10);if(key==='S'||key==='T')b*=2;return b}
function movement(ch){return rulesResolve(ch,'movement','').value}
function derived(ch){return {chars:Object.fromEntries(CHAR_KEYS.map(k=>[k,characteristic(ch,k)])),movement:movement(ch),resistance:rulesResolve(ch,'resistance',''),rank:rankFor(ch),renownRank:renownRank(ch.renown),trapping:trapping(ch),armour:armourMark(ch)}}
function woundMax(ch){let base=Number(ch.wounds?.max||0);return base}
function conditionPenalty(ch){return Number(ch.fatigue)>0?-10:0}
function skillRecord(nameOrId){return DATA.skills.find(s=>s.id===nameOrId||s.name===nameOrId)}
function skillMastery(ch,s,spec=''){if(isGroupSkill(s)){let vals=knownGroupSkills(ch,s.name);if(spec)return Number(ch.groupSkills?.[s.name]?.[spec]||0);return vals.length?Math.max(...vals.map(x=>x.bonus)):0}let v=ch.skillsOwned?.[s.name];return v===true?0:Number(v||0)}
function skillTarget(ch,s,extra=0,spec=''){return rulesResolve(ch,'skill',s,{extra,spec}).target}
function degrees(target,roll){target=Number(target);roll=Number(roll);if(roll<=target)return {success:true,degrees:Math.floor((target-roll)/10)};return {success:false,degrees:Math.floor((roll-target)/10)}}
function coreTest(target,opts={}){let roll=opts.roll||d100roll();let t=Number(target);let r=degrees(t,roll);if(opts.focusPower&&roll>=91)r={success:false,degrees:Math.floor((roll-t)/10)};if(opts.autoFailAt&&roll>=opts.autoFailAt)r={success:false,degrees:Math.floor(Math.max(0,roll-t)/10)};return {roll,target:t,...r}}
function testText(r){return `${r.roll} vs ${r.target} — ${r.success?'SUCCESS':'FAILURE'}${r.degrees?` · ${r.degrees} Degree${r.degrees===1?'':'s'} of ${r.success?'Success':'Failure'}`:''}`}

function applyTheme(){let ch=current(),id=state.creator?.draft?.chapter||ch?.chapter;let cp=chapterBy(id);let colors=cp?.colors||['#151719','#d8d8d8','#9b1d22'];document.documentElement.style.setProperty('--accent',colors[0]);document.documentElement.style.setProperty('--trim',colors[1]);document.body.classList.toggle('iron',state.surface==='iron');document.body.classList.toggle('creating',state.view==='create');document.body.classList.toggle('compactMode',state.settings?.playerDensity==='compact');let d=document.getElementById('d100');if(d)d.textContent=chapterAbbr(id);let b=document.querySelector('.brand .small');if(b)b.textContent=`Core-integrated Deathwatch companion · ${DISPLAY_VERSION} · schema ${SCHEMA_VERSION}`;let rb=document.getElementById('roleBtn');if(rb)rb.textContent=state.role==='gm'?'GM':'PLAYER'}
function nav(){let items;if(!current()){items=[['home','Home'],['create','Create'],['library','Librarium'],['menu','Menu']]}else if(state.role==='gm'){items=[['gm','Command'],['bestiary','Bestiary'],['encounter','Encounter'],['combat','Status'],['mission','Mission'],['library','Librarium'],['menu','Menu']]}else{items=[['session','Play'],['sheet','Brother'],['skills','Skills'],['advance','XP'],['armoury','Equipment']];if(current()?.speciality==='librarian')items.push(['psykana','Psykana']);items.push(['combat','Status'],['mission','Mission'],['library','Librarium'],['menu','Menu'])}document.getElementById('nav').innerHTML=items.map(([v,n])=>`<button data-view="${v}" class="${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''}>${n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view))}
function setView(v){state.view=v;save();render()}
function render(){nav();let f={home:renderHome,create:renderCreate,session:renderSession,sheet:renderSheet,skills:renderSkills,demeanours:renderDemeanours,abilities:renderAbilities,advance:renderAdvance,armoury:renderArmory,psykana:renderPsykana,combat:renderCombat,mission:renderMission,library:renderLibrary,timeline:renderTimeline,coverage:renderCoverage,menu:renderMenu,gm:renderGM,bestiary:renderBestiary,encounter:renderEncounter}[state.view]||renderHome;f();applyTheme();wireCommon();wireFrameworkCommon(current())}
function wireCommon(){document.querySelectorAll('[data-roll-char]').forEach(b=>b.onclick=()=>quickCharRoll(b.dataset.rollChar));document.querySelectorAll('[data-roll-skill]').forEach(b=>b.onclick=()=>{let sk=DATA.skills.find(x=>x.id===b.dataset.rollSkill);if(current()&&sk)recordRecent(current(),'skill',sk.id,sk.name);quickSkillRoll(b.dataset.rollSkill)})}
function restoreTextFocus(id,pos){requestAnimationFrame(()=>{let el=document.getElementById(id);if(!el)return;el.focus();let p=clamp(Number(pos)||0,0,String(el.value||'').length);try{el.setSelectionRange(p,p)}catch(e){}})}

function modal(html,opts={}){modalReturnFocus=document.activeElement;let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalBack" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.label||'Dialog')}"><button class="modalX" aria-label="Close">×</button>${html}</div></div>`;let box=root.querySelector('.modal');root.querySelector('.modalX').onclick=closeModal;root.querySelector('.modalBack').onclick=e=>{if(e.target===e.currentTarget)closeModal()};box.addEventListener('keydown',trapModal);setTimeout(()=>{let f=box.querySelector('button,input,select,textarea,[tabindex]:not([tabindex="-1"])');f?.focus()},0)}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalReturnFocus?.focus?.();modalReturnFocus=null}
function trapModal(e){if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key!=='Tab')return;let fs=[...e.currentTarget.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!fs.length)return;let first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}

function renderHome(){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Astartes Vigil Companion · ${DISPLAY_VERSION}</div><h1>Your Watch Begins Here</h1><p>One-file Deathwatch campaign companion for complete player-side character tracking plus separate deep GM mission, encounter, and adversary tools.</p></section><div class="grid"><div class="card"><h2>Create Battle-Brother</h2><p class="small">Core-grounded seven-stage character creation. Chapter mechanics are only enabled where sourced rules are loaded.</p><button class="btn primary" id="homeCreate">CREATE</button></div><div class="card"><h2>Import Existing Vigil</h2><p class="small">Restore a device-local save exported from this app.</p><button class="btn" id="homeImport">IMPORT JSON</button></div></div><div class="card"><h2>Rules integrity</h2><p class="small">Fresh installs begin neutral. Unsupported supplement Chapters remain visible as references but cannot silently invent mechanics.</p></div>`;document.getElementById('homeCreate').onclick=startCreation;document.getElementById('homeImport').onclick=importState}
function startCreation(){state.creator={step:1,mode:'',draft:neutralDraft()};state.view='create';save();render()}

function creationHeader(){let cr=state.creator||{step:1};return `<section class="hero"><div class="eyebrow">Character Creation · Stage ${cr.step}/7</div><h1>${esc(cr.draft?.name||'New Battle-Brother')}</h1><div class="progress"><i style="width:${cr.step/7*100}%"></i></div></section>`}
function renderCreate(){if(!state.creator)state.creator={step:1,mode:'',draft:neutralDraft()};let cr=state.creator,d=cr.draft,body='';if(cr.step===1)body=createStep1(cr,d);if(cr.step===2)body=createStep2(d);if(cr.step===3)body=createStep3(d);if(cr.step===4)body=createStep4(d);if(cr.step===5)body=createStep5(d);if(cr.step===6)body=createStep6(d);if(cr.step===7)body=createStep7(d);document.getElementById('app').innerHTML=creationHeader()+body+`<div class="createNav"><button class="btn" id="cBack" ${cr.step===1?'disabled':''}>BACK</button><button class="btn danger" id="cCancel">CANCEL</button><button class="btn primary" id="cNext">${cr.step===7?'COMPLETE':'NEXT'}</button></div>`;wireCreate(cr,d);applyTheme()}
function createStep1(cr,d){let spent=CHAR_KEYS.reduce((a,k)=>a+Number(d.pointBuy?.[k]||0),0),left=100-spent;let controls=CHAR_KEYS.map(k=>`<div class="pbrow"><label>${CHAR_LABELS[k]} <b>${d.creationMethod==='pointbuy'?30+Number(d.pointBuy[k]||0):d.chars[k]}</b></label>${d.creationMethod==='pointbuy'?`<div><button class="btn" data-pb="${k}" data-dir="-1">−</button><input aria-label="${CHAR_LABELS[k]} point allocation" class="pbinput" data-pbin="${k}" type="number" min="0" max="20" value="${d.pointBuy[k]||0}"><button class="btn" data-pb="${k}" data-dir="1">+</button></div>`:''}</div>`).join('');return `<div class="card"><h2>1 · Generate Characteristics</h2><p class="small">Choose the standard 2d10+30 method with one re-roll, or allocate exactly 100 points from a base of 30 with no more than +20 in a single Characteristic.</p><button class="btn ${d.creationMethod==='random'?'primary':''}" id="methodRandom">RANDOM</button><button class="btn ${d.creationMethod==='pointbuy'?'primary':''}" id="methodPB">POINT BUY</button>${d.creationMethod==='random'?`<button class="btn" id="rollAll">${Object.keys(d.randomBase||{}).length?'REROLL ALL (resets single reroll)':'ROLL ALL'}</button><p class="small">Single result re-roll: ${d.rerollUsed?'used':'available'}</p>`:''}${d.creationMethod==='pointbuy'?`<div class="budget ${left<0?'bad':''}"><b>${spent}/100 spent</b> · ${left} remaining</div>`:''}<div class="charGrid">${controls}</div>${d.creationMethod==='random'&&Object.keys(d.randomBase||{}).length?`<div class="card subtle"><b>Single re-roll</b><select id="rerollChar" ${d.rerollUsed?'disabled':''}>${CHAR_KEYS.map(k=>`<option value="${k}">${CHAR_LABELS[k]} (${d.chars[k]})</option>`).join('')}</select><button class="btn" id="rerollOne" ${d.rerollUsed?'disabled':''}>REROLL SELECTED</button></div>`:''}</div>`}
function createStep2(d){return `<div class="card"><h2>2 · Chapter</h2><p class="small">Select the Battle-Brother’s home Chapter. Every selectable card shows the identity rules you are accepting before you choose it.</p><div class="chapterGrid">${DATA.chapters.map(c=>{let mods=Object.entries(c.mods||{}).map(([k,v])=>`${k} +${v}`).join(' · ');if(c.choiceMods)mods=`Choose ${c.choiceMods.count} Characteristics · +${c.choiceMods.amount} each`;let restrictions=(c.restrictions||[]).map(x=>specBy(x).name).join(', ');return `<button class="chapterChoice ${d.chapter===c.id?'selected':''}" data-chapter="${c.id}" ${SUPPORTED.has(c.id)?'':'disabled'}><b>${esc(c.name)}</b><span>${esc(c.summary||'')}</span><span><strong>Characteristics:</strong> ${esc(mods||'No fixed modifier')}</span><span><strong>Demeanour:</strong> ${esc(c.demeanour||'—')} · <strong>Solo:</strong> ${esc(c.solo||'—')}</span>${restrictions?`<span><strong>Restricted:</strong> ${esc(restrictions)}</span>`:''}${SUPPORTED.has(c.id)?`<span class="sourceNotice">${esc(sourceText(c))}</span>`:`<em>Supplement mechanics pending — visible for reference, not selectable as canonical rules.</em>`}</button>`}).join('')}</div></div>`}
function createStep3(d){let cp=chapterBy(d.chapter),trs=DATA.trappings[d.chapter]||[],cd=DEMEANOUR_DETAILS.chapter[d.chapter],pd=DEMEANOUR_DETAILS.personal[d.personalDemeanour]||'';return `<div class="card"><h2>3 · Chapter Identity</h2><div class="detailGrid"><div class="detailCard"><div class="eyebrow">Fixed Chapter Demeanour</div><h3>${esc(cp?.demeanour||'')}</h3><p>${esc(cd?.summary||cp?.summary||'')}</p><div class="source">${esc(cd?`${cd.source} p.${cd.page}`:sourceText(cp))}</div></div><div class="detailCard"><div class="eyebrow">Chapter Solo Mode</div><h3>${esc(cp?.solo||'')}</h3>${(()=>{let s=DATA.solo.find(x=>x.name===cp?.solo);return s?`<p>${esc(s.summary||'')}</p><div class="source">${esc(sourceText(s))}</div>`:'<p class="small">Rules summary is not loaded.</p>'})()}</div></div><div class="card subtle"><h3>Personal Demeanour · choose one</h3><p class="small">Your Chapter Demeanour is fixed. Your Personal Demeanour can change later as the character develops.</p>${DATA.personalDemeanours.map(x=>`<button class="choiceCard infoButton ${d.personalDemeanour===x?'selected':''}" data-personaldem="${esc(x)}"><b>${esc(x)}</b><span class="small">${esc(DEMEANOUR_DETAILS.personal[x]||'')}</span></button>`).join('')}${pd?`<div class="ruleEffect"><b>Selected: ${esc(d.personalDemeanour)}</b><p>${esc(pd)}</p></div>`:''}</div><div class="card subtle"><h3>Chapter Trapping · choose one</h3><p class="small">Every option remains readable before selection; choosing one never hides the rules text for the others.</p>${trs.map(t=>`<button class="choiceCard infoButton ${d.chapterTrappingId===t.id?'selected':''}" data-trapchoice="${esc(t.id)}"><b>${esc(t.name)}</b><span class="small">${esc(t.effect||'')}</span><span class="sourceNotice">${esc(t.source||'')}</span></button>`).join('')}${(()=>{let tr=trs.find(x=>x.id===d.chapterTrappingId);return tr?.requiresFocus?`<label>${esc(tr.focusLabel||'Choose focus')}</label><input id="trapFocus" value="${esc(d.chapterTrappingFocus||'')}">`:''})()}</div>${d.chapter==='ultramarines'?`<div class="card subtle"><b>Ultramarines Characteristic choices</b><p class="small">Choose two different Characteristics to receive +5.</p><div class="chips">${CHAR_KEYS.map(k=>`<label class="chip"><input type="checkbox" data-um="${k}" ${d.ultramarineChoices.includes(k)?'checked':''}> ${k}</label>`).join('')}</div></div>`:''}</div>`}
function createStep4(d){let cp=chapterBy(d.chapter);return `<div class="card"><h2>4 · Speciality</h2><div class="chapterGrid">${DATA.specialities.map(s=>{let blocked=cp?.restrictions?.includes(s.id);return `<button class="chapterChoice ${d.speciality===s.id?'selected':''}" data-spec="${s.id}" ${blocked?'disabled':''}><b>${esc(s.name)}</b><span>${esc(s.summary||'')}</span>${blocked?'<em>Restricted by Chapter</em>':''}</button>`}).join('')}</div></div>`}
function createStep5(d){let cp=chapterBy(d.chapter);return `<div class="card"><h2>5 · Wounds, Fate & Starting XP</h2><div class="grid3"><div class="stat"><span>Wounds</span><b>${d.wounds.max||'—'}</b><button class="btn" id="rollWounds">ROLL 1d5+18${cp?.woundsBonus?` +${cp.woundsBonus}`:''}</button></div><div class="stat"><span>Fate</span><b>${d.fate.max||'—'}</b><button class="btn" id="rollFate">ROLL d10</button></div><div class="stat"><span>Starting XP</span><b>1,000</b><small>12,000 spent baseline</small></div></div>${d.wounds.max&&d.fate.max?`<div class="rulebox">Movement snapshot: Half ${movementPreview(d).half}m · Full ${movementPreview(d).full}m · Charge ${movementPreview(d).charge}m · Run ${movementPreview(d).run}m</div>`:''}</div>`}

function createStep6(d){let pack=DATA.startingPackages[d.speciality]||{gear:[],loadout:[]};let lib=d.speciality==='librarian';let allowed=['Inspire','Augury','Reading','Avenger','Iron Arm','Short-range Telepathy','Smite'];return `<div class="card"><h2>6 · Starting Equipment</h2><div class="rulebox"><b>All Specialities</b><p>${DATA.coreStartGear.map(esc).join(' · ')}</p></div><div class="rulebox"><b>${esc(specBy(d.speciality).name)}</b><p>${(pack.gear||[]).map(esc).join(' · ')}</p></div>${d.speciality==='techmarine'?`<label>Starting Common cybernetic</label><select id="techCyber"><option value="">Choose…</option>${DATA.techCybernetics.map(x=>`<option ${d.techmarineCybernetic===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}${lib?`<div class="card subtle"><b>Starting Psychic Powers · choose exactly 3</b><p class="small">Read what each power does before selecting it. These are the Core starting choices for a new Librarian.</p>${allowed.map(n=>{let p=DATA.psychic.find(x=>x.name===n);return `<div class="powerChoice"><label><input data-startpower="${esc(n)}" type="checkbox" ${d.powers.includes(n)?'checked':''}><div><h3>${esc(n)}</h3>${p?`<div class="statusStrip"><span class="pill">${esc(p.action)}</span><span class="pill">${esc(p.range)}</span>${p.sustained?'<span class="pill">Sustained</span>':''}</div><p class="small">${esc(p.effect)}</p><div class="source">${esc(p.source||'')}</div>`:'<p class="small">Starting power reference.</p>'}</div></label></div>`}).join('')}<p class="small">Selected: ${d.powers.length}/3</p></div>`:''}</div>`}
function createStep7(d){let pasts=[...(DATA.generalPasts||[]),...((DATA.pasts[d.chapter]||[]).map(x=>typeof x==='string'?x:(x.name||x.past||JSON.stringify(x))))];return `<div class="card"><h2>7 · Give the Battle-Brother Life</h2><label>Name</label><input id="charNameCreate" value="${esc(d.name)}" placeholder="Battle-Brother name"><label>Starting Tactics training</label><select id="tacticsCreate"><option value="">Choose one…</option>${(DATA.tacticsGroups||[]).map(x=>`<option ${d.tacticsChoice===x?'selected':''}>${esc(x)}</option>`).join('')}</select><p class="small">Tactics is a Skill Group: the starting Battle-Brother is trained in one field, not every Tactics specialisation.</p><label>Past</label><select id="pastCreate"><option value="">Choose or leave open…</option>${pasts.map(p=>`<option ${d.past===p?'selected':''}>${esc(p)}</option>`).join('')}</select><div class="rulebox"><b>Starting Power Armour History</b><p>${esc((d.armourHistories||[])[0]||'Not rolled')}</p><button class="btn" id="createHistory">ROLL d10 HISTORY</button></div><label>Notes / appearance</label><textarea id="notesCreate" rows="5">${esc(d.notes||'')}</textarea><div class="rulebox"><b>Creation audit</b><p>${creationAuditText(d)}</p></div></div>`}
function creationAuditText(d){let cp=chapterBy(d.chapter),sp=specBy(d.speciality);return `${cp?.name||'No Chapter'} · ${sp?.name||'No Speciality'} · ${d.personalDemeanour||'No personal Demeanour'} · ${trapping(d)?.name||'No trapping'} · Wounds ${d.wounds.max||'—'} · Fate ${d.fate.max||'—'}`}
function validateCreate(step,d){if(step===1){if(!d.creationMethod)return 'Choose a Characteristic generation method.';if(d.creationMethod==='pointbuy'&&CHAR_KEYS.reduce((a,k)=>a+Number(d.pointBuy[k]||0),0)!==100)return 'Point Buy must spend exactly 100 points.';if(d.creationMethod==='random'&&Object.keys(d.randomBase||{}).length!==9)return 'Roll all nine Characteristics first.'}if(step===2&&!SUPPORTED.has(d.chapter))return 'Choose a Chapter with complete loaded mechanics.';if(step===3){if(!d.personalDemeanour)return 'Choose a Personal Demeanour.';if(!d.chapterTrappingId)return 'Choose one Chapter Trapping.';let tr=trapping(d);if(tr?.requiresFocus&&!String(d.chapterTrappingFocus||'').trim())return 'Choose the trapping’s focus.';if(d.chapter==='ultramarines'&&new Set(d.ultramarineChoices).size!==2)return 'Ultramarines must choose exactly two different Characteristics.'}if(step===4){if(!d.speciality)return 'Choose a Speciality.';if(chapterBy(d.chapter)?.restrictions?.includes(d.speciality))return 'That Speciality is restricted by this Chapter.'}if(step===5&&(!d.wounds.max||!d.fate.max))return 'Roll both Wounds and Fate.';if(step===6){if(d.speciality==='techmarine'&&!d.techmarineCybernetic)return 'Choose the Techmarine’s starting cybernetic.';if(d.speciality==='librarian'&&d.powers.length!==3)return 'A starting Librarian must choose exactly three starting psychic powers.'}if(step===7&&!String(d.name||'').trim())return 'Give the Battle-Brother a name.';if(step===7&&!(DATA.tacticsGroups||[]).includes(d.tacticsChoice))return 'Choose one starting Tactics field.';if(step===7&&!(d.armourHistories||[]).length)return 'Roll the starting power armour history.';return ''}
function wireCreate(cr,d){
  document.getElementById('cBack').onclick=()=>{cr.step--;save();render()};document.getElementById('cCancel').onclick=()=>{if(confirm('Cancel character creation?')){state.creator=null;state.view=current()?'sheet':'home';save();render()}};document.getElementById('cNext').onclick=()=>{let er=validateCreate(cr.step,d);if(er){toast(er,'bad');return}if(cr.step<7){cr.step++;save();render()}else finishCreation(d)};
  if(cr.step===1){document.getElementById('methodRandom').onclick=()=>{d.creationMethod='random';cr.mode='random';d.pointBuy=Object.fromEntries(CHAR_KEYS.map(k=>[k,0]));save();render()};document.getElementById('methodPB').onclick=()=>{d.creationMethod='pointbuy';cr.mode='pointbuy';d.chars=Object.fromEntries(CHAR_KEYS.map(k=>[k,30]));d.pointBuy=Object.fromEntries(CHAR_KEYS.map(k=>[k,0]));save();render()};if(d.creationMethod==='random'){document.getElementById('rollAll').onclick=()=>{for(const k of CHAR_KEYS){let v=30+rollDie(10)+rollDie(10);d.chars[k]=v;d.randomBase[k]=v}d.rerollUsed=false;save();render()};let one=document.getElementById('rerollOne');if(one)one.onclick=()=>{let k=document.getElementById('rerollChar').value;d.chars[k]=30+rollDie(10)+rollDie(10);d.randomBase[k]=d.chars[k];d.rerollUsed=true;save();render()}}document.querySelectorAll('[data-pb]').forEach(b=>b.onclick=()=>adjustPointBuy(d,b.dataset.pb,Number(b.dataset.dir)));document.querySelectorAll('[data-pbin]').forEach(i=>i.onchange=()=>setPointBuy(d,i.dataset.pbin,i.value))}
  if(cr.step===2)document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{d.chapter=b.dataset.chapter;d.chapterTrappingId='';d.chapterTrappingFocus='';d.ultramarineChoices=[];if(chapterBy(d.chapter)?.restrictions?.includes(d.speciality))d.speciality='';save();render()});
  if(cr.step===3){document.querySelectorAll('[data-personaldem]').forEach(b=>b.onclick=()=>{d.personalDemeanour=b.dataset.personaldem;save();render()});document.querySelectorAll('[data-trapchoice]').forEach(b=>b.onclick=()=>{d.chapterTrappingId=b.dataset.trapchoice;d.chapterTrappingFocus='';save();render()});let tf=document.getElementById('trapFocus');if(tf)tf.onchange=e=>{d.chapterTrappingFocus=e.target.value;save()};document.querySelectorAll('[data-um]').forEach(x=>x.onchange=()=>{let k=x.dataset.um;if(x.checked&&!d.ultramarineChoices.includes(k)){if(d.ultramarineChoices.length>=2){x.checked=false;toast('Choose only two Characteristics.','bad');return}d.ultramarineChoices.push(k)}else if(!x.checked)d.ultramarineChoices=d.ultramarineChoices.filter(v=>v!==k);save()})}
  if(cr.step===4)document.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>{d.speciality=b.dataset.spec;d.powers=[];save();render()});
  if(cr.step===5){document.getElementById('rollWounds').onclick=()=>{d.wounds.max=18+rollDie(5)+(chapterBy(d.chapter)?.woundsBonus||0);save();render()};document.getElementById('rollFate').onclick=()=>{let r=rollDie(10);d.fate.max=d.fate.current=r<=7?3:r<=9?4:5;save();render()}}
  if(cr.step===6){let t=document.getElementById('techCyber');if(t)t.onchange=e=>{d.techmarineCybernetic=e.target.value;save()};document.querySelectorAll('[data-startpower]').forEach(x=>x.onchange=()=>{let p=x.dataset.startpower;if(x.checked){if(d.powers.length>=3){x.checked=false;toast('Choose exactly three starting powers.','bad');return}d.powers.push(p)}else d.powers=d.powers.filter(v=>v!==p);save();render()})}
  if(cr.step===7){document.getElementById('charNameCreate').oninput=e=>d.name=e.target.value;document.getElementById('tacticsCreate').onchange=e=>{d.tacticsChoice=e.target.value;save()};document.getElementById('pastCreate').onchange=e=>d.past=e.target.value;document.getElementById('notesCreate').oninput=e=>d.notes=e.target.value;document.getElementById('createHistory').onclick=()=>{let h=DATA.armourHistories[rollDie(10)-1];d.armourHistories=[h.name];save();render()}}
}
function adjustPointBuy(d,k,dir){let cur=Number(d.pointBuy[k]||0),spent=CHAR_KEYS.reduce((a,x)=>a+Number(d.pointBuy[x]||0),0);if(dir>0&&spent>=100)return;if(dir>0&&cur>=20)return;if(dir<0&&cur<=0)return;d.pointBuy[k]=cur+dir;d.chars[k]=30+d.pointBuy[k];save();render()}
function setPointBuy(d,k,val){let wanted=clamp(Math.trunc(Number(val)||0),0,20),others=CHAR_KEYS.filter(x=>x!==k).reduce((a,x)=>a+Number(d.pointBuy[x]||0),0);wanted=Math.min(wanted,100-others);d.pointBuy[k]=wanted;d.chars[k]=30+wanted;save();render()}
function finishCreation(d){let er=validateCreate(7,d);if(er){toast(er,'bad');return}let cp=chapterBy(d.chapter),pack=DATA.startingPackages[d.speciality]||{gear:[],loadout:[]};let ch=migrateCharacter(deep(d),true);ch.creationComplete=true;ch.skillsOwned={};ch.groupSkills={};for(const sk of DATA.baseStartingSkills||[])grantSkillTraining(ch,sk,0);for(const [base,specs] of Object.entries(DATA.baseStartingGroupSkills||{}))for(const sp of specs)grantGroupSkill(ch,base,sp,0);grantGroupSkill(ch,'Tactics',d.tacticsChoice,0);for(const sk of DATA.specRules[d.speciality]?.startSkills||[])grantSkillTraining(ch,sk,0);ch.talentsOwned=[...new Set([...(DATA.baseStartingTalents||[]),...(DATA.specRules[d.speciality]?.startTalents||[]),...(cp?.bonusTalents||[])])];ch.traitsOwned=[...new Set([...(DATA.baseStartingTraits||[]),...(ch.traitsOwned||[])])];ch.gear=[...DATA.coreStartGear,...(pack.gear||[])];ch.loadout=[...new Set([...(pack.loadout||[]),'Astartes Bolt Pistol','Astartes Combat Knife'])];if(ch.chapterTrappingId==='stw-sacris-claymore'||ch.stormWardenClaymore){ch.loadout=ch.loadout.filter(x=>x!=='Astartes Combat Knife');ch.loadout.push('Sacris Claymore')}if(ch.chapterTrappingId==='da-ceremonial-sword')ch.loadout.push('Ceremonial Sword');ch.loadout=[...new Set(ch.loadout)];ch.equippedGear=[...ch.loadout];if(ch.techmarineCybernetic)ch.gear.push(ch.techmarineCybernetic);addTimeline(ch,'Character','Battle-Brother created',`${cp?.name||''} · ${specBy(ch.speciality)?.name||''}`);state.characters.push(ch);state.active=state.characters.length-1;state.creator=null;state.view='sheet';save();render();toast('Battle-Brother entered into the Vigil.')}
function chapterDemeanourDetail(ch){let cp=chapterBy(ch.chapter),d=DEMEANOUR_DETAILS.chapter[ch.chapter];return d||{name:cp?.demeanour||'Chapter Demeanour',summary:cp?.summary||'',source:cp?.source||'',page:cp?.page||''}}
function personalDemeanourDetail(ch){let custom=String(ch.personalDemeanourCustom||'').trim();return {name:ch.personalDemeanour||'Not selected',summary:custom||DEMEANOUR_DETAILS.personal[ch.personalDemeanour]||'No personal Demeanour summary is loaded.'}}

function pendingFateText(ch){let p=ch.sessionAbilities?.pendingFate;if(!p)return '';let b=DEMEANOUR_BENEFITS.find(x=>x.id===p.benefit);return b?`${p.source||'Fate'} pending: ${b.name}${p.improved?' · Improved':''}`:''}
function applyFateStyleEffect(ch,benefit,{source='Fate',improved=false}={}){let note='';if(benefit.id==='fatigue'){ch.fatigue=improved?0:Math.max(0,ch.fatigue-1);note=improved?'All current Fatigue removed.':'1 Fatigue removed.'}else if(benefit.id==='stun'){ch.conditions=(ch.conditions||[]).filter(x=>x!=='Stunned');note='Stunned removed.'}else if(benefit.id==='squad'){ch.mode='squad';note='Entered Squad Mode without a Cohesion Test.'}else if(benefit.id==='solo'){ch.sessionAbilities.soloRankBonus=Math.max(1,Number(ch.sessionAbilities.soloRankBonus)||0);ch.sessionAbilities.soloRankBonusSource=source;note='+1 effective Rank for the next relevant Solo Mode use.'}else if(benefit.id==='initiative'){ch.sessionAbilities.initiative10=true;ch.sessionAbilities.initiative10Source=source;note='Next Initiative d10 counts as 10.'}else if(benefit.id==='recover'&&source==='Fate'){let amt=rollDie(10),before=Math.max(0,Number(ch.wounds.damage)||0);ch.wounds.damage=Math.max(0,before-amt);note=`Rolled ${amt}; removed ${before-ch.wounds.damage} ordinary Damage. Critical Damage unchanged.`}else{ch.sessionAbilities.pendingFate={benefit:benefit.id,source,improved,at:new Date().toISOString()};note='Recorded as a pending player-controlled effect; clear it after applying it to the intended Test.'}return note}
function spendFateModal(ch){if(ch.fate.current<=0){toast('No Fate Points remain to spend this session.','bad');return}let cards=DEMEANOUR_BENEFITS.map(x=>`<label class="demBenefit"><span><b>${esc(x.name)}</b><span class="small">${esc(x.when)} · ${esc(x.effect)}</span></span><input type="radio" name="fateBenefit" value="${esc(x.id)}"></label>`).join('');modal(`<h2>Spend Fate Point</h2><p class="small">Spend 1 Fate Point as a Free Action. Spent Fate returns at the beginning of the next gaming session. Spending Fate also restores 1 Cohesion to the Kill-team, up to its maximum.</p>${cards}<label>Player note<textarea id="fateNote" rows="3"></textarea></label><button class="btn primary" id="confirmFate">SPEND 1 FATE</button>`,{label:'Spend Fate'});document.getElementById('confirmFate').onclick=()=>{let chosen=document.querySelector('input[name="fateBenefit"]:checked');if(!chosen){toast('Choose the Fate benefit you are using.','bad');return}let benefit=DEMEANOUR_BENEFITS.find(x=>x.id===chosen.value),note=document.getElementById('fateNote').value.trim();ch.fate.current=Math.max(0,ch.fate.current-1);restoreCohesion(1,'Fate spent');let applied=applyFateStyleEffect(ch,benefit,{source:'Fate'});ch.fateHistory.push({at:new Date().toISOString(),benefit:benefit.name,note,applied});save();closeModal();render();toast(`Fate spent: ${benefit.name}.`)}}
function burnFate(ch){if(ch.fate.max<=0){toast('No Fate Points remain to burn.','bad');return}if(!confirm('Permanently reduce this Battle-Brother’s Fate maximum by 1? Use only when your GM says a Fate Point is burned.'))return;ch.fate.max=Math.max(0,ch.fate.max-1);ch.fate.current=Math.min(ch.fate.current,ch.fate.max);ch.fateHistory.push({at:new Date().toISOString(),benefit:'Burned Fate',note:'Permanent Fate reduction recorded by player/GM ruling.',applied:`Fate maximum is now ${ch.fate.max}.`});save();render();toast('Permanent Fate reduction recorded.')}

function triggerDemeanourModal(ch,name){if(ch.demeanourUsed){toast('A Demeanour has already been triggered this session.','bad');return}let cards=DEMEANOUR_BENEFITS.map(x=>`<label class="demBenefit"><span><b>${esc(x.name)}</b><span class="small">${esc(x.when)} · ${esc(x.effect)}</span></span><input type="radio" name="demBenefit" value="${esc(x.id)}"></label>`).join('');modal(`<h2>Trigger ${esc(name)}</h2><p class="small">One Demeanour trigger total per game session, even though the character has both a Chapter and Personal Demeanour. Choose the Fate-style benefit you are applying now.</p>${cards}<label class="check"><input id="demImprove" type="checkbox"> The other players agree the Demeanour was roleplayed strongly enough for an Improvement</label><label>Table note / what happened<textarea id="demNote" rows="3"></textarea></label><button class="btn primary" id="confirmDem">TRIGGER DEMEANOUR</button>`,{label:'Trigger Demeanour'});document.getElementById('confirmDem').onclick=()=>{let chosen=document.querySelector('input[name="demBenefit"]:checked');if(!chosen){toast('Choose the benefit you are applying.','bad');return}let benefit=DEMEANOUR_BENEFITS.find(x=>x.id===chosen.value),improved=document.getElementById('demImprove').checked,note=document.getElementById('demNote').value;ch.demeanourUsed=true;ch.demeanourTrigger={name,benefit:benefit.id,improved,note};let applied;if(benefit.id==='recover'&&improved){ch.sessionAbilities.pendingFate={benefit:benefit.id,source:'Demeanour',improved:true,at:new Date().toISOString()};applied='Improved recovery recorded for table resolution; the supplied Core Demeanour example and Fate entry use different recovery dice.'}else applied=applyFateStyleEffect(ch,benefit,{source:'Demeanour',improved});ch.demeanourHistory.push({at:new Date().toISOString(),name,benefit:benefit.name,improved,note,applied});save();closeModal();render();toast(`${name} triggered for this session.`)}}

function renderAbilities(){let ch=current();if(!ch)return setView('home');let cp=chapterBy(ch.chapter),sp=specBy(ch.speciality),solo=DATA.solo.find(x=>x.name===cp?.solo),tr=trapping(ch),specAbilities=(sp?.abilities||[]).map(a=>abilityCard(a[0],a[1],`${sp.name} · ${sourceText(sp)}`)).join(''),talents=ownedTalentNames(ch).map(n=>{let r=talentRecordByName(n),ar=DATA.advRules?.[n];return abilityCard(n,r?.summary||ar?.mechanics||ar?.summary||'Owned Talent.',r?sourceText(r):ar?.source||'Character record')}).join(''),traits=ownedTraitNames(ch).map(n=>{let r=traitRecordByName(n);return abilityCard(n,r?.summary||'Owned Trait.',r?sourceText(r):'Character record')}).join(''),implants=(DATA.implants||[]).map(x=>`<div class="detailCard"><b>${esc(x.name)}</b><p>${esc(x.summary||'')}</p><div class="source">${esc(sourceText(x))}</div></div>`).join(''),custom=(ch.customRules||[]).map(x=>abilityCard(x.name||'Custom Rule',x.effect||'',x.source||'GM / homebrew')).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Player Character · Rules that apply to me</div><h1>Abilities</h1><p>Character-specific rules in one place. Pin the ones you reference most, or track a temporary active effect without changing the underlying rule.</p></section><div class="card"><h2>Chapter & Speciality</h2><div class="detailGrid">${solo?abilityCard(cp?.solo||'Solo Mode',solo?.summary||'',`Chapter Solo Mode · ${sourceText(solo)}`):''}${tr?abilityCard(tr.name,tr.effect||'',`Chapter Trapping · ${tr.source||''}`):''}${specAbilities}</div><button class="btn" id="abilitiesDem">OPEN DEMEANOURS & EFFECTS</button><button class="btn" id="abilitiesCombat">OPEN STATUS & SQUAD MODE</button></div><div class="card"><h2>Owned Talents</h2><div class="detailGrid">${talents||'<div class="empty">No surfaced Talent details.</div>'}</div></div><div class="card"><h2>Owned Traits</h2><div class="detailGrid">${traits}</div></div><div class="card"><h2>Astartes Implant Rules</h2><div class="deta function renderSkills(){let ch=current();if(!ch)return setView('home');let q=String(state.skillsQuery||''),filter=String(state.skillsFilter||'Rollable');let rows=DATA.skills.filter(s=>!q||`${s.name} ${s.summary} ${s.characteristic} ${s.skillType}`.toLowerCase().includes(q.toLowerCase())).filter(s=>{let st=skillTrainingState(ch,s),t=skillTarget(ch,s);if(filter==='Pinned')return isFavorite(ch,'skill',s.id);if(filter==='Rollable')return t!==null;if(filter==='Trained')return st.trained;if(filter==='Basic Untrained')return !st.trained&&s.skillType==='Basic';if(filter==='Advanced Untrained')return !st.trained&&s.skillType==='Advanced';return true}).map(s=>{let st=skillTrainingState(ch,s),group=isGroupSkill(s),t=skillTarget(ch,s),base=!st.trained&&s.skillType==='Basic'?`Basic · Untrained · half ${s.characteristic} before modifiers`:!st.trained?'Advanced · Untrained · training required':st.label;return `<div class="compactRow"><div><b>${esc(s.name)}</b><div class="compactMeta">${esc(s.characteristic)} · ${esc(base)}</div></div><div class="actions"><button class="starBtn ${isFavorite(ch,'skill',s.id)?'active':''}" data-fav="skill" data-id="${s.id}">★</button>${t===null?'<span class="lockedTag">TRAINING REQUIRED</span>':group?`<button class="btn" data-roll-skill="${s.id}">CHOOSE</button>`:`<button class="btn primary" data-roll-skill="${s.id}">ROLL · ${t}</button>`}<button class="whyBtn" data-why-skill="${s.id}">?</button></div></div>`}).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Player Character · Skill Tests</div><h1>Skills</h1><p>A roll sheet first, reference second. The app separates what you can attempt now from what requires training.</p></section>${recentButtons(ch,'skill')}<div class="card"><input id="skillsSearch" aria-label="Search Skills" placeholder="Search skills, uses, or Characteristics…" value="${esc(q)}"><div class="choiceToolbar">${['Rollable','Pinned','Trained','Basic Untrained','Advanced Untrained','All'].map(x=>`<button class="btn ${filter===x?'active':''}" data-skillfilter="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="searchHint">Untrained Basic Skills halve the governing Characteristic first, round down, then apply situational modifiers. Untrained Advanced Skills cannot be attempted.</div></div><div class="card"><div class="compactList">${rows||'<div class="empty">No matching skills.</div>'}</div></div>`;document.getElementById('skillsSearch').oninput=e=>{let pos=e.target.selectionStart;state.skillsQuery=e.target.value;render();restoreTextFocus('skillsSearch',pos)};document.querySelectorAll('[data-skillfilter]').forEach(b=>b.onclick=()=>{state.skillsFilter=b.dataset.skillfilter;save();render()})}
function renderDemeanours(){let ch=current();if(!ch)return setView('home');let cp=chapterDemeanourDetail(ch),pd=personalDemeanourDetail(ch),used=ch.demeanourUsed,tr=ch.demeanourTrigger||{},benefit=DEMEANOUR_BENEFITS.find(x=>x.id===tr.benefit),pending=pendingFateText(ch);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Player Character · Demeanours</div><h1>Demeanours & Fate</h1><p>Roleplay prompts and player-controlled once-per-session resources, kept on the device that belongs to the Battle-Brother.</p></section><div class="card notice"><h2>How Demeanours work</h2><div class="detailGrid"><div class="detailCard"><b>Two Demeanours</b><p class="small">You always have your Chapter Demeanour plus one Personal Demeanour.</p></div><div class="detailCard"><b>One trigger total</b><p class="small">Only one of those Demeanours may be triggered in a game session.</p></div><div class="detailCard"><b>Fate-style benefit</b><p class="small">Triggering grants an applicable benefit normally available from spending a Fate Point, without spending a Fate Point.</p></div><div class="detailCard"><b>Roleplay Improvement</b><p class="small">Strong roleplay can improve an applicable numeric benefit when the table agrees.</p></div></div></div><div class="detailGrid"><div class="card"><div class="eyebrow">Chapter Demeanour · fixed</div><h2>${esc(cp.name)}</h2><p>${esc(cp.summary)}</p><div class="source">${esc(cp.source)}${cp.page?` p.${esc(cp.page)}`:''}</div><button class="btn ${used?'':'primary'}" id="triggerChapterDem" ${used?'disabled':''}>${used?'SESSION TRIGGER USED':'TRIGGER CHAPTER DEMEANOUR'}</button></div><div class="card"><div class="eyebrow">Personal Demeanour · may change with character growth</div><h2>${esc(pd.name)}</h2><p>${esc(pd.summary)}</p><button class="btn ${used?'':'primary'}" id="triggerPersonalDem" ${used?'disabled':''}>${used?'SESSION TRIGGER USED':'TRIGGER PERSONAL DEMEANOUR'}</button><button class="btn" id="editPersonalDem">CHANGE PERSONAL DEMEANOUR</button></div></div><div class="card"><h2>Fate Points</h2><div class="bigNumber">${ch.fate.current} / ${ch.fate.max}</div><p class="small">Spend Fate from here when you want the app to record the benefit and apply immediate non-Test effects. Spent Fate is restored by New Session.</p>${pending?`<div class="ruleEffect"><b>Pending effect</b><p>${esc(pending)}</p><button class="btn" id="clearPendingFate">MARK APPLIED / CLEAR</button></div>`:''}<button class="btn primary" id="spendFate" ${ch.fate.current>0?'':'disabled'}>SPEND FATE POINT</button><button class="btn danger" id="burnFate" ${ch.fate.max>0?'':'disabled'}>BURN FATE · PERMANENT</button></div><div class="card"><h2>Available Fate-style benefits</h2><p class="small">Read these before you need them. Triggering a Demeanour does not consume Fate.</p>${DEMEANOUR_BENEFITS.map(x=>`<div class="demBenefit"><div><b>${esc(x.name)}</b><div class="small">${esc(x.when)}</div><p>${esc(x.effect)}</p></div></div>`).join('')}</div><div class="card"><h2>This session</h2>${used?`<div class="ruleEffect"><b>${esc(tr.name||'Demeanour triggered')}</b><p>${benefit?esc(benefit.name):'Benefit recorded'}${tr.improved?' · Improvement approved':''}</p>${tr.note?`<p class="small">${esc(tr.note)}</p>`:''}</div>`:'<div class="empty">Your Demeanour trigger is still available this session.</div>'}<button class="btn" id="resetDemOnly">RESET DEMEANOUR TRIGGER ONLY</button></div>${ch.demeanourHistory.length?`<div class="card"><h2>Recent Demeanour history</h2>${ch.demeanourHistory.slice(-5).reverse().map(x=>`<div class="listrow"><b>${esc(x.name)}</b><div class="small">${esc(x.benefit)}${x.improved?' · Improved':''}${x.note?` · ${esc(x.note)}`:''}</div></div>`).join('')}</div>`:''}${ch.fateHistory.length?`<div class="card"><h2>Recent Fate history</h2>${ch.fateHistory.slice(-5).reverse().map(x=>`<div class="listrow"><b>${esc(x.benefit)}</b><div class="small">${esc(x.applied||'Recorded')}${x.note?` · ${esc(x.note)}`:''}</div></div>`).join('')}</div>`:''}`;document.getElementById('triggerChapterDem').onclick=()=>triggerDemeanourModal(ch,cp.name);document.getElementById('triggerPersonalDem').onclick=()=>triggerDemeanourModal(ch,pd.name);document.getElementById('editPersonalDem').onclick=()=>editPersonalDemeanour(ch);document.getElementById('spendFate').onclick=()=>spendFateModal(ch);document.getElementById('burnFate').onclick=()=>burnFate(ch);let cf=document.getElementById('clearPendingFate');if(cf)cf.onclick=()=>{delete ch.sessionAbilities.pendingFate;save();render()};document.getElementById('resetDemOnly').onclick=()=>{if(confirm('Reset only the Demeanour trigger for this character?')){ch.demeanourUsed=false;ch.demeanourTrigger={name:'',benefit:'',improved:false,note:''};if(ch.sessionAbilities?.pendingFate?.source==='Demeanour')delete ch.sessionAbilities.pendingFate;if(ch.sessionAbilities?.soloRankBonusSource==='Demeanour'){delete ch.sessionAbilities.soloRankBonus;delete ch.sessionAbilities.soloRankBonusSource}if(ch.sessionAbilities?.initiative10Source==='Demeanour'){delete ch.sessionAbilities.initiative10;delete ch.sessionAbilities.initiative10Source}save();render()}}}
function editPersonalDemeanour(ch){modal(`<h2>Change Personal Demeanour</h2><p class="small">The Core rules allow the Personal Demeanour to change as the character develops; the Chapter Demeanour does not change.</p>${DATA.personalDemeanours.map(x=>`<button class="choiceCard infoButton ${ch.personalDemeanour===x&&!ch.personalDemeanourCustom?'selected':''}" data-newdem="${esc(x)}"><b>${esc(x)}</b><span class="small">${esc(DEMEANOUR_DETAILS.personal[x]||'')}</span></button>`).join('')}<div class="card subtle"><h3>GM-approved / homebrew Personal Demeanour</h3><p class="small">This is a clearly labelled house-rule lane. It does not overwrite the Core examples.</p><label>Name<input id="customDemName" value="${esc(ch.personalDemeanourCustom?ch.personalDemeanour:'')}"></label><label>Description<textarea id="customDemDesc" rows="3">${esc(ch.personalDemeanourCustom||'')}</textarea></label><button class="btn" id="saveCustomDem">USE CUSTOM DEMEANOUR</button></div>`,{label:'Change Personal Demeanour'});document.querySelectorAll('[data-newdem]').forEach(b=>b.onclick=()=>{ch.personalDemeanour=b.dataset.newdem;ch.personalDemeanourCustom='';save();closeModal();render();toast('Personal Demeanour updated.')});document.getElementById('saveCustomDem').onclick=()=>{let name=document.getElementById('customDemName').value.trim(),desc=document.getElementById('customDemDesc').value.trim();if(!name||!desc){toast('Give the custom Demeanour both a name and description.','bad');return}ch.personalDemeanour=name;ch.personalDemeanourCustom=desc;save();closeModal();render();toast('GM-approved custom Demeanour recorded.')}}

function playerEquipmentNames(ch){let names=[...(ch.fieldGear||[])];for(const x of ch.currentRequisition||[])if(DATA.fieldGear.some(g=>g.name===x.name))names.push(x.name);if(ch.techmarineCybernetic&&DATA.cybernetics.some(x=>x.name===ch.techmarineCybernetic))names.push(ch.techmarineCybernetic);return [...new Set(names.filter(Boolean))]}
