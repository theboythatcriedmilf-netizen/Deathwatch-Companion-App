<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Deathwatch Companion" />
  <title>Deathwatch Companion</title>
  
  
  <style>
:root {
  --bg: #070a09;
  --panel: #0e1411;
  --panel-2: #131b17;
  --panel-3: #18231d;
  --line: #26372d;
  --line-strong: #3f5c4b;
  --text: #ecf1ee;
  --muted: #93a49b;
  --faint: #64736b;
  --accent: #d5efe1;
  --accent-2: #7fa18e;
  --danger: #d17676;
  --warn: #c5a86b;
  --good: #86b994;
  --shadow: 0 18px 55px rgba(0,0,0,.42);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body {
  background:
    radial-gradient(circle at 50% -10%, rgba(74,108,88,.18), transparent 38%),
    linear-gradient(180deg, #0a0f0d 0, #070a09 55%, #050706 100%);
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent-2); outline-offset: 2px;
}

.app-shell { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: rgba(7,10,9,.88); backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(63,92,75,.35);
  display:flex; align-items:center; justify-content:space-between; gap: 12px;
}
.brand { display:flex; gap:10px; align-items:center; cursor:pointer; min-width: 0; }
.watch-mark {
  width: 34px; height: 34px; display:grid; place-items:center;
  border: 1px solid var(--line-strong); border-radius: 50%;
  font-family: Georgia, serif; font-weight: 800; color: var(--accent);
  background: linear-gradient(145deg, #17231c, #0b100d);
  box-shadow: inset 0 0 0 4px #0a0f0d, 0 0 20px rgba(127,161,142,.12);
}
.brand-title { font-size: .83rem; letter-spacing: .22em; font-weight: 900; white-space: nowrap; }
.brand-subtitle { margin-top: 2px; color: var(--muted); font-size: .67rem; letter-spacing: .1em; }
.top-actions { display:flex; gap:8px; }
.icon-btn, .btn {
  border:1px solid var(--line); background: var(--panel-2); border-radius: 10px;
  min-height: 40px; padding: 8px 12px; cursor:pointer;
}
.icon-btn { min-width: 42px; display:grid; place-items:center; font-weight:800; }
.icon-btn:hover, .btn:hover { background: var(--panel-3); border-color: var(--line-strong); }
.btn.primary { background: #dce8e1; color:#09100c; border-color:#dce8e1; font-weight:800; }
.btn.danger { border-color: rgba(209,118,118,.5); color: #efb5b5; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size:.82rem; }

.main-content { width: min(100%, 980px); margin: 0 auto; flex:1; padding: 14px 14px calc(90px + var(--safe-bottom)); }
.bottom-nav {
  position: fixed; left:0; right:0; bottom:0; z-index:25;
  display:grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(8,12,10,.94); backdrop-filter: blur(18px);
  border-top:1px solid rgba(63,92,75,.45);
  padding: 6px 6px calc(6px + var(--safe-bottom));
}
.nav-item { border:0; background:transparent; color:var(--muted); padding:6px 2px; border-radius:10px; cursor:pointer; }
.nav-item span { display:block; font-size:1.05rem; line-height:1.1; }
.nav-item small { display:block; font-size:.62rem; margin-top:3px; }
.nav-item.active { color:var(--text); background: rgba(127,161,142,.12); }

.hero-card, .card {
  border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(160deg, rgba(19,27,23,.97), rgba(11,16,13,.97)); box-shadow:var(--shadow);
}
.hero-card { padding: 16px; position:relative; overflow:hidden; }
.hero-card::after { content:""; position:absolute; width:180px; height:180px; right:-80px; top:-90px; border:1px solid rgba(127,161,142,.12); border-radius:50%; box-shadow:0 0 0 26px rgba(127,161,142,.03),0 0 0 52px rgba(127,161,142,.02); pointer-events:none; }
.card { padding:14px; margin-top:12px; box-shadow:none; }
.card h2, .card h3, .hero-card h1 { margin:0; }
.card-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-title-row h2 { font-size:1rem; letter-spacing:.06em; text-transform:uppercase; }
.eyebrow { color:var(--accent-2); font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; font-weight:800; }
.hero-main { display:flex; gap:14px; align-items:center; position:relative; z-index:1; }
.portrait {
  flex:0 0 82px; width:82px; height:82px; border-radius:14px; border:1px solid var(--line-strong);
  background: radial-gradient(circle at 50% 35%, #263b30, #0c120f 70%); object-fit:cover; display:grid; place-items:center; font-size:2rem; font-weight:900; color:var(--accent-2); overflow:hidden;
}
.portrait img { width:100%; height:100%; object-fit:cover; }
.hero-copy { min-width:0; }
.hero-copy h1 { font-size:1.45rem; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subline { margin-top:5px; color:var(--muted); font-size:.86rem; }
.tag-row { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
.tag { border:1px solid var(--line); border-radius:999px; padding:4px 7px; color:var(--muted); background:rgba(255,255,255,.015); font-size:.69rem; }

.stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
.stat {
  border:1px solid var(--line); border-radius:12px; background:rgba(5,8,6,.42); padding:10px 8px; text-align:center; cursor:pointer; position:relative;
}
.stat:hover { border-color:var(--line-strong); background:rgba(127,161,142,.07); }
.stat .label { display:block; color:var(--muted); font-size:.64rem; letter-spacing:.08em; font-weight:800; }
.stat .value { display:block; font-size:1.45rem; margin-top:2px; font-weight:900; }
.stat .mini { display:block; font-size:.58rem; color:var(--faint); margin-top:2px; }

.resource-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.resource { padding:11px; border:1px solid var(--line); border-radius:12px; background:rgba(5,8,6,.42); }
.resource-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.resource-name { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
.resource-value { font-weight:900; }
.meter { height:5px; border-radius:99px; background:#050706; margin-top:8px; overflow:hidden; border:1px solid rgba(255,255,255,.03); }
.meter > i { display:block; height:100%; background:linear-gradient(90deg, #486353, #a5c0af); }

.two-col { display:grid; grid-template-columns:1fr; gap:12px; }
.list { display:flex; flex-direction:column; gap:8px; }
.list-item {
  border:1px solid var(--line); background:rgba(5,8,6,.35); border-radius:12px; padding:11px;
}
.list-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.item-title { font-weight:800; }
.item-sub { color:var(--muted); font-size:.76rem; margin-top:3px; line-height:1.35; }
.item-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

.weapon { border-left:3px solid var(--line-strong); }
.weapon-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
.weapon-stat { border:1px solid rgba(63,92,75,.45); border-radius:9px; padding:7px 5px; text-align:center; }
.weapon-stat b { display:block; font-size:.83rem; }
.weapon-stat small { display:block; color:var(--faint); font-size:.57rem; text-transform:uppercase; margin-top:2px; }
.ammo-row { margin-top:10px; display:flex; gap:8px; align-items:center; }
.ammo-count { font-variant-numeric:tabular-nums; font-weight:900; min-width:68px; }

.skill-row { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
.skill-target { min-width:50px; text-align:center; font-size:1.05rem; font-weight:900; border:1px solid var(--line); border-radius:9px; padding:7px; cursor:pointer; }
.skill-target:hover { border-color:var(--line-strong); }

.field-grid { display:grid; grid-template-columns:1fr; gap:10px; }
.field label { display:block; color:var(--muted); font-size:.7rem; margin-bottom:5px; letter-spacing:.05em; }
.input, .textarea, .select {
  width:100%; color:var(--text); background:#090d0b; border:1px solid var(--line); border-radius:10px; padding:10px 11px; min-height:42px;
}
.textarea { min-height:100px; resize:vertical; line-height:1.5; }
.inline-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.checkbox-row { display:flex; align-items:center; gap:8px; color:var(--muted); }

.roll-result { text-align:center; padding:8px 0 4px; }
.roll-number { font-size:3.2rem; font-weight:950; letter-spacing:-.04em; }
.roll-number.success { color:var(--good); }
.roll-number.failure { color:var(--danger); }
.roll-detail { color:var(--muted); margin-top:5px; }
.roll-badge { display:inline-block; margin-top:10px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); font-size:.75rem; font-weight:800; }

.modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.68); display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(6px); }
.modal-backdrop.hidden { display:none; }
.modal {
  width:min(100%, 720px); max-height:88dvh; border:1px solid var(--line-strong); background:#0b100d; border-radius:18px 18px 0 0; box-shadow:var(--shadow); overflow:hidden;
}
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); }
.modal-head h2 { margin:0; font-size:1rem; letter-spacing:.08em; text-transform:uppercase; }
.modal-body { padding:14px; overflow:auto; max-height:calc(88dvh - 64px); }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }

.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.menu-grid button { text-align:left; min-height:64px; }
.menu-grid small { display:block; color:var(--muted); margin-top:4px; font-weight:400; }

.empty { border:1px dashed var(--line); border-radius:12px; color:var(--muted); padding:20px 12px; text-align:center; }
.section-note { color:var(--muted); font-size:.78rem; line-height:1.5; }
.source { color:var(--faint); font-size:.67rem; }
.divider { height:1px; background:var(--line); margin:14px 0; }
.searchbar { display:flex; gap:8px; margin-bottom:12px; }
.searchbar .input { flex:1; }
.tabs { display:flex; gap:6px; overflow:auto; padding-bottom:4px; margin-bottom:10px; }
.tabs button { white-space:nowrap; }
.tabs button.active { border-color:var(--accent-2); color:var(--accent); background:rgba(127,161,142,.12); }

.character-strip { display:flex; gap:8px; overflow:auto; margin-top:12px; padding-bottom:2px; }
.char-chip { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; background:rgba(5,8,6,.4); padding:6px 10px; color:var(--muted); cursor:pointer; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.char-chip.active { color:var(--text); border-color:var(--line-strong); background:rgba(127,161,142,.1); }

.toast { position:fixed; left:50%; bottom:calc(84px + var(--safe-bottom)); transform:translateX(-50%); z-index:80; background:#dce8e1; color:#07100b; border-radius:999px; padding:9px 14px; font-weight:800; font-size:.8rem; box-shadow:var(--shadow); max-width:calc(100% - 28px); text-align:center; }
.toast.hidden { display:none; }

@media (min-width: 700px) {
  .main-content { padding-top:20px; }
  .two-col { grid-template-columns:1fr 1fr; }
  .stat-grid { grid-template-columns:repeat(9,1fr); }
  .resource-grid { grid-template-columns:repeat(4,1fr); }
  .field-grid.two { grid-template-columns:1fr 1fr; }
  .field-grid.three { grid-template-columns:repeat(3,1fr); }
  .modal-backdrop { align-items:center; padding:20px; }
  .modal { border-radius:18px; }
  .bottom-nav { left:50%; transform:translateX(-50%); width:min(680px, 100%); border-left:1px solid rgba(63,92,75,.35); border-right:1px solid rgba(63,92,75,.35); border-radius:16px 16px 0 0; }
}

  
/* ===== v0.3 // Watch Fortress grimdark + living dataslate ===== */
:root{
  --bg:#040404;--panel:#0b0c0c;--panel-2:#121313;--panel-3:#191a1a;

  --accent:#d0d3d4;--accent-2:#9ca2a5;--danger:#c05b60;--warn:#b79a67;--good:#9eac95;
  --blood:#7b1519;--blood-hot:#b72d33;--iron:#b6bbbe;--oath:#b9a47e;--radius:7px;
}
body{
  background:
    linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.009) 1px,transparent 1px),
    radial-gradient(circle at 52% -10%,rgba(150,155,158,.14),transparent 34%),
    radial-gradient(circle at 100% 36%,rgba(123,21,25,.12),transparent 29%),

  background-size:28px 28px,28px 28px,auto,auto,auto;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;background:repeating-linear-gradient(118deg,transparent 0 18px,rgba(255,255,255,.018) 19px,transparent 20px 43px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.13;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
.runtime-warning{margin:12px;padding:13px 14px;border:1px solid #8e3034;border-left:4px solid var(--blood-hot);border-radius:5px;background:#190a0b;color:#efdfe0;font-size:.8rem;line-height:1.45;box-shadow:0 12px 32px rgba(0,0,0,.46)}
.runtime-warning strong{color:#fff;letter-spacing:.08em}.runtime-warning.hidden{display:none}
.topbar{background:rgba(4,4,4,.95);border-bottom-color:rgba(182,187,190,.28);box-shadow:0 8px 24px rgba(0,0,0,.38)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--iron),var(--blood-hot),var(--iron),transparent);opacity:.48}
.watch-mark{width:38px;height:38px;border-radius:3px;border-color:#73787b;background:linear-gradient(135deg,#282a2b,#090909 67%);color:#e4e5e5;box-shadow:inset 0 0 0 2px #080808,inset 4px 0 0 rgba(182,187,190,.25),0 0 18px rgba(123,21,25,.18);position:relative;font-size:1.25rem}
.watch-mark::before,.watch-mark::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:18px;height:1px;background:#909598}.watch-mark::before{top:8px}.watch-mark::after{bottom:8px}
.brand-title{font-family:Georgia,"Times New Roman",serif;font-size:.9rem;letter-spacing:.25em}.brand-subtitle{color:#858a8c;text-transform:uppercase}
.top-actions{align-items:center}.engine-status{height:30px;display:flex;gap:6px;align-items:center;padding:0 8px;border:1px solid #333638;background:#090a0a;color:#8d9294;font-size:.56rem;letter-spacing:.12em;font-weight:900;border-radius:3px;transition:.18s ease}.engine-status i,.live-rune i{width:6px;height:6px;border-radius:50%;background:#8da17f;box-shadow:0 0 8px rgba(141,161,127,.65)}.engine-status.saved{color:#ddd5be;border-color:#756a51;background:#17140d}.engine-status.saved i{background:#c5ad75;box-shadow:0 0 9px rgba(197,173,117,.55)}
.icon-btn,.btn{border-radius:5px;background:linear-gradient(180deg,#171819,#0c0d0d);border-color:#373a3c}.icon-btn:hover,.btn:hover{border-color:#73787b;background:#1b1c1d}.btn.primary{background:linear-gradient(180deg,#cbd0d2,#9ca2a5);color:#080909;border-color:#cbd0d2;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}.btn.danger{background:linear-gradient(180deg,#2c1012,#160809);border-color:#7e2c31;color:#e9b3b6}.btn:active,.icon-btn:active{transform:translateY(1px)}
.bottom-nav{background:rgba(4,4,4,.97);border-top-color:rgba(182,187,190,.3)}.nav-item{border-radius:3px}.nav-item.active{color:#f3f3f0;background:linear-gradient(180deg,rgba(182,187,190,.13),rgba(123,21,25,.08));box-shadow:inset 0 2px 0 var(--blood)}
.hero-card,.card{border-radius:7px;border-color:#35383a;background:linear-gradient(145deg,rgba(18,19,19,.99),rgba(7,7,7,.99))}.hero-card{border-left:5px solid #a7adb0;background:linear-gradient(90deg,rgba(176,181,184,.09),transparent 5%),radial-gradient(circle at 86% 16%,rgba(139,23,28,.13),transparent 30%),linear-gradient(145deg,rgba(20,21,21,.99),rgba(6,6,6,.99))}.hero-card::before{content:"WATCH FORTRESS // ORDO XENOS";position:absolute;right:-34px;bottom:28px;transform:rotate(-90deg);color:rgba(183,45,51,.11);font-size:.56rem;letter-spacing:.18em;font-weight:900}.hero-card::after{border-color:rgba(185,190,193,.08);box-shadow:0 0 0 26px rgba(118,23,27,.025),0 0 0 52px rgba(185,190,193,.018)}
.card{position:relative;overflow:hidden}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#4d5153 18%,#4d5153 82%,transparent);opacity:.65}.card-title-row h2,.modal-head h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:.11em}.card-title-row h2::before{content:"// ";color:#62676a;font-family:ui-monospace,monospace;font-size:.75em}.eyebrow{color:#aeb4b7}.eyebrow::before{content:"✠  ";color:#7b7f82}
.portrait{border-radius:4px;background:radial-gradient(circle at 50% 32%,#343738,#090909 70%);border-color:#686d70;box-shadow:inset 6px 0 0 rgba(185,190,193,.16)}.tag,.stat,.resource,.list-item,.weapon-stat,.skill-target,.input,.textarea,.select,.empty,.char-chip,.toast{border-radius:4px}
.stat{background:linear-gradient(180deg,rgba(26,27,27,.75),rgba(7,7,7,.75))}.stat:hover{background:linear-gradient(180deg,rgba(45,47,48,.7),rgba(20,7,8,.7));border-color:#777c7f}.stat .value,.roll-number{font-family:Georgia,"Times New Roman",serif}
.meter{border-radius:2px}.meter>i{background:linear-gradient(90deg,#621519,#a62a2f 62%,#c3c6c7)}
.live-resource{cursor:default}.resource-actions{display:grid;grid-template-columns:36px 1fr 36px;gap:5px;margin-top:8px}.micro-btn{height:30px;border:1px solid #323537;background:#0b0c0c;color:#c1c4c5;border-radius:3px;font-weight:900;cursor:pointer}.micro-btn:active{transform:translateY(1px);background:#1a1b1b}.micro-btn.resource-edit{font-size:.55rem;letter-spacing:.1em;color:#858a8c;font-weight:800}
.weapon{border-left:4px solid #7d8589;background:linear-gradient(90deg,rgba(174,179,182,.055),transparent 20%),rgba(5,8,6,.35)}.weapon::before{content:"ARMOURY SEAL";display:block;color:#6d7173;font-size:.54rem;letter-spacing:.15em;margin-bottom:7px}.weapon .item-title::before{content:"† ";color:#8e9497}.weapon-stat{border-color:rgba(120,125,128,.45)}
.input,.textarea,.select{background:#070808}.skill-target{background:#111212}
.watch-log{border:1px solid #292c2e;background:#070808}.log-row{display:grid;grid-template-columns:62px 1fr;gap:9px;padding:8px 10px;border-bottom:1px solid #202224;font-size:.72rem;line-height:1.35}.log-row:last-child{border-bottom:0}.log-time{color:#656a6c;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.65rem}.log-roll{border-left:2px solid #858a8d}.log-resource{border-left:2px solid #7c251f}.log-armoury{border-left:2px solid #8f835f}.log-system{border-left:2px solid #4e5751;color:#aeb4b0}.live-rune{display:flex;gap:6px;align-items:center;color:#899483;font-size:.58rem;letter-spacing:.14em;font-weight:900}
.modal{background:linear-gradient(160deg,#111212,#060606);border-color:#6a7073;border-radius:7px 7px 0 0}.modal::before{content:"WATCH FORTRESS ARCHIVE";display:block;padding:5px 14px 4px;color:#6f7477;background:#050505;border-bottom:1px solid #232526;font-size:.48rem;letter-spacing:.19em;font-weight:900}.modal-head{background:linear-gradient(90deg,rgba(185,190,193,.08),rgba(118,23,27,.10))}.roll-number.failure{color:#cf666a}.roll-number.success{color:#b9c5b2}.toast{background:#bfc3c5}
@media(max-width:420px){.engine-status span{display:none}.engine-status{width:26px;padding:0;justify-content:center}.brand-subtitle{max-width:175px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
@media(min-width:700px){.modal{border-radius:7px}}

</style>
