hose pages are added.","source":"Rites of Battle — official supplement confirmed","page":"","colors":["#d5a514","#171717","#a51d21"],"glyph":"fist"},{"id":"iron-hands","name":"Iron Hands","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter shaped by the belief that weakness of flesh should be overcome through discipline and augmentation.","playstyle":"Official Deathwatch rules exist in First Founding. The visual and lore package is ready; exact mechanics remain editable until the owned supplement rules are supplied.","source":"First Founding — official supplement confirmed","page":"","colors":["#111213","#9da3a6","#e8e8e4"],"glyph":"hand"},{"id":"salamanders","name":"Salamanders","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter known for stoicism, craftsmanship, endurance, and an unusually strong concern for ordinary Imperial citizens.","playstyle":"Official Deathwatch rules exist in First Founding. This profile is visually complete and mechanically editable pending source pages.","source":"First Founding — official supplement confirmed","page":"","colors":["#287a38","#101111","#d8b447"],"glyph":"flame"},{"id":"white-scars","name":"White Scars","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter associated with speed, independent judgement, rapid manoeuvre, and fluid warfare.","playstyle":"Official Deathwatch rules exist in First Founding. This profile is visually complete and mechanically editable pending source pages.","source":"First Founding — official supplement confirmed","page":"","colors":["#ecebea","#bc2026","#191919"],"glyph":"bolt"},{"id":"custom","name":"Custom / Successor Chapter","rules":"custom","mods":{},"demeanour":"Custom","solo":"Custom","restrictions":[],"summary":"A homebrew or successor Chapter. Use the editor to define modifiers, restrictions, identity, and abilities without overwriting canonical records.","playstyle":"Use this when adapting Rites of Battle custom-Chapter rules or your own campaign material.","source":"Homebrew / user source","page":"","colors":["#424a50","#d7d0bf","#7b3136"],"glyph":"star"}],"specialities":[{"id":"apothecary","name":"Apothecary","role":"Battlefield medic and guardian of gene-seed","summary":"Keeps Battle-Brothers functioning, treats injury, studies biology, and safeguards the Chapter’s genetic legacy.","startingSkills":["Medicae"],"abilities":[["Guardian of Purity","Protects the squad against corruption when the Apothecary has access to his specialist medical kit."],["Create Toxins","A preparation ability that uses study and biological samples to create a temporary mission-specific advantage against a studied foe."],["Enhance Healing","Improves the effectiveness of First Aid and recovery."]],"source":"Core Rulebook","page":"68"},{"id":"assault","name":"Assault Marine","role":"Highly mobile close-action specialist","summary":"Excels at rapid movement, closing distance, breaking static fights, and reaching objectives other characters may struggle to access.","startingSkills":["Pilot"],"abilities":[["Wings of Angels","Improves control and effectiveness while using jump-assisted movement."],["Wrathful Descent","A Squad Mode option built around turning rapid descent into a coordinated assault."]],"source":"Core Rulebook","page":"72"},{"id":"devastator","name":"Devastator Marine","role":"Heavy-support and fire-control specialist","summary":"Anchors the team, controls lanes and positions, and specialises in sustained battlefield support.","startingSkills":[],"abilities":[["Immovable Warrior","Rewards fighting from a prepared position and using cover effectively."],["Unrelenting Devastation","A Squad Mode option that improves the Devastator’s effect against massed enemies."]],"source":"Core Rulebook","page":"76"},{"id":"librarian","name":"Librarian","role":"Battle-psyker, scholar, and psychic support","summary":"Combines Space Marine training with psychic disciplines. Tracks Psy Rating, Focus Power Tests, sustained effects, and psychic risk.","startingSkills":["Psyniscience"],"abilities":[["Battle-Psyker","Begins with Psy Rating 3 and selects three starting psychic techniques."]],"psyRating":3,"source":"Core Rulebook","page":"80"},{"id":"tactical","name":"Tactical Marine","role":"Versatile line leader and all-rounder","summary":"The broadest battlefield role. Tactical Marines are adaptable, objective-focused, and well suited to coordinating a Kill-team.","startingSkills":[],"abilities":[["Tactical Expertise","Represents broad tactical experience and strong contribution to Kill-team coordination."]],"source":"Core Rulebook","page":"84"},{"id":"techmarine","name":"Techmarine","role":"Engineer, artificer, and machine specialist","summary":"Handles technology, repairs, fortification, cybernetics, and complex machinery while serving as the Chapter’s link to the Cult Mechanicus.","startingSkills":["Speak Language","Tech-Use"],"abilities":[["Improve Cover","Uses engineering expertise to strengthen a defensive position."],["Blessed by the Omnissiah","Begins with Mechanicus implants and the talents needed to use them."]],"source":"Core Rulebook","page":"88"}],"skills":[{"id":"skill-acrobatics","name":"Acrobatics","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Movement","summary":"Perform difficult feats of balance, tumbling, controlled falls, leaps, and agile movement that go beyond ordinary mobility.","source":"Core Rulebook","page":"92–107"},{"id":"skill-awareness","name":"Awareness","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Notice nearby movement, sounds, hazards, concealed figures, or other details that could be missed. It is the general immediate-perception Skill.","source":"Core Rulebook","page":"92–107"},{"id":"skill-carouse","name":"Carouse","category":"Skill","characteristic":"T","skillType":"Basic","descriptor":"","summary":"Endure intoxicants and similar ingested effects without becoming impaired. Tests usually resist the physical consequences rather than represent social drinking.","source":"Core Rulebook","page":"92–107"},{"id":"skill-charm","name":"Charm","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Improve another character’s attitude through friendliness, persuasion, courtesy, or social appeal. The GM may oppose it when the target actively resists.","source":"Core Rulebook","page":"92–107"},{"id":"skill-chem-use","name":"Chem-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation","summary":"Safely identify, prepare, handle, or analyse chemicals, compounds, toxins, medicines, and related substances within the fictional setting; exact applications depend on available equipment and the GM.","source":"Core Rulebook","page":"92–107"},{"id":"skill-ciphers","name":"Ciphers","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand or use a particular coded language, shorthand, symbol system, or formal cipher group known to the character.","source":"Core Rulebook","page":"92–107"},{"id":"skill-climb","name":"Climb","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Ascend or descend difficult surfaces when success is uncertain. The GM sets difficulty from the surface, conditions, equipment, and pressure of the scene.","source":"Core Rulebook","page":"92–107"},{"id":"skill-command","name":"Command","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Direct, organise, rally, or impose discipline on subordinates and allied forces. It is commonly used when leadership itself determines whether others follow through.","source":"Core Rulebook","page":"92–107"},{"id":"skill-concealment","name":"Concealment","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"","summary":"Hide yourself or another subject from observation by using cover, terrain, darkness, camouflage, or careful positioning.","source":"Core Rulebook","page":"92–107"},{"id":"skill-contortionist","name":"Contortionist","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"Escape restraints, squeeze through confined spaces, or manipulate your body through unusually tight or awkward positions.","source":"Core Rulebook","page":"92–107"},{"id":"skill-deceive","name":"Deceive","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Mislead another character through lies, false impressions, disguise-supported claims, or deliberate misdirection.","source":"Core Rulebook","page":"92–107"},{"id":"skill-dodge","name":"Dodge","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"React to an incoming attack or sudden physical danger when the rules allow a Dodge reaction. Training improves reliability but does not create extra reactions by itself.","source":"Core Rulebook","page":"92–107"},{"id":"skill-evaluate","name":"Evaluate","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Estimate the value, quality, rarity, or likely worth of an object using knowledge and careful inspection.","source":"Core Rulebook","page":"92–107"},{"id":"skill-gamble","name":"Gamble","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Resolve games of chance or wagering inside the fictional setting when the outcome depends on a character’s judgement, nerve, or reading of the game rather than a simple random result.","source":"Core Rulebook","page":"92–107"},{"id":"skill-inquiry","name":"Inquiry","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Investigation","summary":"Gather information from people over time by asking questions, following rumours, and finding useful contacts rather than interrogating a single target.","source":"Core Rulebook","page":"92–107"},{"id":"skill-interrogation","name":"Interrogation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Investigation","summary":"Extract information from a resistant subject through sustained questioning and psychological pressure. The game treats this as an extended social Skill rather than a quick conversation.","source":"Core Rulebook","page":"92–107"},{"id":"skill-intimidate","name":"Intimidate","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Interaction","summary":"Coerce or frighten another character into compliance through presence, threats, or a display of force. The relevant Characteristic can vary with the approach at the GM’s discretion.","source":"Core Rulebook","page":"92–107"},{"id":"skill-invocation","name":"Invocation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Psychic","summary":"Prepare the mind and focus psychic discipline before attempting difficult psychic activity when the rules permit it.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lip-reading","name":"Lip Reading","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"","summary":"Understand speech by observing a speaker’s mouth when the words cannot be heard clearly.","source":"Core Rulebook","page":"92–107"},{"id":"skill-literacy","name":"Literacy","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Read and write languages the character knows, including difficult documents, formal records, and written communications.","source":"Core Rulebook","page":"92–107"},{"id":"skill-logic","name":"Logic","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Solve problems through deduction, mathematics, pattern recognition, codes, puzzles, and structured reasoning.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-common","name":"Lore: Common","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall broadly available knowledge about a chosen Common Lore field. Each Lore is a separate area of expertise.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-forbidden","name":"Lore: Forbidden","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall dangerous, proscribed, secret, or highly restricted knowledge in a chosen Forbidden Lore field. Possessing such knowledge can matter narratively even when a Test succeeds.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-scholastic","name":"Lore: Scholastic","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall formal academic, historical, scientific, theological, or institutional knowledge in a chosen Scholastic Lore field.","source":"Core Rulebook","page":"92–107"},{"id":"skill-medicae","name":"Medicae","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Diagnose injury or illness and perform the game’s medical actions, including First Aid and longer-term treatment when appropriate equipment and time are available.","source":"Core Rulebook","page":"92–107"},{"id":"skill-navigation","name":"Navigation","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Determine location and plot a route across a planetary surface or through a stellar environment. Longer routes can represent hours of planning rather than a single moment.","source":"Core Rulebook","page":"92–107"},{"id":"skill-performer","name":"Performer","category":"Skill","characteristic":"Fel","skillType":"Advanced","descriptor":"Group","summary":"Entertain or influence an audience through a chosen performance form such as music, singing, storytelling, or dance.","source":"Core Rulebook","page":"92–107"},{"id":"skill-pilot","name":"Pilot","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Operator, Group","summary":"Control jump packs, aircraft, small spacecraft, or other flying craft when unusual conditions, hazards, or contested manoeuvres require a Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-psyniscience","name":"Psyniscience","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"Psychic","summary":"Sense psychic activity, disturbances in the Warp, daemonic presence, or other unusual immaterial phenomena. It detects signs and disturbances rather than automatically explaining them.","source":"Core Rulebook","page":"92–107"},{"id":"skill-scrutiny","name":"Scrutiny","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Judge motives, behaviour, authenticity, or subtle inconsistencies in a person, object, or situation through close observation.","source":"Core Rulebook","page":"92–107"},{"id":"skill-search","name":"Search","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Conduct a deliberate examination of an area or object to locate hidden, concealed, or easily overlooked details. Unlike Awareness, this normally represents active searching.","source":"Core Rulebook","page":"92–107"},{"id":"skill-security","name":"Security","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Bypass, defeat, or analyse locks and security systems in the fictional setting when the character has suitable access and tools; the Companion keeps this at tabletop abstraction rather than real-world procedure.","source":"Core Rulebook","page":"92–107"},{"id":"skill-shadowing","name":"Shadowing","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Follow a person or group without being noticed, usually over time and through changing terrain or crowds.","source":"Core Rulebook","page":"92–107"},{"id":"skill-silent-move","name":"Silent Move","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Movement","summary":"Move quietly enough to avoid detection. Environmental noise, armour, surface material, speed, and observers can modify the Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-sleight-of-hand","name":"Sleight of Hand","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Perform subtle manual tricks such as palming, planting, concealing, or manipulating small objects without drawing attention.","source":"Core Rulebook","page":"92–107"},{"id":"skill-speak-language","name":"Speak Language","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand and communicate in a specific known language. Each language or language group is recorded separately.","source":"Core Rulebook","page":"92–107"},{"id":"skill-survival","name":"Survival","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate in hostile wilderness: find shelter, read natural conditions, locate basic necessities, and endure environmental exposure when the situation calls for a Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-swim","name":"Swim","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Move through difficult water or remain afloat when conditions make ordinary swimming uncertain or exhausting.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tactics","name":"Tactics","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Apply formal battlefield knowledge in a chosen tactical field to interpret a situation, anticipate likely developments, or identify a useful strategic approach.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tech-use","name":"Tech-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate, diagnose, repair, or understand advanced technology within the fictional setting when ordinary use is insufficient. Complex work may require time, tools, or multiple Tests.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tracking","name":"Tracking","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Follow signs left by a creature, person, or vehicle and interpret a trail’s direction, age, and condition when evidence is available.","source":"Core Rulebook","page":"92–107"},{"id":"skill-trade","name":"Trade","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Crafting, Group","summary":"Perform a chosen professional craft or technical vocation. Each Trade is its own trained field and may cover creating, repairing, or evaluating work in that profession.","source":"Core Rulebook","page":"92–107"},{"id":"skill-wrangling","name":"Wrangling","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Handle, calm, direct, or manage animals and similar creatures in the fictional setting when they are difficult, frightened, or resistant.","source":"Core Rulebook","page":"92–107"}],"talents":[{"id":"tal-0","name":"Ambidextrous","category":"Talent","summary":"The Battle-Brother is equally trained with either hand, removing the normal off-hand limitation in situations where the rules care about handedness.","source":"Core Rulebook","page":"108–129"},{"id":"tal-1","name":"Astartes Weapons Training","category":"Talent","summary":"A baseline Space Marine combat-training Talent. Detailed weapon-use guidance is not reproduced in this app.","source":"Core Rulebook","page":"108–129"},{"id":"tal-2","name":"Bulging Biceps","category":"Talent","summary":"Represents superhuman musculature and exceptional physical power; it interacts with some equipment and heavy-load rules.","source":"Core Rulebook","page":"108–129"},{"id":"tal-3","name":"Heightened Senses (Hearing)","category":"Talent","summary":"Grants the game’s heightened-sense benefit when hearing is relevant.","source":"Core Rulebook","page":"108–129"},{"id":"tal-4","name":"Heightened Senses (Sight)","category":"Talent","summary":"Grants the game’s heightened-sense benefit when vision is relevant.","source":"Core Rulebook","page":"108–129"},{"id":"tal-5","name":"Killing Strike","category":"Talent","summary":"A combat Talent tied to the exceptional lethality of Astartes training; consult the owned source for its attack-specific procedure.","source":"Core Rulebook","page":"108–129"},{"id":"tal-6","name":"Nerves of Steel","category":"Talent","summary":"Improves resistance to Pinning and allows recovery from suppression more reliably.","source":"Core Rulebook","page":"108–129"},{"id":"tal-7","name":"Quick Draw","category":"Talent","summary":"Lets the character ready carried equipment more quickly when the action economy matters.","source":"Core Rulebook","page":"108–129"},{"id":"tal-8","name":"Resistance (Psychic Powers)","category":"Talent","summary":"Provides a bonus on Tests made to resist hostile psychic effects.","source":"Core Rulebook","page":"108–129"},{"id":"tal-9","name":"True Grit","category":"Talent","summary":"Reduces the severity of Critical Damage by using the character’s Toughness Bonus more effectively.","source":"Core Rulebook","page":"108–129"},{"id":"tal-10","name":"Unarmed Master","category":"Talent","summary":"Represents extensive Astartes training when fighting without carried equipment.","source":"Core Rulebook","page":"108–129"},{"id":"tal-11","name":"Deathwatch Training","category":"Talent","summary":"Represents specialist hypno-conditioning and preparation for fighting xenos threats.","source":"Core Rulebook","page":"108–129"},{"id":"tal-fearless","name":"Fearless","category":"Talent","summary":"Immune to Fear and Pinning, but backing away from a fight can require a Willpower Test.","source":"Core Rulebook","page":"118"},{"id":"tal-sprint","name":"Sprint","category":"Talent","summary":"Improves maximum movement when the character commits to running.","source":"Core Rulebook","page":"126"},{"id":"tal-hard-target","name":"Hard Target","category":"Talent","summary":"Moving rapidly makes the character harder to hit with ranged attacks in the tabletop rules.","source":"Core Rulebook","page":"120"},{"id":"tal-hardy","name":"Hardy","category":"Talent","summary":"Improves natural recovery and resistance to lingering injury.","source":"Core Rulebook","page":"120"},{"id":"tal-lightning-reflexes","name":"Lightning Reflexes","category":"Talent","summary":"Improves Initiative by allowing the character to use a stronger Agility contribution.","source":"Core Rulebook","page":"122"},{"id":"tal-light-sleeper","name":"Light Sleeper","category":"Talent","summary":"The character remains unusually alert while resting and can react more readily to danger.","source":"Core Rulebook","page":"122"},{"id":"tal-master-chirurgeon","name":"Master Chirurgeon","category":"Talent","summary":"Represents exceptional medical expertise and improves difficult Medicae work.","source":"Core Rulebook","page":"123"},{"id":"tal-paranoia","name":"Paranoia","category":"Talent","summary":"The character is habitually alert for danger, improving readiness at the cost of a suspicious outlook.","source":"Core Rulebook","page":"124"},{"id":"tal-polyglot","name":"Polyglot","category":"Talent","summary":"Makes unfamiliar languages easier to interpret and communicate across.","source":"Core Rulebook","page":"124"},{"id":"tal-rapid-reaction","name":"Rapid Reaction","category":"Talent","summary":"Gives the character a chance to act even when surprised.","source":"Core Rulebook","page":"125"},{"id":"tal-talented","name":"Talented","category":"Talent","summary":"Grants a +10 bonus to one selected Skill, representing exceptional aptitude.","source":"Core Rulebook","page":"127"},{"id":"tal-total-recall","name":"Total Recall","category":"Talent","summary":"Allows extremely precise memory of details the character has previously encountered.","source":"Core Rulebook","page":"128"},{"id":"tal-unshakeable-faith","name":"Unshakeable Faith","category":"Talent","summary":"Improves recovery from failed Fear Tests by allowing a reroll.","source":"Core Rulebook","page":"128"},{"id":"tal-exemplar","name":"Exemplar of Honour","category":"Talent","summary":"May spend a Fate Point as a Free Action to restore Cohesion equal to Fellowship Bonus, once per Round.","source":"Core Rulebook","page":"118"},{"id":"tal-wisdom","name":"Wisdom of the Ancients","category":"Talent","summary":"Represents the ability to draw on long service and accumulated lore in ways that support the Kill-team.","source":"Core Rulebook","page":"129"}],"traits":[{"id":"trait-us","name":"Unnatural Strength (x2)","category":"Trait","summary":"Doubles the character’s Strength Bonus. This is already part of the normal Astartes baseline and should not be added again by individual implants.","effects":{"bonusMultiplier":{"S":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-ut","name":"Unnatural Toughness (x2)","category":"Trait","summary":"Doubles the character’s Toughness Bonus. This is already part of the normal Astartes baseline and should not be double-counted from implants.","effects":{"bonusMultiplier":{"T":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-dark","name":"Dark Sight","category":"Trait","summary":"Allows vision in darkness without the normal penalty, subject to the exact limits of the trait.","source":"Core Rulebook","page":"132"},{"id":"trait-autostab","name":"Auto-stabilised","category":"Trait","summary":"A creature or system with this Trait counts as braced and gains action-economy benefits for certain heavy-equipment rules.","source":"Core Rulebook","page":"130"},{"id":"trait-armourplating","name":"Armour Plating","category":"Trait","summary":"Adds +2 Armour Points to all locations for a creature with natural or integrated plating.","source":"Core Rulebook","page":"130"},{"id":"trait-brutal","name":"Brutal Charge","category":"Trait","summary":"Adds extra damage when the creature charges during the same round.","source":"Core Rulebook","page":"131"},{"id":"trait-fear","name":"Fear (X)","category":"Trait","summary":"For non-Astartes and appropriate NPCs, Fear rating sets the difficulty of Fear Tests. For Battle-Brothers it can instead threaten Cohesion.","source":"Core Rulebook","page":"132"},{"id":"trait-size","name":"Size","category":"Trait","summary":"Changes movement, concealment, and how easy the creature is to hit. Power-armoured Astartes are Hulking but Black Carapace removes the usual enemy hit bonus.","source":"Core Rulebook","page":"134"},{"id":"trait-touched","name":"Touched by the Fates (X)","category":"Trait","summary":"Gives important NPCs a limited pool of Fate-like resources.","source":"Core Rulebook","page":"135"},{"id":"trait-unnatural-senses","name":"Unnatural Senses","category":"Trait","summary":"Allows perception beyond normal senses out to a listed range.","source":"Core Rulebook","page":"136"},{"id":"trait-unnatural-speed","name":"Unnatural Speed","category":"Trait","summary":"Substantially increases movement for creatures whose speed exceeds normal limits.","source":"Core Rulebook","page":"136"}],"implants":[{"id":"implant-0","name":"Secondary Heart","category":"Implant","summary":"Contributes to the Astartes Unnatural Strength and Unnatural Toughness baseline; it does not add a second independent modifier.","source":"Core Rulebook","page":"36–37"},{"id":"implant-1","name":"Ossmodula","category":"Implant","summary":"One of the implants responsible for the Unnatural Toughness (x2) Trait already present on the character.","source":"Core Rulebook","page":"36–37"},{"id":"implant-2","name":"Biscopea","category":"Implant","summary":"One of the implants responsible for the Unnatural Strength (x2) Trait already present on the character.","source":"Core Rulebook","page":"36–37"},{"id":"implant-3","name":"Haemastamen","category":"Implant","summary":"Supports the superhuman Strength and Toughness baseline; its benefit is already represented by starting Traits.","source":"Core Rulebook","page":"36–37"},{"id":"implant-4","name":"Larraman's Organ","category":"Implant","summary":"The Battle-Brother normally ignores Blood Loss and has True Grit; unusual effects can bypass this protection.","source":"Core Rulebook","page":"36–37"},{"id":"implant-5","name":"Catalepsean Node","category":"Implant","summary":"Removes normal Perception-based penalties for remaining awake for extended periods.","source":"Core Rulebook","page":"36–37"},{"id":"implant-6","name":"Preomnor","category":"Implant","summary":"Improves resistance to ingested poisons and unusual food-borne hazards.","source":"Core Rulebook","page":"36–37"},{"id":"implant-7","name":"Omophagea","category":"Implant","summary":"Can provide fragmentary information or temporary familiarity after consuming a biological sample, subject to GM judgement.","source":"Core Rulebook","page":"36–37"},{"id":"implant-8","name":"Multi-lung","category":"Implant","summary":"Improves survival in hostile atmospheres and allows rerolls against drowning or asphyxiation-type hazards.","source":"Core Rulebook","page":"36–37"},{"id":"implant-9","name":"Occulobe","category":"Implant","summary":"Provides the Astartes heightened visual capability represented by Heightened Senses (Sight).","source":"Core Rulebook","page":"36–37"},{"id":"implant-10","name":"Lyman's Ear","category":"Implant","summary":"Provides enhanced hearing and balance, represented in part by Heightened Senses (Hearing).","source":"Core Rulebook","page":"36–37"},{"id":"implant-11","name":"Sus-an Membrane","category":"Implant","summary":"Allows voluntary suspended animation after appropriate preparation or trauma conditions.","source":"Core Rulebook","page":"36–37"},{"id":"implant-12","name":"Melanochrome","category":"Implant","summary":"Allows the body to adapt pigmentation in response to harmful radiation and solar exposure.","source":"Core Rulebook","page":"36–37"},{"id":"implant-13","name":"Oolitic Kidney","category":"Implant","summary":"Improves resistance to poisons and toxins and works with the implanted biological filtration systems.","source":"Core Rulebook","page":"36–37"},{"id":"implant-14","name":"Neuroglottis","category":"Implant","summary":"Provides extraordinary chemical and biological sensory analysis and can assist identification/tracking in the fiction.","source":"Core Rulebook","page":"36–37"},{"id":"implant-15","name":"Mucranoid","category":"Implant","summary":"Improves survival in extreme heat and cold after appropriate biological activation.","source":"Core Rulebook","page":"36–37"},{"id":"implant-16","name":"Betcher's Gland","category":"Implant","summary":"Provides a fictional implanted biological capability; detailed offensive use is not reproduced in this app.","source":"Core Rulebook","page":"36–37"},{"id":"implant-17","name":"Progenoids","category":"Implant","summary":"The Chapter’s gene-seed legacy. An Apothecary can recover progenoid material under the game’s Medicae rules.","source":"Core Rulebook","page":"36–37"},{"id":"implant-18","name":"Black Carapace","category":"Implant","summary":"Interfaces the Battle-Brother directly with power armour and removes the normal enemy hit bonus that would otherwise result from his Hulking size.","source":"Core Rulebook","page":"36–37"}],"armours":[{"id":"power-armour","name":"Mark VII “Aquila” Power Armour","category":"Armour","ap":{"Head":8,"Body":10,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"summary":"Standard Astartes power armour: sealed protection, strength assistance, auto-senses, life support, vox, bio-monitoring, and many integrated systems.","effects":[["Characteristic","Strength +20 while worn"],["Movement","Treat Agility Bonus as +1 higher for movement"],["Auto-senses","Sensory assistance and protected sight/hearing"],["Bio-monitor","+10 to resist Toxic-style poison effects; tracks pain-suppressor doses"],["Size","Counts as Hulking, but Black Carapace removes the normal enemy hit bonus"],["Fine manipulation","Delicate manual tasks can suffer -10 unless equipment is Astartes-scaled"]],"source":"Core Rulebook","page":"160–163"},{"id":"artificer-armour","name":"Astartes Artificer Armour","category":"Armour","ap":{},"summary":"Rare master-crafted power armour awarded to exceptional heroes. It incorporates the standard Astartes systems and a stronger machine spirit.","effects":[["Craftsmanship","Always Master-Crafted"],["History","Roll twice for Power Armour History"],["Interface","Advanced helmet includes an MIU"]],"source":"Core Rulebook","page":"163"},{"id":"scout-armour","name":"Astartes Scout Armour","category":"Armour","ap":{},"summary":"Lighter carapace-based protection designed for stealth, reconnaissance, and skirmishing.","effects":[["Concealment","+10 to Concealment Tests"],["Stealth","Does not impose the normal AP-based Concealment/Silent Move penalty"]],"source":"Core Rulebook","page":"163"},{"id":"terminator-armour","name":"Astartes Terminator Armour","category":"Armour","ap":{},"summary":"Extremely rare Tactical Dreadnought armour reserved for veteran deployment on the most dangerous missions.","effects":[["Characteristic","Strength +30 instead of normal power-armour +20"],["Trait","Grants Auto-stabilised"],["Protection","Built-in field-like protection rated 35 with no overload"],["Movement","Cannot Run; Agility -20; cannot Dodge"],["Support Range","Multiple suits can improve effective Rank for Support Range"]],"source":"Core Rulebook","page":"164"}],"cybernetics":[{"id":"cyb-limb","name":"Bionic Limb","category":"Cybernetic","summary":"Replaces a lost limb. Higher-quality versions can provide improved physical performance in appropriate tests.","source":"Core Rulebook","page":"177"},{"id":"cyb-locomotion","name":"Bionic Locomotion","category":"Cybernetic","summary":"Integrated locomotion systems restore movement; exceptional versions grant Sprint and +20 on jumping/leaping Tests.","source":"Core Rulebook","page":"178"},{"id":"cyb-resp","name":"Bionic Respiratory System","category":"Cybernetic","summary":"Common versions grant +20 to Toughness Tests against airborne toxins and gas; exceptional versions can function as full life support.","source":"Core Rulebook","page":"178"},{"id":"cyb-senses","name":"Cybernetic Senses","category":"Cybernetic","summary":"Replaces damaged senses. Exceptional versions grant the relevant Heightened Senses Talent and +20 to resist attacks against that sense.","source":"Core Rulebook","page":"178"},{"id":"cyb-miu","name":"Mind Impulse Unit (MIU)","category":"Cybernetic","summary":"Allows direct interface with compatible technology. Common systems grant +10 to relevant Tech-Use, Pilot, or Drive Tests while linked.","source":"Core Rulebook","page":"178"},{"id":"cyb-augur","name":"Augur Array","category":"Cybernetic","summary":"Integrated scanning equipment used for sensor and detection tasks within its game-defined capabilities.","source":"Core Rulebook","page":"177"},{"id":"cyb-mechadendrite","name":"Mechadendrite","category":"Cybernetic","summary":"A Techmarine-style mechanical appendage. Different patterns perform technical, utility, or medical functions.","source":"Core Rulebook","page":"177"}],"psychic":[{"id":"psy-0","name":"Compel","category":"Psychic Power","discipline":"Telepathy","summary":"Influence a target toward a simple course of action when the Focus Power Test succeeds.","source":"Core Rulebook","page":"189–200"},{"id":"psy-1","name":"Dominate","category":"Psychic Power","discipline":"Telepathy","summary":"A stronger telepathic control effect that can override a target for a limited period.","source":"Core Rulebook","page":"189–200"},{"id":"psy-2","name":"Inspire","category":"Psychic Power","discipline":"Telepathy","summary":"Bolsters nearby allies against fear and pinning through psychic encouragement.","source":"Core Rulebook","page":"189–200"},{"id":"psy-3","name":"Mind Scan","category":"Psychic Power","discipline":"Telepathy","summary":"Searches a target mind for information, with depth depending on success and resistance.","source":"Core Rulebook","page":"189–200"},{"id":"psy-4","name":"Short-Range Telepathy","category":"Psychic Power","discipline":"Telepathy","summary":"Allows direct mind-to-mind communication over a limited distance.","source":"Core Rulebook","page":"189–200"},{"id":"psy-5","name":"Reading","category":"Psychic Power","discipline":"Divination","summary":"Reads a creature’s aura to gain insight into its nature and condition.","source":"Core Rulebook","page":"189–200"},{"id":"psy-6","name":"Possibility Shield","category":"Psychic Power","discipline":"Divination","summary":"Uses foresight to improve defensive anticipation for a limited period.","source":"Core Rulebook","page":"189–200"},{"id":"psy-7","name":"Psychometry","category":"Psychic Power","discipline":"Divination","summary":"Draws impressions from an object’s history and significant prior associations.","source":"Core Rulebook","page":"189–200"},{"id":"psy-8","name":"Force Dome","category":"Psychic Power","discipline":"Codex","summary":"Creates a sustained protective psychic field around the Librarian and nearby allies.","source":"Core Rulebook","page":"189–200"},{"id":"psy-9","name":"The Gate of Infinity","category":"Psychic Power","discipline":"Codex","summary":"A powerful displacement effect that relocates the Librarian and nearby companions.","source":"Core Rulebook","page":"189–200"},{"id":"psy-10","name":"Iron Arm","category":"Psychic Power","discipline":"Codex","summary":"Temporarily reinforces the Librarian’s physical resilience and strength.","source":"Core Rulebook","page":"189–200"},{"id":"psy-11","name":"Vortex of Doom","category":"Psychic Power","discipline":"Codex","summary":"A dangerous high-output psychic attack with serious manifestation risk; tracked here only as tabletop game information.","source":"Core Rulebook","page":"189–200"},{"id":"psy-12","name":"Smite","category":"Psychic Power","discipline":"Codex","summary":"A direct psychic attack resolved using the psychic-power rules.","source":"Core Rulebook","page":"189–200"},{"id":"psy-13","name":"Veil of Time","category":"Psychic Power","discipline":"Codex","summary":"Uses precognition to improve reaction and timing.","source":"Core Rulebook","page":"189–200"},{"id":"psy-14","name":"Might of Heroes","category":"Psychic Power","discipline":"Blood Angels","summary":"A Chapter-themed power that temporarily enhances a Battle-Brother’s physical capability.","source":"Core Rulebook","page":"189–200"},{"id":"psy-15","name":"Shackle Soul","category":"Psychic Power","discipline":"Blood Angels","summary":"A Chapter-themed psychic restraint affecting a target’s spirit and resolve.","source":"Core Rulebook","page":"189–200"},{"id":"psy-16","name":"Wings of Sanguinius","category":"Psychic Power","discipline":"Blood Angels","summary":"Provides psychic flight or extraordinary aerial movement for a limited period.","source":"Core Rulebook","page":"189–200"},{"id":"psy-17","name":"Mind Worm","category":"Psychic Power","discipline":"Dark Angels","summary":"A telepathic assault that undermines a target’s mental resistance.","source":"Core Rulebook","page":"189–200"},{"id":"psy-18","name":"True Strike","category":"Psychic Power","discipline":"Dark Angels","summary":"Uses psychic foresight to improve the accuracy of an immediate action in game terms.","source":"Core Rulebook","page":"189–200"},{"id":"psy-19","name":"Mask of Shadows","category":"Psychic Power","discipline":"Dark Angels","summary":"Wraps the Librarian in a psychic concealment effect.","source":"Core Rulebook","page":"189–200"},{"id":"psy-20","name":"Weaken Resolve","category":"Psychic Power","discipline":"Dark Angels","summary":"Erodes the target’s mental determination and resistance.","source":"Core Rulebook","page":"189–200"},{"id":"psy-21","name":"Tempest's Wrath","category":"Psychic Power","discipline":"Space Wolves","summary":"Calls on a storm-themed psychic effect that hinders enemies and the environment.","source":"Core Rulebook","page":"189–200"},{"id":"psy-22","name":"Thunderclap","category":"Psychic Power","discipline":"Space Wolves","summary":"Produces a disruptive psychic shockwave.","source":"Core Rulebook","page":"189–200"},{"id":"psy-23","name":"Hammer of the Emperor","category":"Psychic Power","discipline":"Storm Wardens","summary":"Channels psychic force into a short-lived enhancement themed around decisive impact.","source":"Core Rulebook","page":"189–200"},{"id":"psy-24","name":"Mark of Scorn","category":"Psychic Power","discipline":"Storm Wardens","summary":"Places a psychic mark on a chosen foe to aid the Kill-team against it.","source":"Core Rulebook","page":"189–200"},{"id":"psy-25","name":"Thunder's Shell","category":"Psychic Power","discipline":"Storm Wardens","summary":"Creates a protective psychic shell themed around storm and force.","source":"Core Rulebook","page":"189–200"},{"id":"psy-26","name":"Paragon","category":"Psychic Power","discipline":"Ultramarines","summary":"Enhances a Battle-Brother as an exemplar of disciplined Astartes capability.","source":"Core Rulebook","page":"189–200"},{"id":"psy-27","name":"War Cry","category":"Psychic Power","discipline":"Ultramarines","summary":"Psychically reinforces allied courage and battlefield resolve.","source":"Core Rulebook","page":"189–200"},{"id":"psy-28","name":"Glory of the Emperor","category":"Psychic Power","discipline":"Ultramarines","summary":"A group-support power that invokes discipline and loyalty.","source":"Core Rulebook","page":"189–200"},{"id":"psy-29","name":"Word of the Emperor","category":"Psychic Power","discipline":"Ultramarines","summary":"A commanding psychic effect that compels attention and tests enemy resolve.","source":"Core Rulebook","page":"189–200"},{"id":"psy-30","name":"Corax's Ingenuity","category":"Psychic Power","discipline":"Raven Guard","summary":"A Raven Guard support power themed around timing, deception, and surprise.","source":"First Founding — user supplied reference","page":"17–19"},{"id":"psy-31","name":"Curse of the Raven","category":"Psychic Power","discipline":"Raven Guard","summary":"A sustained curse that exposes a chosen opponent’s weaknesses to the Kill-team.","source":"First Founding — user supplied reference","page":"17–19"},{"id":"psy-32","name":"The Unkindness of Deliverance","category":"Psychic Power","discipline":"Raven Guard","summary":"A Raven Guard manifestation used to harry and distract enemies in the tabletop rules.","source":"First Founding — user supplied reference","page":"17–19"}],"solo":[{"id":"solo-righteous","name":"Righteous Zeal","category":"Solo Mode","chapter":"Black Templars","rank":1,"summary":"Once per combat, activate as a Free Action for a number of rounds equal to Rank. It is especially effective against daemonic or psychic threats and improves at Ranks 3, 5, and 7.","activation":"Free Action; once per combat","duration":"Rounds equal to Rank","source":"Core Rulebook","page":"217"},{"id":"solo-blood","name":"Blood Frenzy","category":"Solo Mode","chapter":"Blood Angels","rank":1,"summary":"Once per combat, enter a short-lived frenzy that improves close-combat damage reliability and the chance of Righteous Fury. Higher Ranks improve penetration and the trigger range.","activation":"Once per combat","duration":"ceil(Rank / 2) rounds","source":"Core Rulebook","page":"217"},{"id":"solo-stoic","name":"Stoic Defence","category":"Solo Mode","chapter":"Dark Angels","rank":1,"summary":"Once per combat, establish a defended position and gain temporary Wounds at the cost of mobility. Higher Ranks increase the temporary Wounds and later allow limited movement.","activation":"Once per combat","duration":"Until the position is abandoned or temporary Wounds are lost","source":"Core Rulebook","page":"217"},{"id":"solo-wolf","name":"Wolf Senses","category":"Solo Mode","chapter":"Space Wolves","rank":1,"summary":"While in Solo Mode and without a sealed helmet interfering, failed Perception-based Tests may be rerolled and the Battle-Brother counts as having Dark Sight. Improves with Rank.","activation":"Passive in Solo Mode","duration":"While conditions are met","source":"Core Rulebook","page":"218"},{"id":"solo-thunder","name":"Thunder's Call","category":"Solo Mode","chapter":"Storm Wardens","rank":1,"summary":"A Storm Warden Solo Mode ability focused on personal challenge, force of will, and decisive confrontation. Rank improvements strengthen its effect.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-favoured","name":"Favoured Son","category":"Solo Mode","chapter":"Ultramarines","rank":1,"summary":"An Ultramarines Solo Mode ability reflecting broad competence and exemplary leadership. Its benefits scale with Rank.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-raven","name":"Master of the Shadows","category":"Solo Mode","chapter":"Raven Guard","rank":1,"summary":"A stealth-focused Solo Mode ability that improves covert movement and surprise performance as Rank rises.","activation":"Passive in Solo Mode","duration":"While in Solo Mode","source":"First Founding — user supplied reference","page":"17"}],"squad":[{"id":"sq-fire-effect","name":"Fire for Effect","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":2,"sustained":true,"summary":"Lets the Kill-team use Reactions for immediate ranged Standard Attacks while the ability is sustained. Higher Rank broadens the available attack options.","source":"Core Rulebook","page":"221"},{"id":"sq-fire-support","name":"Fire Support","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Reduces the normal penalty associated with Suppressing Fire and Overwatch for the supported squad. At Rank 3 it becomes quicker to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-furious","name":"Furious Charge","category":"Squad Mode","subtype":"Attack Pattern","action":"Free Action","cost":3,"sustained":false,"summary":"Allows supported Battle-Brothers to immediately close and attack in a coordinated charge, with improved damage reliability. Rank 5 expands the attack option.","source":"Core Rulebook","page":"221"},{"id":"sq-advance","name":"Squad Advance","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Lets the Kill-team use Reactions to make Tactical Advances while the ability remains active. At Rank 3 it becomes a Free Action to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-spacing","name":"Tactical Spacing","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":1,"sustained":true,"summary":"Allows supported Battle-Brothers to share Reactions. At Rank 5 the group also gains an additional Reaction while sustained.","source":"Core Rulebook","page":"223"},{"id":"sq-regroup","name":"Regroup","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":2,"sustained":false,"summary":"A Codex defensive action used to restore order and team effectiveness when the squad is under pressure.","source":"Core Rulebook","page":"223"},{"id":"sq-digin","name":"Dig In","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Improves the effectiveness of prepared defensive positions while the squad remains in place.","source":"Core Rulebook","page":"223"},{"id":"sq-strongpoint","name":"Strongpoint","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Establishes a nominated centre and lets supported Battle-Brothers concentrate on called targets while the centre stays stationary.","source":"Core Rulebook","page":"223"},{"id":"sq-armour-faith","name":"Armour of Faith","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Black Templars","action":"Free Action","cost":2,"sustained":true,"summary":"Improves resistance to psychic effects and resilience against daemonic/psychic harm for supported Battle-Brothers; improves at Rank 5.","source":"Core Rulebook","page":"223"},{"id":"sq-feel-no-pain","name":"Feel No Pain","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Blood Angels","action":"Free Action","cost":3,"sustained":false,"summary":"For a brief period, halves post-protection Damage for the supported group but normally restricts defensive Reactions. Rank 5 removes that restriction.","source":"Core Rulebook","page":"223"},{"id":"sq-immovable","name":"Immovable Defence","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Dark Angels","action":"Full Action","cost":2,"sustained":true,"summary":"While stationary, supported Battle-Brothers gain bonuses to Ballistic Skill Tests, Dodge, and Armour Points. The test bonuses improve at Rank 4.","source":"Core Rulebook","page":"225"},{"id":"sq-pack","name":"Pack Tactics","category":"Squad Mode","subtype":"Chapter Attack Pattern","chapter":"Space Wolves","action":"Free Action","cost":2,"sustained":false,"summary":"One Space Marine can spend an unused Reaction to distract a target so another Battle-Brother’s attacks are harder to avoid; Rank 3 improves melee attack rolls.","source":"Core Rulebook","page":"225"},{"id":"sq-shield-sword","name":"Shield and Sword","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Storm Wardens","action":"Free Action","cost":2,"sustained":true,"summary":"Lets supported Battle-Brothers protect nearby allies with Parry reactions and answer a successful melee strike with an immediate response. Rank 5 improves Parry.","source":"Core Rulebook","page":"225"},{"id":"sq-rally","name":"Rally Cry","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Ultramarines","action":"Free Action","cost":0,"sustained":false,"summary":"Restores Cohesion equal to Fellowship Bonus. It may be used once per game session and does not improve with Rank.","source":"Core Rulebook","page":"225"},{"id":"sq-raven-exploit","name":"Exploit Weakness","category":"Squad Mode","subtype":"Raven Guard Attack Pattern","chapter":"Raven Guard","action":"See supplement","cost":0,"sustained":false,"summary":"A Raven Guard coordinated pattern built around identifying and exploiting a single vulnerable target.","source":"First Founding — user supplied reference","page":"18"},{"id":"sq-raven-evasive","name":"Evasive Manoeuvres","category":"Squad Mode","subtype":"Raven Guard Defensive Stance","chapter":"Raven Guard","action":"See supplement","cost":0,"sustained":true,"summary":"A Raven Guard stance focused on mobility, avoiding suppression, and resisting pinning; its effects improve with Rank.","source":"First Founding — user supplied reference","page":"18"}],"oaths":[{"id":"oath-astartes","name":"Oath of the Astartes","category":"Oath","prereq":"Tactical, Assault, or Devastator Marine","summary":"Adds +2 Cohesion for the Mission and grants access to its associated Codex Squad Mode abilities.","source":"Core Rulebook","page":"228"},{"id":"oath-emperor","name":"Oath to the Emperor","category":"Oath","prereq":"Chaplain or appropriate GM-approved leader","summary":"A Mission oath centred on loyalty to the Emperor and resistance to spiritual threats. Use the leader prerequisite from the owned source.","source":"Core Rulebook","page":"229"},{"id":"oath-glory","name":"Oath of Glory","category":"Oath","prereq":"Tactical or Assault Marine","summary":"Rewards personal involvement in completed Primary and Secondary Objectives with additional Renown.","source":"Core Rulebook","page":"229"},{"id":"oath-knowledge","name":"Oath of Knowledge","category":"Oath","prereq":"Librarian or Apothecary","summary":"Prepares the Kill-team through study. Librarians can instead use it to gain extra protection against undesirable Psychic Phenomena results.","source":"Core Rulebook","page":"229"},{"id":"oath-loyalty","name":"Oath of Loyalty","category":"Oath","prereq":"Tactical Marine or Apothecary","summary":"Strengthens squad camaraderie and grants a bonus on Cohesion-related checks during the Mission.","source":"Core Rulebook","page":"229"}],"rules":[{"id":"rule-test","name":"Characteristic Test","category":"Core Rule","summary":"Roll d100. A result equal to or below the modified target succeeds. Difficulty modifies the target from +60 to -60.","source":"Core Rulebook","page":"203"},{"id":"rule-skilltest","name":"Skill Test","category":"Core Rule","summary":"Use the Skill’s linked Characteristic, training level, and situational modifier. An untrained Basic Skill uses half the linked Characteristic before difficulty is applied; untrained Advanced Skills generally cannot be attempted.","source":"Core Rulebook","page":"202"},{"id":"rule-degrees","name":"Degrees of Success and Failure","category":"Core Rule","summary":"The margin between the roll and target determines how strongly a Test succeeds or fails. The app calculates this automatically in its roller.","source":"Core Rulebook","page":"203"},{"id":"rule-fate","name":"Fate Points","category":"Resource","summary":"Track total and current Fate separately. Fate can be spent for powerful short-term benefits and can sometimes be permanently burned to survive otherwise final consequences.","source":"Core Rulebook","page":"204"},{"id":"rule-wounds","name":"Wounds","category":"Resource","summary":"Wounds absorb ordinary Damage. Once Wounds are gone, further Damage becomes Critical Damage and is resolved by location/type.","source":"Core Rulebook","page":"250"},{"id":"rule-fatigue","name":"Fatigue","category":"Resource","summary":"Fatigue represents exhaustion and accumulated strain. It applies penalties once it reaches thresholds based on Toughness Bonus.","source":"Core Rulebook","page":"251"},{"id":"rule-insanity","name":"Insanity","category":"Resource","summary":"Long-term psychological trauma. Battle-Brothers begin at 0; accumulating Insanity can trigger Battle Traumas and the Primarch’s Curse.","source":"Core Rulebook","page":"278"},{"id":"rule-corruption","name":"Corruption","category":"Resource","summary":"Tracks spiritual and warp taint. Battle-Brothers begin at 0; reaching the Purity Threshold removes a character from normal play.","source":"Core Rulebook","page":"282"},{"id":"rule-cohesion","name":"Cohesion","category":"Kill-team","summary":"A shared Mission resource representing squad unity. It is calculated from the current squad leader and can be spent or damaged during play.","source":"Core Rulebook","page":"211"},{"id":"rule-solo","name":"Solo Mode","category":"Kill-team","summary":"The default mode. A Battle-Brother can freely use Solo Mode abilities but cannot benefit from Squad Mode abilities used by brothers.","source":"Core Rulebook","page":"213"},{"id":"rule-squad","name":"Squad Mode","category":"Kill-team","summary":"A deliberate team state. To enter normally, the Battle-Brother needs at least one brother in Support Range and the Kill-team must have Cohesion remaining.","source":"Core Rulebook","page":"213–214"},{"id":"rule-support","name":"Support Range","category":"Kill-team","summary":"Determines which Battle-Brothers are close enough to share Squad Mode benefits. The range grows with Rank and can depend on visual or vox contact.","source":"Core Rulebook","page":"213–214"},{"id":"rule-renown","name":"Renown","category":"Campaign","summary":"Measures standing within the Deathwatch and influences what support or rare resources a Battle-Brother may be trusted with.","source":"Core Rulebook","page":"140"},{"id":"rule-requisition","name":"Requisition","category":"Mission","summary":"A Mission preparation resource set by the GM. The Kill-team uses it to determine what temporary support and gear can be assigned for the operation.","source":"Core Rulebook","page":"139–140"},{"id":"rule-rank","name":"Rank","category":"Advancement","summary":"Rank is determined by total XP spent. Higher Rank opens additional Speciality advances and improves many Solo/Squad abilities.","source":"Core Rulebook","page":"57–58"},{"id":"rule-charadvance","name":"Characteristic Advance","category":"Advancement","summary":"Each purchased Characteristic Advance adds +5. The progression must be bought in order: Simple, Intermediate, Trained, Expert.","source":"Core Rulebook","page":"57"},{"id":"rule-elite","name":"Elite Advance","category":"Advancement","summary":"A GM-approved advance outside the normal scheme. The GM determines availability, prerequisites, and XP cost.","source":"Core Rulebook","page":"59"},{"id":"rule-fear","name":"Fear","category":"GM Rule","summary":"Fear rating sets the difficulty of Fear Tests for ordinary characters. Battle-Brothers are unusually resistant, but frightening enemies can still threaten squad Cohesion.","source":"Core Rulebook","page":"277"},{"id":"rule-disposition","name":"Disposition","category":"GM Rule","summary":"The GM sets an NPC’s starting attitude. Interaction Tests can improve or worsen that attitude by steps according to Degrees of Success or Failure.","source":"Core Rulebook","page":"276"},{"id":"rule-hordes","name":"Hordes","category":"GM Rule","summary":"Represents large groups as a single abstract enemy with Magnitude. GM tools track Magnitude separately from ordinary Wounds.","source":"Core Rulebook","page":"359–360"}],"difficulty":[["Trivial",60],["Elementary",50],["Simple",40],["Easy",30],["Routine",20],["Ordinary",10],["Challenging",0],["Difficult",-10],["Hard",-20],["Very Hard",-30],["Arduous",-40],["Punishing",-50],["Hellish",-60]]};const STORE="astartes_field_codex_v5";const CHARS=["WS","BS","S","T","Ag","Int","Per","WP","Fel"];const CHARNAME={WS:"Weapon Skill",BS:"Ballistic Skill",S:"Strength",T:"Toughness",Ag:"Agility",Int:"Intelligence",Per:"Perception",WP:"Willpower",Fel:"Fellowship"};

function chBase(c,k){return Number(c.characteristics[k]||0)}function chapterMod(c,k){let ch=chapter(c.chapter);let v=Number(ch?.mods?.[k]||0);if(ch?.choiceMods&&c.chapterChoiceMods?.includes(k))v+=Number(ch.choiceMods.amount||0);return v}function advanceMod(c,k){return(c.advances||[]).filter(a=>a.kind==="Characteristic"&&a.characteristic===k).reduce((n,a)=>n+Number(a.amount||5),0)}function customMod(c,k){return(c.customModifiers||[]).filter(x=>x.target===k&&x.enabled!==false).reduce((n,x)=>n+Number(x.amount||0),0)}function armourMod(c,k){if(c.armour==="power-armour"&&k==="S")return 20;if(c.armour==="terminator-armour"){if(k==="S")return 30;if(k==="Ag")return-20}return 0}function derivedChar(c,k){return chBase(c,k)+chapterMod(c,k)+advanceMod(c,k)+customMod(c,k)+armourMod(c,k)}function bonus(c,k){let b=Math.floor(derivedChar(c,k)/10);if(k==="S"||k==="T")b*=2;return b}function skillRank(c,name){let base=baselineSkills().some(x=>x===name||x.startsWith(name+" ("))?0:null;let own=c.skills?.[name];if(own!==undefined)return Number(own);return base}function skillDef(name){return DATA.skills.find(x=>x.name===name)}function skillTarget(c,s){let v=derivedChar(c,s.characteristic),r=skillRank(c,s.name);if(r===null)return s.skillType==="Basic"?Math.floor(v/2):null;return v+r}function baselineSkills(){return['Awareness','Ciphers','Climb','Dodge','Lore: Common','Concealment','Drive','Intimidate','Literacy','Navigation','Lore: Scholastic','Silent Move','Speak Language','Tactics','Tracking','Lore: Forbidden']}function calcRank(c){let total=Number(c.xpSpent||0);if(total<4000)return 1;if(total<8000)return 2;if(total<12000)return 3;if(total<16000)return 4;if(total<20000)return 5;if(total<24000)return 6;if(total<30000)return 7;return 8}function movement(c){let ab=Math.max(0,Math.floor(derivedChar(c,'Ag')/10)+(c.armour==='power-armour'||c.armour==='artificer-armour'?1:0));if(c.armour==='terminator-armour')return{half:ab,full:ab*2,charge:ab*3,run:'—'};return{half:ab,full:ab*2,charge:ab*3,ru function wireSheet(c){let pf=document.getElementById('portraitFile');document.getElementById('portrait')?.addEventListener('click',()=>pf.click());pf?.addEventListener('change',e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{c.portrait=r.result;save();renderSheet()};r.readAsDataURL(f)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.sheetTab=b.dataset.tab;save();renderSheet()});document.querySelectorAll('[data-char]').forEach(el=>el.onclick=()=>showCharacteristic(c,el.dataset.char));document.querySelectorAll('[data-skill-roll]').forEach(el=>el.onclick=()=>{let s=skillDef(el.dataset.skillRoll),t=skillTarget(c,s);if(t!==null)openRoll(s.name,t)});document.querySelectorAll('[data-skill-info]').forEach(el=>el.onclick=()=>{let s=skillDef(el.dataset.skillInfo);inspect(s)});document.querySelectorAll('[data-record]').forEach(el=>el.onclick=()=>{let pools=[...DATA.talents,...DATA.traits,...DATA.implants,...DATA.armours,...DATA.cybernetics,...DATA.psychic,...DATA.rules,...DATA.solo,...DATA.squad,...DATA.oaths,...state.homebrew];inspect(pools.find(x=>x.id===el.dataset.record))});document.querySelectorAll('[data-rule-name]').forEach(el=>el.onclick=()=>inspect(recordByName(el.dataset.ruleName)||{id:'temp',name:el.dataset.ruleName,summary:'This named ability is tracked by the app; use Edit local note to add campaign-specific wording.'}));document.querySelectorAll('[data-spec]').forEach(el=>el.onclick=()=>inspect(spec(el.dataset.spec)));document.querySelectorAll('[data-chapter]').forEach(el=>el.onclick=()=>inspect(chapter(el.dataset.chapter)));document.querySelectorAll('[data-simple]').forEach(el=>el.onclick=()=>{let s=spec(c.speciality)?.abilities.find(x=>x[0]===el.dataset.simple);inspect({id:'sp-'+el.dataset.simple,name:el.dataset.simple,category:'Speciality Ability',summary:s?.[1]||'',source:'Core Rulebook'})});document.querySelectorAll('[data-res]').forEach(el=>el.onclick=()=>{let o=c[el.dataset.res],d=Number(el.dataset.d ick=()=>{let n=m.querySelector('#cy').value;if(n&&!c.cybernetics.includes(n))c.cybernetics.push(n);save();b.remove();renderSheet()}));document.getElementById('addPsy')?.addEventListener('click',()=>modal('Learn / record psychic power',`<div class="field"><label>Power</label><select id="psy">${DATA.psychic.filter(x=>!c.psychic.includes(x.name)).map(x=>`<option value="${esc(x.name)}">${esc(x.name)} — ${esc(x.discipline)}</option>`).join('')}</select></div><button class="btn primary" id="psys">Add</button>`,(b,m)=>m.querySelector('#psys').onclick=()=>{let n=m.querySelector('#psy').value;if(n&&!c.psychic.includes(n))c.psychic.push(n);save();b.remove();renderSheet()}));document.getElementById('addCharAdvance')?.addEventListener('click',()=>addCharacteristicAdvance(c));document.getElementById('addOtherAdvance')?.addEventListener('click',()=>addOtherAdvance(c))}
function showCharacteristic(c,k){let parts=[['Base',chBase(c,k)],['Chapter',chapterMod(c,k)],['Advances',advanceMod(c,k)],['Armour',armourMod(c,k)],['Custom',customMod(c,k)]].filter(x=>x[1]!==0||x[0]==='Base');modal(CHARNAME[k],`<div class="card"><div class="rollresult"><div class="die">${derivedChar(c,k)}</div><b>Characteristic</b><div>Bonus ${bonus(c,k)}</div></div>${parts.map(x=>`<div class="listrow"><span>${x[0]}</span><div class="grow"></div><b>${x[1]>=0?'+':''}${x[1]}</b></div>`).join('')}<button class="btn primary" id="cr">Roll ${esc(CHARNAME[k])}</button></div>`,(b,m)=>m.querySelector('#cr').onclick=()=>openRoll(CHARNAME[k],derivedChar(c,k)))}

function addOtherAdvance(c){modal('Record Advance',`<div class="field"><label>Name</label><input id="an"></div><div class="field"><label>Type</label><select id="ak"><option>Skill</option><option>Talent</option><option>Trait</option><option>Chapter</option><option>Deathwatch</option><option>Elite</option><option>Other</option></select></div><div class="field"><label>XP Cost</label><input id="ax" type="number" value="0"></div><div class="field"><label>Notes / prerequisites</label><textarea id="ano"></textarea></div><button class="btn primary" id="as">Record</button>`,(b,m)=>m.querySelector('#as').onclick=()=>{let cost=Number(m.querySelector('#ax').value||0);c.advances.push({name:m.querySelector('#an').value||'Advance',kind:m.querySelector('#ak').value,cost,notes:m.querySelector('#ano').value});c.xpSpent+=cost;c.xpAvailable=Math.max(0,c.xpAvailable-cost);c.rank=calcRank(c);save();b.remove();renderSheet()})}
function renderCreate(){let c=active(),st=c.builder.step||1,ch=chapter(c.chapter),sp=spec(c.speciality);let names=['Orientation','Characteristics','Chapter','Speciality','Derived','Astartes','Armour','Identity','Review'];let head=`<div class="steps">${names.map((n,i)=>`<span class="${st===i+1?'active':''}" title="${n}">${i+1}</span>`).join('')}</div>`;let body='';if(st===1)body=`<div class="card"><div class="eyebrow">Stage 1</div><h2>What are you building?</h2><p>You are creating an Adeptus Astartes Battle-Brother: a genetically augmented Space Marine whose abilities are represented by nine Characteristics, trained Skills, Talents, Traits, implanted organs, armour, Chapter doctrine, and a Speciality.</p><div class="notice"><b>New to Warhammer?</b> You do not need the book memorised. Every choice remains readable before selection, and the final sheet shows where its numbers came from.</div>${[['Characteristics','Nine percentile scores. Higher is better. Tests use d100.'],['Chapter','Culture and gene-line. Core Chapters add modifiers, a Demeanour, and a Solo Mode ability.'],['Speciality','Your role in the squad: medic, mobile assault, support, psyker, generalist, or engineer.'],['Solo / Squad Mode','Solo is the default. Squad Mode links Battle-Brothers through Cohesion and Support Range.'],['Rank / XP','XP buys advances. Total XP spent determines Rank.']].map(x=>`<div class="listrow"><b>${x[0]}</b><div class="grow small">${x[1]}</div></div>`).join('')}</div>`;
else if(st===2){let pointSpent=CHARS.reduce((n,k)=>n+Math.max(0,c.characteristics[k]-30),0);body=`<div class="card"><h2>Characteristics</h2><p>The standard method rolls 2d10 + 30 for each of the nine Characteristics. One rolled Characteristic may be rerolled once, and the new result must be kept. The alternate method begins all nine at 30 and distributes 100 points, with no more than +20 in any one Characteristic.</p><div class="field"><label>Method</label><select id="method"><option value="roll" ${c.builder.method==='roll'?'selected':''}>2d10 + 30</option><option value="points" ${c.builder.method==='points'?'selected':''}>100-point allocation</option></select></div><div class="chars">${CHARS.map(k=>`<div class="char" style="cursor:default"><small>${k}</small><b>${c.characteristics[k]}</b>${c.builder.method==='roll'?`<button class="btn" data-roll-char="${k}">${c.builder.rolls[k]?'Reroll':'Roll'}</button>`:`<input data-point-char="${k}" type="number" min="30" max="50" value="${c.characteristics[k]}">`}</div>`).join('')}</div>${c.builder.method==='roll'?`<div class="notice">Reroll used: <b>${c.builder.rerollUsed?'Yes':'No'}</b>. Once used, other rolled Characteristics cannot be rerolled.</div>`:`<div class="notice">Allocated: <b>${pointSpent}/100</b>. Remaining: <b>${100-pointSpent}</b>.</div>`}</div>`}
else if(st===3)body=`<div class="card"><h2>Choose Chapter</h2><p>Your Chapter shapes identity and, when its exact rules are loaded, applies automatic modifiers and Chapter abilities. <b>READ</b> remains available even when a choice is restricted or its supplement mechanics are not loaded.</p><div class="choicegrid">${DATA.chapters.map(x=>`<button class="choice ${c.chapter===x.id?'selected':''}" data-choose-ch="${x.id}"><span class="read" data-read-ch="${x.id}">READ</span><b>${esc(x.name)}</b><div class="small">${esc(x.summary)}</div><div>${Object.entries(x.mods||{}).map(([k,v])=>`<span class="tag">${k} +${v}</span>`).join('')}${x.rules==='supplement-pending'?'<span class="tag">Supplement mechanics pending</span>':''}</div></button>`).join('')}</div>${ch?.choiceMods?`<div class="card"><b>Ultramarines characteristic choices</b><div class="small">Choose two different Characteristics to receive +5.</div><div class="choicegrid">${CHARS.map(k=>`<button class="choice ${c.chapterChoiceMods.includes(k)?'selected':''}" data-umod="${k}">${k} +5</button>`).join('')}</div></div>`:''}${ch?.rules==='supplement-pending'?`<div class="notice badnotice"><b>Rules integrity:</b> FFG officially published this Chapter for Deathwatch, but its exact supplement mechanics are not present in the supplied source material. The app will not invent them. You can still use the visual/lore profile and add local modifiers later.</div>`:''}</div>`;
else if(st===4)body=`<div class="card"><h2>Choose Speciality</h2><p>The Speciality is the Battle-Brother’s role. It determines starting Skills, core abilities, later advancement choices, and the kind of problems the character is expected to solve.</p><div class="choicegrid">${DATA.specialities.map(x=>{let blocked=ch?.restrictions?.includes(x.id);return`<button class="choice ${c.speciality===x.id?'selected':''} ${blocked?'disabled':''}" data-choose-sp="${x.id}" data-blocked="${blocked?1:0}"><span class="read" data-read-sp="${x.id}">READ</span><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div>${blocked?`<div class="small" style="color:var(--bad)">Unavailable to ${esc(ch?.name)}</div>`:''}</button>`}).join('')}</div></div>`;
else if(st===5){let mv=movement(c);body=`<div class="card"><h2>Wounds, Fate, Movement & XP</h2><p>These values turn the profile into a playable character. Wounds are 1d5 + 18 before applicable Chapter changes. Fate is rolled on the Core starting table. Power armour increases the Agility Bonus used for movement by 1.</p><div class="resources"><div class="resource"><small>Wounds</small><b>${c.wounds.max}</b><button class="btn" id="rw">Roll</button></div><div class="resource"><small>Fate</small><b>${c.fate.max}</b><button class="btn" id="rf">Roll d10</button></div><div class="resource"><small>Starting XP</small><b>1,000</b><small>available</small></div></div><div class="derived"><div class="dcell"><small>Half Move</small><b>${mv.half}m</b></div><div class="dcell"><small>Full Move</small><b>${mv.full}m</b></div><div class="dcell"><small>Charge</small><b>${mv.charge}m</b></div><div class="dcell"><small>Run</small><b>${mv.run==='—'?'—':mv.run+'m'}</b></div></div><div class="notice">The app begins the character at Rank 1 with a 12,000-XP pre-existing baseline and 1,000 XP available for starting Advances.</div></div>`}
else if(st===6)body=`<div class="card"><h2>Astartes Baseline</h2><p>Every Space Marine already carries extensive hypno-conditioning, trained Skills, Talents, Traits, and implanted organs before Chapter and Speciality choices are considered.</p><div class="notice"><b>Important calculation rule:</b> several implants contribute to Unnatural Strength (x2) and Unnatural Toughness (x2). Those Traits are already on the character and are not added again when you inspect the individual organs.</div><h3>Starting Talents</h3>${DATA.talents.slice(0,12).map(x=>`<div class="listrow"><span class="link" data-record="${x.id}">${esc(x.name)}</span><div class="grow small">${esc(x.summary)}</div></div>`).join('')}<h3>Starting Traits</h3>${DATA.traits.slice(0,2).map(x=>`<div class="listrow"><span class="link" data-record="${x.id}">${esc(x.name)}</span><div class="grow small">${esc(x.summary)}</div></div>`).join('')}<h3>Implants</h3><div class="small">All nineteen implanted systems are present on the completed sheet and remain individually inspectable.</div></div>`;
else if(st===7)body=`<div class="card"><h2>Armour & Augmentation</h2><p>Standard creation assigns Mark VII Astartes power armour. Armour is a mechanical profile, not just an inventory line: it changes Strength, movement, protection, and other derived rules.</p><div class="choicegrid">${DATA.armours.map(x=>`<button class="choice ${c.armour===x.id?'selected':''}" data-armour="${x.id}"><span class="read" data-read-arm="${x.id}">READ</span><b>${esc(x.name)}</b><div class="small">${esc(x.summary)}</div></button>`).join('')}</div><div class="notice">Scout, Artificer, and Terminator armour are included for campaign editing and later progression. The GM remains responsible for whether a character may actually possess them.</div></div>`;
else if(st===8)body=`<div class="card"><h2>Give the Battle-Brother Life</h2><p>The Core treats identity as a real creation stage. Record appearance, a notable past event, power-armour history, personal Demeanour, and name.</p><div class="field"><label>Name</label><input id="bn" value="${esc(c.name)}"></div><div class="field"><label>Appearance</label><textarea id="ba">${esc(c.appearance)}</textarea></div><div class="field"><label>Past event</label><textarea id="bp">${esc(c.past)}</textarea></div><div class="field"><label>Power armour history / quirk</label><textarea id="bh">${esc(c.armourHistory)}</textarea></div><div class="field"><label>Personal Demeanour</label><input id="bd" value="${esc(c.demeanour)}"></div></div>`;
else{let warnings=[];if(!c.chapter)warnings.push('Choose a Chapter.');if(!c.speciality)warnings.push('Choose a Speciality.');if(ch?.choiceMods&&c.chapterChoiceMods.length!==2)warnings.push('Ultramarines require two different +5 Characteristic choices.');if(ch?.rules==='supplement-pending')warnings.push('This Chapter’s exact supplement mechanics are not loaded; it will function as an editable visual/lore profile.');body=`<div class="card"><h2>Review</h2><div class="listrow"><b>Name</b><div class="grow"></div><span>${esc(c.name)}</span></div><div class="listrow"><b>Chapter</b><div class="grow"></div><span>${esc(ch?.name||'—')}</span></div><div class="listrow"><b>Speciality</b><div class="grow"></div><span>${esc(sp?.name||'—')}</span></div><div class="listrow"><b>Wounds / Fate</b><div class="grow"></div><span>${c.wounds.max} / ${c.fate.max}</span></div>${warnings.map(w=>`<div class="notice badnotice">${esc(w)}</div>`).join('')||'<div class="notice"><b>Ready.</b> Core choices are internally consistent.</div>'}<h3>What this character is good at</h3><p>${esc(ch?.playstyle||'Choose a Chapter to see its play-style summary')} ${sp?esc(' '+sp.summary):''}</p><button class="btn primary" id="finish" ${warnings.some(w=>w.startsWith('Choose')||w.startsWith('Ultramarines'))?'disabled':''}>Complete Character</button></div>`}
