  function duplicateCharacter(id){const original=state.characters.find(c=>c.id===id);if(!original)return;const copy=structuredClone(original);copy.id=uid();copy.name=`${original.name} Copy`;copy.portrait=original.portrait;['armour','weapons','gear','skills','abilities','advances','effects'].forEach(k=>copy[k]=(copy[k]||[]).map(x=>({...x,id:uid()})));state.characters.push(copy);state.activeId=copy.id;saveState();closeModal();render();showToast('Character duplicated');}

  function downloadJSON(filename,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
  function safeName(s){return String(s||'deathwatch').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'deathwatch';}
  function exportAll(){state.settings.lastBackupAt=new Date().toISOString();saveState();downloadJSON(`deathwatch-companion-backup-${new Date().toISOString().slice(0,10)}.json`,state);showToast('Backup exported');}
  function exportCharacter(){const c=activeChar();if(!c){showToast('No character to export');return;}downloadJSON(`${safeName(c.name)}-character.json`,{type:'deathwatch-companion-character',version:VERSION,character:c});showToast('Character exported');}
  function exportCompendium(){downloadJSON(`deathwatch-compendium-${new Date().toISOString().slice(0,10)}.json`,{type:'deathwatch-companion-compendium',version:VERSION,entries:state.compendium});showToast('Compendium exported');}

  importFile.addEventListener('change', async()=>{
    const f=importFile.files?.[0];if(!f)return;
    try{const data=JSON.parse(await f.text());const mode=importFile.dataset.mode||'all';if(mode==='compendium'){const entries=Array.isArray(data)?data:data.entries;if(!Array.isArray(entries))throw new Error('No compendium entries');state.compendium=mergeCompendium(state.compendium,entries.map(normalizeCompendiumEntry));saveState();showToast(`${entries.length} entries imported`);}
      else if(data.type==='deathwatch-companion-character'&&data.character){const c=normalizeCharacter(data.character);c.id=uid();state.characters.push(c);state.activeId=c.id;saveState();render();showToast('Character imported');}
      else if(Array.isArray(data.characters)){state={...defaultState(),...data};state.settings={...defaultState().settings,...(data.settings||{})};state.characters=data.characters.map(normalizeCharacter);state.compendium=Array.isArray(data.compendium)?data.compendium.map(normalizeCompendiumEntry):structuredClone(STARTER_COMPENDIUM).map(normalizeCompendiumEntry);state.activeId=state.characters.some(c=>c.id===data.activeId)?data.activeId:(state.characters[0]?.id||null);saveState();render();showToast('Backup restored');}
      else throw new Error('Unsupported file');
    }catch(err){console.error(err);showToast('Import failed: unsupported JSON');}finally{importFile.value='';delete importFile.dataset.mode;}
  });

  function mergeCompendium(existing,incoming){const byKey=new Map(existing.map(x=>[`${x.category}|${x.name}|${x.source}`.toLowerCase(),x]));incoming.forEach(raw=>{if(!raw?.name)return;const x=normalizeCompendiumEntry(raw);const key=`${x.category||'Other'}|${x.name}|${x.source||''}`.toLowerCase();if(!byKey.has(key)){existing.push(x);byKey.set(key,x);}});return existing;}

  function about(){openModal('About Deathwatch Companion', `<p class="section-note"><strong>Version ${VERSION}</strong></p><p class="section-note">Version 1.0 is a local-first Deathwatch tabletop companion framework: guided character building, reversible Chapter/Speciality packages, characteristics and resources, skills, Solo/Squad Mode activation, Cohesion tracking, Psykana, combat state, armoury/ammunition, saved mission loadouts, Requisition/Renown validation, rules-aware advancement, source packs, backups, and the Data Librarium.</p><p class="section-note">It intentionally does not bundle copied commercial rulebook text or a complete proprietary rules database. Enter material from books you own and retain source/page references.</p><p class="section-note">The app never assumes missing rules data when a safe manual workflow is possible.</p><div class="modal-actions"><button class="btn" data-diagnostics>Diagnostics</button><button class="btn" data-reset-starter>Restore Starter Library Entries</button><button class="btn primary" data-done>Done</button></div>`,()=>{modalBody.querySelector('[data-done]').onclick=closeModal;modalBody.querySelector('[data-diagnostics]').onclick=diagnostics;modalBody.querySelector('[data-reset-starter]').onclick=()=>{state.compendium=mergeCompendium(state.compendium,structuredClone(STARTER_COMPENDIUM));saveState();showToast('Starter entries restored');};});}

  closeModalBtn.onclick=closeModal;
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.classList.contains('hidden'))closeModal();});
  el('rollBtn').onclick=quickRoll;
  el('menuBtn').onclick=openMenu;
  el('brandHome').onclick=()=>setView('overview');
  el('brandHome').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')setView('overview');};
  nav.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed',err)));
  }

  view = state.settings.lastView || 'overview';
  [...nav.querySelectorAll('[data-view]')].forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  render();
})();

  
</script>
</body>
</html>
