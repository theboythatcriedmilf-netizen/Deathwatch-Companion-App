<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astartes Vigil Companion</title>
<style>
:root{--accent:#151719;--trim:#d8d8d8;--paper:#e9dfc8;--ink:#24201a;--muted:#706858;--card:#f5eddc;--line:#b8aa8f;--danger:#7c1e22;--ok:#315c3b}
*{box-sizing:border-box} body{margin:0;font-family:ui-serif,Georgia,serif;background:var(--paper);color:var(--ink);min-height:100vh}
body.iron{--paper:#171a1e;--ink:#e6e2d9;--muted:#a8a59d;--card:#22272c;--line:#4a5157;background:radial-gradient(circle at 50% 0,#2c3339,#121416 70%)}
button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.brand{flex:1}.brand b{display:block;letter-spacing:.08em;text-transform:uppercase}.small{font-size:.82rem;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 11px;border-radius:10px;font-weight:700}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{background:var(--danger);color:#fff}.app{max-width:1050px;margin:auto;padding:14px 12px 100px}.hero{border:1px solid var(--line);background:linear-gradient(145deg,color-mix(in srgb,var(--card) 90%,var(--accent) 10%),var(--card));padding:16px;border-radius:18px;box-shadow:0 10px 30px #0002}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;color:var(--muted);font-weight:800}.hero h1{margin:3px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:10px 0}.card h2,.card h3{margin:0 0 7px}.stat{border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;background:#00000008;cursor:pointer}.stat b{display:block;font-size:1.35rem}.resource{display:flex;align-items:center;gap:8px}.resource b{font-size:1.3rem;min-width:55px;text-align:center}.resource button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;overflow:auto;background:color-mix(in srgb,var(--paper) 96%,transparent);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:4px}.nav button{min-width:74px;flex:1;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:10px;font-size:.73rem}.nav button.active{background:var(--accent);color:white}.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mode button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800}.mode button.active{background:var(--accent);color:white}.listrow{border-top:1px solid var(--line);padding:10px 0}.listrow:first-child{border-top:0}.click{cursor:pointer}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:2px;font-size:.73rem}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}.modalWrap{position:fixed;inset:0;background:#0009;z-index:80;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;padding:18px;border:1px solid var(--line)}.modal h2{margin-top:0}.close{float:right}.pauldron{position:fixed;right:15px;bottom:84px;z-index:40;width:78px;height:68px;border-radius:36px 36px 18px 18px;background:var(--accent);border:6px solid var(--trim);box-shadow:0 7px 18px #0006;color:white;font-weight:900;font-size:1.05rem;display:flex;align-items:center;justify-content:center;letter-spacing:.05em}.pauldron:before{content:"D100";position:absolute;bottom:5px;font-size:.55rem;opacity:.75}.powerGrid,.enemyGrid,.armGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.power,.enemy,.arm{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px}.power h3,.enemy h3,.arm h3{margin:2px 0 6px}.profileStats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.profileStats div{text-align:center;padding:5px;border-radius:7px;background:#0001;font-size:.72rem}.profileStats b{display:block;font-size:.9rem}.rollResult{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}.success{color:var(--ok);font-weight:900}.failure{color:var(--danger);font-weight:900}label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 3px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}textarea{min-height:90px}.source{font-size:.72rem;color:var(--muted);margin-top:8px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.sectionTitle h2{margin:0}.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media(max-width:700px){.grid,.powerGrid,.enemyGrid,.armGrid{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}.app{padding-left:9px;padding-right:9px}.profileStats{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="top"><div class="brand"><b>Astartes Vigil Companion</b><span class="small">Core-first clean-sheet rebuild</span></div><button class="btn" id="roleBtn">PLAYER</button><button class="btn" id="surfaceBtn">☾</button></header>
<main id="app" class="app"></main><button id="d100" class="pauldron">RG</button><nav id="nav" class="nav"></nav><div id="modalRoot"></div>
<script>
const VERSION="6.0.0-clean-sheet";
const CHAPTERS=[{"id": "ultramarines", "name": "Ultramarines", "abbr": "UM", "primary": "#183b8c", "secondary": "#f1c84b", "mods": {}, "solo": "Favoured Son", "demeanour": "Honour the Codex", "source": "Core"}, {"id": "blood-angels", "name": "Blood Angels", "abbr": "BA", "primary": "#8b171c", "secondary": "#111111", "mods": {"WS": 5, "Ag": 5}, "solo": "Blood Frenzy", "demeanour": "The Red Thirst", "source": "Core"}, {"id": "dark-angels", "name": "Dark Angels", "abbr": "DA", "primary": "#163b2a", "secondary": "#e6dfc7", "mods": {"BS": 5, "Int": 5}, "solo": "Stoic Defence", "demeanour": "Sons of the Lion", "source": "Core"}, {"id": "space-wolves", "name": "Space Wolves", "abbr": "SW", "primary": "#5b7180", "secondary": "#e7c34b", "mods": {"Per": 5, "Fel": 5}, "solo": "Wolf Senses", "demeanour": "Sons of Russ", "source": "Core"}, {"id": "black-templars", "name": "Black Templars", "abbr": "BT", "primary": "#1b1b1b", "secondary": "#e7e4db", "mods": {"WS": 5, "WP": 5}, "solo": "Righteous Zeal", "demeanour": "Zealous", "source": "Core"}, {"id": "storm-wardens", "name": "Storm Wardens", "abbr": "STW", "primary": "#244f8f", "secondary": "#d9d9d9", "mods": {"S": 5}, "solo": "Thunder's Call", "demeanour": "Aspire to Glory", "source": "Core"}, {"id": "raven-guard", "name": "Raven Guard", "abbr": "RG", "primary": "#151719", "secondary": "#d8d8d8", "mods": {"Ag": 5, "Per": 5}, "solo": "Master of the Shadows", "demeanour": "Son of Night", "source": "First Founding \u2014 supplied supplement"}, {"id": "deathwatch", "name": "Deathwatch", "abbr": "DW", "primary": "#16181c", "secondary": "#bfc4c8", "mods": {}, "solo": "Parent Chapter", "demeanour": "Long Vigil", "source": "Visual campaign skin"}];
const SPECIALITIES=[{"id": "tactical", "name": "Tactical Marine", "role": "Flexible battle-line and squad leader", "skills": []}, {"id": "assault", "name": "Assault Marine", "role": "Mobile close-combat specialist", "skills": ["Pilot (Personal)"]}, {"id": "devastator", "name": "Devastator Marine", "role": "Heavy-support specialist", "skills": []}, {"id": "apothecary", "name": "Apothecary", "role": "Battlefield medic and gene-seed guardian", "skills": ["Medicae"]}, {"id": "techmarine", "name": "Techmarine", "role": "Technical and machine specialist", "skills": ["Tech-Use"]}, {"id": "librarian", "name": "Librarian", "role": "Battle-psyker and keeper of lore", "skills": ["Psyniscience"], "psy": 3}];
const SKILLS=[["Awareness", "Per", true], ["Ciphers (Chapter Runes)", "Int", false], ["Climb", "S", true], ["Dodge", "Ag", true], ["Common Lore (Adeptus Astartes)", "Int", false], ["Common Lore (Imperium)", "Int", false], ["Common Lore (War)", "Int", false], ["Concealment", "Ag", true], ["Drive (Ground Vehicles)", "Ag", false], ["Intimidate", "S", true], ["Literacy", "Int", false], ["Navigation (Surface)", "Int", false], ["Scholastic Lore (Codex Astartes)", "Int", false], ["Silent Move", "Ag", true], ["Speak Language (High Gothic)", "Int", false], ["Speak Language (Low Gothic)", "Int", false], ["Tactics", "Int", false], ["Tracking", "Int", true], ["Common Lore (Deathwatch)", "Int", false], ["Forbidden Lore (Xenos)", "Int", false], ["Medicae", "Int", false], ["Tech-Use", "Int", false], ["Psyniscience", "Per", false], ["Command", "Fel", true], ["Charm", "Fel", true], ["Scrutiny", "Per", true]];
const PSYCHIC=[{"name": "Compel", "discipline": "Telepathy", "action": "Full", "opposed": true, "range": "5m \u00d7 PR", "sustained": false, "effect": "Affects up to PR targets. Each must follow one simple command achievable in a single round. A potentially suicidal command gives the target +20 WP to resist.", "source": "Core Rulebook p.190"}, {"name": "Dominate", "discipline": "Telepathy", "action": "Full", "opposed": true, "range": "10m \u00d7 PR", "sustained": true, "effect": "Controls one target whose total Wounds are less than 3 \u00d7 PR. The psyker divides Actions between himself and the target; the target uses its own Characteristics at \u201310. Suicidal orders allow another Opposed WP test.", "source": "Core Rulebook p.190"}, {"name": "Inspire", "discipline": "Telepathy", "action": "Half", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "Up to PR targets immediately overcome Pinning and gain +10 resistance against Fear while they remain in range and the power is sustained.", "source": "Core Rulebook p.190"}, {"name": "Long-range Telepathy", "discipline": "Telepathy", "action": "Free", "opposed": false, "range": "50km \u00d7 PR", "sustained": true, "effect": "Functions as Short-range Telepathy at greatly extended range. Once learned, Short- and Long-range Telepathy do not invoke Psychic Phenomena unless used at Push. Sustaining is a Free Action.", "source": "Core Rulebook p.191"}, {"name": "Mind Probe", "discipline": "Telepathy", "action": "Extended (5)", "opposed": true, "range": "1m \u00d7 PR", "sustained": true, "modifier": "\u201320 if performed without target knowledge; cannot Push in that case", "effect": "Reads increasingly deep information from one mind based on effective PR. PR can be traded to reduce activation time, to a minimum of one round.", "source": "Core Rulebook p.191"}, {"name": "Mind Scan", "discipline": "Telepathy", "action": "Half", "opposed": false, "range": "200m \u00d7 PR", "sustained": false, "effect": "Detects and identifies sentient minds within range even without line of sight. Information quality scales with PR. Psychically inert creatures are invisible; resistant targets may receive secret Opposed WP tests.", "source": "Core Rulebook p.191"}, {"name": "Short-range Telepathy", "discipline": "Telepathy", "action": "Free", "opposed": false, "range": "50m \u00d7 PR", "sustained": true, "modifier": "\u201320 without a shared language", "effect": "Sends thoughts to up to PR selected targets or broadcasts to every mind in range. Unwilling targets may resist with an Opposed WP test. Sustaining is a Free Action.", "source": "Core Rulebook p.191"}, {"name": "Augury", "discipline": "Divination", "action": "Extended (10)", "opposed": false, "range": "Special", "sustained": false, "effect": "Reads the Emperor\u2019s Tarot for a specific subject and question. The detail of the omen scales with PR and remains subject to GM interpretation.", "source": "Core Rulebook p.192"}, {"name": "Divination", "discipline": "Divination", "action": "Extended (3)", "opposed": false, "range": "Special", "sustained": false, "modifier": "Situational: +10 intimate familiarity; +5 physical portion; \u201310 among many similar targets; +5 within 50m \u00d7 PR; \u201310 beyond 2km", "effect": "Locates a familiar person or object. On success, if the subject is within PR kilometres, the psyker receives a rough location with precision based on PR.", "source": "Core Rulebook p.192"}, {"name": "Lifting the Veil", "discipline": "Divination", "action": "Extended (5)", "opposed": false, "range": "10m radius \u00d7 PR", "sustained": false, "effect": "Relives psychic impressions from the past of an area or object. The amount of useful information scales with PR.", "source": "Core Rulebook p.193"}, {"name": "Possibility Shield", "discipline": "Divination", "action": "Half", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "The psyker and up to PR allies in range gain +10 to one roll each Round. The psyker also gains +5 \u00d7 PR to all Dodge and Parry Tests.", "source": "Core Rulebook p.193"}, {"name": "Psychometry", "discipline": "Divination", "action": "Extended (10)", "opposed": false, "range": "Touch", "sustained": false, "effect": "Reads psychic traces left on a personal object. The depth of impressions gained scales with PR.", "source": "Core Rulebook p.193"}, {"name": "Reading", "discipline": "Divination", "action": "Full", "opposed": false, "range": "5m \u00d7 PR", "sustained": true, "effect": "Reads one visible target\u2019s psychic aura. Information gained scales with PR. Only one target can be maintained at a time.", "source": "Core Rulebook p.193"}, {"name": "Avenger", "discipline": "Codex", "action": "Full", "opposed": false, "range": "30m", "sustained": false, "effect": "Functions like an Astartes heavy-flamer attack for the tabletop rules; its Penetration equals 2 \u00d7 PR.", "source": "Core Rulebook p.194"}, {"name": "Force Dome", "discipline": "Codex", "action": "Full", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "Creates a spherical barrier granting 2 AP \u00d7 PR against ranged attacks and environmental hazards. It stacks with worn Armour but does not stop melee attacks or movement through the barrier.", "source": "Core Rulebook p.194"}, {"name": "Gate of Infinity", "discipline": "Codex", "action": "Extended (3)", "opposed": false, "range": "Self", "sustained": false, "effect": "Creates a temporary portal with an exit within 10km \u00d7 PR. Portal width/height are 2m \u00d7 PR and it remains for PR rounds or until the Librarian passes through. Requires 12 hours recovery before reuse.", "source": "Core Rulebook p.194"}, {"name": "Iron Arm", "discipline": "Codex", "action": "Half or Reaction", "opposed": false, "range": "Self", "sustained": true, "effect": "Grants one extra Reaction each round usable only to Parry, with +3 \u00d7 PR to that Parry WS Test. The affected arm cannot be used for other purposes while sustained.", "source": "Core Rulebook p.194"}, {"name": "Machine Curse", "discipline": "Codex", "action": "Full", "opposed": false, "range": "20m \u00d7 PR", "sustained": false, "effect": "Disables one vehicle for PR rounds or up to PR mechanical devices for the following round. Affected weapons jam and require clearing. Warded machines may resist or be immune at GM discretion.", "source": "Core Rulebook p.195"}, {"name": "Might of the Ancients", "discipline": "Codex", "action": "Half", "opposed": false, "range": "Self", "sustained": true, "effect": "While sustained, all of the Librarian\u2019s melee attacks increase both Damage and Penetration by PR.", "source": "Core Rulebook p.195"}, {"name": "Smite", "discipline": "Codex", "action": "Half", "opposed": false, "range": "10m \u00d7 PR", "sustained": false, "modifier": "Focus Power is modified as a ranged attack for range, lighting and relevant target effects", "effect": "Targets one creature without a separate BS test. Deals 1d10 Energy Damage \u00d7 PR with Penetration PR; creatures within 1m \u00d7 PR of the target are also affected.", "source": "Core Rulebook p.195"}, {"name": "Veil of Time", "discipline": "Codex", "action": "Half", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "Each Round the Librarian receives a personal pool of re-rolls equal to half PR, rounded up. Unused re-rolls expire at the start of the next turn.", "source": "Core Rulebook p.195"}, {"name": "Vortex of Doom", "discipline": "Codex", "action": "Full", "opposed": false, "range": "10m \u00d7 PR", "sustained": false, "effect": "Creates a 2m-diameter roaming warp vortex. Creatures touched test Agility +0 or suffer 1d10 Energy Damage \u00d7 PR. First approach within 10m requires WP \u201320 or 1d5 Corruption. Size and movement vary each round under GM control.", "source": "Core Rulebook p.195"}, {"name": "Blood Boil", "discipline": "Blood Angels", "action": "Half", "opposed": true, "range": "10m \u00d7 PR", "sustained": false, "effect": "One target suffers 1d10 + (2 \u00d7 PR) Energy Damage, max +20, ignoring Armour and Toughness. The Librarian gains 1 Fatigue whether resisted or not. A slain target causes an additional nearby damage effect.", "source": "Core Rulebook p.196"}, {"name": "Blood Lance", "discipline": "Blood Angels", "action": "Half", "opposed": false, "range": "10m \u00d7 PR", "sustained": false, "effect": "A straight-line psychic attack. Each creature crossed suffers 1d10 Rending Damage \u00d7 PR; Toughness Bonus does not reduce it, while Armour and cover still apply.", "source": "Core Rulebook p.196"}, {"name": "Fear the Darkness", "discipline": "Blood Angels", "action": "Half", "opposed": true, "range": "25m \u00d7 PR", "sustained": true, "effect": "Affects up to PR foes. They treat enemies as Fear 1; existing Fear increases by 1 to max Fear 4. While sustained, targets may test WP at \u20135 \u00d7 PR each turn to end the effect.", "source": "Core Rulebook p.196"}, {"name": "Might of Heroes", "discipline": "Blood Angels", "action": "Half", "opposed": false, "range": "Self", "sustained": true, "effect": "Adds +5 \u00d7 PR Strength, to a maximum of 95, including the corresponding Strength Bonus increase.", "source": "Core Rulebook p.196"}, {"name": "Shackle Soul", "discipline": "Blood Angels", "action": "Full", "opposed": true, "range": "10m \u00d7 PR", "sustained": true, "effect": "Prevents one chosen category of action on the target\u2019s next turn: movement, ranged attack, melee attack, or psychic power. Sustaining requires winning a fresh Opposed WP Test each turn.", "source": "Core Rulebook p.196"}, {"name": "Wings of Sanguinius", "discipline": "Blood Angels", "action": "Full", "opposed": false, "range": "Self", "sustained": true, "effect": "Grants the Flyer Trait with Movement equal to PR while sustained.", "source": "Core Rulebook p.196"}, {"name": "Force Barrier", "discipline": "Dark Angels", "action": "Full", "opposed": false, "range": "Self", "sustained": true, "effect": "While stationary, gains 3 AP \u00d7 PR to all locations. At PR 5+, ranged attacks against the Librarian count as Penetration 0.", "source": "Core Rulebook p.197"}, {"name": "Hellfire", "discipline": "Dark Angels", "action": "Half", "opposed": false, "range": "50m \u00d7 PR", "sustained": false, "effect": "Choose a point in range; a 2m \u00d7 PR radius suffers 1d10 Energy Damage \u00d7 PR. Targets also test Agility +0 or catch fire under the tabletop rules.", "source": "Core Rulebook p.197"}, {"name": "Mask of Shadows", "discipline": "Dark Angels", "action": "Half or Reaction", "opposed": false, "range": "Self", "sustained": true, "effect": "Immune to Telepathy from psykers whose WP is not greater than the Librarian\u2019s, and suffers no Cohesion or WP ill effects from Fear.", "source": "Core Rulebook p.197"}, {"name": "Mind Worm", "discipline": "Dark Angels", "action": "Full", "opposed": true, "range": "10m \u00d7 PR", "sustained": true, "effect": "One target suffers \u20135 \u00d7 PR to WS, BS, S, Ag, Int and Fel, minimum 05. While sustained, the target may attempt a new Opposed WP Test each turn. Also grants +30 Interrogation.", "source": "Core Rulebook p.197"}, {"name": "True Strike", "discipline": "Dark Angels", "action": "Half", "opposed": false, "range": "Self", "sustained": false, "effect": "For PR rounds, a successful melee attack against a psyker inflicts +2 \u00d7 PR Damage ignoring Armour/Toughness; the victim then tests WP \u201320 or loses psychic powers for 1 round.", "source": "Core Rulebook p.197"}, {"name": "Weaken Resolve", "discipline": "Dark Angels", "action": "Half", "opposed": true, "range": "5m \u00d7 PR", "sustained": true, "effect": "Affects up to PR foes, temporarily reducing WP by \u20135 \u00d7 PR, minimum 1. While sustained, targets may re-test Opposed WP each turn using the reduced score.", "source": "Core Rulebook p.197"}, {"name": "Fury of the Wolf Spirits", "discipline": "Space Wolves", "action": "Full", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "Summons two spectral wolves. Each makes one automatic-hit melee attack each round unless Dodged/Parried; their game damage scales with PR and damaging hits force Shock rolls.", "source": "Core Rulebook p.198"}, {"name": "Living Lightning", "discipline": "Space Wolves", "action": "Full", "opposed": false, "range": "30m radius \u00d7 PR", "sustained": true, "effect": "While outdoors under open sky, direct lightning at a target each round. It deals 1d10 Energy Damage \u00d7 PR with Shocking; Agility +0 halves damage.", "source": "Core Rulebook p.198"}, {"name": "Storm Caller", "discipline": "Space Wolves", "action": "Full", "opposed": false, "range": "5m radius \u00d7 PR", "sustained": true, "effect": "Creates a shrouding storm around the Rune Priest and allies. Ranged attacks made by or against affected allies suffer \u20135 \u00d7 PR.", "source": "Core Rulebook p.198"}, {"name": "Tempest's Wrath", "discipline": "Space Wolves", "action": "Full", "opposed": false, "range": "150m radius \u00d7 PR", "sustained": true, "effect": "Atmospheric storm hinders flight and ranged attacks. Flyers test Strength at \u20135 \u00d7 PR to move and halve movement even on success; ranged penalties scale with PR. Requires outdoor atmosphere.", "source": "Core Rulebook p.198"}, {"name": "Thunderclap", "discipline": "Space Wolves", "action": "Full", "opposed": false, "range": "10m radius \u00d7 PR", "sustained": false, "effect": "Everyone in range except the Rune Priest suffers 1d5 Impact Damage \u00d7 PR; only head Armour protects. Damaged targets test Toughness at \u20135 \u00d7 PR or are deafened for 1d10 rounds.", "source": "Core Rulebook p.198"}, {"name": "Ancestors' Rage", "discipline": "Storm Wardens", "action": "Full", "opposed": false, "range": "1m \u00d7 PR", "sustained": true, "effect": "The Librarian or one target gains PR Exotic Melee Weapon Talents and +5 \u00d7 PR WS, maximum 95.", "source": "Core Rulebook p.199"}, {"name": "Call to Arms", "discipline": "Storm Wardens", "action": "Extended (2)", "opposed": false, "range": "10m radius \u00d7 PR", "sustained": true, "effect": "Summons PR ancestral warriors using the Imperial Guardsman profile. They remain within range and can be used only for combat; defeated spirits and their gear vanish.", "source": "Core Rulebook p.199"}, {"name": "Crown of Lightning", "discipline": "Storm Wardens", "action": "Half", "opposed": true, "range": "5m \u00d7 PR", "sustained": true, "effect": "One target suffers 1d10 Energy Damage \u00d7 PR with Shock. If sustained, the target suffers 2d10 Energy Damage on each of the Librarian\u2019s turns.", "source": "Core Rulebook p.199"}, {"name": "Hammer of the Emperor", "discipline": "Storm Wardens", "action": "Extended (5)", "opposed": false, "range": "1km \u00d7 PR", "sustained": false, "modifier": "Cannot be Fettered; outdoor use only", "effect": "Creates a 100m \u00d7 PR radius earthquake-like effect against structures; creatures test Agility \u201320 to stay standing. Costs 1d5 Fatigue and cannot be used again for 24 hours.", "source": "Core Rulebook p.199"}, {"name": "Mark of Scorn", "discipline": "Storm Wardens", "action": "Half", "opposed": true, "range": "5m \u00d7 PR", "sustained": true, "effect": "Marks one target. Successful melee attacks against it gain +PR Damage; melee Righteous Fury against it occurs without the normal confirming WS test.", "source": "Core Rulebook p.199"}, {"name": "Thunder's Shell", "discipline": "Storm Wardens", "action": "Half or Reaction", "opposed": false, "range": "Self", "sustained": true, "effect": "All attacks against the Librarian reduce Penetration by PR, minimum 0. Attacks that normally ignore Armour lose that special bypass and resolve against worn Armour normally.", "source": "Core Rulebook p.199"}, {"name": "Corax's Ingenuity", "discipline": "Raven Guard", "action": "Supplement", "opposed": false, "range": "See sup const STORE="astartes_vigil_v6";
const defaultChar=()=>({id:crypto.randomUUID?.()||String(Date.now()),name:"Battle-Brother Corvin",chapter:"raven-guard",speciality:"tactical",rank:1,mode:"solo",chars:{WS:45,BS:45,S:45,T:45,Ag:45,Int:40,Per:45,WP:45,Fel:40},wounds:{damage:0,max:20},fatigue:0,fate:{current:3,max:3},cohesion:{current:6,max:6},insanity:0,corruption:0,xp:{available:1000,spent:0},renown:0,psyRating:0,powers:[],loadout:["Astartes Bolt Pistol","Astartes Bolter","Astartes Combat Knife"],ammo:{},notes:"",advances:[]});
let state={role:"player",view:"sheet",surface:"parchment",active:0,characters:[defaultChar()],mission:{name:"Unassigned Vigil",requisition:40,objectives:[]},encounter:[],customEnemies:[]};
try{let s=JSON.parse(localStorage.getItem(STORE));if(s)state={...state,...s}}catch(e){}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function c(){return state.characters[state.active]||state.characters[0]}
function chapter(){return CHAPTERS.find(x=>x.id===c().chapter)||CHAPTERS[0]}
function spec(){return SPECIALITIES.find(x=>x.id===c().speciality)||SPECIALITIES[0]}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function modChar(k){return (c().chars[k]||0)+(chapter().mods[k]||0)}
function bonus(k){return Math.floor(modChar(k)/10)}
function applyTheme(){let ch=chapter();document.documentElement.style.setProperty("--accent",ch.primary);document.documentElement.style.setProperty("--trim",ch.secondary);document.body.classList.toggle("iron",state.surface==="iron");document.getElementById("d100").textContent=ch.abbr}
function d100(target,mod=0,label="Test"){let roll=Math.floor(Math.random()*100)+1,final=Math.max(1,Math.min(100,target+mod)),ok=roll<=final&&roll<91,deg=ok?Math.max(1,Math.floor((final-roll)/10)+1):Math.max(1,Math.floor((roll-final)/10)+1);return{roll,final,ok,deg,label}}
function showRoll(r,extra=""){modal(`<h2>${esc(r.label)}</h2><div class="rollResult"><div class="${r.ok?'success':'failure'}">${r.ok?'SUCCESS':'FAILURE'} — ${r.roll}</div><div>Target ${r.final} · ${r.deg} Degree${r.deg===1?'':'s'} of ${r.ok?'Success':'Failure'}</div>${extra}</div>`)}
function modal(body){document.getElementById("modalRoot").innerHTML=`<div class="modalWrap" id="mw"><div class="modal"><button class="btn close" onclick="closeModal()">Close</button>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function setView(v){state.view=v;save();render()}
function setRole(r){state.role=r;state.view=r==="gm"?"gm":"sheet";save();render()}
function nav(){let player=[["sheet","Brother"],["armoury","Armoury"],["psykana","Psykana"],["mission","Mission"],["library","Librarium"],["menu","Menu"]],gm=[["gm","Command"],["bestiary","Bestiary"],["encounter","Encounter"],["mission","Mission"],["library","Librarium"],["menu","Menu"]],items=state.role==="gm"?gm:player;document.getElementById("nav").innerHTML=items.map(([id,n])=>`<button data-v="${id}" class="${state.view===id?'active':''}">${n}</button>`).join("");document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v))}
function resource(label,obj,key,min=0,max=999){return `<div class="card resource"><span style="flex:1"><b style="font-size:1rem">${label}</b></span><button data-res="${key}" data-d="-1">−</button><b>${obj}</b><button data-res="${key}" data-d="1">+</button></div>`}
function wireResources(){document.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{let d=+b.dataset.d,k=b.dataset.res,ch=c();if(k==="damage")ch.wounds.damage=Math.max(0,Math.min(ch.wounds.max+30,ch.wounds.damage+d));if(k==="fatigue")ch.fatigue=Math.max(0,ch.fatigue+d);if(k==="fate")ch.fate.current=Math.max(0,Math.min(ch.fate.max,ch.fate.current+d));if(k==="cohesion")ch.cohesion.current=Math.max(0,Math.min(ch.cohesion.max,ch.cohesion.current+d));save();render()})}
function renderSheet(){let ch=c(),sp=spec();let sk=SKILLS.map(([n,k,basic])=>{let trained=true; if(["Medicae","Tech-Use","Psyniscience"].includes(n)&&!sp.skills.includes(n))trained=false;let t=trained?modChar(k):(basic?Math.floor(modChar(k)/2):null);return `<div class="listrow"><b class="click" data-info="skill:${esc(n)}">${esc(n)}</b><button class="btn" style="float:right" ${t===null?'disabled':''} data-skill="${esc(n)}" data-target="${t??0}">${t===null?'Untrained':t}</button><div class="small">${k}${trained?' · Trained':basic?' · Basic, untrained':' · Advanced, unavailable'}</div></div>`}).join("");
let weapons=ch.loadout.map(n=>ARMOURY.find(w=>w.name===n)).filter(Boolean).map(w=>`<div class="arm"><div class="eyebrow">${w.kind} · ${w.class}</div><h3 class="click" data-weapon="${esc(w.name)}">${esc(w.name)}</h3><div class="grid3"><span class="pill">${w.damage}</span><span class="pill">Pen ${w.pen}</span><span class="pill">${w.rof}</span></div><button class="btn primary" style="width:100%;margin-top:8px" data-attack="${esc(w.name)}">ROLL ATTACK</button></div>`).join("");
let powers=ch.speciality==="librarian"?`<div class="card"><h2>Psychic Powers</h2><div class="small">Psy Rating ${ch.psyRating||3}. Tap a power for its complete tabletop profile or manifest directly.</div>${ch.powers.length?ch.powers.map(n=>{let p=PSYCHIC.find(x=>x.name===n);return p?`<div class="listrow"><b class="click" data-power="${esc(p.name)}">${esc(p.name)}</b><button class="btn primary" style="float:right" data-manifest="${esc(p.name)}">MANIFEST</button><div class="small">${p.action} · ${p.range}${p.sustained?' · Sustained':''}</div></div>`:""}).join(""):`<div class="empty">No powers selected. Open Psykana to choose them.</div>`}</div>`:"";
document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">${esc(chapter().name)} · ${esc(sp.name)} · Rank ${ch.rank}</div><h1>${esc(ch.name)}</h1><div class="small">${esc(chapter().demeanour)} · Renown ${ch.renown} · XP ${ch.xp.available} available / ${ch.xp.spent} spent</div></section>
<div class="card"><div class="mode"><button id="soloBtn" class="${ch.mode==="solo"?'active':''}">SOLO MODE</button><button id="squadBtn" class="${ch.mode==="squad"?'active':''}">SQUAD MODE</button></div><div class="small" style="margin-top:8px">${ch.mode==="solo"?`Active: ${esc(chapter().solo)}. Solo is the default state.`:`Squad Mode active. Cohesion and Support Range govern coordinated abilities.`}</div></div>
<div class="grid">${resource("Damage / Wounds",`${ch.wounds.damage} / ${ch.wounds.max}`,"damage")}${resource("Fate",`${ch.fate.current} / ${ch.fate.max}`,"fate")}${resource("Fatigue",ch.fatigue,"fatigue")}${resource("Cohesion",`${ch.cohesion.current} / ${ch.cohesion.max}`,"cohesion")}</div>
<div class="card"><h2>Characteristics</h2><div class="grid3">${Object.keys(ch.chars).map(k=>`<div class="stat" data-char="${k}"><span>${k}</span><b>${modChar(k)}</b><small>Bonus ${bonus(k)}</small></div>`).join("")}</div></div>
<div class="card"><h2>Skills</h2>${sk}</div>
<div class="sectionTitle"><h2>Armoury Loadout</h2><button class="btn" onclick="setView('armoury')">Manage</button></div><div class="armGrid">${weapons||'<div class="empty">No weapons selected.</div>'}</div>
${powers}
<div class="card"><h2>Talents & Traits</h2>${START_TALENTS.map(x=>`<span class="pill click" data-info="talent:${esc(x)}">${esc(x)}</span>`).join("")}<span class="pill">Unnatural Strength ×2</span><span class="pill">Unnatural Toughness ×2</span></div>
<div class="card"><h2>Astartes Systems</h2><div class="small">Implant-derived rules and hypno-conditioning are part of the character baseline. Tap Librarium entries for explanation; modifiers are not double-counted.</div></div>
<div class="card"><h2>Campaign State</h2><div class="grid3"><div class="stat"><span>Insanity</span><b>${ch.insanity}</b></div><div class="stat"><span>Corruption</span><b>${ch.corruption}</b></div><div class="stat"><span>Renown</span><b>${ch.renown}</b></div></div></div>`;
document.getElementById("soloBtn").onclick=()=>{ch.mode="solo";save();render()};document.getElementById("squadBtn").onclick=()=>{if(ch.cohesion.current<1)return modal("<h2>Cannot enter Squad Mode</h2><p>The Kill-team needs at least 1 Cohesion and the normal Support Range requirements must be satisfied.</p>");ch.mode="squad";save();render()};
document.querySelectorAll("[data-char]").forEach(x=>x.onclick=()=>showRoll(d100(modChar(x.dataset.char),0,x.dataset.char+" Test")));
document.querySelectorAll("[data-skill]").forEach(x=>x.onclick=()=>showRoll(d100(+x.dataset.target,0,x.dataset.skill)));
wireCommon();wireResources()}
function attackWeapon(name){let w=ARMOURY.find(x=>x.name===name),ch=c();if(!w)return;let base=w.kind==="Melee"?modChar("WS"):modChar("BS");modal(`<h2>${esc(w.name)}</h2><p class="small">${w.kind==="Melee"?"Weapon Skill":"Ballistic Skill"} ${base}</p><label>Attack mode / modifier</label><select id="atkMod"><option value="10">Standard Attack +10</option>${w.rof.includes("/")&&w.rof.split("/")[1]!=="–"?'<option value="10">Semi-Auto +10</option>':""}${w.rof.split("/")[2]&&w.rof.split("/")[2]!=="–"?'<option value="20">Full Auto +20</option>':""}<option value="0">Custom +0</option></select><label>Additional situational modifier</label><select id="atkSit">${DIFFICULTY.map(([n,m])=>`<option value="${m}" ${m===0?'selected':''}>${n} ${m>=0?'+':''}${m}</option>`).join("")}</select><button class="btn primary" style="width:100%;margin-top:12px" id="goAtk">ROLL ${w.kind==="Melee"?"WS":"BS"}</button><div class="source">${w.damage} · Pen ${w.pen} · Range ${w.range} · RoF ${w.rof} · ${w.qualities}</div>`);document.getElementById("goAtk").onclick=()=>{let m=+document.getElementById("atkMod").value + +document.getElementById("atkSit").value;showRoll(d100(base,m,w.name+" Attack"),`<div class="source">Game profile: ${w.damage}, Pen ${w.pen}. Apply hit-location, protection and damage rules at the table/encounter screen.</div>`)}}
function renderArmoury(){let ch=c();document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Chapter V</div><h1>Armoury</h1><p class="small">The unified area for weapons, armour and mission wargear. Items selected here remain visible on the Battle-Brother sheet.</p></section><input class="search" id="armSearch" placeholder="Search Armoury…"><div class="card"><b>Mission Requisition:</b> ${state.mission.requisition} <span class="small">· Renown ${ch.renown}</span></div><div class="armGrid" id="armList">${ARMOURY.map(w=>`<div class="arm" data-q="${(w.name+" "+w.kind+" "+w.class+" "+w.qualities).toLowerCase()}"><div class="eyebrow">${w.kind} · ${w.class}</div><h3 class="click" data-weapon="${esc(w.name)}">${esc(w.name)}</h3><div><span class="pill">${w.damage}</span><span class="pill">Pen ${w.pen}</span><span class="pill">${w.range}</span><span class="pill">${w.rof}</span></div><div class="small">Clip ${w.clip} · Reload ${w.reload} · Req ${w.req} · ${w.qualities}</div><button class="btn ${ch.loadout.includes(w.name)?'danger':'primary'}" style="width:100%;margin-top:8px" data-equip="${esc(w.name)}">${ch.loadout.includes(w.name)?'RETURN':'EQUIP / REQUISITION'}</button></div>`).join("")}</div>`;
document.getElementById("armSearch").oninput=e=>document.querySelectorAll("#armList .arm").forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?"":"none");
document.querySelectorAll("[data-equip]").forEach(b=>b.onclick=()=>{let n=b.dataset.equip,i=ch.loadout.indexOf(n);if(i>=0)ch.loadout.splice(i,1);else ch.loadout.push(n);save();render()});wireCommon()}
function powerCard(p){return `<div class="power" data-q="${(p.name+" "+p.discipline+" "+p.effect).toLowerCase()}"><div class="eyebrow">${esc(p.discipline)}</div><h3 class="click" data-power="${esc(p.name)}">${esc(p.name)}</h3><div><span class="pill">${esc(p.action)}</span><span class="pill">${esc(p.range)}</span>${p.opposed?'<span class="pill">Opposed WP</span>':''}${p.sustained?'<span class="pill">Sustained</span>':''}</div><p class="small">${esc(p.effect)}</p><button class="btn primary" style="width:100%" data-manifest="${esc(p.name)}">MANIFEST / ROLL</button><div class="source">${esc(p.source)}</div></div>`}
function renderPsykana(){let ch=c(),pr=ch.psyRating||3;document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Chapter VI</div><h1>Psykana</h1><p class="small">Complete actionable power cards: Action, Opposed status, Range, Sustained state, modifiers, effect and Focus Power roll.</p></section>${ch.speciality!=="librarian"?'<div class="card"><b>This Battle-Brother is not a Librarian.</b><div class="small">You can still browse the rules library below, but powers are not added to this character automatically.</div></div>':`<div class="card"><b>Psy Rating ${pr}</b><div class="small">Focus Power is a Willpower Test with +5 × effective PR. Fettered uses half PR rounded up; Unfettered uses full PR; Push adds +3 PR. A Focus Power roll of 91–00 always fails.</div></div>`}<input id="psySearch" class="search" placeholder="Search powers or disciplines…"><div id="psyList" class="powerGrid">${PSYCHIC.map(powerCard).join("")}</div>`;
document.getElementById("psySearch").oninput=e=>document.querySelectorAll("#psyList .power").forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?"":"none");wireCommon()}
function manifest(name){let p=PSYCHIC.find(x=>x.name===name),ch=c(),base=modChar("WP"),basePR=ch.psyRating||3;if(!p)return;if(p.supplement)return modal(`<h2>${esc(p.name)}</h2><p>${esc(p.effect)}</p><p class="source">${esc(p.source)}</p><p>The supplied extraction did not expose the full numeric profile, so this clean-sheet build does not invent a Focus Power modifier.</p>`);
modal(`<h2>${esc(p.name)}</h2><div class="grid"><div><b>Action</b><div>${esc(p.action)}</div></div><div><b>Range</b><div>${esc(p.range)}</div></div></div><p>${esc(p.effect)}</p>${p.modifier?`<div class="card"><b>Special modifier</b><div>${esc(p.modifier)}</div></div>`:""}<label>Power Level</label><select id="powerLevel"><option value="fettered">Fettered</option><option value="unfettered" selected>Unfettered</option><option value="push">Push</option></select><label>Additional modifier</label><select id="psyMod">${DIFFICULTY.map(([n,m])=>`<option value="${m}" ${m===0?'selected':''}>${n} ${m>=0?'+':''}${m}</option>`).join("")}</select><button id="goPsy" class="btn primary" style="width:100%;margin-top:12px">FOCUS POWER TEST</button><div class="source">${esc(p.source)}</div>`);
document.getElementById("goPsy").onclick=()=>{let lvl=document.getElementById("powerLevel").value,pr=lvl==="fettered"?Math.ceil(basePR/2):lvl==="push"?basePR+3:basePR,mod=5*pr+(+document.getElementById("psyMod").value),r=d100(base,mod,p.name+" — Focus Power");let risk=lvl==="fettered"?"No Psychic Phenomena from the Focus Power roll.":lvl==="unfettered"?(String(r.roll).padStart(2,"0")[0]===String(r.roll).padStart(2,"0")[1]?"Double rolled: Psychic Phenomena check required.":"No double rolled."):"Push: Psychic Phenomena check is automatically required.";showRoll(r,`<div>Effective PR ${pr} · Focus bonus +${5*pr}</div><div class="small">${risk}</div>`)}} 
function enemyCard(e){return `<div class="enemy" data-q="${(e.name+" "+e.faction+" "+e.tier+" "+e.traits).toLowerCase()}"><div class="eyebrow">${e.faction} · ${e.tier}</div><h3 class="click" data-enemy="${esc(e.name)}">${esc(e.name)}</h3><div class="profileStats">${Object.entries(e.stats).map(([k,v])=>`<div><span>${k}</span><b>${v||"—"}</b></div>`).join("")}</div><div class="small" style="margin-top:7px">Wounds ${e.wounds} · Move ${e.move} · Armour ${e.armour}</div><button class="btn primary" style="width:100%;margin-top:8px" data-addenemy="${esc(e.name)}">ADD TO ENCOUNTER</button></div>`}
function renderBestiary(){let all=[...BESTIARY,...state.customEnemies];document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Chapter XIII</div><h1>Bestiary</h1><p class="small">Searchable GM profiles for Troops, Elites, Masters and Horde-ready enemies. Tap any profile for traits, attacks, modifiers and rollable Characteristics.</p></section><input id="enemySearch" class="search" placeholder="Search faction, tier, trait or enemy…"><div id="enemyList" class="enemyGrid">${all.map(enemyCard).join("")}</div><button class="btn" style="width:100%;margin-top:12px" id="customEnemy">+ Custom / Homebrew Enemy</button>`;
document.getElementById("enemySearch").oninput=e=>document.querySelectorAll("#enemyList .enemy").forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?"":"none");document.getElementById("customEnemy").onclick=()=>customEnemy();wireCommon()}
function enemyDetail(name){let e=[...BESTIARY,...state.customEnemies].find(x=>x.name===name);if(!e)return;modal(`<h2>${esc(e.name)}</h2><div class="eyebrow">${esc(e.faction)} · ${esc(e.tier)}</div><div class="profileStats" style="margin-top:10px">${Object.entries(e.stats).map(([k,v])=>`<div class="click" data-eroll="${k}" data-et="${v}"><span>${k}</span><b>${v||"—"}</b></div>`).join("")}</div><div class="card"><b>Wounds</b> ${e.wounds} · <b>Movement</b> ${esc(e.move)} · <b>Armour</b> ${esc(e.armour)}</div><div class="card"><b>Traits / Talents</b><p>${esc(e.traits)}</p></div><div class="card"><b>Attacks</b><p>${esc(e.attacks)}</p></div><div class="card"><b>Special Rules & Modifiers</b><p>${esc(e.special)}</p></div><div class="source">${esc(e.source)}</div>`);document.querySelectorAll("[data-eroll]").forEach(x=>x.onclick=()=>showRoll(d100(+x.dataset.et,0,e.name+" "+x.dataset.eroll+" Test")))}
function customEnemy(){modal(`<h2>Create Homebrew Enemy</h2><label>Name</label><input id="ceName"><label>Faction</label><input id="ceFaction" value="Custom"><label>Tier</label><select id="ceTier"><option>Troop</option><option>Elite</option><option>Master</option></select><label>Wounds</label><input id="ceW" type="number" value="20"><label>Notes / special rules</label><textarea id="ceSpecial"></textarea><button class="btn primary" id="saveCE" style="width:100%;margin-top:10px">SAVE PROFILE</button>`);document.getElementById("saveCE").onclick=()=>{let e={name:document.getElementById("ceName").value||"Custom Enemy",faction:document.getElementById("ceFaction").value,tier:document.getElementById("ceTier").value,stats:{WS:30,BS:30,S:30,T:30,Ag:30,Int:30,Per:30,WP:30,Fel:30},move:"3/6/9/18",wounds:+document.getElementById("ceW").value||20,armour:"Custom",traits:"Editable homebrew profile",attacks:"Custom",special:document.getElementById("ceSpecial").value,source:"Homebrew"};state.customEnemies.push(e);save();closeModal();render()}}
function renderEncounter(){document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">GM Battlefield</div><h1>Encounter</h1><p class="small">Track enemy Wounds/Magnitude, initiative notes and active profiles without leaving the battlefield.</p></section>${state.encounter.length?state.encounter.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b><span class="pill">${esc(x.tier)}</span><div class="resource"><span style="flex:1">Current Wounds / Magnitude</span><button data-enc="${i}" data-d="-1">−</button><b>${x.current}</b><button data-enc="${i}" data-d="1">+</button></div><button class="btn" data-enemy="${esc(x.name)}">Open profile</button><button class="btn danger" data-remove="${i}">Remove</button></div>`).join(""):'<div class="empty">No enemies in the encounter. Add them from Bestiary.</div>'}`;
document.querySelectorAll("[data-enc]").forEach(b=>b.onclick=()=>{state.encounter[+b.dataset.enc].current=Math.max(0,state.encounter[+b.dataset.enc].current+(+b.dataset.d));save();render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.encounter.splice(+b.dataset.remove,1);save();render()});wireCommon()}
function renderGM(){document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Game Master</div><h1>Watch Command</h1><p class="small">The GM side is a different workspace: Kill-team state, Bestiary, encounter control, mission objectives and rewards.</p></section><div class="grid"><div class="card click" onclick="setView('bestiary')"><h2>Bestiary</h2><p>${BESTIARY.length} Core adversary profiles plus homebrew.</p></div><div class="card click" onclick="setView('encounter')"><h2>Encounter</h2><p>${state.encounter.length} active enemy records.</p></div><div class="card"><h2>Kill-team</h2><p>${state.characters.length} Battle-Brother(s). Cohesion ${c().cohesion.current}/${c().cohesion.max}.</p></div><div class="card"><h2>Rewards</h2><button class="btn" id="awardXP">Award +100 XP</button><button class="btn" id="awardRenown">Award +1 Renown</button></div></div><div class="card"><h2>Horde Engine</h2><p class="small">A Horde uses its base creature profile but replaces Wounds with Magnitude and location armour with one Horde Armour value. Magnitude is abstract, not a head-count.</p><button class="btn" onclick="setView('bestiary')">Choose a Horde base creature</button></div>`;
document.getElementById("awardXP").onclick=()=>{c().xp.available+=100;save();render()};document.getElementById("awardRenown").onclick=()=>{c().renown+=1;save();render()}}
function renderMission(){document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Chapter VII / IX</div><h1>${esc(state.mission.name)}</h1><p class="small">Objectives, Requisition and campaign bookkeeping.</p></section><div class="card"><label>Mission name</label><input id="mName" value="${esc(state.mission.name)}"><label>Requisition</label><input id="mReq" type="number" value="${state.mission.requisition}"><button id="saveMission" class="btn primary" style="margin-top:8px">Save</button></div><div class="card"><h2>Objectives</h2>${state.mission.objectives.map((o,i)=>`<div class="listrow"><input type="checkbox" data-obj="${i}" ${o.done?'checked':''}> ${esc(o.name)}</div>`).join("")||'<div class="empty">No objectives yet.</div>'}<button id="addObj" class="btn">+ Objective</button></div>`;
document.getElementById("saveMission").onclick=()=>{state.mission.name=document.getElementById("mName").value;state.mission.requisition=+document.getElementById("mReq").value||0;save();render()};document.getElementById("addObj").onclick=()=>{let n=prompt("Objective name");if(n){state.mission.objectives.push({name:n,done:false});save();render()}};document.querySelectorAll("[data-obj]").forEach(x=>x.onchange=()=>{state.mission.objectives[+x.dataset.obj].done=x.checked;save()})}
function renderLibrary(){let rules=[["Focus Power","A Focus Power Test is a Willpower Test. Add +5 × effective Psy Rating. Rolls 91–00 always fail. Fettered halves PR (round up) and avoids Psychic Phenomena; Unfettered uses full PR and doubles can trigger Phenomena; Push adds +3 PR and automatically triggers Phenomena."],["Solo / Squad Mode","Solo is the default. Squad Mode is deliberately entered and enables coordinated abilities. Support Range and Cohesion determine who can participate."],["Hordes","Hordes use a base creature profile, replace Wounds with Magnitude, and use one Armour value. Magnitude is abstract. Horde attacks and breaking use special rules."],["Damage","Deathwatch tracks accumulated Damage against a Wounds threshold rather than simply counting hit points down."],["Requisition","Mission Requisition is spent to withdraw wargear; Renown can gate access to prestigious items."]];document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Rules Reference</div><h1>Librarium</h1><p class="small">Short explanations first; detailed playable systems live on the sheet, Psykana, Armoury and GM Bestiary.</p></section>${rules.map(([n,d])=>`<div class="card"><h3>${n}</h3><p>${d}</p></div>`).join("")}`}
function renderMenu(){let ch=c();document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">Configuration</div><h1>Menu</h1></section><div class="card"><label>Battle-Brother name</label><input id="charName" value="${esc(ch.name)}"><label>Chapter / visual doctrine</label><select id="chapterSel">${CHAPTERS.map(x=>`<option value="${x.id}" ${x.id===ch.chapter?'selected':''}>${x.name}</option>`).join("")}</select><label>Speciality</label><select id="specSel">${SPECIALITIES.map(x=>`<option value="${x.id}" ${x.id===ch.speciality?'selected':''}>${x.name}</option>`).join("")}</select><button id="saveChar" class="btn primary" style="width:100%;margin-top:10px">APPLY CHARACTER</button></div><div class="card"><h2>Appearance</h2><button class="btn" id="parch">Parchment</button><button class="btn" id="iron">Cold Iron</button><p class="small">Chapter primary color drives UI accents. Chapter secondary color drives the pauldron D100 trim.</p></div><div class="card"><h2>Data</h2><button class="btn" id="newChar">+ New Battle-Brother</button><button class="btn danger" id="resetApp">Reset local app data</button><div class="source">Version ${VERSION}</div></div>`;
document.getElementById("saveChar").onclick=()=>{ch.name=document.getElementById("charName").value;ch.chapter=document.getElementById("chapterSel").value;ch.speciality=document.getElementById("specSel").value;if(ch.speciality==="librarian"){ch.psyRating=ch.psyRating||3;if(!ch.powers.length)ch.powers=["Smite","Iron Arm","Inspire"]}save();render()};document.getElementById("parch").onclick=()=>{state.surface="parchment";save();render()};document.getElementById("iron").onclick=()=>{state.surface="iron";save();render()};document.getElementById("newChar").onclick=()=>{state.characters.push(defaultChar());state.active=state.characters.length-1;save();render()};document.getElementById("resetApp").onclick=()=>{if(confirm("Reset all locally stored app data?")){localStorage.removeItem(STORE);location.reload()}}}
function weaponDetail(name){let w=ARMOURY.find(x=>x.name===name);if(!w)return;modal(`<h2>${esc(w.name)}</h2><div class="grid3"><div class="stat"><span>Damage</span><b style="font-size:1rem">${w.damage}</b></div><div class="stat"><span>Pen</span><b>${w.pen}</b></div><div class="stat"><span>Range</span><b style="font-size:1rem">${w.range}</b></div><div class="stat"><span>RoF</span><b style="font-size:1rem">${w.rof}</b></div><div class="stat"><span>Clip</span><b>${w.clip}</b></div><div class="stat"><span>Reload</span><b style="font-size:1rem">${w.reload}</b></div></div><p><b>Qualities:</b> ${esc(w.qualities)}</p><button class="btn primary" style="width:100%" onclick="closeModal();attackWeapon('${esc(w.name)}')">ROLL ATTACK</button><div class="source">Fictional tabletop profile from the user-supplied Deathwatch Core Armoury reference.</div>`)}
function powerDetail(name){let p=PSYCHIC.find(x=>x.name===name);if(!p)return;modal(`<h2>${esc(p.name)}</h2><div class="eyebrow">${esc(p.discipline)}</div><div class="grid3"><div class="stat"><span>Action</span><b style="font-size:.9rem">${esc(p.action)}</b></div><div class="stat"><span>Range</span><b style="font-size:.9rem">${esc(p.range)}</b></div><div class="stat"><span>Opposed</span><b style="font-size:.9rem">${p.opposed?'Yes (WP)':'No'}</b></div></div><div class="card"><b>Effect</b><p>${esc(p.effect)}</p>${p.modifier?`<b>Modifier / condition</b><p>${esc(p.modifier)}</p>`:""}</div><button class="btn primary" style="width:100%" onclick="closeModal();manifest('${esc(p.name)}')">MANIFEST / ROLL</button><div class="source">${esc(p.source)}</div>`)}
function wireCommon(){document.querySelectorAll("[data-weapon]").forEach(x=>x.onclick=()=>weaponDetail(x.dataset.weapon));document.querySelectorAll("[data-attack]").forEach(x=>x.onclick=()=>attackWeapon(x.dataset.attack));document.querySelectorAll("[data-power]").forEach(x=>x.onclick=()=>powerDetail(x.dataset.power));document.querySelectorAll("[data-manifest]").forEach(x=>x.onclick=()=>manifest(x.dataset.manifest));document.querySelectorAll("[data-enemy]").forEach(x=>x.onclick=()=>enemyDetail(x.dataset.enemy));document.querySelectorAll("[data-addenemy]").forEach(x=>x.onclick=()=>{let e=[...BESTIARY,...state.customEnemies].find(y=>y.name===x.dataset.addenemy);if(e){state.encounter.push({name:e.name,tier:e.tier,current:e.wounds});save();modal(`<h2>Added to Encounter</h2><p>${esc(e.name)} is now in the encounter tracker.</p>`)}})}
function render(){nav();document.getElementById("roleBtn").textContent=state.role==="gm"?"GM":"PLAYER";let map={sheet:renderSheet,armoury:renderArmoury,psykana:renderPsykana,mission:renderMission,library:renderLibrary,menu:renderMenu,gm:renderGM,bestiary:renderBestiary,encounter:renderEncounter};(map[state.view]||renderSheet)();applyTheme()}
document.getElementById("roleBtn").onclick=()=>setRole(state.role==="gm"?"player":"gm");document.getElementById("surfaceBtn").onclick=()=>{state.surface=state.surface==="iron"?"parchment":"iron";save();render()};document.getElementById("d100").onclick=()=>showRoll(d100(50,0,"Open d100"));render();
</script></body></html>
