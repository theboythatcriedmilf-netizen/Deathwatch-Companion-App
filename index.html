const V64_oldModChar=modChar;
modChar=function(k){let ch=c();if(ch.chapter==='raven-guard'&&(ch.chapterTrapping==='Ravenclaw'||ch.chapterTrapping==='Raven Calvaria'))return v64charValue(ch,k);return V64_oldModChar(k)};

function v64ledger(ch,amount,kind,note,ref=''){ch.xpLedger.push({id:v64uid('ledger'),amount,kind,note,ref,ts:Date.now()})}
function v64awardXP(ch,amount,note='XP award'){amount=Math.max(0,Math.floor(Number(amount)||0));if(!amount)return;ch.xp.available+=amount;v64ledger(ch,amount,'award',note)}
function v64cleanName(n){return String(n||'').replace(/\s*\(x\d+\)\s*$/,'').trim()}
function v64parseStage(n){let m=String(n).match(/\s\+(10|20)$/);return m?+m[1]:0}
function v64skillBase(n){return v64cleanName(String(n)).replace(/\s\+(10|20)$/,'').trim()}
function v64isGrouped(n){let x=v64skillBase(n);return /\(any\)|\(same (?:Skill|skill) group\)/.test(x)||/^(Ciphers|Drive|Navigation|Performer|Pilot|Trade|Tactics) \(/.test(x)||/^Lore: (Common|Forbidden|Scholastic) \(/.test(x)||/^Speak Language \(/.test(x)}
function v64displaySkillKey(name,choice=''){let base=v64skillBase(name);if(choice){base=base.replace(/\(any\)/i,`(${choice})`).replace(/\(same (?:Skill|skill) group\)/i,`(${choice})`)}return base}
function v64talentBase(n){return v64cleanName(n)}
function v64recordName(a){return typeof a==='string'?a:(a?.name||'')}
function v64hasPurchase(ch,id){return ch.advances.some(a=>typeof a==='object'&&a.purchaseKey===id)}
function v64findTalent(ch,n){let target=v64talentBase(n).replace(/\s*\(any\)$/i,'');return [...(ch.talentsOwned||[]),...ch.advances.map(v64recordName)].some(x=>String(x).startsWith(target))}
function v64knownSkill(ch,n){let stage=v64parseStage(n),base=v64skillBase(n),norm=normalizeSkillName?normalizeSkillName(base):base;let candidates=[base,norm];if(/\(same/i.test(base)){let root=base.split(' (')[0];return Object.entries({...ch.skillsOwned,...ch.groupSkills}).some(([k,v])=>k.startsWith(root+' (')&&(v||0)>=stage)}for(const x of candidates){if(ch.skillsOwned[x]!==undefined&&(ch.skillsOwned[x]||0)>=stage)return true;if(ch.groupSkills[x]!==undefined&&(ch.groupSkills[x]||0)>=stage)return true}let root=base.split(' (')[0].replace(/^Lore: /,'');if(Object.entries(ch.groupSkills).some(([k,v])=>(k.startsWith(base)||k.startsWith(root))&&(v||0)>=stage))return true;let sr=SPEC_RULES[ch.speciality]||{startSkills:[]};return stage===0&&sr.startSkills.some(s=>base.startsWith(s)||s.startsWith(root))}
function v64prereq(ch,pr){
 if(!pr||pr==='—'||pr==='Varies')return {ok:true,reason:''};
 let unknown=[];for(let raw of String(pr).split(',').map(x=>x.trim()).filter(Boolean)){
   let p=raw.replace(/\+$/,'').trim(),m=p.match(/^(WS|BS|S|T|Ag|Int|Per|WP|Fel|Fellowship)\s*(\d+)/i);if(m){let k=m[1].toLowerCase()==='fellowship'?'Fel':Object.keys(ch.chars).find(x=>x.toLowerCase()===m[1].toLowerCase());if(v64charValue(ch,k)<+m[2])return{ok:false,reason:`Requires ${m[1]} ${m[2]}`};continue}
   m=p.match(/^Rank\s*(\d+)/i);if(m){if(v64rank(ch)<+m[1])return{ok:false,reason:`Requires Rank ${m[1]}`};continue}
   m=p.match(/^Psy Rating\s*(\d+)?/i);if(m){let need=+(m[1]||1);if((ch.psyRating||0)<need)return{ok:false,reason:`Requires Psy Rating ${need}`};continue}
   if(/^Techmarine$/i.test(p)){if(ch.speciality!=='techmarine')return{ok:false,reason:'Requires Techmarine'};continue}
   if(/^Librarian$/i.test(p)){if(ch.speciality!=='librarian')return{ok:false,reason:'Requires Librarian'};continue}
   if(/^Adeptus Astartes$/i.test(p)||/^Astartes Weapon Training$/i.test(p)||/^Fly \(Jump Pack\)$/i.test(p))continue;
   if(/same (?:Skill|skill) group/i.test(p)){let root=p.split(' (')[0];if(!v64knownSkill(ch,root))return{ok:false,reason:`Requires the matching ${root} group`};continue}
   if(v64knownSkill(ch,p))continue;
   if(v64findTalent(ch,p))continue;
   // If the token names an indexed Skill, it is a hard requirement. Otherwise leave it to GM review rather than falsely blocking.
   let sb=v64skillBase(p).replace(/^Lore: Common/,'Lore: Common').replace(/^Lore: Forbidden/,'Lore: Forbidden').replace(/^Lore: Scholastic/,'Lore: Scholastic');
   if(CORE_DATA.skills.some(s=>sb.startsWith(s.name)||s.name.startsWith(sb))){return{ok:false,reason:`Requires ${p}`}}
   unknown.push(p);
 }
 return {ok:true,reason:unknown.length?`GM verify: ${unknown.join(', ')}`:''};
}

function v64catalog(ch){
 let r=v64rank(ch),rows=[];
 const add=(scope,source,rank,a,idx)=>rows.push({...a,scope,source,rank,id:`${scope}:${source}:${rank}:${idx}:${a.name}`});
 for(let rr=1;rr<=r;rr++)(V64C.general[String(rr)]||[]).forEach((a,i)=>add('general','General Space Marine',rr,a,i));
 (V64C.chapter[ch.chapter]||[]).forEach((a,i)=>add('chapter',`${v64chapterName(ch.chapter)} Chapter`,0,a,i));
 for(let rr=1;rr<=r;rr++)(V64C.specialities[ch.speciality]?.[String(rr)]||[]).forEach((a,i)=>{if(a.type!=='Psychic Power')add('speciality',v64specName(ch.speciality),rr,a,i)});
 let deathwatchUnlocked=(ch.xp.spent||0)>=1000;
 for(let rr=1;rr<=r;rr++)(V64C.deathwatch[String(rr)]||[]).forEach((a,i)=>add('deathwatch','Deathwatch',rr,a,i));
 return {rows,deathwatchUnlocked};
}
function v64repeatLimit(row){let m=row.name.match(/\(x(\d+)\)/i);return m?+m[1]:1}
function v64purchaseCount(ch,row){return ch.advances.filter(a=>typeof a==='object'&&a.purchaseKey===row.id).length}
function v64needsChoice(row){let n=row.name;return /\(any\)/i.test(n)||/^Peer \(any\)/i.test(n)||/^Good Reputation \(any\)/i.test(n)||/^Signature Wargear \(Hero\) \(any\)/i.test(n)||/^Exotic Weapon Training \(any\)/i.test(n)||/^Mechadendrite Use \(any\)/i.test(n)||/^Astartes Weapon Specialisation$/i.test(n)}
function v64mechanics(row){let n=v64cleanName(row.name),base=n.replace(/\s\+(10|20)$/,'');if(row.type==='Skill'){let s=CORE_DATA.skills.find(x=>base.startsWith(x.name)||normalizeSkillName(base)===x.name);return `${v64parseStage(n)?`Improves this Skill to +${v64parseStage(n)} mastery. `:'Trains this Skill. '}${s?.summary||'Use the linked Characteristic and the normal Skill rules.'}`}
 let r=ADV_RULES[n]||ADV_RULES[base]||CORE_DATA.talents.find(t=>t.name===n||t.name===base);if(r)return r.mechanics||r.summary||'Adds the named Talent and its Core rule.';
 if(/^Psy Rating \d+/.test(n))return `Raises the Librarian’s Psy Rating to ${n.match(/\d+/)[0]}.`;
 if(/^The Flesh is Weak \d+/.test(n))return `Raises The Flesh is Weak to ${n.match(/\d+/)[0]}, updating the Machine Trait accordingly.`;
 if(/^Sound Constitution/.test(n))return 'Each purchase immediately increases maximum Wounds by +1.';
 return 'Adds the named Core Advance to this Battle-Brother. Tap the Talent in the sheet/Librarium when an indexed rule entry is available.';
}
function v64skillChar(key){let root=key.replace(/^Lore: Common.*/,'Lore: Common').replace(/^Lore: Forbidden.*/,'Lore: Forbidden').replace(/^Lore: Scholastic.*/,'Lore: Scholastic').replace(/ \(.*/,'');let s=CORE_DATA.skills.find(x=>x.name===root||key.startsWith(x.name));return s?.characteristic||''}
function v64askChoice(row,cb){
 if(!v64needsChoice(row)){cb('');return}
 let label=/Astartes Weapon Specialisation/.test(row.name)?'Weapon type / class':/Mechadendrite/.test(row.name)?'Mechadendrite group':/Signature Wargear/.test(row.name)?'Item / speciality':'Skill group / speciality';
 modal(`<h2>${esc(row.name)}</h2><p>${esc(v64mechanics(row))}</p><label>${label}</label><input id="v64choice2" placeholder="Enter the specific group or item"><button id="v64choiceGo" class="btn primary" style="width:100%;margin-top:10px">CONTINUE</button>`);document.getElementById('v64choiceGo').onclick=()=>{let v=document.getElementById('v64choice2').value.trim();if(!v)return;cb(v)};
}
function v64applyRow(ch,row,choice=''){
 let pr=v64prereq(ch,row.prereq);if(!pr.ok||ch.xp.available<row.cost)return false;let lim=v64repeatLimit(row);if(v64purchaseCount(ch,row)>=lim&&!v64needsChoice(row))return false;
 if(v64needsChoice(row)&&ch.advances.some(a=>typeof a==='object'&&a.purchaseKey===row.id&&a.choice===choice))return false;
 ch.xp.available-=row.cost;ch.xp.spent+=row.cost;let rec={id:v64uid('adv'),name:v64cleanName(row.name),displayName:choice?`${v64cleanName(row.name)} (${choice})`:v64cleanName(row.name),cost:row.cost,type:row.type,rank:row.rank,source:row.source,scope:row.scope,prereq:row.prereq||'',choice,purchaseKey:row.id,refundable:true,mechanics:v64mechanics(row)};ch.advances.push(rec);v64ledger(ch,-row.cost,'purchase',rec.displayName,rec.id);
 if(row.type==='Skill'){
   let key=v64displaySkillKey(row.name,choice),stage=v64parseStage(row.name);if(v64isGrouped(key))ch.groupSkills[key]=Math.max(ch.groupSkills[key]??-1,stage);else ch.skillsOwned[normalizeSkillName(key)]=Math.max(ch.skillsOwned[normalizeSkillName(key)]??-1,stage);
 }else{
   let stored=rec.displayName;if(!ch.talentsOwned.includes(stored))ch.talentsOwned.push(stored);if(/^Sound Constitution/.test(rec.name))ch.wounds.max+=1;if(/^Psy Rating \d+/.test(rec.name))ch.psyRating=Math.max(ch.psyRating||3,+rec.name.match(/\d+/)[0]);if(/^The Flesh is Weak \d+/.test(rec.name)){let n=+rec.name.match(/\d+/)[0];ch.traitsOwned=ch.traitsOwned.filter(x=>!/^Machine \(\d+\)$/.test(x));ch.traitsOwned.push(`Machine (${n})`)}if(/^Signature Wargear/.test(rec.name)&&choice){if(!ch.signatureWargear.includes(choice))ch.signatureWargear.push(choice)}
 }
 ch.advanceEffects.push({id:rec.id,name:rec.displayName,mechanics:rec.mechanics});save();return true;
}
function v64rebuildOneSkill(ch,rec){let key=v64displaySkillKey(rec.name,rec.choice||''),group=v64isGrouped(key),bag=group?ch.groupSkills:ch.skillsOwned,canon=group?key:normalizeSkillName(key);let remaining=ch.advances.filter(a=>typeof a==='object'&&a.type==='Skill'&&a.id!==rec.id&&v64displaySkillKey(a.name,a.choice||'')===key);let best=remaining.reduce((m,a)=>Math.max(m,v64parseStage(a.name)), -1);let start=(SPEC_RULES[ch.speciality]?.startSkills||[]).some(s=>canon.startsWith(s)||s.startsWith(canon));if(best>=0)bag[canon]=best;else if(start&&!group)bag[canon]=0;else delete bag[canon]}
function v64refund(ch,idx){let rec=ch.advances[idx];if(!rec||typeof rec!=='object'||!rec.refundable)return;let laterChar=rec.type==='Characteristic'&&ch.advances.some((a,j)=>j>idx&&a?.charKey===rec.charKey&&a.refundable);if(laterChar)return alert('Refund the newest advance for this Characteristic first.');if(!confirm(`Refund ${rec.displayName||rec.name} for ${rec.cost} XP?`))return;
 ch.xp.available+=rec.cost;ch.xp.spent=Math.max(0,ch.xp.spent-rec.cost);v64ledger(ch,rec.cost,'refund',rec.displayName||rec.name,rec.id);
 if(rec.type==='Characteristic'&&rec.charKey){ch.chars[rec.charKey]=Math.max(1,ch.chars[rec.charKey]-5);ch.charAdvances[rec.charKey]=Math.max(0,(ch.charAdvances[rec.charKey]||1)-1)}
 if(rec.type==='Skill')v64rebuildOneSkill(ch,rec);
 if(/^Sound Constitution/.test(rec.name||''))ch.wounds.max=Math.max(ch.baseWoundsV64||1,ch.wounds.max-1);
 ch.advances.splice(idx,1);ch.advanceEffects=(ch.advanceEffects||[]).filter(x=>x.id!==rec.id);
 if(rec.type==='Talent'){let stored=rec.displayName||rec.name;let still=ch.advances.some(a=>typeof a==='object'&&(a.displayName||a.name)===stored);if(!still)ch.talentsOwned=ch.talentsOwned.filter(x=>x!==stored)}
 if(/^Psy Rating \d+/.test(rec.name||'')){let vals=ch.advances.filter(a=>typeof a==='object'&&/^Psy Rating \d+/.test(a.name||'')).map(a=>+a.name.match(/\d+/)[0]);ch.psyRating=Math.max(3,...vals)}
 if(/^The Flesh is Weak \d+/.test(rec.name||'')){let vals=ch.advances.filter(a=>typeof a==='object'&&/^The Flesh is Weak \d+/.test(a.name||'')).map(a=>+a.name.match(/\d+/)[0]);let n=Math.max(0,...vals);ch.traitsOwned=ch.traitsOwned.filter(x=>!/^Machine \(\d+\)$/.test(x));if(n)ch.traitsOwned.push(`Machine (${n})`)}
 save();render();
}

renderAdvance=function(){v64migrateComplete();let ch=c(),rank=v64rank(ch),cat=v64catalog(ch),costs=V64C.charCosts[ch.speciality]||V64C.charCosts.tactical;let scope=ch.advanceScope||'all';let rows=cat.rows.filter(x=>scope==='all'||x.scope===scope);let charRows=Object.keys(ch.chars).map(k=>{let lvl=ch.charAdvances[k]||0,cost=lvl<4?costs[k][lvl]:null;return `<tr><td><b>${k}</b> ${modChar(k)}</td><td>${['Simple','Intermediate','Trained','Expert','Max'][lvl]}</td><td>${cost===null?'—':cost+' XP'}</td><td><button class="btn" data-v64char="${k}" ${cost===null||ch.xp.available<cost?'disabled':''}>+5</button></td></tr>`}).join('');

 <div class="card"><h2>XP Ledger</h2><div class="twoCol"><div><label>Award XP</label><input id="v64award" type="number" min="0" value="750"></div><div><label>Reason</label><input id="v64awardNote" value="Mission / GM award"></div></div><button class="btn primary" id="v64awardBtn">ADD XP</button><details><summary>Show ledger</summary><div class="v64ledger">${[...ch.xpLedger].reverse().map(l=>`<div class="listrow"><b>${l.amount>0?'+':''}${l.amount} XP</b> · ${esc(l.kind)}<div class="small">${esc(l.note||'')}</div></div>`).join('')}</div></details></div>
 <div class="card"><h2>Characteristic Advances</h2><p class="small">Simple → Intermediate → Trained → Expert. Each purchase adds +5 and uses the exact cost scheme for ${esc(v64specName(ch.speciality))}.</p><table class="tablelike"><tr><th>Characteristic</th><th>Next</th><th>Cost</th><th></th></tr>${charRows}</table></div>
 <div class="card"><h2>Advance Catalogue</h2><div class="v64tabs">${[['all','All'],['general','General'],['chapter','Chapter'],['speciality','Speciality'],['deathwatch','Deathwatch']].map(([id,n])=>`<button class="btn ${scope===id?'primary':''}" data-v64scope="${id}">${n}</button>`).join('')}</div><input id="v64advSearch" class="search" placeholder="Search ${rows.length} available Rank ${rank} and lower advances…"><div id="v64advRows">${rows.map((row,i)=>{let pr=v64prereq(ch,row.prereq),count=v64purchaseCount(ch,row),lim=v64repeatLimit(row),dwLock=row.scope==='deathwatch'&&!cat.deathwatchUnlocked,bought=count>=lim&&!v64needsChoice(row),insufficient=ch.xp.available<row.cost,lock=!pr.ok||dwLock||bought||insufficient;let note=dwLock?'Spend the initial 1,000 XP before Deathwatch advances unlock.':pr.reason||'';return `<div class="listrow v64adv ${lock?'v64locked':''}" data-q="${esc((row.name+' '+row.source+' '+row.type+' '+v64mechanics(row)).toLowerCase())}"><div class="v64split"><div><b>${esc(row.name)}</b> <span class="pill">${row.cost} XP</span> <span class="pill">${esc(row.type)}</span> <span class="pill">${row.rank?`Rank ${row.rank}`:'Chapter'}</span></div><button class="btn ${!lock?'primary':''}" data-v64buy="${i}" ${lock?'disabled':''}>${bought?'OWNED':'PURCHASE'}</button></div><div class="small">${esc(row.source)}${row.prereq?` · Prerequisite: ${esc(row.prereq)}`:''}</div><div class="v64tiny">${esc(v64mechanics(row))}</div>${note?`<div class="v64tiny">${esc(note)}</div>`:''}</div>`}).join('')}</div></div>
 <div class="card"><h2>Advance History & Refunds</h2><p class="small">New v6.4 purchases are reversible. Refunds return XP and reverse the mechanical state the app changed. Older imported records remain preserved but are not auto-refunded.</p>${ch.advances.length?ch.advances.map((a,i)=>{let n=typeof a==='string'?a:(a.displayName||a.name);return `<div class="listrow"><div class="v64split"><div><b>${esc(n)}</b>${typeof a==='object'&&a.cost!==undefined?` <span class="pill">${a.cost} XP</span>`:''}<div class="small">${typeof a==='object'?esc(a.source||a.scope||'Imported'):'Imported legacy record'}</div></div>${typeof a==='object'&&a.refundable?`<button class="btn" data-v64refund="${i}">Refund</button>`:'<span class="v64tiny">Legacy</span>'}</div></div>`}).join(''):'<div class="empty">No purchased Advances yet.</div>'}<button id="v64elite" class="btn">+ Elite / GM Advance</button></div>`;
 document.getElementById('v64awardBtn').onclick=()=>{let n=+document.getElementById('v64award').value||0;if(n>0){v64awardXP(ch,n,document.getElementById('v64awardNote').value||'XP award');save();render()}};
 document.querySelectorAll('[data-v64scope]').forEach(b=>b.onclick=()=>{ch.advanceScope=b.dataset.v64scope;save();render()});document.getElementById('v64advSearch').oninput=e=>document.querySelectorAll('.v64adv').forEach(x=>x.style.display=x.dataset.q.includes(e.target.value.toLowerCase())?'':'none');
 document.querySelectorAll('[data-v64char]').forEach(b=>b.onclick=()=>{let k=b.dataset.v64char,l=ch.charAdvances[k]||0,cost=costs[k][l];if(cost===undefined||ch.xp.available<cost)return;ch.xp.available-=cost;ch.xp.spent+=cost;ch.charAdvances[k]=l+1;ch.chars[k]+=5;let rec={id:v64uid('adv'),name:`${k} +5 (${['Simple','Intermediate','Trained','Expert'][l]})`,displayName:`${k} +5 (${['Simple','Intermediate','Trained','Expert'][l]})`,cost,type:'Characteristic',charKey:k,stage:l+1,source:v64specName(ch.speciality),scope:'characteristic',purchaseKey:`char:${k}:${l}`,refundable:true};ch.advances.push(rec);v64ledger(ch,-cost,'purchase',rec.name,rec.id);save();render()});
 document.querySelectorAll('[data-v64buy]').forEach(b=>b.onclick=()=>{let row=rows[+b.dataset.v64buy];v64askChoice(row,choice=>{let pr=v64prereq(ch,row.prereq);if(!pr.ok)return;modal(`<h2>Purchase ${esc(row.name)}?</h2><p><b>${row.cost} XP</b> · ${esc(row.source)}</p><p>${esc(v64mechanics(row))}</p>${choice?`<p><b>Choice:</b> ${esc(choice)}</p>`:''}<button class="btn primary" id="v64confirmRow" style="width:100%">CONFIRM</button>`);document.getElementById('v64confirmRow').onclick=()=>{if(v64applyRow(ch,row,choice)){closeModal();render()}}})});

 document.getElementById('v64elite').onclick=()=>{modal(`<h2>Elite / GM Advance</h2><p>The Core base cost is 750 XP; the GM may change cost, prerequisites, or require in-character justification.</p><label>Name</label><input id="v64en"><label>XP Cost</label><input id="v64ec" type="number" value="750"><label>Mechanical effect / justification</label><textarea id="v64ee"></textarea><button id="v64eb" class="btn primary" style="width:100%">PURCHASE</button>`);document.getElementById('v64eb').onclick=()=>{let cost=Math.max(0,+document.getElementById('v64ec').value||750);if(ch.xp.available<cost)return;let name=document.getElementById('v64en').value||'Elite Advance',note=document.getElementById('v64ee').value;ch.xp.available-=cost;ch.xp.spent+=cost;let rec={id:v64uid('adv'),name,displayName:name,cost,type:'Elite',source:'GM / Elite Advance',scope:'elite',purchaseKey:v64uid('elite'),refundable:true,mechanics:note};ch.advances.push(rec);ch.advanceEffects.push({id:rec.id,name,mechanics:note});v64ledger(ch,-cost,'purchase',name,rec.id);save();closeModal();render()}};
};

// Psychic Powers: enforce the Librarian's available Psychic Power Advance slots and actual power XP costs.
function v64powerSlots(ch){let r=v64rank(ch);return (r>=1?2:0)+(r>=2?1:0)+(r>=4?1:0)+(r>=6?1:0)+(r>=8?1:0)}
function v64powerAllowed(ch,p){let cn=v64chapterName(ch.chapter),chapDisc=['Blood Angels','Dark Angels','Space Wolves','Storm Wardens','Ultramarines','Raven Guard'];return !chapDisc.includes(p.discipline)||p.discipline===cn}
function v64powerPrereq(ch,p){return v64prereq(ch,p.prereq||'')}
function v64learnPower(ch,p){if(ch.speciality!=='librarian'||ch.powers.includes(p.name))return;let used=ch.powerPurchases.length,slots=v64powerSlots(ch),pr=v64powerPrereq(ch,p),cost=Number(p.xp)||0;if(used>=slots||!pr.ok||ch.xp.available<cost)return;ch.xp.available-=cost;ch.xp.spent+=cost;ch.powers.push(p.name);let rec={id:v64uid('power'),name:p.name,cost,source:p.source||'Psychic Powers',refundable:true};ch.powerPurchases.push(rec);v64ledger(ch,-cost,'psychic power',p.name,rec.id);save();render()}
function v64refundPower(ch,id){let i=ch.powerPurchases.findIndex(x=>x.id===id);if(i<0)return;let rec=ch.powerPurchases[i];if(!confirm(`Refund ${rec.name} for ${rec.cost} XP?`))return;ch.xp.available+=rec.cost;ch.xp.spent=Math.max(0,ch.xp.spent-rec.cost);ch.powers=ch.powers.filter(x=>x!==rec.name);ch.powerPurchases.splice(i,1);v64ledger(ch,rec.cost,'refund psychic power',rec.name,rec.id);save();render()}
