/* ==========================================================================
   v2.0.2 APPEARANCE SYSTEM
   Light = Core Rulebook parchment.
   Dark  = cold iron Watch Fortress.
   ========================================================================== */

:root,
html[data-theme="book"]{
  color-scheme: light;
  --bg:#b9ac91;
  --bg-deep:#8c816b;
  --paper:#e7dcc3;
  --paper-2:#d8c9aa;
  --panel:#eee4cf;
  --panel-2:#ddd0b6;
  --panel-3:#cdbd9f;
  --ink:#1b1916;
  --text:#211e19;
  --muted:#665d4f;
  --faint:#877b68;
  --line:#8b7d67;
  --line-strong:#4f483d;
  --accent:#6f1d22;
  --accent-2:#9c7a3d;
  --danger:#8e2d32;
  --good:#4d6548;
  --steel:#4d4f4d;
  --steel-2:#74756f;
  --tab:#d8ccb4;
  --shadow:rgba(40,31,20,.20);
}

html[data-theme="night"]{
  color-scheme: dark;
  --bg:#070809;
  --bg-deep:#020303;
  --paper:#111416;
  --paper-2:#15191c;
  --panel:#0d1012;
  --panel-2:#14181b;
  --panel-3:#1b2024;
  --ink:#e5e7e7;
  --text:#e7e9e9;
  --muted:#a7adb0;
  --faint:#71797d;
  --line:#3f484d;
  --line-strong:#7f898e;
  --accent:#8e252b;
  --accent-2:#a8b1b5;
  --danger:#c45d62;
  --good:#9aac94;
  --steel:#181d20;
  --steel-2:#2b3236;
  --tab:#15191c;
  --shadow:rgba(0,0,0,.55);
}

html[data-theme="book"] body{
  background:
    linear-gradient(rgba(69,53,32,.032) 1px, transparent 1px),
    linear-gradient(90deg, rgba(69,53,32,.024) 1px, transparent 1px),
    radial-gradient(circle at 50% -8%, rgba(255,248,224,.42), transparent 34%),
    linear-gradient(180deg,#c7baa0 0%,#b6aa90 100%);
  background-size:28px 28px,28px 28px,auto,auto;
  color:var(--text);
}

html[data-theme="night"] body{
  background:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.01) 1px, transparent 1px),
    radial-gradient(circle at 50% -8%, rgba(105,119,126,.10), transparent 35%),
    linear-gradient(180deg,#0a0c0e 0%,#050607 72%,#020303 100%);
  background-size:30px 30px,30px 30px,auto,auto;
  color:var(--text);
}

/* Common panels adopt theme variables cleanly. */
html[data-theme="book"] .topbar,
html[data-theme="book"] .bottom-nav,
html[data-theme="book"] .modal,
html[data-theme="book"] .card,
html[data-theme="book"] .panel,
html[data-theme="book"] .list-item,
html[data-theme="book"] .sheet,
html[data-theme="book"] .record-card{
  background:linear-gradient(165deg,var(--panel),var(--panel-2));
  color:var(--text);
  border-color:var(--line);
  box-shadow:0 8px 24px var(--shadow);
}

html[data-theme="night"] .topbar,
html[data-theme="night"] .bottom-nav,
html[data-theme="night"] .modal,
html[data-theme="night"] .card,
html[data-theme="night"] .panel,
html[data-theme="night"] .list-item,
html[data-theme="night"] .sheet,
html[data-theme="night"] .record-card{
  background:
    linear-gradient(180deg,rgba(255,255,255,.018),transparent 28%),
    linear-gradient(160deg,var(--panel),var(--panel-2));
  color:var(--text);
  border-color:var(--line);
  box-shadow:0 10px 30px var(--shadow);
}

/* Inputs and controls */
html[data-theme="book"] input,
html[data-theme="book"] textarea,
html[data-theme="book"] select,
html[data-theme="book"] .input,
html[data-theme="book"] .textarea,
html[data-theme="book"] .select{
  background:#f2e8d2!important;
  color:#1c1914!important;
  border-color:#8d7f68!important;
}
html[data-theme="night"] input,
html[data-theme="night"] textarea,
html[data-theme="night"] select,
html[data-theme="night"] .input,
html[data-theme="night"] .textarea,
html[data-theme="night"] .select{
  background:#080a0b!important;
  color:#e7e9e9!important;
  border-color:#41494e!important;
}

/* Buttons */
html[data-theme="book"] .btn,
html[data-theme="book"] button{
  border-color:#7f715d;
}
html[data-theme="night"] .btn,
html[data-theme="night"] button{
  border-color:#485158;
}
html[data-theme="book"] .btn.primary{
  background:#2b2924;
  color:#f2ead8;
  border-color:#2b2924;
}
html[data-theme="night"] .btn.primary{
  background:linear-gradient(180deg,#d8dde0,#9fa9ae);
  color:#090a0b;
  border-color:#c5cdd1;
}

/* Core-book vertical chapter tabs and trim. */
html[data-theme="book"] .chapter-tab,
html[data-theme="book"] .side-tab,
html[data-theme="book"] .rail-label{
  background:linear-gradient(180deg,#ece4d1,#c9baa0);
  color:#211f1a;
  border-color:#777062;
}
html[data-theme="night"] .chapter-tab,
html[data-theme="night"] .side-tab,
html[data-theme="night"] .rail-label{
  background:linear-gradient(180deg,#272d31,#0c0f11);
  color:#d9dddf;
  border-color:#596268;
}

/* Cold iron adds subtle riveted steel bands instead of parchment framing. */
html[data-theme="night"] .app-shell::before,
html[data-theme="night"] main::before{
  background:linear-gradient(90deg,#090b0c,#2a3034 50%,#090b0c);
  opacity:.55;
}
html[data-theme="night"] .eyebrow,
html[data-theme="night"] .section-kicker{
  color:#aeb7bb;
}
html[data-theme="book"] .eyebrow,
html[data-theme="book"] .section-kicker{
  color:#6a5d4b;
}

/* Appearance chooser */
.appearance-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.appearance-choice{
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 12px;
  background:var(--panel-2);
  color:var(--text);
  text-align:left;
}
.appearance-choice.active{
  box-shadow:inset 0 0 0 2px var(--accent-2);
}
.appearance-swatch{
  height:44px;
  border-radius:6px;
  margin-bottom:9px;
  border:1px solid var(--line);
}
.appearance-swatch.parchment{
  background:linear-gradient(145deg,#efe5cd,#c7b594);
}
.appearance-swatch.iron{
  background:linear-gradient(145deg,#242a2e,#060708);
}
.appearance-choice small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  line-height:1.35;
}

</style>
</head>

const VERSION='2.0.0'; const KEY='deathwatch_companion_core_v2';
const C=['WS','BS','S','T','Ag','Int','Per','WP','Fel'];
const names={WS:'Weapon Skill',BS:'Ballistic Skill',S:'Strength',T:'Toughness',Ag:'Agility',Int:'Intelligence',Per:'Perception',WP:'Willpower',Fel:'Fellowship'};
const stdIssue=['Astartes Power Armour','Astartes Bolt Pistol','3 Astartes Frag Grenades','3 Astartes Krak Grenades','Astartes Combat Knife','Repair Cement','Chapter Trapping'];
function fresh(){return {version:VERSION,theme:'book',characters:[],homebrew:{chapters:[],specialities:[],skills:[],weapons:[],armour:[],psychic:[],talents:[],traits:[],abilities:[],gear:[],advances:[],adversaries:[]},missions:[],settings:{allowCoreEdit:false},activeCharacter:null};}
let state=load(),view='dashboard',builder=null;
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&s.version?Object.assign(fresh(),s):fresh()}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function roll(n){return Math.floor(Math.random()*n)+1}function d100(){return roll(100)}function d10(){return roll(10)}function d5(){return roll(5)}
function bonus(v){return Math.floor((Number(v)||0)/10)}
function all(cat){return [...(CORE[cat]||[]),...(state.homebrew[cat]||[])]}
function sourceBadge(x){return `<span class="pill ${x.source==='Homebrew'?'homebrew':'core'}">${esc(x.source||'Core')}</span>`}
function nav(){const n=[['dashboard','Watch'],['characters','Brothers'],['builder','Create'],['mission','Mission'],['armoury','Armoury'],['librarium','Librarium'],['gm','GM'],['settings','Menu']];document.getElementById('nav').innerHTML=n.map(([v,l])=>`<button data-nav="${v}" class="${view===v?'active':''}">${l}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render()})}
function render(){document.documentElement.dataset.theme=state.theme;nav();({dashboard,characters,builder:builderView,mission,armoury,librarium,gm,settings}[view]||dashboard)()}
function set(html){document.getElementById('app').innerHTML=html}
function modal(title,body,onready){let b=document.createElement('div');b.className='modalback';b.innerHTML=`<div class="modal"><div class="row between"><h2>${esc(title)}</h2><button class="btn" data-close>×</button></div>${body}</div>`;document.body.appendChild(b);b.querySelector('[data-close]').onclick=()=>b.remove();if(onready)onready(b,b.querySelector('.modal'));return b}
function dashboard(){let ch=state.characters.find(x=>x.id===state.activeCharacter)||state.characters[0];set(`<section class="hero"><div class="kicker">Watch Fortress Archive</div><h1>Deathwatch</h1><p>A single-device companion built around the Core Rulebook's character, armoury, psychic, mission and adversary structures. Canonical Core data is protected; clone anything into Homebrew when you want to change it.</p></section><div class="grid g3"><div class="card"><div class="kicker">Battle-Brothers</div><div class="stat">${state.characters.length}</div><button class="btn" data-go="characters">Open Roster</button></div><div class="card"><div class="kicker">Core Armoury</div><div class="stat">${CORE.weapons.length}</div><div class="small muted">seeded weapon profiles</div><button class="btn" data-go="armoury">Open Armoury</button></div><div class="card"><div class="kicker">Homebrew Entries</div><div class="stat">${Object.values(state.homebrew).reduce((a,x)=>a+x.length,0)}</div><div class="small muted">editable records</div></div></div><div class="card" style="margin-top:12px"><div class="row between"><div><div class="kicker">Current Mission</div><b>${esc(state.missions[0]?.name||'No mission prepared')}</b><div class="small muted">Cohesion ${state.missions[0]?.cohesionCurrent||0}/${state.missions[0]?.cohesionMax||0} • Requisition ${state.missions[0]?.requisition||0}</div></div><button class="btn" data-go="mission">Open Mission</button></div></div>${ch?characterSummary(ch):`<div class="callout" style="margin-top:14px"><b>No active Battle-Brother.</b> Create one with the Core builder or add a freeform sheet.</div>`}`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()})}
function characterSummary(c){return `<section class="card" style="margin-top:14px"><div class="row between"><div><div class="kicker">Active Battle-Brother</div><h2>${esc(c.name||'Unnamed')}</h2><div class="muted">${esc(c.chapter||'No Chapter')} • ${esc(c.speciality||'No Speciality')}</div></div><button class="btn" data-open-char="${c.id}">Open Sheet</button></div><div class="charstats">${C.map(k=>`<div class="charstat"><span>${k}</span><b>${c.stats?.[k]??30}</b><small>${bonus(c.stats?.[k])}</small></div>`).join('')}</div><div class="grid g3" style="margin-top:10px"><div class="card"><div class="kicker">Wounds</div><b>${c.damage||0} Damage / ${c.wounds||20} Wounds</b></div><div class="card"><div class="kicker">Fate</div><b>${c.fateCurrent??c.fate??3} / ${c.fate??3}</b></div><div class="card"><div class="kicker">XP / Renown</div><b>${c.xpSpent||12000} XP</b><div class="tiny muted">${c.xpUnspent||0} unspent • Renown ${c.renown||0}</div></div></div></section>`}
function characters(){set(`<div class="row between"><div><div class="kicker">Kill-team Roster</div><h1>Battle-Brothers</h1></div><div class="row"><button class="btn primary" id="newCore">Core Builder</button><button class="btn" id="newFree">Freeform</button></div></div><div class="list">${state.characters.length?state.characters.map(c=>`<div class="item"><div class="row between"><div><div class="item-title">${esc(c.name||'Unnamed')}</div><div class="item-meta">${esc(c.chapter||'Custom')} • ${esc(c.speciality||'Unassigned')} • ${c.wounds||0} Wounds</div></div><div class="row"><button class="btn smallb" data-use="${c.id}">Use</button><button class="btn smallb" data-open="${c.id}">Open</button><button class="btn smallb danger" data-del="${c.id}">Delete</button></div></div></div>`).join(''):'<div class="empty">No Battle-Brothers in the Watch yet.</div>'}</div>`);document.getElementById('newCore').onclick=()=>{startBuilder();view='builder';render()};document.getElementById('newFree').onclick=()=>editCharacter(null);document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{state.activeCharacter=b.dataset.use;save();toast('Active Battle-Brother changed')});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCharacter(b.dataset.open));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this character?')){state.characters=state.characters.filter(x=>x.id!==b.dataset.del);if(state.activeCharacter===b.dataset.del)state.activeCharacter=null;save();characters()}})}
function editCharacter(c){c=c?JSON.parse(JSON.stringify(c)):{id:uid('char'),name:'',chapter:'',speciality:'',stats:Object.fromEntries(C.map(k=>[k,30])),wounds:20,fate:3,fateCurrent:3,damage:0,xpSpent:12000,xpUnspent:0,renown:0,rank:1,advances:[],skills:[],talents:[],traits:[],abilities:[],gear:[],weapons:[],armour:[],notes:''};modal(c.name?'Edit Character':'New Freeform Character',`<div class="grid g2"><div class="field"><label>Name</label><input id="ecName" class="input" value="${esc(c.name)}"></div><div class="field"><label>Chapter</label><input id="ecChapter" class="input" value="${esc(c.chapter)}"></div><div class="field"><label>Speciality</label><input id="ecSpec" class="input" value="${esc(c.speciality)}"></div><div class="field"><label>Wounds</label><input id="ecWounds" class="input" type="number" value="${c.wounds}"></div><div class="field"><label>Fate</label><input id="ecFate" class="input" type="number" value="${c.fate||3}"></div><div class="field"><label>XP Spent</label><input id="ecXP" class="input" type="number" value="${c.xpSpent||12000}"></div><div class="field"><label>XP Unspent</label><input id="ecXPU" class="input" type="number" value="${c.xpUnspent||0}"></div><div class="field"><label>Renown</label><input id="ecRenown" class="input" type="number" value="${c.renown||0}"></div></div><div class="charstats">${C.map(k=>`<div class="field"><label>${k}</label><input class="input ecStat" data-k="${k}" type="number" value="${c.stats[k]}"></div>`).join('')}</div><div class="field"><label>Notes</label><textarea id="ecNotes" class="textarea">${esc(c.notes)}</textarea></div><div class="row"><button class="btn primary" id="ecSave">Save</button></div>`,(b)=>{b.querySelector('#ecSave').onclick=()=>{c.name=b.querySelector('#ecName').value.trim();c.chapter=b.querySelector('#ecChapter').value.trim();c.speciality=b.querySelector('#ecSpec').value.trim();c.wounds=+b.querySelector('#ecWounds').value||20;c.fate=+b.querySelector('#ecFate').value||3;c.fateCurrent=Math.min(c.fate,c.fateCurrent??c.fate);c.xpSpent=+b.querySelector('#ecXP').value||12000;c.xpUnspent=+b.querySelector('#ecXPU').value||0;c.renown=+b.querySelector('#ecRenown').value||0;c.notes=b.querySelector('#ecNotes').value;b.querySelectorAll('.ecStat').forEach(x=>c.stats[x.dataset.k]=+x.value||0);let i=state.characters.findIndex(x=>x.id===c.id);if(i>=0)state.characters[i]=c;else state.characters.push(c);state.activeCharacter=c.id;save();b.remove();characters()}})}
function openCharacter(id){let c=state.characters.find(x=>x.id===id);if(!c)return;state.activeCharacter=id;save();set(`<div class="row between"><div><div class="kicker">Character Sheet</div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.chapter)} • ${esc(c.speciality)}</div></div><div class="row"><button class="btn" id="editChar">Edit</button><button class="btn" id="backRoster">Roster</button></div></div><div class="charstats">${C.map(k=>`<div class="charstat"><span>${k}</span><b>${c.stats[k]}</b><small>Bonus ${bonus(c.stats[k])}</small></div>`).join('')}</div><div class="grid g3" style="margin-top:12px"><div class="card"><div class="kicker">Damage / Wounds</div><div class="row"><button class="btn smallb" id="dmgMinus">−</button><b id="dmgRead">${c.damage||0} / ${c.wounds}</b><button class="btn smallb" id="dmgPlus">+</button></div></div><div class="card"><div class="kicker">Fate</div><div class="row"><button class="btn smallb" id="fateMinus">−</button><b id="fateRead">${c.fateCurrent??c.fate} / ${c.fate}</b><button class="btn smallb" id="fatePlus">+</button></div></div><div class="card"><div class="kicker">Movement</div><b>${movement(c).join(' / ')}</b><div class="tiny muted">Half / Full / Charge / Run</div></div><div class="card"><div class="kicker">XP / Renown</div><b>${c.xpSpent||12000} XP</b><div class="tiny muted">${c.xpUnspent||0} unspent • Renown ${c.renown||0}</div></div></div><div class="grid g2" style="margin-top:12px"><div class="card"><h3>Skills</h3>${tags(c.skills)}</div><div class="card"><h3>Talents & Traits</h3>${tags([...(c.talents||[]),...(c.traits||[])])}</div><div class="card"><h3>Abilities</h3>${tags(c.abilities)}</div><div class="card"><h3>Wargear</h3>${tags([...(c.gear||[]),...(c.weapons||[]),...(c.armour||[])])}</div><div class="card"><h3>Advances</h3>${tags(c.advances||[])}</div></div><div class="card" style="margin-top:12px"><h3>Notes</h3><div class="small">${esc(c.notes||'—').replace(/\n/g,'<br>')}</div></div>`);document.getElementById('editChar').onclick=()=>editCharacter(c);document.getElementById('backRoster').onclick=()=>{view='characters';render()};document.getElementById('dmgMinus').onclick=()=>{c.damage=Math.max(0,(c.damage||0)-1);save();openCharacter(id)};document.getElementById('dmgPlus').onclick=()=>{c.damage=(c.damage||0)+1;save();openCharacter(id)};document.getElementById('fateMinus').onclick=()=>{c.fateCurrent=Math.max(0,(c.fateCurrent??c.fate)-1);save();openCharacter(id)};document.getElementById('fatePlus').onclick=()=>{c.fateCurrent=Math.min(c.fate,(c.fateCurrent??c.fate)+1);save();openCharacter(id)}}
function tags(a=[]){return a.length?a.map(x=>`<span class="pill">${esc(typeof x==='string'?x:x.name)}</span>`).join(' '):'<span class="muted tiny">None recorded</span>'}
function movement(c){let ab=bonus(c.stats?.Ag)+((c.armour||[]).some(x=>String(x).toLowerCase().includes('power armour'))?1:0);return [ab,ab*2,ab*3,ab*6]}
function startBuilder(){builder={step:0,name:'',method:'roll',base:Object.fromEntries(C.map(k=>[k,null])),rerollUsed:false,chapter:'',chapterChoices:[],speciality:'',ability:'',woundsRoll:null,fateRoll:null,life:{demeanour:'',past:'',armourHistory:'',appearance:'',notes:''},psyPowers:[]}}
function builderView(){if(!builder)startBuilder();const labels=['Characteristics','Chapter','Speciality','Wounds & XP','Equipment','Life','Review'];set(`<div class="row between"><div><div class="kicker">Chapter I</div><h1>Character Creation</h1></div><button class="btn" id="restartBuilder">Restart</button></div><div class="steps">${labels.map((x,i)=>`<button class="step ${builder.step===i?'active':''}" data-step="${i}">${i+1}. ${x}</button>`).join('')}</div><div class="builderpane" id="bp">${buildStep()}</div><div class="row between" style="margin-top:14px"><button class="btn" id="prevStep" ${builder.step===0?'disabled':''}>Previous</button><button class="btn primary" id="nextStep">${builder.step===6?'Create Battle-Brother':'Next'}</button></div>`);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{captureBuilder();builder.step=+b.dataset.step;builderView()});document.getElementById('restartBuilder').onclick=()=>{if(confirm('Restart character creation?')){startBuilder();builderView()}};document.getElementById('prevStep').onclick=()=>{captureBuilder();builder.step=Math.max(0,builder.step-1);builderView()};document.getElementById('nextStep').onclick=()=>{captureBuilder();if(builder.step<6){builder.step++;builderView()}else finalizeBuilder()};wireBuilder()}
function buildStep(){let s=builder.step;if(s===0)return `<div class="callout"><b>Stage 1: Generate Characteristics.</b> Core method: roll 2d10 + 30 for each of nine Characteristics, with one reroll that must be kept. Alternate allocation begins at 30 and distributes 100 points, no more than +20 to one Characteristic.</div><div class="row" style="margin:10px 0"><button class="btn ${builder.method==='roll'?'primary':''}" data-method="roll">2d10 + 30</button><button class="btn ${builder.method==='points'?'primary':''}" data-method="points">100-point allocation</button><button class="btn" id="rollAll">Roll All</button></div><div class="charstats">${C.map(k=>`<div class="field"><label>${k} • ${names[k]}</label><input class="input bstat" data-k="${k}" type="number" value="${builder.base[k]??30}"><button class="btn smallb reroll" data-k="${k}" ${builder.rerollUsed?'disabled':''}>Reroll</button></div>`).join('')}</div>`;
if(s===1){let chosen=all('chapters').find(x=>x.name===builder.chapter);return `<div class="callout"><b>Stage 2: Select Chapter.</b> A Core Chapter applies its Characteristic modifiers, Solo Mode ability and Chapter Demeanour. Homebrew Chapters use the same schema.</div><div class="list">${all('chapters').map(x=>`<div class="choice ${builder.chapter===x.name?'selected':''}" data-chapter="${esc(x.name)}"><div class="row between"><b>${esc(x.name)}</b>${sourceBadge(x)}</div><div class="small">${Object.entries(x.mods||{}).map(([k,v])=>`+${v} ${k}`).join(', ')||esc(x.notes||'Variable modifiers')}</div><div class="tiny muted">Solo: ${esc(x.solo||'—')} • Demeanour: ${esc(x.demeanour||'—')} • p.${esc(x.page||'—')}</div>${x.restrictions?.length?`<div class="tiny" style="color:var(--bad)">Restrictions: ${esc(x.restrictions.join(', '))}</div>`:''}</div>`).join('')}</div>${chosen?.choiceMods?`<div class="card" style="margin-top:10px"><h3>${esc(chosen.name)} Characteristic Choices</h3><div class="small muted">Choose ${chosen.choiceMods.count} different Characteristics for +${chosen.choiceMods.amount} each.</div><div class="row" style="margin-top:8px">${C.map(k=>`<label class="pill"><input type="checkbox" class="chapterPick" value="${k}" ${builder.chapterChoices.includes(k)?'checked':''}> ${k}</label>`).join('')}</div></div>`:''}`;}
if(s===2){let ch=all('chapters').find(x=>x.name===builder.chapter);return `<div class="callout"><b>Stage 3: Select Speciality.</b> Speciality sets battlefield role, starting Skill(s), Special Ability choice and additional standard issue.</div><div class="list">${all('specialities').map(x=>{let blocked=x.restrictions?.includes(builder.chapter)||ch?.restrictions?.includes(x.name);return `<div class="choice ${builder.speciality===x.name?'selected':''}" data-spec="${esc(x.name)}" data-blocked="${blocked?'1':'0'}" style="${blocked?'opacity:.45':''}"><b>${esc(x.name)}</b><div class="small muted">${esc(x.role||'')}</div><div class="tiny">Skills: ${esc((x.startingSkills||[]).join(', ')||'None')}</div><div class="tiny">Ability choices: ${esc((x.abilityChoices||[]).join(', ')||'—')}</div>${blocked?'<div class="tiny" style="color:var(--bad)">Restricted by Chapter.</div>':''}</div>`}).join('')}</div><div class="field"><label>Special Ability Choice</label><select class="select" id="bAbility">${(all('specialities').find(x=>x.name===builder.speciality)?.abilityChoices||[]).map(a=>`<option ${builder.ability===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div>`}
if(s===3){return `<div class="callout"><b>Stage 4: Movement, Wounds, Fate, and Experience.</b> Starting Wounds are 1d5 + 18 (plus Chapter modifiers). Fate is rolled on the Core table. Power armour increases Agility Bonus by 1 for movement. Characters have a 12,000 XP baseline plus 1,000 starting XP to spend.</div><div class="grid g2"><div class="card"><h3>Wounds</h3><div class="row"><button class="btn" id="rollWounds">Roll 1d5</button><b>${builder.woundsRoll??'—'} + 18</b></div></div><div class="card"><h3>Fate</h3><div class="row"><button class="btn" id="rollFate">Roll 1d10</button><b>${builder.fateRoll??'—'} → ${fateFrom(builder.fateRoll)||'—'} Fate</b></div></div></div><div class="card" style="margin-top:10px"><b>Starting XP</b><div>12,000 XP represents pre-existing capability. The additional 1,000 XP is spendable on eligible Rank 1 General Space Marine, Chapter and Speciality Advances; Deathwatch Advances are not available to newly joined characters during this starting spend.</div></div>`}
if(s===4){let sp=all('specialities').find(x=>x.name===builder.speciality);return `<div class="callout"><b>Stage 5: Starting Equipment.</b> Every Speciality receives the common standard issue package, then adds its Speciality package.</div><div class="grid g2"><div class="card"><h3>All Specialities</h3>${tags(stdIssue)}</div><div class="card"><h3>${esc(builder.speciality||'Speciality')} Issue</h3>${tags(sp?.startingGear||[])}</div></div><div class="card" style="margin-top:10px"><div class="tiny muted">The Tactical Marine's special ammunition selection must still satisfy its Renown requirement. Homebrew gear can be added after creation from the character sheet or Armoury.</div></div>`}
if(s===5)return `<div class="callout"><b>Stage 6: Give the Character Life.</b> Record appearance, past event, armour history/quirk, personal Demeanour and name.</div><div class="grid g2"><div class="field"><label>Name</label><input class="input" id="bName" value="${esc(builder.name)}"></div><div class="field"><label>Personal Demeanour</label><input class="input" id="bDem" value="${esc(builder.life.demeanour)}"></div></div><div class="field"><label>Past Event</label><textarea class="textarea" id="bPast">${esc(builder.life.past)}</textarea></div><div class="field"><label>Power Armour History / Quirk</label><textarea class="textarea" id="bHist">${esc(builder.life.armourHistory)}</textarea></div><div class="field"><label>Appearance & Notes</label><textarea class="textarea" id="bLife">${esc(builder.life.appearance)}</textarea></div>`;
let st=finalStats();let sp=all('specialities').find(x=>x.name===builder.speciality);let ch=all('chapters').find(x=>x.name===builder.chapter);return `<div class="callout"><b>Stage 7: Review.</b> Nothing below is locked forever. After creation the sheet remains editable and any Core record can be cloned into Homebrew.</div><div class="card"><h2>${esc(builder.name||'Unnamed Battle-Brother')}</h2><div>${esc(builder.chapter||'No Chapter')} • ${esc(builder.speciality||'No Speciality')}</div><div class="charstats" style="margin-top:10px">${C.map(k=>`<div class="charstat"><span>${k}</span><b>${st[k]}</b><small>${bonus(st[k])}</small></div>`).join('')}</div></div><div class="grid g2" style="margin-top:10px"><div class="card"><h3>Chapter</h3><div>Solo Mode: ${esc(ch?.solo||'—')}</div><div>Demeanour: ${esc(ch?.demeanour||'—')}</div></div><div class="card"><h3>Speciality</h3><div>Ability: ${esc(builder.ability||'—')}</div><div>Skills: ${esc((sp?.startingSkills||[]).join(', '))}</div></div></div>`}
function wireBuilder(){document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{builder.method=b.dataset.method;if(builder.method==='points')C.forEach(k=>builder.base[k]=30);builderView()});document.getElementById('rollAll')?.addEventListener('click',()=>{C.forEach(k=>builder.base[k]=30+roll(10)+roll(10));builder.rerollUsed=false;builderView()});document.querySelectorAll('.reroll').forEach(b=>b.onclick=()=>{builder.base[b.dataset.k]=30+roll(10)+roll(10);builder.rerollUsed=true;builderView()});document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{builder.chapter=b.dataset.chapter;builder.chapterChoices=[];builderView()});document.querySelectorAll('.chapterPick').forEach(b=>b.onchange=()=>{let ch=all('chapters').find(x=>x.name===builder.chapter),max=ch?.choiceMods?.count||0;if(b.checked&&!builder.chapterChoices.includes(b.value)){if(builder.chapterChoices.length>=max){b.checked=false;return toast('Choose only '+max+' Characteristics.')}builder.chapterChoices.push(b.value)}else if(!b.checked)builder.chapterChoices=builder.chapterChoices.filter(x=>x!==b.value)});document.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>{if(b.dataset.blocked==='1')return toast('That Speciality is restricted for this Chapter.');builder.speciality=b.dataset.spec;builder.ability='';builderView()});document.getElementById('rollWounds')?.addEventListener('click',()=>{builder.woundsRoll=d5();builderView()});document.getElementById('rollFate')?.addEventListener('click',()=>{builder.fateRoll=d10();builderView()})}
function captureBuilder(){if(builder.step===0)document.querySelectorAll('.bstat').forEach(x=>builder.base[x.dataset.k]=+x.value||30);if(builder.step===2)builder.ability=document.getElementById('bAbility')?.value||builder.ability;if(builder.step===5){builder.name=document.getElementById('bName')?.value.trim()||builder.name;builder.life.demeanour=document.getElementById('bDem')?.value||'';builder.life.past=document.getElementById('bPast')?.value||'';builder.life.armourHistory=document.getElementById('bHist')?.value||'';builder.life.appearance=document.getElementById('bLife')?.value||''}}
function fateFrom(r){if(!r)return null;return r<=7?3:r<=9?4:5}
function finalStats(){let s={...builder.base};let ch=all('chapters').find(x=>x.name===builder.chapter);Object.entries(ch?.mods||{}).forEach(([k,v])=>s[k]=(s[k]||30)+v);if(ch?.choiceMods){builder.chapterChoices.slice(0,ch.choiceMods.count).forEach(k=>s[k]=(s[k]||30)+ch.choiceMods.amount)}return s}
function finalizeBuilder(){captureBuilder();let ch=all('chapters').find(x=>x.name===builder.chapter),sp=all('specialities').find(x=>x.name===builder.speciality);let wr=(builder.woundsRoll||d5())+18+(ch?.woundsBonus||0),fr=fateFrom(builder.fateRoll||d10());let c={id:uid('char'),name:builder.name||'Unnamed Battle-Brother',chapter:builder.chapter,speciality:builder.speciality,stats:finalStats(),wounds:wr,damage:0,fate:fr,fateCurrent:fr,xpSpent:12000,xpUnspent:1000,renown:0,rank:1,advances:[],skills:[...CORE.baseline.skills,...(sp?.startingSkills||[])],talents:[...CORE.baseline.talents,...(sp?.startingTalents||[]),...(ch?.bonusTalents||[])],traits:[...CORE.baseline.traits],abilities:[ch?.solo,builder.ability].filter(Boolean),gear:[...stdIssue,...(sp?.startingGear||[])],weapons:[],armour:['Astartes Power Armour'],notes:[builder.life.demeanour,builder.life.past,builder.life.armourHistory,builder.life.appearance].filter(Boolean).join('\n\n')};state.characters.push(c);state.activeCharacter=c.id;save();builder=null;view='characters';render();toast('Battle-Brother entered into the Watch')}
function mission(){let m=state.missions[0]||{id:uid('mission'),name:'Current Mission',status:'Briefing',requisition:0,renown:0,cohesionCurrent:0,cohesionMax:0,oath:'',squadLeader:'',objectives:[{tier:'Primary',text:''},{tier:'Secondary',text:''},{tier:'Tertiary',text:''}],notes:''};if(!state.missions.length){state.missions=[m];save()}set(`<div class="row between"><div><div class="kicker">Chapter VII • Kill-team Operations</div><h1>Mission & Cohesion</h1></div><button class="btn primary" id="saveMission">Save Mission</button></div><div class="callout"><b>Kill-team play.</b> Track the current Mission alongside its Requisition, Renown, squad leadership, Oath and Cohesion. Solo Mode emphasizes the individual Battle-Brother; Squad Mode spends Cohesion to enable coordinated abilities.</div><div class="grid g2" style="margin-top:12px"><div class="card"><div class="field"><label>Mission Name</label><input class="input" id="mName" value="${esc(m.name)}"></div><div class="field"><label>Status</label><select class="select" id="mStatus">${['Briefing','Active','Extraction','Complete','Failed'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid g2"><div class="field"><label>Requisition Pool</label><input class="input" type="number" id="mReq" value="${m.requisition||0}"></div><div class="field"><label>Renown Award / Note</label><input class="input" id="mRen" value="${esc(m.renown||'')}"></div></div></div><div class="card"><div class="grid g2"><div class="field"><label>Cohesion Current</label><input class="input" type="number" id="mC" value="${m.cohesionCurrent||0}"></div><div class="field"><label>Cohesion Max</label><input class="input" type="number" id="mCM" value="${m.cohesionMax||0}"></div></div><div class="field"><label>Squad Leader</label><input class="input" id="mLeader" value="${esc(m.squadLeader||'')}"></div><div class="field"><label>Oath</label><input class="input" id="mOath" value="${esc(m.oath||'')}"></div></div></div><div class="card" style="margin-top:12px"><h3>Objectives</h3>${m.objectives.map((o,i)=>`<div class="grid g2"><div class="field"><label>Tier</label><select class="select mTier" data-i="${i}">${['Primary','Secondary','Tertiary','Optional'].map(t=>`<option ${o.tier===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Objective</label><input class="input mObj" data-i="${i}" value="${esc(o.text)}"></div></div>`).join('')}<button class="btn smallb" id="addObj">Add Objective</button></div><div class="card" style="margin-top:12px"><h3>Mission Notes</h3><textarea class="textarea" id="mNotes">${esc(m.notes||'')}</textarea></div>`);function capture(){m.name=document.getElementById('mName').value.trim()||'Current Mission';m.status=document.getElementById('mStatus').value;m.requisition=+document.getElementById('mReq').value||0;m.renown=document.getElementById('mRen').value;m.cohesionCurrent=+document.getElementById('mC').value||0;m.cohesionMax=+document.getElementById('mCM').value||0;m.squadLeader=document.getElementById('mLeader').value;m.oath=document.getElementById('mOath').value;m.notes=document.getElementById('mNotes').value;document.querySelectorAll('.mObj').forEach(i=>m.objectives[+i.dataset.i].text=i.value);document.querySelectorAll('.mTier').forEach(i=>m.objectives[+i.dataset.i].tier=i.value)}document.getElementById('saveMission').onclick=()=>{capture();state.missions[0]=m;save();toast('Mission saved')};document.getElementById('addObj').onclick=()=>{capture();m.objectives.push({tier:'Optional',text:''});state.missions[0]=m;save();mission()}}
function armoury(){let filter='';set(`<div class="row between"><div><div class="kicker">Chapter V</div><h1>Armoury</h1></div><button class="btn primary" id="addWeapon">Add Homebrew Weapon</button></div><div class="callout"><b>Core weapon schema:</b> Name, Class, Range, Rate of Fire, Damage, Penetration, Clip, Reload, Special Qualities, Weight, Requisition and Renown. Core records stay read-only; Clone creates an editable Homebrew copy.</div><div class="row" style="margin:10px 0"><input class="input" id="armSearch" placeholder="Search weapons..." style="flex:1"><select class="select" id="armKind" style="max-width:180px"><option>All</option><option>Ranged</option><option>Melee</option></select></div><div id="weaponTable"></div><h2>Armour</h2><div class="list">${all('armour').map(a=>`<div class="item"><div class="row between"><div><div class="item-title">${esc(a.name)}</div><div class="item-meta">${esc(a.type)} • p.${esc(a.page||'—')} ${sourceBadge(a)}</div></div><button class="btn smallb" data-edit-arm="${a.id}">${a.source==='Homebrew'?'Edit':'Clone'}</button></div><div class="tiny">${Object.entries(a.ap||{}).map(([k,v])=>`${k}: ${v}`).join(' • ')}</div>${tags(a.qualities)}</div>`).join('')}</div>`);function draw(){let q=(document.getElementById('armSearch').value||'').toLowerCase(),k=document.getElementById('armKind').value;let arr=all('weapons').filter(w=>(k==='All'||w.kind===k)&&JSON.stringify(w).toLowerCase().includes(q));document.getElementById('weaponTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Class</th><th>Range</th><th>RoF</th><th>Damage</th><th>Pen</th><th>Clip</th><th>Rld</th><th>Special</th><th>Req</th><th>Renown</th><th></th></tr></thead><tbody>${arr.map(w=>`<tr><td><b>${esc(w.name)}</b><div>${sourceBadge(w)} p.${esc(w.page||'—')}</div></td><td>${esc(w.class||'')}</td><td>${esc(w.range||'—')}</td><td>${esc(w.rof||'—')}</td><td>${esc(w.damage||'')}</td><td>${w.pen??'—'}</td><td>${w.clip??'—'}</td><td>${esc(w.reload||'—')}</td><td>${esc(w.special||'—')}</td><td>${esc(w.req||'—')}</td><td>${esc(w.renown||'—')}</td><td><button class="btn smallb" data-wep="${w.id}">${w.source==='Homebrew'?'Edit':'Clone'}</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-wep]').forEach(b=>b.onclick=()=>editWeapon(all('weapons').find(x=>x.id===b.dataset.wep)))}draw();document.getElementById('armSearch').oninput=draw;document.getElementById('armKind').onchange=draw;document.getElementById('addWeapon').onclick=()=>editWeapon(null);document.querySelectorAll('[data-edit-arm]').forEach(b=>b.onclick=()=>editArmour(all('armour').find(x=>x.id===b.dataset.editArm)))}
function editWeapon(w){let x=w?JSON.parse(JSON.stringify(w)):{id:uid('hw'),name:'',kind:'Ranged',class:'Basic',range:'',rof:'',damage:'',pen:0,clip:0,reload:'',special:'',weight:'',req:'',renown:'',page:'Homebrew',source:'Homebrew'};if(w&&w.source!=='Homebrew'){x.id=uid('hw');x.name+=' (Homebrew)';x.source='Homebrew'}modal(w?'Weapon Record':'New Homebrew Weapon',`${['name','kind','class','range','rof','damage','pen','clip','reload','special','weight','req','renown'].map(k=>`<div class="field"><label>${k}</label><input class="input ew" data-k="${k}" value="${esc(x[k]??'')}"></div>`).join('')}<div class="row"><button class="btn primary" id="saveW">Save Homebrew</button>${w?.source==='Homebrew'?'<button class="btn danger" id="delW">Delete</button>':''}</div>`,b=>{b.querySelector('#saveW').onclick=()=>{b.querySelectorAll('.ew').forEach(i=>x[i.dataset.k]=['pen','clip'].includes(i.dataset.k)?(+i.value||0):i.value);let j=state.homebrew.weapons.findIndex(y=>y.id===x.id);if(j>=0)state.homebrew.weapons[j]=x;else state.homebrew.weapons.push(x);save();b.remove();armoury()};b.querySelector('#delW')?.addEventListener('click',()=>{state.homebrew.weapons=state.homebrew.weapons.filter(y=>y.id!==x.id);save();b.remove();armoury()})})}
function editArmour(a){let x=a?JSON.parse(JSON.stringify(a)):{id:uid('ha'),name:'',type:'Armour',ap:{Head:0,'Left Arm':0,'Right Arm':0,Body:0,'Left Leg':0,'Right Leg':0},qualities:[],source:'Homebrew'};if(a&&a.source!=='Homebrew'){x.id=uid('ha');x.name+=' (Homebrew)';x.source='Homebrew'}modal('Armour Record',`<div class="field"><label>Name</label><input class="input" id="aName" value="${esc(x.name)}"></div><div class="grid g2">${Object.keys(x.ap).map(k=>`<div class="field"><label>${k}</label><input class="input ap" data-k="${k}" type="number" value="${x.ap[k]}"></div>`).join('')}</div><div class="field"><label>Qualities / notes (one per line)</label><textarea class="textarea" id="aQ">${esc((x.qualities||[]).join('\n'))}</textarea></div><button class="btn primary" id="aSave">Save Homebrew</button>`,b=>{b.querySelector('#aSave').onclick=()=>{x.name=b.querySelector('#aName').value;b.querySelectorAll('.ap').forEach(i=>x.ap[i.dataset.k]=+i.value||0);x.qualities=b.querySelector('#aQ').value.split('\n').map(s=>s.trim()).filter(Boolean);let j=state.homebrew.armour.findIndex(y=>y.id===x.id);if(j>=0)state.homebrew.armour[j]=x;else state.homebrew.armour.push(x);save();b.remove();armoury()}})}
function librarium(){set(`<div class="row between"><div><div class="kicker">Data Librarium</div><h1>Rules & Abilities</h1></div><button class="btn primary" id="addLib">Add Homebrew Entry</button></div><div class="row"><input class="input" id="libQ" placeholder="Search names, fields, page references..." style="flex:1"><select class="select" id="libCat" style="max-width:200px"><option>All</option><option>Skills</option><option>Psychic Powers</option><option>Chapters</option><option>Specialities</option><option>Talents</option><option>Traits</option><option>Abilities</option><option>Gear</option><option>Advances</option></select></div><div id="libList" style="margin-top:12px"></div>`);function draw(){let cat=document.getElementById('libCat').value,q=document.getElementById('libQ').value.toLowerCase(),arr=[];if(cat==='All'||cat==='Skills')arr.push(...all('skills').map(x=>({...x,_cat:'Skill'})));if(cat==='All'||cat==='Psychic Powers')arr.push(...all('psychic').map(x=>({...x,_cat:'Psychic Power'})));if(cat==='All'||cat==='Chapters')arr.push(...all('chapters').map(x=>({...x,_cat:'Chapter'})));if(cat==='All'||cat==='Specialities')arr.push(...all('specialities').map(x=>({...x,_cat:'Speciality'})));for(const [label,key] of [['Talents','talents'],['Traits','traits'],['Abilities','abilities'],['Gear','gear'],['Advances','advances']])if(cat==='All'||cat===label)arr.push(...state.homebrew[key].map(x=>({...x,_cat:label.slice(0,-1)})));arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('libList').innerHTML=`<div class="small muted">${arr.length} records</div><div class="list">${arr.map(x=>`<div class="item"><div class="row between"><div><div class="item-title">${esc(x.name)}</div><div class="item-meta">${esc(x._cat)} • p.${esc(x.page||'—')} ${sourceBadge(x)}</div></div><button class="btn smallb" data-lib="${esc(x._cat)}|${x.id}">${x.source==='Homebrew'?'Edit':'Clone'}</button></div><div class="small">${esc(libSummary(x))}</div></div>`).join('')||'<div class="empty">No matching records.</div>'}</div>`;document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{let [c,id]=b.dataset.lib.split('|');let map={Skill:'skills','Psychic Power':'psychic',Chapter:'chapters',Speciality:'specialities',Talent:'talents',Trait:'traits',Ability:'abilities',Gear:'gear',Advance:'advances'};editGeneric(map[c],all(map[c]).find(x=>x.id===id))})}document.getElementById('libQ').oninput=draw;document.getElementById('libCat').onchange=draw;document.getElementById('addLib').onclick=()=>editGeneric('abilities',null);draw()}
function libSummary(x){if(x.type&&x.characteristic)return `${x.type} • ${x.characteristic} • ${x.descriptor||''}`;if(x.discipline)return `${x.discipline} • ${x.action} • Range ${x.range} • Sustained ${x.sustained}`;if(x.solo)return `Solo Mode: ${x.solo} • Demeanour: ${x.demeanour}`;if(x.role)return x.role;return x.notes||x.description||''}
function editGeneric(cat,obj){let x=obj?JSON.parse(JSON.stringify(obj)):{id:uid('hb'),name:'',notes:'',source:'Homebrew',page:'Homebrew'};if(obj&&obj.source!=='Homebrew'){x.id=uid('hb');x.name+=' (Homebrew)';x.source='Homebrew'}modal('Homebrew Record',`<div class="field"><label>Category</label><select class="select" id="gCat">${['chapters','specialities','skills','psychic','talents','traits','abilities','gear','advances'].map(k=>`<option ${k===cat?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Name</label><input class="input" id="gName" value="${esc(x.name)}"></div><div class="field"><label>Structured JSON fields</label><textarea class="textarea" id="gJson" style="min-height:220px">${esc(JSON.stringify(x,null,2))}</textarea></div><div class="callout tiny">Advanced editor: keep an id, name, source:'Homebrew', and any fields useful to that category. This deliberately leaves the framework open for supplements and house rules.</div><button class="btn primary" id="gSave">Save</button>`,b=>{b.querySelector('#gSave').onclick=()=>{try{let n=JSON.parse(b.querySelector('#gJson').value);n.name=b.querySelector('#gName').value.trim()||n.name;n.source='Homebrew';let c=b.querySelector('#gCat').value;if(!state.homebrew[c])state.homebrew[c]=[];let j=state.homebrew[c].findIndex(y=>y.id===n.id);if(j>=0)state.homebrew[c][j]=n;else state.homebrew[c].push(n);save();b.remove();librarium()}catch(e){alert('JSON error: '+e.message)}}})}
function gm(){set(`<div class="row between"><div><div class="kicker">Chapter XIII</div><h1>GM Tools</h1></div><button class="btn primary" id="newAdv">New Adversary</button></div><div class="grid g3">${CORE.adversaryTiers.map(t=>`<div class="card"><h3>${t.name}</h3><div class="small">${t.description}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Horde Tracker</h3><div class="grid g2"><div class="field"><label>Starting Magnitude</label><input class="input" id="hStart" type="number" value="30"></div><div class="field"><label>Current Magnitude</label><input class="input" id="hCur" type="number" value="30"></div></div><div id="hRead" class="callout">Magnitude 30</div></div><h2>Homebrew Adversaries</h2><div class="list">${state.homebrew.adversaries.map(a=>`<div class="item"><b>${esc(a.name)}</b><div class="small muted">${esc(a.tier||'Custom')} • Wounds ${a.wounds||0}</div><button class="btn smallb" data-adv="${a.id}">Edit</button></div>`).join('')||'<div class="empty">No custom adversaries yet.</div>'}</div>`);function h(){let s=+document.getElementById('hStart').value||1,c=+document.getElementById('hCur').value||0,p=Math.round(c/s*100);document.getElementById('hRead').innerHTML=`<b>${c} Magnitude (${p}%)</b><div class="tiny">Below 50%: breaking tests worsen. Below 25%: the Core Horde rules indicate automatic breaking unless a rule such as Fearless changes that.</div>`}document.getElementById('hStart').oninput=h;document.getElementById('hCur').oninput=h;document.getElementById('newAdv').onclick=()=>editAdversary(null);document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>editAdversary(state.homebrew.adversaries.find(x=>x.id===b.dataset.adv)))}
function editAdversary(a){let x=a?JSON.parse(JSON.stringify(a)):{id:uid('adv'),name:'',tier:'Troop',stats:Object.fromEntries(C.map(k=>[k,30])),wounds:10,skills:[],talents:[],traits:[],armour:'',weapons:'',gear:'',specialRules:'',source:'Homebrew'};modal('Adversary Profile',`<div class="grid g2"><div class="field"><label>Name</label><input id="adName" class="input" value="${esc(x.name)}"></div><div class="field"><label>Tier</label><select id="adTier" class="select">${['Troop','Elite','Master','Custom'].map(t=>`<option ${x.tier===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="charstats">${C.map(k=>`<div class="field"><label>${k}</label><input class="input adStat" data-k="${k}" type="number" value="${x.stats[k]}"></div>`).join('')}</div><div class="field"><label>Wounds</label><input id="adW" class="input" type="number" value="${x.wounds}"></div>${['skills','talents','traits','armour','weapons','gear','specialRules'].map(k=>`<div class="field"><label>${k}</label><textarea class="textarea adText" data-k="${k}">${esc(Array.isArray(x[k])?x[k].join('\n'):x[k])}</textarea></div>`).join('')}<button class="btn primary" id="adSave">Save</button>`,b=>{b.querySelector('#adSave').onclick=()=>{x.name=b.querySelector('#adName').value.trim();x.tier=b.querySelector('#adTier').value;x.wounds=+b.querySelector('#adW').value||0;b.querySelectorAll('.adStat').forEach(i=>x.stats[i.dataset.k]=+i.value||0);b.querySelectorAll('.adText').forEach(i=>x[i.dataset.k]=i.value);let j=state.homebrew.adversaries.findIndex(y=>y.id===x.id);if(j>=0)state.homebrew.adversaries[j]=x;else state.homebrew.adversaries.push(x);save();b.remove();gm()}})}
function settings(){set(`<div><div class="kicker">Watch Fortress Administration</div><h1>Settings & Data</h1></div><div class="grid g2"><div class="card"><h3>Appearance</h3><p class="small">Choose the presentation of the Watch Fortress archive.</p><div class="appearance-grid"><button class="appearance-choice ${state.theme==='book'?'active':''}" id="themeBook"><div class="appearance-swatch parchment"></div><strong>Parchment</strong><small>Warm vellum, black ink, aged brass and the visual language of the Core Rulebook.</small></button><button class="appearance-choice ${state.theme==='night'?'active':''}" id="themeNight"><div class="appearance-swatch iron"></div><strong>Cold Iron</strong><small>Blackened steel, gunmetal framing, pale text and restrained crimson Watch Fortress accents.</small></button></div></div><div class="card"><h3>Data Integrity</h3><p class="small">v2 uses a fresh storage key. Previous ingestion-generated Librarium records are not loaded.</p><button class="btn danger" id="wipeV2">Erase v2 Data</button></div><div class="card"><h3>Backup</h3><div class="row"><button class="btn" id="exportData">Export JSON</button><label class="btn">Import JSON<input type="file" id="importData" accept="application/json" hidden></label></div></div><div class="card"><h3>Core Reference</h3><p class="small">${CORE.chapters.length} Core Chapters • ${CORE.specialities.length} Specialities • ${CORE.skills.length} Skills • ${CORE.weapons.length} structured weapon profiles • ${CORE.psychic.length} Psychic Power records.</p><div class="tiny muted">The complete Core book guided the schema. Long copyrighted prose is not duplicated into the app; records store mechanical fields, concise summaries and page references. Advancement tracking is fully supported, while individual advance purchases can be added or cloned into Homebrew as supplements are incorporated.</div></div></div><div class="card" style="margin-top:12px"><h3>Core Rules Quick Reference</h3><div class="grid g2"><div><b>Characteristic Tests</b><div class="small">Roll percentile dice at or under the modified target. Characteristic Bonus is the tens digit.</div></div><div><b>Attack Flow</b><div class="small">Apply modifiers → WS/BS Test → Hit Location → Damage → target applies armour/Toughness and records Damage.</div></div><div><b>Modes</b><div class="small">Solo Mode emphasizes Chapter individuality. Squad Mode uses Cohesion to enable team abilities.</div></div><div><b>Psychic Powers</b><div class="small">Structured by Name, Action, Opposed, Range, Sustained and effect; Psy Rating drives many variables.</div></div></div></div>`);document.getElementById('themeBook').onclick=()=>setTheme('book');document.getElementById('themeNight').onclick=()=>setTheme('night');document.getElementById('wipeV2').onclick=()=>{if(confirm('Erase all v2 characters and homebrew? This does not touch your old app storage.')){state=fresh();save();render();toast('v2 data erased')}};document.getElementById('exportData').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='deathwatch-companion-v2-backup.json';a.click()};document.getElementById('importData').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());state=Object.assign(fresh(),j);save();render();toast('Backup imported')}catch(err){alert(err.message)}}}
function setTheme(mode){state.theme=mode==='night'?'night':'book';save();render();document.getElementById('themeBtn').textContent=state.theme==='book'?'Cold Iron':'Parchment'}
function toggleTheme(){setTheme(state.theme==='book'?'night':'book')}
document.getElementById('themeBtn').onclick=toggleTheme;document.getElementById('quickRoll').onclick=()=>{let r=d100();modal('Quick d100 Roll',`<div class="stat" style="font-size:4rem;text-align:center">${r}</div><div class="row" style="justify-content:center"><button class="btn" id="again">Roll Again</button></div>`,b=>b.querySelector('#again').onclick=()=>{b.remove();document.getElementById('quickRoll').click()})};
render();document.getElementById('themeBtn').textContent=state.theme==='book'?'Cold Iron':'Parchment';

</script>
</body></html>
