Wargear p.141","description":"A massive exotic heavy weapon producing a wide, devastating energy effect. Its Blast, Devastating and Volatile qualities define it as a high-risk battlefield asset.","kind":"Ranged","dmg":"4d10+4 E","special":"Blast (5), Devastating (4), Volatile"},{"name":"Mk. IX Ultra-Pattern Sharpshooter’s Rifle","group":"Exotic","class":"Heavy","range":"250m","rof":"S/—/—","damage":"1d10+2 R","pen":"0","clip":"5","reload":"Full","qualities":"Accurate, Felling (1), Toxic","wt":"4","req":25,"renown":"—","source":"Expanded Wargear p.141","description":"A specialised long-range sharpshooter profile combining Accurate fire with Felling and Toxic effects rather than raw penetration.","kind":"Ranged","dmg":"1d10+2 R","special":"Accurate, Felling (1), Toxic"},{"name":"Astartes Executioner Axe","group":"Power","class":"Melee","range":"—","rof":"—","damage":"2d10+8 E","pen":"6","clip":"—","reload":"—","qualities":"Power Field, Unwieldy, Felling (1)","wt":"22","req":25,"renown":"Famed","source":"Expanded Wargear p.147","description":"A massive power axe intended for decisive execution strokes. Its Felling quality makes it especially relevant against unusually resilient foes.","kind":"Melee","dmg":"2d10+8 E","special":"Power Field, Unwieldy, Felling (1)"},{"name":"Astartes Power Claymore","group":"Power","class":"Melee","range":"—","rof":"—","damage":"2d10+6 E","pen":"6","clip":"—","reload":"—","qualities":"Power Field, Unwieldy, Devastating (1)","wt":"18","req":15,"renown":"Distinguished","source":"Expanded Wargear p.147","description":"A two-handed power blade whose heavy profile trades speed for substantial energy damage and the Devastating quality.","kind":"Melee","dmg":"2d10+6 E","special":"Power Field, Unwieldy, Devastating (1)"},{"name":"Astartes Power Falchion","group":"Power","class":"Melee","range":"—","rof":"—","damage":"1d10+4 E","pen":"5","clip":"—","reload":"—","qualities":"Power Field, Razor Sharp","wt":"7","req":25,"renown":"Distinguished","source":"Expanded Wargear p.147","description":"A comparatively light power blade distinguished by Razor Sharp, favouring precise penetrative strikes over sheer mass.","kind":"Melee","dmg":"1d10+4 E","special":"Power Field, Razor Sharp"},{"name":"Astartes Power Spear","group":"Power","class":"Melee","range":"—","rof":"—","damage":"1d10+6 E","pen":"7","clip":"—","reload":"—","qualities":"Power Field","wt":"8","req":15,"renown":"Distinguished","source":"Expanded Wargear p.147","description":"A power-field spear with strong penetration and a straightforward melee profile.","kind":"Melee","dmg":"1d10+6 E","special":"Power Field"},{"name":"Breaching Augur","group":"Siege","class":"Melee","range":"—","rof":"—","damage":"4d10+3 R","pen":"7","clip":"—","reload":"—","qualities":"Tearing, Unwieldy, Power Field","wt":"28","req":18,"renown":"—","source":"Expanded Wargear p.147","description":"A brutal powered breaching implement that doubles as an extremely destructive melee weapon, combining Tearing with a Power Field.","kind":"Melee","dmg":"4d10+3 R","special":"Tearing, Unwieldy, Power Field"},{"name":"Bulkhead Shears","group":"Siege","class":"Melee","range":"—","rof":"—","damage":"4d10+5 R","pen":"6","clip":"—","reload":"—","qualities":"Tearing, Unwieldy","wt":"10","req":17,"renown":"—","source":"Expanded Wargear p.147","description":"Heavy cutting equipment adapted for violent close work, offering enormous rending damage at the cost of being Unwieldy.","kind":"Melee","dmg":"4d10+5 R","special":"Tearing, Unwieldy"},{"name":"Astartes Anti-Plant Grenade","group":"Grenade","class":"Thrown","range":"SB×3","rof":"S/—/—","damage":"3d10 E","pen":"0","clip":"1","reload":"—","qualities":"Blast (3); Plant life only","wt":"0.5","req":18,"renown":"—","source":"Expanded Wargear p.147","description":"A specialist grenade whose damage applies only against plant life.","kind":"Ranged","dmg":"3d10 E","special":"Blast (3); Plant life only"},{"name":"Concussion Grenade","group":"Grenade","class":"Thrown","range":"SB×3","rof":"S/—/—","damage":"4d10 I","pen":"3","clip":"1","reload":"—","qualities":"Concussive, Blast (3)","wt":"0.5","req":18,"renown":"—","source":"Expanded Wargear p.147","description":"A thrown explosive built around a powerful concussive blast rather than fragmentation.","kind":"Ranged","dmg":"4d10 I","special":"Concussive, Blast (3)"},{"name":"Melta Bomb","group":"Explosive","class":"Placed Explosive","range":"5m","rof":"S/—/—","damage":"6d10+7 E","pen":"15","clip":"1","reload":"—","qualities":"Blast (5)","wt":"4","req":12,"renown":"—","source":"Expanded Wargear p.147","description":"A placed melta charge with exceptional penetration and a significant blast radius, intended for hard targets and structures.","kind":"Ranged","dmg":"6d10+7 E","special":"Blast (5)"},{"name":"Monoball Grenade","group":"Grenade","class":"Thrown","range":"SB×3","rof":"S/—/—","damage":"5d10+5 R","pen":"6","clip":"1","reload":"—","qualities":"Blast (3), Tearing","wt":"0.5","req":50,"renown":"Distinguished","source":"Expanded Wargear p.147","description":"A prestigious high-output grenade combining a wide blast with severe rending damage.","kind":"Ranged","dmg":"5d10+5 R","special":"Blast (3), Tearing"}],"solo":[{"id":"solo-righteous","name":"Righteous Zeal","category":"Solo Mode","chapter":"Black Templars","rank":1,"summary":"Once per combat, activate as a Free Action for a number of rounds equal to Rank. It is especially effective against daemonic or psychic threats and improves at Ranks 3, 5, and 7.","activation":"Free Action; once per combat","duration":"Rounds equal to Rank","source":"Core Rulebook","page":"217"},{"id":"solo-blood","name":"Blood Frenzy","category":"Solo Mode","chapter":"Blood Angels","rank":1,"summary":"Once per combat, enter a short-lived frenzy that improves close-combat damage reliability and the chance of Righteous Fury. Higher Ranks improve penetration and the trigger range.","activation":"Once per combat","duration":"ceil(Rank / 2) rounds","source":"Core Rulebook","page":"217"},{"id":"solo-stoic","name":"Stoic Defence","category":"Solo Mode","chapter":"Dark Angels","rank":1,"summary":"Once per combat, establish a defended position and gain temporary Wounds at the cost of mobility. Higher Ranks increase the temporary Wounds and later allow limited movement.","activation":"Once per combat","duration":"Until the position is abandoned or temporary Wounds are lost","source":"Core Rulebook","page":"217"},{"id":"solo-wolf","name":"Wolf Senses","category":"Solo Mode","chapter":"Space Wolves","rank":1,"summary":"While in Solo Mode and without a sealed helmet interfering, failed Perception-based Tests may be rerolled and the Battle-Brother counts as having Dark Sight. Improves with Rank.","activation":"Passive in Solo Mode","duration":"While conditions are met","source":"Core Rulebook","page":"218"},{"id":"solo-thunder","name":"Thunder's Call","category":"Solo Mode","chapter":"Storm Wardens","rank":1,"summary":"A Storm Warden Solo Mode ability focused on personal challenge, force of will, and decisive confrontation. Rank improvements strengthen its effect.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-favoured","name":"Favoured Son","category":"Solo Mode","chapter":"Ultramarines","rank":1,"summary":"An Ultramarines Solo Mode ability reflecting broad competence and exemplary leadership. Its benefits scale with Rank.","activation":"Solo Mode","duration":"See Rank-based effect","source":"Core Rulebook","page":"218"},{"id":"solo-raven","name":"Master of the Shadows","category":"Solo Mode","chapter":"Raven Guard","rank":1,"summary":"Rank 1: re-roll failed Concealment, Shadowing, and Silent Move Tests. Rank 3: attacks against surprised targets gain +2 Penetration. Rank 5: gain +20 to Concealment, Shadowing, and Silent Move Tests. Rank 7: attacks against surprised targets gain +4 Penetration instead.","activation":"Passive","duration":"While in Solo Mode","source":"First Founding — supplied Raven Guard reference","page":"17"}],"squad":[{"id":"sq-fire-effect","name":"Fire for Effect","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":2,"sustained":true,"summary":"Lets the Kill-team use Reactions for immediate ranged Standard Attacks while the ability is sustained. Higher Rank broadens the available attack options.","source":"Core Rulebook","page":"221"},{"id":"sq-fire-support","name":"Fire Support","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Reduces the normal penalty associated with Suppressing Fire and Overwatch for the supported squad. At Rank 3 it becomes quicker to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-furious","name":"Furious Charge","category":"Squad Mode","subtype":"Attack Pattern","action":"Free Action","cost":3,"sustained":false,"summary":"Allows supported Battle-Brothers to immediately close and attack in a coordinated charge, with improved damage reliability. Rank 5 expands the attack option.","source":"Core Rulebook","page":"221"},{"id":"sq-advance","name":"Squad Advance","category":"Squad Mode","subtype":"Attack Pattern","action":"Half Action","cost":1,"sustained":true,"summary":"Lets the Kill-team use Reactions to make Tactical Advances while the ability remains active. At Rank 3 it becomes a Free Action to initiate.","source":"Core Rulebook","page":"221"},{"id":"sq-spacing","name":"Tactical Spacing","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":1,"sustained":true,"summary":"Allows supported Battle-Brothers to share Reactions. At Rank 5 the group also gains an additional Reaction while sustained.","source":"Core Rulebook","page":"223"},{"id":"sq-regroup","name":"Regroup","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":2,"sustained":false,"summary":"A Codex defensive action used to restore order and team effectiveness when the squad is under pressure.","source":"Core Rulebook","page":"223"},{"id":"sq-digin","name":"Dig In","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Improves the effectiveness of prepared defensive positions while the squad remains in place.","source":"Core Rulebook","page":"223"},{"id":"sq-strongpoint","name":"Strongpoint","category":"Squad Mode","subtype":"Defensive Stance","action":"Full Action","cost":3,"sustained":true,"summary":"Establishes a nominated centre and lets supported Battle-Brothers concentrate on called targets while the centre stays stationary.","source":"Core Rulebook","page":"223"},{"id":"sq-armour-faith","name":"Armour of Faith","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Black Templars","action":"Free Action","cost":2,"sustained":true,"summary":"Improves resistance to psychic effects and resilience against daemonic/psychic harm for supported Battle-Brothers; improves at Rank 5.","source":"Core Rulebook","page":"223"},{"id":"sq-feel-no-pain","name":"Feel No Pain","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Blood Angels","action":"Free Action","cost":3,"sustained":false,"summary":"For a brief period, halves post-protection Damage for the supported group but normally restricts defensive Reactions. Rank 5 removes that restriction.","source":"Core Rulebook","page":"223"},{"id":"sq-immovable","name":"Immovable Defence","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Dark Angels","action":"Full Action","cost":2,"sustained":true,"summary":"While stationary, supported Battle-Brothers gain bonuses to Ballistic Skill Tests, Dodge, and Armour Points. The test bonuses improve at Rank 4.","source":"Core Rulebook","page":"225"},{"id":"sq-pack","name":"Pack Tactics","category":"Squad Mode","subtype":"Chapter Attack Pattern","chapter":"Space Wolves","action":"Free Action","cost":2,"sustained":false,"summary":"One Space Marine can spend an unused Reaction to distract a target so another Battle-Brother’s attacks are harder to avoid; Rank 3 improves melee attack rolls.","source":"Core Rulebook","page":"225"},{"id":"sq-shield-sword","name":"Shield and Sword","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Storm Wardens","action":"Free Action","cost":2,"sustained":true,"summary":"Lets supported Battle-Brothers protect nearby allies with Parry reactions and answer a successful melee strike with an immediate response. Rank 5 improves Parry.","source":"Core Rulebook","page":"225"},{"id":"sq-rally","name":"Rally Cry","category":"Squad Mode","subtype":"Chapter Defensive Stance","chapter":"Ultramarines","action":"Free Action","cost":0,"sustained":false,"summary":"Restores Cohesion equal to Fellowship Bonus. It may be used once per game session and does not improve with Rank.","source":"Core Rulebook","page":"225"},{"id":"sq-raven-exploit","name":"Exploit Weakness","category":"Squad Mode","subtype":"Raven Guard Attack Pattern","chapter":"Raven Guard","action":"Half Action","cost":4,"sustained":false,"summary":"Choose one enemy by a Battle-Brother in Support Range. Until the beginning of that Battle-Brother’s next Turn, all Kill-team members may re-roll Damage rolls against the chosen target; the second roll must be kept. Only one target may be marked at a time. At Rank 5, marking the target becomes a Free Action.","source":"First Founding — user supplied reference","page":"18"},{"id":"sq-raven-evasive","name":"Evasive Manoeuvres","category":"Squad Mode","subtype":"Raven Guard Defensive Stance","chapter":"Raven Guard","action":"Full Action","cost":3,"sustained":true,"summary":"Battle-Brothers in Support Range no longer trigger enemy Overwatch and gain +20 to Tests made to avoid Pinning. At Rank 3, supported Battle-Brothers become immune to Pinning while the stance is active.","source":"First Founding — user supplied reference","page":"18"}],"rules":[{"id":"rule-test","name":"Characteristic Test","category":"Core Rule","summary":"Roll d100. A result equal to or below the modified target succeeds. Difficulty modifies the target from +60 to -60.","source":"Core Rulebook","page":"203"},{"id":"rule-skilltest","name":"Skill Test","category":"Core Rule","summary":"Use the Skill’s linked Characteristic, training level, and situational modifier. An untrained Basic Skill uses half the linked Characteristic before difficulty is applied; untrained Advanced Skills generally cannot be attempted.","source":"Core Rulebook","page":"202"},{"id":"rule-degrees","name":"Degrees of Success and Failure","category":"Core Rule","summary":"The margin between the roll and target determines how strongly a Test succeeds or fails. The app calculates this automatically in its roller.","source":"Core Rulebook","page":"203"},{"id":"rule-fate","name":"Fate Points","category":"Resource","summary":"Track total and current Fate separately. Fate can be spent for powerful short-term benefits and can sometimes be permanently burned to survive otherwise final consequences.","source":"Core Rulebook","page":"204"},{"id":"rule-wounds","name":"Wounds","category":"Resource","summary":"Wounds absorb ordinary Damage. Once Wounds are gone, further Damage becomes Critical Damage and is resolved by location/type.","source":"Core Rulebook","page":"250"},{"id":"rule-fatigue","name":"Fatigue","category":"Resource","summary":"Fatigue represents exhaustion and accumulated strain. It applies penalties once it reaches thresholds based on Toughness Bonus.","source":"Core Rulebook","page":"251"},{"id":"rule-insanity","name":"Insanity","category":"Resource","summary":"Long-term psychological trauma. Battle-Brothers begin at 0; accumulating Insanity can trigger Battle Traumas and the Primarch’s Curse.","source":"Core Rulebook","page":"278"},{"id":"rule-corruption","name":"Corruption","category":"Resource","summary":"Tracks spiritual and warp taint. Battle-Brothers begin at 0; reaching the Purity Threshold removes a character from normal play.","source":"Core Rulebook","page":"282"},{"id":"rule-cohesion","name":"Cohesion","category":"Kill-team","summary":"A shared Mission resource representing squad unity. It is calculated from the current squad leader and can be spent or damaged during play.","source":"Core Rulebook","page":"211"},{"id":"rule-solo","name":"Solo Mode","category":"Kill-team","summary":"The default mode. A Battle-Brother can freely use Solo Mode abilities but cannot benefit from Squad Mode abilities used by brothers.","source":"Core Rulebook","page":"213"},{"id":"rule-squad","name":"Squad Mode","category":"Kill-team","summary":"A deliberate team state. To enter normally, the Battle-Brother needs at least one brother in Support Range and the Kill-team must have Cohesion remaining.","source":"Core Rulebook","page":"213–214"},{"id":"rule-support","name":"Support Range","category":"Kill-team","summary":"Determines which Battle-Brothers are close enough to share Squad Mode benefits. The range grows with Rank and can depend on visual or vox contact.","source":"Core Rulebook","page":"213–214"},{"id":"rule-renown","name":"Renown","category":"Campaign","summary":"Measures standing within the Deathwatch and influences what support or rare resources a Battle-Brother may be trusted with.","source":"Core Rulebook","page":"140"},{"id":"rule-requisition","name":"Requisition","category":"Mission","summary":"A Mission preparation resource set by the GM. The Kill-team uses it to determine what temporary support and gear can be assigned for the operation.","source":"Core Rulebook","page":"139–140"},{"id":"rule-rank","name":"Rank","category":"Advancement","summary":"Rank is determined by total XP spent. Higher Rank opens additional Speciality advances and improves many Solo/Squad abilities.","source":"Core Rulebook","page":"57–58"},{"id":"rule-charadvance","name":"Characteristic Advance","category":"Advancement","summary":"Each purchased Characteristic Advance adds +5. The progression must be bought in order: Simple, Intermediate, Trained, Expert.","source":"Core Rulebook","page":"57"},{"id":"rule-elite","name":"Elite Advance","category":"Advancement","summary":"A GM-approved advance outside the normal scheme. The GM determines availability, prerequisites, and XP cost.","source":"Core Rulebook","page":"59"},{"id":"rule-fear","name":"Fear","category":"GM Rule","summary":"Fear rating sets the difficulty of Fear Tests for ordinary characters. Battle-Brothers are unusually resistant, but frightening enemies can still threaten squad Cohesion.","source":"Core Rulebook","page":"277"},{"id":"rule-disposition","name":"Disposition","category":"GM Rule","summary":"The GM sets an NPC’s starting attitude. Interaction Tests can improve or worsen that attitude by steps according to Degrees of Success or Failure.","source":"Core Rulebook","page":"276"},{"id":"rule-hordes","name":"Hordes","category":"GM Rule","summary":"Represents large groups as a single abstract enemy with Magnitude. GM tools track Magnitude separately from ordinary Wounds.","source":"Core Rulebook","page":"359–360"},{"id":"rg-son-night","name":"Son of Night","category":"Demeanour","summary":"Raven Guard are patient, watchful and sparing with words, favouring observation and careful timing over direct confrontation. This is the Chapter Demeanour and can be triggered under the normal Demeanour rules.","source":"First Founding — supplied Raven Guard reference","page":"16"},{"id":"rg-curse","name":"Lure of the Shadows","category":"Primarch’s Curse","summary":"Level 1: when a small Raven Guard strike team is ordered into a direct attack, the Battle-Brother becomes resistant to the order, potentially approaching disobedience. Level 2: he becomes increasingly quiet and brooding; non-Raven Guard characters cannot benefit him with Command or Charm (Inspire). Level 3: he rejects the tactics of other Chapters and does not benefit from non-Raven Guard Squad Mode abilities.","source":"First Founding — supplied Raven Guard reference","page":"17"},{"id":"rg-guerrilla","name":"Guerrilla Training","category":"Talent","summary":"The Battle-Brother ignores the penalties to Silent Move and Concealment Tests normally imposed by wearing power armour.","source":"First Founding — supplied Raven Guard reference","page":"18"},{"id":"rg-ravenclaw","name":"Ravenclaw","category":"Chapter Trapping","summary":"A black Ravenclaw heraldic device commonly worn by veteran Raven Guard. Add +3 to Perception after all other modifiers.","source":"First Founding — supplied Raven Guard reference","page":"19"},{"id":"rg-calvaria","name":"Raven Calvaria","category":"Chapter Trapping","summary":"A bird-skull decoration worn from the neck or right shoulder pad. Add +2 to Agility after all other modifiers.","source":"First Founding — supplied Raven Guard reference","page":"19"},{"id":"rg-pictor","name":"Helmet Pictor","category":"Chapter Trapping","summary":"At the end of each mission, the wearer may make a Challenging (+0) Tactics Test using recorded combat data. Every Kill-team member gains +50 XP per Degree of Success.","source":"First Founding — supplied Raven Guard reference","page":"19"}],"difficulty":[["Trivial",60],["Elementary",50],["Simple",40],["Easy",30],["Routine",20],["Ordinary",10],["Challenging",0],["Difficult",-10],["Hard",-20],["Very Hard",-30],["Arduous",-40],["Punishing",-50],["Hellish",-60]],"oaths":[{"id":"astartes","name":"Oath of the Astartes","specialities":["tactical","assault","devastator"],"effect":"+2 Cohesion for the Mission.","abilities":["Squad Advance","Bolter Assault","Tactical Spacing"]},{"id":"emperor","name":"Oath to the Emperor","specialities":["tactical","librarian","apothecary"],"effect":"+10 to Willpower Tests for all Kill-team members during the Mission.","abilities":["Fire for Effect","Regroup","Strongpoint"]},{"id":"glory","name":"Oath of Glory","specialities":["tactical","assault"],"effect":"Each member gains +1 additional Renown for each Primary or Secondary Objective they personally help complete.","abilities":["Squad Advance","Bolter Assault","Furious Charge"]},{"id":"knowledge","name":"Oath of Knowledge","specialities":["librarian","apothecary"],"effect":"Choose one foe type: +10 WS and BS against that foe for the Mission. A Librarian may instead use the psychic-study option described by the Core rules.","abilities":["Go to Ground","Dig In","Strongpoint"]},{"id":"loyalty","name":"Oath of Loyalty","specialities":["tactical","apothecary"],"effect":"+1 on Cohesion Challenge rolls; the squad leader gains +10 to Tests made to resist Cohesion damage.","abilities":["Tactical Spacing","Regroup","Soak Fire"]},{"id":"weapon","name":"Oath of the Weapon","specialities":["techmarine","devastator"],"effect":"Personal weapons ignore Jams for the Mission; melee WS Tests used to confirm Righteous Fury may be re-rolled.","abilities":["Fire Support","Fire for Effect","Tank Buster"]}],"trappings":{"black-templars":[{"id":"bt-devotion-chain","name":"Devotion Chain","effect":"+3 to Willpower Tests made to resist Fear effects and Cohesion Damage.","source":"Core Rulebook p.169"},{"id":"bt-tabard-ornamental","name":"Tabard · Ornamental","effect":"+2 to Fellowship Tests.","source":"Core Rulebook p.169"},{"id":"bt-tabard-deathwatch","name":"Tabard · Deathwatch / Squad Heraldry","effect":"The Kill-team restores 1 bonus Cohesion for each Primary Objective achieved.","source":"Core Rulebook p.169"},{"id":"bt-tabard-chapter","name":"Tabard · Chapter Heraldry","effect":"+1 effective Rank for Black Templar Solo Mode effectiveness; −1 Squad Base Cohesion.","source":"Core Rulebook p.169"}],"blood-angels":[{"id":"ba-blood-drop","name":"Blood Drop Pendant","effect":"When spending a Fate Point for a Test bonus, use +13 instead of +10.","source":"Core Rulebook p.169"},{"id":"ba-icon-inspiration","name":"Golden Icon · Inspiration","effect":"+3 to Command Tests.","source":"Core Rulebook p.170"},{"id":"ba-icon-wrath","name":"Golden Icon · Wings of Wrath","effect":"+1 Damage when an attack hits during a Charge action.","source":"Core Rulebook p.170"},{"id":"ba-icon-purity","name":"Golden Icon · Purity Focus","effect":"When Corruption Points are gained, reduce the total gained by 1.","source":"Core Rulebook p.170"}],"dark-angels":[{"id":"da-ceremonial-sword","name":"Ceremonial Sword","effect":"A functional Dark Angels ceremonial blade. It may be carried in addition to or in place of the Astartes combat knife; use the Ceremonial Sword profile in the Armory.","source":"Core Rulebook p.170"},{"id":"da-robe-scholar","name":"Scholar’s Robe","effect":"+3 to Tests with one chosen Scholastic Lore.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Scholastic Lore"},{"id":"da-robe-secrets","name":"Robe of Secrets","effect":"+3 to Tests with one chosen Forbidden Lore.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Forbidden Lore"},{"id":"da-robe-seeker","name":"Seeker’s Robe","effect":"+3 to Scrutiny Tests.","source":"Core Rulebook p.170"}],"space-wolves":[{"id":"sw-wolf-pelt","name":"Wolf Pelt","effect":"+2 to Intimidate Tests.","source":"Core Rulebook p.170"},{"id":"sw-totem-hunter","name":"Runic Totem · Bloodied Hunter","effect":"+1 to Damage inflicted by Righteous Fury.","source":"Core Rulebook p.170"},{"id":"sw-totem-sea","name":"Runic Totem · Sea Wolf","effect":"+3 to Tests with one chosen Drive or Pilot Skill.","source":"Core Rulebook p.170","requiresFocus":true,"focusLabel":"Chosen Drive or Pilot Skill"},{"id":"sw-totem-sun","name":"Runic Totem · Sun Wolf","effect":"+3 to Awareness Tests.","source":"Core Rulebook p.170"}],"storm-wardens":[{"id":"stw-sacris-claymore","name":"Sacris Claymore","effect":"Replaces the Astartes combat knife. The two-handed Sacris claymore uses its Armory profile.","source":"Core Rulebook p.170"},{"id":"stw-amulet-might","name":"Tempest Amulet · Might","effect":"+2 Strength after all other modifiers.","source":"Core Rulebook p.170"},{"id":"stw-amulet-victory","name":"Tempest Amulet · Victory Scripture","effect":"+2 Weapon Skill when fighting a single enemy in melee combat.","source":"Core Rulebook p.170"},{"id":"stw-amulet-guardian","name":"Tempest Amulet · Guardian","effect":"Counts as a Charm.","source":"Core Rulebook p.170"}],"ultramarines":[{"id":"um-cingulum-adamantine","name":"Cingulum · Adamantine Inlays","effect":"+3 to Parry Tests.","source":"Core Rulebook p.170"},{"id":"um-cingulum-bells","name":"Cingulum · Honour Bells","effect":"+3 Weapon Skill on the first Attack roll in a combat.","source":"Core Rulebook p.170"},{"id":"um-cingulum-leadership","name":"Cingulum · Marks of Leadership","effect":"+3 to Tests made to regain Cohesion or prevent Cohesion Damage.","source":"Core Rulebook p.170"},{"id":"um-heraldry-scroll","name":"Heraldry Scroll","effect":"+10 Kill Markers to an Assault Mission when the scroll was displayed in at least one battle.","source":"Core Rulebook p.170"}],"raven-guard":[{"id":"rg-ravenclaw","name":"Ravenclaw","effect":"+3 Perception after all other modifiers.","source":"First Founding p.19"},{"id":"rg-calvaria","name":"Raven Calvaria","effect":"+2 Agility after all other modifiers.","source":"First Founding p.19"},{"id":"rg-picter","name":"Helmet Picter","effect":"After a mission, the supplied Tactics review can grant the Kill-team bonus XP per Degree of Success.","source":"First Founding p.19"}]},"personalDemeanours":["Calculating","Gregarious","Hot-Blooded","Studious","Taciturn","Pious","Stoic","Scornful","Ambitious","Proud"],"startingPackages":{"apothecary":{"gear":["Astartes Bolter (Godwyn) · fire selector","Reductor","Narthecium"],"loadout":["Astartes Bolter (Godwyn)"]},"assault":{"gear":["Astartes Chainsword","Astartes Jump Pack"],"loadout":["Astartes Chainsword"]},"devastator":{"gear":["Astartes Heavy Bolter","Backpack ammunition supply"],"loadout":["Astartes Heavy Bolter"]},"librarian":{"gear":["Astartes Bolter (Godwyn) · fire selector","Astartes Force Weapon"],"loadout":["Astartes Bolter (Godwyn)"]},"tactical":{"gear":["Astartes Bolter (Godwyn) · fire selector","1 clip Special Issue Ammunition (maximum 25 Requisition; Renown requirement still applies)"],"loadout":["Astartes Bolter (Godwyn)"]},"techmarine":{"gear":["Astartes Bolter (Godwyn) · fire selector","Astartes Servo-Arm"],"loadout":["Astartes Bolter (Godwyn)"]}},"techCybernetics":["Augur Array","Bionic Arm","Bionic Heart","Bionic Locomotion","Bionic Respiratory System","Cybernetic Senses","Mind Impulse Unit (MIU)"],"armourMarks":[{"id":"mk1","name":"Mk I “Thunder”","availability":"Ancient / GM choice","ap":{"Head":6,"Body":8,"Left Arm":6,"Right Arm":6,"Left Leg":4,"Right Leg":4},"weight":"200–250 kg","strength":"Variable +15 to +25","autoSenses":"None","lifeSupport":"None","pain":0,"vox":"None","magBoots":"None","nutrient":"None","recoil":"None","manual":-15,"histories":0,"note":"Mk I is a broad early armour type rather than one standard pattern. Complete suits may include leg protection; the source notes that legs can be unarmoured on incomplete examples. It does not coordinate with the Black Carapace, so enemies receive the normal modifier for attacking a Hulking target."},{"id":"mk2","name":"Mk II “Crusade”","availability":"Ancient / GM choice","ap":{"Head":7,"Body":9,"Left Arm":7,"Right Arm":7,"Left Leg":7,"Right Leg":7},"weight":"280 kg","strength":"+25","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes*","nutrient":"1 week","recoil":"Yes","manual":-20,"histories":0,"note":"Most Mk II suits have permanently magnetised boot soles; later examples introduced the ability to switch them."},{"id":"mk3","name":"Mk III “Iron”","availability":"Ancient / GM choice","ap":{"Head":9,"Body":10,"Left Arm":9,"Right Arm":9,"Left Leg":9,"Right Leg":9},"weight":"300 kg","strength":"+25","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":8,"vox":"Yes","magBoots":"Yes","nutrient":"1 week","recoil":"Yes","manual":-20,"histories":0,"note":"Designed for frontal assaults. The rear of the suit uses AP 6 instead of its much stronger frontal protection."},{"id":"mk4","name":"Mk IV “Maximus”","availability":"Standard-issue result","ap":{"Head":7,"Body":9,"Left Arm":7,"Right Arm":7,"Left Leg":7,"Right Leg":7},"weight":"220 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":3,"note":"A standard-issue possibility with the greatest number of Power Armour History rolls among the commonly fielded Marks in the supplied table."},{"id":"mk5","name":"Mk V “Heresy”","availability":"Standard-issue result","ap":{"Head":8,"Body":9,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"200 kg","strength":"+20","autoSenses":"+5 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":2,"note":"A standard-issue possibility with two Power Armour History rolls."},{"id":"mk6","name":"Mk VI “Corvus”","availability":"Standard-issue result","ap":{"Head":8,"Body":9,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"170 kg","strength":"+20","autoSenses":"+15 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":2,"note":"The strongest auto-sense modifier in the supplied Mark table; this remains a general Astartes armour Mark available independently of Chapter."},{"id":"mk7","name":"Mk VII “Aquila”","availability":"Most common standard issue","ap":{"Head":8,"Body":10,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"180 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":1,"note":"The most common standard-issue result in the supplied d10 generation table."},{"id":"mk8","name":"Mk VIII “Errant”","availability":"Standard-issue result; often officers/veterans","ap":{"Head":8,"Body":11,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"weight":"190 kg","strength":"+20","autoSenses":"+10 Awareness","lifeSupport":"Yes","pain":6,"vox":"Yes","magBoots":"Yes","nutrient":"2 weeks","recoil":"Yes","manual":-10,"histories":1,"note":"The raised gorget protects the neck: when a hit lands on the head, roll 1d10; on 8–10 treat it as a body hit instead. The wearer also gains +5 to Command Tests."}],"fieldGear":[{"id":"combat-webbing","name":"Astartes Combat Webbing","req":3,"renown":"—","source":"Expanded Wargear p.144–145","summary":"Heavy-duty webbing sized for Astartes and Scout armour. It carries mission pouches for ammunition, medical supplies, sidearms, samples and other field gear.","mechanics":"The listed Medicae pouch grants +20 to Medicae Tests when that pouch is part of the webbing. Other common pouches hold clips, grenades, a combat knife, shotgun ammunition, vox, sidearm or recovered samples."},{"id":"grapnel","name":"Astartes Grapnel","req":3,"renown":"—","source":"Expanded Wargear p.144","summary":"A Scout-oriented grapnel launcher with a thin 100 metre line and powered winch.","mechanics":"Provides a 100 m climbing line. If used as an improvised projectile, the supplied profile is 1d10+2 R, Pen 2."},{"id":"grav-chute","name":"Astartes Grav Chute","req":5,"renown":"—","source":"Expanded Wargear p.144","summary":"A low-power suspensor descent system used when stealthy airborne insertion is preferable to drop pods or teleportation.","mechanics":"Allows a safe, guided fall from any height. It is a descent system rather than a jump pack and cannot provide powered upward movement."},{"id":"autosense-goggles","name":"Auto-sense Goggles","req":10,"renown":"—","source":"Expanded Wargear p.144","summary":"Scout sniper optics combining several vision and observation functions in one rugged set of goggles.","mechanics":"No darkness penalties; +20 to vision-based Perception Tests at night or in darkness; broad radiation sensing; pict recording; 5× optical and micro magnification. When used as a forward observer/fire controller, the guided allied unit gains +20 Ballistic Skill Tests."},{"id":"camo-cloak","name":"Cameleoline Cloak","req":20,"renown":"—","source":"Expanded Wargear p.145","summary":"A colour-shifting hooded cloak favoured by Deathwatch sharpshooters.","mechanics":"+20 to Concealment Tests while worn. When stationary, ranged attackers count the wearer as one range bracket farther away."},{"id":"camo-tarp","name":"Cameleoline Tarpaulin","req":5,"renown":"—","source":"Expanded Wargear p.145","summary":"Five-metre colour-shifting sheets that can be joined to conceal vehicles, emplacements or camps.","mechanics":"Using the tarpaulin to hide a vehicle or emplacement grants +30 to Concealment Tests."},{"id":"diagnosticator","name":"Diagnosticator","req":25,"renown":"Distinguished","restriction":"Techmarine","source":"Expanded Wargear p.145","summary":"A portable machine-spirit diagnostic instrument used by Deathwatch Techmarines.","mechanics":"+20 to Tech-Use Tests when diagnosing or repairing malfunctioning equipment."},{"id":"infiltriol","name":"Infiltriol Enamel","req":10,"renown":"Distinguished","source":"Expanded Wargear p.145","summary":"A specialised coating formulated around the sensory biology of Hive Fleet Dagon.","mechanics":"When applied to power armour, most Tyranid organisms do not recognise the wearer as an enemy. More intelligent or perceptive synapse/vanguard organisms may expose the deception. The supplied rule is specifically formulated for Hive Fleet Dagon."},{"id":"tripod","name":"Tripod Weapon Upgrade","req":3,"renown":"—","source":"Expanded Wargear p.144–145","summary":"A simple bracing mount for heavy weapons when suspensors are unavailable.","mechanics":"May be fitted to any Heavy weapon. It requires a stationary firing position and fixes the weapon to a 180-degree arc."},{"id":"vox-operated","name":"Vox-Operated Weapon Upgrade","req":5,"renown":"Distinguished","source":"Expanded Wargear p.144–145","summary":"A voice-keyed trigger and control interface for a weapon.","mechanics":"May be fitted to Pistol, Basic, Grenade or Heavy weapons. The user can operate the trigger, firing mode, shot selector and compatible clip/fire selector by spoken command keyed to the authorised voice."},{"id":"fenris-wolf-helm","name":"Fenris-Pattern Wolf Helm","req":"N/A","renown":"Respected","restriction":"Space Wolves","source":"Expanded Wargear p.143 & table p.147","summary":"A Space Wolves power-armour helm whose sensors are tuned to the Chapter’s heightened senses.","mechanics":"Acts as a normal power-armour helmet. A Space Wolf may freely use Wolf Senses while also benefiting from the power armour auto-senses. Armour table profile: Head AP 8, 4 kg."}],"armourHistories":[{"roll":1,"name":"Cover Not Before the Enemy","effect":"The armour is ostentatious and authority-laden. Suffer an additional –20 to Silent Move and Concealment Tests beyond normal power-armour penalties, but gain +10 to Command Tests."},{"roll":2,"name":"None Shall Escape the Emperor’s Wrath","effect":"Targeting systems are exceptionally exacting. Gain +5 Ballistic Skill, but suffer –10 to Dodge Tests."},{"roll":3,"name":"Thine Arm Be the Scourge of the Impure","effect":"The suit favours close combat. Gain +5 Weapon Skill; while the helmet is worn, Ballistic Skill Tests suffer –5."},{"roll":4,"name":"Death Is Joy","effect":"The armour’s machine spirit exults in killing blows. Add +2 Damage to attacks that inflict Critical Damage and +1 Magnitude damage to any successful attack against a Horde."},{"roll":5,"name":"A Fury Like Lightning","effect":"Hyper-articulated systems sharpen movement. Gain +5 Agility and +1 to Initiative rolls."},{"roll":6,"name":"Thy Strength Be Legend","effect":"The suit provides exceptional physical assistance. Gain an additional +10 Strength from the armour, applied after modifiers for Unnatural Strength."},{"roll":7,"name":"Terror Be Thy Friend","effect":"The armour projects menace. Gain Fear (1) against foes engaged with you in melee, unless they already possess Fear."},{"roll":8,"name":"Lead from the Front","effect":"The suit has a long command lineage. Add +1 to the Kill-team’s Cohesion total; this can stack with another suit bearing the same history."},{"roll":9,"name":"Bring Death from Afar","effect":"The suit is adapted for mobile fire support. Ignore the normal moving-and-firing penalties with Pistol or Basic weapons on Semi- or Full-Auto; Heavy weapons count as Basic for the purpose of moving and firing on Semi- or Full-Auto."},{"roll":10,"name":"To Forget Is to Forgive. Forget Nothing.","effect":"The suit carries a sworn legacy of vengeance. Gain Hatred against one chosen enemy group."}],"pasts":{"black-templars":[["Received a Vision","Before a major battle you sought the Emperor’s guidance and experienced a private vision. Your actions afterward helped defeat a powerful enemy and reinforced your faith."],["Established a Keep","You helped establish a Black Templars Chapter keep on an isolated frontier world during an eternal crusade; the fortress remains a monument to that service."],["The Geonide Crusade","You recovered valuable Adeptus Mechanicus artefacts during a rebellion on Geonide and personally fought rogue psykers."],["Trained a Neophyte","You upheld Chapter tradition by mentoring a Neophyte through numerous battles; not every aspirant you trained necessarily survived to become an Initiate."],["Boarding Action","You took part in a violent void-borne boarding assault against an enemy vessel and helped turn the course of a larger crusade."]],"blood-angels":[["Scouring of Ultramar","You served in a long campaign supporting the Ultramarines against Hive Fleet Behemoth and returned with hard-won experience fighting Tyranids."],["Assault on Baal","You helped defend Baal and its fortress-monastery from an Ork invasion."],["A New Beginning","You witnessed a rare reconciliation with a Blood Angels successor Chapter and endured the tensions that surrounded it."],["Golgotha Strike Force","You served in Strike Force Bloodhawk during the fighting on Golgotha, whether in the armoured spearhead or supporting Stormraven assaults."],["Purged a Space Hulk","Alongside First Company Terminators, you helped cleanse a vast space hulk of xenos, renegades, or worse."]],"dark-angels":[["Encountered the Fallen","You have personally encountered—or caught a rare glimpse of—one of the Fallen. You are sworn to secrecy regarding what you learned."],["Served in the Ravenwing","You fought with the Ravenwing in high-speed attacks and may know secrets that remain hidden from most of the Chapter."],["Preserved the Secrets of the Chapter","You proved your loyalty during a mission involving dangerous records or truths concerning the Dark Angels, and the secret remains yours to keep."],["Thunderhawk Gunner","You served as gunner aboard a Thunderhawk and gained an unusual perspective on war in the air, on the ground, and in void operations."],["The Lion and the Wolf","You fought a ritual duel with a Space Wolf while serving alongside the Chapter and won distinction—and perhaps a lasting grudge."]],"space-wolves":[["Bitter Vengeance","You fought face-to-face with Thousand Sons Chaos Space Marines, one of the Space Wolves’ most hated enemies."],["Fenris Hunter","You hunted and slew one of Fenris’s deadly native beasts, such as a kraken, ice bear, or Fenrisian wolf."],["Service in the Fleet","You fought repeatedly among the stars and may have commanded a rapid strike vessel or served as an officer aboard a larger ship."],["Wolf-Tamer","You once fought beside a powerful Fenrisian wolf that you had tamed as a trusted battle companion."],["The Great Hunt","You took part in one of the Great Hunts seeking signs of Leman Russ and returned with stories of distant worlds and hard battles."]],"storm-wardens":[["Sole Survivor","You were the only survivor of your squad after facing a particularly dangerous enemy, learning first-hand that even Astartes can fall."],["Tank Gunner","You served as gunner in a Predator, Land Raider, or other Chapter vehicle and know the machine-spirits of armoured warfare well."],["Service in the Fleet","You fought repeatedly in void operations and may have commanded a rapid strike vessel or served as an officer aboard a larger ship."],["The Scouring of Vigil","You bear scars from the campaign against the Slaugth and the savage close-quarter fighting beneath Vigil."],["Honour Preserved","You helped a fellow Battle-Brother preserve his honour when chance, duty, or conflicting oaths threatened it."]],"ultramarines":[["Tyrannic War Veteran","You fought in the Battle for Macragge against Hive Fleet Behemoth and survived the costly defence."],["Cleansed Thrax","You helped defeat daemonic forces on the Chaos-corrupted Forge World of Thrax before the world was condemned."],["Endured the Waaagh!","You stood with the Ultramarines against Waaagh! Gutshredda and fought repeated greenskin assaults."],["Banner Bearer","You were entrusted with a squad or company standard, an honour relinquished only when you joined the Deathwatch."],["Scout Sergeant","You once led and mentored Scouts of the Tenth Company on their path toward full Battle-Brother status."]],"raven-guard":[["Targus VIII","You served in Shrike’s campaign on Targus VIII. After your extraction craft was destroyed, you spent an extended period conducting guerrilla operations behind Ork lines; that performance helped earn your Deathwatch secondment."],["Operation Chronos","You witnessed Battle-Brothers fall under Enslaver domination during Operation Chronos and retain a bitter grievance toward the White Scars for failing to intervene."],["Covert Strike","You led a small Raven Guard force deep behind enemy lines and broke an entrenched foe through stealth and assassination. Allied Imperial Fists helped recommend you for secondment."],["The Fall of Voldorius","You fought beside White Scars during the final hunt for the daemon prince Voldorius. Shared victory softened an older Chapter rivalry, at least in your eyes."],["Survivor","Your covert force was dropped into a heavily contested war zone and its landing site was destroyed. You alone survived and carry a memento of your fallen brothers."]]},"generalPasts":[{"name":"Distinguished Service","summary":"You were selected for the Deathwatch after accomplishing an unusually difficult task for your Chapter."},{"name":"Slayer of a Dangerous Foe","summary":"Your reputation was forged by defeating an enemy considered exceptionally dangerous even by Astartes standards."},{"name":"Last Brother Standing","summary":"You survived an assault or disaster that destroyed or crippled the rest of your force, and your conduct drew the attention of your superiors."},{"name":"Defender of the Imperium","summary":"You were wounded or distinguished yourself holding an important objective or protecting an Imperial commander or other vital asset."},{"name":"Exile or Atonement","summary":"Your secondment is partly a test: service in the Deathwatch is intended to teach humility, redeem a failure, or settle a matter of honour."}],"rgAdvances":[["Concealment",200,"Skill",""],["Concealment +10",300,"Skill","Concealment"],["Concealment +20",300,"Skill","Concealment +10"],["Silent Move",200,"Skill",""],["Silent Move +10",300,"Skill","Silent Move"],["Silent Move +20",300,"Skill","Silent Move +10"],["Tactics (Recon and Stealth)",200,"Skill",""],["Tactics (Recon and Stealth) +10",300,"Skill","Tactics (Recon and Stealth)"],["Tactics (Recon and Stealth) +20",300,"Skill","Tactics (Recon and Stealth) +10"],["Guerrilla Training",400,"Talent",""],["Hatred (Traitor Legions)",200,"Talent",""],["Hard Target",500,"Talent","Ag 40"],["Sure Strike",500,"Talent","WS 30"]],"advRules":{"Air of Authority":{"kind":"Talent","prereq":"Fel 30","mechanics":"After a successful Command Tes function coreTest(target,opts={}){let roll=opts.roll||d100roll();let t=Number(target);let r=degrees(t,roll);if(opts.focusPower&&roll>=91)r={success:false,degrees:Math.floor((roll-t)/10)};if(opts.autoFailAt&&roll>=opts.autoFailAt)r={success:false,degrees:Math.floor(Math.max(0,roll-t)/10)};return {roll,target:t,...r}}

function modal(html,opts={}){modalReturnFocus=document.activeElement;let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalBack" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.label||'Dialog')}"><button class="modalX" aria-label="Close">×</button>${html}</div></div>`;let box=root.querySelector('.modal');root.querySelector('.modalX').onclick=closeModal;root.querySelector('.modalBack').onclick=e=>{if(e.target===e.currentTarget)closeModal()};box.addEventListener('keydown',trapModal);setTimeout(()=>{let f=box.querySelector('button,input,select,textarea,[tabindex]:not([tabindex="-1"])');f?.focus()},0)}

function renderHome(){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Astartes Vigil Companion · ${DISPLAY_VERSION}</div><h1>Your Watch Begins Here</h1><p>One-file Deathwatch campaign companion for character creation, advancement, missions, wargear, combat, Kill-team Cohesion, psychic powers and GM encounters.</p></section><div class="grid"><div class="card"><h2>Create Battle-Brother</h2><p class="small">Core-grounded seven-stage character creation. Chapter mechanics are only enabled where sourced rules are loaded.</p><button class="btn primary" id="homeCreate">CREATE</button></div><div class="card"><h2>Import Existing Vigil</h2><p class="small">Restore a device-local save exported from this app.</p><button class="btn" id="homeImport">IMPORT JSON</button></div></div><div class="card"><h2>Rules integrity</h2><p class="small">Fresh installs begin neutral. Unsupported supplement Chapters remain visible as references but cannot silently invent mechanics.</p></div>`;document.getElementById('homeCreate').onclick=startCreation;document.getElementById('homeImport').onclick=importState}
