function saveIdentity(c){for(let [id,k] of [['bn','name'],['ba','appearance'],['bp','past'],['bh','armourHistory'],['bd','demeanour']]){let e=document.getElementById(id);if(e)c[k]=e.value}}
function wireCreate(c,st){document.getElementById('back').onclick=()=>{saveIdentity(c);c.builder.step=Math.max(1,st-1);save();renderCreate()};document.getElementById('next').onclick=()=>{saveIdentity(c);c.builder.step=Math.min(9,st+1);save();renderCreate()};document.getElementById('method')?.addEventListener('change',e=>{c.builder.method=e.target.value;if(e.target.value==='points'){CHARS.forEach(k=>c.characteristics[k]=30);c.builder.rolls={};c.builder.rerollUsed=false}else{CHARS.forEach(k=>c.characteristics[k]=40)}save();renderCreate()});document.querySelectorAll('[data-roll-char]').forEach(b=>b.onclick=()=>{let k=b.dataset.rollChar;if(c.builder.rolls[k]&&c.builder.rerollUsed)return showToast('The one reroll has already been used');let r=30+1+Math.floor(Math.random()*10)+1+Math.floor(Math.random()*10);if(c.builder.rolls[k])c.builder.rerollUsed=true;c.builder.rolls[k]=r;c.characteristics[k]=r;save();renderCreate()});document.querySelectorAll('[data-point-char]').forEach(i=>i.onchange=()=>{let old=c.characteristics[i.dataset.pointChar],v=Math.max(30,Math.min(50,Number(i.value||30)));let spent=CHARS.reduce((n,k)=>n+Math.max(0,c.characteristics[k]-30),0)-Math.max(0,old-30)+Math.max(0,v-30);if(spent>100){showToast('That would exceed the 100-point pool');return renderCreate()}c.characteristics[i.dataset.pointChar]=v;save();renderCreate()});document.querySelectorAll('[data-read-ch]').forEach(b=>b.onclick=e=>{e.stopPropagation();inspect(chapter(b.dataset.readCh))});document.querySelectorAll('[data-choose-ch]').forEach(b=>b.onclick=e=>{if(e.target.dataset.readCh)return;c.chapter=b.dataset.chooseCh;c.chapterChoiceMods=[];let x=chapter(c.chapter);c.demeanour=x?.demeanour||c.demeanour;save();applyAppearance();renderCreate()});document.querySelectorAll('[data-umod]').forEach(b=>b.onclick=()=>{let k=b.dataset.umod;if(c.chapterChoiceMods.includes(k))c.chapterChoiceMods=c.chapterChoiceMods.filter(x=>x!==k);else if(c.chapterChoiceMods.length<2)c.chapterChoiceMods.push(k);else showToast('Choose exactly two Characteristics');save();renderCreate()});document.querySelectorAll('[data-read-sp]').forEach(b=>b.onclick=e=>{e.stopPropagation();inspect(spec(b.dataset.readSp))});document.querySelectorAll('[data-choose-sp]').forEach(b=>b.onclick=e=>{if(e.target.dataset.readSp)return;if(b.dataset.blocked==='1')return inspect(spec(b.dataset.chooseSp));c.speciality=b.dataset.chooseSp;let s=spec(c.speciality);c.psyRating=s?.psyRating||0;save();renderCreate()});document.getElementById('rw')?.addEventListener('click',()=>{let x=18+1+Math.floor(Math.random()*5)+(chapter(c.chapter)?.woundsBonus||0);c.wounds={max:x,current:x};c.builder.woundsRolled=true;save();renderCreate()});document.getElementById('rf')?.addEventListener('click',()=>{let r=1+Math.floor(Math.random()*10),x=r<=7?3:r<=9?4:5;c.fate={max:x,current:x};c.builder.fateRolled=true;save();renderCreate()});document.querySelectorAll('[data-record]').forEach(el=>el.onclick=()=>inspect([...DATA.talents,...DATA.traits,...DATA.implants].find(x=>x.id===el.dataset.record)));document.querySelectorAll('[data-read-arm]').forEach(b=>b.onclick=e=>{e.stopPropagation();inspect(armour(b.dataset.readArm))});document.querySelectorAll('[data-armour]').forEach(b=>b.onclick=e=>{if(e.target.dataset.readArm)return;c.armour=b.dataset.armour;save();renderCreate()});document.getElementById('finish')?.addEventListener('click',()=>{saveIdentity(c);c.builder.completed=true;c.rank=1;c.xpAvailable=1000;c.xpSpent=0;if(c.speciality==='librarian'&&!c.psychic.length)c.psychic=['Inspire'];save();state.view='sheet';state.sheetTab='sheet';save();applyAppearance();render()})}
function renderMission(){let m=state.mission;let leader=state.characters.find(c=>c.id===m.leaderId);let computed=leader?Math.max(0,bonus(leader,'Fel')+leader.rank):0;if(m.cohesion.max===0&&computed){m.cohesion.max=computed;m.cohesion.current=computed}document.getElementById('app').innerHTML=`<div class="card"><div class="eyebrow">Mission Console</div><h2>${esc(m.name||'Unnamed Operation')}</h2><div class="field"><label>Name</label><input id="mn" value="${esc(m.name)}"></div><div class="calcrow"><div class="field"><label>Status</label><select id="ms">${['Planning','Active','Complete'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Squad Leader</label><select id="ml"><option value="">None</option>${state.characters.map(c=>`<option value="${c.id}" ${m.leaderId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="resources"><div class="resource"><small>Cohesion</small><b>${m.cohesion.current}/${m.cohesion.max}</b><div class="rctl"><button id="cm">−</button><button id="cp">+</button></div></div><div class="resource"><small>Leader Formula</small><b>${leader?computed:'—'}</b><small>Fel Bonus + Rank</small></div><div class="resource"><small>Requisition</small><b>${m.requisition}</b><div class="rctl"><button id="rqm">−</button><button id="rqp">+</button></div></div></div><div class="field"><label>Oath</label><select id="mo"><option value="">None selected</option>${DATA.oaths.map(x=>`<option value="${x.name}" ${m.oath===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${m.oath?`<div class="notice"><span class="link" id="oathInfo">${esc(m.oath)}</span> — ${esc(DATA.oaths.find(x=>x.name===m.oath)?.summary||'')}</div>`:''}</div>${section('◎','Objectives','Primary, Secondary, Tertiary, or custom Mission goals.',`<button class="btn" id="addObj">Add objective</button>${m.objectives.map((x,i)=>`<div class="listrow"><input type="checkbox" data-obj="${i}" ${x.done?'checked':''} style="width:auto"><div class="grow"><b>${esc(x.tier)}</b> — ${esc(x.text)}</div><button class="btn danger" data-del-obj="${i}">×</button></div>`).join('')||'<div class="empty">No objectives recorded.</div>'}`)}${section('✎','Mission Notes','Briefing, complications, clues, and table reminders.',`<textarea id="mnotes">${esc(m.notes)}</textarea>`,false)}`;document.getElementById('mn').onchange=e=>{m.name=e.target.value;save()};document.getElementById('ms').onchange=e=>{m.status=e.target.value;save();renderMission()};document.getElementById('ml').onchange=e=>{m.leaderId=e.target.value;let l=state.characters.find(c=>c.id===m.leaderId);if(l){let x=bonus(l,'Fel')+l.rank;m.cohesion={max:x,current:x}}save();renderMission()};document.getElementById('mo').onchange=e=>{m.oath=e.target.value;save();renderMission()};document.getElementById('oathInfo')?.addEventListener('click',()=>inspect(DATA.oaths.find(x=>x.name===m.oath)));document.getElementById('cm').onclick=()=>{m.cohesion.current=Math.max(0,m.cohesion.current-1);save();renderMission()};document.getElementById('cp').onclick=()=>{m.cohesion.current=Math.min(m.cohesion.max,m.cohesion.current+1);save();renderMission()};document.getElementById('rqm').onclick=()=>{m.requisition=Math.max(0,m.requisition-1);save();renderMission()};document.getElementById('rqp').onclick=()=>{m.requisition++;save();renderMission()};document.getElementById('mnotes').onchange=e=>{m.notes=e.target.value;save()};document.getElementById('addObj').onclick=()=>modal('Add Mission Objective',`<div class="field"><label>Tier</label><select id="ot"><option>Primary</option><option>Secondary</option><option>Tertiary</option><option>Custom</option></select></div><div class="field"><label>Objective</label><input id="ox"></div><button class="btn primary" id="os">Save</button>`,(b,mm)=>mm.querySelector('#os').onclick=()=>{m.objectives.push({tier:mm.querySelector('#ot').value,text:mm.querySelector('#ox').value||'Objective',done:false});save();b.remove();renderMission()});document.querySelectorAll('[data-obj]').forEach(x=>x.onchange=()=>{m.objectives[Number(x.dataset.obj)].done=x.checked;save()});document.querySelectorAll('[data-del-obj]').forEach(x=>x.onclick=()=>{m.objectives.splice(Number(x.dataset.delObj),1);save();renderMission()})}
function renderLibrary(){let all=[...DATA.rules,...DATA.skills,...DATA.talents,...DATA.traits,...DATA.implants,...DATA.armours,...DATA.cybernetics,...DATA.psychic,...DATA.solo,...DATA.squad,...DATA.oaths,...DATA.chapters,...state.homebrew].map(x=>({...x,category:x.category||'Chapter'}));let cats=['All',...new Set(all.map(x=>x.category))].sort();document.getElementById('app').innerHTML=`<div class="card"><h2>Data Librarium</h2><p class="small">Searchable player/GM reference. Descriptions are concise summaries rather than reproductions of the books. Every record is locally editable without destroying the source layer.</p><div class="searchbar"><input id="lq" placeholder="Search rules, Skills, Chapters, armour, psychic powers…"><select id="lc">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="small" id="count"></div></div><div id="results"></div>`;function go(){let q=document.getElementById('lq').value.toLowerCase(),cat=document.getElementById('lc').value,rows=all.filter(x=>(cat==='All'||x.category===cat)&&(!q||`${x.name} ${x.summary||''} ${x.category} ${x.source||''}`.toLowerCase().includes(q)));document.getElementById('count').textContent=`${rows.length} reference entries`;document.getElementById('results').innerHTML=rows.map((x,i)=>`<div class="card"><div class="eyebrow">${esc(x.category)} • ${esc(x.source||'Reference')}</div><span class="link" data-li="${i}"><b>${esc(x.name)}</b></span><div class="small">${esc(x.summary||'')}</div></div>`).join('');document.querySelectorAll('[data-li]').forEach(el=>el.onclick=()=>inspect(rows[Number(el.dataset.li)]))}document.getElementById('lq').oninput=go;document.getElementById('lc').onchange=go;go()}
function renderRoster(){document.getElementById('app').innerHTML=`<div class="card"><div class="row between"><div><h2>Battle-Brother Roster</h2><div class="small">Multiple characters are stored on this device.</div></div><button class="btn primary" id="newC">New</button></div></div>${state.characters.map(c=>`<div class="card"><div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="small">${esc(chapter(c.chapter)?.name||'No Chapter')} • ${esc(spec(c.speciality)?.name||'No Speciality')} • Rank ${c.rank}</div><div><span class="tag">W ${c.wounds.current}/${c.wounds.max}</span><span class="tag">F ${c.fate.current}/${c.fate.max}</span><span class="tag">Fat ${c.fatigue}</span></div></div><button class="btn" data-open="${c.id}">${c.id===state.activeCharacter?'Active':'Open'}</button><button class="btn" data-clone="${c.id}">Duplicate</button><button class="btn danger" data-delete="${c.id}">Delete</button></div></div>`).join('')}`;document.getElementById('newC').onclick=()=>{let c=DEFAULT_CHAR();state.characters.push(c);state.activeCharacter=c.id;state.view='create';save();applyAppearance();render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.activeCharacter=b.dataset.open;state.view='sheet';save();applyAppearance();render()});document.querySelectorAll('[data-clone]').forEach(b=>b.onclick=()=>{let c=deep(state.characters.find(x=>x.id===b.dataset.clone));c.id=uid();c.name+=' Copy';state.characters.push(c);state.activeCharacter=c.id;save();renderRoster()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(state.characters.length<=1)return showToast('Keep at least one character');if(!confirm('Delete this character from this device?'))return;state.characters=state.characters.filter(x=>x.id!==b.dataset.delete);if(!state.characters.some(x=>x.id===state.activeCharacter))state.activeCharacter=state.characters[0].id;save();applyAppearance();renderRoster()})}
function renderGMHome(){let m=state.mission;document.getElementById('app').innerHTML=`<div class="card"><div class="eyebrow">Game Master Command Console</div><h2>${esc(m.name||'Current Operation')}</h2><p class="small">Fast access to players, Mission state, encounter timing, rules, and NPC profiles.</p><div class="modepill"><button id="pview">Player</button><button class="active">Game Master</button></div></div><div class="gmgrid"><div class="gmtool"><b>Mission</b><div class="small">${esc(m.status)} • Cohesion ${m.cohesion.current}/${m.cohesion.max}</div><button class="btn" data-jump="mission">Open</button></div><div class="gmtool"><b>Encounter</b><div class="small">Round ${state.encounter.round} • ${state.encounter.combatants.length} combatants</div><button class="btn" data-jump="encounter">Run</button></div><div class="gmtool"><b>Players</b><div class="small">${state.characters.length} Battle-Brother${state.characters.length===1?'':'s'}</div><button class="btn" data-jump="roster">Roster</button></div><div class="gmtool"><b>Rules</b><div class="small">Search the same reference cards the players see.</div><button class="btn" data-jump="library">Librarium</button></div></div>${section('☷','Player Resource Monitor','GM-side resource controls stay on the same device state as the player sheet.',state.characters.map(c=>`<div class="listrow"><div class="grow"><b>${esc(c.name)}</b><div class="small">${esc(chapter(c.chapter)?.name||'No Chapter')} • ${esc(spec(c.speciality)?.name||'No Speciality')}</div></div><span class="tag">W ${c.wounds.current}/${c.wounds.max}</span><span class="tag">F ${c.fate.current}/${c.fate.max}</span><button class="btn" data-gmchar="${c.id}">Manage</button></div>`).join(''))}${section('±','Difficulty Ladder','Core Test modifiers from +60 through -60.',DATA.difficulty.map(([n,v])=>`<div class="listrow"><span>${n}</span><div class="grow"></div><b>${v>=0?'+':''}${v}</b></div>`).join(''),false)}${section('⚠','Fear, Insanity & Corruption','Quick reminders for mental/spiritual pressure.',DATA.rules.filter(x=>['Fear','Insanity','Corruption'].includes(x.name)).map(x=>`<div class="listrow"><div class="grow"><span class="link" data-record="${x.id}">${x.name}</span><div class="small">${x.summary}</div></div></div>`).join(''),false)}`;document.getElementById('pview').onclick=()=>switchRole('player');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>setView(b.dataset.jump));document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>inspect(DATA.rules.find(x=>x.id===b.dataset.record)));document.querySelectorAll('[data-gmchar]').forEach(b=>b.onclick=()=>gmManageChar(state.characters.find(x=>x.id===b.dataset.gmchar)))}
function gmManageChar(c){modal('GM — '+c.name,`<div class="resources">${resource('Wounds','wounds',c.wounds)}${resource('Fate','fate',c.fate)}<div class="resource"><small>Fatigue</small><b>${c.fatigue}</b><div class="rctl"><button data-gnum="fatigue" data-d="-1">−</button><button data-gnum="fatigue" data-d="1">+</button></div></div></div><div class="field"><label>Renown</label><input id="gren" type="number" value="${c.renown}"></div><div class="field"><label>XP Available</label><input id="gxp" type="number" value="${c.xpAvailable}"></div><button class="btn primary" id="gdone">Save</button>`,(b,m)=>{m.querySelectorAll('[data-res]').forEach(el=>el.onclick=()=>{let o=c[el.dataset.res],d=Number(el.dataset.d);o.current=Math.max(0,Math.min(o.max,o.current+d));m.querySelector(`[data-res="${el.dataset.res}"]`).closest('.resource').querySelector('b').textContent=`${o.current}/${o.max}`});m.querySelectorAll('[data-gnum]').forEach(el=>el.onclick=()=>{c[el.dataset.gnum]=Math.max(0,Number(c[el.dataset.gnum]||0)+Number(el.dataset.d));el.closest('.resource').querySelector('b').textContent=c[el.dataset.gnum]});m.querySelector('#gdone').onclick=()=>{c.renown=Number(m.querySelector('#gren').value||0);c.xpAvailable=Number(m.querySelector('#gxp').value||0);save();b.remove();renderGMHome()}})}
function renderEncounter(){let e=state.encounter;document.getElementById('app').innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">Encounter Tracker</div><h2>Round ${e.round}</h2></div><div><button class="btn" id="rm">−</button><button class="btn primary" id="rp">+</button></div></div><button class="btn primary" id="addCombatant">Add Combatant</button></div>${e.combatants.map((x,i)=>`<div class="card"><div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="small">Initiative ${x.init} • ${esc(x.kind)}${x.notes?` • ${esc(x.notes)}`:''}</div></div><span class="tag">${x.kind==='Horde'?'Magnitude':'Wounds'} ${x.current}/${x.max}</span><button class="btn" data-edc="${i}">Edit</button><button class="btn danger" data-dc="${i}">×</button></div></div>`).join('')||'<div class="empty">No combatants yet.</div>'}`;document.getElementById('rm').onclick=()=>{e.round=Math.max(1,e.round-1);save();renderEncounter()};document.getElementById('rp').onclick=()=>{e.round++;save();renderEncounter()};document.getElementById('addCombatant').onclick=()=>editCombatant();document.querySelectorAll('[data-edc]').forEach(b=>b.onclick=()=>editCombatant(Number(b.dataset.edc)));document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{e.combatants.splice(Number(b.dataset.dc),1);save();renderEncounter()})}
function editCombatant(i=null){let e=state.encounter,x=i===null?{name:'',kind:'NPC',init:0,max:10,current:10,notes:''}:deep(e.combatants[i]);modal(i===null?'Add Combatant':'Edit Combatant',`<div class="field"><label>Name</label><input id="ecn" value="${esc(x.name)}"></div><div class="field"><label>Kind</label><select id="eck">${['Player Character','NPC','Troop','Elite','Master','Horde'].map(k=>`<option ${x.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Initiative</label><input id="eci" type="number" value="${x.init}"></div><div class="calcrow"><div class="field"><label>Maximum Wounds / Magnitude</label><input id="ecm" type="number" value="${x.max}"></div><div class="field"><label>Current</label><input id="ecc" type="number" value="${x.current}"></div></div><div class="field"><label>Conditions / notes</label><textarea id="ecx">${esc(x.notes)}</textarea></div><button class="btn primary" id="ecs">Save</button>`,(b,m)=>m.querySelector('#ecs').onclick=()=>{x={name:m.querySelector('#ecn').value||'Combatant',kind:m.querySelector('#eck').value,init:Number(m.querySelector('#eci').value||0),max:Number(m.querySelector('#ecm').value||0),current:Number(m.querySelector('#ecc').value||0),notes:m.querySelector('#ecx').value};if(i===null)e.combatants.push(x);else e.combatants[i]=x;e.combatants.sort((a,b)=>b.init-a.init);save();b.remove();renderEncounter()})}
function renderProfiles(){document.getElementById('app').innerHTML=`<div class="card"><h2>GM Profiles</h2><p class="small">NPC profiles track the nine Characteristics, Wounds/Magnitude, Skills, Talents, Traits, armour notes, and special rules. Equipment details remain free-form.</p><button class="btn primary" id="newP">New Profile</button></div>${state.gmProfiles.map((x,i)=>`<div class="card"><div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="small">${esc(x.tier)} • ${x.wounds} Wounds</div></div><button class="btn" data-pe="${i}">Edit</button><button class="btn danger" data-pd="${i}">×</button></div></div>`).join('')||'<div class="empty">No saved profiles.</div>'}`;document.getElementById('newP').onclick=()=>profileEdit();document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>profileEdit(Number(b.dataset.pe)));document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{state.gmProfiles.splice(Number(b.dataset.pd),1);save();renderProfiles()})}
function profileEdit(i=null){let x=i===null?{name:'',tier:'Troop',wounds:10,chars:Object.fromEntries(CHARS.map(k=>[k,30])),skills:'',talents:'',traits:'',armour:'',rules:'',notes:''}:deep(state.gmProfiles[i]);modal(i===null?'Create GM Profile':'Edit GM Profile',`<div class="field"><label>Name</label><input id="pn" value="${esc(x.name)}"></div><div class="calcrow"><div class="field"><label>Tier</label><select id="pt">${['Troop','Elite','Master','NPC','Horde','Homebrew'].map(t=>`<option ${x.tier===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Wounds / Magnitude</label><input id="pw" type="number" value="${x.wounds}"></div></div><div class="chars">${CHARS.map(k=>`<div class="char" style="cursor:default"><small>${k}</small><input data-pchar="${k}" type="number" value="${x.chars[k]}"></div>`).join('')}</div>${[['Skills','skills'],['Talents','talents'],['Traits','traits'],['Armour','armour'],['Special Rules','rules'],['Notes / Equipment','notes']].map(([lab,k])=>`<div class="field"><label>${lab}</label><textarea data-pf="${k}">${esc(x[k])}</textarea></div>`).join('')}<button class="btn primary" id="ps">Save</button>`,(b,m)=>m.querySelector('#ps').onclick=()=>{x.name=m.querySelector('#pn').value||'Unnamed Profile';x.tier=m.querySelector('#pt').value;x.wounds=Number(m.querySelector('#pw').value||0);m.querySelectorAll('[data-pchar]').forEach(el=>x.chars[el.dataset.pchar]=Number(el.value||0));m.querySelectorAll('[data-pf]').forEach(el=>x[el.dataset.pf]=el.value);if(i===null)state.gmProfiles.push(x);else state.gmProfiles[i]=x;save();b.remove();renderProfiles()})}
function renderMenu(){let counts={Chapters:DATA.chapters.length,Specialities:DATA.specialities.length,Skills:DATA.skills.length,Talents:DATA.talents.length,Traits:DATA.traits.length,Implants:DATA.implants.length,Armour:DATA.armours.length,Cybernetics:DATA.cybernetics.length,'Psychic Powers':DATA.psychic.length,'Mode Abilities':DATA.solo.length+DATA.squad.length,'Core/GM Rules':DATA.rules.length};document.getElementById('app').innerHTML=`<div class="card"><h2>Settings & Data</h2><div class="eyebrow">Interface role</div><div class="choicegrid"><button class="choice ${state.role==='player'?'selected':''}" id="roleP"><b>Player</b><div class="small">Character-first sheet, rolls, advancement, Mission and rules lookup.</div></button><button class="choice ${state.role==='gm'?'selected':''}" id="roleG"><b>Game Master</b><div class="small">Command console, player resources, Mission, encounters, profiles and quick reference.</div></button></div><br><div class="eyebrow">Surface</div><div class="choicegrid"><button class="choice ${state.surface==='parchment'?'selected':''}" id="surfP"><b>Parchment</b><div class="small">Warm sourcebook-inspired presentation.</div></button><button class="choice ${state.surface==='iron'?'selected':''}" id="surfI"><b>Cold Iron</b><div class="small">Blackened steel and tactical archive presentation.</div></button></div><br><div class="eyebrow">Heraldry</div><div class="small">Auto follows the active character. Manual selection lets a whole campaign use one visual identity.</div><div class="skin-grid">${[['auto','Auto — Active Chapter',null],['deathwatch','Deathwatch',['#111316','#aeb4b7','#8d272d']],...DATA.chapters.map(x=>[x.id,x.name,x.colors])].map(([id,n,cs])=>`<button class="skin ${state.skin===id?'selected':''}" data-skin="${id}"><div class="swatch" style="background:${cs?`linear-gradient(90deg,${cs.join(',')})`:'linear-gradient(90deg,var(--accent),var(--accent2))'}"></div><b>${esc(n)}</b></button>`).join('')}</div></div><div class="card"><h2>Coverage Audit</h2><div class="coverage">${Object.entries(counts).map(([k,v])=>`<div class="cov"><b>${v}</b><span class="small">${esc(k)}</span></div>`).join('')}</div><div class="notice"><span class="statusdot ok"></span><b>Core mechanics layer:</b> Character creation, Skills, baseline Astartes abilities, implants, armour, psychic framework, advancement, Solo/Squad Mode, Cohesion, Missions, GM tools and reference cards are implemented.<br><span class="statusdot warn"></span><b>Supplement mechanics:</b> Raven Guard uses supplied pages. Imperial Fists, Iron Hands, Salamanders and White Scars have official visual/lore profiles but do not invent unpublished-to-this-session exact modifiers.</div></div><div class="card"><h2>Homebrew & Overrides</h2><p class="small">Core/reference records can receive device-local notes without destroying the source layer. New custom rules can also be created.</p><button class="btn" id="newRule">New custom rule</button> <button class="btn" id="mods">Character modifiers</button></div><div class="card"><h2>Backup & Diagnostics</h2><button class="btn" id="export">Export Save</button> <button class="btn" id="import">Import Save</button> <input id="importFile" type="file" accept="application/json,.json" hidden> <button class="btn" id="tests">Run Self-Test</button><div id="testOut" class="small"></div></div><div class="card"><div class="eyebrow">About</div><p><b>Adeptus Astartes Vigil Index</b> v${VERSION}</p><p class="small">Single-file, device-local tabletop companion. The interface follows a universal-header + grouped combat/skills/abilities/advancement approach inspired by mature VTT character sheets, while reference text is summarised rather than copied from sourcebooks. Official supplement availability is identified separately from mechanics actually present in supplied sources.</p></div>`;document.getElementById('roleP').onclick=()=>switchRole('player');document.getElementById('roleG').onclick=()=>switchRole('gm');document.getElementById('surfP').onclick=()=>{state.surface='parchment';save();applyAppearance();renderMenu()};document.getElementById('surfI').onclick=()=>{state.surface='iron';save();applyAppearance();renderMenu()};document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.skin=b.dataset.skin;save();applyAppearance();renderMenu()});document.getElementById('newRule').onclick=()=>customRule();document.getElementById('mods').onclick=()=>customModifiers(active());document.getElementById('export').onclick=exportSave;document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=importSave;document.getElementById('tests').onclick=()=>runTests()}
function customRule(){modal('New Custom Rule',`<div class="field"><label>Name</label><input id="hrn"></div><div class="field"><label>Category</label><input id="hrc" value="Homebrew"></div><div class="field"><label>Summary / mechanical effect</label><textarea id="hrs"></textarea></div><button class="btn primary" id="hrsave">Save</button>`,(b,m)=>m.querySelector('#hrsave').onclick=()=>{state.homebrew.push({id:'hb-'+uid(),name:m.querySelector('#hrn').value||'Custom Rule',category:m.querySelector('#hrc').value||'Homebrew',summary:m.querySelector('#hrs').value,source:'Homebrew'});save();b.remove();showToast('Custom rule added')})}
function customModifiers(c){modal('Custom Character Modifiers',`<div class="notice">Use this for house rules or supplement mechanics you enter from an owned source. Each modifier is traceable in the Characteristic breakdown and can be disabled or removed.</div>${(c.customModifiers||[]).map((x,i)=>`<div class="listrow"><input type="checkbox" data-me="${i}" ${x.enabled!==false?'checked':''} style="width:auto"><div class="grow"><b>${x.target} ${x.amount>=0?'+':''}${x.amount}</b><div class="small">${esc(x.label)}</div></div><button class="btn danger" data-md="${i}">×</button></div>`).join('')}<div class="calcrow"><div class="field"><label>Characteristic</label><select id="mt">${CHARS.map(k=>`<option>${k}</option>`).join('')}</select></div><div class="field"><label>Modifier</label><input id="ma" type="number" value="0"></div></div><div class="field"><label>Source / reason</label><input id="mlab"></div><button class="btn primary" id="madd">Add</button>`,(b,m)=>{m.querySelectorAll('[data-me]').forEach(el=>el.onchange=()=>{c.customModifiers[Number(el.dataset.me)].enabled=el.checked;save()});m.querySelectorAll('[data-md]').forEach(el=>el.onclick=()=>{c.customModifiers.splice(Number(el.dataset.md),1);save();b.remove();customModifiers(c)});m.querySelector('#madd').onclick=()=>{c.customModifiers.push({target:m.querySelector('#mt').value,amount:Number(m.querySelector('#ma').value||0),label:m.querySelector('#mlab').value||'Custom modifier',enabled:true});save();b.remove();customModifiers(c)}})}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astartes-field-codex-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importSave(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.characters))throw Error();state=normalizeState(x);save();applyAppearance();render();showToast('Save imported')}catch(err){showToast('Import failed: invalid save')}};r.readAsText(f)}
function runTests(){let t=[];function test(n,f){try{t.push([n,!!f()])}catch(e){t.push([n,false])}}test('State saves',()=>save());test('Active character resolves',()=>!!active());test('9 Characteristics',()=>CHARS.length===9);test('43 Skills indexed',()=>DATA.skills.length>=43);test('11 Chapter profiles plus custom',()=>DATA.chapters.length>=12);test('6 Core Specialities',()=>DATA.specialities.length===6);test('19 Astartes implants',()=>DATA.implants.length===19);test('4 Astartes armour profiles',()=>DATA.armours.length===4);test('Difficulty +60 to -60',()=>DATA.difficulty[0][1]===60&&DATA.difficulty.at(-1)[1]===-60);test('Derived Strength applies power armour',()=>{let c=deep(DEFAULT_CHAR());c.armour='power-armour';return derivedChar(c,'S')===60});test('Unnatural Strength doubles Bonus',()=>{let c=deep(DEFAULT_CHAR());c.armour='power-armour';return bonus(c,'S')===12});test('Untrained Basic halves characteristic',()=>{let c=deep(DEFAULT_CHAR()),s=skillDef('Charm');return skillTarget(c,s)===20});test('Untrained Advanced unavailable',()=>{let c=deep(DEFAULT_CHAR()),s=skillDef('Medicae');return skillTarget(c,s)===null});test('Theme/skin resolves',()=>!!resolvedSkin());test('Modal engine exists',()=>typeof modal==='function');test('d100 difficulty ladder complete',()=>DATA.difficulty.length===13);test('Version is v5 family',()=>VERSION.startsWith('5.'));test('Chapter mode isolation',()=>DATA.squad.filter(x=>x.chapter==='Raven Guard').length===2);test('Shared Squad patterns separated',()=>DATA.squad.some(x=>!x.chapter));test('Store migrated to v5 namespace',()=>STORE==='astartes_field_codex_v5');test('Core Chapters have sourced mechanics',()=>DATA.chapters.filter(x=>x.rules==='core').every(x=>x.source&&x.page));test('Supplement gaps are explicit',()=>DATA.chapters.filter(x=>x.rules==='supplement-pending').every(x=>x.mods&&Object.keys(x.mods).length===0));test('Every speciality has a source page',()=>DATA.specialities.every(x=>x.source&&x.page));test('Armour records are present',()=>DATA.armours.every(x=>x.name&&x.summary));test('Cohesion rule indexed',()=>DATA.rules.some(x=>x.name==='Cohesion'));test('Horde rule indexed',()=>DATA.rules.some(x=>x.name==='Hordes'));test('Fate pools valid',()=>state.characters.every(c=>c.fate.current<=c.fate.max));test('Wound pools valid',()=>state.characters.every(c=>c.wounds.current<=c.wounds.max));document.getElementById('testOut').innerHTML=t.map(([n,ok])=>`<div class="${ok?'success':'failure'}">${ok?'✓':'✗'} ${esc(n)}</div>`).join('')}
function switchRole(r){state.role=r;state.view=r==='gm'?'gmhome':'sheet';save();render()}function render(){nav();let fn={sheet:renderSheet,create:renderCreate,mission:renderMission,library:renderLibrary,roster:renderRoster,gmhome:renderGMHome,encounter:renderEncounter,profiles:renderProfiles,menu:renderMenu}[state.view]||renderSheet;fn();applyAppearance()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});document.getElementById('modeBtn').onclick=()=>switchRole(state.role==='gm'?'player':'gm');document.getElementById('surfaceBtn').onclick=()=>{state.surface=state.surface==='iron'?'parchment':'iron';save();applyAppearance();render()};document.getElementById('quick').onclick=()=>{let c=active();openRoll('Quick d100',c?derivedChar(c,'WS'):50)};window.addEventListener('error',e=>{console.error(e.error||e.message);showToast('UI error caught — open Diagnostics if something stops responding')});render();

/* INDEX 5.0 rebuild stabilization layer */
(function(){
 const INDEX_BUILD='5.0';
 function safeNum(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
 window.Index5={
  build:INDEX_BUILD,
  clamp:(v,min,max)=>Math.min(max,Math.max(min,safeNum(v))),
  awardXP(amount,reason='GM Award'){
   const c=(typeof active==='function'?active():null); if(!c)return false;
   amount=Math.max(0,Math.floor(safeNum(amount))); c.xpAvailable=safeNum(c.xpAvailable)+amount;
   c.xpLedger=c.xpLedger||[]; c.xpLedger.unshift({type:'award',amount,reason,at:new Date().toISOString()});
   if(typeof save==='function')save(); if(typeof render==='function')render(); return true;
  },
  adjustWounds(delta){const c=(typeof active==='function'?active():null);if(!c)return false;c.wounds=c.wounds||{max:20,current:20};c.wounds.current=this.clamp(safeNum(c.wounds.current)+safeNum(delta),0,safeNum(c.wounds.max,20));if(typeof save==='function')save();if(typeof render==='function')render();return true;},
  diagnostics(){
   const checks={storage:!!window.localStorage,app:!!document.getElementById('app'),nav:!!document.getElementById('nav'),roller:typeof openRoll==='function',render:typeof render==='function',data:typeof DATA!=='undefined',characters:typeof state!=='undefined'&&Array.isArray(state.characters)};
   return checks;
  }
 };
 document.addEventListener('click',e=>{
   const el=e.target.closest('[data-index-action]'); if(!el)return;
   const a=el.dataset.indexAction;
   if(a==='wound-minus')Index5.adjustWounds(-1); if(a==='wound-plus')Index5.adjustWounds(1);
 });
})();
</script>

umns:repeat(2,1fr)!important}.chars{grid-template-columns:repeat(3,1fr)!important}}

function v51ChapterId(){try{return chapter(active()?.chapter)?.id||'ultramarines'}catch(e){return'ultramarines'}}
function v51Emblem(id){if(EMBLEMS[id])return `<img alt="${id} chapter emblem" src="${EMBLEMS[id]}">`;if(id==='storm-wardens')return `<span class="v51-storm">ϟ</span>`;return `<b>${(chapter(active()?.chapter)?.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2)}</b>`}
function v51ModeBar(){let c=active();if(!c||state.role==='gm')return'';return `<div class="v51-modebar"><button id="v51solo" class="${c.mode==='Solo'?'active':''}">SOLO MODE</button><button id="v51squad" class="${c.mode==='Squad'?'active':''}">SQUAD MODE</button></div>`}
function v51BindMode(){let c=active();if(!c)return;let a=document.getElementById('v51solo'),b=document.getElementById('v51squad');if(a)a.onclick=()=>{c.mode='Solo';save();render()};if(b)b.onclick=()=>{if((state.mission?.cohesion?.current||0)<1){showToast('Squad Mode normally requires at least 1 Cohesion and another Battle-Brother in Support Range.');return}c.mode='Squad';save();render()}}
const oldRender=render;render=function(){oldRender();let app=document.getElementById('app');if(app&&!document.querySelector('.v51-modebar')&&state.view==='sheet')app.insertAdjacentHTML('beforebegin',v51ModeBar());v51BindMode();v51D100()};

 let c=active(), ch=chapter(c?.chapter), a=armour(c?.armour);

 document.getElementById('app').innerHTML=`<div><div class="eyebrow">Chapter V • Core Reference</div><h1>Armoury</h1><p class="small">A mobile field reference for armour, protection, augmentations, mission equipment, Requisition and Renown. Records are kept tappable and readable rather than buried in character creation.</p></div>${current}${section('⬡','Armour & Protection','Compare the game profiles and inspect the armour currently worn.',`<div class="v51-arm-grid">${armourCards}</div>`)}${section('⚙','Cybernetics','Reference augmentations and keep installed systems visible on the Battle-Brother sheet.',`<div class="v51-arm-grid">${cyber}</div>`,false)}${section('✚','Astartes Implants','Quick-reference biological capabilities from character creation.',`<div class="v51-arm-grid">${implants}</div>`,false)}${section('R','Requisition & Renown','Mission access and standing are distinct resources. Requisition is used during mission preparation; Renown represents reputation and gates access to appropriate options.',`<div class="v51-cardlist"><div class="v51-cardrow"><b>Current Renown</b><div>${c?.renown||0}</div></div><div class="v51-cardrow"><b>Mission Requisition</b><div>${state.mission?.requisition||0}</div></div></div>`)}${section('▣','Mission Equipment','Carried non-weapon equipment remains editable on the character sheet so homebrew and campaign-specific items can coexist with Core records.',(c?.equipment||[]).map(x=>`<div class="v51-cardrow"><b>${esc(x.name)}</b><div class="small">${esc(x.notes||'')}</div></div>`).join('')||'<div class="empty">No mission equipment recorded.</div>')}`;

};

 if(__v52tab==='weapons') body=`<div class="v52-toolbar"><input id="v52search" placeholder="Search weapons, class, quality…"><select id="v52group"><option value="">All groups</option>${[...new Set(CORE_WEAPONS.map(x=>x.group))].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="v52-grid" id="v52weapons">${CORE_WEAPONS.map(w=>weaponCard(w,c)).join('')}</div>`;
 if(__v52tab==='armour') body=`<div class="v52-grid">${CORE_ARMOUR.map(a=>`<div class="v52-weapon"><div class="eyebrow">Armour</div><h3>${a.name}</h3><div class="v52-stats"><div class="v52-stat"><span>Locations</span><b>${a.locations}</b></div><div class="v52-stat"><span>AP</span><b>${a.ap}</b></div><div class="v52-stat"><span>kg</span><b>${a.kg}</b></div><div class="v52-stat"><span>Req</span><b>${a.req}</b></div></div><div class="small">Renown: ${a.renown}</div></div>`).join('')}</div>`;
 if(__v52tab==='upgrades') body=`<div class="v52-grid">${CORE_UPGRADES.map(x=>`<div class="v52-weapon"><div class="eyebrow">Weapon Upgrade</div><h3>${x}</h3><div class="small">Core Chapter V upgrade. Add it to a mission loadout after checking weapon compatibility.</div><button class="v52-equip" data-add-up="${x}">ADD TO LOADOUT</button></div>`).join('')}</div>`;
 if(__v52tab==='ammo') body=`<div class="v52-grid">${CORE_AMMO.map(x=>`<div class="v52-weapon"><div class="eyebrow">Special Issue Ammunition</div><h3>${x}</h3><div class="small">Tracked by clip. Pistol requisition cost is halved; Heavy Bolter special ammunition adds +5 Requisition.</div><button class="v52-equip" data-add-ammo="${x}">ADD CLIP</button></div>`).join('')}</div>`;
 if(__v52tab==='wargear') body=`${section('▣','Mission Wargear','General carried equipment remains part of the same Armoury rather than a separate inventory.',(c?.equipment||[]).map(x=>`<div class="v51-cardrow"><b>${esc(x.name)}</b><div class="small">${esc(x.notes||'')}</div></div>`).join('')||'<div class="empty">No mission wargear recorded.</div>')}`;
 if(__v52tab==='systems') body='<h2>Cybernetics</h2><div class="v52-grid">'+(DATA.cybernetics||[]).map(x=>'<div class="v52-weapon"><h3>'+esc(x.name)+'</h3><div class="small">'+esc(x.summary||'Cybernetic system')+'</div></div>').join('')+'</div><h2>Astartes Implants</h2><div class="v52-grid">'+(DATA.implants||[]).map(x=>'<div class="v52-weapon"><h3>'+esc(x.name)+'</h3><div class="small">'+esc(x.summary||'Astartes implant')+'</div></div>').join('')+'</div>';
 document.getElementById('app').innerHTML=`<div><div class="eyebrow">Chapter V • Armoury</div><h1>Armoury</h1><p class="small">Weapons, armour, ammunition, upgrades and mission wargear in one system. Requisition is mission-specific and Renown gates restricted issue.</p></div>
 <div class="v52-budget"><div><span>Mission Req</span><b>${missionReq}</b></div><div><span>Committed</span><b>${used}</b></div><div><span>Remaining</span><b>${remaining}</b></div></div>
 <div class="v51-banner"><b>Current loadout</b><div class="small">${c.armouryLoadout.weapons.length?c.armouryLoadout.weapons.map(esc).join(' • '):'No weapons requisitioned yet.'}</div></div>
 <div class="v52-arm-tabs">${tabs.map(([id,n])=>`<button data-v52tab="${id}" class="${__v52tab===id?'active':''}">${n}</button>`).join('')}</div>${body}`;
 document.querySelectorAll('[data-v52tab]').forEach(b=>b.onclick=()=>{__v52tab=b.dataset.v52tab;armoury()});
 document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let n=b.dataset.equip,w=CORE_WEAPONS.find(x=>x.name===n),i=c.armouryLoadout.weapons.indexOf(n);if(i>=0)c.armouryLoadout.weapons.splice(i,1);else{if(RENOWN_ORDER[w.renown]>renownRank(c)){showToast('Renown requirement not met.');return}if(Number.isFinite(w.req)&&reqUsed(c)+w.req>missionReq&&missionReq>0){showToast('Not enough mission Requisition remaining.');return}c.armouryLoadout.weapons.push(n)}save();armoury()});
 document.querySelectorAll('[data-add-up]').forEach(b=>b.onclick=()=>{c.armouryLoadout.upgrades.push(b.dataset.addUp);save();showToast('Upgrade added to loadout.')});
 document.querySelectorAll('[data-add-ammo]').forEach(b=>b.onclick=()=>{c.armouryLoadout.ammo.push(b.dataset.addAmmo);save();showToast('Special ammunition clip added.')});
 let s=document.getElementById('v52search'),g=document.getElementById('v52group');function filt(){let q=(s?.value||'').toLowerCase(),gr=g?.value||'';document.querySelectorAll('#v52weapons .v52-weapon').forEach(el=>{let w=CORE_WEAPONS.find(x=>el.dataset.search.includes(x.name.toLowerCase()));el.style.display=(!q||el.dataset.search.includes(q))&&(!gr||w?.group===gr)?'':'none'})}if(s)s.oninput=filt;if(g)g.onchange=filt;
};
const prevRender=render;render=function(){prevRender();if(state.view==='sheet'&&state.role!=='gm'){let c=active();ensureArmoury(c);let app=document.getElementById('app');if(app&&!document.querySelector('.v52-sheet-armoury')){let box=document.createElement('div');box.className='v52-sheet-armoury';box.innerHTML=`<div class="eyebrow">Armoury Loadout</div><h2 style="margin:3px 0">Weapons & Armour</h2><div class="v52-loadout"><div class="v52-load"><b>Equipped Armour</b><div class="small">${esc(armour(c.armour)?.name||c.armour||'None')}</div></div><div class="v52-load"><b>Requisitioned Weapons</b><div class="small">${c.armouryLoadout.weapons.length?c.armouryLoadout.weapons.map(esc).join(' • '):'None selected'}</div></div><div class="v52-load"><b>Special Ammo</b><div class="small">${c.armouryLoadout.ammo.length?c.armouryLoadout.ammo.map(esc).join(' • '):'None'}</div></div><div class="v52-load"><b>Upgrades</b><div class="small">${c.armouryLoadout.upgrades.length?c.armouryLoadout.upgrades.map(esc).join(' • '):'None'}</div></div></div><button class="btn" id="v52openArm" style="margin-top:10px;width:100%">OPEN ARMOURY</button>`;app.prepend(box);document.getElementById('v52openArm').onclick=()=>{state.view='armoury';save();armoury();nav()}}}};
setTimeout(()=>render(),20);
})();
</script>

</body></html>
