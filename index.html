function createStep1(cr,d){let spent=CHAR_KEYS.reduce((a,k)=>a+Number(d.pointBuy?.[k]||0),0),left=100-spent;let controls=CHAR_KEYS.map(k=>`<div class="pbrow"><label>${CHAR_LABELS[k]} <b>${d.creationMethod==='pointbuy'?30+Number(d.pointBuy[k]||0):d.chars[k]}</b></label>${d.creationMethod==='pointbuy'?`<div><button class="btn" data-pb="${k}" data-dir="-1">−</button><input aria-label="${CHAR_LABELS[k]} point allocation" class="pbinput" data-pbin="${k}" type="number" min="0" max="20" value="${d.pointBuy[k]||0}"><button class="btn" data-pb="${k}" data-dir="1">+</button></div>`:''}</div>`).join('');return `<div class="card"><h2>1 · Generate Characteristics</h2><p class="small">Choose the standard 2d10+30 method with one re-roll, or allocate exactly 100 points from a base of 30 with no more than +20 in a single Characteristic.</p><button class="btn ${d.creationMethod==='random'?'primary':''}" id="methodRandom">RANDOM</button><button class="btn ${d.creationMethod==='pointbuy'?'primary':''}" id="methodPB">POINT BUY</button>${d.creationMethod==='random'?`<button class="btn" id="rollAll">${Object.keys(d.randomBase||{}).length?'REROLL ALL (resets single reroll)':'ROLL ALL'}</button><p class="small">Single result re-roll: ${d.rerollUsed?'used':'available'}</p>`:''}${d.creationMethod==='pointbuy'?`<div class="budget ${left<0?'bad':''}"><b>${spent}/100 spent</b> · ${left} remaining</div>`:''}<div class="charGrid">${controls}</div>${d.creationMethod==='random'&&Object.keys(d.randomBase||{}).length?`<div class="card subtle"><b>Single re-roll</b><select id="rerollChar" ${d.rerollUsed?'disabled':''}>${CHAR_KEYS.map(k=>`<option value="${k}">${CHAR_LABELS[k]} (${d.chars[k]})</option>`).join('')}</select><button class="btn" id="rerollOne" ${d.rerollUsed?'disabled':''}>REROLL SELECTED</button></div>`:''}</div>`}
function createStep2(d){return `<div class="card"><h2>2 · Chapter</h2><p class="small">Select the Battle-Brother’s home Chapter. Only Chapters with complete sourced mechanics are selectable for canonical creation.</p><div class="chapterGrid">${DATA.chapters.map(c=>`<button class="chapterChoice ${d.chapter===c.id?'selected':''}" data-chapter="${c.id}" ${SUPPORTED.has(c.id)?'':'disabled'}><b>${esc(c.name)}</b><span>${esc(c.summary||'')}</span>${SUPPORTED.has(c.id)?'':`<em>Supplement mechanics pending</em>`}</button>`).join('')}</div></div>`}
function createStep3(d){let cp=chapterBy(d.chapter),trs=DATA.trappings[d.chapter]||[],tr=trs.find(x=>x.id===d.chapterTrappingId);return `<div class="card"><h2>3 · Chapter Identity</h2><div class="grid"><div><b>${esc(cp?.demeanour||'')}</b><p class="small">Fixed Chapter Demeanour</p></div><div><b>${esc(cp?.solo||'')}</b><p class="small">Chapter Solo Mode ability</p></div></div><label>Personal Demeanour</label><select id="personalDem"><option value="">Choose…</option>${DATA.personalDemeanours.map(x=>`<option ${d.personalDemeanour===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Chapter Trapping</label><select id="trapSel"><option value="">Choose…</option>${trs.map(t=>`<option value="${t.id}" ${d.chapterTrappingId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>${tr?`<div class="rulebox"><b>${esc(tr.name)}</b><p>${esc(tr.effect)}</p><div class="source">${esc(tr.source||'')}</div></div>`:''}${tr?.requiresFocus?`<label>${esc(tr.focusLabel||'Choose focus')}</label><input id="trapFocus" value="${esc(d.chapterTrappingFocus||'')}">`:''}${d.chapter==='ultramarines'?`<div class="card subtle"><b>Ultramarines Characteristic choices</b><p class="small">Choose two different Characteristics to receive +5.</p><div class="chips">${CHAR_KEYS.map(k=>`<label class="chip"><input type="checkbox" data-um="${k}" ${d.ultramarineChoices.includes(k)?'checked':''}> ${k}</label>`).join('')}</div></div>`:''}</div>`}
function createStep4(d){let cp=chapterBy(d.chapter);return `<div class="card"><h2>4 · Speciality</h2><div class="chapterGrid">${DATA.specialities.map(s=>{let blocked=cp?.restrictions?.includes(s.id);return `<button class="chapterChoice ${d.speciality===s.id?'selected':''}" data-spec="${s.id}" ${blocked?'disabled':''}><b>${esc(s.name)}</b><span>${esc(s.summary||'')}</span>${blocked?'<em>Restricted by Chapter</em>':''}</button>`}).join('')}</div></div>`}
function createStep5(d){let cp=chapterBy(d.chapter);return `<div class="card"><h2>5 · Wounds, Fate & Starting XP</h2><div class="grid3"><div class="stat"><span>Wounds</span><b>${d.wounds.max||'—'}</b><button class="btn" id="rollWounds">ROLL 1d5+18${cp?.woundsBonus?` +${cp.woundsBonus}`:''}</button></div><div class="stat"><span>Fate</span><b>${d.fate.max||'—'}</b><button class="btn" id="rollFate">ROLL d10</button></div><div class="stat"><span>Starting XP</span><b>1,000</b><small>12,000 spent baseline</small></div></div>${d.wounds.max&&d.fate.max?`<div class="rulebox">Movement snapshot: Half ${movementPreview(d).half}m · Full ${movementPreview(d).full}m · Charge ${movementPreview(d).charge}m · Run ${movementPreview(d).run}m</div>`:''}</div>`}
function movementPreview(d){let tmp=deep(d);return movement(tmp)}
function createStep6(d){let pack=DATA.startingPackages[d.speciality]||{gear:[],loadout:[]};let lib=d.speciality==='librarian';let allowed=['Inspire','Augury','Reading','Avenger','Iron Arm','Short-range Telepathy','Smite'];return `<div class="card"><h2>6 · Starting Equipment</h2><div class="rulebox"><b>All Specialities</b><p>${DATA.coreStartGear.map(esc).join(' · ')}</p></div><div class="rulebox"><b>${esc(specBy(d.speciality).name)}</b><p>${(pack.gear||[]).map(esc).join(' · ')}</p></div>${d.speciality==='techmarine'?`<label>Starting Common cybernetic</label><select id="techCyber"><option value="">Choose…</option>${DATA.techCybernetics.map(x=>`<option ${d.techmarineCybernetic===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}${lib?`<div class="card subtle"><b>Starting Psychic Powers · choose exactly 3</b><div class="chips">${allowed.map(p=>`<label class="chip"><input data-startpower="${esc(p)}" type="checkbox" ${d.powers.includes(p)?'checked':''}> ${esc(p)}</label>`).join('')}</div><p class="small">Selected: ${d.powers.length}/3</p></div>`:''}</div>`}
function createStep7(d){let pasts=[...(DATA.generalPasts||[]),...((DATA.pasts[d.chapter]||[]).map(x=>typeof x==='string'?x:(x.name||x.past||JSON.stringify(x))))];return `<div class="card"><h2>7 · Give the Battle-Brother Life</h2><label>Name</label><input id="charNameCreate" value="${esc(d.name)}" placeholder="Battle-Brother name"><label>Starting Tactics training</label><select id="tacticsCreate"><option value="">Choose one…</option>${(DATA.tacticsGroups||[]).map(x=>`<option ${d.tacticsChoice===x?'selected':''}>${esc(x)}</option>`).join('')}</select><p class="small">Tactics is a Skill Group: the starting Battle-Brother is trained in one field, not every Tactics specialisation.</p><label>Past</label><select id="pastCreate"><option value="">Choose or leave open…</option>${pasts.map(p=>`<option ${d.past===p?'selected':''}>${esc(p)}</option>`).join('')}</select><div class="rulebox"><b>Starting Power Armour History</b><p>${esc((d.armourHistories||[])[0]||'Not rolled')}</p><button class="btn" id="createHistory">ROLL d10 HISTORY</button></div><label>Notes / appearance</label><textarea id="notesCreate" rows="5">${esc(d.notes||'')}</textarea><div class="rulebox"><b>Creation audit</b><p>${creationAuditText(d)}</p></div></div>`}
function creationAuditText(d){let cp=chapterBy(d.chapter),sp=specBy(d.speciality);return `${cp?.name||'No Chapter'} · ${sp?.name||'No Speciality'} · ${d.personalDemeanour||'No personal Demeanour'} · ${trapping(d)?.name||'No trapping'} · Wounds ${d.wounds.max||'—'} · Fate ${d.fate.max||'—'}`}
function validateCreate(step,d){if(step===1){if(!d.creationMethod)return 'Choose a Characteristic generation method.';if(d.creationMethod==='pointbuy'&&CHAR_KEYS.reduce((a,k)=>a+Number(d.pointBuy[k]||0),0)!==100)return 'Point Buy must spend exactly 100 points.';if(d.creationMethod==='random'&&Object.keys(d.randomBase||{}).length!==9)return 'Roll all nine Characteristics first.'}if(step===2&&!SUPPORTED.has(d.chapter))return 'Choose a Chapter with complete loaded mechanics.';if(step===3){if(!d.personalDemeanour)return 'Choose a Personal Demeanour.';if(!d.chapterTrappingId)return 'Choose one Chapter Trapping.';let tr=trapping(d);if(tr?.requiresFocus&&!String(d.chapterTrappingFocus||'').trim())return 'Choose the trapping’s focus.';if(d.chapter==='ultramarines'&&new Set(d.ultramarineChoices).size!==2)return 'Ultramarines must choose exactly two different Characteristics.'}if(step===4){if(!d.speciality)return 'Choose a Speciality.';if(chapterBy(d.chapter)?.restrictions?.includes(d.speciality))return 'That Speciality is restricted by this Chapter.'}if(step===5&&(!d.wounds.max||!d.fate.max))return 'Roll both Wounds and Fate.';if(step===6){if(d.speciality==='techmarine'&&!d.techmarineCybernetic)return 'Choose the Techmarine’s starting cybernetic.';if(d.speciality==='librarian'&&d.powers.length!==3)return 'A starting Librarian must choose exactly three starting psychic powers.'}if(step===7&&!String(d.name||'').trim())return 'Give the Battle-Brother a name.';if(step===7&&!(DATA.tacticsGroups||[]).includes(d.tacticsChoice))return 'Choose one starting Tactics field.';if(step===7&&!(d.armourHistories||[]).length)return 'Roll the starting power armour history.';return ''}
function wireCreate(cr,d){
  document.getElementById('cBack').onclick=()=>{cr.step--;save();render()};document.getElementById('cCancel').onclick=()=>{if(confirm('Cancel character creation?')){state.creator=null;state.view=current()?'sheet':'home';save();render()}};document.getElementById('cNext').onclick=()=>{let er=validateCreate(cr.step,d);if(er){toast(er,'bad');return}if(cr.step<7){cr.step++;save();render()}else finishCreation(d)};
  if(cr.step===1){document.getElementById('methodRandom').onclick=()=>{d.creationMethod='random';cr.mode='random';d.pointBuy=Object.fromEntries(CHAR_KEYS.map(k=>[k,0]));save();render()};document.getElementById('methodPB').onclick=()=>{d.creationMethod='pointbuy';cr.mode='pointbuy';d.chars=Object.fromEntries(CHAR_KEYS.map(k=>[k,30]));d.pointBuy=Object.fromEntries(CHAR_KEYS.map(k=>[k,0]));save();render()};if(d.creationMethod==='random'){document.getElementById('rollAll').onclick=()=>{for(const k of CHAR_KEYS){let v=30+rollDie(10)+rollDie(10);d.chars[k]=v;d.randomBase[k]=v}d.rerollUsed=false;save();render()};let one=document.getElementById('rerollOne');if(one)one.onclick=()=>{let k=document.getElementById('rerollChar').value;d.chars[k]=30+rollDie(10)+rollDie(10);d.randomBase[k]=d.chars[k];d.rerollUsed=true;save();render()}}document.querySelectorAll('[data-pb]').forEach(b=>b.onclick=()=>adjustPointBuy(d,b.dataset.pb,Number(b.dataset.dir)));document.querySelectorAll('[data-pbin]').forEach(i=>i.onchange=()=>setPointBuy(d,i.dataset.pbin,i.value))}
  if(cr.step===2)document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{d.chapter=b.dataset.chapter;d.chapterTrappingId='';d.chapterTrappingFocus='';d.ultramarineChoices=[];if(chapterBy(d.chapter)?.restrictions?.includes(d.speciality))d.speciality='';save();render()});
  if(cr.step===3){document.getElementById('personalDem').onchange=e=>{d.personalDemeanour=e.target.value;save()};document.getElementById('trapSel').onchange=e=>{d.chapterTrappingId=e.target.value;d.chapterTrappingFocus='';save();render()};let tf=document.getElementById('trapFocus');if(tf)tf.onchange=e=>{d.chapterTrappingFocus=e.target.value;save()};document.querySelectorAll('[data-um]').forEach(x=>x.onchange=()=>{let k=x.dataset.um;if(x.checked&&!d.ultramarineChoices.includes(k)){if(d.ultramarineChoices.length>=2){x.checked=false;toast('Choose only two Characteristics.','bad');return}d.ultramarineChoices.push(k)}else if(!x.checked)d.ultramarineChoices=d.ultramarineChoices.filter(v=>v!==k);save()})}
  if(cr.step===4)document.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>{d.speciality=b.dataset.spec;d.powers=[];save();render()});
  if(cr.step===5){document.getElementById('rollWounds').onclick=()=>{d.wounds.max=18+rollDie(5)+(chapterBy(d.chapter)?.woundsBonus||0);save();render()};document.getElementById('rollFate').onclick=()=>{let r=rollDie(10);d.fate.max=d.fate.current=r<=7?3:r<=9?4:5;save();render()}}
  if(cr.step===6){let t=document.getElementById('techCyber');if(t)t.onchange=e=>{d.techmarineCybernetic=e.target.value;save()};document.querySelectorAll('[data-startpower]').forEach(x=>x.onchange=()=>{let p=x.dataset.startpower;if(x.checked){if(d.powers.length>=3){x.checked=false;toast('Choose exactly three starting powers.','bad');return}d.powers.push(p)}else d.powers=d.powers.filter(v=>v!==p);save();render()})}
  if(cr.step===7){document.getElementById('charNameCreate').oninput=e=>d.name=e.target.value;document.getElementById('tacticsCreate').onchange=e=>{d.tacticsChoice=e.target.value;save()};document.getElementById('pastCreate').onchange=e=>d.past=e.target.value;document.getElementById('notesCreate').oninput=e=>d.notes=e.target.value;document.getElementById('createHistory').onclick=()=>{let h=DATA.armourHistories[rollDie(10)-1];d.armourHistories=[h.name];save();render()}}
}
function adjustPointBuy(d,k,dir){let cur=Number(d.pointBuy[k]||0),spent=CHAR_KEYS.reduce((a,x)=>a+Number(d.pointBuy[x]||0),0);if(dir>0&&spent>=100)return;if(dir>0&&cur>=20)return;if(dir<0&&cur<=0)return;d.pointBuy[k]=cur+dir;d.chars[k]=30+d.pointBuy[k];save();render()}
function setPointBuy(d,k,val){let wanted=clamp(Math.trunc(Number(val)||0),0,20),others=CHAR_KEYS.filter(x=>x!==k).reduce((a,x)=>a+Number(d.pointBuy[x]||0),0);wanted=Math.min(wanted,100-others);d.pointBuy[k]=wanted;d.chars[k]=30+wanted;save();render()}
function finishCreation(d){let er=validateCreate(7,d);if(er){toast(er,'bad');return}let cp=chapterBy(d.chapter),pack=DATA.startingPackages[d.speciality]||{gear:[],loadout:[]};let ch=migrateCharacter(deep(d),true);ch.creationComplete=true;ch.skillsOwned={};ch.groupSkills={};for(const sk of DATA.baseStartingSkills||[])grantSkillTraining(ch,sk,0);for(const [base,specs] of Object.entries(DATA.baseStartingGroupSkills||{}))for(const sp of specs)grantGroupSkill(ch,base,sp,0);grantGroupSkill(ch,'Tactics',d.tacticsChoice,0);for(const sk of DATA.specRules[d.speciality]?.startSkills||[])grantSkillTraining(ch,sk,0);ch.talentsOwned=[...new Set([...(DATA.baseStartingTalents||[]),...(DATA.specRules[d.speciality]?.startTalents||[]),...(cp?.bonusTalents||[])])];ch.traitsOwned=[...new Set([...(DATA.baseStartingTraits||[]),...(ch.traitsOwned||[])])];ch.gear=[...DATA.coreStartGear,...(pack.gear||[])];ch.loadout=[...new Set([...(pack.loadout||[]),'Astartes Bolt Pistol','Astartes Combat Knife'])];if(ch.chapterTrappingId==='stw-sacris-claymore'||ch.stormWardenClaymore){ch.loadout=ch.loadout.filter(x=>x!=='Astartes Combat Knife');ch.loadout.push('Sacris Claymore')}if(ch.chapterTrappingId==='da-ceremonial-sword')ch.loadout.push('Ceremonial Sword');ch.loadout=[...new Set(ch.loadout)];if(ch.techmarineCybernetic)ch.gear.push(ch.techmarineCybernetic);state.characters.push(ch);state.active=state.characters.length-1;state.creator=null;state.view='sheet';if(!state.mission.leaderId)state.mission.leaderId=ch.id;recalculateCohesion(true);save();render();toast('Battle-Brother entered into the Vigil.')}
function renderSheet(){let ch=current();if(!ch)return setView('home');let d=derived(ch),cp=chapterBy(ch.chapter),sp=specBy(ch.speciality),tr=trapping(ch),mv=d.movement;let skills=DATA.skills.map(s=>{let t=skillTarget(ch,s),group=isGroupSkill(s),trained=group?knownGroupSkills(ch,s.name).length:Object.prototype.hasOwnProperty.call(ch.skillsOwned||{},s.name);return `<div class="listrow"><div><b>${esc(s.name)}</b><div class="small">${s.characteristic} · ${s.skillType}${group?` · ${esc(groupSkillLabel(ch,s))}`:trained?` · trained ${skillMastery(ch,s)?`+${skillMastery(ch,s)}`:''}`:''}</div></div><button class="btn" data-roll-skill="${s.id}" ${t===null?'disabled':''}>${t===null?'Untrained':group?'CHOOSE':t}</button></div>`}).join('');let gear=availableLoadout(ch).map(n=>`<span class="pill">${esc(n)}</span>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">${esc(cp?.name)} · ${esc(sp.name)} · Rank ${d.rank}</div><h1>${esc(ch.name)}</h1><div class="small">${esc(cp?.demeanour)} · ${esc(ch.personalDemeanour)} · ${d.renownRank} (${ch.renown} Renown) · ${ch.xp.available} XP available</div></section><div class="card"><div class="mode"><button id="soloBtn" class="${ch.mode==='solo'?'active':''}">SOLO MODE</button><button id="squadBtn" class="${ch.mode==='squad'?'active':''}">SQUAD MODE</button></div><div id="modeRules">${modeAbilityHTML(ch)}</div></div><div class="grid3">${resourceBox('Damage',`${ch.wounds.damage}/${ch.wounds.max}`,'damage')}${resourceBox('Fatigue',ch.fatigue,'fatigue')}${resourceBox('Fate',`${ch.fate.current}/${ch.fate.max}`,'fate')}${resourceBox('Cohesion',`${state.mission.cohesion.current}/${state.mission.cohesion.max}`,'cohesion')}${resourceBox('Insanity',ch.insanity,'insanity')}${resourceBox('Corruption',ch.corruption,'corruption')}</div><div class="card"><h2>Chapter Identity</h2><div class="grid"><div><b>${esc(cp?.demeanour)}</b><p class="small">Chapter Demeanour</p></div><div><b>${esc(ch.personalDemeanour)}</b><p class="small">Personal Demeanour</p></div></div><p><b>Trapping:</b> ${esc(tr?.name||'None')} ${tr?.effect?`— ${esc(tr.effect)}`:''}</p><button class="btn ${ch.demeanourUsed?'':'primary'}" id="useDem">${ch.demeanourUsed?'DEMEANOUR USED THIS SESSION':'USE DEMEANOUR'}</button></div><div class="card"><h2>Characteristics</h2><div class="charGrid">${CHAR_KEYS.map(k=>`<button class="stat" data-roll-char="${k}"><span>${k}</span><b>${d.chars[k]}</b><small>${esc(CHAR_LABELS[k])}</small></button>`).join('')}</div><p class="small">Movement: Half ${mv.half}m · Full ${mv.full}m · Charge ${mv.charge}m · Run ${mv.run?mv.run+'m':'Unavailable'}</p></div><div class="card"><h2>Conditions & Damage</h2>${conditionHTML(ch)}<button class="btn" id="editConditions">EDIT CONDITIONS</button><button class="btn" id="editCharDmg">CHARACTERISTIC DAMAGE</button><button class="btn" id="rest10">REST 10 MIN</button><button class="btn" id="restHour">REST 1 HOUR</button></div><div class="card"><h2>Honours</h2>${honourHTML(ch)}</div><div class="card"><h2>Readied Wargear</h2>${gear||'<div class="empty">No weapons or mission gear readied.</div>'}</div><div class="card"><h2>Skills</h2>${skills}</div>`;
  document.getElementById('soloBtn').onclick=()=>{ch.mode='solo';save();render()};document.getElementById('squadBtn').onclick=()=>attemptSquadMode(ch);document.getElementById('useDem').onclick=()=>{ch.demeanourUsed=!ch.demeanourUsed;save();render()};document.getElementById('editConditions').onclick=()=>conditionsModal(ch);document.getElementById('editCharDmg').onclick=()=>charDamageModal(ch);document.getElementById('rest10').onclick=()=>{ch.fatigue=Math.max(0,ch.fatigue-1);save();render()};document.getElementById('restHour').onclick=()=>{ch.fatigue=0;for(const k of CHAR_KEYS)ch.charDamage[k]=Math.max(0,Number(ch.charDamage[k]||0)-1);save();render()};wireResourceControls(ch)}
function resourceBox(label,val,id){return `<div class="card resourceCard"><span>${label}</span><b>${val}</b><div><button class="mini" data-res="${id}" data-delta="-1">−</button><button class="mini" data-res="${id}" data-delta="1">+</button></div></div>`}
function wireResourceControls(ch){document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{let d=Number(b.dataset.delta),r=b.dataset.res;if(r==='damage')ch.wounds.damage=Math.max(0,ch.wounds.damage+d);if(r==='fatigue')ch.fatigue=Math.max(0,ch.fatigue+d);if(r==='fate'){if(d<0&&ch.fate.current>0){ch.fate.current--;restoreCohesion(1,'Fate spent')}else if(d>0)ch.fate.current=Math.min(ch.fate.max,ch.fate.current+1)}if(r==='cohesion')state.mission.cohesion.current=clamp(state.mission.cohesion.current+d,0,state.mission.cohesion.max);if(r==='insanity')ch.insanity=Math.max(0,ch.insanity+d);if(r==='corruption'){if(d>0&&trapping(ch)?.id==='ba-icon-purity'){toast('Purity Focus reduces this +1 Corruption gain to 0.')}else ch.corruption=Math.max(0,ch.corruption+d)}save();render()})}
function conditionHTML(ch){let active=ch.conditions||[];return active.length?active.map(x=>`<span class="pill warning">${esc(x)}</span>`).join(' '):'<span class="small">No active conditions.</span>'}
function conditionsModal(ch){modal(`<h2>Conditions</h2>${DATA.conditions.map(x=>`<label class="check"><input type="checkbox" data-cond="${esc(x)}" ${ch.conditions.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}<button class="btn primary" id="saveCond">DONE</button>`);document.querySelectorAll('[data-cond]').forEach(x=>x.onchange=()=>{if(x.checked&&!ch.conditions.includes(x.dataset.cond))ch.conditions.push(x.dataset.cond);if(!x.checked)ch.conditions=ch.conditions.filter(v=>v!==x.dataset.cond)});document.getElementById('saveCond').onclick=()=>{save();closeModal();render()}}
function charDamageModal(ch){modal(`<h2>Characteristic Damage</h2><p class="small">Temporary damage directly lowers the Characteristic and therefore its Bonus, Movement and related Tests.</p>${CHAR_KEYS.map(k=>`<label>${k}<input type="number" min="0" max="99" data-cd="${k}" value="${ch.charDamage[k]||0}"></label>`).join('')}<button class="btn primary" id="saveCD">SAVE</button>`);document.getElementById('saveCD').onclick=()=>{document.querySelectorAll('[data-cd]').forEach(i=>ch.charDamage[i.dataset.cd]=Math.max(0,Number(i.value)||0));save();closeModal();render()}}
function honourHTML(ch){let eligible=ch.renown>=60,awarded=!!ch.honours.cruxTerminus;return `<div class="listrow"><div><b>Crux Terminatus</b><div class="small">${awarded?'Awarded':eligible?'Eligible for GM consideration':'Requires 60 Renown to be considered'}</div></div>${state.role==='gm'&&eligible?`<button class="btn ${awarded?'danger':'primary'}" id="cruxBtn">${awarded?'REVOKE':'AWARD'}</button>`:''}</div>`}
function modeAbilityHTML(ch){let cp=chapterBy(ch.chapter),r=rankFor(ch);if(ch.mode==='solo'){let solo=DATA.solo.find(x=>x.name===cp?.solo);let codex=DATA.rules.filter(x=>x.category==='Solo Mode'&&Number(x.rank||99)<=r);return `<h2>Solo Mode</h2>${solo?ruleItem(solo):''}${codex.map(ruleItem).join('')}` }let avail=missionSquadAbilities();return `<h2>Squad Mode · Support ${supportRangeText(r)}</h2>${avail.map(a=>{let eligible=!a.chapter||a.chapter===cp?.name;return `<div class="listrow"><div><b>${esc(a.name)}</b><div class="small">${esc(a.subtype||'Squad Mode')} · ${esc(a.action||'')} · Cost ${a.cost??'—'}${a.sustained?' · Sustained':''}${a.chapter?` · ${esc(a.chapter)} only`:''}</div><p>${esc(a.summary||'')}</p></div><button class="btn" data-activate-squad="${esc(a.name)}" ${eligible?'':'disabled'}>${eligible?'ACTIVATE':'CHAPTER-LOCKED'}</button></div>`}).join('')||'<div class="empty">Choose a leader and oath in Mission preparation.</div>'}`}
function ruleItem(x){return `<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.activation||x.category||'')} ${x.rank?`· Rank ${x.rank}`:''}</div><p>${esc(x.summary||x.effect||'')}</p><div class="source">${esc(sourceText(x))}</div></div></div>`}
function supportRangeText(r){return r<=3?'30m · visual':r<=6?'60m · close vox/vocal':'120m · close vox/vocal'}
function attemptSquadMode(ch){if(state.mission.cohesion.current<1){toast('The Kill-team needs at least 1 Cohesion.','bad');return}modal(`<h2>Enter Squad Mode</h2><button class="btn primary" id="squadFull">FULL ACTION · automatic from next Turn</button><button class="btn" id="squadChallenge">COHESION CHALLENGE · Free/Reaction</button><p class="small">A Battle-Brother must also be in Support Range of at least one Kill-team member.</p>`);document.getElementById('squadFull').onclick=()=>{ch.mode='squad';save();closeModal();render()};document.getElementById('squadChallenge').onclick=()=>{let roll=rollDie(10),target=state.mission.cohesion.current+(state.mission.oath==='loyalty'?1:0),ok=roll<=target;ch.mode='squad';save();closeModal();toast(`Cohesion Challenge ${roll} vs ${target}: ${ok?'passed':'failed — enter following Turn after losing the relevant Turn'}`);render()}}

function quickCharRoll(k){let ch=current();if(!ch)return;quickTestModal(`${CHAR_LABELS[k]} Test`,characteristic(ch,k))}
function quickSkillRoll(id){let ch=current(),s=skillRecord(id);if(!ch||!s)return;if(isGroupSkill(s)){let known=knownGroupSkills(ch,s.name);if(!known.length)return;groupSkillRollModal(ch,s,known);return}let t=skillTarget(ch,s);if(t===null)return;quickTestModal(`${s.name} Test`,t)}
function groupSkillRollModal(ch,s,known){modal(`<h2>${esc(s.name)} Test</h2><label>Specialisation<select id="groupSpecRoll">${known.map(x=>`<option value="${esc(x.spec)}">${esc(x.spec)}${x.bonus?` +${x.bonus}`:''}</option>`).join('')}</select></label><label>Additional modifier<input id="groupSpecMod" type="number" value="0" step="10"></label><button class="btn primary" id="groupSpecGo">ROLL D100</button><div id="groupSpecOut" class="result"></div>`);document.getElementById('groupSpecGo').onclick=()=>{let sp=document.getElementById('groupSpecRoll').value,mod=clamp(Number(document.getElementById('groupSpecMod').value)||0,-60,60),t=skillTarget(ch,s,mod,sp),r=coreTest(t);document.getElementById('groupSpecOut').textContent=testText(r)}}
function quickTestModal(title,base){modal(`<h2>${esc(title)}</h2><label>Base target<input id="qtBase" type="number" value="${base}"></label><label>Additional modifier<input id="qtMod" type="number" value="0" step="10"></label><button class="btn primary" id="qtRoll">ROLL D100</button><div id="qtOut" class="result"></div>`);document.getElementById('qtRoll').onclick=()=>{let t=Number(document.getElementById('qtBase').value)+clamp(Number(document.getElementById('qtMod').value)||0,-60,60),r=coreTest(t);document.getElementById('qtOut').textContent=testText(r)}}

function renderAdvance(){let ch=current();if(!ch)return;let rank=rankFor(ch),scope=state.advanceScope||'general';if(ch.startingXPPhase&&scope==='deathwatch')scope=state.advanceScope='general';let rows=advanceRows(ch,scope,rank);let chars=CHAR_KEYS.map(k=>{let stage=Number(ch.charAdvances[k]||0),cost=stage<4?DATA.advancement.charCosts[ch.speciality]?.[k]?.[stage]:null;return `<div class="listrow"><div><b>${k} +${stage*5}</b><div class="small">Stage ${stage}/4</div></div>${cost?`<button class="btn" data-charadv="${k}" ${ch.xp.available<cost?'disabled':''}>${cost} XP</button>`:'<span class="pill">MAX</span>'}</div>`}).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter II · Advancement</div><h1>Experience & Advancement</h1><p>${ch.xp.available} XP available · ${ch.xp.spent} spent · Total ${totalXP(ch)} · Rank ${rank}</p></section>${ch.startingXPPhase?`<div class="card notice"><b>Starting 1,000 XP phase</b><p class="small">Starting XP may be spent on Chapter, Rank 1 General Space Marine, and Rank 1 Speciality Advances—not Deathwatch Advances. End this phase when the Battle-Brother begins active Deathwatch service.</p><button class="btn primary" id="endStartXP">BEGIN ACTIVE WATCH</button></div>`:''}<div class="card"><h2>Characteristic Advances</h2>${chars}</div><div class="tabs">${[['general','General'],['deathwatch','Deathwatch'],['speciality','Speciality'],['chapter','Chapter']].map(([id,n])=>`<button data-advscope="${id}" class="${scope===id?'active':''}">${n}</button>`).join('')}</div><div class="card"><h2>${esc(scopeTitle(scope,ch))}</h2>${rows.map((r,i)=>advanceRowHTML(ch,r,i)).join('')||'<div class="empty">No advances indexed at this Rank.</div>'}</div><div class="card"><h2>Honours & Elite Advances</h2>${honourHTML(ch)}<button class="btn" id="eliteAdv">GM / ELITE ADVANCE</button></div><div class="card"><h2>Purchased Advances</h2>${ch.xpLedger.length?ch.xpLedger.slice().reverse().map((x,i)=>`<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${x.cost} XP · ${esc(x.source||'')}</div></div></div>`).join(''):'<div class="empty">None yet.</div>'}</div>`;document.querySelectorAll('[data-advscope]').forEach(b=>b.onclick=()=>{if(ch.startingXPPhase&&b.dataset.advscope==='deathwatch'){toast('Deathwatch Advances are unavailable during the starting 1,000 XP phase.','bad');return}state.advanceScope=b.dataset.advscope;render()});let es=document.getElementById('endStartXP');if(es)es.onclick=()=>{ch.startingXPPhase=false;save();render()};document.querySelectorAll('[data-charadv]').forEach(b=>b.onclick=()=>buyCharAdvance(ch,b.dataset.charadv));document.querySelectorAll('[data-buyadv]').forEach(b=>b.onclick=()=>buyAdvance(ch,JSON.parse(decodeURIComponent(b.dataset.buyadv))));document.getElementById('eliteAdv').onclick=()=>eliteAdvance(ch);let cb=document.getElementById('cruxBtn');if(cb)cb.onclick=()=>{ch.honours.cruxTerminus=!ch.honours.cruxTerminus;save();render()}}
function scopeTitle(scope,ch){return scope==='general'?'General Space Marine Advances':scope==='deathwatch'?'Deathwatch Advances':scope==='speciality'?specBy(ch.speciality).name:`${chapterBy(ch.chapter)?.name} Advances`}
function advanceRows(ch,scope,rank){let table;if(scope==='general')table=DATA.advancement.general;if(scope==='deathwatch')table=DATA.advancement.deathwatch;if(scope==='speciality')table=DATA.advancement.specialities[ch.speciality];if(scope==='chapter')table=DATA.advancement.chapter[ch.chapter];if(!table)return[];let arr=[];for(let r=1;r<=rank;r++){let rows=table[String(r)]||table[r]||[];for(const x of rows)arr.push({...x,rank:r,scope})}return arr}
function advanceKey(a){return `${a.scope}|${a.rank}|${a.name}|${a.type||''}`}
function advanceRowHTML(ch,a){let bought=ch.advances.some(x=>x.key===advanceKey(a)),pr=prereqOK(ch,a.prereq||'');return `<div class="listrow"><div><b>${esc(a.name)}</b><div class="small">Rank ${a.rank} · ${esc(a.type||'Advance')} · ${a.cost} XP${a.prereq?` · Prereq: ${esc(a.prereq)}`:''}${!pr.ok?` · <span class="badtext">${esc(pr.reason)}</span>`:''}</div></div><button class="btn ${bought?'':'primary'}" data-buyadv="${encodeURIComponent(JSON.stringify(a))}" ${bought||!pr.ok||ch.xp.available<a.cost?'disabled':''}>${bought?'BOUGHT':`${a.cost} XP`}</button></div>`}
function prereqOK(ch,p){if(!p||p==='—'||p==='-')return{ok:true};let m=String(p).match(/\b(WS|BS|S|T|Ag|Int|Per|WP|Fel)\s*(\d+)/i);if(m&&characteristic(ch,m[1][0].toUpperCase()+m[1].slice(1))<Number(m[2]))return{ok:false,reason:`requires ${m[1]} ${m[2]}`};if(/Techmarine/i.test(p)&&ch.speciality!=='techmarine')return{ok:false,reason:'requires Techmarine'};if(/Librarian/i.test(p)&&ch.speciality!=='librarian')return{ok:false,reason:'requires Librarian'};return{ok:true}}
function buyCharAdvance(ch,k){let s=Number(ch.charAdvances[k]||0);if(s>=4)return;let cost=DATA.advancement.charCosts[ch.speciality][k][s];if(ch.xp.available<cost)return;ch.charAdvances[k]=s+1;spendXP(ch,`${CHAR_LABELS[k]} Advance ${s+1}`,cost,'Characteristic');save();render()}
function buyAdvance(ch,a){if(ch.xp.available<a.cost||ch.advances.some(x=>x.key===advanceKey(a)))return;ch.advances.push({key:advanceKey(a),...a});spendXP(ch,a.name,a.cost,a.scope);applyAdvanceEffect(ch,a);save();render()}
function spendXP(ch,name,cost,source){ch.xp.available-=cost;ch.xp.spent+=cost;ch.xpLedger.push({id:uid('xp'),name,cost,source,at:new Date().toISOString()})}
function applyAdvanceEffect(ch,a){let type=String(a.type||'').toLowerCase(),n=a.name;if(type.includes('skill')){let bonus=Number(n.match(/\+(10|20)$/)?.[1]||0),base=n.replace(/\s*\+(10|20)$/,'').trim(),p=parseGroupSkillName(base),rec=p?skillRecord(p.base):skillRecord(base);if(p&&isGroupSkill(rec))grantGroupSkill(ch,p.base,p.spec,bonus);else if(rec&&isGroupSkill(rec)){let known=knownGroupSkills(ch,rec.name);if(known.length===1)grantGroupSkill(ch,rec.name,known[0].spec,bonus);else ch.skillsOwned[base]=bonus}else ch.skillsOwned[base]=Math.max(Number(ch.skillsOwned[base]||0),bonus)}if(type.includes('talent')&&!ch.talentsOwned.includes(n))ch.talentsOwned.push(n);let ar=DATA.advRules[n];if(ar?.direct==='wounds+1')ch.wounds.max+=1;if(ar?.direct==='machine+1'&&!ch.traitsOwned.includes('Machine (1)'))ch.traitsOwned.push('Machine (1)')}
function eliteAdvance(ch){let name=prompt('Elite Advance name');if(!name)return;let cost=Math.max(0,Number(prompt('XP cost (Core suggests 750 XP as a common starting point for negotiation)','750'))||0);if(cost>ch.xp.available){toast('Not enough available XP.','bad');return}spendXP(ch,name,cost,'Elite Advance / GM');ch.advances.push({key:uid('elite'),name,cost,type:'Elite Advance',scope:'elite'});save();render()}

function availableLoadout(ch){let req=state.mission.requisitioned?.[ch.id]||[];return [...new Set([...(ch.loadout||[]),...req.map(x=>x.name)])]}
function missionRequisition(){if(state.mission.requisitionOverride!==null&&state.mission.requisitionOverride!==''&&Number.isFinite(Number(state.mission.requisitionOverride)))return Math.max(0,Number(state.mission.requisitionOverride));return state.mission.objectives.reduce((sum,o)=>sum+(DATA.requisition[o.priority]||0)+(DATA.requisition[o.difficulty]||0),0)}
function reqSpent(ch){return (state.mission.requisitioned?.[ch.id]||[]).reduce((a,x)=>a+Number(x.req||0),0)}
function teamReqSpent(){return Object.values(state.mission.requisitioned||{}).flat().reduce((a,x)=>a+Number(x.req||0),0)}
function reqAvailable(ch){return state.mission.poolRequisition?missionRequisition()*state.characters.length-teamReqSpent():missionRequisition()-reqSpent(ch)}
function renderArmory(){let ch=current();if(!ch)return;let budget=missionRequisition(),spent=reqSpent(ch),remaining=reqAvailable(ch),query=state.armQuery||'',group=state.armGroup||'All';let groups=['All',...new Set(DATA.armory.map(x=>x.group||x.kind||'Other'))];let cards=DATA.armory.filter(w=>(group==='All'||(w.group||w.kind)===group)&&(!query||JSON.stringify(w).toLowerCase().includes(query.toLowerCase()))).map(w=>armCard(ch,w,budget)).join('');let field=DATA.fieldGear.map(g=>fieldCard(ch,g,budget)).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter V · Armoury</div><h1>Armory</h1><p>Mission Requisition ${budget} each · Personal spent ${spent} · ${state.mission.poolRequisition?'Team pool remaining':'Remaining'} ${remaining} · Renown ${renownRank(ch.renown)} (${ch.renown})</p></section><div class="card"><h2>Mission Requisition</h2><label class="check"><input id="poolReq" type="checkbox" ${state.mission.poolRequisition?'checked':''}> Pool Kill-team Requisition (${budget*state.characters.length} total before withdrawals)</label><p class="small">Each Battle-Brother receives the Mission’s Requisition rating. Mission withdrawals are returned at Mission end; standard issue and permanent/special gear are tracked separately.</p>${(state.mission.requisitioned[ch.id]||[]).map(x=>`<div class="listrow"><b>${esc(x.name)}</b><button class="btn danger" data-returnreq="${esc(x.id)}">RETURN · ${x.req}</button></div>`).join('')||'<div class="empty">No mission withdrawals.</div>'}</div><div class="card"><h2>Weapons & Wargear</h2><div class="filters"><input id="armSearch" placeholder="Search ${DATA.armory.length} profiles…" value="${esc(query)}"><select id="armGroup">${groups.map(g=>`<option ${group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="armGrid">${cards}</div></div><div class="card"><h2>Armour Configuration</h2>${armourConfigHTML(ch,budget)}</div><div class="card"><h2>Field Equipment</h2><div class="armGrid">${field}</div></div><div class="card"><h2>Cybernetics</h2>${DATA.cybernetics.map(x=>`<div class="listrow"><div><b>${esc(x.name)}</b><p class="small">${esc(x.summary||'')}</p><div class="source">${esc(sourceText(x))}</div></div></div>`).join('')}</div>`;document.getElementById('armSearch').oninput=e=>{state.armQuery=e.target.value;render()};document.getElementById('armGroup').onchange=e=>{state.armGroup=e.target.value;render()};wireArmory(ch,budget)}

function manifestModal(ch,name){let p=DATA.psychic.find(x=>x.name===name);if(!p)return;let sustainedCount=(ch.sustainedPowers||[]).length;modal(`<h2>${esc(p.name)}</h2><p>${esc(p.effect)}</p><label>Power level<select id="powerLevel"><option>Fettered</option><option selected>Unfettered</option><option>Push</option></select></label><label>Additional modifier<input id="psyMod" type="number" value="0" step="10"></label><button class="btn primary" id="manifestRoll">FOCUS POWER TEST</button><div id="psyOut" class="result"></div><p class="small">Active sustained powers: ${sustainedCount}. Focus Power rolls of 91–00 always fail.</p>`);document.getElementById('manifestRoll').onclick=()=>{let level=document.getElementById('powerLevel').value,basePR=Number(ch.psyRating||3),pr=level==='Fettered'?Math.ceil(basePR/2):level==='Push'?basePR+3:basePR;if(sustainedCount>=2)pr=Math.max(0,pr-sustainedCount);let mod=clamp(Number(document.getElementById('psyMod').value)||0,-60,60),target=characteristic(ch,'WP')+5*pr+mod+conditionPenalty(ch),r=coreTest(target,{focusPower:true});let dbl=r.roll%11===0,phen=level==='Push'||(level==='Unfettered'&&dbl);if(level==='Push'&&dbl)ch.fatigue+=1;if(r.success&&p.sustained){ch.sustainedPowers=ch.sustainedPowers||[];if(!ch.sustainedPowers.includes(name))ch.sustainedPowers.push(name)}save();document.getElementById('psyOut').innerHTML=`${esc(testText(r))}<br>Effective PR ${pr}${phen?`<br><b>Psychic Phenomena triggered${sustainedCount?` · +${sustainedCount*10} to table roll`:''}</b>`:''}${level==='Push'&&dbl?'<br>Push double: +1 Fatigue':''}`}}

function parseRoF(s){let parts=String(s||'').split('/');return {single:parts[0]!=='–'&&parts[0]!=='-',semi:Number(parts[1])||0,full:Number(parts[2])||0}}
function hitLocation(roll){let s=String(roll).padStart(2,'0'),rev=Number(s.split('').reverse().join(''));if(rev===0)rev=100;if(rev<=10)return'Head';if(rev<=20)return'Right Arm';if(rev<=30)return'Left Arm';if(rev<=70)return'Body';if(rev<=85)return'Right Leg';return'Left Leg'}
function wireAttackConsole(ch){document.getElementById('rollAttack').onclick=()=>{let w=DATA.armory.find(x=>x.name===document.getElementById('atkWeapon').value);if(!w)return toast('No compatible readied weapon profile.','bad');let act=document.getElementById('atkAction').value,isMelee=String(w.class).toLowerCase()==='melee',base=characteristic(ch,isMelee?'WS':'BS'),mod=Number(document.getElementById('atkRange').value)||0,rof=parseRoF(w.rof);if(document.getElementById('atkAimHalf').checked)mod+=10;if(document.getElementById('atkAimFull').checked)mod+=20;if(document.getElementById('atkMelee').checked)mod-=20;if(document.getElementById('atkWeather').checked)mod-=20;if(document.getElementById('atkStunned').checked)mod+=20;if(document.getElementById('atkUnaware').checked)mod+=30;if(document.getElementById('atkUnbraced').checked)mod-=30;mod+=Number(document.getElementById('atkOther').value)||0;if(act==='Semi-Auto Burst'){if(!rof.semi)return toast('Weapon has no Semi-Auto rate.','bad');mod+=10}if(act==='Full Auto Burst'){if(!rof.full)return toast('Weapon has no Full-Auto rate.','bad');mod+=20}if(act==='Called Shot')mod-=20;if(act==='Charge'){if(!isMelee)return toast('Charge requires a melee weapon.','bad');mod+=10}mod=clamp(mod,-60,60);let autoFail=act==='Semi-Auto Burst'||act==='Full Auto Burst'?94:(!isMelee?96:null),r=coreTest(base+mod,{autoFailAt:autoFail}),hits=r.success?1:0;if(r.success&&act==='Semi-Auto Burst')hits=Math.min(rof.semi,1+Math.floor(r.degrees/2));if(r.success&&act==='Full Auto Burst')hits=Math.min(rof.full,1+r.degrees);let jam=!isMelee&&autoFail&&r.roll>=autoFail;let out=`${testText(r)}<br>${r.success?`Hit ${hitLocation(r.roll)} · ${hits} hit${hits===1?'':'s'}`:'Miss'}${jam?' · <b>JAM</b>':''}<br><span class="small">Profile: ${esc(w.damage||w.dmg||'')} · Pen ${esc(w.pen??'—')} · ${esc(w.qualities||'')}</span>`;document.getElementById('attackOut').innerHTML=out}}

function baseCohesion(){let l=leader();if(!l)return 0;let r=rankFor(l),rankMod=r>=6?2:r>=4?1:0,cmd=commandLevel(l),cmdMod=cmd===20?3:cmd===10?2:cmd===0?1:0;let val=Math.floor(characteristic(l,'Fel')/10)+rankMod+cmdMod;if((l.armourHistories||[]).includes('Lead from the Front'))val+=1;let oath=DATA.oaths.find(o=>o.id===state.mission.oath);if(oath?.id==='astartes')val+=2;if(l.chapter==='ultramarines')val+=r>=7?2:1;let tr=trapping(l);if(tr?.id==='bt-tabard-chapter')val-=1;if(state.mission?.complicationRoll===8)val-=2;return Math.max(0,val)}

function renderMission(){let l=leader();recalculateCohesion(false);let req=missionRequisition();let objectives=state.mission.objectives.map(o=>objectiveHTML(o)).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter VII / IX · Mission</div><h1>${esc(state.mission.name)}</h1><p>Requisition ${req} each · Cohesion ${state.mission.cohesion.current}/${state.mission.cohesion.max}</p></section><div class="card"><h2>Preparation</h2><label>Mission name<input id="mName" value="${esc(state.mission.name)}"></label><label>Archetype<select id="mArch"><option value="">Custom</option>${DATA.missionArchetypes.map(x=>`<option ${state.mission.archetype===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Squad Leader<select id="mLeader">${state.characters.map(c=>`<option value="${c.id}" ${c.id===state.mission.leaderId?'selected':''}>${esc(c.name)} · ${esc(specBy(c.speciality).name)}</option>`).join('')}</select></label><label>Oath<select id="mOath"><option value="">Choose…</option>${DATA.oaths.map(o=>`<option value="${o.id}" ${o.id===state.mission.oath?'selected':''} ${oathAvailable(o,l)?'':'disabled'}>${esc(o.name)}</option>`).join('')}</select></label>${state.mission.oath?`<div class="rulebox">${esc(DATA.oaths.find(o=>o.id===state.mission.oath)?.effect||'')}</div>`:''}<label>Requisition override <small>(blank = computed)</small><input id="mReqOverride" type="number" value="${state.mission.requisitionOverride??''}"></label><button class="btn primary" id="savePrep">SAVE PREPARATION</button><button class="btn" id="newMission">NEW MISSION</button></div><div class="card"><h2>Cohesion</h2><div class="bigNumber">${state.mission.cohesion.current} / ${state.mission.cohesion.max}</div><button class="btn" id="cohMinus">−1</button><button class="btn" id="cohPlus">GM +1</button>${l?`<button class="btn" id="leaderAuto" ${state.mission.leaderAutoEntryUsed?'disabled':''}>LEADER AUTO-ENTRY · ONCE/MISSION</button>`:''}<p class="small" function objectiveHTML(o){let target=objectiveKillTarget(o);return `<div class="objective ${o.done?'done':''}" data-objcard="${o.id}"><div class="grid"><label>Name<input data-oname="${o.id}" value="${esc(o.name)}"></label><label>Priority<select data-opri="${o.id}">${['Primary','Secondary','Tertiary'].map(x=>`<option ${o.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Difficulty<select data-odiff="${o.id}">${['Novice','Skilled','Veteran'].map(x=>`<option ${o.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Kill Markers<input data-okm="${o.id}" type="number" min="0" value="${o.killMarkers||0}"></label></div><div class="small">Target ${target} KM · ${objectiveXP(o)} XP · Requisition contribution ${(DATA.requisition[o.priority]||0)+(DATA.requisition[o.difficulty]||0)}</div><div class="chips">${DATA.objectiveThemes.map(t=>`<label class="chip"><input type="checkbox" data-otheme="${o.id}" value="${t}" ${o.themes.includes(t)?'checked':''}>${t}</label>`).join('')}</div><details><summary>Personal involvement</summary>${state.characters.map(c=>`<label class="check"><input type="checkbox" data-involve="${o.id}" value="${c.id}" ${o.involved?.[c.id]!==false?'checked':''}> ${esc(c.name)}</label>`).join('')}</details><button class="btn ${o.done?'danger':'primary'}" data-odone="${o.id}">${o.done?'REOPEN':'COMPLETE'}</button><button class="btn danger" data-odel="${o.id}">DELETE</button></div>`}
function wireMission(){document.getElementById('savePrep').onclick=()=>{state.mission.name=document.getElementById('mName').value;state.mission.archetype=document.getElementById('mArch').value;state.mission.leaderId=document.getElementById('mLeader').value;state.mission.oath=document.getElementById('mOath').value;let v=document.getElementById('mReqOverride').value;state.mission.requisitionOverride=v===''?null:Math.max(0,Number(v)||0);state.mission.briefing=document.getElementById('mBrief').value;state.mission.insertion=document.getElementById('mInsert').value;state.mission.extraction=document.getElementById('mExtract').value;state.mission.complicationNote=document.getElementById('mCompNote').value;recalculateCohesion(true);save();render()};document.getElementById('newMission').onclick=()=>{if(confirm('Start a new Mission? Mission Requisition, objectives, Cohesion and mission rewards will reset.')){state.mission=freshMission();state.mission.leaderId=current()?.id||'';for(const c of state.characters)c.mode='solo';state.encounter=freshEncounter();recalculateCohesion(true);save();render()}};document.getElementById('cohMinus').onclick=()=>{state.mission.cohesion.current=Math.max(0,state.mission.cohesion.current-1);save();render()};document.getElementById('cohPlus').onclick=()=>{restoreCohesion(1,'GM rally');save();render()};let la=document.getElementById('leaderAuto');if(la)la.onclick=()=>{state.mission.leaderAutoEntryUsed=true;let l=leader();if(l)l.mode='squad';save();render();toast('Leader and eligible brothers in Support Range may automatically enter Squad Mode.')};document.getElementById('addObjective').onclick=()=>{let o=migrateObjective({name:'New Objective'},state.characters);state.mission.objectives.push(o);save();render()};document.querySelectorAll('[data-oname]').forEach(i=>i.onchange=()=>updateObj(i.dataset.oname,{name:i.value}));document.querySelectorAll('[data-opri]').forEach(i=>i.onchange=()=>updateObj(i.dataset.opri,{priority:i.value}));document.querySelectorAll('[data-odiff]').forEach(i=>i.onchange=()=>updateObj(i.dataset.odiff,{difficulty:i.value}));document.querySelectorAll('[data-okm]').forEach(i=>i.onchange=()=>updateObj(i.dataset.okm,{killMarkers:Math.max(0,Number(i.value)||0)}));document.querySelectorAll('[data-otheme]').forEach(i=>i.onchange=()=>{let o=getObj(i.dataset.otheme);if(i.checked&&!o.themes.includes(i.value))o.themes.push(i.value);else o.themes=o.themes.filter(x=>x!==i.value);save()});document.querySelectorAll('[data-involve]').forEach(i=>i.onchange=()=>{let o=getObj(i.dataset.involve);o.involved[i.value]=i.checked;save()});document.querySelectorAll('[data-odone]').forEach(b=>b.onclick=()=>toggleObjective(b.dataset.odone));document.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{state.mission.objectives=state.mission.objectives.filter(o=>o.id!==b.dataset.odel);save();render()});document.getElementById('rollComp').onclick=()=>{state.mission.complicationRoll=rollDie(10);recalculateCohesion(true);save();render()};document.getElementById('awardMission').onclick=awardMissionRewards;let hp=document.getElementById('helmetPicter');if(hp)hp.onclick=resolveHelmetPicter}

function resolveHelmetPicter(){let wearer=state.characters.find(c=>c.chapterTrappingId==='rg-pictor');if(!wearer)return;let sk=skillRecord('Tactics'),target=skillTarget(wearer,sk);if(target===null)target=Math.floor(characteristic(wearer,'Int')/2);let r=coreTest(target);let xp=r.success?r.degrees*50:0;if(xp>0)for(const c of state.characters)c.xp.available+=xp;save();toast(`Helmet Pictor: ${testText(r)}${xp?` · +${xp} XP to each Kill-team member`:''}`);render()}
function awardMissionRewards(){if(state.mission.rewardsAwarded)return;let completedObjectives=state.mission.objectives.filter(o=>o.done),teamXP=completedObjectives.reduce((a,o)=>a+objectiveXP(o),0),allPrim=state.mission.objectives.some(o=>o.priority==='Primary')&&state.mission.objectives.filter(o=>o.priority==='Primary').every(o=>o.done),allSec=state.mission.objectives.some(o=>o.priority==='Secondary')&&state.mission.objectives.filter(o=>o.priority==='Secondary').every(o=>o.done),allTer=state.mission.objectives.some(o=>o.priority==='Tertiary')&&state.mission.objectives.filter(o=>o.priority==='Tertiary').every(o=>o.done),teamVeteran=completedObjectives.filter(o=>o.difficulty==='Veteran').length;for(const ch of state.characters){let ren=(allPrim?1:0)+(allSec?1:0)+(allTer?1:0)+(completedObjectives.length>=5?1:0)+(teamVeteran>=3?1:0);if(state.mission.oath==='glory')ren+=completedObjectives.filter(o=>['Primary','Secondary'].includes(o.priority)&&o.involved?.[ch.id]!==false).length;ch.xp.available+=teamXP;ch.renown+=ren;ch.missionsCompleted=Number(ch.missionsCompleted||0)+1;ch.startingXPPhase=false;ch.xpLedger.push({id:uid('mission'),name:`Mission: ${state.mission.name}`,cost:-teamXP,source:`Mission reward · +${ren} Renown`,at:new Date().toISOString()})}state.mission.rewardsAwarded=true;save();render();toast('Mission XP and Renown awarded.')}

function participantHTML(p,i,e){let isH=p.kind==='horde',n=isH?DATA.bestiary.find(x=>x.name===p.refName):null,mag=Number(p.current)||0,bonus=isH?Math.min(2,Math.floor(mag/10)):0,ranged=isH?Math.floor(mag/10):0,loss=isH&&p.startMagnitude?Math.max(0,p.startMagnitude-mag):0,breakMsg='';if(isH&&p.startMagnitude){if(mag<p.startMagnitude*.25)breakMsg='Automatically breaks (unless Fearless).';else if(p.damageThisTurn>=p.startMagnitude*.25)breakMsg=`Break Test due next Turn${mag<p.startMagnitude*.5?' at –10':''}.`}return `<div class="participant ${i===e.turnIndex?'activeTurn':''}"><div class="listrow"><div><b>${esc(p.name)}</b><div class="small">${p.kind.toUpperCase()} · Init ${p.initiative??'—'} ${p.surprised?'· Surprised':''}</div></div><button class="mini danger" data-remp="${p.id}">×</button></div><div class="grid3"><label>${isH?'Magnitude':'Wounds'}<input type="number" data-pcurrent="${p.id}" value="${p.current}"></label><label>Max / Start<input type="number" data-pmax="${p.id}" value="${p.max}"></label><label>Initiative<input type="number" data-pinit="${p.id}" value="${p.initiative??''}"></label></div>${isH?`<div class="rulebox"><b>Horde assistant</b><p>Ranged attacks: ${ranged} · bonus damage dice: +${bonus}d10 · lost this Turn: ${p.damageThisTurn||0}</p><p class="small">${breakMsg||'No break threshold currently flagged.'}</p><button class="btn" data-hordehit="${p.id}">APPLY DAMAGING HITS</button></div>`:''}<div class="chips">${['Prone','Stunned','Pinned','On Fire'].map(c=>`<label class="chip"><input type="checkbox" data-pcond="${p.id}" value="${c}" ${p.conditions.includes(c)?'checked':''}>${c}</label>`).join('')}<label class="chip"><input type="checkbox" data-psurp="${p.id}" ${p.surprised?'checked':''}>Surprised</label></div></div>`}
function wireEncounter(){let e=state.encounter;document.getElementById('openBestiary').onclick=()=>setView('bestiary');document.getElementById('encName').onchange=x=>{e.name=x.target.value;save()};document.getElementById('encDiff').onchange=x=>{e.difficulty=x.target.value;save();render()};document.getElementById('addPCs').onclick=()=>{for(const c of state.characters)if(!e.participants.some(p=>p.kind==='pc'&&p.charId===c.id))e.participants.push({id:uid('p'),kind:'pc',charId:c.id,name:c.name,initiative:null,max:c.wounds.max,current:Math.max(0,c.wounds.max-c.wounds.damage),conditions:[],surprised:false,notes:'',damageThisTurn:0});save();render()};document.getElementById('rollInitAll').onclick=()=>{for(const p of e.participants){let ag=30;if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);ag=c?characteristic(c,'Ag'):30}else if(p.kind==='custom'){let n=state.customEnemies.find(x=>x.id===p.customId);ag=n?.stats?.Ag||30}else{let n=DATA.bestiary.find(x=>x.name===p.refName);ag=n?.stats?.Ag||30}p.initiative=rollDie(10)+Math.floor(ag/10)+(p.kind!=='pc'&&state.mission.complicationRoll===9?2:0)}e.participants.sort((a,b)=>(b.initiative||0)-(a.initiative||0));e.turnIndex=0;save();render()};document.getElementById('nextTurn').onclick=()=>{if(!e.participants.length)return;e.turnIndex++;if(e.turnIndex>=e.participants.length){e.turnIndex=0;e.round++;for(const p of e.participants)p.damageThisTurn=0}save();render()};document.getElementById('nextRound').onclick=()=>{e.round++;e.turnIndex=0;for(const p of e.participants)p.damageThisTurn=0;save();render()};document.querySelectorAll('[data-pcurrent]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pcurrent),old=Number(p.current)||0,pv=Math.max(0,Number(i.value)||0);if(p.kind==='horde'&&pv<old)p.damageThisTurn=(p.damageThisTurn||0)+(old-pv);p.current=pv;if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);if(c)c.wounds.damage=Math.max(0,c.wounds.max-pv)}save();render()});document.querySelectorAll('[data-pmax]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pmax);p.max=Math.max(1,Number(i.value)||1);if(p.kind==='horde')p.startMagnitude=p.max;save();render()});document.querySelectorAll('[data-pinit]').forEach(i=>i.onchange=()=>{e.participants.find(x=>x.id===i.dataset.pinit).initiative=Number(i.value)||0;save()});document.querySelectorAll('[data-remp]').forEach(b=>b.onclick=()=>{e.participants=e.participants.filter(x=>x.id!==b.dataset.remp);e.turnIndex=clamp(e.turnIndex,0,Math.max(0,e.participants.length-1));save();render()});document.querySelectorAll('[data-pcond]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pcond);if(i.checked&&!p.conditions.includes(i.value))p.conditions.push(i.value);else p.conditions=p.conditions.filter(v=>v!==i.value);save()});document.querySelectorAll('[data-psurp]').forEach(i=>i.onchange=()=>{e.participants.find(x=>x.id===i.dataset.psurp).surprised=i.checked;save()});document.querySelectorAll('[data-hordehit]').forEach(b=>b.onclick=()=>hordeHitModal(e.participants.find(x=>x.id===b.dataset.hordehit)));document.getElementById('awardEncXP').onclick=()=>{let xp=DATA.encounterXP[e.difficulty]||0;for(const c of state.characters)c.xp.available+=xp;e.xpAwarded=true;save();render()};document.getElementById('encNotes').onchange=x=>{e.notes=x.target.value;save()}}
function hordeHitModal(p){modal(`<h2>Horde Magnitude Damage</h2><label>Hits that caused at least 1 Damage after AP/TB<input id="hhHits" type="number" min="0" value="1"></label><label class="check"><input id="hhExplosive" type="checkbox"> Explosive Damage: +1 additional hit</label><label>Blast value (0 if not Blast)<input id="hhBlast" type="number" min="0" value="0"></label><button class="btn primary" id="hhApply">APPLY</button><p class="small">For Blast against a Horde, successful Blast hits use the Blast value. This helper intentionally leaves the attack Test and actual Damage determination to the combat roll.</p>`);document.getElementById('hhApply').onclick=()=>{let hits=Math.max(0,Number(document.getElementById('hhHits').value)||0),blast=Math.max(0,Number(document.getElementById('hhBlast').value)||0);if(blast)hits=blast;if(document.getElementById('hhExplosive').checked&&hits>0)hits+=1;let old=p.current;p.current=Math.max(0,p.current-hits);p.damageThisTurn=(p.damageThisTurn||0)+(old-p.current);save();closeModal();render()}}

function renderLibrary(){let cards=[['Core Tests','Roll d100. A result equal to or below the modified Characteristic or Skill succeeds. Degrees count each full 10 points of margin. Untrained Basic Skills halve the governing Characteristic; untrained Advanced Skills cannot be attempted.'],['Focus Power','Focus Power is a Willpower Test with +5 × effective Psy Rating. Unlike generic Tests, Focus Power rolls of 91–00 always fail.'],['Cohesion','Generated from the squad leader’s Fellowship Bonus plus Rank and highest Command modifiers. It is spent to unlock Squad Mode abilities and can be recovered through objectives, Fate spending, and GM-awarded teamwork.'],['Squad Mode','Solo is the default. Enter Squad Mode with a Full Action or a Cohesion Challenge while in Support Range and with at least 1 Cohesion.'],['Missions','Objectives have Primary/Secondary/Tertiary importance and Novice/Skilled/Veteran difficulty. Those values determine detailed XP, Kill Markers and computed Requisition.'],['Renown','0–19 Initiated · 20–39 Respected · 40–59 Distinguished · 60–79 Famed · 80+ Hero. Item Renown requirements must be met before Requisition.'],['Requisition','Each Battle-Brother receives the Mission Requisition rating. Points do not carry over; the Kill-team may pool resources. Mission withdrawals are returned afterward unless a rule says otherwise.'],['Hordes','Use a base creature profile, replace Wounds with Magnitude, use one Horde armour value, and resolve special Magnitude damage, attacks and breaking rules.'],['Fatigue','Any Fatigue imposes –10 to all Tests. Exceeding Toughness Bonus causes unconsciousness; normal rest removes Fatigue over time.'],['Honours','Crux Terminatus requires 60 Renown even to be considered and is awarded by the GM; it represents the training required for Terminator Armour.']];document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Rules Reference</div><h1>Librarium</h1><p>Compact table-side reminders; sourced mechanical systems live in their dedicated screens.</p></section>${cards.map(([n,d])=>`<div class="card"><h3>${n}</h3><p>${d}</p></div>`).join('')}<div class="card"><h2>Supplement status</h2>${DATA.chapters.filter(c=>c.rules==='supplement-pending').map(c=>`<div class="listrow"><b>${esc(c.name)}</b><span class="pill">MECHANICS PENDING SOURCE PAGES</span></div>`).join('')}</div>`}

function renderMenu(){let ch=current();document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Configuration</div><h1>Vigil Settings</h1><p>${DISPLAY_VERSION} · ${VERSION} · schema ${SCHEMA_VERSION}</p></section><div class="card"><h2>Battle-Brothers</h2>${state.characters.map((c,i)=>`<div class="listrow"><div><b>${esc(c.name)}</b><div class="small">${esc(chapterBy(c.chapter)?.name)} · ${esc(specBy(c.speciality).name)}</div></div><button class="btn ${i===state.active?'primary':''}" data-switch="${i}">${i===state.active?'ACTIVE':'SELECT'}</button><button class="mini danger" data-deletechar="${i}">×</button></div>`).join('')||'<div class="empty">No Battle-Brothers.</div>'}<button class="btn primary" id="newChar">+ CREATE BATTLE-BROTHER</button></div><div class="card"><h2>Ruleset</h2><select id="ruleset"><option value="core" ${state.ruleset==='core'?'selected':''}>Core Rulebook</option><option value="errata" ${state.ruleset==='errata'?'selected':''}>Core + Living Errata profile</option><option value="custom" ${state.ruleset==='custom'?'selected':''}>GM Custom</option></select><p class="small">The profile is stored now so future sourced errata can be applied explicitly. No unsupplied errata changes are invented in this build.</p></div><div class="card"><h2>Appearance</h2><button class="btn" id="parch">Parchment</button><button class="btn" id="iron">Cold Iron</button><button class="btn" id="roleToggle">Switch to ${state.role==='gm'?'Player':'GM'}</button></div><div class="card"><h2>Save & Transfer</h2><button class="btn" id="exportSave">EXPORT JSON</button><button class="btn" id="importSave">IMPORT JSON</button><button class="btn" id="sessionReset">NEW SESSION / RESET DEMEANOURS</button></div><div class="card"><h2>Integrity</h2><button class="btn primary" id="diagMenu">RUN DIAGNOSTICS</button><div id="diagMenuOut"></div></div><div class="card"><h2>Danger Zone</h2><button class="btn danger" id="clearAll">CLEAR ALL LOCAL DATA</button></div>`;document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{state.active=Number(b.dataset.switch);state.view='sheet';save();render()});document.querySelectorAll('[data-deletechar]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.deletechar);if(confirm(`Delete ${state.characters[i].name}?`)){let id=state.characters[i].id;state.characters.splice(i,1);state.active=state.characters.length?clamp(state.active,0,state.characters.length-1):-1;if(state.mission.leaderId===id)state.mission.leaderId=state.characters[0]?.id||'';save();render()}});document.getElementById('newChar').onclick=startCreation;document.getElementById('ruleset').onchange=e=>{state.ruleset=e.target.value;save()};document.getElementById('parch').onclick=()=>{state.surface='parchment';save();render()};document.getElementById('iron').onclick=()=>{state.surface='iron';save();render()};document.getElementById('roleToggle').onclick=()=>{state.role=state.role==='gm'?'player':'gm';state.view=state.role==='gm'?(current()?'gm':'home'):(current()?'sheet':'home');save();render()};document.getElementById('exportSave').onclick=exportState;document.getElementById('importSave').onclick=importState;document.getElementById('sessionReset').onclick=resetSession;document.getElementById('diagMenu').onclick=()=>{let r=diagnostics();document.getElementById('diagMenuOut').innerHTML=`<b>${r.filter(x=>x.ok).length}/${r.length} passed</b>${r.map(x=>`<div class="diag ${x.ok?'ok':'bad'}">${x.ok?'✓':'✕'} ${esc(x.name)}</div>`).join('')}`};document.getElementById('clearAll').onclick=()=>{if(confirm('Permanently clear Astartes Vigil data on this device?')){localStorage.removeItem(STORE);state=freshState();render()}}}
function exportState(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`astartes-vigil-${DISPLAY_VERSION.replace('.','')}-save.json`;a.click();URL.revokeObjectURL(a.href)}
function importState(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=migrateState(JSON.parse(r.result));save();state.view=current()?'sheet':'home';render();toast('Save imported and migrated.')}catch(e){toast('Could not import that save.','bad')}};r.readAsText(f)};inp.click()}

function activateSquad(name){let ch=current(),a=DATA.squad.find(x=>x.name===name);if(!a||ch.mode!=='squad')return;if(a.chapter&&chapterBy(ch.chapter)?.name!==a.chapter){toast(`${a.name} is restricted to ${a.chapter} Battle-Brothers.`,'bad');return;}state.mission.activeSquad=state.mission.activeSquad||[];if(state.mission.activeSquad.includes(name)){toast('Already activated for this Mission/combat.');return}let cost=Number(a.cost||0);if(state.mission.cohesion.current<cost){toast('Not enough Cohesion.','bad');return}state.mission.cohesion.current-=cost;state.mission.activeSquad.push(name);save();render();toast(`${name} activated.`)}

function diagnostics(){let tests=[];let add=(name,ok,detail='')=>tests.push({name,ok:!!ok,detail});add('Build version',VERSION.startsWith('6.9.0'));add('Single schema',SCHEMA_VERSION===69);add('Neutral fresh state',freshState().characters.length===0&&freshState().active===-1);add('Point buy 100 cap',(()=>{let d=neutralDraft();d.creationMethod='pointbuy';for(const k of CHAR_KEYS)setPBNoRender(d,k,20);return CHAR_KEYS.reduce((a,k)=>a+d.pointBuy[k],0)<=100&&CHAR_KEYS.every(k=>d.pointBuy[k]<=20)})());add('Core degrees: 45 vs 23 = 2',degrees(45,23).success&&degrees(45,23).degrees===2);add('Core generic test permits target >90 roll when <= target',coreTest(100,{roll:95}).success);add('Focus Power 91–00 auto-fails',!coreTest(120,{roll:91,focusPower:true}).success);let fake=neutralDraft();fake.creationComplete=true;fake.chapter='dark-angels';fake.speciality='tactical';fake.chars.Fel=35;fake.skillsOwned.Command=0;let oldChars=state.characters,oldLeader=state.mission.leaderId;state.characters=[fake];state.mission.leaderId=fake.id;add('Cohesion FB3 + Command = 4',baseCohesion()===4,`got ${baseCohesion()}`);state.characters=oldChars;state.mission.leaderId=oldLeader;add('Mission Requisition example = 62',(()=>{let os=state.mission.objectives,ov=state.mission.requisitionOverride;state.mission.requisitionOverride=null;state.mission.objectives=[{priority:'Primary',difficulty:'Skilled'},{priority:'Secondary',difficulty:'Veteran'},{priority:'Tertiary',difficulty:'Novice'},{priority:'Tertiary',difficulty:'Novice'}];let v=missionRequisition();state.mission.objectives=os;state.mission.requisitionOverride=ov;return v===62})());add('Renown thresholds',renownRank(19)==='Initiated'&&renownRank(20)==='Respected'&&renownRank(40)==='Distinguished'&&renownRank(60)==='Famed'&&renownRank(80)==='Hero');add('Crux eligibility threshold',60>=60&&59<60);add('All supported Chapters have trappings',DATA.supportedChapters.every(id=>(DATA.trappings[id]||[]).length));add('No cross-Chapter trapping allowed',(()=>{let x=neutralDraft();x.chapter='dark-angels';x.chapterTrappingId='rg-ravenclaw';sanitizeChapter(x);return !x.chapterTrappingId})());add('All Specialities have advancement tables',DATA.specialities.every(s=>DATA.advancement.specialities[s.id]));add('All supported Chapters have advancement tables',DATA.supportedChapters.every(id=>DATA.advancement.chapter[id]));add('Canonical armory names unique',new Set(DATA.armory.map(x=>x.name)).size===DATA.armory.length);add('Canonical psychic names unique',new Set(DATA.psychic.map(x=>x.name)).size===DATA.psychic.length);add('Bestiary names unique',new Set(DATA.bestiary.map(x=>x.name)).size===DATA.bestiary.length);add('Horde helper data',DATA.killMarkers.Novice===25&&DATA.encounterXP.Ordinary===100);add('Mission XP table',DATA.missionXP.Primary===300&&DATA.missionXP.Skilled===50);add('Standard issue armour roll mapping',true);add('Save migrations not called by render',!String(render).includes('migrateState'));add('One runtime script target',document.querySelectorAll('script[data-app]').length===1);add('Starting grouped skills are specialization-safe',!!DATA.baseStartingGroupSkills&&Array.isArray(DATA.tacticsGroups)&&DATA.tacticsGroups.length===7);add('Drive and Demolition indexed',!!skillRecord('Drive')&&!!skillRecord('Demolition'));add('No blanket Tactics starting skill',!(DATA.baseStartingSkills||[]).includes('Tactics'));add('Custom encounter profiles supported',typeof addCustomEnemy==='function');add('Complete Core Chapter trapping weapon choices',DATA.trappings['dark-angels'].some(x=>x.id==='da-ceremonial-sword')&&DATA.trappings['storm-wardens'].some(x=>x.id==='stw-sacris-claymore'));add('Mission complication table loaded',(DATA.missionComplications||[]).length===10);add('No duplicate DOM IDs',(()=>{let ids=[...document.querySelectorAll('[id]')].map(x=>x.id);return ids.length===new Set(ids).size})());return tests}
function setPBNoRender(d,k,val){let wanted=clamp(Math.trunc(Number(val)||0),0,20),others=CHAR_KEYS.filter(x=>x!==k).reduce((a,x)=>a+Number(d.pointBuy[x]||0),0);d.pointBuy[k]=Math.min(wanted,100-others);d.chars[k]=30+d.pointBuy[k]}

// Header controls and global D100.
document.getElementById('roleBtn').onclick=()=>{state.role=state.role==='gm'?'player':'gm';state.view=state.role==='gm'?(current()?'gm':'home'):(current()?'sheet':'home');save();render()};document.getElementById('surfaceBtn').onclick=()=>{state.surface=state.surface==='iron'?'parchment':'iron';save();render()};document.getElementById('d100').onclick=()=>{let ch=current();modal(`<h2>Quick d100</h2>${ch?`<label>Test<select id="quickPick"><optgroup label="Characteristics">${CHAR_KEYS.map(k=>`<option value="c:${k}">${CHAR_LABELS[k]}</option>`).join('')}</optgroup><optgroup label="Skills">${DATA.skills.map(s=>`<option value="s:${s.id}">${esc(s.name)}</option>`).join('')}</optgroup></select></label>`:'<p>No active Battle-Brother. This is a raw percentile roll.</p>'}<label>Modifier<input id="quickMod" type="number" value="0" step="10"></label><button class="btn primary" id="quickRoll">ROLL D100</button><div id="quickOut" class="result"></div>`);document.getElementById('quickRoll').onclick=()=>{let roll=d100roll();if(!ch){document.getElementById('quickOut').textContent=`${roll}`;return}let pick=document.getElementById('quickPick').value,base;if(pick.startsWith('c:'))base=characteristic(ch,pick.slice(2));else{let s=skillRecord(pick.slice(2));if(isGroupSkill(s)){let known=knownGroupSkills(ch,s.name);if(!known.length){document.getElementById('quickOut').textContent='No trained specialisation in that Advanced Skill Group.';return}let sp=known[0].spec;if(known.length>1){document.getElementById('quickOut').textContent=`Use the Skills section to choose a specific ${s.name} specialisation.`;return}base=skillTarget(ch,s,0,sp)}else base=skillTarget(ch,s);if(base===null){document.getElementById('quickOut').textContent='That Advanced Skill is untrained and cannot be attempted.';return}}let mod=clamp(Number(document.getElementById('quickMod').value)||0,-60,60),r=coreTest(base+mod,{roll});document.getElementById('quickOut').textContent=testText(r)}};
document.addEventListener('click',e=>{let b=e.target.closest('[data-activate-squad]');if(b)activateSquad(b.dataset.activateSquad)});

// Initial normalization once, never during ordinary rendering.
if(state.characters.length&&state.active<0)state.active=0;if(!state.characters.length&&!state.creator)state.view='home';recalculateCohesion(false);save();render();
</script></body></html>
