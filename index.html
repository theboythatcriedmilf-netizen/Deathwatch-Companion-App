function sheetArmourSummary(ch){let worn=armourIsWorn(ch),ap=effectiveArmourAP(ch),state=worn?'WORN':'REMOVED';if(ch.armourSystem==='terminator')return{title:'Astartes Terminator Armour',detail:`${state} · ${worn?'all Terminator armour rules active':'all Terminator armour rules inactive'}`,ap:worn?'AP 14 · All locations':'AP 0 · armour removed'};if(ch.armourSystem==='scout')return{title:'Deathwatch Scout Armour',detail:`${state} · Scout configuration`,ap:worn?(ch.scoutAP==='table'?'AP 6 · Arms / Body / Legs':'AP 7 Body/Arms · AP 5 Legs · detailed-source setting'):'AP 0 · armour removed'};let a=armourMark(ch);return{title:a?.name||'Astartes Power Armour',detail:`${state} · Helmet ${effectiveHelmetOn(ch)?'on':'off'} · systems ${worn&&ch.helmet?.systemsOnline?'online':'offline'} · ${worn&&ch.helmet?.sealed?'sealed':'unsealed'}`,ap:worn?Object.entries(ap).map(([k,v])=>`${k} ${v}`).join(' · '):'AP 0 · armour removed'}}
function sheetAdvanceSummary(ch){let chars=CHAR_KEYS.filter(k=>Number(ch.charAdvances?.[k]||0)>0).map(k=>`${k} +${Number(ch.charAdvances[k])*5}`),adv=(ch.advances||[]).map(a=>a.name).filter(Boolean);return{chars,adv}}

function redoLast(ch){if(!ch?.redoStack?.length){toast('Nothing to redo.');return}let e=ch.redoStack.pop(),redo=deep(ch.redoStack),undo=deep(ch.undoStack||[]),idx=state.characters.findIndex(x=>x.id===ch.id);undo.push({id:uid('undo'),label:e.label,snapshot:cleanTransactionSnapshot(ch),at:new Date().toISOString()});let restored=migrateCharacter(e.snapshot);restored.undoStack=undo.slice(-50);restored.redoStack=redo;restored.checkpoints=deep(ch.checkpoints||[]);recordActivity(restored,`Redid: ${e.label}`,'redo');if(idx>=0)state.characters[idx]=restored;save();render();toast(`Redid: ${e.label}`)}
function recordActivity(ch,label,kind='change',detail=''){if(!ch)return;ch.activityLog=ch.activityLog||[];ch.activityLog.push({id:uid('activity'),at:new Date().toISOString(),label:String(label||'Change'),kind,detail:String(detail||'')});ch.activityLog=ch.activityLog.slice(-60)}
function cleanUndoSnapshot(ch){return cleanTransactionSnapshot(ch)}
function pushUndo(ch,label){if(!ch)return;ch.undoStack=ch.undoStack||[];ch.redoStack=ch.redoStack||[];ch.undoStack.push({id:uid('undo'),label:String(label||'Change'),snapshot:cleanTransactionSnapshot(ch),at:new Date().toISOString()});ch.undoStack=ch.undoStack.slice(-50);ch.redoStack=[]}
function undoLast(ch){if(!ch?.undoStack?.length){toast('Nothing to undo.');return}let e=ch.undoStack.pop(),remaining=deep(ch.undoStack),redo=deep(ch.redoStack||[]),idx=state.characters.findIndex(x=>x.id===ch.id);redo.push({id:uid('redo'),label:e.label,snapshot:cleanTransactionSnapshot(ch),at:new Date().toISOString()});let restored=migrateCharacter(e.snapshot);restored.undoStack=remaining;restored.redoStack=redo.slice(-50);restored.checkpoints=deep(ch.checkpoints||[]);recordActivity(restored,`Undid: ${e.label}`,'undo');if(idx>=0)state.characters[idx]=restored;save();render();toast(`Undid: ${e.label}`)}
function favoriteKey(type,id){return `${type}:${id}`}
function isFavorite(ch,type,id){return (ch.favorites||[]).includes(favoriteKey(type,id))}
function toggleFavorite(ch,type,id){let k=favoriteKey(type,id);ch.favorites=ch.favorites||[];if(ch.favorites.includes(k))ch.favorites=ch.favorites.filter(x=>x!==k);else ch.favorites.push(k);recordActivity(ch,`${ch.favorites.includes(k)?'Pinned':'Unpinned'} ${id}`,'favorite');save();render()}
function recordRecent(ch,type,id,label=''){if(!ch)return;ch.recentRecords=ch.recentRecords||[];let key=favoriteKey(type,id);ch.recentRecords=ch.recentRecords.filter(x=>x.key!==key);ch.recentRecords.push({key,type,id,label:label||id,at:new Date().toISOString()});ch.recentRecords=ch.recentRecords.slice(-10);save()}
function gearStatus(ch,name){return ch.gearState?.[name]||'carried'}
function setGearStatus(ch,name,status){if(!['stored','carried','equipped'].includes(status))return;pushUndo(ch,`${name} equipment state`);ch.gearState[name]=status;ch.equippedGear=playerEquipmentNames(ch).filter(n=>ch.gearState[n]==='equipped');recordActivity(ch,`${name}: ${status}`,'equipment');save();render()}
function kitRecord(name){return DATA.fieldGear.find(x=>x.name===name)||DATA.cybernetics.find(x=>x.name===name)||null}
function kitNames(ch){return playerEquipmentNames(ch)}
function kitStatusButtons(ch,name){let st=gearStatus(ch,name);return `<div class="gearStateBtns">${['stored','carried','equipped'].map(x=>`<button class="btn ${st===x?'active':''}" data-gearstate="${esc(name)}" data-status="${x}">${x.toUpperCase()}</button>`).join('')}</div>`}
function saveLoadoutModal(ch){let def=`Mission Kit ${(ch.loadouts||[]).length+1}`,snap=missionKitSnapshot(ch);modal(`<h2>Save Mission Kit</h2><p class="small">Stores your current non-weapon field-equipment readiness. You may also save the current non-weapon Requisition list as a template. The saved kit never changes your Requisition fund and must be paid again for each Mission.</p><label>Name<input id="kitName" value="${esc(def)}"></label><label class="checkline"><input id="kitIncludeReq" type="checkbox" checked> Save current non-weapon Requisition list as a per-Mission template (${snap.fieldRequisition.length} item${snap.fieldRequisition.length===1?'':'s'})</label><button class="btn primary" id="saveKitNow">SAVE MISSION KIT</button>`,{label:'Save Mission Kit'});document.getElementById('saveKitNow').onclick=()=>{let name=document.getElementById('kitName').value.trim()||def,include=document.getElementById('kitIncludeReq').checked;pushUndo(ch,`Save Mission Kit ${name}`);ch.loadouts.push(normalizeMissionKit({id:uid('kit'),name,kind:'mission-kit-v2',gear:snap.gear,fieldRequisition:include?snap.fieldRequisition:[],referenceFund:snap.referenceFund,at:new Date().toISOString()}));recordActivity(ch,`Saved Mission Kit: ${name}`,'equipment',include?`${missionKitCost(ch.loadouts[ch.loadouts.length-1])} Req template`:'Readiness only');save();closeModal();render();toast(`Mission Kit saved: ${name}`)}}
function applyLoadout(ch,id){let raw=(ch.loadouts||[]).find(x=>x.id===id);if(!raw)return;let k=normalizeMissionKit(raw),fund=ch.requisitionFund,before=JSON.stringify(ch.currentRequisition||[]);pushUndo(ch,`Apply Mission Kit ${k.name}`);for(const n of kitNames(ch))ch.gearState[n]=normalizeGearStateValue(k.gear?.[n]||'stored');ch.equippedGear=kitNames(ch).filter(n=>ch.gearState[n]==='equipped');recordActivity(ch,`Applied Mission Kit readiness: ${k.name}`,'equipment');if(ch.requisitionFund!==fund||JSON.stringify(ch.currentRequisition||[])!==before)throw new Error('Mission Kit readiness attempted to alter Requisition state');save();render();toast(`Mission Kit readiness applied: ${k.name}`)}
function addCounterModal(ch){modal(`<h2>Add Resource Counter</h2><p class="small">Track a GM-approved expendable or limited-use character resource.</p><label>Name<input id="counterName"></label><div class="grid"><label>Current<input id="counterCur" type="number" value="1"></label><label>Maximum<input id="counterMax" type="number" value="1"></label></div><label class="checkline"><input id="counterSession" type="checkbox"> Reset to maximum on New Session</label><button class="btn primary" id="counterSave">ADD</button>`,{label:'Add Resource Counter'});document.getElementById('counterSave').onclick=()=>{let name=document.getElementById('counterName').value.trim();if(!name)return;let max=Math.max(0,Number(document.getElementById('counterMax').value)||0),cur=clamp(Number(document.getElementById('counterCur').value)||0,0,max||9999);pushUndo(ch,`Add resource ${name}`);ch.resourceCounters.push({id:uid('counter'),name,current:cur,max,resetSession:document.getElementById('counterSession').checked});recordActivity(ch,`Added resource: ${name}`,'resource');save();closeModal();render()}}
function adjustCounter(ch,id,delta){let c=(ch.resourceCounters||[]).find(x=>x.id===id);if(!c)return;pushUndo(ch,`Adjust ${c.name}`);c.current=clamp(Number(c.current||0)+Number(delta||0),0,Number(c.max||0)||9999);recordActivity(ch,`${c.name}: ${delta>0?'+':''}${delta}`,'resource');save();render()}
function startTrackedEffectModal(ch,name='',source='Manual'){modal(`<h2>Track Active Effect</h2><p class="small guidedOnly">Use this for a temporary bonus, penalty, condition reminder, sustained effect, or GM-defined rule. Structured modifiers automatically flow into the same resolver used by the sheet and Skills.</p><label>Name<input id="effectName" value="${esc(name)}"></label><label>Source<input id="effectSource" value="${esc(source)}"></label><div class="grid"><label>Duration<input id="effectDuration" type="number" min="0" value="0"></label><label>Unit<select id="effectUnit"><option>Rounds</option><option>Turns</option><option>Minutes</option><option>Scene</option><option>Session</option><option>Manual</option></select></label></div><fieldset><legend>Optional automated modifier</legend><label>Applies to<select id="effectModType"><option value="">Reminder only</option><option value="characteristic">Characteristic</option><option value="skill">Skill</option><option value="movement">Movement</option></select></label><label>Target<input id="effectModTarget" placeholder="Example: Ag, skill-awareness, half, or *"></label><label>Modifier<input id="effectModValue" type="number" value="0"></label></fieldset><label>Reminder<textarea id="effectNote"></textarea></label><button class="btn primary" id="effectAdd">START TRACKING</button>`,{label:'Track Active Effect'});document.getElementById('effectAdd').onclick=()=>{let n=document.getElementById('effectName').value.trim();if(!n)return;pushUndo(ch,`Track effect ${n}`);let type=document.getElementById('effectModType').value,target=document.getElementById('effectModTarget').value.trim()||'*',value=Number(document.getElementById('effectModValue').value)||0,modifiers=type&&value?[{type,target,value}]:[];ch.activeEffects.push({id:uid('effect'),name:n,source:document.getElementById('effectSource').value.trim(),remaining:Math.max(0,Number(document.getElementById('effectDuration').value)||0),unit:document.getElementById('effectUnit').value,note:document.getElementById('effectNote').value.trim(),modifiers,manual:true});recordActivity(ch,`Effect active: ${n}`,'effect',structuredModifierText({modifiers}));save();closeModal();render()}}
function nextSessionRound(ch){pushUndo(ch,'Advance session round');ch.sessionRound=Math.max(1,Number(ch.sessionRound)||1)+1;resetActionEconomy(ch);let expired=[];for(const e of ch.activeEffects||[])if(e.unit==='Rounds'&&e.remaining>0){e.remaining--;if(e.remaining<=0)expired.push(e.id)}if(expired.length){let names=(ch.activeEffects||[]).filter(e=>expired.includes(e.id)).map(e=>e.name);ch.activeEffects=(ch.activeEffects||[]).filter(e=>!expired.includes(e.id));recordActivity(ch,`Expired effect${names.length===1?'':'s'}: ${names.join(', ')}`,'effect')}v80Ensure(ch);for(const st of Object.values(ch.weaponState||{}))if(Number(st.cooldown)>0)st.cooldown=Math.max(0,Number(st.cooldown)-1);recordActivity(ch,`Round ${ch.sessionRound}`,'session');save();render()}
function activeEffectRows(ch){let out=[];for(const n of ch.sustainedPowers||[])out.push(`<div class="effectRow"><div><b>${esc(n)}</b><div class="small">Sustained psychic power</div></div><button class="btn danger" data-unsustain="${esc(n)}">END</button></div>`);for(const e of ch.activeEffects||[]){let mods=structuredModifierText(e);out.push(`<div class="effectRow"><div><b>${esc(e.name)}</b><div class="small">${esc(e.source||'Tracked effect')}${e.remaining?` · ${e.remaining} ${esc(e.unit)}`:` · ${esc(e.unit||'Manual')}`}${e.note?` · ${esc(e.note)}`:''}</div>${mods?`<div class="effectMods"><span class="modifierChip">${esc(mods)}</span></div>`:''}</div><button class="btn danger" data-endeffect="${e.id}">END</button></div>`)}return out.join('')||'<div class="emptyHelp">No active tracked effects.</div>'}
const CARRY_TABLE={0:[0.9,2.25,4.5],1:[2.25,4.5,9],2:[4.5,9,18],3:[9,18,36],4:[18,36,72],5:[27,54,108],6:[36,72,144],7:[45,90,180],8:[56,112,224],9:[67,134,268],10:[78,156,312],11:[90,180,360],12:[112,224,448],13:[225,450,900],14:[337,674,1348],15:[450,900,1800],16:[675,1350,2700],17:[900,1800,3600],18:[1350,2700,5400],19:[1800,3600,7200],20:[2250,4500,9000]};
function parseWeight(x){let m=String(x??'').match(/([0-9]+(?:\.[0-9]+)?)/);return m?Number(m[1]):null}
function knownKitWeight(ch){let total=0,unknown=[];for(const n of kitNames(ch)){if(!['carried','equipped'].includes(gearStatus(ch,n)))continue;let r=kitRecord(n),w=parseWeight(r?.weight??r?.wt);if(Number.isFinite(w))total+=w;else unknown.push(n)}return{total,unknown}}
function carryingInfo(ch){let sb=Math.floor(characteristic(ch,'S')/10),tb=Math.floor(characteristic(ch,'T')/10),sum=clamp(sb+tb,0,20),row=CARRY_TABLE[sum],auto=knownKitWeight(ch),manual=Math.max(0,Number(ch.manualCarriedWeight)||0),tracked=auto.total+manual;return{sb,tb,sum,carry:row[0],lift:row[1],push:row[2],tracked,auto,manual,encumbered:tracked>row[0]&&tracked<=row[1],overLift:tracked>row[1]}}
function characteristicBreakdown(ch,key){let r=resolveCharacteristic(ch,key);return{final:r.value,lines:r.lines}}

('sheetDemeanours').onclick=()=>setView('demeanours');document.getElementById('sheetTrackEffect').onclick=()=>startTrackedEffectModal(ch);document.getElementById('sheetAddCounter').onclick=()=>addCounterModal(ch);document.getElementById('sheetAdvanceFull').onclick=()=>setView('advance');document.getElementById('sheetTimeline').onclick=()=>setView('timeline');document.querySelectorAll('[data-resistance-why]').forEach(b=>b.onclick=()=>resistanceWhyModal(ch));let u=document.getElementById('sheetUndo');if(u)u.onclick=()=>undoLast(ch);document.getElementById('movementWhy').onclick=()=>modal(`<h2>Movement</h2><p>Current Agility ${characteristic(ch,'Ag')}. The active armour configuration is then applied by the movement calculator.</p>`,{label:'Movement calculation'})}
function resourceBox(label,val,id){return `<div class="card resourceCard"><span>${label}</span><b>${val}</b><div><button class="mini" data-res="${id}" data-delta="-1">−</button><button class="mini" data-res="${id}" data-delta="1">+</button></div></div>`}
function wireResourceControls(ch){document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{let d=Number(b.dataset.delta),r=b.dataset.res;if(r==='fate'&&d<0){spendFateModal(ch);return}pushUndo(ch,`Adjust ${r}`);if(r==='damage')ch.wounds.damage=clamp(Number(ch.wounds.damage||0)+d,0,Math.max(0,Number(ch.wounds.max)||0));if(r==='critical')ch.wounds.critical=Math.max(0,Number(ch.wounds.critical||0)+d);if(r==='fatigue')ch.fatigue=Math.max(0,ch.fatigue+d);if(r==='fate'&&d>0)ch.fate.current=Math.min(ch.fate.max,ch.fate.current+1);if(r==='cohesion')state.mission.cohesion.current=clamp(state.mission.cohesion.current+d,0,state.mission.cohesion.max);if(r==='insanity')ch.insanity=Math.max(0,ch.insanity+d);if(r==='corruption')ch.corruption=Math.max(0,ch.corruption+d);recordActivity(ch,`${r}: ${d>0?'+':''}${d}`,'resource');save();render()})}
function conditionHTML(ch){let active=ch.conditions||[];return active.length?active.map(x=>`<span class="pill warning">${esc(x)}</span>`).join(' '):'<span class="small">No active conditions.</span>'}
function conditionsModal(ch){modal(`<h2>Conditions</h2>${DATA.conditions.map(x=>`<label class="check"><input type="checkbox" data-cond="${esc(x)}" ${ch.conditions.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}<button class="btn primary" id="saveCond">DONE</button>`);document.querySelectorAll('[data-cond]').forEach(x=>x.onchange=()=>{if(x.checked&&!ch.conditions.includes(x.dataset.cond))ch.conditions.push(x.dataset.cond);if(!x.checked)ch.conditions=ch.conditions.filter(v=>v!==x.dataset.cond)});document.getElementById('saveCond').onclick=()=>{save();closeModal();render()}}
function charDamageModal(ch){modal(`<h2>Characteristic Damage</h2><p class="small">Temporary damage directly lowers the Characteristic and therefore its Bonus, Movement and related Tests.</p>${CHAR_KEYS.map(k=>`<label>${k}<input type="number" min="0" max="99" data-cd="${k}" value="${ch.charDamage[k]||0}"></label>`).join('')}<button class="btn primary" id="saveCD">SAVE</button>`);document.getElementById('saveCD').onclick=()=>{document.querySelectorAll('[data-cd]').forEach(i=>ch.charDamage[i.dataset.cd]=Math.max(0,Number(i.value)||0));save();closeModal();render()}}
function honourHTML(ch){let eligible=ch.renown>=60,awarded=!!ch.honours.cruxTerminus;return `<div class="listrow"><div><b>Crux Terminatus</b><div class="small">${awarded?'Awarded':eligible?'Eligible for GM consideration':'Requires 60 Renown to be considered'}</div></div>${state.role==='gm'&&eligible?`<button class="btn ${awarded?'danger':'primary'}" id="cruxBtn">${awarded?'REVOKE':'AWARD'}</button>`:''}</div>`}
function squadManeuversHTML(ch,allowActivate=true){let cp=chapterBy(ch.chapter),avail=missionSquadAbilities(),active=state.mission.activeSquad||[];if(!avail.length)return '<div class="empty">No Squad Mode maneuvers are assigned yet. Choose a squad leader and Oath in Mission to define the current list.</div>';return avail.map(a=>{let eligible=!a.chapter||a.chapter===cp?.name,isActive=active.includes(a.name),canUse=allowActivate&&ch.mode==='squad'&&eligible&&!isActive;return `<div class="rulebox"><div class="listrow"><div><b>${esc(a.name)}</b><div class="small">${esc(a.subtype||'Squad Mode')} · Action ${esc(a.action||'—')} · Cohesion ${a.cost??'—'} · ${a.sustained?'Sustained':'Not sustained'}${a.chapter?` · ${esc(a.chapter)} only`:''}</div></div>${isActive?'<span class="pill">ACTIVE</span>':''}</div><p><b>Effect:</b> ${esc(a.summary||'No rules summary indexed.')}</p><div class="source">${esc(sourceText(a))}</div>${allowActivate?`<button class="btn ${canUse?'primary':''}" data-activate-squad="${esc(a.name)}" ${canUse?'':'disabled'}>${isActive?'ALREADY ACTIVE':!eligible?'CHAPTER-LOCKED':ch.mode!=='squad'?'ENTER SQUAD MODE TO USE':'ACTIVATE'}</button>`:''}</div>`}).join('')}
function oathReferenceHTML(l,showAll=false){let options=showAll?DATA.oaths:DATA.oaths.filter(o=>oathAvailable(o,l));if(!options.length)return '<div class="empty">No Oaths are available for the recorded squad leader’s Speciality.</div>';return options.map(o=>{let abilities=(o.abilities||[]).map(n=>DATA.squad.find(a=>a.name===n)).filter(Boolean),matches=l?oathAvailable(o,l):null;return `<div class="rulebox"><b>${esc(o.name)}</b>${showAll&&matches===false?'<span class="pill warning">RECORDED LEADER DOES NOT MATCH PREREQUISITE</span>':''}<div class="small">Leader prerequisite: ${esc((o.specialities||[]).map(id=>specBy(id)?.name||id).join(', '))}</div><p><b>Mission effect:</b> ${esc(o.effect||'')}</p>${abilities.map(a=>`<div class="small"><b>${esc(a.name)}</b> — ${esc(a.summary||'Rules summary not loaded in this build.')}</div>`).join('')}</div>`}).join('')}
function campaignLedgerModal(ch){let custom=(ch.customRules||[]).map((x,i)=>`<div class="homebrewRule"><b>${esc(x.name)}</b><p class="small">${esc(x.effect||'')}</p><button class="btn danger" data-rmcustomrule="${i}">REMOVE</button></div>`).join('');modal(`<h2>Campaign Ledger</h2><p class="small">These are player-owned fields for recording awards, rulings and homebrew from a GM who may never open this app. Canonical records remain untouched.</p><label>Available XP<input id="ledgerXP" type="number" min="0" value="${Number(ch.xp.available)||0}"></label><label>Renown<input id="ledgerRenown" type="number" min="0" value="${Number(ch.renown)||0}"></label><label>Fate maximum<input id="ledgerFateMax" type="number" min="0" value="${Number(ch.fate.max)||0}"></label><label>Current Fate<input id="ledgerFateCurrent" type="number" min="0" value="${Number(ch.fate.current)||0}"></label><label>Requisition fund<input id="ledgerReq" type="number" min="0" value="${Number(ch.requisitionFund)||0}"></label><label>Requisition / allocation note<input id="ledgerReqNote" value="${esc(ch.requisitionNote||'')}"></label><label>GM rulings / homebrew notes<textarea id="ledgerNotes" rows="5">${esc(ch.notes||'')}</textarea></label><div class="card subtle"><h3>Custom character rules</h3><p class="small">Use this for a GM-approved trait, house rule, campaign reward or supplement rule that is not yet in the canonical data.</p>${custom||'<div class="empty">No custom character rules.</div>'}<button class="btn" id="addCustomRule">+ ADD CUSTOM RULE</button></div><button class="btn primary" id="saveLedger">SAVE LEDGER</button>`,{label:'Campaign Ledger'});document.querySelectorAll('[data-rmcustomrule]').forEach(b=>b.onclick=()=>{ch.customRules.splice(Number(b.dataset.rmcustomrule),1);save();closeModal();campaignLedgerModal(ch)});document.getElementById('addCustomRule').onclick=()=>{let name=prompt('Custom rule / trait name');if(!name)return;let effect=prompt('What does it do?')||'';let source=prompt('Source or GM note (optional)')||'';ch.customRules.push({id:uid('customrule'),name:name.trim(),effect,source});save();closeModal();campaignLedgerModal(ch)};document.getElementById('saveLedger').onclick=()=>{let before={xp:ch.xp.available,renown:ch.renown,fateMax:ch.fate.max,fateCurrent:ch.fate.current,req:ch.requisitionFund};ch.xp.available=Math.max(0,Number(document.getElementById('ledgerXP').value)||0);ch.renown=Math.max(0,Number(document.getElementById('ledgerRenown').value)||0);ch.fate.max=Math.max(0,Number(document.getElementById('ledgerFateMax').value)||0);ch.fate.current=clamp(Number(document.getElementById('ledgerFateCurrent').value)||0,0,ch.fate.max);ch.requisitionFund=Math.max(reqSpent(ch),Number(document.getElementById('ledgerReq').value)||0);ch.requisitionNote=document.getElementById('ledgerReqNote').value;ch.notes=document.getElementById('ledgerNotes').value;let changes=[];if(before.xp!==ch.xp.available)changes.push(`XP ${before.xp}→${ch.xp.available}`);if(before.renown!==ch.renown)changes.push(`Renown ${before.renown}→${ch.renown}`);if(before.fateMax!==ch.fate.max||before.fateCurrent!==ch.fate.current)changes.push(`Fate ${before.fateCurrent}/${before.fateMax}→${ch.fate.current}/${ch.fate.max}`);if(before.req!==ch.requisitionFund)changes.push(`Req ${before.req}→${ch.requisitionFund}`);if(changes.length)addTimeline(ch,'Ledger','Campaign Ledger updated',changes.join(' · '));save();closeModal();render();toast('Campaign ledger updated.')}}
function modeAbilityHTML(ch){let cp=chapterBy(ch.chapter),rankBonus=Number(ch.sessionAbilities?.soloRankBonus||0)+Number(ch.sessionAbilities?.demeanourSoloRankBonus||0),r=rankFor(ch)+rankBonus;if(ch.mode==='solo'){let solo=DATA.solo.find(x=>x.name===cp?.solo),codex=DATA.rules.filter(x=>x.category==='Solo Mode'&&Number(x.rank||99)<=r);return `<h2>Solo Mode${rankBonus?` · +${rankBonus} effective Rank (session effect)`:''}</h2>${solo?ruleItem(solo):''}${codex.map(ruleItem).join('')}` }return `<h2>Squad Mode · Support ${supportRangeText(rankFor(ch))}</h2><p class="small">The full maneuver effect, action, Cohesion cost, sustain status and eligibility are shown before activation.</p>${squadManeuversHTML(ch,true)}`}
function ruleItem(x){return `<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.activation||x.category||'')} ${x.rank?`· Rank ${x.rank}`:''}</div><p>${esc(x.summary||x.effect||'')}</p><div class="source">${esc(sourceText(x))}</div></div></div>`}
function supportRangeText(r){return r<=3?'30m · visual':r<=6?'60m · close vox/vocal':'120m · close vox/vocal'}
function attemptSquadMode(ch){if(state.mission.cohesion.current<1){toast('The Kill-team needs at least 1 Cohesion.','bad');return}modal(`<h2>Enter Squad Mode</h2><button class="btn primary" id="squadFull">FULL ACTION · automatic from next Turn</button><button class="btn" id="squadChallenge">COHESION CHALLENGE · Free/Reaction</button><p class="small">A Battle-Brother must also be in Support Range of at least one Kill-team member.</p>`);document.getElementById('squadFull').onclick=()=>{ch.mode='squad';save();closeModal();render()};document.getElementById('squadChallenge').onclick=()=>{let roll=rollDie(10),target=state.mission.cohesion.current+(state.mission.oath==='loyalty'?1:0),ok=roll<=target;ch.mode='squad';save();closeModal();toast(`Cohesion Challenge ${roll} vs ${target}: ${ok?'passed':'failed — enter following Turn after losing the relevant Turn'}`);render()}}

function groupSkillRollModal(ch,s,known){modal(`<h2>${esc(s.name)} Test</h2><label>Specialisation<select id="groupSpecRoll">${known.map(x=>`<option value="${esc(x.spec)}">${esc(x.spec)}${x.bonus?` +${x.bonus}`:''}</option>`).join('')}</select></label><label>Additional modifier<input id="groupSpecMod" type="number" value="0" step="10"></label><button class="btn primary" id="groupSpecGo">ROLL D100</button><div id="groupSpecOut" class="result"></div>`);document.getElementById('groupSpecGo').onclick=()=>{let sp=document.getElementById('groupSpecRoll').value,mod=clamp(Number(document.getElementById('groupSpecMod').value)||0,-60,60),t=skillTarget(ch,s,mod,sp),r=coreTest(t);document.getElementById('groupSpecOut').textContent=testText(r)}}
function quickTestModal(title,base){modal(`<h2>${esc(title)}</h2><label>Base target<input id="qtBase" type="number" value="${base}"></label><label>Additional modifier<input id="qtMod" type="number" value="0" step="10"></label><button class="btn primary" id="qtRoll">ROLL D100</button><div id="qtOut" class="result"></div>`);document.getElementById('qtRoll').onclick=()=>{let t=Number(document.getElementById('qtBase').value)+clamp(Number(document.getElementById('qtMod').value)||0,-60,60),r=coreTest(t);document.getElementById('qtOut').textContent=testText(r)}}

function renderAdvance(){let ch=current();if(!ch)return;let rank=rankFor(ch),scope=state.advanceScope||'general';if(ch.startingXPPhase&&scope==='deathwatch')scope=state.advanceScope='general';let rows=advanceRows(ch,scope,rank);let chars=CHAR_KEYS.map(k=>{let stage=Number(ch.charAdvances[k]||0),cost=stage<4?DATA.advancement.charCosts[ch.speciality]?.[k]?.[stage]:null;return `<div class="listrow"><div><b>${k} +${stage*5}</b><div class="small">Stage ${stage}/4 · Current ${characteristic(ch,k)}</div></div>${cost?`<button class="btn" data-previewchar="${k}" ${ch.xp.available<cost?'disabled':''}>PREVIEW · ${cost} XP</button>`:'<span class="pill">MAX</span>'}</div>`}).join('');let plan=(ch.advancePlan||[]).map(x=>`<div class="planRow"><div><b>${esc(x.name)}</b><div class="small">${x.cost?`${x.cost} XP · `:''}${esc(x.kind||'Advance')}${x.prereq?` · ${esc(x.prereq)}`:''}</div></div><button class="mini danger" data-rmplan="${esc(x.key)}">×</button></div>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Chapter II · Advancement</div><h1>Experience & Advancement</h1><p>${ch.xp.available} XP available · ${ch.xp.spent} spent · Total ${totalXP(ch)} · Rank ${rank}</p></section>${attentionHTML(ch)}${ch.startingXPPhase?`<div class="card notice"><b>Starting 1,000 XP phase</b><p class="small">Starting XP may be spent on Chapter, Rank 1 General Space Marine, and Rank 1 Speciality Advances—not Deathwatch Advances. End this phase when the Battle-Brother begins active Deathwatch service.</p><button class="btn primary" id="endStartXP">BEGIN ACTIVE WATCH</button></div>`:''}<div class="card"><div class="sectionLead"><h2>Advance Plan / Wishlist</h2><span class="pill">${(ch.advancePlan||[]).length}</span></div><p class="small guidedOnly">Planning never spends XP. Use it to compare future choices without committing your character.</p>${plan||'<div class="emptyHelp">Nothing planned yet. Preview an Advance or psychic power and choose Plan.</div>'}</div><div class="card"><h2>Characteristic Advances</h2>${chars}</div><div class="tabs">${[['general','General'],['deathwatch','Deathwatch'],['speciality','Speciality'],['chapter','Chapter']].map(([id,n])=>`<button data-advscope="${id}" class="${scope===id?'active':''}">${n}</button>`).join('')}</div><div class="card"><h2>${esc(scopeTitle(scope,ch))}</h2>${rows.map((r,i)=>advanceRowHTML(ch,r,i)).join('')||'<div class="empty">No advances indexed at this Rank.</div>'}</div><div class="card"><h2>Honours & Elite Advances</h2>${honourHTML(ch)}<button class="btn" id="eliteAdv">RECORD ELITE / CUSTOM ADVANCE</button></div><div class="card"><h2>Purchased Advances</h2>${ch.xpLedger.length?ch.xpLedger.slice().reverse().map(x=>`<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${x.cost} XP · ${esc(x.source||'')}</div>${x.effect?`<p class="small guidedOnly">${esc(x.effect)}</p>`:''}</div></div>`).join(''):'<div class="empty">None yet.</div>'}</div>`;document.querySelectorAll('[data-advscope]').forEach(b=>b.onclick=()=>{if(ch.startingXPPhase&&b.dataset.advscope==='deathwatch'){toast('Deathwatch Advances are unavailable during the starting 1,000 XP phase.','bad');return}state.advanceScope=b.dataset.advscope;save();render()});let es=document.getElementById('endStartXP');if(es)es.onclick=()=>{pushUndo(ch,'End starting XP phase');ch.startingXPPhase=false;recordActivity(ch,'Began active Watch service','advance');save();render()};document.querySelectorAll('[data-previewchar]').forEach(b=>b.onclick=()=>characteristicAdvancePreview(ch,b.dataset.previewchar));document.querySelectorAll('[data-previewadv]').forEach(b=>b.onclick=()=>advancePreviewModal(ch,JSON.parse(decodeURIComponent(b.dataset.previewadv))));document.querySelectorAll('[data-rmplan]').forEach(b=>b.onclick=()=>{pushUndo(ch,'Remove planned advance');ch.advancePlan=ch.advancePlan.filter(x=>x.key!==b.dataset.rmplan);save();render()});document.querySelectorAll('[data-openpsykana]').forEach(b=>b.onclick=()=>setView('psykana'));document.getElementById('eliteAdv').onclick=()=>eliteAdvance(ch);let cb=document.getElementById('cruxBtn');if(cb)cb.onclick=()=>{pushUndo(ch,'Change honour status');ch.honours.cruxTerminus=!ch.honours.cruxTerminus;save();render()}}
function scopeTitle(scope,ch){return scope==='general'?'General Space Marine Advances':scope==='deathwatch'?'Deathwatch Advances':scope==='speciality'?specBy(ch.speciality).name:`${chapterBy(ch.chapter)?.name} Advances`}
function advanceRows(ch,scope,rank){let table;if(scope==='general')table=DATA.advancement.general;if(scope==='deathwatch')table=DATA.advancement.deathwatch;if(scope==='speciality')table=DATA.advancement.specialities[ch.speciality];if(scope==='chapter')table=DATA.advancement.chapter[ch.chapter];if(!table)return[];if(scope==='chapter'&&Array.isArray(table))return table.map(x=>({...x,rank:0,scope}));let arr=[];for(let r=1;r<=rank;r++){let rows=table[String(r)]||table[r]||[];if(!Array.isArray(rows))continue;for(const x of rows)arr.push({...x,rank:r,scope})}return arr}

function psychicPowerSlots(ch){
  if(!ch||ch.speciality!=='librarian')return{total:0,used:0,remaining:0};
  let total=0,rank=rankFor(ch),table=DATA.advancement?.specialities?.librarian||{};
  for(let r=1;r<=rank;r++)for(const a of (table[String(r)]||table[r]||[]))if(String(a.type||'').toLowerCase()==='psychic power'){
    let m=String(a.name||'').match(/\(x(\d+)\)/i);total+=m?Number(m[1]):1;
  }
  let recorded=(ch.advances||[]).filter(a=>String(a.type||'').toLowerCase()==='psychic power'&&a.scope==='librarian').length;
  let legacy=Math.max(0,(ch.powers||[]).length-3);let used=Math.max(recorded,legacy);
  return{total,used,remaining:Math.max(0,total-used)};
}

function wireArmory(ch,budget){let sf=document.getElementById('saveReqFund');if(sf)sf.onclick=()=>{pushUndo(ch,'Set Requisition fund');ch.requisitionFund=Math.max(reqSpent(ch),Number(document.getElementById('reqFund').value)||0);ch.requisitionNote=document.getElementById('reqNote').value;recordActivity(ch,'Requisition fund updated','resource',String(ch.requisitionFund));save();render()};let adj=document.getElementById('applyReqAdjust');if(adj)adj.onclick=()=>{pushUndo(ch,'Adjust Requisition fund');ch.requisitionFund=Math.max(reqSpent(ch),Math.max(0,Number(ch.requisitionFund)||0)+(Number(document.getElementById('reqAdjust').value)||0));ch.requisitionNote=document.getElementById('reqNote').value;recordActivity(ch,'Requisition fund adjusted','resource',String(ch.requisitionFund));save();render()};let sm=document.getElementById('syncMissionReq');if(sm)sm.onclick=()=>{pushUndo(ch,'Sync Requisition from Mission');ch.requisitionFund=Math.max(reqSpent(ch),missionRequisition());ch.requisitionNote=`Synced from ${state.mission.name}: ${missionRequisition()} Requisition`;recordActivity(ch,'Requisition synced from Mission','resource',String(ch.requisitionFund));save();render()};let ra=document.getElementById('returnAllReq');if(ra)ra.onclick=()=>{if(confirm('Return all temporary field-equipment requisition?')){pushUndo(ch,'Return temporary field equipment');let ret=ch.currentRequisition.filter(v=>DATA.fieldGear.some(g=>g.name===v.name));for(const x of ret){ch.requisitionHistory.push({at:new Date().toISOString(),action:'return',name:x.name,req:x.req});delete ch.gearState[x.name]}ch.currentRequisition=ch.currentRequisition.filter(v=>!DATA.fieldGear.some(g=>g.name===v.name));recordActivity(ch,'Returned temporary field equipment','equipment');save();render()}};document.querySelectorAll('[data-returnreq]').forEach(b=>b.onclick=()=>{let x=ch.currentRequisition.find(v=>v.id===b.dataset.returnreq);if(!x)return;pushUndo(ch,`Return ${x.name}`);ch.currentRequisition=ch.currentRequisition.fi function toggleReq(ch,name){let rec=DATA.fieldGear.find(x=>x.name===name);if(!rec)return;let req=Number(rec.req)||0;if(!renownMeets(ch.renown,rec.renown)){toast('Renown requirement not met.','bad');return}if(reqAvailable(ch)<req){toast('Not enough Requisition remaining.','bad');return}pushUndo(ch,`Requisition ${name}`);let item={id:uid('req'),name,req,at:new Date().toISOString()};ch.currentRequisition.push(item);ch.requisitionHistory.push({at:item.at,action:'requisition',name,req});ch.gearState[name]=ch.gearState[name]||'carried';recordActivity(ch,`Requisitioned field equipment: ${name}`,'equipment',`${req} Req`);save();render()}

function manifestModal(ch,name){let p=DATA.psychic.find(x=>x.name===name);if(!p)return;recordRecent(ch,'power',name,name);let sustainedCount=(ch.sustainedPowers||[]).length;modal(`<h2>${esc(p.name)}</h2><p>${esc(p.effect)}</p><label>Power level<select id="powerLevel"><option>Fettered</option><option selected>Unfettered</option><option>Push</option></select></label><label>Additional modifier<input id="psyMod" type="number" value="0" step="10"></label><button class="btn primary" id="manifestRoll">FOCUS POWER TEST</button><div id="psyOut" class="result"></div>`);document.getElementById('manifestRoll').onclick=()=>{let level=document.getElementById('powerLevel').value,basePR=Number(ch.psyRating||3),pr=level==='Fettered'?Math.ceil(basePR/2):level==='Push'?basePR+3:basePR;if(sustainedCount>=2)pr=Math.max(0,pr-sustainedCount);let mod=clamp(Number(document.getElementById('psyMod').value)||0,-60,60),target=characteristic(ch,'WP')+5*pr+mod+conditionPenalty(ch),r=coreTest(target,{focusPower:true}),dbl=r.roll%11===0,phen=level==='Push'||(level==='Unfettered'&&dbl);if(level==='Push'&&dbl)ch.fatigue+=1;if(r.success&&p.sustained&&!ch.sustainedPowers.includes(name)){pushUndo(ch,`Sustain ${name}`);ch.sustainedPowers.push(name);recordActivity(ch,`Sustaining psychic power: ${name}`,'effect')}recordActivity(ch,`Focus Power Test: ${name}`,'roll',testText(r));save();document.getElementById('psyOut').innerHTML=`${esc(testText(r))}<br>Effective PR ${pr}${phen?'<br><b>Psychic Phenomena triggered</b>':''}`}}

function parseRoF(s){let parts=String(s||'').split('/');return {single:parts[0]!=='–'&&parts[0]!=='-',semi:Number(parts[1])||0,full:Number(parts[2])||0}}
function hitLocation(roll){let s=String(roll).padStart(2,'0'),rev=Number(s.split('').reverse().join(''));if(rev===0)rev=100;if(rev<=10)return'Head';if(rev<=20)return'Right Arm';if(rev<=30)return'Left Arm';if(rev<=70)return'Body';if(rev<=85)return'Right Leg';return'Left Leg'}


function leader(){return state.characters.find(c=>c.id===state.mission.leaderId)||null}
function leaderContext(){let local=leader();if(local)return local;let e=state.mission.externalLeader||{};if(!e.name&&!e.chapter&&!e.speciality&&e.fellowshipBonus==='')return null;return {id:'external-leader',external:true,name:e.name||'External / GM-provided Leader',chapter:e.chapter||'',speciality:e.speciality||'',rank:clamp(Number(e.rank)||1,1,8),fellowshipBonus:e.fellowshipBonus===''?'':Math.max(0,Number(e.fellowshipBonus)||0),commandLevel:e.commandLevel||'none'}}
function externalCommandModifier(level){return String(level)==='20'?3:String(level)==='10'?2:String(level)==='trained'?1:0}
function canCalculateCohesion(l=leaderContext()){if(!l)return false;if(!l.external)return true;return l.fellowshipBonus!==''&&Number.isFinite(Number(l.fellowshipBonus))}

function commandLevel(ch){let s=skillRecord('Command'),owned=Object.hasOwn(ch.skillsOwned||{},s.name);if(!owned)return null;let m=skillMastery(ch,s);return m>=20?20:m>=10?10:0}
function baseCohesion(l=leaderContext()){if(!l)return 0;let r=l.external?clamp(Number(l.rank)||1,1,8):rankFor(l),rankMod=r>=6?2:r>=4?1:0,cmdMod,fb;if(l.external){fb=Math.max(0,Number(l.fellowshipBonus)||0);cmdMod=externalCommandModifier(l.commandLevel)}else{fb=Math.floor(characteristic(l,'Fel')/10);let cmd=commandLevel(l);cmdMod=cmd===20?3:cmd===10?2:cmd===0?1:0}let val=fb+rankMod+cmdMod;if(!l.external&&armourIsWorn(l)&&(l.armourHistories||[]).includes('Lead from the Front'))val+=1;let oath=DATA.oaths.find(o=>o.id===state.mission.oath);if(oath?.id==='astartes')val+=2;if(l.chapter==='ultramarines')val+=r>=7?2:1;if(!l.external){let tr=trapping(l);if(tr?.id==='bt-tabard-chapter')val-=1}if(state.mission?.complicationRoll===8)val-=2;return Math.max(0,val)}
function recalculateCohesion(reset=false){let l=leaderContext();if(!l||!canCalculateCohesion(l)){if(state.role==='gm'){state.mission.cohesion.max=0;state.mission.cohesion.current=0}return}let max=baseCohesion(l);state.mission.cohesion.max=max;if(reset||state.mission.cohesion.current>max)state.mission.cohesion.current=max}
function restoreCohesion(n,reason=''){recalculateCohesion(false);state.mission.cohesion.current=Math.min(state.mission.cohesion.max,state.mission.cohesion.current+Number(n||0));if(reason)toast(`${reason}: +${n} Cohesion`)}

function missionSquadAbilities(){let oath=DATA.oaths.find(o=>o.id===state.mission.oath),names=new Set(oath?.abilities||[]),l=leaderContext(),chapterName=chapterBy(l?.chapter)?.name;for(const a of DATA.squad)if(a.chapter===chapterName)names.add(a.name);return DATA.squad.filter(a=>names.has(a.name))}

function wirePlayerMission(){let ch=current();document.getElementById('savePlayerMission').onclick=()=>{state.mission.name=document.getElementById('pmName').value;state.mission.archetype=document.getElementById('pmArch').value;state.mission.leaderId=document.getElementById('pmLeader').value;state.mission.oath=document.getElementById('pmOath').value;state.mission.briefing=document.getElementById('pmBrief').value;state.mission.insertion=document.getElementById('pmInsert').value;state.mission.extraction=document.getElementById('pmExtract').value;let ex=state.mission.externalLeader||freshMission().externalLeader;if(!state.mission.leaderId){ex.name=document.getElementById('pmExtLeaderName')?.value||'';ex.chapter=document.getElementById('pmExtLeaderChapter')?.value||'';ex.speciality=document.getElementById('pmExtLeaderSpec')?.value||'';ex.rank=clamp(Number(document.getElementById('pmExtLeaderRank')?.value)||1,1,8);let fb=document.getElementById('pmExtLeaderFB')?.value??'';ex.fellowshipBonus=fb===''?'':Math.max(0,Number(fb)||0);ex.commandLevel=document.getElementById('pmExtLeaderCommand')?.value||'none';state.mission.externalLeader=ex}let mx=Math.max(0,Number(document.getElementById('pmCohMax').value)||0),cur=Math.max(0,Number(document.getElementById('pmCohCurrent').value)||0);state.mission.cohesion.max=mx;state.mission.cohesion.current=Math.min(cur,mx);save();render();toast('Player mission copy saved.')};document.getElementById('playerSyncReq').onclick=()=>{ch.requisitionFund=Math.max(reqSpent(ch),missionRequisition());ch.requisitionNote=`Synced from ${state.mission.name}: ${missionRequisition()} Requisition`;save();render();toast('Requisition fund synced.')};document.getElementById('pmCohMax').onchange=e=>{let mx=Math.max(0,Number(e.target.value)||0);document.getElementById('pmCohCurrent').value=Math.min(Math.max(0,Number(document.getElementById('pmCohCurrent').value)||0),mx)};document.getElementById('pmCalcCoh').onclick=()=>{let l=leaderContext();if(!canCalculateCohesio function awardMissionRewards(){if(state.mission.rewardsAwarded)return;let completedObjectives=state.mission.objectives.filter(o=>o.done),teamXP=completedObjectives.reduce((a,o)=>a+objectiveXP(o),0),allPrim=state.mission.objectives.some(o=>o.priority==='Primary')&&state.mission.objectives.filter(o=>o.priority==='Primary').every(o=>o.done),allSec=state.mission.objectives.some(o=>o.priority==='Secondary')&&state.mission.objectives.filter(o=>o.priority==='Secondary').every(o=>o.done),allTer=state.mission.objectives.some(o=>o.priority==='Tertiary')&&state.mission.objectives.filter(o=>o.priority==='Tertiary').every(o=>o.done),teamVeteran=completedObjectives.filter(o=>o.difficulty==='Veteran').length;for(const ch of state.characters){let ren=(allPrim?1:0)+(allSec?1:0)+(allTer?1:0)+(completedObjectives.length>=5?1:0)+(teamVeteran>=3?1:0);if(state.mission.oath==='glory')ren+=completedObjectives.filter(o=>['Primary','Secondary'].includes(o.priority)&&o.involved?.[ch.id]!==false).length;ch.xp.available+=teamXP;ch.renown+=ren;ch.missionsCompleted=Number(ch.missionsCompleted||0)+1;ch.startingXPPhase=false;ch.xpLedger.push({id:uid('mission'),name:`Mission: ${state.mission.name}`,cost:-teamXP,source:`Mission reward · +${ren} Renown`,at:new Date().toISOString()})}state.mission.rewardsAwarded=true;save();render();toast('Mission XP and Renown awarded.')}

function participantHTML(p,i,e){let isH=p.kind==='horde',mag=Number(p.current)||0,bonus=isH?Math.min(2,Math.floor(mag/10)):0,ranged=isH?Math.floor(mag/10):0,breakMsg='';if(isH&&p.startMagnitude){if(mag<p.startMagnitude*.25)breakMsg='Automatically breaks (unless Fearless).';else if(p.damageThisTurn>=p.startMagnitude*.25)breakMsg=`Break Test due next Turn${mag<p.startMagnitude*.5?' at –10':''}.`}return `<div class="participant ${i===e.turnIndex?'activeTurn':''}"><div class="listrow"><div><b>${esc(p.name)}</b><div class="small">${p.kind.toUpperCase()} · Init ${p.initiative??'—'} ${p.surprised?'· Surprised':''}</div></div><button class="mini danger" data-remp="${p.id}">×</button></div><div class="grid3"><label>${isH?'Magnitude':'Wounds Remaining'}<input type="number" min="0" data-pcurrent="${p.id}" value="${p.current}"></label><label>Max / Start<input type="number" min="1" data-pmax="${p.id}" value="${p.max}"></label><label>Initiative<input type="number" data-pinit="${p.id}" value="${p.initiative??''}"></label></div>${!isH?`<label>Critical Damage<input type="number" min="0" data-pcritical="${p.id}" value="${p.critical||0}"></label>`:''}${isH?`<div class="rulebox"><b>Horde assistant</b><p>Ranged attacks: ${ranged} · bonus damage dice: +${bonus}d10 · lost this Turn: ${p.damageThisTurn||0}</p><p class="small">${breakMsg||'No break threshold currently flagged.'}</p><button class="btn" data-hordehit="${p.id}">APPLY DAMAGING HITS</button></div>`:''}<div class="chips">${['Prone','Stunned','Pinned','On Fire'].map(c=>`<label class="chip"><input type="checkbox" data-pcond="${p.id}" value="${c}" ${p.conditions.includes(c)?'checked':''}>${c}</label>`).join('')}<label class="chip"><input type="checkbox" data-psurp="${p.id}" ${p.surprised?'checked':''}>Surprised</label></div><label>Participant notes<textarea rows="2" data-pnotes="${p.id}">${esc(p.notes||'')}</textarea></label></div>`}

function syncEncounterPC(p){if(!p||p.kind!=='pc')return;let c=state.characters.find(x=>x.id===p.charId);if(!c)return;p.name=c.name;p.max=Math.max(1,Number(c.wounds.max)||1);p.current=clamp(p.max-Math.max(0,Number(c.wounds.damage)||0),0,p.max);p.critical=Math.max(0,Number(c.wounds.critical)||0);p.conditions=[...(c.conditions||[])]}
function wireEncounter(){let e=state.encounter;document.getElementById('openBestiary').onclick=()=>setView('bestiary');document.getElementById('encName').onchange=x=>{e.name=x.target.value;save()};document.getElementById('encDiff').onchange=x=>{e.difficulty=x.target.value;save();render()};document.getElementById('addPCs').onclick=()=>{for(const c of state.characters)if(!e.participants.some(p=>p.kind==='pc'&&p.charId===c.id)){let p={id:uid('p'),kind:'pc',charId:c.id,name:c.name,initiative:null,max:c.wounds.max,current:Math.max(0,c.wounds.max-c.wounds.damage),critical:Math.max(0,Number(c.wounds.critical)||0),conditions:[...(c.conditions||[])],surprised:false,notes:'',damageThisTurn:0};e.participants.push(p)}save();render()};document.getElementById('syncPCs').onclick=()=>{for(const p of e.participants)syncEncounterPC(p);save();render();toast('Stored PC status synced into the encounter.')};document.getElementById('rollInitAll').onclick=()=>{for(const p of e.participants){let ag=30,forced=null;if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);ag=c?characteristic(c,'Ag'):30;forced=c?consumeInitiativeOverride(c):null}else if(p.kind==='custom'){let n=state.customEnemies.find(x=>x.id===p.customId);ag=n?.stats?.Ag||30}else{let n=DATA.bestiary.find(x=>x.name===p.refName);ag=n?.stats?.Ag||30}p.initiative=(forced??rollDie(10))+Math.floor(ag/10)+(p.kind!=='pc'&&state.mission.complicationRoll===9?2:0)}e.participants.sort((a,b)=>(b.initiative||0)-(a.initiative||0));e.turnIndex=0;save();render()};document.getElementById('nextTurn').onclick=()=>{if(!e.participants.length)return;e.turnIndex++;if(e.turnIndex>=e.participants.length){e.turnIndex=0;e.round++;for(const p of e.participants)p.damageThisTurn=0}save();render()};document.getElementById('nextRound').onclick=()=>{e.round++;e.turnIndex=0;for(const p of e.participants)p.damageThisTurn=0;save();render()};document.getElementById('resetEncounter').onclick=()=>{if(confirm('Reset this encounter and clear its participants?')){state.encounter=freshEncounter();save();render()}};document.querySelectorAll('[data-pcurrent]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pcurrent),old=Number(p.current)||0,pv=clamp(Number(i.value)||0,0,Math.max(1,Number(p.max)||1));if(p.kind==='horde'&&pv<old)p.damageThisTurn=(p.damageThisTurn||0)+(old-pv);p.current=pv;if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);if(c)c.wounds.damage=clamp(c.wounds.max-pv,0,c.wounds.max)}save();render()});document.querySelectorAll('[data-pcritical]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pcritical);p.critical=Math.max(0,Number(i.value)||0);if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);if(c)c.wounds.critical=p.critical}save();render()});document.querySelectorAll('[data-pmax]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pmax);p.max=Math.max(1,Number(i.value)||1);p.current=Math.min(p.current,p.max);if(p.kind==='horde')p.startMagnitude=p.max;if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);if(c){c.wounds.max=p.max;c.wounds.damage=Math.min(c.wounds.damage,p.max)}}save();render()});document.querySelectorAll('[data-pinit]').forEach(i=>i.onchange=()=>{e.participants.find(x=>x.id===i.dataset.pinit).initiative=Number(i.value)||0;e.participants.sort((a,b)=>(b.initiative||0)-(a.initiative||0));e.turnIndex=0;save();render()});document.querySelectorAll('[data-remp]').forEach(b=>b.onclick=()=>{e.participants=e.participants.filter(x=>x.id!==b.dataset.remp);e.turnIndex=clamp(e.turnIndex,0,Math.max(0,e.participants.length-1));save();render()});document.querySelectorAll('[data-pcond]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pcond);if(i.checked&&!p.conditions.includes(i.value))p.conditions.push(i.value);else p.conditions=p.conditions.filter(v=>v!==i.value);if(p.kind==='pc'){let c=state.characters.find(x=>x.id===p.charId);if(c)c.conditions=[...p.conditions]}save()});document.querySelectorAll('[data-psurp]').forEach(i=>i.onchange=()=>{e.participants.find(x=>x.id===i.dataset.psurp).surprised=i.checked;save()});document.querySelectorAll('[data-pnotes]').forEach(i=>i.onchange=()=>{let p=e.participants.find(x=>x.id===i.dataset.pnotes);if(p)p.notes=i.value;save()});document.querySelectorAll('[data-hordehit]').forEach(b=>b.onclick=()=>hordeHitModal(e.participants.find(x=>x.id===b.dataset.hordehit)));document.getElementById('awardEncXP').onclick=()=>{let xp=DATA.encounterXP[e.difficulty]||0;for(const c of state.characters)c.xp.available+=xp;e.xpAwarded=true;save();render()};document.getElementById('encNotes').onchange=x=>{e.notes=x.target.value;save()}}
function hordeHitModal(p){modal(`<h2>Horde Magnitude Damage</h2><label>Hits that caused at least 1 Damage after AP/TB<input id="hhHits" type="number" min="0" value="1"></label><label class="check"><input id="hhExplosive" type="checkbox"> Explosive Damage: +1 additional hit</label><label>Blast value (0 if not Blast)<input id="hhBlast" type="number" min="0" value="0"></label><button class="btn primary" id="hhApply">APPLY</button><p class="small">For Blast against a Horde, successful Blast hits use the Blast value. This helper intentionally leaves the attack Test and actual Damage determination to the combat roll.</p>`);document.getElementById('hhApply').onclick=()=>{let hits=Math.max(0,Number(document.getElementById('hhHits').value)||0),blast=Math.max(0,Number(document.getElementById('hhBlast').value)||0);if(blast)hits=blast;if(document.getElementById('hhExplosive').checked&&hits>0)hits+=1;let old=p.current;p.current=Math.max(0,p.current-hits);p.damageThisTurn=(p.damageThisTurn||0)+(old-p.current);save();closeModal();render()}}

function renderLibrary(){let ch=current(),q=String(state.libraryQuery||''),cat=String(state.libraryCategory||'All'),entries=[];let push=(category,x)=>{if(!x)return;entries.push({category,name:x.name||x.id||category,summary:x.summary||x.effect||x.description||'',source:sourceText(x),raw:x})};for(const x of DATA.rules)push('Core Rule',x);for(const x of DATA.skills)push('Skill',x);for(const x of DATA.talents)push('Talent',x);for(const x of DATA.traits)push('Trait',x);for(const x of DATA.implants)push('Implant',x);for(const x of DATA.solo)push('Solo Mode',x);for(const x of DATA.squad)push('Squad Mode',x);for(const x of DATA.psychic)push('Psychic Power',x);for(const c of DATA.supportedChapters){let cp=chapterBy(c),dd=DEMEANOUR_DETAILS.chapter[c];push('Chapter',{name:cp.name,summary:`${cp.summary} Demeanour: ${dd?.summary||cp.demeanour}.`,source:cp.source,page:cp.page})}for(const [name,summary] of Object.entries(DEMEANOUR_DETAILS.personal))push('Demeanour',{name,summary,source:'Core Rulebook',page:'32'});if(ch)for(const x of ch.customRules||[])push('My Homebrew',{name:x.name,summary:x.effect,source:x.source||'GM / homebrew'});let cats=['All',...new Set(entries.map(x=>x.category))],filtered=entries.filter(x=>(cat==='All'||x.category===cat)&&(!q||`${x.name} ${x.summary} ${x.category} ${x.source}`.toLowerCase().includes(q.toLowerCase())));document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Player Rules Reference</div><h1>Librarium</h1><p>Search the player-reference material loaded in this framework build.</p></section><div class="card"><div class="filters"><input id="libSearch" aria-label="Search Librarium" placeholder="Search skills, talents, Demeanours, powers…" value="${esc(q)}"><select id="libCat" aria-label="Librarium category">${cats.map(x=>`<option ${cat===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><p class="small">Showing ${filtered.length} of ${entries.length} entries.</p></div>${filtered.map(x=>{let action='';if(ch&&x.category==='Skill'){let sk=skillRecord(x.raw.id||x.raw.name),t=skillTarget(ch,sk);action=t===null?'<span class="lockedTag">ADVANCED · UNTRAINED</span>':`<button class="btn" data-roll-skill="${sk.id}">${isGroupSkill(sk)?'CHOOSE':`ROLL · ${t}`}</button>`}else if(x.category==='Psychic Power')action=`<button class="btn" data-openpsy="${esc(x.name)}">OPEN IN PSYKANA</button>`;return `<div class="libraryCard"><div class="eyebrow">${esc(x.category)}</div><h3>${esc(x.name)}</h3><p>${esc(x.summary||'No concise summary indexed.')}</p><div class="source">${esc(x.source)}</div>${action}</div>`}).join('')||'<div class="empty">No matching entries.</div>'}`;document.getElementById('libSearch').oninput=e=>{let pos=e.target.selectionStart;state.libraryQuery=e.target.value;save();render();restoreTextFocus('libSearch',pos)};document.getElementById('libCat').onchange=e=>{state.libraryCategory=e.target.value;save();render()};document.querySelectorAll('[data-openpsy]').forEach(b=>b.onclick=()=>{state.psyQuery=b.dataset.openpsy;setView('psykana')})}

function renderCoverage(){let coreCh=DATA.chapters.filter(x=>x.rules==='core'),supplied=DATA.chapters.filter(x=>x.rules==='user-supplied-supplement'),pending=DATA.chapters.filter(x=>x.rules==='supplement-pending');let row=(name,status,detail,cls='')=>`<div class="coverageRow"><div><b>${esc(name)}</b><div class="small">${esc(detail)}</div></div><span class="pill ${cls}">${esc(status)}</span></div>`;document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Source Integrity</div><h1>Rules Coverage</h1><p>What the companion can automate confidently, what is loaded from supplied supplements, and what is intentionally left pending instead of guessed.</p></section><div class="card"><h2>Framework systems</h2>${row('Character Creation','CORE COMPLETE','Core creation flow, Skills, Demeanours, starting XP and sourced Chapter packages.')}${row('Skills & Tests','CORE COMPLETE','Basic/Advanced training, untrained Basic halving, Degrees, difficulty modifiers and quick rolls.')}${row('Rules Resolver','APP COMPLETE','Characteristics, Skills, movement, structured temporary effects, and tracked contextual equipment modifiers resolve through one public dispatch path with visible calculation traces.')}${row('Equipment Rule Clarity','APP COMPLETE','Source provenance, rules-impact labels, named rule-tag display, and generic equipment-effect tracking are separated from canonical source records.')}${row('Mission Kits','APP COMPLETE','Readiness templates and non-weapon field Requisition templates remain separate from the current Mission fund; applying a kit never waives Requisition.')}${row('State Integrity','APP COMPLETE','Migration repair, bounded resources, resilient local-storage fallback, Undo/Redo, checkpoints and golden-character regression tests.')}${row('Session Framework','APP COMPLETE','Session start/end, action-economy reminder, active effects, checkpoints, Needs Attention, and player-owned state.')}${row('Search & Discovery','APP COMPLETE','Character-a function activateSquad(name){let ch=current(),a=DATA.squad.find(x=>x.name===name);if(!a||ch.mode!=='squad')return;if(a.chapter&&chapterBy(ch.chapter)?.name!==a.chapter){toast(`${a.name} is restricted to ${a.chapter} Battle-Brothers.`,'bad');return;}state.mission.activeSquad=state.mission.activeSquad||[];if(state.mission.activeSquad.includes(name)){toast('Already activated for this Mission/combat.');return}let cost=Number(a.cost||0);if(state.mission.cohesion.current<cost){toast('Not enough Cohesion.','bad');return}state.mission.cohesion.current-=cost;state.mission.activeSquad.push(name);save();render();toast(`${name} activated.`)}


function ensureActionEconomy(ch){ch.actionEconomy=Object.assign({half1:false,half2:false,full:false,reaction:false,freeNote:''},ch.actionEconomy||{});return ch.actionEconomy}
function resetActionEconomy(ch){ch.actionEconomy={half1:false,half2:false,full:false,reaction:false,freeNote:''}}
function actionEconomyHTML(ch){let a=ensureActionEconomy(ch),slot=(id,label,used)=>`<button class="actionSlot ${used?'used':''}" data-actionslot="${id}" aria-pressed="${used?'true':'false'}"><b>${label}</b><div class="small">${used?'Marked used':'Available'}</div></button>`;return `<div class="card"><div class="sectionLead"><h2>Round Action Economy</h2><button class="btn" id="resetActions">RESET ROUND</button></div><p class="small guidedOnly">This is a reminder board, not an enforcement engine. Mark what you use; the player and GM remain in control of exceptions.</p><div class="actionEconomy">${slot('half1','Half Action 1',a.half1)}${slot('half2','Half Action 2',a.half2)}${slot('full','Full Action',a.full)}${slot('reaction','Reaction',a.reaction)}</div><label class="guidedOnly">Free-action / round note<input id="freeActionNote" value="${esc(a.freeNote||'')}" placeholder="Optional reminder"></label></div>`}

function goalRows(ch){return (ch.recognitionGoals||[]).map(g=>`<div class="goalRow ${g.done?'goalDone':''}"><div><b>${esc(g.title)}</b><div class="small">${esc(g.kind)}${g.target?` · ${esc(g.target)}`:''}</div>${g.note?`<div class="small">${esc(g.note)}</div>`:''}</div><div class="actions"><button class="btn" data-goaldone="${g.id}">${g.done?'REOPEN':'COMPLETE'}</button><button class="mini danger" data-goalremove="${g.id}" aria-label="Remove goal">×</button></div></div>`).join('')||'<div class="emptyHelp">No personal progression goals yet. Add story, Renown, Honour, Distinction, or advancement goals without changing any rules.</div>'}
function suggestedRecognitionGoals(ch){let p=currentRenownProgress(ch),items=[];if(p.next)items.push({title:`Reach ${p.next.name}`,kind:'Renown',target:`${p.next.min} Renown`,note:`Current: ${p.current}`});if(!ch.honours?.cruxTerminus&&Number(ch.renown)<60)items.push({title:'Earn consideration for the Crux Terminatus',kind:'Honour',target:'Famed / 60 Renown plus GM award',note:'The Honour itself is not purchased with Renown.'});let r=OFFICIAL_DISTINCTION_EXAMPLES.find(x=>x.chapter===ch.chapter)||OFFICIAL_CHAPTER_RECOGNITION.find(x=>x.chapter===ch.chapter);if(r)items.push({title:`Pursue ${r.name}`,kind:'Chapter',target:'Story / GM award',note:r.summary});items.push({title:'Become a veteran of the Long Watch',kind:'Story',target:'Campaign milestone',note:'Fantasy Flight presents veteran status as a rare long-term achievement for Deathwatch service.'});return items.slice(0,4)}
function suggestedGoalsHTML(ch){let existing=new Set((ch.recognitionGoals||[]).map(g=>g.title.toLowerCase()));return suggestedRecognitionGoals(ch).filter(g=>!existing.has(g.title.toLowerCase())).map((g,i)=>`<div class="goalRow"><div><b>${esc(g.title)}</b><div class="small">${esc(g.kind)} · ${esc(g.target)}</div><div class="small">${esc(g.note)}</div></div><button class="btn" data-addsuggested="${encodeURIComponent(JSON.stringify(g))}">ADD GOAL</button></div>`).join('')||'<div class="emptyHelp">Your current suggested milestones are already in the goal list.</div>'}
function renderRecognition(){let ch=current();if(!ch)return setView('home');v78EnsureCharacter(ch);let p=currentRenownProgress(ch),c=recognitionCounts(ch),examples=OFFICIAL_DISTINCTION_EXAMPLES.map(x=>`<div class="awardRow"><div><b>${esc(x.name)}</b><div class="small">Official premade Distinction example · ${esc(chapterBy(x.chapter)?.name||x.chapter)}</div></div><span class="sourceBadge official">REFERENCE</span></div>`).join('');document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Rites of Battle · Player Achievement</div><h1>Recognition & Legacy</h1><p>${esc(ch.name)} · ${esc(p.rank)} · ${p.current} Renown</p><div class="quickLinks"><button class="btn primary" id="recAddDist">+ DISTINCTION</button><button class="btn" id="recAddGoal">+ GOAL</button><button class="btn" id="recAddSeal">+ PURITY SEAL</button><button class="btn" id="recNotes">FIELD NOTES</button></div></section>${recognitionSummaryHTML(ch,true)}<div class="card noMechanics"><h2>How this system is separated</h2><p><b>Honours</b> are formal status and achievement symbols. Fantasy Flight's Rites of Battle preview says Honours do not grant specific special rules and do not cost XP. The Core also names the Imperial Laurel, Marksmanship Honour, Purity Seal, and Crux Terminatus, with awards normally left to the GM; the Crux specifically requires 60 Renown even to be considered. <b>Distinctions</b> are the flexible achievement framework that can carry special rules and can be unique to a campaign.</p><p class="small">Astartes Vigil therefore never invents mechanical bonuses for official Honours. Any numeric effect recorded on a custom Distinction is clearly tagged as GM-approved/homebrew and never overwrites a canonical record.</p></div><div class="card"><div class="sectionLead"><h2>Official Honours</h2><span class="pill">${c.honours}/${OFFICIAL_HONOURS.length} recorded</span></div><div class="recognitionGrid">${OFFICIAL_HONOURS.map(h=>officialHonourCard(ch,h)).join('')}</div></div><div class="card"><div class="sectionLead"><h2>Chapter Recognition</h2><span class="pill">${esc(chapterBy(ch.chapter)?.name||'Chapter')}</span></div>${chapterRecognitionExample(ch)}${chapterTemplateHTML(ch)}<details><summary>Other official premade Distinction examples named by Fantasy Flight</summary>${examples}</details></div><div class="card"><div class="sectionLead"><h2>My Distinctions</h2><button class="btn primary" data-adddistinction="1">+ ADD</button></div><p class="small guidedOnly">Use this for a GM-created Rites of Battle Distinction, an exact supplement award, or clearly labelled homebrew. Exact mechanics should be copied from a verified source or agreed with the GM.</p><div class="recognitionGrid">${(ch.distinctions||[]).map(d=>distinctionCard(d,ch)).join('')||'<div class="emptyHelp">No Distinctions recorded yet.</div>'}</div></div><div class="card"><div class="sectionLead"><h2>Individual Purity Seals & Ceremonial Marks</h2><button class="btn" data-addseal="1">+ RECORD</button></div><p class="small">The official <b>Purity Seal Honour</b> is tracked in Official Honours above. This section records individual physical seals, oaths, inscriptions, and ceremonial marks for story continuity; extra records do not create additional automatic bonuses.</p>${(ch.puritySeals||[]).map(x=>`<div class="awardRow"><div><b>${esc(x.title||'Purity Seal')}</b><div class="small">${esc(x.awardedFor||'Ceremonial recognition')}${x.text?` · ${esc(x.text)}`:''}</div></div><button class="mini danger" data-removeseal="${x.id}" aria-label="Remove purity seal">×</button></div>`).join('')||'<div class="emptyHelp">No purity seals recorded.</div>'}<div class="source">Player campaign record · ceremonial entry only; no automatic rules effect applied</div></div><div class="card"><h2>Suggested Next Milestones</h2><p class="small">These are prompts, not automatic rewards or requirements. They give the player something concrete to pursue without spending or changing Renown.</p>${suggestedGoalsHTML(ch)}</div><div class="card"><div class="sectionLead"><h2>Progression Goals</h2><button class="btn" data-addgoal="1">+ GOAL</button></div>${goalRows(ch)}</div><div class="card"><h2>Recognition Notes</h2><textarea id="recognitionNotes" aria-label="Recognition notes" rows="5" placeholder="Chapter customs, award conversations, future ambitions, GM notes you are allowed to keep…">${esc(ch.recognitionNotes||'')}</textarea><button class="btn" id="saveRecognitionNotes">SAVE NOTES</button></div>`;wireRecognition(ch)}
function distinctionModal(ch,existing=null,prefillChapter=false){let d=existing?deep(existing):{name:prefillChapter?`${chapterBy(ch.chapter)?.name||'Chapter'} Citation`:'',classification:'gm-framework',marks:[],deed:'',effect:'',source:'',minRenown:0,active:true,modifier:null};let mod=d.modifier||{type:'none',target:'',value:0};modal(`<h2>${existing?'Edit':'Record'} Distinction</h2><p class="small">Distinctions can be unique campaign rewards. Use exact supplement mechanics when available; otherwise label the entry as homebrew. Numeric automation is optional and restricted to generic character/skill/movement modifiers.</p><label>Name<input id="distName" value="${esc(d.name||'')}"></label><label>Classification<select id="distClass"><option value="gm-framework" ${d.classification==='gm-framework'?'selected':''}>GM-created / Rites of Battle framework</option><option value="homebrew" ${d.classification==='homebrew'?'selected':''}>Homebrew</option></select></label><fieldset><legend>Marks of Distinction</legend>${DISTINCTION_MARKS.map(m=>`<label class="checkline"><input type="checkbox" data-distmark="${m.key}" ${(d.marks||[]).includes(m.key)?'checked':''}> ${esc(m.name)} <span class="small">— ${esc(m.summary)}</span></label>`).join('')}</fieldset><label>Deed / why it was earned<textarea id="distDeed" rows="3">${esc(d.deed||'')}</textarea></label><label>Recorded effect / exact ruling<textarea id="distEffect" rows="3">${esc(d.effect||'')}</textarea></label><label>Source or GM ruling<input id="distSource" value="${esc(d.source||'')}" placeholder="Rites of Battle p.__ / GM campaign ruling / Homebrew"></label><label>Minimum Renown threshold <small>(gate only; Renown is not spent)</small><input id="distRenown" type="number" min="0" value="${Number(d.minRenown)||0}"></label><details><summary>Optional generic automation</summary><p class="small">Only use this when the exact numeric effect is sourced or intentionally homebrew. This does not alter canonical records.</p><label>Modifier type<select id="distModType"><option value="none">No automatic modifier</option><option value="characteristic" ${mod.type==='characteristic'?'selected':''}>Characteristic</option><option value="skill" ${mod.type==='skill'?'selected':''}>Skill</option><option value="movement" ${mod.type==='movement'?'selected':''}>Movement</option></select></label><label>Target<select id="distModTarget"></select></label><label>Value<input id="distModValue" type="number" value="${Number(mod.value)||0}"></label></details><button class="btn primary" id="saveDistinction">SAVE DISTINCTION</button>`,{label:'Record Distinction'});let drawDistTargets=()=>{let type=document.getElementById('distModType').value,sel=document.getElementById('distModTarget'),opts=type==='characteristic'?CHAR_KEYS.map(k=>[k,CHAR_LABELS[k]]):type==='skill'?DATA.skills.map(sk=>[sk.id,sk.name]):type==='movement'?[['half','Half Move'],['full','Full Move'],['charge','Charge'],['run','Run']]:[['','No target']];let prior=sel.value||mod.target||'';sel.innerHTML=opts.map(([v,n])=>`<option value="${esc(v)}" ${v===prior?'selected':''}>${esc(n)}</option>`).join('');if(prior&&!opts.some(x=>x[0]===prior))sel.insertAdjacentHTML('beforeend',`<option value="${esc(prior)}" selected>${esc(prior)} · imported</option>`)};document.getElementById('distModType').onchange=drawDistTargets;drawDistTargets();document.getElementById('saveDistinction').onclick=()=>{let name=document.getElementById('distName').value.trim();if(!name){toast('Give the Distinction a name.','bad');return}let classification=document.getElementById('distClass').value,source=document.getElementById('distSource').value.trim(),type=document.getElementById('distModType').value,target=document.getElementById('distModTarget').value.trim(),value=Number(document.getElementById('distModValue').value)||0,modifier=type==='none'||!target||!value?null:{type,target,value},minRenown=Math.max(0,Number(document.getElementById('distRenown').value)||0);if(modifier&&!source){toast('A sourced or explicit homebrew numeric modifier needs a source/ruling note.','bad');return}pushUndo(ch,`${existing?'Edit':'Add'} Distinction ${name}`);let rec={id:existing?.id||uid('dist'),name,classification,marks:[...document.querySelectorAll('[data-distmark]:checked')].map(x=>x.dataset.distmark),deed:document.getElementById('distDeed').value.trim(),effect:document.getElementById('distEffect').value.trim(),source:source||(classification==='homebrew'?'Homebrew / GM approved':'GM-created Rites framework'),minRenown,active:(existing?.active!==false)&&Number(ch.renown||0)>=minRenown,modifier,awardedAt:existing?.awardedAt||new Date().toISOString()};let idx=(ch.distinctions||[]).findIndex(x=>x.id===rec.id);if(idx>=0)ch.distinctions[idx]=rec;else ch.distinctions.push(rec);recordActivity(ch,`${existing?'Updated':'Recorded'} Distinction: ${name}`,'recognition');addTimeline(ch,'Recognition',name,rec.deed||rec.effect||rec.source);save();closeModal();render();toast(`${name} saved.`)}}
function goalModal(ch){modal(`<h2>Add Progression Goal</h2><label>Goal<input id="goalTitle" placeholder="Earn the Crux Terminatus, reach Famed, complete a story oath…"></label><label>Type<select id="goalKind"><option>Story</option><option>Renown</option><option>Honour</option><option>Distinction</option><option>Advancement</option><option>Chapter</option></select></label><label>Target / milestone<input id="goalTarget" placeholder="Famed (60), GM-awarded Honour, specific advance…"></label><label>Note<textarea id="goalNote" rows="2"></textarea></label><button class="btn primary" id="saveGoal">ADD GOAL</button>`,{label:'Add progression goal'});document.getElementById('saveGoal').onclick=()=>{let title=document.getElementById('goalTitle').value.trim();if(!title){toast('Give the goal a title.','bad');return}pushUndo(ch,`Add goal ${title}`);ch.recognitionGoals.push({id:uid('goal'),title,kind:document.getElementById('goalKind').value,target:document.getElementById('goalTarget').value.trim(),note:document.getElementById('goalNote').value.trim(),done:false});recordActivity(ch,`Progression goal added: ${title}`,'goal');save();closeModal();render()}}
function sealModal(ch){modal(`<h2>Record Individual Purity Seal</h2><p class="small">The official Purity Seal Honour is tracked separately. This records one physical/story seal or inscription and creates no additional automatic rules effect.</p><label>Title<input id="sealTitle" value="Purity Seal"></label><label>Awarded for<input id="sealFor" placeholder="Mission, oath, act of service…"></label><label>Inscription / note<textarea id="sealText" rows="3"></textarea></label><button class="btn primary" id="saveSeal">RECORD</button>`,{label:'Record purity seal'});document.getElementById('saveSeal').onclick=()=>{let title=document.getElementById('sealTitle').value.trim()||'Purity Seal';pushUndo(ch,`Record ${title}`);ch.puritySeals.push({id:uid('seal'),title,awardedFor:document.getElementById('sealFor').value.trim(),text:document.getElementById('sealText').value.trim(),at:new Date().toISOString()});recordActivity(ch,`Ceremonial mark recorded: ${title}`,'recognition');addTimeline(ch,'Recognition',title,document.getElementById('sealFor').value.trim());save();closeModal();render()}}
function honourNoteModal(ch,key){let h=OFFICIAL_HONOURS.find(x=>x.key===key),meta=ch.honourMeta[key]||{};modal(`<h2>${esc(h.name)}</h2><p>${esc(h.summary)}</p><label>GM award / story note<textarea id="honourNote" rows="3">${esc(meta.note||'')}</textarea></label><button class="btn primary" id="honourConfirm">RECORD GM AWARD</button>`,{label:`Record ${h.name}`});document.getElementById('honourConfirm').onclick=()=>{pushUndo(ch,`Record Honour ${h.name}`);ch.honours[key]=true;ch.honourMeta[key]={awardedAt:new Date().toISOString(),note:document.getElementById('honourNote').value.trim()};recordActivity(ch,`Honour recorded: ${h.name}`,'recognition');addTimeline(ch,'Honour',h.name,ch.honourMeta[key].note||'GM-awarded achievement');save();closeModal();render();toast(`${h.name} recorded.`)}}
function wireRecognition(ch){document.getElementById('recAddDist')?.addEventListener('click',()=>distinctionModal(ch));document.querySelectorAll('[data-addchaptertemplate]').forEach(b=>b.onclick=()=>addChapterTemplate(ch,b.dataset.addchaptertemplate));document.getElementById('recAddGoal')?.addEventListener('click',()=>goalModal(ch));document.getElementById('recAddSeal')?.addEventListener('click',()=>sealModal(ch));document.getElementById('recNotes')?.addEventListener('click',()=>setView('notes'));document.querySelectorAll('[data-adddistinction]').forEach(b=>b.onclick=()=>distinctionModal(ch,null,!!b.closest('.chapterExample')));document.querySelectorAll('[data-addgoal]').forEach(b=>b.onclick=()=>goalModal(ch));document.querySelectorAll('[data-addseal]').forEach(b=>b.onclick=()=>sealModal(ch));document.querySelectorAll('[data-addsuggested]').forEach(b=>b.onclick=()=>{let g=JSON.parse(decodeURIComponent(b.dataset.addsuggested));pushUndo(ch,`Add suggested goal ${g.title}`);ch.recognitionGoals.push({id:uid('goal'),title:g.title,kind:g.kind,target:g.target,note:g.note,done:false});recordActivity(ch,`Progression goal added: ${g.title}`,'goal');save();render()});document.querySelectorAll('[data-togglehonour]').forEach(b=>b.onclick=()=>{let key=b.dataset.togglehonour,h=OFFICIAL_HONOURS.find(x=>x.key===key);if(ch.honours[key]){pushUndo(ch,`Remove Honour ${h.name}`);ch.honours[key]=false;ch.honourMeta[key]={awardedAt:'',note:''};recordActivity(ch,`Honour record removed: ${h.name}`,'recognition');save();render()}else honourNoteModal(ch,key)});document.querySelectorAll('[data-toggledistinction]').forEach(b=>b.onclick=()=>{let d=ch.distinctions.find(x=>x.id===b.dataset.toggledistinction);if(!d)return;if(d.active===false&&Number(ch.renown||0)<Number(d.minRenown||0)){toast(`Renown ${Number(d.minRenown)||0} is required before this Distinction can be enabled.`,'bad');return}pushUndo(ch,`${d.active===false?'Enable':'Disable'} ${d.name}`);d.active=d.active===false;recordActivity(ch,`${d.active?'Enabled':'Disabled'} Distinction: ${d.name}`,'recognition');save();render()});document.querySelectorAll('[data-editdistinction]').forEach(b=>b.onclick=()=>{let d=ch.distinctions.find(x=>x.id===b.dataset.editdistinction);if(d)distinctionModal(ch,d)});document.querySelectorAll('[data-removedistinction]').forEach(b=>b.onclick=()=>{let d=ch.distinctions.find(x=>x.id===b.dataset.removedistinction);if(!d)return;pushUndo(ch,`Remove Distinction ${d.name}`);ch.distinctions=ch.distinctions.filter(x=>x.id!==d.id);recordActivity(ch,`Distinction removed: ${d.name}`,'recognition');save();render()});document.querySelectorAll('[data-goaldone]').forEach(b=>b.onclick=()=>{let g=ch.recognitionGoals.find(x=>x.id===b.dataset.goaldone);if(!g)return;pushUndo(ch,`${g.done?'Reopen':'Complete'} goal ${g.title}`);g.done=!g.done;recordActivity(ch,`${g.done?'Completed':'Reopened'} goal: ${g.title}`,'goal');save();render()});document.querySelectorAll('[data-goalremove]').forEach(b=>b.onclick=()=>{let g=ch.recognitionGoals.find(x=>x.id===b.dataset.goalremove);if(!g)return;pushUndo(ch,`Remove goal ${g.title}`);ch.recognitionGoals=ch.recognitionGoals.filter(x=>x.id!==g.id);save();render()});document.querySelectorAll('[data-removeseal]').forEach(b=>b.onclick=()=>{let x=ch.puritySeals.find(x=>x.id===b.dataset.removeseal);if(!x)return;pushUndo(ch,`Remove ${x.title}`);ch.puritySeals=ch.puritySeals.filter(y=>y.id!==x.id);save();render()});document.getElementById('saveRecognitionNotes')?.addEventListener('click',()=>{pushUndo(ch,'Update recognition notes');ch.recognitionNotes=document.getElementById('recognitionNotes').value;save();toast('Recognition notes saved.')})}
function renderNotes(){let ch=current();if(!ch)return setView('home');v78EnsureCharacter(ch);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Player-owned memory</div><h1>Field Notes & Table Rulings</h1><p>Keep the information you would otherwise have to remember, re-ask, or search for during play.</p></section><div class="fieldNoteGrid"><div class="card"><h2>Character Notes</h2><textarea id="fieldNotes" aria-label="Character notes" rows="12" placeholder="Clues, NPC names, promises, personal observations, campaign details…">${esc(ch.notes||'')}</textarea><button class="btn primary" id="saveFieldNotes">SAVE NOTES</button></div><div class="card"><h2>Next Session Reminder</h2><textarea id="sessionReminder" aria-label="Next session reminder" rows="6" placeholder="What do I need to remember immediately next time?">${esc(ch.sessionReminder||'')}</textarea><button class="btn" id="saveReminder">SAVE REMINDER</button>${ch.sessionReminder?`<div class="notice"><b>Current reminder:</b> ${esc(ch.sessionReminder)}</div>`:''}</div></div><div class="card"><div class="sectionLead"><h2>GM / Table Rulings</h2><button class="btn" id="addRuling">+ RULING</button></div><p class="small">Use this when the GM clarifies something at the table so the player does not have to keep asking. These notes never masquerade as canonical rules.</p>${(ch.playerRulings||[]).map(r=>`<div class="rulingRow"><div><b>${esc(r.title)}</b><div>${esc(r.text)}</div><div class="source">${esc(r.source||'GM ruling')}</div></div><button class="mini danger" data-removeruling="${r.id}">×</button></div>`).join('')||'<div class="emptyHelp">No table rulings recorded.</div>'}</div>${recognitionSummaryHTML(ch,false)}`;document.getElementById('saveFieldNotes').onclick=()=>{pushUndo(ch,'Update field notes');ch.notes=document.getElementById('fieldNotes').value;save();toast('Field notes saved.')};document.getElementById('saveReminder').onclick=()=>{pushUndo(ch,'Update next-session reminder');ch.sessionReminder=document.getElementById('sessionReminder').value.trim();save();render();toast('Reminder saved.')};document.getElementById('addRuling').onclick=()=>rulingModal(ch);document.querySelectorAll('[data-removeruling]').forEach(b=>b.onclick=()=>{let r=ch.playerRulings.find(x=>x.id===b.dataset.removeruling);if(!r)return;pushUndo(ch,`Remove ruling ${r.title}`);ch.playerRulings=ch.playerRulings.filter(x=>x.id!==r.id);save();render()})}
function rulingModal(ch){modal(`<h2>Record Table Ruling</h2><label>Title<input id="rulingTitle" placeholder="Stealth during this mission, custom oath interpretation…"></label><label>Ruling<textarea id="rulingText" rows="4"></textarea></label><label>Source / who ruled<input id="rulingSource" value="GM ruling"></label><button class="btn primary" id="saveRuling">SAVE</button>`,{label:'Record table ruling'});document.getElementById('saveRuling').onclick=()=>{let title=document.getElementById('rulingTitle').value.trim(),text=document.getElementById('rulingText').value.trim();if(!title||!text){toast('Add both a title and the ruling.','bad');return}pushUndo(ch,`Record ruling ${title}`);ch.playerRulings.push({id:uid('ruling'),title,text,source:document.getElementById('rulingSource').value.trim()||'GM ruling',at:new Date().toISOString()});recordActivity(ch,`Table ruling recorded: ${title}`,'ruling');save();closeModal();render()}}
