<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Deathwatch Companion" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Deathwatch Companion</title>
  
  
  <style>
:root {
  --bg: #070a09;
  --panel: #0e1411;
  --panel-2: #131b17;
  --panel-3: #18231d;
  --line: #26372d;
  --line-strong: #3f5c4b;
  --text: #ecf1ee;
  --muted: #93a49b;
  --faint: #64736b;
  --accent: #d5efe1;
  --accent-2: #7fa18e;
  --danger: #d17676;
  --warn: #c5a86b;
  --good: #86b994;
  --shadow: 0 18px 55px rgba(0,0,0,.42);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body {
  background:
    radial-gradient(circle at 50% -10%, rgba(74,108,88,.18), transparent 38%),
    linear-gradient(180deg, #0a0f0d 0, #070a09 55%, #050706 100%);
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent-2); outline-offset: 2px;
}

.app-shell { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: rgba(7,10,9,.88); backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(63,92,75,.35);
  display:flex; align-items:center; justify-content:space-between; gap: 12px;
}
.brand { display:flex; gap:10px; align-items:center; cursor:pointer; min-width: 0; }
.watch-mark {
  width: 34px; height: 34px; display:grid; place-items:center;
  border: 1px solid var(--line-strong); border-radius: 50%;
  font-family: Georgia, serif; font-weight: 800; color: var(--accent);
  background: linear-gradient(145deg, #17231c, #0b100d);
  box-shadow: inset 0 0 0 4px #0a0f0d, 0 0 20px rgba(127,161,142,.12);
}
.brand-title { font-size: .83rem; letter-spacing: .22em; font-weight: 900; white-space: nowrap; }
.brand-subtitle { margin-top: 2px; color: var(--muted); font-size: .67rem; letter-spacing: .1em; }
.top-actions { display:flex; gap:8px; }
.icon-btn, .btn {
  border:1px solid var(--line); background: var(--panel-2); border-radius: 10px;
  min-height: 40px; padding: 8px 12px; cursor:pointer;
}
.icon-btn { min-width: 42px; display:grid; place-items:center; font-weight:800; }
.icon-btn:hover, .btn:hover { background: var(--panel-3); border-color: var(--line-strong); }
.btn.primary { background: #dce8e1; color:#09100c; border-color:#dce8e1; font-weight:800; }
.btn.danger { border-color: rgba(209,118,118,.5); color: #efb5b5; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size:.82rem; }

.main-content { width: min(100%, 980px); margin: 0 auto; flex:1; padding: 14px 14px calc(90px + var(--safe-bottom)); }
.bottom-nav {
  position: fixed; left:0; right:0; bottom:0; z-index:25;
  display:grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(8,12,10,.94); backdrop-filter: blur(18px);
  border-top:1px solid rgba(63,92,75,.45);
  padding: 6px 6px calc(6px + var(--safe-bottom));
}
.nav-item { border:0; background:transparent; color:var(--muted); padding:6px 2px; border-radius:10px; cursor:pointer; }
.nav-item span { display:block; font-size:1.05rem; line-height:1.1; }
.nav-item small { display:block; font-size:.62rem; margin-top:3px; }
.nav-item.active { color:var(--text); background: rgba(127,161,142,.12); }

.hero-card, .card {
  border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(160deg, rgba(19,27,23,.97), rgba(11,16,13,.97)); box-shadow:var(--shadow);
}
.hero-card { padding: 16px; position:relative; overflow:hidden; }
.hero-card::after { content:""; position:absolute; width:180px; height:180px; right:-80px; top:-90px; border:1px solid rgba(127,161,142,.12); border-radius:50%; box-shadow:0 0 0 26px rgba(127,161,142,.03),0 0 0 52px rgba(127,161,142,.02); pointer-events:none; }
.card { padding:14px; margin-top:12px; box-shadow:none; }
.card h2, .card h3, .hero-card h1 { margin:0; }
.card-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.card-title-row h2 { font-size:1rem; letter-spacing:.06em; text-transform:uppercase; }
.eyebrow { color:var(--accent-2); font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; font-weight:800; }
.hero-main { display:flex; gap:14px; align-items:center; position:relative; z-index:1; }
.portrait {
  flex:0 0 82px; width:82px; height:82px; border-radius:14px; border:1px solid var(--line-strong);
  background: radial-gradient(circle at 50% 35%, #263b30, #0c120f 70%); object-fit:cover; display:grid; place-items:center; font-size:2rem; font-weight:900; color:var(--accent-2); overflow:hidden;
}
.portrait img { width:100%; height:100%; object-fit:cover; }
.hero-copy { min-width:0; }
.hero-copy h1 { font-size:1.45rem; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subline { margin-top:5px; color:var(--muted); font-size:.86rem; }
.tag-row { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
.tag { border:1px solid var(--line); border-radius:999px; padding:4px 7px; color:var(--muted); background:rgba(255,255,255,.015); font-size:.69rem; }

.stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
.stat {
  border:1px solid var(--line); border-radius:12px; background:rgba(5,8,6,.42); padding:10px 8px; text-align:center; cursor:pointer; position:relative;
}
.stat:hover { border-color:var(--line-strong); background:rgba(127,161,142,.07); }
.stat .label { display:block; color:var(--muted); font-size:.64rem; letter-spacing:.08em; font-weight:800; }
.stat .value { display:block; font-size:1.45rem; margin-top:2px; font-weight:900; }
.stat .mini { display:block; font-size:.58rem; color:var(--faint); margin-top:2px; }

.resource-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.resource { padding:11px; border:1px solid var(--line); border-radius:12px; background:rgba(5,8,6,.42); }
.resource-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.resource-name { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
.resource-value { font-weight:900; }
.meter { height:5px; border-radius:99px; background:#050706; margin-top:8px; overflow:hidden; border:1px solid rgba(255,255,255,.03); }
.meter > i { display:block; height:100%; background:linear-gradient(90deg, #486353, #a5c0af); }

.two-col { display:grid; grid-template-columns:1fr; gap:12px; }
.list { display:flex; flex-direction:column; gap:8px; }
.list-item {
  border:1px solid var(--line); background:rgba(5,8,6,.35); border-radius:12px; padding:11px;
}
.list-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.item-title { font-weight:800; }
.item-sub { color:var(--muted); font-size:.76rem; margin-top:3px; line-height:1.35; }
.item-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

.weapon { border-left:3px solid var(--line-strong); }
.weapon-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
.weapon-stat { border:1px solid rgba(63,92,75,.45); border-radius:9px; padding:7px 5px; text-align:center; }
.weapon-stat b { display:block; font-size:.83rem; }
.weapon-stat small { display:block; color:var(--faint); font-size:.57rem; text-transform:uppercase; margin-top:2px; }
.ammo-row { margin-top:10px; display:flex; gap:8px; align-items:center; }
.ammo-count { font-variant-numeric:tabular-nums; font-weight:900; min-width:68px; }

.skill-row { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
.skill-target { min-width:50px; text-align:center; font-size:1.05rem; font-weight:900; border:1px solid var(--line); border-radius:9px; padding:7px; cursor:pointer; }
.skill-target:hover { border-color:var(--line-strong); }

.field-grid { display:grid; grid-template-columns:1fr; gap:10px; }
.field label { display:block; color:var(--muted); font-size:.7rem; margin-bottom:5px; letter-spacing:.05em; }
.input, .textarea, .select {
  width:100%; color:var(--text); background:#090d0b; border:1px solid var(--line); border-radius:10px; padding:10px 11px; min-height:42px;
}
.textarea { min-height:100px; resize:vertical; line-height:1.5; }
.inline-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.checkbox-row { display:flex; align-items:center; gap:8px; color:var(--muted); }

.roll-result { text-align:center; padding:8px 0 4px; }
.roll-number { font-size:3.2rem; font-weight:950; letter-spacing:-.04em; }
.roll-number.success { color:var(--good); }
.roll-number.failure { color:var(--danger); }
.roll-detail { color:var(--muted); margin-top:5px; }
.roll-badge { display:inline-block; margin-top:10px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); font-size:.75rem; font-weight:800; }

.modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.68); display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(6px); }
.modal-backdrop.hidden { display:none; }
.modal {
  width:min(100%, 720px); max-height:88dvh; border:1px solid var(--line-strong); background:#0b100d; border-radius:18px 18px 0 0; box-shadow:var(--shadow); overflow:hidden;
}
.modal-head { display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); }
.modal-head h2 { margin:0; font-size:1rem; letter-spacing:.08em; text-transform:uppercase; }
.modal-body { padding:14px; overflow:auto; max-height:calc(88dvh - 64px); }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap; }

.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.menu-grid button { text-align:left; min-height:64px; }
.menu-grid small { display:block; color:var(--muted); margin-top:4px; font-weight:400; }

.empty { border:1px dashed var(--line); border-radius:12px; color:var(--muted); padding:20px 12px; text-align:center; }
.section-note { color:var(--muted); font-size:.78rem; line-height:1.5; }
.source { color:var(--faint); font-size:.67rem; }
.divider { height:1px; background:var(--line); margin:14px 0; }
.searchbar { display:flex; gap:8px; margin-bottom:12px; }
.searchbar .input { flex:1; }
.tabs { display:flex; gap:6px; overflow:auto; padding-bottom:4px; margin-bottom:10px; }
.tabs button { white-space:nowrap; }
.tabs button.active { border-color:var(--accent-2); color:var(--accent); background:rgba(127,161,142,.12); }

.character-strip { display:flex; gap:8px; overflow:auto; margin-top:12px; padding-bottom:2px; }
.char-chip { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; background:rgba(5,8,6,.4); padding:6px 10px; color:var(--muted); cursor:pointer; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.char-chip.active { color:var(--text); border-color:var(--line-strong); background:rgba(127,161,142,.1); }

.toast { position:fixed; left:50%; bottom:calc(84px + var(--safe-bottom)); transform:translateX(-50%); z-index:80; background:#dce8e1; color:#07100b; border-radius:999px; padding:9px 14px; font-weight:800; font-size:.8rem; box-shadow:var(--shadow); max-width:calc(100% - 28px); text-align:center; }
.toast.hidden { display:none; }

.build-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.build-kpi { border:1px solid var(--line); background:rgba(5,8,6,.35); border-radius:12px; padding:10px; text-align:center; }
.build-kpi b { display:block; font-size:1.1rem; }
.build-kpi small { display:block; color:var(--muted); margin-top:3px; font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; }
.integrity-good { border-color:rgba(134,185,148,.45); }
.integrity-warn { border-color:rgba(197,168,107,.5); }
.integrity-bad { border-color:rgba(209,118,118,.55); }
.stepper { display:flex; gap:6px; margin-bottom:12px; overflow:auto; }
.step-pill { flex:1 0 auto; border:1px solid var(--line); border-radius:999px; padding:6px 9px; color:var(--muted); text-align:center; font-size:.68rem; }
.step-pill.active { color:var(--text); border-color:var(--accent-2); background:rgba(127,161,142,.12); }
.derived-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.source-toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.source-toggle input { width:20px; height:20px; }

@media (min-width: 700px) {
  .main-content { padding-top:20px; }
  .two-col { grid-template-columns:1fr 1fr; }
  .stat-grid { grid-template-columns:repeat(9,1fr); }
  .resource-grid { grid-template-columns:repeat(4,1fr); }
  .field-grid.two { grid-template-columns:1fr 1fr; }
  .field-grid.three { grid-template-columns:repeat(3,1fr); }
  .modal-backdrop { align-items:center; padding:20px; }
  .modal { border-radius:18px; }
  .bottom-nav { left:50%; transform:translateX(-50%); width:min(680px, 100%); border-left:1px solid rgba(63,92,75,.35); border-right:1px solid rgba(63,92,75,.35); border-radius:16px 16px 0 0; }
}

  
/* ===== v0.3 // Watch Fortress grimdark + living dataslate ===== */
:root{
  --bg:#040404;--panel:#0b0c0c;--panel-2:#121313;--panel-3:#191a1a;
  --line:#333638;--line-strong:#6e7376;--text:#e8e8e5;--muted:#9a9d9e;--faint:#666a6c;
  --accent:#d0d3d4;--accent-2:#9ca2a5;--danger:#c05b60;--warn:#b79a67;--good:#9eac95;
  --blood:#7b1519;--blood-hot:#b72d33;--iron:#b6bbbe;--oath:#b9a47e;--radius:7px;
}
body{
  background:
    linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.009) 1px,transparent 1px),
    radial-gradient(circle at 52% -10%,rgba(150,155,158,.14),transparent 34%),
    radial-gradient(circle at 100% 36%,rgba(123,21,25,.12),transparent 29%),
    linear-gradient(180deg,#0a0a0a 0,#050505 58%,#020202 100%);
  background-size:28px 28px,28px 28px,auto,auto,auto;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;background:repeating-linear-gradient(118deg,transparent 0 18px,rgba(255,255,255,.018) 19px,transparent 20px 43px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.13;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
.runtime-warning{margin:12px;padding:13px 14px;border:1px solid #8e3034;border-left:4px solid var(--blood-hot);border-radius:5px;background:#190a0b;color:#efdfe0;font-size:.8rem;line-height:1.45;box-shadow:0 12px 32px rgba(0,0,0,.46)}
.runtime-warning strong{color:#fff;letter-spacing:.08em}.runtime-warning.hidden{display:none}
.topbar{background:rgba(4,4,4,.95);border-bottom-color:rgba(182,187,190,.28);box-shadow:0 8px 24px rgba(0,0,0,.38)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--iron),var(--blood-hot),var(--iron),transparent);opacity:.48}
.watch-mark{width:38px;height:38px;border-radius:3px;border-color:#73787b;background:linear-gradient(135deg,#282a2b,#090909 67%);color:#e4e5e5;box-shadow:inset 0 0 0 2px #080808,inset 4px 0 0 rgba(182,187,190,.25),0 0 18px rgba(123,21,25,.18);position:relative;font-size:1.25rem}
.watch-mark::before,.watch-mark::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:18px;height:1px;background:#909598}.watch-mark::before{top:8px}.watch-mark::after{bottom:8px}
.brand-title{font-family:Georgia,"Times New Roman",serif;font-size:.9rem;letter-spacing:.25em}.brand-subtitle{color:#858a8c;text-transform:uppercase}
.top-actions{align-items:center}.engine-status{height:30px;display:flex;gap:6px;align-items:center;padding:0 8px;border:1px solid #333638;background:#090a0a;color:#8d9294;font-size:.56rem;letter-spacing:.12em;font-weight:900;border-radius:3px;transition:.18s ease}.engine-status i,.live-rune i{width:6px;height:6px;border-radius:50%;background:#8da17f;box-shadow:0 0 8px rgba(141,161,127,.65)}.engine-status.saved{color:#ddd5be;border-color:#756a51;background:#17140d}.engine-status.saved i{background:#c5ad75;box-shadow:0 0 9px rgba(197,173,117,.55)}
.icon-btn,.btn{border-radius:5px;background:linear-gradient(180deg,#171819,#0c0d0d);border-color:#373a3c}.icon-btn:hover,.btn:hover{border-color:#73787b;background:#1b1c1d}.btn.primary{background:linear-gradient(180deg,#cbd0d2,#9ca2a5);color:#080909;border-color:#cbd0d2;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}.btn.danger{background:linear-gradient(180deg,#2c1012,#160809);border-color:#7e2c31;color:#e9b3b6}.btn:active,.icon-btn:active{transform:translateY(1px)}
.bottom-nav{background:rgba(4,4,4,.97);border-top-color:rgba(182,187,190,.3)}.nav-item{border-radius:3px}.nav-item.active{color:#f3f3f0;background:linear-gradient(180deg,rgba(182,187,190,.13),rgba(123,21,25,.08));box-shadow:inset 0 2px 0 var(--blood)}
.hero-card,.card{border-radius:7px;border-color:#35383a;background:linear-gradient(145deg,rgba(18,19,19,.99),rgba(7,7,7,.99))}.hero-card{border-left:5px solid #a7adb0;background:linear-gradient(90deg,rgba(176,181,184,.09),transparent 5%),radial-gradient(circle at 86% 16%,rgba(139,23,28,.13),transparent 30%),linear-gradient(145deg,rgba(20,21,21,.99),rgba(6,6,6,.99))}.hero-card::before{content:"WATCH FORTRESS // ORDO XENOS";position:absolute;right:-34px;bottom:28px;transform:rotate(-90deg);color:rgba(183,45,51,.11);font-size:.56rem;letter-spacing:.18em;font-weight:900}.hero-card::after{border-color:rgba(185,190,193,.08);box-shadow:0 0 0 26px rgba(118,23,27,.025),0 0 0 52px rgba(185,190,193,.018)}
.card{position:relative;overflow:hidden}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#4d5153 18%,#4d5153 82%,transparent);opacity:.65}.card-title-row h2,.modal-head h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:.11em}.card-title-row h2::before{content:"// ";color:#62676a;font-family:ui-monospace,monospace;font-size:.75em}.eyebrow{color:#aeb4b7}.eyebrow::before{content:"✠  ";color:#7b7f82}
.portrait{border-radius:4px;background:radial-gradient(circle at 50% 32%,#343738,#090909 70%);border-color:#686d70;box-shadow:inset 6px 0 0 rgba(185,190,193,.16)}.tag,.stat,.resource,.list-item,.weapon-stat,.skill-target,.input,.textarea,.select,.empty,.char-chip,.toast{border-radius:4px}
.stat{background:linear-gradient(180deg,rgba(26,27,27,.75),rgba(7,7,7,.75))}.stat:hover{background:linear-gradient(180deg,rgba(45,47,48,.7),rgba(20,7,8,.7));border-color:#777c7f}.stat .value,.roll-number{font-family:Georgia,"Times New Roman",serif}
.meter{border-radius:2px}.meter>i{background:linear-gradient(90deg,#621519,#a62a2f 62%,#c3c6c7)}
.live-resource{cursor:default}.resource-actions{display:grid;grid-template-columns:36px 1fr 36px;gap:5px;margin-top:8px}.micro-btn{height:30px;border:1px solid #323537;background:#0b0c0c;color:#c1c4c5;border-radius:3px;font-weight:900;cursor:pointer}.micro-btn:active{transform:translateY(1px);background:#1a1b1b}.micro-btn.resource-edit{font-size:.55rem;letter-spacing:.1em;color:#858a8c;font-weight:800}

<body>
  <div id="runtimeWarning" class="runtime-warning"><strong>INTERACTIVE ENGINE NOT RUNNING.</strong> This viewer is rendering the dataslate shell while blocking JavaScript. Open the hosted HTTPS/PWA version in Safari for buttons, rolls, saving, inventory, and menus.</div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" id="brandHome" aria-label="Go to character overview">
        <div class="watch-mark" aria-hidden="true">I</div>
        <div>
          <div class="brand-title">DEATHWATCH</div>
          <div class="brand-subtitle">Watch Fortress Dataslate // v0.3</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="engine-status" id="engineStatus" aria-label="Interactive engine online"><i></i><span>ONLINE</span></div>
        <button class="icon-btn" id="rollBtn" aria-label="Quick d100 roll" title="Quick d100">d100</button>
        <button class="icon-btn" id="menuBtn" aria-label="Open menu" title="Menu">☰</button>
      </div>
    </header>

    <main id="main" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Character sections">
      <button data-view="overview" class="nav-item active"><span>⌂</span><small>Overview</small></button>
      <button data-view="combat" class="nav-item"><span>✚</span><small>Combat</small></button>
      <button data-view="skills" class="nav-item"><span>◎</span><small>Skills</small></button>
      <button data-view="abilities" class="nav-item"><span>✦</span><small>Abilities</small></button>
      <button data-view="gear" class="nav-item"><span>▣</span><small>Gear</small></button>
      <button data-view="advances" class="nav-item"><span>↑</span><small>XP</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Modal</h2>
        <button class="icon-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <input type="file" id="portraitFile" accept="image/*" hidden />

  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'deathwatchCompanion.v0.3';
  const VERSION = '1.0.0';
  const CHAR_KEYS = ['WS','BS','S','T','Ag','Int','Per','WP','Fel'];
  const CHAR_LABELS = {
    WS:'Weapon Skill', BS:'Ballistic Skill', S:'Strength', T:'Toughness', Ag:'Agility',
    Int:'Intelligence', Per:'Perception', WP:'Willpower', Fel:'Fellowship'
  };
  const LOCATIONS = ['Head','Body','Left Arm','Right Arm','Left Leg','Right Leg'];

  const STARTER_COMPENDIUM = [
    {id:uid(), category:'Skill', name:'Awareness', characteristic:'Per', source:'Starter', notes:'Quick-reference entry. Add your owned source/page notes as needed.'},
    {id:uid(), category:'Skill', name:'Athletics', characteristic:'S', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Command', characteristic:'Fel', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Dodge', characteristic:'Ag', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Medicae', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Stealth', characteristic:'Ag', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Survival', characteristic:'Per', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Tactics', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Skill', name:'Tech-Use', characteristic:'Int', source:'Starter', notes:'Quick-reference entry.'},
    {id:uid(), category:'Ability', name:'Solo Mode Ability', source:'Starter', notes:'Replace with the character’s actual ability and source reference.'},
    {id:uid(), category:'Ability', name:'Squad Mode Ability', source:'Starter', notes:'Replace with the character’s actual ability and source reference.'},
    {id:uid(), category:'Gear', name:'Mission Wargear', source:'Starter', notes:'Generic placeholder for requisitioned mission equipment.'},
    {id:uid(), category:'Weapon', name:'Custom Ranged Weapon', source:'Starter', data:{class:'Ranged', range:'—', rof:'—', damage:'—', pen:'—', clipMax:0, reload:'—', qualities:''}, notes:'Enter statistics from a source you own.'},
    {id:uid(), category:'Weapon', name:'Custom Melee Weapon', source:'Starter', data:{class:'Melee', range:'—', rof:'—', damage:'—', pen:'—', clipMax:0, reload:'—', qualities:''}, notes:'Enter statistics from a source you own.'}
  ];

  const el = id => document.getElementById(id);
  const main = el('main');
  const nav = el('bottomNav');
  const backdrop = el('modalBackdrop');
  const modalTitle = el('modalTitle');
  const modalBody = el('modalBody');
  const closeModalBtn = el('closeModal');
  const importFile = el('importFile');
  const portraitFile = el('portraitFile');

  let state = loadState();
  let view = 'overview';
  let toastTimer = null;
  let pendingPortraitCharId = null;

  // A static HTML preview can render the shell while blocking JavaScript.
  // Hiding this warning is the first proof that the interactive engine is actually running.
  document.getElementById('runtimeWarning')?.classList.add('hidden');

  // Seed the demo only once on a genuinely fresh install.
  // After that, an empty character roster is valid and stays empty.
  if (!state.settings.initialized) {
    if (!state.characters.length) {
      const c = createDemoCharacter();
      state.characters.push(c);
      state.activeId = c.id;
    }
    state.settings.initialized = true;
    saveState();
  }

  function uid() {
    return (globalThis.crypto?.randomUUID?.() || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);
  }

  function createCharacter(name='New Battle-Brother') {
    const characteristics = {};
    CHAR_KEYS.forEach(k => characteristics[k] = 30);
    return {
      id: uid(), name, chapter:'', speciality:'', rank:'Battle-Brother', squadRole:'',
      demeanour:'', chapterDemeanour:'', past:'', portrait:'',
      builder:{status:'draft',method:'manual',notes:'',selectedSources:[],packageAuto:{Chapter:true,Speciality:true},packageSelections:{Chapter:'',Speciality:''}},
      packageApplications:{},
      mission:{name:'',requisitionBudget:0,notes:'',activeLoadoutId:''},
      combat:{criticalDamage:0,lastHitRoll:null,lastHitReverse:null,lastInitiative:null},
      psykana:{psyRating:0,notes:'',powers:[]},
      loadouts:[],
      characteristics,
      resources: {
        wounds:{current:20,max:20}, fate:{current:3,max:3}, fatigue:{current:0,max:10},
        cohesion:{current:0,max:0}, insanity:{current:0,max:100}, corruption:{current:0,max:100}
      },
      xp:{earned:0,spent:0}, renown:{value:0,label:''}, initiativeBonus:0,
      armour: LOCATIONS.map(loc => ({id:uid(), location:loc, ap:0, notes:''})),
      armourNotes:'', powerArmourHistory:'',
      weapons:[], gear:[], skills:[], abilities:[], advances:[], effects:[], activity:[], notes:'',
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
  }

  function createDemoCharacter() {
    const c = createCharacter('Brother Acastus // DEMO');
    c.chapter = 'Raptors';
    c.speciality = 'Tactical Marine';
    c.rank = 'Battle-Brother';
    c.squadRole = 'Marksman';
    c.demeanour = 'Measured';
    c.chapterDemeanour = 'Pragmatic';
    c.past = 'Demonstration personnel file. Replace this record with your own Battle-Brother.';
    c.characteristics = {WS:45,BS:52,S:44,T:46,Ag:48,Int:41,Per:50,WP:43,Fel:36};
    c.resources.wounds = {current:22,max:22};
    c.resources.fate = {current:3,max:3};
    c.resources.fatigue = {current:0,max:10};
    c.resources.cohesion = {current:3,max:5};
    c.xp = {earned:1000,spent:500};
    c.renown = {value:8,label:'Demo'};
    c.armour.forEach(a => { a.ap = a.location === 'Head' ? 7 : 8; a.notes = 'Demo value'; });
    c.powerArmourHistory = 'Demonstration armour history entry.';
    c.armourNotes = 'Demo numbers are included only to make the controls testable. Replace them from your own source material.';
    c.weapons = [
      {id:uid(),name:'Boltgun // DEMO',class:'Ranged',range:'100m',rof:'S/3/—',damage:'Demo',pen:'Demo',clipCurrent:28,clipMax:28,reload:'Full',qualities:'Demo profile',source:'Demo',notes:'Use Fire −1, +1, Reload, and Edit to verify the armoury is live.'},
      {id:uid(),name:'Combat Blade // DEMO',class:'Melee',range:'Melee',rof:'—',damage:'Demo',pen:'Demo',clipCurrent:0,clipMax:0,reload:'—',qualities:'Demo profile',source:'Demo',notes:''}
    ];
    c.skills = [
      {id:uid(),name:'Awareness',characteristic:'Per',training:10,source:'Demo',notes:'Tap the target number to roll.'},
      {id:uid(),name:'Stealth',characteristic:'Ag',training:0,source:'Demo',notes:''},
      {id:uid(),name:'Tactics',characteristic:'Int',training:0,source:'Demo',notes:''}
    ];
    c.abilities = [
      {id:uid(),name:'Solo Mode Ability // DEMO',type:'Solo Mode',source:'Demo',notes:'Replace with the actual ability from a source you own.'},
      {id:uid(),name:'Squad Mode Ability // DEMO',type:'Squad Mode',source:'Demo',notes:'Replace with the actual ability from a source you own.'}
    ];
    c.gear = [{id:uid(),name:'Mission Wargear // DEMO',qty:1,requisition:'—',missionIssued:true,source:'Demo',notes:'Editable demonstration entry.'}];
    c.advances = [{id:uid(),name:'Example Advance // DEMO',cost:500,source:'Demo',notes:'Delete when starting a real character.',date:new Date().toISOString(),counted:true}];
    c.notes = 'This starter record exists so every major screen has something interactive immediately.';
    c.activity = [{id:uid(),at:new Date().toISOString(),kind:'system',message:'Dataslate authenticated. Demo personnel record loaded.'}];
    return c;
  }

  function defaultState() {
    return {
      version: VERSION,
      activeId:null,
      characters:[],
      compendium: structuredClone(STARTER_COMPENDIUM),
      settings:{degreeMethod:'margin', lastView:'overview', initialized:false, disabledSources:[], lastBackupAt:'', schemaVersion:1}
    };
  }

  function normalizeCharacter(c) {
    const base = createCharacter(c?.name || 'Battle-Brother');
    const merged = {...base, ...c};
    merged.characteristics = {...base.characteristics, ...(c.characteristics || {})};
    merged.resources = {...base.resources, ...(c.resources || {})};
    Object.keys(base.resources).forEach(k => merged.resources[k] = {...base.resources[k], ...(c.resources?.[k] || {})});
    merged.xp = {...base.xp, ...(c.xp || {})};
    merged.renown = {...base.renown, ...(c.renown || {})};
    merged.builder = {...base.builder, ...(c.builder || {})};
    if (!Array.isArray(merged.builder.selectedSources)) merged.builder.selectedSources = [];
    // Existing characters migrate conservatively: do not retroactively apply packages without consent.
    if (!c?.builder?.packageAuto) merged.builder.packageAuto = {Chapter:false,Speciality:false};
    else merged.builder.packageAuto = {...base.builder.packageAuto, ...(c.builder.packageAuto||{})};
    merged.builder.packageSelections = {...base.builder.packageSelections, ...(c.builder?.packageSelections||{})};
    merged.packageApplications = {...(c.packageApplications||{})};
    merged.mission = {...base.mission, ...(c.mission || {})};
    merged.combat = {...base.combat, ...(c.combat || {})};
    merged.psykana = {...base.psykana, ...(c.psykana || {})};
    if (!Array.isArray(merged.psykana.powers)) merged.psykana.powers=[];
    if (!Array.isArray(merged.loadouts)) merged.loadouts=[];
    ['armour','weapons','gear','skills','abilities','advances','effects','activity'].forEach(k => {
      if (!Array.isArray(merged[k])) merged[k] = [];
    });
    merged.weapons=merged.weapons.map(w=>({...w,equipped:w.equipped!==false}));
    merged.gear=merged.gear.map(g=>({...g,equipped:g.equipped!==false}));
    merged.abilities=merged.abilities.map(a=>({...a,active:Boolean(a.active),cohesionCost:Math.max(0,n(a.cohesionCost)),activation:a.activation||'',duration:a.duration||''}));
    merged.advances = merged.advances.map(normalizeAdvanceRecord);
    if (!merged.armour.length) merged.armour = structuredClone(base.armour);
    return merged;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const out = {...defaultState(), ...parsed};
      out.settings = {...defaultState().settings, ...(parsed.settings || {})};
      out.characters = Array.isArray(parsed.characters) ? parsed.characters.map(normalizeCharacter) : [];
      out.compendium = Array.isArray(parsed.compendium) ? parsed.compendium.map(normalizeCompendiumEntry) : structuredClone(STARTER_COMPENDIUM).map(normalizeCompendiumEntry);
      if (!out.activeId || !out.characters.some(c => c.id === out.activeId)) out.activeId = out.characters[0]?.id || null;
      out.version = VERSION;
      return out;
    } catch (err) {
      console.warn('Could not load saved data:', err);
      return defaultState();
    }
  }

  function saveState() {
    state.version = VERSION;
    const c = activeChar();
    if (c) c.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    pulseSave();
  }

  function activeChar() {
    return state.characters.find(c => c.id === state.activeId) || state.characters[0];
  }

  function esc(value='') {
    return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  function n(value, fallback=0) {
    const num = Number(value);
    return Number.isFinite(num) ? num : fallback;
  }

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

  function characteristicBonus(c,key) { return Math.floor(Math.max(0,n(c?.characteristics?.[key]))/10); }

  function numericReq(value) {
    const m=String(value??'').match(/-?\d+(?:\.\d+)?/);
    return m ? Math.max(0,n(m[0])) : 0;
  }

  function requisitionSpent(c) {
    return [...(c.weapons||[]),...(c.gear||[])].filter(x=>x.equipped!==false).reduce((sum,x)=>sum+(numericReq(x.requisition)*Math.max(1,n(x.qty,1))),0);
  }

  function validateCharacter(c) {
    const issues=[];
    if(!String(c.name||'').trim()) issues.push('Name is missing.');
    if(!String(c.chapter||'').trim()) issues.push('Chapter has not been selected.');
    if(!String(c.speciality||'').trim()) issues.push('Speciality has not been selected.');
    if(n(c.xp.spent)>n(c.xp.earned)) issues.push(`XP spent exceeds XP earned by ${n(c.xp.spent)-n(c.xp.earned)}.`);
    ['wounds','fate','fatigue','cohesion'].forEach(k=>{const r=c.resources?.[k];if(r&&n(r.max)>0&&n(r.current)>n(r.max))issues.push(`${k[0].toUpperCase()+k.slice(1)} exceeds its maximum.`);});
    (c.weapons||[]).forEach(w=>{if(n(w.clipMax)>0&&n(w.clipCurrent)>n(w.clipMax))issues.push(`${w.name||'Weapon'} has more ammunition loaded than its clip maximum.`);});
    const budget=n(c.mission?.requisitionBudget); const spent=requisitionSpent(c); if(budget>0&&spent>budget)issues.push(`Recorded Requisition exceeds the mission budget by ${spent-budget}.`);
    const byTemplate=new Map();
    (c.advances||[]).filter(a=>a.templateId).forEach(a=>{
      const entry=state.compendium.find(x=>x.id===a.templateId&&x.category==='Advance');
      if(!entry)return;
      const prereqIssues=checkAdvancePrerequisites(c,entry,{forPurchase:false,xpSpentOverride:a.xpSpentBefore});
      prereqIssues.forEach(msg=>issues.push(`${a.name}: ${msg}`));
      const arr=byTemplate.get(a.templateId)||[];arr.push(a);byTemplate.set(a.templateId,arr);
    });
    byTemplate.forEach((records,id)=>{const entry=state.compendium.find(x=>x.id===id);if(!entry)return;const d=normalizeAdvanceData(entry.data||{});if(!d.repeatable&&records.length>1)issues.push(`${entry.name} has been purchased more than once but is not repeatable.`);if(d.repeatable&&d.maxPurchases>0&&records.length>d.maxPurchases)issues.push(`${entry.name} exceeds its maximum purchases (${d.maxPurchases}).`);});
    [...(c.weapons||[]),...(c.gear||[])].filter(x=>x.equipped!==false).forEach(x=>{const req=numericReq(x.renownReq);if(req>0&&n(c.renown?.value)<req)issues.push(`${x.name||'Equipment'} requires Renown ${req}; current Renown is ${n(c.renown?.value)}.`);});
    if(n(c.combat?.criticalDamage)<0)issues.push('Critical Damage cannot be negative.');
    if((c.psykana?.powers||[]).length&&n(c.psykana?.psyRating)<=0)issues.push('Psychic powers are recorded but Psy Rating is 0.');
    ['Chapter','Speciality'].forEach(type=>{const a=c.packageApplications?.[type];if(!a)return;const entry=state.compendium.find(x=>x.id===a.entryId);if(entry&&a.signature&&a.signature!==packageSignature(entry))issues.push(`${type} package has changed in the Librarium and should be resynchronized.`);});
    return issues;
  }

  function sourceNames() { return [...new Set(state.compendium.map(x=>String(x.source||'Custom').trim()||'Custom'))].sort((a,b)=>a.localeCompare(b)); }
  function sourceEnabled(name) { return !(state.settings.disabledSources||[]).includes(name); }

  function normName(value='') { return String(value).trim().toLowerCase(); }
  function stringList(value) {
    if (Array.isArray(value)) return value.map(x=>String(x).trim()).filter(Boolean);
    return String(value||'').split(',').map(x=>x.trim()).filter(Boolean);
  }
  function parseCharacteristicRequirements(value) {
    const out={};
    String(value||'').split(',').forEach(part=>{
      const m=part.trim().match(/^([A-Za-z]+)\s*(?:[:=>]+)?\s*(\d+)$/);
      if(!m)return;
      const key=CHAR_KEYS.find(k=>k.toLowerCase()===m[1].toLowerCase());
      if(key)out[key]=Math.max(0,n(m[2]));
    });
    return out;
  }
  function formatCharacteristicRequirements(obj={}) {
    return CHAR_KEYS.filter(k=>n(obj?.[k])>0).map(k=>`${k} ${n(obj[k])}`).join(', ');
  }
  function normalizeAdvanceData(raw={}) {
    const p=raw?.prerequisites||{};
    const chars={};
    Object.entries(p.characteristics||{}).forEach(([k,v])=>{const key=CHAR_KEYS.find(x=>x.toLowerCase()===String(k).toLowerCase());if(key&&n(v)>0)chars[key]=Math.max(0,n(v));});
    return {
      ...raw,
      cost:Math.max(0,n(raw?.cost)),
      pool:String(raw?.pool||'General').trim()||'General',
      tier:String(raw?.tier||'').trim(),
      repeatable:Boolean(raw?.repeatable),
      maxPurchases:Math.max(0,n(raw?.maxPurchases)),
      prerequisites:{
        chapters:stringList(p.chapters),
        specialities:stringList(p.specialities),
        minRenown:Math.max(0,n(p.minRenown)),
        minXPSpent:Math.max(0,n(p.minXPSpent)),
        characteristics:chars,
        advances:stringList(p.advances),
        skills:stringList(p.skills),
        abilities:stringList(p.abilities)
      },
      grant:{
        type:String(raw?.grant?.type||'None'),
        target:String(raw?.grant?.target||'').trim(),
        amount:n(raw?.grant?.amount),
        characteristic:String(raw?.grant?.characteristic||'').trim(),
        abilityType:String(raw?.grant?.abilityType||'Talent').trim()||'Talent'
      }
    };
  }
  function normalizeCompendiumEntry(raw={}) {
    const x={...raw,id:raw.id||uid(),category:raw.category||'Other',name:raw.name||'Unnamed Entry',source:raw.source||'Custom',reference:raw.reference||'',notes:raw.notes||''};
    x.data=x.category==='Advance'?normalizeAdvanceData(raw.data||{}):((x.category==='Chapter'||x.category==='Speciality')?normalizePackageData(raw.data||{}):{...(raw.data||{})});
    return x;
  }

  function parseCharacteristicMods(value='') {
    const out={};
    String(value||'').split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
      const m=part.match(/^([A-Za-z]+)\s*([+-]?\d+)$/); if(!m)return;
      const key=CHAR_KEYS.find(k=>k.toLowerCase()===m[1].toLowerCase()); if(key)out[key]=n(m[2]);
    });
    return out;
  }
  function formatCharacteristicMods(obj={}) {
    return CHAR_KEYS.filter(k=>n(obj?.[k])!==0).map(k=>`${k} ${n(obj[k])>=0?'+':''}${n(obj[k])}`).join(', ');
  }
  function parsePackageSkills(value='') {
    return String(value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{
      const parts=line.split('|').map(x=>x.trim());
      const name=parts[0]||''; const characteristic=CHAR_KEYS.find(k=>k.toLowerCase()===String(parts[1]||'').toLowerCase())||'Int'; const training=n(parts[2]);
      return name?{name,characteristic,training}:null;
    }).filter(Boolean);
  }
  function formatPackageSkills(items=[]) { return (items||[]).map(x=>`${x.name} | ${x.characteristic||'Int'} | ${n(x.training)}`).join('\n'); }
  function parsePackageAbilities(value='') {
    return String(value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{const parts=line.split('|').map(x=>x.trim()); return {type:parts.length>1?(parts[0]||'Ability'):'Ability',name:parts.length>1?(parts.slice(1).join(' | ')):(parts[0]||'')};}).filter(x=>x.name);
  }
  function formatPackageAbilities(items=[]) { return (items||[]).map(x=>`${x.type||'Ability'} | ${x.name}`).join('\n'); }
  function normalizePackageData(raw={}) {

  }
  function packageSummaryLines(entry) {
    if(!entry)return ['No matching Librarium package.']; const p=normalizePackageData(entry.data||{}).package,lines=[];
    const mods=formatCharacteristicMods(p.characteristics); if(mods)lines.push(`Characteristics: ${mods}`);
    if(p.skills.length)lines.push(`Skills: ${p.skills.map(x=>`${x.name}${x.training?` ${x.training>=0?'+':''}${x.training}`:''}`).join(', ')}`);
    if(p.abilities.length)lines.push(`Abilities: ${p.abilities.map(x=>`${x.type}: ${x.name}`).join(', ')}`);

  }
  function packageSignature(entry) {

  function revertPackageApplication(c,type) {

      else if(e.type==='Skill'){
        const skill=(c.skills||[]).find(x=>x.id===e.skillId); if(!skill)return;
        if(e.created){ if(skill.packageGrantToken===app.token&&n(skill.training)===n(e.baselineTraining)&&normName(skill.name)===normName(e.baselineName)) c.skills=c.skills.filter(x=>x.id!==e.skillId); else delete skill.packageGrantToken; }
        else skill.training=n(skill.training)-n(e.amount);
      } else if(e.type==='Ability'&&e.created){
        const ability=(c.abilities||[]).find(x=>x.id===e.abilityId); if(!ability)return;
        if(ability.packageGrantToken===app.token&&normName(ability.name)===normName(e.baselineName)&&normName(ability.type)===normName(e.baselineType)) c.abilities=c.abilities.filter(x=>x.id!==e.abilityId); else delete ability.packageGrantToken;

  function applyPackageApplication(c,type,entry) {
    if(!entry)return null; const data=normalizePackageData(entry.data||{}).package,token=uid(),effects=[];
    Object.entries(data.characteristics||{}).forEach(([k,v])=>{if(CHAR_KEYS.includes(k)&&n(v)!==0){c.characteristics[k]=n(c.characteristics[k])+n(v);effects.push({type:'Characteristic',target:k,amount:n(v)});}});
    (data.skills||[]).forEach(g=>{
      let skill=(c.skills||[]).find(x=>normName(x.name)===normName(g.name)); const amount=n(g.training);
      if(skill){skill.training=n(skill.training)+amount;effects.push({type:'Skill',skillId:skill.id,created:false,amount});}
      else {skill={id:uid(),name:g.name,characteristic:CHAR_KEYS.includes(g.characteristic)?g.characteristic:'Int',training:amount,source:entry.source||'',notes:`Granted by ${entry.name}`,packageGrantToken:token};c.skills.push(skill);effects.push({type:'Skill',skillId:skill.id,created:true,baselineTraining:amount,baselineName:g.name});}
    });
    (data.abilities||[]).forEach(g=>{
      const existing=(c.abilities||[]).find(x=>normName(x.name)===normName(g.name)); if(existing){effects.push({type:'Ability',abilityId:existing.id,created:false});return;}
      const ability={id:uid(),name:g.name,type:g.type||'Ability',source:entry.source||'',notes:`Granted by ${entry.name}`,packageGrantToken:token};c.abilities.push(ability);effects.push({type:'Ability',abilityId:ability.id,created:true,baselineName:g.name,baselineType:g.type||'Ability'});
    });
    c.packageApplications[type]={entryId:entry.id,name:entry.name,source:entry.source||'Custom',signature:packageSignature(entry),token,effects,appliedAt:new Date().toISOString()}; return c.packageApplications[type];
  }
  function reconcilePackageApplication(c,type) {
    if(!c.packageApplications)c.packageApplications={}; const auto=Boolean(c.builder?.packageAuto?.[type]);
    if(!auto){revertPackageApplication(c,type);return;}
    const identity=type==='Chapter'?c.chapter:c.speciality; const matches=packageEntries(type,identity);
    const selectedId=c.builder?.packageSelections?.[type]||''; const entry=matches.find(x=>x.id===selectedId)||matches[0]||null;
    const current=c.packageApplications[type]; if(current&&entry&&current.entryId===entry.id&&current.signature===packageSignature(entry))return;

  }
  function normalizeAdvanceRecord(raw={}) {
    return {

      tier:raw.tier||'',

  function advanceEntries() {

  }
  function advancePurchaseCount(c,entry) {
    const name=normName(entry.name), source=normName(entry.source);

  function hasNamed(items,name) { const q=normName(name); return (items||[]).some(x=>normName(x.name)===q); }
  function advanceRequirementLines(entry) {
    const d=normalizeAdvanceData(entry?.data||{}), p=d.prerequisites, lines=[];
    if(p.chapters.length)lines.push(`Chapter: ${p.chapters.join(' or ')}`);
    if(p.specialities.length)lines.push(`Speciality: ${p.specialities.join(' or ')}`);
    if(p.minRenown>0)lines.push(`Renown ≥ ${p.minRenown}`);
    if(p.minXPSpent>0)lines.push(`XP already spent ≥ ${p.minXPSpent}`);
    Object.entries(p.characteristics).forEach(([k,v])=>lines.push(`${k} ≥ ${v}`));
    p.advances.forEach(x=>lines.push(`Advance: ${x}`));
    p.skills.forEach(x=>lines.push(`Skill: ${x}`));

  function advanceEffectLine(entry) {
    const g=normalizeAdvanceData(entry?.data||{}).grant;
    if(g.type==='Characteristic'&&g.target)return `${g.target} ${g.amount>=0?'+':''}${g.amount}`;
    if(g.type==='Skill'&&g.target)return `${g.target} training ${g.amount>=0?'+':''}${g.amount}${g.characteristic?` (${g.characteristic})`:''}`;
    if(g.type==='Ability'&&g.target)return `Gain ${g.abilityType||'Ability'}: ${g.target}`;

  }
  function applyAdvanceGrant(c,entry,record) {
    const g=normalizeAdvanceData(entry?.data||{}).grant;

      const key=CHAR_KEYS.find(k=>k.toLowerCase()===normName(g.target));if(!key||!g.amount)return null;
      c.characteristics[key]=n(c.characteristics[key])+n(g.amount);return {type:'Characteristic',target:key,amount:n(g.amount)};
    }
    if(g.type==='Skill'&&g.target){
      let skill=(c.skills||[]).find(x=>normName(x.name)===normName(g.target));
      const amount=n(g.amount);if(skill){skill.training=n(skill.training)+amount;return {type:'Skill',skillId:skill.id,created:false,amount};}
      skill={id:uid(),name:g.target,characteristic:CHAR_KEYS.includes(g.characteristic)?g.characteristic:'Int',training:amount,source:entry.source||'',notes:`Granted by ${entry.name}`};c.skills.push(skill);return {type:'Skill',skillId:skill.id,created:true,amount};
    }

  function revertAdvanceGrant(c,record) {

  function checkAdvancePrerequisites(c,entry,{forPurchase=true,xpSpentOverride=null}={}) {
    const d=normalizeAdvanceData(entry?.data||{}), p=d.prerequisites, issues=[];
    if(p.chapters.length&&!p.chapters.some(x=>normName(x)===normName(c.chapter)))issues.push(`Requires Chapter: ${p.chapters.join(' or ')}.`);
    if(p.specialities.length&&!p.specialities.some(x=>normName(x)===normName(c.speciality)))issues.push(`Requires Speciality: ${p.specialities.join(' or ')}.`);
    if(n(c.renown?.value)<p.minRenown)issues.push(`Requires Renown ${p.minRenown}.`);
    const xpBasis=xpSpentOverride==null?n(c.xp?.spent):n(xpSpentOverride);
    if(xpBasis<p.minXPSpent)issues.push(`Requires ${p.minXPSpent} XP already spent.`);
    Object.entries(p.characteristics).forEach(([k,v])=>{if(n(c.characteristics?.[k])<n(v))issues.push(`Requires ${k} ${v}.`);});
    p.advances.forEach(x=>{if(!hasNamed(c.advances,x))issues.push(`Requires advance: ${x}.`);});
    p.skills.forEach(x=>{if(!hasNamed(c.skills,x))issues.push(`Requires skill: ${x}.`);});
    p.abilities.forEach(x=>{if(!hasNamed(c.abilities,x))issues.push(`Requires ability/talent/trait: ${x}.`);});
    if(forPurchase){
      const count=advancePurchaseCount(c,entry);
      if(!d.repeatable&&count>0)issues.push('This advance is not repeatable and is already purchased.');
      if(d.repeatable&&d.maxPurchases>0&&count>=d.maxPurchases)issues.push(`Maximum purchases reached (${d.maxPurchases}).`);
      const available=n(c.xp?.earned)-n(c.xp?.spent);
      if(available<d.cost)issues.push(`Requires ${d.cost} available XP; only ${Math.max(0,available)} is available.`);

  function renderCombat(c) {
    const armour = c.armour.map(a => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.location)}</div><div class="item-sub">${esc(a.notes || 'No notes')}</div></div><div class="skill-target" data-edit-armour="${a.id}">${n(a.ap)} AP</div></div></div>`).join('');
    const weapons = c.weapons.length ? c.weapons.map(w => weaponHtml(w)).join('') : `<div class="empty">No weapons recorded. Add one or pull a template from the Compendium.</div>`;
    const effects = c.effects.length ? c.effects.map(e => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(e.name)}</div><div class="item-sub">${esc(e.notes || '')}</div></div><button class="btn small danger" data-delete-effect="${e.id}">Clear</button></div></div>`).join('') : `<div class="empty">No temporary effects.</div>`;

        <div class="inline-fields" style="margin-top:8px"><button class="btn" data-action="initiative">Roll Initiative</button><button class="btn" data-action="hit-location-roll">Hit Location d100</button></div><div class="inline-fields" style="margin-top:8px"><button class="btn" data-action="add-effect">＋ Effect</button><button class="btn" data-action="edit-mission">Mission</button></div>
        ${c.combat?.lastHitRoll?`<div class="item-sub" style="margin-top:10px">Last hit-location roll: ${String(c.combat.lastHitRoll).padStart(2,'0')} • reversed ${String(c.combat.lastHitReverse).padStart(2,'0')} • consult active source table</div>`:''}
      </section>
      <section class="card"><div class="card-title-row"><h2>Weapons</h2><div><button class="btn small" data-action="compendium-weapons">Library</button> <button class="btn small primary" data-action="add-weapon">＋ Add</button></div></div><div class="list">${weapons}</div></section>
      <div class="two-col">

  function weaponHtml(w) {
    const max = Math.max(0,n(w.clipMax));
    const cur = clamp(n(w.clipCurrent),0,max || 9999);
    return `<div class="list-item weapon">
      <div class="list-row"><div><div class="item-title">${esc(w.name)} ${w.equipped!==false?'<span class="tag">EQUIPPED</span>':'<span class="tag">STOWED</span>'}</div><div class="item-sub">${esc(w.class || 'Weapon')} ${w.source?`• ${esc(w.source)}`:''}</div></div>
        <div class="item-actions"><button class="btn small" data-edit-weapon="${w.id}">Edit</button><button class="btn small danger" data-delete-weapon="${w.id}">×</button></div></div>
      <div class="weapon-stats">
        <div class="weapon-stat"><b>${esc(w.range || '—')}</b><small>Range</small></div>
        <div class="weapon-stat"><b>${esc(w.rof || '—')}</b><small>RoF</small></div>
        <div class="weapon-stat"><b>${esc(w.damage || '—')}</b><small>Damage</small></div>
        <div class="weapon-stat"><b>${esc(w.pen || '—')}</b><small>Pen</small></div>
      </div>
      ${w.qualities?`<div class="item-sub" style="margin-top:8px"><strong>Qualities:</strong> ${esc(w.qualities)}</div>`:''}
      ${max>0?`<div class="ammo-row"><span class="ammo-count">${cur} / ${max}</span><button class="btn small" data-ammo-minus="${w.id}">Fire −1</button><button class="btn small" data-ammo-plus="${w.id}">＋1</button><button class="btn small" data-reload="${w.id}">Reload</button><span class="source">${esc(w.reload || '')}</span></div>`:''}
      ${w.notes?`<div class="item-sub" style="margin-top:8px">${esc(w.notes)}</div>`:''}
    </div>`;
  }

  function renderSkills(c) {
    const list = c.skills.length ? c.skills.map(s => {
      const base = n(c.characteristics[s.characteristic]); const bonus = n(s.training); const target = base + bonus;
      return `<div class="list-item skill-row"><div><div class="item-title">${esc(s.name)}</div><div class="item-sub">${esc(CHAR_LABELS[s.characteristic] || s.characteristic)} ${bonus?`${bonus>0?'+':''}${bonus}`:''} ${s.source?`• ${esc(s.source)}`:''}</div></div><button class="skill-target" data-roll-skill="${s.id}">${target}</button><button class="btn small" data-edit-skill="${s.id}">Edit</button></div>`;
    }).join('') : `<div class="empty">No skills added. Use the Compendium to add starter skills or create your own.</div>`;
    return `${hero(c)}${characteristics(c)}
      <section class="card"><div class="card-title-row"><h2>Skills</h2><div><button class="btn small" data-action="compendium-skills">Compendium</button> <button class="btn small primary" data-action="add-skill">＋ Add</button></div></div><div class="list">${list}</div></section>`;
  }

  function renderAbilities(c) {
    const groups = ['Talent','Trait','Ability','Solo Mode','Squad Mode','Honour','Distinction','Other'];
    const html = groups.map(g => {
      const arr = c.abilities.filter(a => (a.type || 'Other') === g);
      if (!arr.length) return '';
      return `<section class="card"><div class="card-title-row"><h2>${esc(g)}</h2></div><div class="list">${arr.map(a => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.name)} ${a.active?'<span class="tag">ACTIVE</span>':''}</div><div class="item-sub">${esc([a.activation,a.duration,a.cohesionCost?`Cohesion ${a.cohesionCost}`:''].filter(Boolean).join(' • '))}</div><div class="item-sub">${esc(a.notes || '')}</div>${a.source?`<div class="source">${esc(a.source)}</div>`:''}</div><div class="item-actions">${['Solo Mode','Squad Mode'].includes(a.type)?`<button class="btn small ${a.active?'danger':'primary'}" data-toggle-ability="${a.id}">${a.active?'End':'Activate'}</button>`:''}<button class="btn small" data-edit-ability="${a.id}">Edit</button><button class="btn small danger" data-delete-ability="${a.id}">×</button></div></div></div>`).join('')}</div></section>`;
    }).join('');
    const powers=(c.psykana?.powers||[]); const psy=`<section class="card"><div class="card-title-row"><h2>Psykana</h2><div><button class="btn small" data-action="edit-psykana">PR ${n(c.psykana?.psyRating)}</button> <button class="btn small" data-action="compendium-psychic">Librarium</button> <button class="btn small primary" data-action="add-psychic">＋ Power</button></div></div>${powers.length?`<div class="list">${powers.map(p=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(p.name)} ${p.sustained?'<span class="tag">SUSTAINED</span>':''}</div><div class="item-sub">${esc([p.test,p.range,p.sustain].filter(Boolean).join(' • '))}</div>${p.source?`<div class="source">${esc(p.source)}</div>`:''}${p.effect?`<div class="item-sub">${esc(p.effect)}</div>`:''}</div><div class="item-actions"><button class="btn small" data-toggle-power="${p.id}">${p.sustained?'End':'Sustain'}</button><button class="btn small" data-edit-power="${p.id}">Edit</button></div></div></div>`).join('')}</div>`:`<div class="empty">No psychic powers recorded.</div>`}${c.psykana?.notes?`<p class="section-note">${esc(c.psykana.notes)}</p>`:''}</section>`;
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Abilities & Talents</h2><div><button class="btn small" data-action="compendium-abilities">Compendium</button> <button class="btn small primary" data-action="add-ability">＋ Add</button></div></div><p class="section-note">Solo/Squad Mode abilities can be activated here; Squad Mode can spend Cohesion when a cost is recorded.</p></section>${html || `<section class="card"><div class="empty">No abilities recorded yet.</div></section>`}${psy}`;
  }

  function renderGear(c) {
    const gear = c.gear.length ? c.gear.map(g => `<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(g.name)} ${n(g.qty,1)>1?`×${n(g.qty,1)}`:''} ${g.equipped!==false?'<span class="tag">EQUIPPED</span>':'<span class="tag">STOWED</span>'}</div><div class="item-sub">${g.missionIssued?'Mission issued • ':''}${g.requisition!==''&&g.requisition!=null?`Req ${esc(g.requisition)} • `:''}${esc(g.notes || '')}</div>${g.source?`<div class="source">${esc(g.source)}</div>`:''}</div><div class="item-actions"><button class="btn small" data-edit-gear="${g.id}">Edit</button><button class="btn small danger" data-delete-gear="${g.id}">×</button></div></div></div>`).join('') : `<div class="empty">No equipment recorded.</div>`;
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Wargear & Requisition</h2><div><button class="btn small" data-action="loadouts">Loadouts</button> <button class="btn small" data-action="compendium-gear">Librarium</button> <button class="btn small primary" data-action="add-gear">＋ Add</button></div></div><div class="list">${gear}</div></section>
      <section class="card"><div class="card-title-row"><h2>Power Armour</h2><button class="btn small" data-action="armour-notes">Edit</button></div><p class="section-note"><strong>History:</strong> ${esc(c.powerArmourHistory || 'Not recorded.')}</p><div class="divider"></div><p class="section-note">${esc(c.armourNotes || 'No armour notes.')}</p></section>`;

  function renderAdvances(c) {
    const avail=Math.max(0,n(c.xp.earned)-n(c.xp.spent));
    const catalogue=advanceEntries();
    const eligible=catalogue.filter(x=>checkAdvancePrerequisites(c,x).length===0).length;
    const pools=advancePoolSummary(c);
    const poolHtml=pools.length?`<div class="list">${pools.map(([pool,x])=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(pool)}</div><div class="item-sub">${x.count} purchase${x.count===1?'':'s'}</div></div><strong>${x.xp} XP</strong></div></div>`).join('')}</div>`:`<div class="empty">No advancement pools used yet.</div>`;
    const list=c.advances.length?[...c.advances].reverse().map(a=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(a.name)}${a.override?' <span class="tag">MANUAL</span>':''}</div><div class="item-sub">${n(a.cost)} XP • ${esc(a.pool||'Manual')}${a.tier?` • ${esc(a.tier)}`:''}${a.source?` • ${esc(a.source)}`:''}</div>${a.reference?`<div class="source">${esc(a.reference)}</div>`:''}${a.notes?`<div class="source">${esc(a.notes)}</div>`:''}</div><button class="btn small danger" data-delete-advance="${a.id}">Undo</button></div></div>`).join(''):`<div class="empty">No purchased advances recorded.</div>`;
    return `${hero(c)}<section class="card"><div class="card-title-row"><h2>Experience</h2><button class="btn small" data-action="edit-progression">Edit Totals</button></div>
      <div class="resource-grid"><div class="resource"><div class="resource-head"><span class="resource-name">Earned</span><span class="resource-value">${n(c.xp.earned)}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Spent</span><span class="resource-value">${n(c.xp.spent)}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Available</span><span class="resource-value">${avail}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Renown</span><span class="resource-value">${n(c.renown.value)}</span></div></div></div>
      <div class="divider"></div><div class="resource-grid"><div class="resource"><div class="resource-head"><span class="resource-name">Catalogue</span><span class="resource-value">${catalogue.length}</span></div></div><div class="resource"><div class="resource-head"><span class="resource-name">Eligible Now</span><span class="resource-value">${eligible}</span></div></div></div>
      <div style="margin-top:10px"><button class="btn primary" data-action="advance-catalogue">Browse Advances</button> <button class="btn" data-action="add-advance">Manual Record</button> <button class="btn" data-action="compendium-advances">Edit Templates</button></div>
      <p class="section-note">Rules-aware purchases use structured prerequisites and XP costs from enabled source packs. Manual Record remains available for GM rulings, homebrew, and material not yet entered into the library.</p>
    </section><section class="card"><div class="card-title-row"><h2>Advancement Pools</h2></div>${poolHtml}</section><section class="card"><div class="card-title-row"><h2>Advancement History</h2></div><div class="list">${list}</div></section>`;
  }

  function bindViewEvents() {
    main.querySelectorAll('[data-char-id]').forEach(b => b.onclick = () => { state.activeId=b.dataset.charId; saveState(); render(); });
    main.querySelectorAll('[data-roll-char]').forEach(b => b.onclick = () => rollTest(CHAR_LABELS[b.dataset.rollChar], n(activeChar().characteristics[b.dataset.rollChar])));
    main.querySelectorAll('[data-roll-skill]').forEach(b => b.onclick = () => { const s=activeChar().skills.find(x=>x.id===b.dataset.rollSkill); if(s) rollTest(s.name,n(activeChar().characteristics[s.characteristic])+n(s.training)); });
    main.querySelectorAll('[data-action]').forEach(b => b.onclick = () => handleAction(b.dataset.action));
    main.querySelectorAll('[data-edit-armour]').forEach(b => b.onclick = () => editArmour(b.dataset.editArmour));
    main.querySelectorAll('[data-edit-weapon]').forEach(b => b.onclick = () => editWeapon(b.dataset.editWeapon));
    main.querySelectorAll('[data-delete-weapon]').forEach(b => b.onclick = () => deleteItem('weapons',b.dataset.deleteWeapon,'weapon'));
    main.querySelectorAll('[data-ammo-minus]').forEach(b => b.onclick = () => ammo(b.dataset.ammoMinus,-1));
    main.querySelectorAll('[data-ammo-plus]').forEach(b => b.onclick = () => ammo(b.dataset.ammoPlus,1));
    main.querySelectorAll('[data-reload]').forEach(b => b.onclick = () => reloadWeapon(b.dataset.reload));
    main.querySelectorAll('[data-delete-effect]').forEach(b => b.onclick = () => deleteItem('effects',b.dataset.deleteEffect,'effect'));
    main.querySelectorAll('[data-edit-skill]').forEach(b => b.onclick = () => editSkill(b.dataset.editSkill));
    main.querySelectorAll('[data-edit-ability]').forEach(b => b.onclick = () => editAbility(b.dataset.editAbility));
    main.querySelectorAll('[data-toggle-ability]').forEach(b => b.onclick = () => toggleAbilityActive(b.dataset.toggleAbility));
    main.querySelectorAll('[data-edit-power]').forEach(b => b.onclick = () => editPsychicPower(b.dataset.editPower));
    main.querySelectorAll('[data-toggle-power]').forEach(b => b.onclick = () => togglePsychicPower(b.dataset.togglePower));
    main.querySelectorAll('[data-delete-ability]').forEach(b => b.onclick = () => deleteItem('abilities',b.dataset.deleteAbility,'ability'));
    main.querySelectorAll('[data-edit-gear]').forEach(b => b.onclick = () => editGear(b.dataset.editGear));
    main.querySelectorAll('[data-delete-gear]').forEach(b => b.onclick = () => deleteItem('gear',b.dataset.deleteGear,'gear'));
    main.querySelectorAll('[data-delete-advance]').forEach(b => b.onclick = () => undoAdvance(b.dataset.deleteAdvance));
    main.querySelectorAll('[data-resource-delta]').forEach(b => b.onclick = () => adjustResource(b.dataset.resourceDelta,n(b.dataset.delta)));
    main.querySelectorAll('[data-resource-edit]').forEach(b => b.onclick = () => editSingleResource(b.dataset.resourceEdit,b.dataset.resourceEdit[0].toUpperCase()+b.dataset.resourceEdit.slice(1)));
  }

      'edit-resources':editResources,
      'edit-profile':editProfile,
      'edit-progression':editProgression,
      'edit-story':editStory,
      'edit-mission':editMission,
      'loadouts':openLoadoutManager,
      'hit-location-roll':rollHitLocation,

      'fate':()=>editSingleResource('fate','Fate Points'),
      'fatigue':()=>editSingleResource('fatigue','Fatigue'),
      'cohesion':()=>editSingleResource('cohesion','Cohesion'),

      'add-effect':addEffect,

  function newCharacter() {
    const c=createCharacter('New Battle-Brother');
    openBuilder(c,true);
  }

  function compendiumNames(category) {
    return state.compendium.filter(x=>x.category===category&&sourceEnabled(String(x.source||'Custom'))).map(x=>x.name).filter(Boolean).sort((a,b)=>a.localeCompare(b));
  }

  function datalist(id,values) { return `<datalist id="${id}">${[...new Set(values)].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`; }

  function openBuilder(character, isNew=false) {
    if(!character)return;
    const draft=structuredClone(character); let step=0;
    if(!draft.builder.packageAuto)draft.builder.packageAuto={Chapter:isNew,Speciality:isNew};
    if(!draft.builder.packageSelections)draft.builder.packageSelections={Chapter:'',Speciality:''};
    const steps=['Identity','Packages','Characteristics','Resources','Review'];
    const renderPackageCard=(type)=>{
      const identity=type==='Chapter'?draft.chapter:draft.speciality; const matches=packageEntries(type,identity);
      const chosen=matches.find(x=>x.id===draft.builder.packageSelections[type])||matches[0]||null; if(chosen)draft.builder.packageSelections[type]=chosen.id;
      const opts=matches.map(x=>`<option value="${esc(x.id)}" ${chosen?.id===x.id?'selected':''}>${esc(x.name)} — ${esc(x.source||'Custom')}</option>`).join('');
      const active=draft.packageApplications?.[type];
      return `<div class="list-item"><div class="item-title">${esc(type)} Package</div><div class="item-sub">${esc(identity||`${type} not selected`)}</div>${matches.length?`<div class="field" style="margin-top:10px"><label for="pkg_${type}">Librarium source</label><select class="select" id="pkg_${type}">${opts}</select></div><div class="section-note" style="margin-top:8px">${packageSummaryLines(chosen).map(esc).join('<br>')}</div><label class="checkbox-row" style="margin-top:10px"><input type="checkbox" id="auto_${type}" ${draft.builder.packageAuto[type]?'checked':''}> Apply and keep this package synchronized</label>`:`<div class="section-note" style="margin-top:8px">No enabled Librarium entry exactly matches this ${type.toLowerCase()}. Identity can still be saved as plain text.</div>`}${active?`<div class="source" style="margin-top:8px">Currently applied: ${esc(active.name)} — ${esc(active.source)}</div>`:''}</div>`;
    };
    const renderStep=()=>{
      modalTitle.textContent=isNew?'Build Battle-Brother':'Character Builder';
      const stepper=`<div class="stepper">${steps.map((x,i)=>`<div class="step-pill ${i===step?'active':''}">${i+1}. ${x}</div>`).join('')}</div>`;
      let body='';
      if(step===0){
        const chapters=compendiumNames('Chapter'); const specs=compendiumNames('Speciality');
        body=`${stepper}<div class="field-grid two">${field('Name','bName',draft.name)}<div class="field"><label for="bChapter">Chapter</label><input class="input" id="bChapter" list="chapterOptions" value="${esc(draft.chapter)}" placeholder="Type or choose from source packs">${datalist('chapterOptions',chapters)}</div><div class="field"><label for="bSpec">Speciality</label><input class="input" id="bSpec" list="specOptions" value="${esc(draft.speciality)}" placeholder="Type or choose from source packs">${datalist('specOptions',specs)}</div>${field('Rank','bRank',draft.rank)}${field('Squad Role','bRole',draft.squadRole)}${field('Personal Demeanour','bDem',draft.demeanour)}${field('Chapter Demeanour','bCDem',draft.chapterDemeanour)}</div><p class="section-note">Chapter and Speciality remain editable text. If a matching Librarium package exists, the next step can safely apply its structured effects.</p>`;
      } else if(step===1){
        body=`${stepper}<p class="section-note">Package effects are tracked separately from manual edits. Changing or disabling a synchronized package removes only its tracked modifiers/grants before applying the replacement.</p><div class="list">${renderPackageCard('Chapter')}${renderPackageCard('Speciality')}</div>`;
      } else if(step===2){
        body=`${stepper}<p class="section-note">Enter the final characteristic values from your table. Package modifiers are already reflected in these values when a package is synchronized.</p><div class="field-grid three">${CHAR_KEYS.map(k=>field(`${k} — ${CHAR_LABELS[k]}`,`bch_${k}`,draft.characteristics[k],'number','min="1" max="100" inputmode="numeric"')).join('')}</div>`;
      } else if(step===3){

  function resizeImage(file,maxSize) {

  }

  function libraryEntrySummary(x) {
    const d=x.data||{};
    if(x.category==='Weapon') return [d.class,d.damage&&`Dmg ${d.damage}`,d.pen&&`Pen ${d.pen}`,d.requisition&&`Req ${d.requisition}`].filter(Boolean).join(' • ');
    if(x.category==='Gear'||x.category==='Ammunition') return [d.gearType,d.requisition&&`Req ${d.requisition}`,d.renownReq&&`Renown ${d.renownReq}`].filter(Boolean).join(' • ');
    if(x.category==='Armour') return [d.armourType,d.bodyAP&&`Body AP ${d.bodyAP}`,d.requisition&&`Req ${d.requisition}`].filter(Boolean).join(' • ');
    if(x.category==='Skill') return [x.characteristic,d.skillType,d.defaultTraining!==undefined&&`Training ${n(d.defaultTraining)>=0?'+':''}${n(d.defaultTraining)}`].filter(Boolean).join(' • ');
    if(x.category==='Advance'){const a=normalizeAdvanceData(d);return `${a.cost} XP • ${a.pool}${a.tier?` • ${a.tier}`:''}`;}
    if(x.category==='Psychic Power') return [d.action,d.test,d.range].filter(Boolean).join(' • ');
    if(x.category==='Chapter'||x.category==='Speciality') return [d.role,d.keywords].filter(Boolean).join(' • ');
    return [d.subtype,d.keywords].filter(Boolean).join(' • ');
  }

  function cloneCompendiumEntry(id) {
    const src=state.compendium.find(x=>x.id===id);if(!src)return;
    const copy=structuredClone(src);copy.id=uid();copy.name=`${src.name} Copy`;copy.source=src.source||'Custom';state.compendium.push(normalizeCompendiumEntry(copy));saveState();showToast('Librarium entry cloned');openLibrarium(src.category,src.source||'All');
  }

  function addCompendiumToCharacter(id) {
    const entry=state.compendium.find(x=>x.id===id); if(!entry)return;
    const c=activeChar();
    if(entry.category==='Skill') { closeModal(); editSkill(null,{...entry,characteristic:entry.characteristic||entry.data?.characteristic||'Int'}); }
    else if(entry.category==='Weapon') { closeModal(); editWeapon(null,entry); }
    else if(entry.category==='Gear'||entry.category==='Ammunition') { closeModal(); editGear(null,entry); }
    else if(entry.category==='Chapter') { if(c){c.chapter=entry.name;saveState();closeModal();render();showToast('Chapter selected');} }
    else if(entry.category==='Speciality') { if(c){c.speciality=entry.name;saveState();closeModal();render();showToast('Speciality selected');} }
    else if(entry.category==='Advance') { closeModal(); showAdvanceDetails(entry.id); }
    else if(entry.category==='Armour') {
      if(!c)return; const d=entry.data||{};
      const apMap={'Head':d.headAP,'Body':d.bodyAP,'Left Arm':d.armAP,'Right Arm':d.armAP,'Left Leg':d.legAP,'Right Leg':d.legAP};
      c.armour.forEach(a=>{if(apMap[a.location]!==undefined&&apMap[a.location]!=='')a.ap=Math.max(0,n(apMap[a.location]));});
      c.armourNotes=[c.armourNotes,`${entry.name}${entry.notes?`: ${entry.notes}`:''}`].filter(Boolean).join('\n');saveState();closeModal();render();showToast(`${entry.name} applied`);
    }
    else if(entry.category==='Psychic Power') { closeModal(); editPsychicPower(null,entry); }
    else if(entry.category==='Power Armour History') { if(c){c.powerArmourHistory=[c.powerArmourHistory,`${entry.name}${entry.notes?`: ${entry.notes}`:''}`].filter(Boolean).join('\n');saveState();closeModal();render();showToast('Power armour history added');} }
    else if(['Ability','Talent','Trait'].includes(entry.category)) { closeModal(); editAbility(null,entry); } else { closeModal(); editAbility(null,entry); }
  }

    downloadJSON(`${safeName(name)}-deathwatch-source-pack.json`,{type:'deathwatch-companion-source-pack',version:VERSION,source:name,entries});showToast(`${name} exported`);

  function sourceManager() {
    const names=sourceNames();
    openModal('Source Packs', `${names.length?`<div class="list">${names.map(name=>`<div class="list-item"><div class="list-row"><label style="display:flex;gap:10px;align-items:center;flex:1"><input type="checkbox" data-source-toggle="${esc(name)}" ${sourceEnabled(name)?'checked':''}><div><div class="item-title">${esc(name)}</div><div class="item-sub">${state.compendium.filter(x=>(x.source||'Custom')===name).length} Librarium entries</div></div></label><div class="item-actions"><button class="btn small" data-open-source="${esc(name)}">Browse</button><button class="btn small" data-export-source="${esc(name)}">Export</button></div></div></div>`).join('')}</div>`:'<div class="empty">No source packs yet. Create an entry in the Data Librarium and give it a Source Pack / Book name.</div>'}<p class="section-note">Disabling a source hides its entries from builders, catalogues, and the default Librarium view. Existing character data is never deleted. Applied package effects remain on a character until you explicitly resynchronize or disable that package in the Character Builder.</p><div class="modal-actions"><button class="btn primary" data-new-entry>＋ New Librarium Entry</button></div>`,()=>{
      modalBody.querySelectorAll('[data-source-toggle]').forEach(box=>box.onchange=()=>{const name=box.dataset.sourceToggle;const set=new Set(state.settings.disabledSources||[]);box.checked?set.delete(name):set.add(name);state.settings.disabledSources=[...set];saveState();showToast(box.checked?`${name} enabled`:`${name} disabled`);});

  function characterManager() {
    const roster = state.characters.length
      ? state.characters.map(c=>`<div class="list-item"><div class="list-row"><div><div class="item-title">${esc(c.name)}</div><div class="item-sub">${esc([c.chapter,c.speciality,c.rank].filter(Boolean).join(' • '))}</div></div><div class="item-actions"><button class="btn small" data-open-char="${c.id}">Open</button><button class="btn small" data-dup-char="${c.id}">Duplicate</button><button class="btn small danger" data-delete-char-id="${c.id}">Delete</button></div></div></div>`).join('')
      : `<div class="empty">No Battle-Brothers in the Watch Fortress archive.</div>`;
    openModal('Characters', `<div class="list">${roster}</div><div class="modal-actions"><button class="btn primary" data-new>＋ New Character</button></div>`,()=>{
      modalBody.querySelectorAll('[data-open-char]').forEach(b=>b.onclick=()=>{state.activeId=b.dataset.openChar;saveState();closeModal();render();});
      modalBody.querySelectorAll('[data-dup-char]').forEach(b=>b.onclick=()=>duplicateCharacter(b.dataset.dupChar));
      modalBody.querySelectorAll('[data-delete-char-id]').forEach(b=>b.onclick=()=>{
        const c = state.characters.find(x=>x.id===b.dataset.deleteCharId);
