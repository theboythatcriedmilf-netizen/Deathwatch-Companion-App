e.","playstyle":"Official Deathwatch rules exist in Rites of Battle. This app supplies the visual/lore package and an editable rules slot until those pages are added.","source":"Rites of Battle — official supplement confirmed","page":"","colors":["#d5a514","#171717","#a51d21"],"glyph":"fist"},{"id":"iron-hands","name":"Iron Hands","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter shaped by the belief that weakness of flesh should be overcome through discipline and augmentation.","playstyle":"Official Deathwatch rules exist in First Founding. The visual and lore package is ready; exact mechanics remain editable until the owned supplement rules are supplied.","source":"First Founding — official supplement confirmed","page":"","colors":["#111213","#9da3a6","#e8e8e4"],"glyph":"hand"},{"id":"salamanders","name":"Salamanders","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter known for stoicism, craftsmanship, endurance, and an unusually strong concern for ordinary Imperial citizens.","playstyle":"Official Deathwatch rules exist in First Founding. This profile is visually complete and mechanically editable pending source pages.","source":"First Founding — official supplement confirmed","page":"","colors":["#287a38","#101111","#d8b447"],"glyph":"flame"},{"id":"white-scars","name":"White Scars","rules":"supplement-pending","mods":{},"demeanour":"Supplement rules not loaded","solo":"Supplement rules not loaded","restrictions":[],"summary":"A First Founding Chapter associated with speed, independent judgement, rapid manoeuvre, and fluid warfare.","playstyle":"Official Deathwatch rules exist in First Founding. This profile is visually complete and mechanically editable pending source pages.","source":"First Founding — official supplement confirmed","page":"","colors":["#ecebea","#bc2026","#191919"],"glyph":"bolt"},{"id":"custom","name":"Custom / Successor Chapter","rules":"custom","mods":{},"demeanour":"Custom","solo":"Custom","restrictions":[],"summary":"A homebrew or successor Chapter. Use the editor to define modifiers, restrictions, identity, and abilities without overwriting canonical records.","playstyle":"Use this when adapting Rites of Battle custom-Chapter rules or your own campaign material.","source":"Homebrew / user source","page":"","colors":["#424a50","#d7d0bf","#7b3136"],"glyph":"star"}],"supportedChapters":["black-templars","blood-angels","dark-angels","space-wolves","storm-wardens","ultramarines","raven-guard"],"specialities":[{"id":"apothecary","name":"Apothecary","role":"Battlefield medic and guardian of gene-seed","summary":"Keeps Battle-Brothers functioning, treats injury, studies biology, and safeguards the Chapter’s genetic legacy.","startingSkills":["Medicae"],"abilities":[["Guardian of Purity","While the Apothecary has access to his narthecium, every Space Marine in the Kill-team reduces Corruption Points suffered by 2, to a minimum of 1."],["Create Toxins","Once per day, spend one hour with a tissue sample and narthecium to prepare a toxin. During the next combat, Squad Mode Battle-Brothers’ attacks gain Toxic against that enemy type for rounds equal to the Apothecary’s Intelligence Bonus; Daemonic creatures are unaffected."],["Enhance Healing","Every successful Medicae Test used for First Aid restores an additional 1d5 Wounds."]],"source":"Core Rulebook","page":"68"},{"id":"assault","name":"Assault Marine","role":"Highly mobile close-action specialist","summary":"Excels at rapid movement, closing distance, breaking static fights, and reaching objectives other characters may struggle to access.","startingSkills":["Pilot"],"abilities":[["Wings of Angels","Solo Mode. Pass a Challenging (+0) Pilot (Personal) Test to add 20 metres to jump-pack movement; if used as part of a Charge, add 1d5 Damage to the resulting melee attacks."],["Wrathful Descent","Squad Mode. After a successful melee attack made as part of a Charge against a Horde, inflict an additional 1d10 Magnitude damage."]],"source":"Core Rulebook","page":"72"},{"id":"devastator","name":"Devastator Marine","role":"Heavy-support and fire-control specialist","summary":"Anchors the team, controls lanes and positions, and specialises in sustained battlefield support.","startingSkills":[],"abilities":[["Immovable Warrior","Solo Mode. While wielding a Heavy weapon and behind cover, gain the Sturdy Trait and +10 to Ballistic Skill Tests."],["Unrelenting Devastation","Squad Mode. Each Heavy-weapon hit inflicts +1 Horde Magnitude; if the weapon has Blast, inflict 1d5 extra Magnitude after resolving the other hits."]],"source":"Core Rulebook","page":"76"},{"id":"librarian","name":"Librarian","role":"Battle-psyker, scholar, and psychic support","summary":"Combines Space Marine training with psychic disciplines. Tracks Psy Rating, Focus Power Tests, sustained effects, and psychic risk.","startingSkills":["Psyniscience"],"abilities":[["Battle-Psyker","Begins with Psy Rating 3 and selects three starting psychic techniques."]],"psyRating":3,"source":"Core Rulebook","page":"80"},{"id":"tactical","name":"Tactical Marine","role":"Versatile line leader and all-rounder","summary":"The broadest battlefield role. Tactical Marines are adaptable, objective-focused, and well suited to coordinating a Kill-team.","startingSkills":[],"abilities":[["Bolter Mastery","Solo Mode. Gain +10 to Ballistic Skill Tests and +2 Damage whenever firing a Bolt weapon."],["Tactical Expertise","Squad Mode. When initiating one of your Chapter Squad Mode abilities, a successful Command Test lets Kill-team members use it as though they belonged to your Chapter: Hard (–20), becoming Challenging (+0) at Rank 3 and Routine (+20) at Rank 7."]],"source":"Core Rulebook","page":"84"},{"id":"techmarine","name":"Techmarine","role":"Engineer, artificer, and machine specialist","summary":"Handles technology, repairs, fortification, cybernetics, and complex machinery while serving as the Chapter’s link to the Cult Mechanicus.","startingSkills":["Speak Language","Tech-Use"],"abilities":[["Improve Cover","Full Action. Add Armour Points equal to the Techmarine’s unmodified Intelligence Bonus to one piece of cover."],["Blessed by the Omnissiah","At creation the Techmarine gains the Mechanicus Implants Trait, Electro-Graft Use, and Mechadendrite Use (Servo-Arm)."]],"source":"Core Rulebook","page":"88"}],"skills":[{"id":"skill-acrobatics","name":"Acrobatics","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Movement","summary":"Perform difficult feats of balance, tumbling, controlled falls, leaps, and agile movement that go beyond ordinary mobility.","source":"Core Rulebook","page":"92–107"},{"id":"skill-awareness","name":"Awareness","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Notice nearby movement, sounds, hazards, concealed figures, or other details that could be missed. It is the general immediate-perception Skill.","source":"Core Rulebook","page":"92–107"},{"id":"skill-carouse","name":"Carouse","category":"Skill","characteristic":"T","skillType":"Basic","descriptor":"","summary":"Endure intoxicants and similar ingested effects without becoming impaired. Tests usually resist the physical consequences rather than represent social drinking.","source":"Core Rulebook","page":"92–107"},{"id":"skill-charm","name":"Charm","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Improve another character’s attitude through friendliness, persuasion, courtesy, or social appeal. The GM may oppose it when the target actively resists.","source":"Core Rulebook","page":"92–107"},{"id":"skill-chem-use","name":"Chem-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation","summary":"Safely identify, prepare, handle, or analyse chemicals, compounds, toxins, medicines, and related substances within the fictional setting; exact applications depend on available equipment and the GM.","source":"Core Rulebook","page":"92–107"},{"id":"skill-ciphers","name":"Ciphers","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand or use a particular coded language, shorthand, symbol system, or formal cipher group known to the character.","source":"Core Rulebook","page":"92–107"},{"id":"skill-climb","name":"Climb","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Ascend or descend difficult surfaces when success is uncertain. The GM sets difficulty from the surface, conditions, equipment, and pressure of the scene.","source":"Core Rulebook","page":"92–107"},{"id":"skill-command","name":"Command","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Direct, organise, rally, or impose discipline on subordinates and allied forces. It is commonly used when leadership itself determines whether others follow through.","source":"Core Rulebook","page":"92–107"},{"id":"skill-concealment","name":"Concealment","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"","summary":"Hide yourself or another subject from observation by using cover, terrain, darkness, camouflage, or careful positioning.","source":"Core Rulebook","page":"92–107"},{"id":"skill-contortionist","name":"Contortionist","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"Escape restraints, squeeze through confined spaces, or manipulate your body through unusually tight or awkward positions.","source":"Core Rulebook","page":"92–107"},{"id":"skill-deceive","name":"Deceive","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Interaction","summary":"Mislead another character through lies, false impressions, disguise-supported claims, or deliberate misdirection.","source":"Core Rulebook","page":"92–107"},{"id":"skill-demolition","name":"Demolition","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Crafting","summary":"Employ, place, analyse, or defuse set explosive charges when the fiction calls for the Demolition Skill. Complex tasks may be Extended Tests.","source":"Core Rulebook","page":"98"},{"id":"skill-dodge","name":"Dodge","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Combat","summary":"React to an incoming attack or sudden physical danger when the rules allow a Dodge reaction. Training improves reliability but does not create extra reactions by itself.","source":"Core Rulebook","page":"92–107"},{"id":"skill-drive","name":"Drive","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Operator, Group","summary":"Operate a chosen class of ground, hover/skimmer, or walker vehicle. Each Drive group is trained separately.","source":"Core Rulebook","page":"98"},{"id":"skill-evaluate","name":"Evaluate","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Estimate the value, quality, rarity, or likely worth of an object using knowledge and careful inspection.","source":"Core Rulebook","page":"92–107"},{"id":"skill-gamble","name":"Gamble","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Resolve games of chance or wagering inside the fictional setting when the outcome depends on a character’s judgement, nerve, or reading of the game rather than a simple random result.","source":"Core Rulebook","page":"92–107"},{"id":"skill-inquiry","name":"Inquiry","category":"Skill","characteristic":"Fel","skillType":"Basic","descriptor":"Investigation","summary":"Gather information from people over time by asking questions, following rumours, and finding useful contacts rather than interrogating a single target.","source":"Core Rulebook","page":"92–107"},{"id":"skill-interrogation","name":"Interrogation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Investigation","summary":"Extract information from a resistant subject through sustained questioning and psychological pressure. The game treats this as an extended social Skill rather than a quick conversation.","source":"Core Rulebook","page":"92–107"},{"id":"skill-intimidate","name":"Intimidate","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Interaction","summary":"Coerce or frighten another character into compliance through presence, threats, or a display of force. The relevant Characteristic can vary with the approach at the GM’s discretion.","source":"Core Rulebook","page":"92–107"},{"id":"skill-invocation","name":"Invocation","category":"Skill","characteristic":"WP","skillType":"Advanced","descriptor":"Psychic","summary":"Prepare the mind and focus psychic discipline before attempting difficult psychic activity when the rules permit it.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lip-reading","name":"Lip Reading","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"","summary":"Understand speech by observing a speaker’s mouth when the words cannot be heard clearly.","source":"Core Rulebook","page":"92–107"},{"id":"skill-literacy","name":"Literacy","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Read and write languages the character knows, including difficult documents, formal records, and written communications.","source":"Core Rulebook","page":"92–107"},{"id":"skill-logic","name":"Logic","category":"Skill","characteristic":"Int","skillType":"Basic","descriptor":"Investigation","summary":"Solve problems through deduction, mathematics, pattern recognition, codes, puzzles, and structured reasoning.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-common","name":"Lore: Common","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall broadly available knowledge about a chosen Common Lore field. Each Lore is a separate area of expertise.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-forbidden","name":"Lore: Forbidden","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall dangerous, proscribed, secret, or highly restricted knowledge in a chosen Forbidden Lore field. Possessing such knowledge can matter narratively even when a Test succeeds.","source":"Core Rulebook","page":"92–107"},{"id":"skill-lore-scholastic","name":"Lore: Scholastic","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Investigation, Group","summary":"Recall formal academic, historical, scientific, theological, or institutional knowledge in a chosen Scholastic Lore field.","source":"Core Rulebook","page":"92–107"},{"id":"skill-medicae","name":"Medicae","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Diagnose injury or illness and perform the game’s medical actions, including First Aid and longer-term treatment when appropriate equipment and time are available.","source":"Core Rulebook","page":"92–107"},{"id":"skill-navigation","name":"Navigation","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Determine location and plot a route across a planetary surface or through a stellar environment. Longer routes can represent hours of planning rather than a single moment.","source":"Core Rulebook","page":"92–107"},{"id":"skill-performer","name":"Performer","category":"Skill","characteristic":"Fel","skillType":"Advanced","descriptor":"Group","summary":"Entertain or influence an audience through a chosen performance form such as music, singing, storytelling, or dance.","source":"Core Rulebook","page":"92–107"},{"id":"skill-pilot","name":"Pilot","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"Operator, Group","summary":"Control jump packs, aircraft, small spacecraft, or other flying craft when unusual conditions, hazards, or contested manoeuvres require a Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-psyniscience","name":"Psyniscience","category":"Skill","characteristic":"Per","skillType":"Advanced","descriptor":"Psychic","summary":"Sense psychic activity, disturbances in the Warp, daemonic presence, or other unusual immaterial phenomena. It detects signs and disturbances rather than automatically explaining them.","source":"Core Rulebook","page":"92–107"},{"id":"skill-scrutiny","name":"Scrutiny","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Judge motives, behaviour, authenticity, or subtle inconsistencies in a person, object, or situation through close observation.","source":"Core Rulebook","page":"92–107"},{"id":"skill-search","name":"Search","category":"Skill","characteristic":"Per","skillType":"Basic","descriptor":"","summary":"Conduct a deliberate examination of an area or object to locate hidden, concealed, or easily overlooked details. Unlike Awareness, this normally represents active searching.","source":"Core Rulebook","page":"92–107"},{"id":"skill-security","name":"Security","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Bypass, defeat, or analyse locks and security systems in the fictional setting when the character has suitable access and tools; the Companion keeps this at tabletop abstraction rather than real-world procedure.","source":"Core Rulebook","page":"92–107"},{"id":"skill-shadowing","name":"Shadowing","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Follow a person or group without being noticed, usually over time and through changing terrain or crowds.","source":"Core Rulebook","page":"92–107"},{"id":"skill-silent-move","name":"Silent Move","category":"Skill","characteristic":"Ag","skillType":"Basic","descriptor":"Movement","summary":"Move quietly enough to avoid detection. Environmental noise, armour, surface material, speed, and observers can modify the Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-sleight-of-hand","name":"Sleight of Hand","category":"Skill","characteristic":"Ag","skillType":"Advanced","descriptor":"","summary":"Perform subtle manual tricks such as palming, planting, concealing, or manipulating small objects without drawing attention.","source":"Core Rulebook","page":"92–107"},{"id":"skill-speak-language","name":"Speak Language","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Understand and communicate in a specific known language. Each language or language group is recorded separately.","source":"Core Rulebook","page":"92–107"},{"id":"skill-survival","name":"Survival","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate in hostile wilderness: find shelter, read natural conditions, locate basic necessities, and endure environmental exposure when the situation calls for a Test.","source":"Core Rulebook","page":"92–107"},{"id":"skill-swim","name":"Swim","category":"Skill","characteristic":"S","skillType":"Basic","descriptor":"Movement","summary":"Move through difficult water or remain afloat when conditions make ordinary swimming uncertain or exhausting.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tactics","name":"Tactics","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Group","summary":"Apply formal battlefield knowledge in a chosen tactical field to interpret a situation, anticipate likely developments, or identify a useful strategic approach.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tech-use","name":"Tech-Use","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Operate, diagnose, repair, or understand advanced technology within the fictional setting when ordinary use is insufficient. Complex work may require time, tools, or multiple Tests.","source":"Core Rulebook","page":"92–107"},{"id":"skill-tracking","name":"Tracking","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Follow signs left by a creature, person, or vehicle and interpret a trail’s direction, age, and condition when evidence is available.","source":"Core Rulebook","page":"92–107"},{"id":"skill-trade","name":"Trade","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"Crafting, Group","summary":"Perform a chosen professional craft or technical vocation. Each Trade is its own trained field and may cover creating, repairing, or evaluating work in that profession.","source":"Core Rulebook","page":"92–107"},{"id":"skill-wrangling","name":"Wrangling","category":"Skill","characteristic":"Int","skillType":"Advanced","descriptor":"","summary":"Handle, calm, direct, or manage animals and similar creatures in the fictional setting when they are difficult, frightened, or resistant.","source":"Core Rulebook","page":"92–107"}],"talents":[{"id":"tal-0","name":"Ambidextrous","category":"Talent","summary":"The Battle-Brother is equally trained with either hand, removing the normal off-hand limitation in situations where the rules care about handedness.","source":"Core Rulebook","page":"108–129"},{"id":"tal-1","name":"Astartes Weapons Training","category":"Talent","summary":"A baseline Space Marine combat-training Talent. Detailed weapon-use guidance is not reproduced in this app.","source":"Core Rulebook","page":"108–129"},{"id":"tal-2","name":"Bulging Biceps","category":"Talent","summary":"Represents superhuman musculature and exceptional physical power; it interacts with some equipment and heavy-load rules.","source":"Core Rulebook","page":"108–129"},{"id":"tal-3","name":"Heightened Senses (Hearing)","category":"Talent","summary":"Grants the game’s heightened-sense benefit when hearing is relevant.","source":"Core Rulebook","page":"108–129"},{"id":"tal-4","name":"Heightened Senses (Sight)","category":"Talent","summary":"Grants the game’s heightened-sense benefit when vision is relevant.","source":"Core Rulebook","page":"108–129"},{"id":"tal-5","name":"Killing Strike","category":"Talent","summary":"A combat Talent tied to the exceptional lethality of Astartes training; consult the owned source for its attack-specific procedure.","source":"Core Rulebook","page":"108–129"},{"id":"tal-6","name":"Nerves of Steel","category":"Talent","summary":"Improves resistance to Pinning and allows recovery from suppression more reliably.","source":"Core Rulebook","page":"108–129"},{"id":"tal-7","name":"Quick Draw","category":"Talent","summary":"Lets the character ready carried equipment more quickly when the action economy matters.","source":"Core Rulebook","page":"108–129"},{"id":"tal-8","name":"Resistance (Psychic Powers)","category":"Talent","summary":"Provides a bonus on Tests made to resist hostile psychic effects.","source":"Core Rulebook","page":"108–129"},{"id":"tal-9","name":"True Grit","category":"Talent","summary":"Reduces the severity of Critical Damage by using the character’s Toughness Bonus more effectively.","source":"Core Rulebook","page":"108–129"},{"id":"tal-10","name":"Unarmed Master","category":"Talent","summary":"Represents extensive Astartes training when fighting without carried equipment.","source":"Core Rulebook","page":"108–129"},{"id":"tal-11","name":"Deathwatch Training","category":"Talent","summary":"Represents specialist hypno-conditioning and preparation for fighting xenos threats.","source":"Core Rulebook","page":"108–129"},{"id":"tal-fearless","name":"Fearless","category":"Talent","summary":"Immune to Fear and Pinning, but backing away from a fight can require a Willpower Test.","source":"Core Rulebook","page":"118"},{"id":"tal-sprint","name":"Sprint","category":"Talent","summary":"Improves maximum movement when the character commits to running.","source":"Core Rulebook","page":"126"},{"id":"tal-hard-target","name":"Hard Target","category":"Talent","summary":"Moving rapidly makes the character harder to hit with ranged attacks in the tabletop rules.","source":"Core Rulebook","page":"120"},{"id":"tal-hardy","name":"Hardy","category":"Talent","summary":"Improves natural recovery and resistance to lingering injury.","source":"Core Rulebook","page":"120"},{"id":"tal-lightning-reflexes","name":"Lightning Reflexes","category":"Talent","summary":"Improves Initiative by allowing the character to use a stronger Agility contribution.","source":"Core Rulebook","page":"122"},{"id":"tal-light-sleeper","name":"Light Sleeper","category":"Talent","summary":"The character remains unusually alert while resting and can react more readily to danger.","source":"Core Rulebook","page":"122"},{"id":"tal-master-chirurgeon","name":"Master Chirurgeon","category":"Talent","summary":"Represents exceptional medical expertise and improves difficult Medicae work.","source":"Core Rulebook","page":"123"},{"id":"tal-paranoia","name":"Paranoia","category":"Talent","summary":"The character is habitually alert for danger, improving readiness at the cost of a suspicious outlook.","source":"Core Rulebook","page":"124"},{"id":"tal-polyglot","name":"Polyglot","category":"Talent","summary":"Makes unfamiliar languages easier to interpret and communicate across.","source":"Core Rulebook","page":"124"},{"id":"tal-rapid-reaction","name":"Rapid Reaction","category":"Talent","summary":"Gives the character a chance to act even when surprised.","source":"Core Rulebook","page":"125"},{"id":"tal-talented","name":"Talented","category":"Talent","summary":"Grants a +10 bonus to one selected Skill, representing exceptional aptitude.","source":"Core Rulebook","page":"127"},{"id":"tal-total-recall","name":"Total Recall","category":"Talent","summary":"Allows extremely precise memory of details the character has previously encountered.","source":"Core Rulebook","page":"128"},{"id":"tal-unshakeable-faith","name":"Unshakeable Faith","category":"Talent","summary":"Improves recovery from failed Fear Tests by allowing a reroll.","source":"Core Rulebook","page":"128"},{"id":"tal-exemplar","name":"Exemplar of Honour","category":"Talent","summary":"May spend a Fate Point as a Free Action to restore Cohesion equal to Fellowship Bonus, once per Round.","source":"Core Rulebook","page":"118"},{"id":"tal-wisdom","name":"Wisdom of the Ancients","category":"Talent","summary":"Represents the ability to draw on long service and accumulated lore in ways that support the Kill-team.","source":"Core Rulebook","page":"129"}],"traits":[{"id":"trait-us","name":"Unnatural Strength (x2)","category":"Trait","summary":"Doubles the character’s Strength Bonus. This is already part of the normal Astartes baseline and should not be added again by individual implants.","effects":{"bonusMultiplier":{"S":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-ut","name":"Unnatural Toughness (x2)","category":"Trait","summary":"Doubles the character’s Toughness Bonus. This is already part of the normal Astartes baseline and should not be double-counted from implants.","effects":{"bonusMultiplier":{"T":2}},"source":"Core Rulebook","page":"136"},{"id":"trait-dark","name":"Dark Sight","category":"Trait","summary":"Allows vision in darkness without the normal penalty, subject to the exact limits of the trait.","source":"Core Rulebook","page":"132"},{"id":"trait-autostab","name":"Auto-stabilised","category":"Trait","summary":"A creature or system with this Trait counts as braced and gains action-economy benefits for certain heavy-equipment rules.","source":"Core Rulebook","page":"130"},{"id":"trait-armourplating","name":"Armour Plating","category":"Trait","summary":"Adds +2 Armour Points to all locations for a creature with natural or integrated plating.","source":"Core Rulebook","page":"130"},{"id":"trait-brutal","name":"Brutal Charge","category":"Trait","summary":"Adds extra damage when the creature charges during the same round.","source":"Core Rulebook","page":"131"},{"id":"trait-fear","name":"Fear (X)","category":"Trait","summary":"For non-Astartes and appropriate NPCs, Fear rating sets the difficulty of Fear Tests. For Battle-Brothers it can instead threaten Cohesion.","source":"Core Rulebook","page":"132"},{"id":"trait-size","name":"Size","category":"Trait","summary":"Changes movement, concealment, and how easy the creature is to hit. Power-armoured Astartes are Hulking but Black Carapace removes the usual enemy hit bonus.","source":"Core Rulebook","page":"134"},{"id":"trait-touched","name":"Touched by the Fates (X)","category":"Trait","summary":"Gives important NPCs a limited pool of Fate-like resources.","source":"Core Rulebook","page":"135"},{"id":"trait-unnatural-senses","name":"Unnatural Senses","category":"Trait","summary":"Allows perception beyond normal senses out to a listed range.","source":"Core Rulebook","page":"136"},{"id":"trait-unnatural-speed","name":"Unnatural Speed","category":"Trait","summary":"Substantially increases movement for creatures whose speed exceeds normal limits.","source":"Core Rulebook","page":"136"}],"implants":[{"id":"implant-0","name":"Secondary Heart","category":"Implant","summary":"Contributes to the Astartes Unnatural Strength and Unnatural Toughness baseline; it does not add a second independent modifier.","source":"Core Rulebook","page":"36–37"},{"id":"implant-1","name":"Ossmodula","category":"Implant","summary":"One of the implants responsible for the Unnatural Toughness (x2) Trait already present on the character.","source":"Core Rulebook","page":"36–37"},{"id":"implant-2","name":"Biscopea","category":"Implant","summary":"One of the implants responsible for the Unnatural Strength (x2) Trait already present on the character.","source":"Core Rulebook","page":"36–37"},{"id":"implant-3","name":"Haemastamen","category":"Implant","summary":"Supports the superhuman Strength and Toughness baseline; its benefit is already represented by starting Traits.","source":"Core Rulebook","page":"36–37"},{"id":"implant-4","name":"Larraman's Organ","category":"Implant","summary":"The Battle-Brother normally ignores Blood Loss and has True Grit; unusual effects can bypass this protection.","source":"Core Rulebook","page":"36–37"},{"id":"implant-5","name":"Catalepsean Node","category":"Implant","summary":"Removes normal Perception-based penalties for remaining awake for extended periods.","source":"Core Rulebook","page":"36–37"},{"id":"implant-6","name":"Preomnor","category":"Implant","summary":"Improves resistance to ingested poisons and unusual food-borne hazards.","source":"Core Rulebook","page":"36–37"},{"id":"implant-7","name":"Omophagea","category":"Implant","summary":"Can provide fragmentary information or temporary familiarity after consuming a biological sample, subject to GM judgement.","source":"Core Rulebook","page":"36–37"},{"id":"implant-8","name":"Multi-lung","category":"Implant","summary":"Improves survival in hostile atmospheres and allows rerolls against drowning or asphyxiation-type hazards.","source":"Core Rulebook","page":"36–37"},{"id":"implant-9","name":"Occulobe","category":"Implant","summary":"Provides the Astartes heightened visual capability represented by Heightened Senses (Sight).","source":"Core Rulebook","page":"36–37"},{"id":"implant-10","name":"Lyman's Ear","category":"Implant","summary":"Provides enhanced hearing and balance, represented in part by Heightened Senses (Hearing).","source":"Core Rulebook","page":"36–37"},{"id":"implant-11","name":"Sus-an Membrane","category":"Implant","summary":"Allows voluntary suspended animation after appropriate preparation or trauma conditions.","source":"Core Rulebook","page":"36–37"},{"id":"implant-12","name":"Melanochrome","category":"Implant","summary":"Allows the body to adapt pigmentation in response to harmful radiation and solar exposure.","source":"Core Rulebook","page":"36–37"},{"id":"implant-13","name":"Oolitic Kidney","category":"Implant","summary":"Improves resistance to poisons and toxins and works with the implanted biological filtration systems.","source":"Core Rulebook","page":"36–37"},{"id":"implant-14","name":"Neuroglottis","category":"Implant","summary":"Provides extraordinary chemical and biological sensory analysis and can assist identification/tracking in the fiction.","source":"Core Rulebook","page":"36–37"},{"id":"implant-15","name":"Mucranoid","category":"Implant","summary":"Improves survival in extreme heat and cold after appropriate biological activation.","source":"Core Rulebook","page":"36–37"},{"id":"implant-16","name":"Betcher's Gland","category":"Implant","summary":"Provides a fictional implanted biological capability; detailed offensive use is not reproduced in this app.","source":"Core Rulebook","page":"36–37"},{"id":"implant-17","name":"Progenoids","category":"Implant","summary":"The Chapter’s gene-seed legacy. An Apothecary can recover progenoid material under the game’s Medicae rules.","source":"Core Rulebook","page":"36–37"},{"id":"implant-18","name":"Black Carapace","category":"Implant","summary":"Interfaces the Battle-Brother directly with power armour and removes the normal enemy hit bonus that would otherwise result from his Hulking size.","source":"Core Rulebook","page":"36–37"}],"armours":[{"id":"power-armour","name":"Mark VII “Aquila” Power Armour","category":"Armour","ap":{"Head":8,"Body":10,"Left Arm":8,"Right Arm":8,"Left Leg":8,"Right Leg":8},"summary":"Standard Astartes power armour: sealed protection, strength assistance, auto-senses, life support, vox, bio-monitoring, and many integrated systems.","effects":[["Characteristic","Strength +20 while worn"],["Movement","Treat Agility Bonus as +1 higher for movement"],["Auto-senses","Sensory assistance and protected sight/hearing"],["Bio-monitor","+10 to resist Toxic-style poison effects; tracks pain-suppressor doses"],["Size","Counts as Hulking, but Black Carapace removes the normal enemy hit bonus"],["Fine manipulation","Delicate manual tasks can suffer -10 unless equipment is Astartes-scaled"]],"source":"Core Rulebook","page":"160–163"},{"id":"artificer-armour","name":"Astartes Artificer Armour","category":"Armour","ap":{},"summary":"Rare master-crafted power armour awarded to exceptional heroes. It incorporates the standard Astartes systems and a stronger machine spirit.","effects":[["Craftsmanship","Always Master-Crafted"],["History","Roll twice for Power Armour History"],["Interface","Advanced helmet includes an MIU"]],"source":"Core Rulebook","page":"163"},{"id":"scout-armour","name":"Astartes Scout Armour","category":"Armour","ap":{},"summary":"Lighter carapace-based protection designed for stealth, reconnaissance, and skirmishing.","effects":[["Concealment","+10 to Concealment Tests"],["Stealth","Does not impose the normal AP-based Concealment/Silent Move penalty"]],"source":"Core Rulebook","page":"163"},{"id":"terminator-armour","name":"Astartes Terminator Armour","category":"Armour","ap":{},"summary":"Extremely rare Tactical Dreadnought armour reserved for veteran deployment on the most dangerous missions.","effects":[["Characteristic","Strength +30 instead of normal power-armour +20"],["Trait","Grants Auto-stabilised"],["Protection","Built-in field-like protection rated 35 with no overload"],["Movement","Cannot Run; Agility -20; cannot Dodge"],["Support Range","Multiple suits can improve effective Rank for Support Range"]],"source":"Core Rulebook","page":"164"},{"id":"deathwatch-scout-armour","name":"Deathwatch Scout Armour","category":"Armour","ap":{},"summary":"A lightweight non-powered infiltration suit developed for Deathwatch Scout operations. The supplied sources present two AP summaries, so this build preserves both rather than silently choosing one.","effects":[["Table 3-6","AP 6 to Arms, Body and Legs; 30 kg; Requisition N/A"],["Component rules","Ceramite plates AP 7 Body/Arms; body glove AP 5 Legs"],["Body Glove","+10 Toughness Tests against contact poisons, radiation, acids or chemicals"],["Obfuscation","Technological detection using auto-senses, auspex or augur suffers –10 Tech-Use or Scrutiny"],["Scout Vox","Encrypted 35 km voice/data vox, extendable by relays"],["Interlocutor Beacon","10 km encrypted identification/distress beacon"],["Auto-injector","+5 Toxic/poison resistance Tests; 2 pain-suppressor doses; automatic stimulant response to Stun"]],"source":"Expanded Wargear p.142–143 & table p.147"}],"cybernetics":[{"id":"cyb-limb","name":"Bionic Limb","category":"Cybernetic","summary":"Replaces a lost limb. Higher-quality versions can provide improved physical performance in appropriate tests.","source":"Core Rulebook","page":"177"},{"id":"cyb-locomotion","name":"Bionic Locomotion","category":"Cybernetic","summary":"Integrated locomotion systems restore movement; exceptional versions grant Sprint and +20 on jumping/leaping Tests.","source":"Core Rulebook","page":"178"},{"id":"cyb-resp","name":"Bionic Respiratory System","category":"Cybernetic","summary":"Common versions grant +20 to Toughness Tests against airborne toxins and gas; exceptional versions can function as full life support.","source":"Core Rulebook","page":"178"},{"id":"cyb-senses","name":"Cybernetic Senses","category":"Cybernetic","summary":"Replaces damaged senses. Exceptional versions grant the relevant Heightened Senses Talent and +20 to resist attacks against that sense.","source":"Core Rulebook","page":"178"},{"id":"cyb-miu","name":"Mind Impulse Unit (MIU)","category":"Cybernetic","summary":"Allows direct interface with compatible technology. Common systems grant +10 to relevant Tech-Use, Pilot, or Drive Tests while linked.","source":"Core Rulebook","page":"178"},{"id":"cyb-augur","name":"Augur Array","category":"Cybernetic","summary":"Integrated scanning equipment used for sensor and detection tasks within its game-defined capabilities.","source":"Core Rulebook","page":"177"},{"id":"cyb-mechadendrite","name":"Mechadendrite","category":"Cybernetic","summary":"A Techmarine-style mechanical appendage. Different patterns perform technical, utility, or medical functions.","source":"Core Rulebook","page":"177"}],"psychic":[{"name":"Astrotelepathy","discipline":"Telepathy","action":"Full (variable)","opposed":false,"range":"PR 1–3 same system · 4–6 same sub-sector · 7–9 same sector · 10+ adjacent sector","sustained":false,"effect":"Send a psychic message using Willpower for the Focus Power Test. Requires at least one Telepathy power. Activation takes one full round per 10 words or per image; intended recipients are normally Astropaths or Librarians.","source":"Core Rulebook p.190","xp":500,"prereq":"One or more Telepathic powers"},{"name":"Compel","discipline":"Telepathy","action":"Full","opposed":true,"range":"5m × PR","sustained":false,"effect":"Affects up to PR targets. Each must follow one simple command achievable in a single round. A potentially suicidal command gives the target +20 WP to resist.","source":"Core Rulebook p.190","xp":1000,"prereq":"WP 40+"},{"name":"Dominate","discipline":"Telepathy","action":"Full","opposed":true,"range":"10m × PR","sustained":true,"effect":"Controls one target whose total Wounds are less than 3 × PR. The psyker divides Actions between himself and the target; the target uses its own Characteristics at –10. Suicidal orders allow another Opposed WP test.","source":"Core Rulebook p.190","xp":1000,"prereq":"Compel, WP 50+"},{"name":"Inspire","discipline":"Telepathy","action":"Half","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Up to PR targets immediately overcome Pinning and gain +10 resistance against Fear while they remain in range and the power is sustained.","source":"Core Rulebook p.190","xp":500,"prereq":"—"},{"name":"Long-range Telepathy","discipline":"Telepathy","action":"Free","opposed":false,"range":"50km × PR","sustained":true,"effect":"Functions as Short-range Telepathy at greatly extended range. Once learned, Short- and Long-range Telepathy do not invoke Psychic Phenomena unless used at Push. Sustaining is a Free Action.","source":"Core Rulebook p.191","xp":750,"prereq":"WP 40+"},{"name":"Mind Probe","discipline":"Telepathy","action":"Extended (5)","opposed":true,"range":"1m × PR","sustained":true,"modifier":"–20 if performed without target knowledge; cannot Push in that case","effect":"Reads increasingly deep information from one mind based on effective PR. PR can be traded to reduce activation time, to a minimum of one round.","source":"Core Rulebook p.191","xp":750,"prereq":"Mind Scan"},{"name":"Mind Scan","discipline":"Telepathy","action":"Half","opposed":false,"range":"200m × PR","sustained":false,"effect":"Detects and identifies sentient minds within range even without line of sight. Information quality scales with PR. Psychically inert creatures are invisible; resistant targets may receive secret Opposed WP tests.","source":"Core Rulebook p.191","xp":500,"prereq":"Long-range Telepathy"},{"name":"Short-range Telepathy","discipline":"Telepathy","action":"Free","opposed":false,"range":"50m × PR","sustained":true,"modifier":"–20 without a shared language","effect":"Sends thoughts to up to PR selected targets or broadcasts to every mind in range. Unwilling targets may resist with an Opposed WP test. Sustaining is a Free Action.","source":"Core Rulebook p.191","xp":500,"prereq":"—"},{"name":"Augury","discipline":"Divination","action":"Extended (10)","opposed":false,"range":"Special","sustained":false,"effect":"Reads the Emperor’s Tarot for a specific subject and question. The detail of the omen scales with PR and remains subject to GM interpretation.","source":"Core Rulebook p.192","xp":500,"prereq":"—"},{"name":"Divination","discipline":"Divination","action":"Extended (3)","opposed":false,"range":"Special","sustained":false,"modifier":"Situational: +10 intimate familiarity; +5 physical portion; –10 among many similar targets; +5 within 50m × PR; –10 beyond 2km","effect":"Locates a familiar person or object. On success, if the subject is within PR kilometres, the psyker receives a rough location with precision based on PR.","source":"Core Rulebook p.192","xp":750,"prereq":"WP 40+"},{"name":"Lifting the Veil","discipline":"Divination","action":"Extended (5)","opposed":false,"range":"10m radius × PR","sustained":false,"effect":"Relives psychic impressions from the past of an area or object. The amount of useful information scales with PR.","source":"Core Rulebook p.193","xp":1000,"prereq":"Psychometry, WP 40+"},{"name":"Possibility Shield","discipline":"Divination","action":"Half","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"The psyker and up to PR allies in range gain +10 to one roll each Round. The psyker also gains +5 × PR to all Dodge and Parry Tests.","source":"Core Rulebook p.193","xp":1000,"prereq":"WP 40+"},{"name":"Psychometry","discipline":"Divination","action":"Extended (10)","opposed":false,"range":"Touch","sustained":false,"effect":"Reads psychic traces left on a personal object. The depth of impressions gained scales with PR.","source":"Core Rulebook p.193","xp":500,"prereq":"Augury"},{"name":"Reading","discipline":"Divination","action":"Full","opposed":false,"range":"5m × PR","sustained":true,"effect":"Reads one visible target’s psychic aura. Information gained scales with PR. Only one target can be maintained at a time.","source":"Core Rulebook p.193","xp":500,"prereq":"—"},{"name":"Avenger","discipline":"Codex","action":"Full","opposed":false,"range":"30m","sustained":false,"effect":"Functions like an Astartes heavy-flamer attack for the tabletop rules; its Penetration equals 2 × PR.","source":"Core Rulebook p.194","xp":500,"prereq":"—"},{"name":"Force Dome","discipline":"Codex","action":"Full","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Creates a spherical barrier granting 2 AP × PR against ranged attacks and environmental hazards. It stacks with worn Armour but does not stop melee attacks or movement through the barrier.","source":"Core Rulebook p.194","xp":1500,"prereq":"WP 40+"},{"name":"Gate of Infinity","discipline":"Codex","action":"Extended (3)","opposed":false,"range":"Self","sustained":false,"effect":"Creates a temporary portal with an exit within 10km × PR. Portal width/height are 2m × PR and it remains for PR rounds or until the Librarian passes through. Requires 12 hours recovery before reuse.","source":"Core Rulebook p.194","xp":2000,"prereq":"Rank 5, WP 50+"},{"name":"Iron Arm","discipline":"Codex","action":"Half or Reaction","opposed":false,"range":"Self","sustained":true,"effect":"Grants one extra Reaction each round usable only to Parry, with +3 × PR to that Parry WS Test. The affected arm cannot be used for other purposes while sustained.","source":"Core Rulebook p.194","xp":500,"prereq":"—"},{"name":"Machine Curse","discipline":"Codex","action":"Full","opposed":false,"range":"20m × PR","sustained":false,"effect":"Disables one vehicle for PR rounds or up to PR mechanical devices for the following round. Affected weapons jam and require clearing. Warded machines may resist or be immune at GM discretion.","source":"Core Rulebook p.195","xp":1000,"prereq":"WP 45+"},{"name":"Might of the Ancients","discipline":"Codex","action":"Half","opposed":false,"range":"Self","sustained":true,"effect":"While sustained, all of the Librarian’s melee attacks increase both Damage and Penetration by PR.","source":"Core Rulebook p.195","xp":1000,"prereq":"—"},{"name":"Smite","discipline":"Codex","action":"Half","opposed":false,"range":"10m × PR","sustained":false,"modifier":"Focus Power is modified as a ranged attack for range, lighting and relevant target effects","effect":"Targets one creature without a separate BS test. Deals 1d10 Energy Damage × PR with Penetration PR; creatures within 1m × PR of the target are also affected.","source":"Core Rulebook p.195","xp":500,"prereq":"—"},{"name":"Veil of Time","discipline":"Codex","action":"Half","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Each Round the Librarian receives a personal pool of re-rolls equal to half PR, rounded up. Unused re-rolls expire at the start of the next turn.","source":"Core Rulebook p.195","xp":1500,"prereq":"Rank 3, WP 40+"},{"name":"Vortex of Doom","discipline":"Codex","action":"Full","opposed":false,"range":"10m × PR","sustained":false,"effect":"Creates a 2m-diameter roaming warp vortex. Creatures touched test Agility +0 or suffer 1d10 Energy Damage × PR. First approach within 10m requires WP –20 or 1d5 Corruption. Size and movement vary each round under GM control.","source":"Core Rulebook p.195","xp":2000,"prereq":"Rank 5, WP 50+"},{"name":"Blood Boil","discipline":"Blood Angels","action":"Half","opposed":true,"range":"10m × PR","sustained":false,"effect":"One target suffers 1d10 + (2 × PR) Energy Damage, max +20, ignoring Armour and Toughness. The Librarian gains 1 Fatigue whether resisted or not. A slain target causes an additional nearby damage effect.","source":"Core Rulebook p.196","xp":1500,"prereq":"Rank 3, WP 40+"},{"name":"Blood Lance","discipline":"Blood Angels","action":"Half","opposed":false,"range":"10m × PR","sustained":false,"effect":"A straight-line psychic attack. Each creature crossed suffers 1d10 Rending Damage × PR; Toughness Bonus does not reduce it, while Armour and cover still apply.","source":"Core Rulebook p.196","xp":1000,"prereq":"—"},{"name":"Fear the Darkness","discipline":"Blood Angels","action":"Half","opposed":true,"range":"25m × PR","sustained":true,"effect":"Affects up to PR foes. They treat enemies as Fear 1; existing Fear increases by 1 to max Fear 4. While sustained, targets may test WP at –5 × PR each turn to end the effect.","source":"Core Rulebook p.196","xp":1000,"prereq":"WP 40+"},{"name":"Might of Heroes","discipline":"Blood Angels","action":"Half","opposed":false,"range":"Self","sustained":true,"effect":"Adds +5 × PR Strength, to a maximum of 95, including the corresponding Strength Bonus increase.","source":"Core Rulebook p.196","xp":500,"prereq":"—"},{"name":"Shackle Soul","discipline":"Blood Angels","action":"Full","opposed":true,"range":"10m × PR","sustained":true,"effect":"Prevents one chosen category of action on the target’s next turn: movement, ranged attack, melee attack, or psychic power. Sustaining requires winning a fresh Opposed WP Test each turn.","source":"Core Rulebook p.196","xp":1000,"prereq":"WP 50+"},{"name":"Wings of Sanguinius","discipline":"Blood Angels","action":"Full","opposed":false,"range":"Self","sustained":true,"effect":"Grants the Flyer Trait with Movement equal to PR while sustained.","source":"Core Rulebook p.196","xp":2000,"prereq":"Rank 5, WP 50+"},{"name":"Force Barrier","discipline":"Dark Angels","action":"Full","opposed":false,"range":"Self","sustained":true,"effect":"While stationary, gains 3 AP × PR to all locations. At PR 5+, ranged attacks against the Librarian count as Penetration 0.","source":"Core Rulebook p.197","xp":1500,"prereq":"WP 40+"},{"name":"Hellfire","discipline":"Dark Angels","action":"Half","opposed":false,"range":"50m × PR","sustained":false,"effect":"Choose a point in range; a 2m × PR radius suffers 1d10 Energy Damage × PR. Targets also test Agility +0 or catch fire under the tabletop rules.","source":"Core Rulebook p.197","xp":1000,"prereq":"Rank 3, WP 40+"},{"name":"Mask of Shadows","discipline":"Dark Angels","action":"Half or Reaction","opposed":false,"range":"Self","sustained":true,"effect":"Immune to Telepathy from psykers whose WP is not greater than the Librarian’s, and suffers no Cohesion or WP ill effects from Fear.","source":"Core Rulebook p.197","xp":1000,"prereq":"WP 50+"},{"name":"Mind Worm","discipline":"Dark Angels","action":"Full","opposed":true,"range":"10m × PR","sustained":true,"effect":"One target suffers –5 × PR to WS, BS, S, Ag, Int and Fel, minimum 05. While sustained, the target may attempt a new Opposed WP Test each turn. Also grants +30 Interrogation.","source":"Core Rulebook p.197","xp":1500,"prereq":"Rank 5, WP 50+"},{"name":"True Strike","discipline":"Dark Angels","action":"Half","opposed":false,"range":"Self","sustained":false,"effect":"For PR rounds, a successful melee attack against a psyker inflicts +2 × PR Damage ignoring Armour/Toughness; the victim then tests WP –20 or loses psychic powers for 1 round.","source":"Core Rulebook p.197","xp":500,"prereq":"—"},{"name":"Weaken Resolve","discipline":"Dark Angels","action":"Half","opposed":true,"range":"5m × PR","sustained":true,"effect":"Affects up to PR foes, temporarily reducing WP by –5 × PR, minimum 1. While sustained, targets may re-test Opposed WP each turn using the reduced score.","source":"Core Rulebook p.197","xp":500,"prereq":"—"},{"name":"Fury of the Wolf Spirits","discipline":"Space Wolves","action":"Full","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Summons two spectral wolves. Each makes one automatic-hit melee attack each round unless Dodged/Parried; their game damage scales with PR and damaging hits force Shock rolls.","source":"Core Rulebook p.198","xp":2000,"prereq":"Rank 5, WP 40+"},{"name":"Living Lightning","discipline":"Space Wolves","action":"Full","opposed":false,"range":"30m radius × PR","sustained":true,"effect":"While outdoors under open sky, direct lightning at a target each round. It deals 1d10 Energy Damage × PR with Shocking; Agility +0 halves damage.","source":"Core Rulebook p.198","xp":1000,"prereq":"WP 40+"},{"name":"Storm Caller","discipline":"Space Wolves","action":"Full","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Creates a shrouding storm around the Rune Priest and allies. Ranged attacks made by or against affected allies suffer –5 × PR.","source":"Core Rulebook p.198","xp":500,"prereq":"—"},{"name":"Tempest's Wrath","discipline":"Space Wolves","action":"Full","opposed":false,"range":"150m radius × PR","sustained":true,"effect":"Atmospheric storm hinders flight and ranged attacks. Flyers test Strength at –5 × PR to move and halve movement even on success; ranged penalties scale with PR. Requires outdoor atmosphere.","source":"Core Rulebook p.198","xp":1000,"prereq":"WP 50+"},{"name":"Thunderclap","discipline":"Space Wolves","action":"Full","opposed":false,"range":"10m radius × PR","sustained":false,"effect":"Everyone in range except the Rune Priest suffers 1d5 Impact Damage × PR; only head Armour protects. Damaged targets test Toughness at –5 × PR or are deafened for 1d10 rounds.","source":"Core Rulebook p.198","xp":500,"prereq":"—"},{"name":"Ancestors' Rage","discipline":"Storm Wardens","action":"Full","opposed":false,"range":"1m × PR","sustained":true,"effect":"The Librarian or one target gains PR Exotic Melee Weapon Talents and +5 × PR WS, maximum 95.","source":"Core Rulebook p.199","xp":500,"prereq":"—"},{"name":"Call to Arms","discipline":"Storm Wardens","action":"Extended (2)","opposed":false,"range":"10m radius × PR","sustained":true,"effect":"Summons PR ancestral warriors using the Imperial Guardsman profile. They remain within range and can be used only for combat; defeated spirits and their gear vanish.","source":"Core Rulebook p.199","xp":1500,"prereq":"WP 50+"},{"name":"Crown of Lightning","discipline":"Storm Wardens","action":"Half","opposed":true,"range":"5m × PR","sustained":true,"effect":"One target suffers 1d10 Energy Damage × PR with Shock. If sustained, the target suffers 2d10 Energy Damage on each of the Librarian’s turns.","source":"Core Rulebook p.199","xp":1000,"prereq":"—"},{"name":"Hammer of the Emperor","discipline":"Storm Wardens","action":"Extended (5)","opposed":false,"range":"1km × PR","sustained":false,"modifier":"Cannot be Fettered; outdoor use only","effect":"Creates a 100m × PR radius earthquake-like effect against structures; creatures test Agility –20 to stay standing. Costs 1d5 Fatigue and cannot be used again for 24 hours.","source":"Core Rulebook p.199","xp":2000,"prereq":"Rank 5, WP 60+"},{"name":"Mark of Scorn","discipline":"Storm Wardens","action":"Half","opposed":true,"range":"5m × PR","sustained":true,"effect":"Marks one target. Successful melee attacks against it gain +PR Damage; melee Righteous Fury against it occurs without the normal confirming WS test.","source":"Core Rulebook p.199","xp":500,"prereq":"—"},{"name":"Thunder's Shell","discipline":"Storm Wardens","action":"Half or Reaction","opposed":false,"range":"Self","sustained":true,"effect":"All attacks against the Librarian reduce Penetration by PR, minimum 0. Attacks that normally ignore Armour lose that special bypass and resolve against worn Armour normally.","source":"Core Rulebook p.199","xp":1500,"prereq":"Rank 3, WP 40+"},{"name":"Corax's Ingenuity","discipline":"Raven Guard","action":"Full","opposed":false,"range":"5m radius × PR","sustained":false,"effect":"All Battle-Brothers in range may immediately take a Half Action; for that action, all enemies count as surprised. The Librarian may use this power only once per combat at Fettered level; to use it again in the same combat he must manifest it at Push level.","source":"First Founding — supplied Raven Guard reference p.19","xp":1000,"prereq":"WP 40+"},{"name":"Curse of the Raven","discipline":"Raven Guard","action":"Half","opposed":true,"range":"10m × PR","sustained":true,"effect":"Choose one target. While the power is sustained, every attack made against that target gains additional Penetration equal to the Librarian’s Psy Rating.","source":"First Founding — supplied Raven Guard reference p.19","xp":500,"prereq":"—"},{"name":"The Unkindness of Deliverance","discipline":"Raven Guard","action":"Full","opposed":true,"range":"10m × PR","sustained":false,"effect":"Manifest a swarm of spectral ravens. Either one target suffers 1d10 × PR Rending Damage, or a number of opponents up to PR are Blinded until the end of the Librarian’s next Turn.","source":"First Founding — supplied Raven Guard reference p.19","xp":1000,"prereq":"WP 50+"},{"name":"Fury of the Ancients","discipline":"Ultramarines","action":"Full","opposed":false,"range":"10m × PR","sustained":false,"effect":"Projects a straight-line psychic apparition. Targets touched suffer 1d5 Energy Damage × PR and make a Pinning Test at –5 × PR.","source":"Core Rulebook p.200","xp":1000,"prereq":"WP 40+"},{"name":"Glory of the Emperor","discipline":"Ultramarines","action":"Half","opposed":false,"range":"10m radius × PR","sustained":false,"effect":"Up to PR allies in line of sight recover Wounds equal to PR, but not Critical Damage and never above starting Wounds. Uses per 24 hours are limited by Willpower Bonus.","source":"Core Rulebook p.200","xp":2000,"prereq":"Rank 5, WP 50+"},{"name":"Inspiring Word","discipline":"Ultramarines","action":"Half","opposed":false,"range":"10m radius × PR","sustained":true,"effect":"Up to PR allies in range are immune to Fear while the power is sustained.","source":"Core Rulebook p.200","xp":1000,"prereq":"—"},{"name":"Paragon","discipline":"Ultramarines","action":"Full","opposed":false,"range":"5m radius × PR","sustained":true,"effect":"Up to PR allies may use one of the Librarian’s Characteristics while in range; if their own value is higher they may keep it.","source":"Core Rulebook p.200","xp":500,"prereq":"—"},{"name":"War Cry","discipline":"Ultramarines","action":"Half","opposed":true,"range":"5m × PR","sustained":false,"effect":"Up to PR foes that fail the opposed test cannot use Reactions until the start of the Librarian’s next turn.","source":"Core Rulebook p.200","xp":750,"prereq":"WP 40+"},{"name":"Word of the Emperor","discipline":"Ultramarines","action":"Full","opposed":true,"range":"10m × PR","sustained":false,"effect":"Up to PR targets become Stunned for one Round. Daemonic targets instead a
